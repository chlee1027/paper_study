<svg xmlns="http://www.w3.org/2000/svg" width="820" height="396" viewBox="0 0 820 396" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="2층의 여섯 유닛 중 하나는 국적을, 하나는 세대를, 하나는 집안의 갈래를 나누게 되었다. 입력에는 없던 축이다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">논문 그림 4 가 보여 준 것 — 아무도 알려 주지 않은 특징이 생겼다</text><text x="410" y="52" font-size="12" fill="#7A8590" text-anchor="middle">2 층의 여섯 유닛이 24 명에게 준 가중치를 보면 세 유닛의 뜻이 읽힌다</text><rect x="34" y="76" width="244" height="168" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="156" y="102" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">유닛 1</text><text x="156" y="124" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">국적을 나눈다</text><text x="126" y="160" font-size="11.5" fill="#4E5964" text-anchor="end">영국 12명</text><rect x="142" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="164" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="186" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="208" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="230" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><text x="126" y="190" font-size="11.5" fill="#4E5964" text-anchor="end">이탈리아 12명</text><rect x="142" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="164" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="186" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="208" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="230" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="296" y="76" width="244" height="168" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="418" y="102" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">유닛 2</text><text x="418" y="124" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">세대를 나눈다</text><text x="388" y="160" font-size="11.5" fill="#4E5964" text-anchor="end">1세대</text><rect x="404" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="426" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="448" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="470" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="492" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><text x="388" y="190" font-size="11.5" fill="#4E5964" text-anchor="end">2세대</text><rect x="404" y="183.5" width="5" height="5" rx="2" fill="#7A8590" stroke="#4E5964" stroke-width="1.0"/><rect x="426" y="183.5" width="5" height="5" rx="2" fill="#7A8590" stroke="#4E5964" stroke-width="1.0"/><rect x="448" y="183.5" width="5" height="5" rx="2" fill="#7A8590" stroke="#4E5964" stroke-width="1.0"/><rect x="470" y="183.5" width="5" height="5" rx="2" fill="#7A8590" stroke="#4E5964" stroke-width="1.0"/><rect x="492" y="183.5" width="5" height="5" rx="2" fill="#7A8590" stroke="#4E5964" stroke-width="1.0"/><text x="388" y="220" font-size="11.5" fill="#4E5964" text-anchor="end">3세대</text><rect x="404" y="208.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="426" y="208.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="448" y="208.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="470" y="208.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="492" y="208.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="558" y="76" width="244" height="168" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="680" y="102" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">유닛 6</text><text x="680" y="124" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">집안의 어느 갈래인지를 나눈다</text><text x="650" y="160" font-size="11.5" fill="#4E5964" text-anchor="end">왼쪽 갈래</text><rect x="666" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="688" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="710" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="732" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><rect x="754" y="148.0" width="16" height="16" rx="2" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><text x="650" y="190" font-size="11.5" fill="#4E5964" text-anchor="end">오른쪽 갈래</text><rect x="666" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="688" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="710" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="732" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><rect x="754" y="178.0" width="16" height="16" rx="2" fill="#1C232C" stroke="#4E5964" stroke-width="1.0"/><text x="410" y="262" font-size="11.5" fill="#7A8590" text-anchor="middle">흰 칸은 키우는 가중치, 검은 칸은 누르는 가중치다 (논문은 칸의 넓이로 크기를 나타냈다).</text><rect x="28" y="284" width="764" height="96" rx="8" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="410" y="308" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">국적 · 세대 · 갈래는 입력에도 출력에도 적혀 있지 않다. 사람마다 유닛 하나씩이었을 뿐이다.</text><text x="410" y="332" font-size="12" fill="#4E5964" text-anchor="middle">그런데도 이런 축이 생겼고, 유닛 1 을 빼면 영국 사람과 그에 대응하는 이탈리아 사람의 표현이 서로 닮았다.</text><text x="410" y="356" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">그래서 한쪽 트리에서 배운 것이 다른 쪽으로 넘어간다 — 논문이 제목에 'representations' 를 넣은 자리다.</text></svg>
