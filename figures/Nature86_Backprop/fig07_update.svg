<svg xmlns="http://www.w3.org/2000/svg" width="820" height="436" viewBox="0 0 820 436" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="기울기를 한 훑기 동안 누적했다가 한 번에 가중치를 바꾸고, 식 9의 가속 항으로 이전 걸음의 방향을 이어 간다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="w1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="w2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">기울기를 모았다가 한 번에 바꾼다, 그리고 가속 항을 붙인다</text><rect x="28" y="48" width="360" height="224" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="208" y="72" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">한 번 훑기 (sweep) 안에서</text><rect x="56" y="92" width="96" height="24" rx="4" fill="#FFFFFF" stroke="#7A8590" stroke-width="1.0"/><text x="104" y="108" font-size="11" fill="#4E5964" text-anchor="middle">예 1</text><line x1="152" y1="104" x2="210" y2="140" stroke="#7A8590" stroke-width="1.0" marker-end="url(#w1)" opacity="0.7"/><rect x="56" y="122" width="96" height="24" rx="4" fill="#FFFFFF" stroke="#7A8590" stroke-width="1.0"/><text x="104" y="138" font-size="11" fill="#4E5964" text-anchor="middle">예 2</text><line x1="152" y1="134" x2="210" y2="140" stroke="#7A8590" stroke-width="1.0" marker-end="url(#w1)" opacity="0.7"/><rect x="56" y="152" width="96" height="24" rx="4" fill="#FFFFFF" stroke="#7A8590" stroke-width="1.0"/><text x="104" y="168" font-size="11" fill="#4E5964" text-anchor="middle">예 3</text><line x1="152" y1="164" x2="210" y2="140" stroke="#7A8590" stroke-width="1.0" marker-end="url(#w1)" opacity="0.7"/><text x="104" y="192" font-size="13" fill="#7A8590" text-anchor="middle">…</text><rect x="56" y="202" width="96" height="24" rx="4" fill="#FFFFFF" stroke="#7A8590" stroke-width="1.0"/><text x="104" y="218" font-size="11" fill="#4E5964" text-anchor="middle">예 C</text><line x1="152" y1="214" x2="210" y2="152" stroke="#7A8590" stroke-width="1.0" marker-end="url(#w1)" opacity="0.7"/><rect x="212" y="116" width="68" height="56" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.4"/><text x="246" y="142" font-size="18" fill="#1C232C" text-anchor="middle" font-weight="600">Σ</text><text x="246" y="160" font-size="10.5" fill="#7A8590" text-anchor="middle">누적</text><line x1="280" y1="144" x2="312" y2="144" stroke="#B4552B" stroke-width="1.8" marker-end="url(#w2)"/><rect x="314" y="118" width="58" height="52" rx="8" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="343" y="140" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">Δw</text><text x="343" y="158" font-size="10.5" fill="#B4552B" text-anchor="middle">한 번</text><text x="208" y="244" font-size="11.5" fill="#7A8590" text-anchor="middle">논문이 쓴 방식이다. 예마다 바꾸는 방식도 된다고 적었다.</text><rect x="404" y="48" width="388" height="224" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="598" y="72" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">가속 항 α 가 하는 일</text><ellipse cx="598" cy="168" rx="150" ry="34" fill="none" stroke="#CFD6D3" stroke-width="1"/><ellipse cx="598" cy="168" rx="112" ry="25" fill="none" stroke="#CFD6D3" stroke-width="1"/><ellipse cx="598" cy="168" rx="74" ry="17" fill="none" stroke="#CFD6D3" stroke-width="1"/><ellipse cx="598" cy="168" rx="36" ry="8" fill="none" stroke="#CFD6D3" stroke-width="1"/><circle cx="598" cy="168" r="3.5" fill="#1C232C" stroke="#1C232C" stroke-width="0"/><path d="M 462 118 L 486 152 L 500 122 L 520 154 L 536 126 L 556 156 L 572 132 L 588 160" fill="none" stroke="#C0392B" stroke-width="1.8"/><text x="470" y="104" font-size="11" fill="#C0392B" text-anchor="start">α = 0 — 골짜기를 가로질러 튄다</text><path d="M 462 200 C 500 208 540 196 566 184 C 582 178 592 174 598 170" fill="none" stroke="#1E8449" stroke-width="2.2"/><text x="470" y="218" font-size="11" fill="#1E8449" text-anchor="start">α > 0 — 이전 걸음의 방향이 남아 골짜기를 따라 간다</text><text x="598" y="240" font-size="11.5" fill="#7A8590" text-anchor="middle">타원은 오차의 등고선이고 안쪽으로 갈수록 낮다 — 가운데 점이 가장 낮은 자리다.</text><text x="598" y="258" font-size="11.5" fill="#7A8590" text-anchor="middle">이 그림은 α 의 뜻을 그린 것이고 논문의 측정 결과가 아니다.</text><rect x="28" y="290" width="764" height="130" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="410" y="320" font-size="14" fill="#1C232C" text-anchor="middle">Δw = −ε · ∂E/∂w          (8)</text><text x="410" y="350" font-size="14" fill="#1C232C" text-anchor="middle">Δw(t) = −ε · ∂E/∂w(t) + α · Δw(t−1)          (9)</text><text x="410" y="380" font-size="12" fill="#4E5964" text-anchor="middle">t 는 훑기 한 번마다 1 씩 늘어난다. α 는 0 과 1 사이의 값으로, 지금의 기울기와 앞선 기울기들이 각각 얼마나 들어갈지를 정한다.</text><text x="410" y="404" font-size="11.5" fill="#7A8590" text-anchor="middle">논문의 설정값: 대칭 과제 ε = 0.1, α = 0.9 · 가족 트리 과제 처음 20 훑기 ε = 0.005, α = 0.5, 그 뒤 ε = 0.01, α = 0.9</text></svg>
