<svg xmlns="http://www.w3.org/2000/svg" width="800" height="360" viewBox="0 0 800 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="역방향 통과는 순방향에서 나온 출력값을 다시 쓰므로 순방향의 상태를 저장해 두어야 한다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="t1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="t2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="400" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">순방향이 남긴 것을 역방향이 쓴다</text><rect x="32" y="50" width="352" height="200" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="208" y="74" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">순방향 — 아래에서 위로</text><circle cx="96" cy="150" r="20" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="96" y="155" font-size="13" fill="#2E6B8A" text-anchor="middle">y(i)</text><line x1="116" y1="150" x2="176" y2="150" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#t1)"/><text x="146" y="138" font-size="11" fill="#7A8590" text-anchor="middle">w(j,i)</text><circle cx="200" cy="150" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.5"/><text x="200" y="155" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">j</text><line x1="222" y1="150" x2="282" y2="150" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#t1)"/><circle cx="306" cy="150" r="20" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="306" y="155" font-size="13" fill="#2E6B8A" text-anchor="middle">y(j)</text><text x="208" y="208" font-size="12" fill="#4E5964" text-anchor="middle">유닛 j 의 출력 y(j) 가 정해진다</text><text x="208" y="228" font-size="11.5" fill="#7A8590" text-anchor="middle">이 값을 버리지 않고 들고 있어야 한다</text><rect x="416" y="50" width="352" height="200" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="592" y="74" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">역방향 — 위에서 아래로</text><circle cx="690" cy="150" r="27" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="690" y="155" font-size="10" fill="#B4552B" text-anchor="middle">∂E/∂y(j)</text><line x1="663" y1="150" x2="610" y2="150" stroke="#B4552B" stroke-width="1.6" marker-end="url(#t2)"/><circle cx="586" cy="150" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.5"/><text x="586" y="155" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">j</text><line x1="562" y1="150" x2="505" y2="150" stroke="#B4552B" stroke-width="1.6" marker-end="url(#t2)"/><circle cx="478" cy="150" r="27" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="478" y="155" font-size="10" fill="#B4552B" text-anchor="middle">∂E/∂y(i)</text><text x="586" y="112" font-size="11.5" fill="#B4552B" text-anchor="middle">여기서 y(j)(1−y(j)) 가 필요하다</text><text x="592" y="208" font-size="12" fill="#4E5964" text-anchor="middle">가중치의 몫 ∂E/∂w(j,i) 에는 y(i) 가 필요하다</text><text x="592" y="228" font-size="11.5" fill="#7A8590" text-anchor="middle">둘 다 순방향에서 나온 값이다</text><rect x="32" y="268" width="736" height="76" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="400" y="294" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">그래서 순방향의 출력 상태를 모두 저장해 두어야 역방향을 돌릴 수 있다.</text><text x="400" y="318" font-size="12" fill="#4E5964" text-anchor="middle">논문이 순환망(그림 13)에서 '각 유닛의 출력 상태의 이력을 저장해야 한다'고 적은 이유가 이것이다.</text></svg>
