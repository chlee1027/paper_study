<svg xmlns="http://www.w3.org/2000/svg" width="840" height="548" viewBox="0 0 840 548" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="논문 그림 1의 대칭 검출 망. 입력 6개, 은닉 2개, 출력 1개이며 가운데를 기준으로 가중치가 부호 대칭이다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="s1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="420" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">논문 그림 1 — 대칭을 알아내는 망 (입력 6, 은닉 2, 출력 1)</text><circle cx="420" cy="96" r="25" fill="#F2DED2" stroke="#B4552B" stroke-width="1.8"/><text x="420" y="101" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">6.4</text><text x="420" y="58" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">출력 유닛</text><path d="M 196 242 C 196 130 300 96 394 96" fill="none" stroke="#B4552B" stroke-width="2.2"/><path d="M 644 242 C 644 130 540 96 446 96" fill="none" stroke="#B4552B" stroke-width="2.2"/><text x="182" y="180" font-size="11.5" fill="#B4552B" text-anchor="end">−8.8</text><text x="658" y="180" font-size="11.5" fill="#B4552B" text-anchor="start">−8.8</text><circle cx="420" cy="156" r="17" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="420" y="161" font-size="11.5" fill="#2E6B8A" text-anchor="middle">1</text><line x1="403" y1="156" x2="222" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><line x1="437" y1="156" x2="618" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><text x="312" y="148" font-size="11.5" fill="#4E5964" text-anchor="middle">+14.2</text><text x="528" y="148" font-size="11.5" fill="#4E5964" text-anchor="middle">-14.2</text><circle cx="420" cy="200" r="17" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="420" y="205" font-size="11.5" fill="#2E6B8A" text-anchor="middle">2</text><line x1="403" y1="200" x2="222" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><line x1="437" y1="200" x2="618" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><text x="312" y="192" font-size="11.5" fill="#4E5964" text-anchor="middle">-3.6</text><text x="528" y="192" font-size="11.5" fill="#4E5964" text-anchor="middle">+3.6</text><circle cx="420" cy="244" r="17" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="420" y="249" font-size="11.5" fill="#2E6B8A" text-anchor="middle">3</text><line x1="403" y1="244" x2="222" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><line x1="437" y1="244" x2="618" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><text x="312" y="236" font-size="11.5" fill="#4E5964" text-anchor="middle">+7.2</text><text x="528" y="236" font-size="11.5" fill="#4E5964" text-anchor="middle">-7.1</text><circle cx="420" cy="292" r="17" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="420" y="297" font-size="11.5" fill="#2E6B8A" text-anchor="middle">4</text><line x1="403" y1="292" x2="222" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><line x1="437" y1="292" x2="618" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><text x="312" y="310" font-size="11.5" fill="#4E5964" text-anchor="middle">-7.2</text><text x="528" y="310" font-size="11.5" fill="#4E5964" text-anchor="middle">+7.1</text><circle cx="420" cy="336" r="17" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="420" y="341" font-size="11.5" fill="#2E6B8A" text-anchor="middle">5</text><line x1="403" y1="336" x2="222" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><line x1="437" y1="336" x2="618" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><text x="312" y="354" font-size="11.5" fill="#4E5964" text-anchor="middle">+3.6</text><text x="528" y="354" font-size="11.5" fill="#4E5964" text-anchor="middle">-3.6</text><circle cx="420" cy="380" r="17" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="420" y="385" font-size="11.5" fill="#2E6B8A" text-anchor="middle">6</text><line x1="403" y1="380" x2="222" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><line x1="437" y1="380" x2="618" y2="268" stroke="#4E5964" stroke-width="1.0" opacity="0.55"/><text x="312" y="398" font-size="11.5" fill="#4E5964" text-anchor="middle">-14.2</text><text x="528" y="398" font-size="11.5" fill="#4E5964" text-anchor="middle">+14.2</text><line x1="386" y1="268" x2="454" y2="268" stroke="#7A8590" stroke-width="1.4" stroke-dasharray="7 5"/><text x="462" y="272" font-size="10.5" fill="#7A8590" text-anchor="start">가운데</text><circle cx="196" cy="268" r="26" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.6"/><text x="196" y="273" font-size="11.5" fill="#1C232C" text-anchor="middle">−1.1</text><text x="196" y="314" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">은닉 유닛 L</text><circle cx="644" cy="268" r="26" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.6"/><text x="644" y="273" font-size="11.5" fill="#1C232C" text-anchor="middle">−1.1</text><text x="644" y="314" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">은닉 유닛 R</text><rect x="28" y="420" width="784" height="110" rx="8" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="420" y="444" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">동그라미 안의 수는 편향, 선 위의 수는 가중치다. 가운데를 기준으로 마주 보는 두 가중치는 크기가 같고 부호가 반대다.</text><text x="420" y="466" font-size="12" fill="#4E5964" text-anchor="middle">한쪽의 세 크기는 3.6 : 7.2 : 14.2 로 1 : 2 : 4 다 — 위쪽 절반이 만들 수 있는 여덟 가지 합이 서로 달라진다.</text><text x="420" y="488" font-size="12" fill="#4E5964" text-anchor="middle">출력 유닛의 편향은 +6.4 로 양수다 — 은닉 유닛이 누르지 않으면 켜져 있다. 두 은닉 유닛의 가중치 모양은 같고 부호만 반대다.</text><text x="420" y="512" font-size="12" fill="#7A8590" text-anchor="middle">학습 설정: 64 가지 입력을 1,425 번 훑었고 ε = 0.1, α = 0.9, 처음 가중치는 −0.3 과 0.3 사이의 난수다.</text></svg>
