<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="논문은 오차면의 국소 최소를 한계로 적었고 연결을 더 두면 차원이 늘어 우회로가 생긴다고 서술했다. 수치는 붙어 있지 않다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="400" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">논문이 스스로 적은 가장 뚜렷한 한계 — 오차면에 국소 최소가 있을 수 있다</text><rect x="28" y="50" width="356" height="212" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="206" y="74" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">연결이 과제에 딱 맞을 때</text><path d="M 70 130 C 110 118 118 186 156 186 C 186 186 186 122 216 122 C 256 122 268 214 316 214 C 336 214 346 206 352 200" fill="none" stroke="#4E5964" stroke-width="2.0"/><circle cx="156" cy="186" r="5" fill="#C0392B" stroke="#C0392B" stroke-width="0"/><text x="156" y="210" font-size="11" fill="#C0392B" text-anchor="middle">여기서 멈춘다</text><circle cx="316" cy="214" r="5" fill="#1E8449" stroke="#1E8449" stroke-width="0"/><text x="316" y="238" font-size="11" fill="#1E8449" text-anchor="middle">가장 낮은 자리</text><text x="206" y="252" font-size="11.5" fill="#7A8590" text-anchor="middle">내려가기만 해서는 가운데 둔덕을 넘지 못한다</text><rect x="404" y="50" width="388" height="212" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="598" y="74" font-size="12.5" fill="#1E8449" text-anchor="middle" font-weight="600">연결을 몇 개 더 두면</text><ellipse cx="598" cy="166" rx="150" ry="74" fill="none" stroke="#CFD6D3" stroke-width="1.1"/><path d="M 598 96 L 598 200" fill="none" stroke="#7A8590" stroke-width="14.0" opacity="0.35"/><text x="598" y="92" font-size="11" fill="#7A8590" text-anchor="middle">둔덕</text><circle cx="478" cy="178" r="5" fill="#C0392B" stroke="#C0392B" stroke-width="0"/><text x="470" y="200" font-size="11" fill="#C0392B" text-anchor="middle">지금 자리</text><circle cx="718" cy="178" r="5" fill="#1E8449" stroke="#1E8449" stroke-width="0"/><text x="722" y="200" font-size="11" fill="#1E8449" text-anchor="middle">가장 낮은 자리</text><path d="M 484 176 C 520 176 560 176 590 172" fill="none" stroke="#C0392B" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#m1)"/><path d="M 484 172 C 520 128 560 118 598 118 C 640 118 690 140 712 172" fill="none" stroke="#1E8449" stroke-width="2.2"/><text x="598" y="236" font-size="11.5" fill="#7A8590" text-anchor="middle">차원이 늘면 둔덕을 돌아가는 길이 생긴다</text><rect x="28" y="282" width="764" height="112" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="400" y="306" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">논문의 말: 오차면에 국소 최소가 있을 수 있어 기울기 하강이 전역 최소를 찾는다는 보장이 없다.</text><text x="400" y="330" font-size="12" fill="#4E5964" text-anchor="middle">이어서 적기를, 여러 과제에서 겪어 보니 나쁜 국소 최소에 갇히는 일은 드물었고, 갇힌 것은 과제를 수행할 만큼만 연결이 있는 망뿐이었다.</text><text x="400" y="354" font-size="12" fill="#4E5964" text-anchor="middle">연결을 몇 개 더 두면 가중치 공간에 차원이 늘고, 그 차원이 낮은 차원에서 벽이던 곳을 돌아가는 길이 된다.</text><text x="400" y="380" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">이 문단에는 숫자가 붙어 있지 않다 — 얼마나 드물었는지, 몇 개를 더 두었는지는 논문에 적혀 있지 않다.</text></svg>
