(#f1)"/><text x="270" y="56" font-size="11.5" fill="#2E6B8A" text-anchor="middle">층을 건너뛰는 연결은 된다</text><rect x="28" y="306" width="372" height="74" rx="8" fill="#F4F6F4" stroke="#C0392B" stroke-width="1.3"/><text x="214" y="332" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">금지된 연결 둘</text><text x="214" y="356" font-size="12" fill="#4E5964" text-anchor="middle">같은 층 안의 연결 · 위 층에서 아래 층으로 가는 연결</text><rect x="420" y="306" width="372" height="74" rx="8" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.3"/><text x="606" y="332" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">그래서 방향이 한쪽이다</text><text x="606" y="356" font-size="12" fill="#4E5964" text-anchor="middle">한 번 훑는 것만으로 모든 유닛의 상태가 정해진다</text><text x="410" y="404" font-size="11.5" fill="#7A8590" text-anchor="middle">논문은 입력을 아래, 출력을 위에 두고 그렸다. 여기서는 왼쪽에서 오른쪽으로 옮겨 그렸다.</text></svg>
