<svg xmlns="http://www.w3.org/2000/svg" width="780" height="292" viewBox="0 0 780 292" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="소자 하나는 입력에 가중치를 곱해 선형으로 더한 뒤 로지스틱 함수를 통과시킨다. 편향은 값이 늘 1인 입력의 가중치다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="u1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="390" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">소자 하나 — 선형으로 더하고 매끄러운 함수를 통과시킨다</text><rect x="38" y="70" width="54" height="32" rx="5" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.1"/><text x="65" y="91" font-size="12.5" fill="#2E6B8A" text-anchor="middle">y(1)</text><line x1="92" y1="86" x2="226" y2="140" stroke="#4E5964" stroke-width="1.3" marker-end="url(#u1)" opacity="0.8"/><text x="150" y="78" font-size="11.5" fill="#7A8590" text-anchor="middle">w(j,1)</text><rect x="38" y="112" width="54" height="32" rx="5" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.1"/><text x="65" y="133" font-size="12.5" fill="#2E6B8A" text-anchor="middle">y(2)</text><line x1="92" y1="128" x2="226" y2="140" stroke="#4E5964" stroke-width="1.3" marker-end="url(#u1)" opacity="0.8"/><text x="150" y="120" font-size="11.5" fill="#7A8590" text-anchor="middle">w(j,2)</text><rect x="38" y="154" width="54" height="32" rx="5" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.1"/><text x="65" y="175" font-size="12.5" fill="#2E6B8A" text-anchor="middle">y(3)</text><line x1="92" y1="170" x2="226" y2="140" stroke="#4E5964" stroke-width="1.3" marker-end="url(#u1)" opacity="0.8"/><text x="150" y="186" font-size="11.5" fill="#7A8590" text-anchor="middle">w(j,3)</text><rect x="38" y="196" width="54" height="32" rx="5" fill="#FFFFFF" stroke="#7A8590" stroke-width="1.1"/><text x="65" y="217" font-size="12.5" fill="#7A8590" text-anchor="middle">1</text><line x1="92" y1="212" x2="226" y2="152" stroke="#7A8590" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#u1)" opacity="0.8"/><text x="200" y="192" font-size="11.5" fill="#7A8590" text-anchor="middle">편향</text><text x="65" y="244" font-size="11" fill="#7A8590" text-anchor="middle">항상 1 인 입력</text><rect x="228" y="112" width="96" height="64" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.4"/><text x="276" y="140" font-size="20" fill="#1C232C" text-anchor="middle" font-weight="600">Σ</text><text x="276" y="162" font-size="11" fill="#7A8590" text-anchor="middle">선형 합</text><line x1="324" y1="144" x2="372" y2="144" stroke="#4E5964" stroke-width="1.4" marker-end="url(#u1)"/><text x="348" y="130" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">x(j)</text><rect x="374" y="112" width="96" height="64" rx="8" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.4"/><path d="M 392 166 C 412 166 420 122 448 122" fill="none" stroke="#B4552B" stroke-width="2.0"/><text x="422" y="162" font-size="10.5" fill="#B4552B" text-anchor="middle">로지스틱</text><line x1="470" y1="144" x2="518" y2="144" stroke="#4E5964" stroke-width="1.4" marker-end="url(#u1)"/><circle cx="544" cy="144" r="24" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="544" y="149" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">y(j)</text><text x="520" y="188" font-size="11.5" fill="#7A8590" text-anchor="middle">이 유닛의 출력</text><rect x="568" y="66" width="200" height="108" rx="8" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="660" y="100" font-size="12.5" fill="#1C232C" text-anchor="middle">x(j) = Σ(i) y(i) w(j,i)</text><text x="758" y="100" font-size="11" fill="#7A8590" text-anchor="end">(1)</text><text x="660" y="142" font-size="12.5" fill="#1C232C" text-anchor="middle">y(j) = 1 / (1 + exp(−x(j)))</text><text x="758" y="162" font-size="11" fill="#7A8590" text-anchor="end">(2)</text><text x="668" y="196" font-size="10.5" fill="#7A8590" text-anchor="middle">첨자는 괄호로 적었다</text><text x="668" y="212" font-size="10.5" fill="#7A8590" text-anchor="middle">y(j) 는 유닛 j 의 출력이다</text><text x="390" y="232" font-size="12" fill="#4E5964" text-anchor="middle">편향은 따로 다루지 않는다 — 값이 늘 1 인 입력을 하나 더 두면 그 가중치가 편향이고,</text><text x="390" y="250" font-size="12" fill="#4E5964" text-anchor="middle">부호만 뒤집으면 퍼셉트론의 문턱과 같은 것이다. 나머지 가중치와 똑같이 학습된다.</text><text x="390" y="276" font-size="12" fill="#7A8590" text-anchor="middle" font-style="italic">논문의 말: 식 (1)(2) 를 꼭 써야 하는 것은 아니고 미분이 유계인 함수면 된다.</text></svg>
