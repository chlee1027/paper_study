<svg xmlns="http://www.w3.org/2000/svg" width="880" height="362" viewBox="0 0 880 362" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="역방향 통과는 출력의 오차에서 시작해 활성 함수를 지나 가중치의 몫을 떼고 한 층 아래로 넘기는 네 걸음을 되풀이한다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="430" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">역방향 통과 — 오차의 기울기를 위에서 아래로 넘긴다</text><rect x="48" y="56" width="185" height="128" rx="8" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.4"/><text x="140" y="80" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">① 출력에서 시작</text><text x="140" y="116" font-size="12.5" fill="#1C232C" text-anchor="middle">∂E/∂y(j) = y(j) − d(j)</text><text x="224" y="80" font-size="11" fill="#7A8590" text-anchor="end">(4)</text><text x="140" y="146" font-size="11" fill="#7A8590" text-anchor="middle">낸 답과 정답의 차이다</text><text x="140" y="166" font-size="11" fill="#7A8590" text-anchor="middle"></text><rect x="253" y="56" width="185" height="128" rx="8" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.4"/><text x="345" y="80" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">② 활성 함수를 지난다</text><text x="345" y="116" font-size="12.5" fill="#1C232C" text-anchor="middle">∂E/∂x(j) = ∂E/∂y(j) · y(j)(1 − y(j))</text><text x="429" y="80" font-size="11" fill="#7A8590" text-anchor="end">(5)</text><text x="345" y="146" font-size="11" fill="#7A8590" text-anchor="middle">그림 3 의 기울기가 여기 들어간다</text><text x="345" y="166" font-size="11" fill="#7A8590" text-anchor="middle"></text><rect x="458" y="56" width="185" height="128" rx="8" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.4"/><text x="550" y="80" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">③ 가중치의 몫을 뗀다</text><text x="550" y="116" font-size="12.5" fill="#1C232C" text-anchor="middle">∂E/∂w(j,i) = ∂E/∂x(j) · y(i)</text><text x="634" y="80" font-size="11" fill="#7A8590" text-anchor="end">(6)</text><text x="550" y="146" font-size="11" fill="#7A8590" text-anchor="middle">아래 유닛의 출력을 곱하면 끝이다</text><text x="550" y="166" font-size="11" fill="#7A8590" text-anchor="middle"></text><rect x="663" y="56" width="185" height="128" rx="8" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.4"/><text x="755" y="80" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">④ 한 층 아래로 넘긴다</text><text x="755" y="116" font-size="12.5" fill="#1C232C" text-anchor="middle">∂E/∂y(i) = Σ(j) ∂E/∂x(j) · w(j,i)</text><text x="839" y="80" font-size="11" fill="#7A8590" text-anchor="end">(7)</text><text x="755" y="146" font-size="11" fill="#7A8590" text-anchor="middle">가중치를 곱해 거꾸로 모은다</text><text x="755" y="166" font-size="11" fill="#7A8590" text-anchor="middle"></text><line x1="233" y1="120" x2="251" y2="120" stroke="#B4552B" stroke-width="1.8" marker-end="url(#b1)"/><line x1="438" y1="120" x2="456" y2="120" stroke="#B4552B" stroke-width="1.8" marker-end="url(#b1)"/><line x1="643" y1="120" x2="661" y2="120" stroke="#B4552B" stroke-width="1.8" marker-end="url(#b1)"/><path d="M 140 190 C 140 232 700 232 740 232" fill="none" stroke="#4E5964" stroke-width="1.6" stroke-dasharray="6 4"/><path d="M 740 232 C 780 232 782 200 760 192" fill="none" stroke="#4E5964" stroke-width="1.6" marker-end="url(#b2)"/><text x="430" y="250" font-size="12" fill="#4E5964" text-anchor="middle">④ 로 얻은 ∂E/∂y(i) 가 한 층 아래에서 다시 ① 의 자리에 들어간다 — 층마다 같은 네 걸음을 되풀이한다</text><rect x="48" y="272" width="800" height="74" rx="8" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="448" y="296" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">여기서 곱해지는 것은 모두 그 유닛 옆에 이미 있는 값이다 — y(j), y(i), w(j,i) 뿐이다.</text><text x="448" y="320" font-size="12" fill="#4E5964" text-anchor="middle">그래서 논문은 이 절차를 병렬 하드웨어의 국소 계산으로 구현할 수 있다고 적었다.</text></svg>
