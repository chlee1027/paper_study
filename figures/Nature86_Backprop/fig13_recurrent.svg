<svg xmlns="http://www.w3.org/2000/svg" width="820" height="442" viewBox="0 0 820 442" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="되먹임이 있는 망은 시간 걸음마다 한 층으로 펼치면 층 구조와 같아지고 같은 이름의 가중치는 기울기를 평균 내어 함께 바꾼다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="r1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">논문 그림 5 — 되먹임이 있는 망은 층으로 펼치면 같은 절차가 돈다</text><rect x="28" y="50" width="300" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="178" y="74" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">되먹임이 있는 망</text><circle cx="96" cy="180" r="20" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.4"/><circle cx="178" cy="180" r="20" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.4"/><circle cx="260" cy="180" r="20" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.4"/><path d="M 112 168 C 132 148 142 148 162 168" fill="none" stroke="#4E5964" stroke-width="1.5" marker-end="url(#r1)"/><path d="M 162 192 C 142 212 132 212 112 192" fill="none" stroke="#4E5964" stroke-width="1.5" marker-end="url(#r1)"/><path d="M 194 168 C 214 148 224 148 244 168" fill="none" stroke="#4E5964" stroke-width="1.5" marker-end="url(#r1)"/><path d="M 244 192 C 224 212 214 212 194 192" fill="none" stroke="#4E5964" stroke-width="1.5" marker-end="url(#r1)"/><text x="137" y="142" font-size="11.5" fill="#4E5964" text-anchor="middle">w(2)</text><text x="137" y="228" font-size="11.5" fill="#4E5964" text-anchor="middle">w(1)</text><text x="219" y="142" font-size="11.5" fill="#4E5964" text-anchor="middle">w(4)</text><text x="219" y="228" font-size="11.5" fill="#4E5964" text-anchor="middle">w(3)</text><text x="178" y="268" font-size="11.5" fill="#7A8590" text-anchor="middle">시간이 흐르며 같은 가중치가</text><text x="178" y="286" font-size="11.5" fill="#7A8590" text-anchor="middle">몇 번이고 다시 쓰인다</text><rect x="348" y="50" width="444" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="570" y="74" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">세 번 돌린 것과 같은 층 구조</text><circle cx="430" cy="252" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="530" cy="252" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="630" cy="252" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="730" cy="252" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="430" cy="200" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="530" cy="200" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="630" cy="200" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="730" cy="200" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="430" cy="148" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="530" cy="148" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="630" cy="148" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="730" cy="148" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="430" cy="96" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="530" cy="96" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="630" cy="96" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="730" cy="96" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><line x1="442" y1="246" x2="518" y2="206" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="518" y1="246" x2="442" y2="206" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="542" y1="246" x2="618" y2="206" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="618" y1="246" x2="542" y2="206" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="642" y1="246" x2="718" y2="206" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="718" y1="246" x2="642" y2="206" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><text x="442" y="230.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(1)</text><text x="542" y="230.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(2)</text><text x="642" y="230.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(3)</text><text x="742" y="230.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(4)</text><line x1="442" y1="194" x2="518" y2="154" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="518" y1="194" x2="442" y2="154" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="542" y1="194" x2="618" y2="154" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="618" y1="194" x2="542" y2="154" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="642" y1="194" x2="718" y2="154" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="718" y1="194" x2="642" y2="154" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><text x="442" y="178.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(1)</text><text x="542" y="178.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(2)</text><text x="642" y="178.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(3)</text><text x="742" y="178.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(4)</text><line x1="442" y1="142" x2="518" y2="102" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="518" y1="142" x2="442" y2="102" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="542" y1="142" x2="618" y2="102" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="618" y1="142" x2="542" y2="102" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="642" y1="142" x2="718" y2="102" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><line x1="718" y1="142" x2="642" y2="102" stroke="#4E5964" stroke-width="1.0" marker-end="url(#r1)" opacity="0.7"/><text x="442" y="126.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(1)</text><text x="542" y="126.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(2)</text><text x="642" y="126.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(3)</text><text x="742" y="126.0" font-size="10.5" fill="#B4552B" text-anchor="middle">w(4)</text><text x="570" y="288" font-size="11.5" fill="#7A8590" text-anchor="middle">한 시간 걸음이 한 층이 된다</text><rect x="28" y="318" width="764" height="108" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="410" y="344" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">펼쳐 놓으면 층마다 같은 이름의 가중치가 다시 나타난다. 두 가지를 맞춰 주어야 원래 망과 같아진다.</text><text x="410" y="370" font-size="12" fill="#4E5964" text-anchor="middle">하나. 각 유닛의 출력 상태를 시간마다 저장해 둔다 — 역방향에 그 값이 필요하다 (그림 6).</text><text x="410" y="392" font-size="12" fill="#4E5964" text-anchor="middle">둘. 같은 이름의 가중치들이 받은 ∂E/∂w 를 평균 내고, 그 평균에 비례해 묶음 전체를 함께 바꾼다.</text><text x="410" y="414" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">이 두 가지를 지키면 되먹임 있는 망에도 같은 절차가 그대로 적용된다.</text></svg>
