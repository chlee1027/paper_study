<svg xmlns="http://www.w3.org/2000/svg" width="780" height="316" viewBox="0 0 780 316" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="층이 하나일 때는 출력에 정답이 있어 오차를 바로 알지만 은닉 유닛에는 정답이 주어지지 않는다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="g3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="390" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">퍼셉트론이 남긴 빈칸 — 은닉 유닛에는 정답이 없다</text><rect x="24" y="46" width="352" height="232" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="200" y="70" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">층이 하나일 때</text><circle cx="80" cy="120" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><line x1="95" y1="120" x2="240" y2="165" stroke="#7A8590" stroke-width="1.0" marker-end="url(#g1)" opacity="0.75"/><circle cx="80" cy="165" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><line x1="95" y1="165" x2="240" y2="165" stroke="#7A8590" stroke-width="1.0" marker-end="url(#g1)" opacity="0.75"/><circle cx="80" cy="210" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><line x1="95" y1="210" x2="240" y2="165" stroke="#7A8590" stroke-width="1.0" marker-end="url(#g1)" opacity="0.75"/><circle cx="258" cy="165" r="20" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="258" y="170" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">y</text><rect x="300" y="148" width="56" height="34" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.2"/><text x="328" y="170" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">d</text><text x="328" y="128" font-size="11.5" fill="#B4552B" text-anchor="middle">정답</text><line x1="282" y1="165" x2="296" y2="165" stroke="#B4552B" stroke-width="1.4"/><text x="200" y="250" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">오차를 바로 안다 (y − d)</text><text x="200" y="268" font-size="11.5" fill="#7A8590" text-anchor="middle">그래서 가중치를 어디로 옮길지 나온다</text><rect x="404" y="46" width="352" height="232" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="580" y="70" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">층을 하나 더 쌓으면</text><circle cx="450" cy="120" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><line x1="465" y1="120" x2="552" y2="140" stroke="#7A8590" stroke-width="0.9" opacity="0.6"/><line x1="465" y1="120" x2="552" y2="195" stroke="#7A8590" stroke-width="0.9" opacity="0.6"/><circle cx="450" cy="165" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><line x1="465" y1="165" x2="552" y2="140" stroke="#7A8590" stroke-width="0.9" opacity="0.6"/><line x1="465" y1="165" x2="552" y2="195" stroke="#7A8590" stroke-width="0.9" opacity="0.6"/><circle cx="450" cy="210" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><line x1="465" y1="210" x2="552" y2="140" stroke="#7A8590" stroke-width="0.9" opacity="0.6"/><line x1="465" y1="210" x2="552" y2="195" stroke="#7A8590" stroke-width="0.9" opacity="0.6"/><circle cx="570" cy="140" r="18" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.8"/><text x="570" y="145" font-size="15" fill="#C0392B" text-anchor="middle" font-weight="700">?</text><line x1="588" y1="140" x2="660" y2="165" stroke="#7A8590" stroke-width="1.0" marker-end="url(#g1)" opacity="0.75"/><circle cx="570" cy="195" r="18" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.8"/><text x="570" y="200" font-size="15" fill="#C0392B" text-anchor="middle" font-weight="700">?</text><line x1="588" y1="195" x2="660" y2="165" stroke="#7A8590" stroke-width="1.0" marker-end="url(#g1)" opacity="0.75"/><circle cx="678" cy="165" r="20" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="678" y="170" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">y</text><rect x="712" y="148" width="40" height="34" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.2"/><text x="732" y="170" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">d</text><text x="570" y="108" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">은닉 유닛</text><text x="580" y="250" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">이 자리의 정답이 주어지지 않는다</text><text x="580" y="268" font-size="11.5" fill="#7A8590" text-anchor="middle">1958년의 규칙 (y − d) 를 쓸 수가 없다</text><text x="390" y="298" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">1986년 논문이 채운 것이 바로 이 물음표다 — 오차를 뒤로 보내 층마다 몫을 나눈다</text></svg>
