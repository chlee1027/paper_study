<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="가족 트리를 사람1 관계 사람2 세 낱말짜리 사실로 바꾸고 앞의 둘로 셋째를 맞히게 한다. Colin의 고모는 Margaret과 Jennifer 둘이다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="430" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">논문 그림 2 — 가족 트리를 세 낱말짜리 사실로 바꾼다</text><rect x="95.9" y="63" width="108.19999999999999" height="30" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1"/><text x="150" y="83" font-size="12" fill="#1C232C" text-anchor="middle">Christopher</text><text x="212" y="83" font-size="13" fill="#7A8590" text-anchor="middle">=</text><rect x="234.2" y="63" width="83.6" height="30" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1"/><text x="276" y="83" font-size="12" fill="#1C232C" text-anchor="middle">Penelope</text><rect x="532.4" y="63" width="67.19999999999999" height="30" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1"/><text x="566" y="83" font-size="12" fill="#1C232C" text-anchor="middle">Andrew</text><text x="618" y="83" font-size="13" fill="#7A8590" text-anchor="middle">=</text><rect x="630.1" y="63" width="91.8" height="30" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1"/><text x="676" y="83" font-size="12" fill="#1C232C" text-anchor="middle">Christine</text><rect x="54.2" y="141" width="83.6" height="30" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="96" y="161" font-size="12" fill="#B4552B" text-anchor="middle">Margaret</text><text x="150" y="161" font-size="13" fill="#7A8590" text-anchor="middle">=</text><rect x="162.4" y="141" width="67.19999999999999" height="30" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1"/><text x="196" y="161" font-size="12" fill="#1C232C" text-anchor="middle">Arthur</text><rect x="342.2" y="141" width="83.6" height="30" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1"/><text x="384" y="161" font-size="12" fill="#1C232C" text-anchor="middle">Victoria</text><text x="436" y="161" font-size="13" fill="#7A8590" text-anchor="middle">=</text><rect x="450.5" y="141" width="59.0" height="30" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1"/><text x="480" y="161" font-size="12" fill="#1C232C" text-anchor="middle">James</text><rect x="618.2" y="141" width="83.6" height="30" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="660" y="161" font-size="12" fill="#B4552B" text-anchor="middle">Jennifer</text><text x="714" y="161" font-size="13" fill="#7A8590" text-anchor="middle">=</text><rect x="724.3" y="141" width="75.39999999999999" height="30" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1"/><text x="762" y="161" font-size="12" fill="#1C232C" text-anchor="middle">Charles</text><rect x="374.5" y="219" width="59.0" height="30" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="404" y="239" font-size="12" fill="#2E6B8A" text-anchor="middle">Colin</text><rect x="446.1" y="219" width="91.8" height="30" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1"/><text x="492" y="239" font-size="12" fill="#1C232C" text-anchor="middle">Charlotte</text><line x1="213" y1="93" x2="213" y2="118" stroke="#7A8590" stroke-width="1.2"/><line x1="196" y1="118" x2="384" y2="118" stroke="#7A8590" stroke-width="1.2"/><line x1="196" y1="118" x2="196" y2="141" stroke="#7A8590" stroke-width="1.2"/><line x1="384" y1="118" x2="384" y2="141" stroke="#7A8590" stroke-width="1.2"/><line x1="619" y1="93" x2="619" y2="118" stroke="#7A8590" stroke-width="1.2"/><line x1="480" y1="118" x2="660" y2="118" stroke="#7A8590" stroke-width="1.2"/><line x1="480" y1="118" x2="480" y2="141" stroke="#7A8590" stroke-width="1.2"/><line x1="660" y1="118" x2="660" y2="141" stroke="#7A8590" stroke-width="1.2"/><line x1="437" y1="171" x2="437" y2="196" stroke="#7A8590" stroke-width="1.2"/><line x1="404" y1="196" x2="492" y2="196" stroke="#7A8590" stroke-width="1.2"/><line x1="404" y1="196" x2="404" y2="219" stroke="#7A8590" stroke-width="1.2"/><line x1="492" y1="196" x2="492" y2="219" stroke="#7A8590" stroke-width="1.2"/><rect x="28" y="272" width="380" height="86" rx="8" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="218" y="296" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">사실 하나 = ⟨사람 1⟩ ⟨관계⟩ ⟨사람 2⟩</text><text x="218" y="318" font-size="12" fill="#4E5964" text-anchor="middle">앞의 둘을 입력으로 넣고 셋째를 맞히게 한다</text><text x="218" y="340" font-size="11.5" fill="#7A8590" text-anchor="middle">관계는 열두 가지: 아버지 · 어머니 · 남편 · 아내 · 아들 · 딸 ·</text><text x="218" y="356" font-size="11.5" fill="#7A8590" text-anchor="middle">삼촌 · 고모 · 형제 · 자매 · 조카(남) · 조카(여)</text><rect x="424" y="272" width="412" height="86" rx="8" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.4"/><text x="630" y="296" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">⟨Colin⟩ ⟨has-aunt⟩ ⟨ ? ⟩</text><text x="630" y="320" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">정답이 둘이다 — Margaret 과 Jennifer</text><text x="630" y="344" font-size="11.5" fill="#7A8590" text-anchor="middle">Margaret 은 어머니 쪽 삼촌의 아내, Jennifer 는 아버지의 자매다</text><text x="430" y="384" font-size="11.5" fill="#7A8590" text-anchor="middle">여기 그린 것은 영국 쪽 트리 열두 명이다. 논문은 이름만 다르고 모양이 똑같은 이탈리아 쪽 트리 열두 명을 함께 쓴다 — 사람은 모두 24 명이다.</text></svg>
