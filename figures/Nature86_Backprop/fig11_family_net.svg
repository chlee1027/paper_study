<svg xmlns="http://www.w3.org/2000/svg" width="860" height="414" viewBox="0 0 860 414" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="가족 트리 망은 다섯 층이고 사람 24개와 관계 12개의 입력이 각각 6유닛으로 줄어든 뒤 12, 6을 거쳐 출력 24로 간다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="n1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker></defs><text x="430" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">논문 그림 3 — 다섯 층, 가운데가 좁다</text><rect x="40" y="70" width="118" height="78" rx="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="99" y="100" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">사람 1</text><text x="99" y="122" font-size="12" fill="#1C232C" text-anchor="middle">입력 24</text><rect x="40" y="168" width="118" height="78" rx="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="99" y="198" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">관계</text><text x="99" y="220" font-size="12" fill="#1C232C" text-anchor="middle">입력 12</text><text x="99" y="268" font-size="11" fill="#7A8590" text-anchor="middle">사람마다 · 관계마다</text><text x="99" y="284" font-size="11" fill="#7A8590" text-anchor="middle">유닛 하나씩 (국소 표현)</text><rect x="206" y="70" width="104" height="78" rx="8" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.4"/><text x="258" y="100" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">6 유닛</text><text x="258" y="122" font-size="11.5" fill="#4E5964" text-anchor="middle">사람의 표현</text><rect x="206" y="168" width="104" height="78" rx="8" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.4"/><text x="258" y="198" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">6 유닛</text><text x="258" y="220" font-size="11.5" fill="#4E5964" text-anchor="middle">관계의 표현</text><text x="258" y="268" font-size="11" fill="#B4552B" text-anchor="middle" font-weight="600">여기서 분산 표현이 만들어진다</text><text x="258" y="284" font-size="11" fill="#7A8590" text-anchor="middle">그림 12 가 이 여섯 유닛의 가중치다</text><rect x="358" y="108" width="104" height="100" rx="8" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.4"/><text x="410" y="150" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">12 유닛</text><text x="410" y="172" font-size="11.5" fill="#4E5964" text-anchor="middle">가운데 층</text><rect x="510" y="118" width="104" height="80" rx="8" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.4"/><text x="562" y="152" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">6 유닛</text><text x="562" y="174" font-size="11.5" fill="#4E5964" text-anchor="middle">끝에서 둘째</text><rect x="662" y="90" width="118" height="136" rx="8" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="721" y="146" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">출력 24</text><text x="721" y="168" font-size="11.5" fill="#B4552B" text-anchor="middle">사람 2</text><line x1="158" y1="109" x2="200" y2="109" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#n1)"/><line x1="158" y1="207" x2="200" y2="207" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#n1)"/><line x1="310" y1="109" x2="352" y2="140" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#n1)"/><line x1="310" y1="207" x2="352" y2="176" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#n1)"/><line x1="462" y1="158" x2="504" y2="158" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#n1)"/><line x1="614" y1="158" x2="656" y2="158" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#n1)"/><text x="179" y="60" font-size="11" fill="#7A8590" text-anchor="middle">따로</text><text x="331" y="60" font-size="11" fill="#7A8590" text-anchor="middle">합쳐진다</text><rect x="28" y="306" width="804" height="92" rx="8" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="430" y="330" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">입력과 출력은 사람 한 명에 유닛 하나를 쓴다 — 이름 사이에 아무 관계도 심어 두지 않았다는 뜻이다.</text><text x="430" y="352" font-size="12" fill="#4E5964" text-anchor="middle">104 개 사실 중 100 개로 학습했고 남은 4 개를 맞혔다. 1,500 번 훑었다.</text><text x="430" y="376" font-size="11.5" fill="#7A8590" text-anchor="middle">가중치 감쇠: 가중치를 바꿀 때마다 모든 가중치를 0.2% 줄였다. 출력이 0.8 위 · 0.2 아래면 오차를 0 으로 쳤다.</text></svg>
