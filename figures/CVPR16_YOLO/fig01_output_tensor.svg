<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 250" width="880" height="250"><rect width="880" height="250" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">YOLO 의 출력 7 x 7 x 30: 칸마다 상자 둘(x, y, w, h, 신뢰도)과 부류 20</text><line x1="40.0" y1="44.0" x2="208.0" y2="44.0" stroke="#8a8a8a" stroke-width="1"/><line x1="40.0" y1="44.0" x2="40.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><line x1="40.0" y1="68.0" x2="208.0" y2="68.0" stroke="#8a8a8a" stroke-width="1"/><line x1="64.0" y1="44.0" x2="64.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><line x1="40.0" y1="92.0" x2="208.0" y2="92.0" stroke="#8a8a8a" stroke-width="1"/><line x1="88.0" y1="44.0" x2="88.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><line x1="40.0" y1="116.0" x2="208.0" y2="116.0" stroke="#8a8a8a" stroke-width="1"/><line x1="112.0" y1="44.0" x2="112.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><line x1="40.0" y1="140.0" x2="208.0" y2="140.0" stroke="#8a8a8a" stroke-width="1"/><line x1="136.0" y1="44.0" x2="136.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><line x1="40.0" y1="164.0" x2="208.0" y2="164.0" stroke="#8a8a8a" stroke-width="1"/><line x1="160.0" y1="44.0" x2="160.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><line x1="40.0" y1="188.0" x2="208.0" y2="188.0" stroke="#8a8a8a" stroke-width="1"/><line x1="184.0" y1="44.0" x2="184.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><line x1="40.0" y1="212.0" x2="208.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><line x1="208.0" y1="44.0" x2="208.0" y2="212.0" stroke="#8a8a8a" stroke-width="1"/><rect x="112.0" y="116.0" width="24.0" height="24.0" fill="#fbe9e5" stroke="#c8553d"/><text x="124.0" y="230.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">칸 한 변 448 / 7 = 64 픽셀</text><rect x="260.0" y="90.0" width="90.0" height="40.0" fill="#2f6db3" stroke="none"/><text x="305.0" y="115.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">상자 1 (5)</text><rect x="354.0" y="90.0" width="90.0" height="40.0" fill="#4a9a6a" stroke="none"/><text x="399.0" y="115.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">상자 2 (5)</text><rect x="448.0" y="90.0" width="360.0" height="40.0" fill="#8a8a8a" stroke="none"/><text x="628.0" y="115.0" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">부류 확률 (20)</text><text x="260.0" y="160.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">7 x 7 x 30 = 1,470 출력, 상자 98 개. 칸마다 부류 묶음은 하나다.</text><text x="260.0" y="182.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">그래서 한 이미지의 물체는 칸 수 49 개가 상한이고, 한 칸에 중심이 든 두 물체는 하나만 잡힌다.</text></svg>