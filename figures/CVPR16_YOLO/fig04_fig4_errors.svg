<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 230" width="760" height="230"><rect width="760" height="230" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">그림 4 를 띠로: 부류마다 상위 N 개 검출의 판정 (N = 그 부류의 물체 수)</text><text x="20.0" y="52.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Fast R-CNN</text><rect x="20.0" y="60.0" width="501.2" height="28.0" fill="#4a9a6a" stroke="none"/><text x="270.6" y="79.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">맞음 71.6</text><rect x="521.2" y="60.0" width="60.2" height="28.0" fill="#2f6db3" stroke="none"/><text x="551.3" y="79.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">위치 8.6</text><rect x="581.4" y="60.0" width="30.1" height="28.0" fill="#8a8a8a" stroke="none"/><text x="596.4" y="79.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">4.3</text><rect x="611.5" y="60.0" width="13.3" height="28.0" fill="#bbbbbb" stroke="none"/><rect x="624.8" y="60.0" width="95.2" height="28.0" fill="#c8553d" stroke="none"/><text x="672.4" y="79.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">배경 13.6</text><text x="20.0" y="114.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">YOLO</text><rect x="20.0" y="122.0" width="458.5" height="28.0" fill="#4a9a6a" stroke="none"/><text x="249.2" y="141.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">맞음 65.5</text><rect x="478.5" y="122.0" width="133.0" height="28.0" fill="#2f6db3" stroke="none"/><text x="545.0" y="141.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">위치 19.0</text><rect x="611.5" y="122.0" width="47.2" height="28.0" fill="#8a8a8a" stroke="none"/><text x="635.1" y="141.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">6.75</text><rect x="658.8" y="122.0" width="28.0" height="28.0" fill="#bbbbbb" stroke="none"/><text x="672.8" y="141.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">4.0</text><rect x="686.8" y="122.0" width="33.2" height="28.0" fill="#c8553d" stroke="none"/><text x="703.4" y="141.0" font-size="10.5" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">4.75</text><text x="20.0" y="190.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">위치 오차 19.0 &gt; 나머지 합 15.5 (유사 6.75 + 기타 4.0 + 배경 4.75). 배경 비 13.6 / 4.75 = 2.86 배.</text><text x="20.0" y="212.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">유사 · 기타 · 배경을 합친 오차는 Fast R-CNN 19.8, YOLO 15.5 이고, 위치까지 합치면 28.4 와 34.5 다.</text></svg>