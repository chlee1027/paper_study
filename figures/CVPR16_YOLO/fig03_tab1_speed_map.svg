 YOLO 52.7</text><rect x="540.2" y="113.8" width="10.0" height="10.0" fill="#c8553d" stroke="none"/><text x="553.2" y="114.8" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">YOLO 63.4</text><circle cx="439.9" cy="255.5" r="5" fill="#8a8a8a"/><text x="431.9" y="251.5" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Fastest DPM 30.4</text><circle cx="352.1" cy="159.8" r="5" fill="#8a8a8a"/><text x="346.1" y="151.8" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">R-CNN Minus R 53.5</text><rect x="108.9" y="86.4" width="10.0" height="10.0" fill="#2f6db3" stroke="none"/><text x="121.9" y="87.4" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Fast R-CNN 70.0</text><rect x="361.8" y="73.2" width="10.0" height="10.0" fill="#2f6db3" stroke="none"/><text x="374.8" y="74.2" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Faster R-CNN VGG-16 73.2</text><rect x="452.4" y="119.2" width="10.0" height="10.0" fill="#2f6db3" stroke="none"/><text x="451.4" y="140.2" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Faster R-CNN ZF 62.1</text><rect x="467.1" y="101.3" width="10.0" height="10.0" fill="#c8553d" stroke="none"/><text x="466.1" y="98.3" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">YOLO VGG-16 66.4</text><text x="390.0" y="378.0" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">FPS (로그). 「2 배」 는 다른 학습 데이터끼리 맞댄 값이다: 52.7 / 26.1 = 2.02</text></svg>