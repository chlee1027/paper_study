<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" width="760" height="280"><rect width="760" height="280" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 2: 가장 좋은 Fast R-CNN(71.8)에 다른 모델을 합친다. 단독이 낮아도 합치면 오른다</text><text x="210.0" y="66.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Fast R-CNN (2007 데이터)</text><rect x="220.0" y="50.0" width="334.5" height="12.0" fill="#cfd8e3" stroke="none"/><text x="558.5" y="61.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">단독 66.9</text><rect x="220.0" y="64.0" width="362.0" height="14.0" fill="#8a8a8a" stroke="none"/><text x="586.0" y="76.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">합침 72.4 (+0.6)</text><text x="210.0" y="110.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Fast R-CNN (VGG-M)</text><rect x="220.0" y="94.0" width="296.0" height="12.0" fill="#cfd8e3" stroke="none"/><text x="520.0" y="105.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">단독 59.2</text><rect x="220.0" y="108.0" width="362.0" height="14.0" fill="#8a8a8a" stroke="none"/><text x="586.0" y="120.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">합침 72.4 (+0.6)</text><text x="210.0" y="154.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Fast R-CNN (CaffeNet)</text><rect x="220.0" y="138.0" width="285.5" height="12.0" fill="#cfd8e3" stroke="none"/><text x="509.5" y="149.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">단독 57.1</text><rect x="220.0" y="152.0" width="360.5" height="14.0" fill="#8a8a8a" stroke="none"/><text x="584.5" y="164.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">합침 72.1 (+0.3)</text><text x="210.0" y="198.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">YOLO</text><rect x="220.0" y="182.0" width="317.0" height="12.0" fill="#cfd8e3" stroke="none"/><text x="541.0" y="193.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">단독 63.4</text><rect x="220.0" y="196.0" width="375.0" height="14.0" fill="#c8553d" stroke="none"/><text x="599.0" y="208.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">합침 75.0 (+3.2)</text><text x="20.0" y="266.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Fast R-CNN 값이 표 1 은 70.0, 표 2 는 71.8 이다. 표 2 의 모델 설정은 적혀 있지 않다.</text></svg>