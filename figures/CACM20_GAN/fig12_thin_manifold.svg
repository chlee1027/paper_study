le cx="115.86856034656712" cy="289.7572562274955" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><circle cx="186.5901613604181" cy="314.7769051011287" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><circle cx="290.6931587698035" cy="117.8557214149637" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><circle cx="134.28098895051204" cy="84.84309131818738" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><circle cx="249.6037914289704" cy="312.8468949742444" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><circle cx="160.4788424707603" cy="315.8369759788545" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><circle cx="301.6231060795053" cy="170.3136177737454" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><circle cx="89.66995693551767" cy="224.0785712253585" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><circle cx="145.0512011279264" cy="317.9030146377781" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><circle cx="104.46357151753533" cy="275.400944541232" r="3" fill="#1C232C" stroke="#1C232C" stroke-width="1.2" opacity="0.8"/><text x="200" y="350" font-size="11" fill="#1E8449" text-anchor="middle">초록 원 = 생성기가 낼 수 있는 모든 점 (2 차원 안의 1 차원)</text><rect x="400" y="50" width="400" height="310" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="420" y="80" font-size="12" fill="#1C232C" text-anchor="start">2 차원 평면에서 원 위의 넓이는 0 이다.</text><text x="420" y="103" font-size="12" fill="#1C232C" text-anchor="start">그래서 p_model 을 2 차원 밀도로 보면</text><text x="420" y="126" font-size="12" fill="#1C232C" text-anchor="start">원 밖 어디서나 0 이고, 원 위에서는 정의되지 않는다.</text><text x="420" y="149" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="420" y="172" font-size="12" fill="#1C232C" text-anchor="start">데이터 60 점 중 원 위에 정확히 놓인 점: 0 개</text><text x="420" y="195" font-size="12" fill="#1C232C" text-anchor="start">원까지 거리: 평균 0.061, 최대 0.170</text><text x="420" y="218" font-size="12" fill="#C0392B" text-anchor="start">→ 학습 데이터의 로그 가능도는 −∞</text><text x="420" y="241" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="420" y="264" font-size="12" fill="#1C232C" text-anchor="start">그래도 표본은 데이터에 0.061 만큼 가깝다.</text><text x="420" y="287" font-size="12" fill="#1C232C" text-anchor="start">최대가능도는 이 모델을 배울 수 없지만</text><text x="420" y="310" font-size="12" fill="#1C232C" text-anchor="start">판별기는 가짜와 진짜를 가르는 신호를 준다.</text></svg>
