<svg xmlns="http://www.w3.org/2000/svg" width="820" height="390" viewBox="0 0 820 390" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="생성 모델의 세 갈래"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">밀도를 계산할 수 없을 때의 세 갈래 (논문 2절의 분류를 그림으로 옮긴 것)</text><rect x="20" y="50" width="250" height="290" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="145" y="78" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">1. 밀도가 계산되게 모델을 짠다</text><text x="145" y="100" font-size="12" fill="#4E5964" text-anchor="middle">명시적 · 계산 가능한 밀도</text><text x="145" y="150" font-size="12" fill="#1C232C" text-anchor="middle">예: 완전 가시 믿음망</text><text x="145" y="176" font-size="12" fill="#1C232C" text-anchor="middle">(논문이 Frey 1998 · WaveNet 을 든다)</text><text x="145" y="202" font-size="12" fill="#4E5964" text-anchor="middle"></text><text x="145" y="228" font-size="12" fill="#4E5964" text-anchor="middle">p(x) 를 바로 계산한다</text><text x="145" y="254" font-size="12" fill="#4E5964" text-anchor="middle">대신 모델 모양이 묶인다</text><rect x="283" y="50" width="250" height="290" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="408" y="78" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">2. 밀도의 근사로 배운다</text><text x="408" y="100" font-size="12" fill="#4E5964" text-anchor="middle">명시적 · 근사한 밀도</text><text x="408" y="150" font-size="12" fill="#1C232C" text-anchor="middle">예: VAE (Kingma &amp; Welling)</text><text x="408" y="176" font-size="12" fill="#1C232C" text-anchor="middle">앞 노트에서 읽은 편</text><text x="408" y="202" font-size="12" fill="#4E5964" text-anchor="middle"></text><text x="408" y="228" font-size="12" fill="#4E5964" text-anchor="middle">log p(x) 의 하한을 올린다</text><text x="408" y="254" font-size="12" fill="#4E5964" text-anchor="middle">하한과 참값 사이에 틈이 남는다</text><rect x="546" y="50" width="250" height="290" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="671" y="78" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">3. 밀도를 적지 않는다</text><text x="671" y="100" font-size="12" fill="#4E5964" text-anchor="middle">암묵적 · 표본만 뽑는다</text><text x="671" y="150" font-size="12" fill="#1C232C" text-anchor="middle">GAN 이전: 생성 확률망 (마르코프 사슬)</text><text x="671" y="176" font-size="12" fill="#1C232C" text-anchor="middle">GAN: 한 번에 표본 하나</text><text x="671" y="202" font-size="12" fill="#4E5964" text-anchor="middle"></text><text x="671" y="228" font-size="12" fill="#4E5964" text-anchor="middle">p(x) 를 계산하지 않아도 된다</text><text x="671" y="254" font-size="12" fill="#4E5964" text-anchor="middle">대신 p(x) 를 물을 수 없다</text><text x="410" y="368" font-size="11" fill="#7A8590" text-anchor="middle">논문 2절은 1 · 2 둘 다 「고해상도 이미지를 만드는 데서 연구자들이 아직 만족하지 못한다」고 적고, 그래서 셋째 길이 쓸모 있을 수 있다고 적는다</text></svg>
