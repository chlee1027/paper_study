<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="게임의 값과 젠슨-섀넌 발산"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">D 가 최적일 때 게임의 값 V = −log 4 + 2·JSD — p_data=N(0,1), p_model=N(m,1) (내가 유도하고 계산한 것)</text><line x1="80" y1="320.0" x2="520" y2="320.0" stroke="#CFD6D3" stroke-width="1"/><text x="72" y="324.0" font-size="11" fill="#7A8590" text-anchor="end">-1.5</text><line x1="80" y1="241.875" x2="520" y2="241.875" stroke="#CFD6D3" stroke-width="1"/><text x="72" y="245.875" font-size="11" fill="#7A8590" text-anchor="end">-1.0</text><line x1="80" y1="163.75" x2="520" y2="163.75" stroke="#CFD6D3" stroke-width="1"/><text x="72" y="167.75" font-size="11" fill="#7A8590" text-anchor="end">-0.5</text><line x1="80" y1="85.625" x2="520" y2="85.625" stroke="#CFD6D3" stroke-width="1"/><text x="72" y="89.625" font-size="11" fill="#7A8590" text-anchor="end">0.0</text><text x="80.0" y="338" font-size="11" fill="#7A8590" text-anchor="middle">0</text><text x="168.0" y="338" font-size="11" fill="#7A8590" text-anchor="middle">1</text><text x="256.0" y="338" font-size="11" fill="#7A8590" text-anchor="middle">2</text><text x="344.0" y="338" font-size="11" fill="#7A8590" text-anchor="middle">3</text><text x="432.0" y="338" font-size="11" fill="#7A8590" text-anchor="middle">4</text><text x="520.0" y="338" font-size="11" fill="#7A8590" text-anchor="middle">5</text><text x="300.0" y="360" font-size="12" fill="#4E5964" text-anchor="middle">m (모델 평균이 데이터 평균에서 떨어진 거리)</text><line x1="80" y1="302.2334939249829" x2="520" y2="302.2334939249829" stroke="#1E8449" stroke-width="1.2" stroke-dasharray="4 3"/><text x="516" y="318.2334939249829" font-size="11" fill="#1E8449" text-anchor="end">−log 4 = -1.386 (p_model = p_data)</text><line x1="80" y1="85.625" x2="520" y2="85.625" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4 3"/><text x="516" y="79.625" font-size="11" fill="#C0392B" text-anchor="end">0 = −log 4 + 2·log 2 (겹침이 없을 때의 끝)</text><path d="M80.0,302.2 L124.0,292.8 L168.0,267.4 L212.0,233.1 L256.0,197.0 L344.0,137.6 L432.0,104.5 L520.0,91.0" fill="none" stroke="#2A78D6" stroke-width="2.4"/><circle cx="80.0" cy="302.2334939249819" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="124.0" cy="292.7612125122177" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="168.0" cy="267.4142807422515" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="212.0" cy="233.1176091688154" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="256.0" cy="196.97386256659718" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="344.0" cy="137.61558563705316" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="432.0" cy="104.50843338221193" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="520.0" cy="91.00143849342666" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><rect x="550" y="70" width="250" height="250" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="565" y="94" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">m 별 JSD (nat) 와 V</text><text x="565" y="122" font-size="12" fill="#1C232C" text-anchor="start">m = 0:  JSD 0.000,  V -1.386</text><text x="565" y="146" font-size="12" fill="#1C232C" text-anchor="start">m = 1:  JSD 0.111,  V -1.163</text><text x="565" y="170" font-size="12" fill="#1C232C" text-anchor="start">m = 2:  JSD 0.337,  V -0.713</text><text x="565" y="194" font-size="12" fill="#1C232C" text-anchor="start">m = 3:  JSD 0.527,  V -0.333</text><text x="565" y="218" font-size="12" fill="#1C232C" text-anchor="start">m = 5:  JSD 0.676,  V -0.034</text><text x="565" y="256" font-size="11" fill="#4E5964" text-anchor="start">JSD 의 위 끝은 log 2 = 0.693.</text><text x="565" y="276" font-size="11" fill="#4E5964" text-anchor="start">m 이 5 이면 이미 그 98% 다 —</text><text x="565" y="296" font-size="11" fill="#4E5964" text-anchor="start">더 멀어져도 V 가 거의 안 바뀐다</text></svg>
