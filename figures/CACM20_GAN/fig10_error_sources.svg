<svg xmlns="http://www.w3.org/2000/svg" width="820" height="350" viewBox="0 0 820 350" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="생성 모델별 오차 출처 표"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">논문 3절 — GAN 에 남는 오차는 둘뿐이고 다른 방법들은 그 위에 근사를 더한다고 적는다</text><rect x="20" y="55" width="780" height="36" rx="4" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1.2"/><text x="400" y="78" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">GAN</text><text x="560" y="78" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">마르코프 사슬 쓰는 모델</text><text x="720" y="78" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">하한을 쓰는 모델</text><rect x="20" y="91" width="780" height="44" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="118" font-size="12" fill="#1C232C" text-anchor="start">통계 오차 (유한한 학습 데이터)</text><text x="400" y="118" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">있다</text><text x="560" y="118" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">있다</text><text x="720" y="118" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">있다</text><rect x="20" y="135" width="780" height="44" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="162" font-size="12" fill="#1C232C" text-anchor="start">학습이 최적 파라미터에 못 닿음</text><text x="400" y="162" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">있다</text><text x="560" y="162" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">있다</text><text x="720" y="162" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">있다</text><rect x="20" y="179" width="780" height="44" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="206" font-size="12" fill="#1C232C" text-anchor="start">마르코프 사슬 근사</text><text x="400" y="206" font-size="12" fill="#7A8590" text-anchor="middle">—</text><text x="560" y="206" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">있다</text><text x="720" y="206" font-size="12" fill="#7A8590" text-anchor="middle">—</text><rect x="20" y="223" width="780" height="44" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="250" font-size="12" fill="#1C232C" text-anchor="start">참 비용 대신 하한을 최적화</text><text x="400" y="250" font-size="12" fill="#7A8590" text-anchor="middle">—</text><text x="560" y="250" font-size="12" fill="#7A8590" text-anchor="middle">—</text><text x="720" y="250" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">있다</text><text x="410" y="292" font-size="11" fill="#7A8590" text-anchor="middle">논문은 셋째 · 넷째 열의 방법 이름을 적지 않는다. 앞 노트의 VAE 가 넷째 열(하한), GAN 앞의 생성 확률망이 셋째 열에 든다고 내가 맞췄다</text><text x="410" y="314" font-size="11" fill="#4E5964" text-anchor="middle">그리고 「GAN 의 두 오차」 가운데 둘째가 실제로는 가장 크다 — 4절이 「자주 수렴에 실패한다」고 적는 것이 그 칸이다</text><text x="410" y="336" font-size="11" fill="#7A8590" text-anchor="middle">이 표는 논문의 문장을 옮긴 것이다. 오차의 크기를 잰 값은 논문에 없다</text></svg>
