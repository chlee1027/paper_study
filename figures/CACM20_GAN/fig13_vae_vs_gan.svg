<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="VAE 와 GAN 비교 표"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">VAE(2014) 와 GAN — 둘 다 z ~ 단순한 분포 → 신경망 → x 인데, 배우는 방법이 다르다</text><rect x="20" y="55" width="780" height="36" rx="4" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="78" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold"></text><text x="365.0" y="78" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">VAE (Kingma &amp; Welling 2014)</text><text x="655.0" y="78" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">GAN (이 논문)</text><rect x="20" y="91" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="115" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">모델이 주는 것</text><text x="365.0" y="115" font-size="12" fill="#1C232C" text-anchor="middle">p(x) 의 하한 L(x), 표본</text><text x="655.0" y="115" font-size="12" fill="#1C232C" text-anchor="middle">표본만</text><rect x="20" y="129" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">p(x|z) 를 정하나</text><text x="365.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">정한다 (픽셀별 베르누이 · 가우스)</text><text x="655.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">정하지 않는다 (G 는 결정적 함수)</text><rect x="20" y="167" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="191" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">x → z 부호기</text><text x="365.0" y="191" font-size="12" fill="#1C232C" text-anchor="middle">있다 (q(z|x))</text><text x="655.0" y="191" font-size="12" fill="#1C232C" text-anchor="middle">원 GAN 에는 없다</text><rect x="20" y="205" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="229" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">학습 목표</text><text x="365.0" y="229" font-size="12" fill="#1C232C" text-anchor="middle">하한 L 을 최대화 (최적화)</text><text x="655.0" y="229" font-size="12" fill="#1C232C" text-anchor="middle">두 사람 게임의 평형 (게임)</text><rect x="20" y="243" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">「비슷하다」를 정하는 것</text><text x="365.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle">사람이 고른 가능도</text><text x="655.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle">배우는 판별기</text><rect x="20" y="281" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">남는 근사</text><text x="365.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle">하한과 log p(x) 의 틈</text><text x="655.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle">통계 오차 + 수렴 실패</text><rect x="20" y="319" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">평가</text><text x="365.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle">하한 · 추정 주변 가능도</text><text x="655.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle">가능도를 못 잰다 — 평가가 따로 연구 주제</text><rect x="20" y="357" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">이산 데이터</text><text x="365.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle">복호기는 이산도 된다</text><text x="655.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle">어렵다 (G 출력을 거쳐 기울기를 보내야 한다)</text><rect x="20" y="395" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="419" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">얇은 다양체 모델</text><text x="365.0" y="419" font-size="12" fill="#1C232C" text-anchor="middle">가능도가 −∞ 라 못 배운다</text><text x="655.0" y="419" font-size="12" fill="#1C232C" text-anchor="middle">배울 수 있다</text><text x="410" y="458" font-size="11" fill="#7A8590" text-anchor="middle">VAE 칸은 앞 노트에서 읽은 VAE 논문, GAN 칸은 이 논문의 문장에서 옮겼다. 두 논문 모두 서로를 같은 표본 품질 지표로 재지 않는다</text></svg>
