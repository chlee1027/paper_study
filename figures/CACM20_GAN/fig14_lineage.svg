<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보와 이상 탐지로 가는 곁가지"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 앞 편의 한계를 받아 다음 편에 넘긴다</text><rect x="25" y="60" width="170" height="60" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="110" y="85" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">VAE 2014 (읽음)</text><text x="110" y="105" font-size="11" fill="#4E5964" text-anchor="middle">가능도를 정해야 한다</text><line x1="197" y1="90" x2="223" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="225" y="60" width="170" height="60" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="310" y="85" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">GAN 2014 / 2020</text><text x="310" y="105" font-size="11" fill="#4E5964" text-anchor="middle">가능도 없이 게임으로</text><line x1="397" y1="90" x2="423" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="425" y="60" width="170" height="60" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="510" y="85" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">DDPM 2020 (읽음)</text><text x="510" y="105" font-size="11" fill="#4E5964" text-anchor="middle">다시 하한, 층을 많이</text><line x1="597" y1="90" x2="623" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="625" y="60" width="170" height="60" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="710" y="85" font-size="13" fill="#4E5964" text-anchor="middle" font-weight="bold">RNN (로드맵 다음)</text><text x="710" y="105" font-size="11" fill="#4E5964" text-anchor="middle">순서가 있는 데이터</text><text x="225" y="148" font-size="11" fill="#1C232C" text-anchor="middle">받은 것: 복호기의 픽셀별</text><text x="225" y="164" font-size="11" fill="#1C232C" text-anchor="middle">가능도가 「비슷함」을 정한다</text><text x="425" y="148" font-size="11" fill="#1C232C" text-anchor="middle">넘긴 것: 학습이 수렴하지 않고</text><text x="425" y="164" font-size="11" fill="#1C232C" text-anchor="middle">가능도로 평가할 수 없다</text><text x="625" y="148" font-size="11" fill="#1C232C" text-anchor="middle">로드맵의 생성 모델 칸이</text><text x="625" y="164" font-size="11" fill="#1C232C" text-anchor="middle">여기서 끝난다</text><rect x="25" y="200" width="770" height="160" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="45" y="226" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">곁가지 — 이상 탐지로 가는 길 (논문은 이 쓰임을 적지 않는다. 내가 잇는 자리다)</text><text x="45" y="252" font-size="12" fill="#1C232C" text-anchor="start">GAN 은 p(x) 도, x 를 z 로 돌리는 부호기도 주지 않는다. 그래서 「이 입력이 얼마나 정상다운가」를 바로 물을 수 없다</text><text x="45" y="276" font-size="12" fill="#1C232C" text-anchor="start">남는 길 둘: 학습이 끝난 판별기의 출력 D(x) 를 점수로 쓰거나, G(z) 가 x 에 가장 가까워지는 z 를 찾아 그 거리를 점수로 쓴다</text><text x="45" y="300" font-size="12" fill="#1C232C" text-anchor="start">첫째는 조심할 것이 있다 — 평형에서는 D 가 어디서나 ½ 이 되는 것이 목표라서, 잘 배운 D 일수록 점수로 쓸 신호가 줄 수 있다</text><text x="45" y="324" font-size="12" fill="#4E5964" text-anchor="start">둘째는 입력마다 최적화를 한 번 돌려야 한다 — VAE 의 부호기가 한 번의 계산으로 하던 일이다</text><text x="45" y="348" font-size="11" fill="#7A8590" text-anchor="start">잴 방법은 이 노트 23절 D 에 적었다</text></svg>
