<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="논문 그림 6 의 연도와 출처 맞추기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">논문 그림 6 — 2014 · 2015 · 2016 · 2017 의 얼굴 표본 넷. 캡션의 「respectively」 순서가 해의 순서와 다르다</text><rect x="30" y="60" width="170" height="150" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="115" y="110" font-size="24" fill="#B4552B" text-anchor="middle" font-weight="bold">2014</text><text x="115" y="140" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">원 GAN</text><text x="115" y="165" font-size="12" fill="#4E5964" text-anchor="middle">Goodfellow 외</text><text x="115" y="185" font-size="10" fill="#7A8590" text-anchor="middle">참고 문헌 13, NIPS 2014</text><line x1="202" y1="135" x2="223" y2="135" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="225" y="60" width="170" height="150" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="310" y="110" font-size="24" fill="#B4552B" text-anchor="middle" font-weight="bold">2015</text><text x="310" y="140" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">DCGAN</text><text x="310" y="165" font-size="12" fill="#4E5964" text-anchor="middle">Radford 외</text><text x="310" y="185" font-size="10" fill="#7A8590" text-anchor="middle">참고 문헌 27, arXiv 2015</text><line x1="397" y1="135" x2="418" y2="135" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="420" y="60" width="170" height="150" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="505" y="110" font-size="24" fill="#B4552B" text-anchor="middle" font-weight="bold">2016</text><text x="505" y="140" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">CoGAN</text><text x="505" y="165" font-size="12" fill="#4E5964" text-anchor="middle">Liu &amp; Tuzel</text><text x="505" y="185" font-size="10" fill="#7A8590" text-anchor="middle">참고 문헌 17, NIPS 2016</text><line x1="592" y1="135" x2="613" y2="135" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="615" y="60" width="170" height="150" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="700" y="110" font-size="24" fill="#B4552B" text-anchor="middle" font-weight="bold">2017</text><text x="700" y="140" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">Progressive GAN</text><text x="700" y="165" font-size="12" fill="#4E5964" text-anchor="middle">Karras 외</text><text x="700" y="185" font-size="10" fill="#7A8590" text-anchor="middle">참고 문헌 14, 2017</text><rect x="30" y="230" width="760" height="80" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="50" y="254" font-size="12" fill="#1C232C" text-anchor="start">캡션: 「결과는 각각(respectively) Goodfellow, Karras 외, Liu and Tuzel, Radford 외에서 왔다」 — 이름의 알파벳 순서다</text><text x="50" y="276" font-size="12" fill="#1C232C" text-anchor="start">참고 문헌의 연도로 맞추면 2014 = Goodfellow, 2015 = Radford, 2016 = Liu &amp; Tuzel, 2017 = Karras 다 (위 칸은 이 순서로 놓았다)</text><text x="50" y="298" font-size="12" fill="#4E5964" text-anchor="start">캡션을 글자 그대로 읽으면 2015 가 Karras(2017 논문)가 되어 어긋난다. 연도로 맞춘 것은 내 읽기다</text></svg>
