<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="이론의 가정과 실제 학습의 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">논문 4절의 두 결과가 성립하는 자리와 실제로 학습하는 자리 사이의 거리</text><rect x="20" y="55" width="780" height="36" rx="4" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1.2"/><text x="95.0" y="78" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold"></text><text x="325.0" y="78" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="bold">이론 (원 논문의 두 결과)</text><text x="640.0" y="78" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="bold">실제</text><rect x="20" y="91" width="780" height="42" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="95.0" y="117" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">움직이는 것</text><text x="325.0" y="117" font-size="12" fill="#1C232C" text-anchor="middle">밀도 함수 p_model 자체</text><text x="640.0" y="117" font-size="12" fill="#1C232C" text-anchor="middle">생성기 신경망의 파라미터 θ(G)</text><rect x="20" y="133" width="780" height="42" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="95.0" y="159" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">함수의 범위</text><text x="325.0" y="159" font-size="12" fill="#1C232C" text-anchor="middle">모든 밀도 함수 · 모든 판별기</text><text x="640.0" y="159" font-size="12" fill="#1C232C" text-anchor="middle">유한한 수의 파라미터, 유한한 비트</text><rect x="20" y="175" width="780" height="42" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="95.0" y="201" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">판별기</text><text x="325.0" y="201" font-size="12" fill="#1C232C" text-anchor="middle">안쪽 고리에서 수렴할 때까지</text><text x="640.0" y="201" font-size="12" fill="#1C232C" text-anchor="middle">한 걸음씩, 최적이 아니다</text><rect x="20" y="217" width="780" height="42" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="95.0" y="243" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">생성기 비용</text><text x="325.0" y="243" font-size="12" fill="#1C232C" text-anchor="middle">M-GAN (J(G) = −J(D))</text><text x="640.0" y="243" font-size="12" fill="#1C232C" text-anchor="middle">대개 NS-GAN (라벨을 뒤집는다)</text><rect x="20" y="259" width="780" height="42" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="95.0" y="285" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">갱신</text><text x="325.0" y="285" font-size="12" fill="#1C232C" text-anchor="middle">D 를 끝까지, 그다음 G 한 걸음</text><text x="640.0" y="285" font-size="12" fill="#1C232C" text-anchor="middle">두 쪽을 동시에 한 걸음씩</text><rect x="20" y="301" width="780" height="42" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="95.0" y="327" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">결과</text><text x="325.0" y="327" font-size="12" fill="#1C232C" text-anchor="middle">평형은 p_model = p_data 하나, 수렴한다</text><text x="640.0" y="327" font-size="12" fill="#1C232C" text-anchor="middle">논문: 「자주 수렴에 실패한다」</text><text x="410" y="360" font-size="11" fill="#7A8590" text-anchor="middle">첫 두 줄의 거리는 논문이 스스로 적는다. 셋째 · 넷째 줄은 논문 3절의 설명을 4절의 결과 옆에 놓아 내가 맞춘 것이다</text></svg>
