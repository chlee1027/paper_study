<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="판별기와 생성기의 학습 경로"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">논문 그림 3 — 판별기는 두 길에서 입력을 받고, 생성기는 판별기를 거쳐 온 기울기로 배운다</text><rect x="60" y="294" width="200" height="52" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="160" y="325" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">데이터셋에서 무작위 번호</text><line x1="160" y1="292" x2="160" y2="268" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="60" y="214" width="200" height="52" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="160" y="245" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">데이터셋</text><line x1="160" y1="212" x2="160" y2="188" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="60" y="134" width="200" height="52" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="160" y="165" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">진짜 데이터 x</text><line x1="160" y1="132" x2="160" y2="108" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="60" y="54" width="200" height="52" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="160" y="78" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">판별기 D(x)</text><text x="160" y="96" font-size="11" fill="#4E5964" text-anchor="middle">목표: 1 (진짜)</text><rect x="430" y="294" width="200" height="52" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.5"/><text x="530" y="318" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">잠재 변수 z ~ p(z)</text><text x="530" y="336" font-size="11" fill="#4E5964" text-anchor="middle">가우스나 초입방체 균등</text><line x1="530" y1="292" x2="530" y2="268" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="430" y="214" width="200" height="52" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.5"/><text x="530" y="238" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">생성기 G(z)</text><text x="530" y="256" font-size="11" fill="#4E5964" text-anchor="middle">신경망</text><line x1="530" y1="212" x2="530" y2="188" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="430" y="134" width="200" height="52" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.5"/><text x="530" y="165" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">가짜 데이터 G(z)</text><line x1="530" y1="132" x2="530" y2="108" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="430" y="54" width="200" height="52" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.5"/><text x="530" y="78" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">판별기 D(G(z))</text><text x="530" y="96" font-size="11" fill="#4E5964" text-anchor="middle">판별기 목표: 0 / 생성기 목표: 1</text><path d="M640,86 C690,90 690,250 640,240" fill="none" stroke="#1E8449" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ao)"/><text x="700" y="170" font-size="12" fill="#1E8449" text-anchor="start" font-weight="bold">역전파:</text><text x="700" y="188" font-size="11" fill="#1E8449" text-anchor="start">D 의 입력에 대한</text><text x="700" y="204" font-size="11" fill="#1E8449" text-anchor="start">기울기가 G 로</text><text x="160" y="372" font-size="11" fill="#7A8590" text-anchor="middle">두 판별기는 같은 망 하나다 — 두 길의 입력을 번갈아 받는다</text><text x="530" y="372" font-size="11" fill="#7A8590" text-anchor="middle">「가짜」 부류의 분포가 G 가 배울수록 계속 바뀐다</text></svg>
