<svg xmlns="http://www.w3.org/2000/svg" width="840" height="320" viewBox="0 0 840 320" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="특징 흔들기 잡음의 크기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/></marker></defs><text x="420.0" y="28.0" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">특징 흔들기 — 잡음 노름은 특징 노름의 몇 배인가 (식 3, 내가 계산)</text><line x1="80.0" y1="250.0" x2="800.0" y2="250.0" stroke="#CFD6D3" stroke-width="1"/><text x="73.0" y="254.0" font-size="10" fill="#7A8590" text-anchor="end">0</text><line x1="80.0" y1="201.5" x2="800.0" y2="201.5" stroke="#CFD6D3" stroke-width="1"/><text x="73.0" y="205.5" font-size="10" fill="#7A8590" text-anchor="end">0.5</text><line x1="80.0" y1="153.0" x2="800.0" y2="153.0" stroke="#CFD6D3" stroke-width="1"/><text x="73.0" y="157.0" font-size="10" fill="#7A8590" text-anchor="end">1</text><line x1="80.0" y1="104.5" x2="800.0" y2="104.5" stroke="#CFD6D3" stroke-width="1"/><text x="73.0" y="108.5" font-size="10" fill="#7A8590" text-anchor="end">1.5</text><line x1="80.0" y1="56.0" x2="800.0" y2="56.0" stroke="#CFD6D3" stroke-width="1"/><text x="73.0" y="60.0" font-size="10" fill="#7A8590" text-anchor="end">2</text><line x1="80.0" y1="250.0" x2="800.0" y2="250.0" stroke="#4E5964" stroke-width="1.2"/><line x1="80.0" y1="56.0" x2="80.0" y2="250.0" stroke="#4E5964" stroke-width="1.2"/><text x="36.0" y="153.0" font-size="11" fill="#4E5964" text-anchor="middle" transform="rotate(-90 36.0 153.0)">E||D|| / ||f||</text><line x1="80.0" y1="153.0" x2="800.0" y2="153.0" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="5,4"/><text x="86.0" y="147.0" font-size="10" fill="#C0392B" text-anchor="start">잡음 노름 = 특징 노름</text><rect x="150.0" y="219.7" width="80.0" height="30.3" fill="#D8E7EE"/><text x="190.0" y="213.7" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">0.312 배</text><text x="190.0" y="268.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">α = 5</text><text x="190.0" y="286.0" font-size="10" fill="#4E5964" text-anchor="middle">검출 96.1 · 위치 96.7</text><rect x="310.0" y="189.4" width="80.0" height="60.6" fill="#D8E7EE"/><text x="350.0" y="183.4" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">0.625 배</text><text x="350.0" y="268.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">α = 10</text><text x="350.0" y="286.0" font-size="10" fill="#4E5964" text-anchor="middle">검출 96.4 · 위치 96.7</text><rect x="470.0" y="128.8" width="80.0" height="121.2" fill="#2E6B8A"/><text x="510.0" y="122.8" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">1.250 배</text><text x="510.0" y="268.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">α = 20</text><text x="510.0" y="286.0" font-size="10" fill="#4E5964" text-anchor="middle">검출 96.5 · 위치 96.8</text><rect x="630.0" y="68.1" width="80.0" height="181.9" fill="#D8E7EE"/><text x="670.0" y="62.1" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">1.875 배</text><text x="670.0" y="268.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">α = 30</text><text x="670.0" y="286.0" font-size="10" fill="#4E5964" text-anchor="middle">검출 95.7 · 위치 96.6</text><text x="420.0" y="312.0" font-size="11" fill="#4E5964" text-anchor="middle">σ = α ||f|| / C 이므로 C 차원 잡음의 노름 기댓값은 σ√C = α ||f|| / √C. C = 256 으로 셈(C = 272 면 1.213 배)</text></svg>
