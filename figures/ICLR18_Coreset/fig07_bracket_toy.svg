<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="알고리즘 2 구간의 반례"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="380.0" y="26.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">알고리즘 2 의 구간이 깨지는 장난감 (점 5 개, s0 = {0}, b = 1, 논문 자료 아님)</text><line x1="60.0" y1="90.0" x2="700.0" y2="90.0" stroke="#4E5964" stroke-width="1.4"/><circle cx="60.0" cy="90.0" r="5" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="66.4" cy="90.0" r="5" fill="#1C232C" stroke="#1C232C" stroke-width="1.2"/><circle cx="188.0" cy="90.0" r="5" fill="#1C232C" stroke="#1C232C" stroke-width="1.2"/><circle cx="194.4" cy="90.0" r="5" fill="#1C232C" stroke="#1C232C" stroke-width="1.2"/><circle cx="700.0" cy="90.0" r="5" fill="#1C232C" stroke="#1C232C" stroke-width="1.2"/><text x="60.0" y="78.0" font-size="11" fill="#B4552B" text-anchor="middle" font-weight="600">s0</text><text x="700.0" y="78.0" font-size="11" fill="#1C232C" text-anchor="middle">100</text><text x="191.2" y="78.0" font-size="11" fill="#1C232C" text-anchor="middle">20, 21</text><text x="70.4" y="110.0" font-size="11" fill="#1C232C" text-anchor="start">0, 1</text><text x="60.0" y="140.0" font-size="12" fill="#1E8449" text-anchor="start" font-weight="700">Ξ = 0</text><text x="110.0" y="140.0" font-size="12" fill="#1C232C" text-anchor="start">탐욕이 점 100 을 고른다. 점 21 이 s0 에서 21 떨어져 반지름 21. 최적값도 21</text><text x="60.0" y="172.0" font-size="12" fill="#C0392B" text-anchor="start" font-weight="700">Ξ = 1</text><text x="110.0" y="172.0" font-size="12" fill="#1C232C" text-anchor="start">100 을 이상점으로 두고 20 을 고르면 반지름 1. 구간 [10.5, 21] 밖이다</text><text x="60.0" y="204.0" font-size="12" fill="#C0392B" text-anchor="start" font-weight="700"></text><text x="110.0" y="204.0" font-size="12" fill="#1C232C" text-anchor="start">글자 그대로 돌리면 ub = 1, lb = 10.5 에서 ub = lb 가 안 되어 멈추지 않는다 (상한 1,000 번)</text><text x="60.0" y="236.0" font-size="12" fill="#C0392B" text-anchor="start" font-weight="700">s_g</text><text x="110.0" y="236.0" font-size="12" fill="#1C232C" text-anchor="start">알고리즘 1 은 s0 를 뺀 집합을 돌려주므로 s_g = {100}. 시작 ub = 100, lb = 50 이고 참값 21 이 구간 밖이다</text></svg>
