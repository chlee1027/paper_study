<svg xmlns="http://www.w3.org/2000/svg" width="760" height="288" viewBox="0 0 760 288" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="이 편과 PatchCore 의 쓰임 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="380.0" y="26.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">같은 식, 다른 쓰임: 이 편과 PatchCore</text><text x="120.0" y="54.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700"></text><text x="340.0" y="54.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">Sener · Savarese 2018</text><text x="590.0" y="54.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">PatchCore 2022</text><rect x="20.0" y="64.0" width="720.0" height="32.0" rx="4" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="85.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">고르는 대상</text><text x="340.0" y="85.0" font-size="11" fill="#1C232C" text-anchor="middle">라벨을 붙일 이미지</text><text x="590.0" y="85.0" font-size="11" fill="#1C232C" text-anchor="middle">뱅크에 남길 조각 특징</text><rect x="20.0" y="100.0" width="720.0" height="32.0" rx="4" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="121.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">거리 공간</text><text x="340.0" y="121.0" font-size="11" fill="#1C232C" text-anchor="middle">라벨로 다시 배운 망의 끝 완전연결층</text><text x="590.0" y="121.0" font-size="11" fill="#1C232C" text-anchor="middle">얼린 ImageNet 망 중간 단계, 무작위 사영</text><rect x="20.0" y="136.0" width="720.0" height="32.0" rx="4" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="157.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">이미 있는 점</text><text x="340.0" y="157.0" font-size="11" fill="#1C232C" text-anchor="middle">s0 (처음 라벨 풀)</text><text x="590.0" y="157.0" font-size="11" fill="#1C232C" text-anchor="middle">없다 (첫 점이 안 적혔다)</text><rect x="20.0" y="172.0" width="720.0" height="32.0" rx="4" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="193.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">크기 제약</text><text x="340.0" y="193.0" font-size="11" fill="#1C232C" text-anchor="middle">|s1| &lt;= b 를 식에 적는다</text><text x="590.0" y="193.0" font-size="11" fill="#1C232C" text-anchor="middle">식 (5) 에 없고 알고리즘의 l 이 대신</text><rect x="20.0" y="208.0" width="720.0" height="32.0" rx="4" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="229.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">이상점</text><text x="340.0" y="229.0" font-size="11" fill="#1C232C" text-anchor="middle">MIP 의 Ξ 로 내버려 둘 수 있다</text><text x="590.0" y="229.0" font-size="11" fill="#1C232C" text-anchor="middle">다루지 않는다</text><rect x="20.0" y="244.0" width="720.0" height="32.0" rx="4" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="265.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">반지름이 뜻하는 것</text><text x="340.0" y="265.0" font-size="11" fill="#1C232C" text-anchor="middle">손실 상한 (학습 손실 0 등 가정 아래)</text><text x="590.0" y="265.0" font-size="11" fill="#1C232C" text-anchor="middle">최근접 점수 오차 상한 (내 유도, 가정 없음)</text></svg>
