<svg xmlns="http://www.w3.org/2000/svg" width="760" height="518" viewBox="0 0 760 518" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="경계에서 알고리즘까지의 단계와 가정"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="380.0" y="28.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">경계에서 알고리즘까지: 단계마다 무엇을 가정하고 무엇을 쟀나</text><rect x="30.0" y="50.0" width="700.0" height="52.0" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="46.0" y="81.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="700">식 (1)</text><text x="160.0" y="72.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">모집단 손실을 줄이는 b 개 고르기</text><text x="160.0" y="91.0" font-size="11" fill="#4E5964" text-anchor="start">목표. 라벨 없이는 못 잰다</text><line x1="380.0" y1="102.0" x2="380.0" y2="116.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="30.0" y="116.0" width="700.0" height="52.0" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="46.0" y="147.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="700">식 (3) · (4)</text><text x="160.0" y="138.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">일반화 오차 + 학습 오차 + 코어셋 손실</text><text x="160.0" y="157.0" font-size="11" fill="#4E5964" text-anchor="start">앞의 둘은 작다고 두고 버린다. 수치 없음</text><line x1="380.0" y1="168.0" x2="380.0" y2="182.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="30.0" y="182.0" width="700.0" height="52.0" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="46.0" y="213.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="700">정리 1</text><text x="160.0" y="204.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">코어셋 손실 &lt;= δ(λl + λη·L·C) + √(L²log(1/γ)/2n)</text><text x="160.0" y="223.0" font-size="11" fill="#4E5964" text-anchor="start">학습 손실 0, 손실 립시츠, η 립시츠. δ 는 입력 공간</text><line x1="380.0" y1="234.0" x2="380.0" y2="248.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="30.0" y="248.0" width="700.0" height="52.0" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="46.0" y="279.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="700">보조정리 1</text><text x="160.0" y="270.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">λl = (√(C−1)/C)·α^(nc+nfc)</text><text x="160.0" y="289.0" font-size="11" fill="#4E5964" text-anchor="start">l2 손실, 합성곱 + ReLU + 최댓값 풀링</text><line x1="380.0" y1="300.0" x2="380.0" y2="314.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="30.0" y="314.0" width="700.0" height="52.0" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="46.0" y="345.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="700">식 (5)</text><text x="160.0" y="336.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">min max min Δ: k-센터</text><text x="160.0" y="355.0" font-size="11" fill="#4E5964" text-anchor="start">계수를 버리고 δ 만 줄인다</text><line x1="380.0" y1="366.0" x2="380.0" y2="380.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="30.0" y="380.0" width="700.0" height="52.0" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.2"/><text x="46.0" y="411.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="700">알고리즘 1 · 2</text><text x="160.0" y="402.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">탐욕 2-OPT, 강건 MIP 이분 탐색</text><text x="160.0" y="421.0" font-size="11" fill="#4E5964" text-anchor="start">Δ 는 마지막 완전연결층 활성의 l2, 교차 엔트로피로 학습</text><line x1="380.0" y1="432.0" x2="380.0" y2="446.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="30.0" y="446.0" width="700.0" height="52.0" rx="6" fill="#F6D9D5" stroke="#C0392B" stroke-width="1.2"/><text x="46.0" y="477.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="700">그림 3 · 4 · 6</text><text x="160.0" y="468.0" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">분류 정확도만 그렸다</text><text x="160.0" y="487.0" font-size="11" fill="#4E5964" text-anchor="start">δ · λ · 코어셋 손실 · 학습 오차를 잰 값이 없다</text></svg>
