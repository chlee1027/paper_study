<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 230" width="880" height="230"><rect width="880" height="230" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Faster R-CNN 의 짜임: 합성곱 특징을 RPN 과 Fast R-CNN 이 나눠 쓴다</text><rect x="20.0" y="70.0" width="140.0" height="80.0" fill="#eef2f7" stroke="#cccccc"/><text x="90.0" y="100.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지</text><text x="90.0" y="124.0" font-size="10.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">짧은 변 600</text><rect x="170.0" y="70.0" width="140.0" height="80.0" fill="#eef2f7" stroke="#cccccc"/><text x="240.0" y="100.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">공유 합성곱</text><text x="240.0" y="124.0" font-size="10.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">ZF 5 · VGG 13 층, 걸음 16</text><rect x="360.0" y="70.0" width="140.0" height="80.0" fill="#fbe9e5" stroke="#cccccc"/><text x="430.0" y="100.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RPN</text><text x="430.0" y="124.0" font-size="10.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">3 x 3 + 1 x 1 둘, 앵커 9</text><rect x="540.0" y="70.0" width="140.0" height="80.0" fill="#eef2f7" stroke="#cccccc"/><text x="610.0" y="100.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">NMS 0.7 + 상위 N</text><text x="610.0" y="124.0" font-size="10.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">약 2k, 시험 300</text><rect x="720.0" y="70.0" width="140.0" height="80.0" fill="#eef2f7" stroke="#cccccc"/><text x="790.0" y="100.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Fast R-CNN</text><text x="790.0" y="124.0" font-size="10.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RoI 풀링 + 완전 연결</text><line x1="160.0" y1="110.0" x2="170.0" y2="110.0" stroke="#222222" stroke-width="1.5"/><line x1="330.0" y1="110.0" x2="360.0" y2="110.0" stroke="#222222" stroke-width="1.5"/><line x1="510.0" y1="110.0" x2="540.0" y2="110.0" stroke="#222222" stroke-width="1.5"/><line x1="690.0" y1="110.0" x2="720.0" y2="110.0" stroke="#222222" stroke-width="1.5"/><line x1="240.0" y1="150.0" x2="240.0" y2="190.0" stroke="#222222" stroke-width="1"/><line x1="240.0" y1="190.0" x2="790.0" y2="190.0" stroke="#222222" stroke-width="1"/><line x1="790.0" y1="190.0" x2="790.0" y2="150.0" stroke="#222222" stroke-width="1"/><text x="515.0" y="208.0" font-size="12" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">같은 특징 지도를 다시 쓴다 (시험 때 RPN 추가 계산 10 ms, VGG)</text></svg>