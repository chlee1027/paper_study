<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300"><rect width="720" height="300" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 2 의 VOC 2007 학습 줄과 각주: 기준선을 어느 값으로 잡느냐에 따라 차이가 바뀐다</text><line x1="230.0" y1="44.0" x2="230.0" y2="220.0" stroke="#cccccc" stroke-width="1"/><text x="230.0" y="238.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">64</text><line x1="314.0" y1="44.0" x2="314.0" y2="220.0" stroke="#cccccc" stroke-width="1"/><text x="314.0" y="238.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">66</text><line x1="398.0" y1="44.0" x2="398.0" y2="220.0" stroke="#cccccc" stroke-width="1"/><text x="398.0" y="238.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">68</text><line x1="482.0" y1="44.0" x2="482.0" y2="220.0" stroke="#cccccc" stroke-width="1"/><text x="482.0" y="238.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">70</text><line x1="566.0" y1="44.0" x2="566.0" y2="220.0" stroke="#cccccc" stroke-width="1"/><text x="566.0" y="238.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">72</text><line x1="650.0" y1="44.0" x2="650.0" y2="220.0" stroke="#cccccc" stroke-width="1"/><text x="650.0" y="238.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">74</text><text x="220.0" y="68.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">SS (표 값, 원 논문 [5])</text><circle cx="351.8" cy="64.0" r="5" fill="#8a8a8a"/><text x="361.8" y="68.0" font-size="12" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">66.9</text><text x="220.0" y="108.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">SS (같은 저장소, 6 회)</text><circle cx="398.0" cy="104.0" r="5" fill="#222222"/><text x="432.0" y="108.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">68.0 ± 0.3</text><line x1="385.4" y1="104.0" x2="410.6" y2="104.0" stroke="#222222" stroke-width="2"/><text x="220.0" y="148.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RPN+VGG, 공유 안 함</text><circle cx="419.0" cy="144.0" r="5" fill="#2f6db3"/><text x="429.0" y="148.0" font-size="12" fill="#2f6db3" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">68.5</text><text x="220.0" y="188.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RPN+VGG, 공유</text><circle cx="477.8" cy="184.0" r="5" fill="#c8553d"/><text x="487.8" y="188.0" font-size="12" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">69.9</text><text x="20.0" y="268.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">공유 69.9 의 차이: 66.9 대비 3.0, 68.0 대비 1.9.   공유 안 함 68.5 의 차이: 66.9 대비 1.6, 68.0 대비 0.5.</text><text x="20.0" y="288.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">± 0.3 이 표 전체에 하나뿐인 흩어짐이다. 뜻(표준편차 여부)은 적혀 있지 않다.</text></svg>