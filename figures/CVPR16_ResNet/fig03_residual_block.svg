<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="잔차 블록 구조"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">잔차 블록 — 층 둘이 H(x) 대신 F(x) = H(x) − x 를 배우고, 지름길이 x 를 더한다 (논문 그림 2)</text><text x="250" y="72" font-size="16" fill="#1C232C" text-anchor="middle" font-weight="bold" font-style="italic">x</text><line x1="250" y1="78" x2="250" y2="98" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="170" y="100" width="160" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="250" y="123" font-size="11" fill="#1C232C" text-anchor="middle">가중치 층 (3x3 합성곱 + BN)</text><line x1="250" y1="138" x2="250" y2="156" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="262" y="152" font-size="11" fill="#4E5964" text-anchor="start">ReLU</text><rect x="170" y="158" width="160" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="250" y="181" font-size="11" fill="#1C232C" text-anchor="middle">가중치 층 (3x3 합성곱 + BN)</text><line x1="250" y1="196" x2="250" y2="226" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="238" y="216" font-size="12" fill="#B4552B" text-anchor="end" font-weight="bold">F(x)</text><circle cx="250" cy="240" r="14" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="250" y="245" font-size="16" fill="#1C232C" text-anchor="middle" font-weight="bold">+</text><path d="M250,86 C400,86 400,100 400,150 C400,200 400,240 266,240" fill="none" stroke="#9A7B00" stroke-width="2.2" marker-end="url(#ac)"/><text x="410" y="150" font-size="12" fill="#9A7B00" text-anchor="start" font-weight="bold">항등 지름길 x</text><text x="410" y="168" font-size="11" fill="#9A7B00" text-anchor="start">파라미터 0</text><text x="410" y="184" font-size="11" fill="#9A7B00" text-anchor="start">계산은 더하기뿐</text><line x1="250" y1="256" x2="250" y2="282" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="262" y="274" font-size="11" fill="#4E5964" text-anchor="start">ReLU (더한 뒤)</text><text x="250" y="300" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">y = σ(F(x) + x)</text><rect x="520" y="60" width="280" height="280" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="535" y="86" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">식 (1)  y = F(x, {Wᵢ}) + x</text><text x="535" y="107" font-size="12" fill="#1C232C" text-anchor="start">F = W₂ σ(W₁ x)  (치우침 생략)</text><text x="535" y="128" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="535" y="149" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">식 (2)  y = F(x, {Wᵢ}) + W_s x</text><text x="535" y="170" font-size="12" fill="#1C232C" text-anchor="start">x 와 F 의 차원이 다를 때만</text><text x="535" y="191" font-size="12" fill="#1C232C" text-anchor="start">W_s 로 맞춘다 (1x1 합성곱)</text><text x="535" y="212" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="535" y="233" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">작은 예시 (내가 붙인 것)</text><text x="535" y="254" font-size="12" fill="#1C232C" text-anchor="start">x = 2.0, F(x) = 0.1 이면 y = 2.1</text><text x="535" y="275" font-size="12" fill="#1C232C" text-anchor="start">항등이 최선이면 F → 0 이 목표다</text><text x="535" y="296" font-size="12" fill="#1C232C" text-anchor="start">평범한 망은 W₂σ(W₁x) = x 를</text><text x="535" y="317" font-size="12" fill="#1C232C" text-anchor="start">직접 맞춰야 한다</text></svg>
