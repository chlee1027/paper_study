-width="1.4" marker-end="url(#ai)"/><rect x="179.8" y="154.8" width="70.4" height="70.4" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="215" y="62" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">conv2_x</text><text x="215" y="290" font-size="11" fill="#4E5964" text-anchor="middle">3x3 64 x 6</text><text x="215" y="310" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">56 x 56</text><text x="215" y="330" font-size="11" fill="#B4552B" text-anchor="middle">블록 3 개</text><line x1="270" y1="190" x2="288" y2="190" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="322.4" y="167.4" width="45.2" height="45.2" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="345" y="62" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">conv3_x</text><text x="345" y="290" font-size="11" fill="#4E5964" text-anchor="middle">3x3 128 x 8</text><text x="345" y="310" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">28 x 28</text><text x="345" y="330" font-size="11" fill="#B4552B" text-anchor="middle">블록 4 개</text><line x1="400" y1="190" x2="418" y2="190" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="458.7" y="173.7" width="32.6" height="32.6" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="475" y="62" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">conv4_x</text><text x="475" y="290" font-size="11" fill="#4E5964" text-anchor="middle">3x3 256 x 12</text><text x="475" y="310" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">14 x 14</text><text x="475" y="330" font-size="11" fill="#B4552B" text-anchor="middle">블록 6 개</text><line x1="530" y1="190" x2="548" y2="190" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="591.85" y="176.85" width="26.3" height="26.3" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="605" y="62" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">conv5_x</text><text x="605" y="290" font-size="11" fill="#4E5964" text-anchor="middle">3x3 512 x 6</text><text x="605" y="310" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">7 x 7</text><text x="605" y="330" font-size="11" fill="#B4552B" text-anchor="middle">블록 3 개</text><line x1="660" y1="190" x2="678" y2="190" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="724.55" y="179.55" width="20.9" height="20.9" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="735" y="62" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">풀링 + fc</text><text x="735" y="290" font-size="11" fill="#4E5964" text-anchor="middle">평균, 1000</text><text x="735" y="310" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">1 x 1</text><text x="735" y="330" font-size="11" fill="#B4552B" text-anchor="middle"></text><text x="410" y="360" font-size="11" fill="#7A8590" text-anchor="middle">규칙 둘: (i) 같은 크기면 필터 수가 같다 (ii) 크기가 반이 되면 필터가 두 배 → 층마다 시간 복잡도가 같다. 줄이기는 보폭 2 합성곱으로</text></svg>
