 y="328" font-size="12" fill="#1C232C" text-anchor="middle">143.7 M</text><text x="410" y="368" font-size="11" fill="#7A8590" text-anchor="middle">FLOPs 는 곱-덧셈 수(논문의 정의). 파라미터는 합성곱 + BN(γ, β) + fc, 선택지 B. 50 층 이상은 보폭을 병목의 첫 1x1 에 둔 값이다</text><text x="410" y="388" font-size="11" fill="#4E5964" text-anchor="middle">보폭을 3x3 에 두면 ResNet-50 이 4.09 G 가 되어 논문의 3.8 에서 멀어진다 — 논문은 첫 1x1 에 둔 것으로 읽힌다 (내 계산)</text><text x="410" y="408" font-size="11" fill="#7A8590" text-anchor="middle">센 값과 논문 값의 차이는 −0.03 ~ +0.06 G 이고, 파라미터는 torchvision 의 다섯 모델과 한 자리까지 같다</text></svg>
