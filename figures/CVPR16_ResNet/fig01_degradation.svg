<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="퇴화 문제 막대 그림"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">퇴화 문제 — 층을 더했는데 학습 오차부터 높아진다 (과적합이면 학습 오차는 낮아야 한다)</text><rect x="20" y="50" width="385" height="335" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="212" y="72" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">CIFAR-10 평범한 망 (그림 1, 눈금 읽기 ±1)</text><text x="130" y="322" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">학습 오차 %</text><rect x="70" y="282.1875" width="50" height="17.8125" rx="3" fill="#2A78D6"/><text x="95" y="276.1875" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">1.50</text><text x="95" y="340" font-size="11" fill="#4E5964" text-anchor="middle">20 층</text><rect x="140" y="228.75" width="50" height="71.25" rx="3" fill="#C0392B"/><text x="165" y="222.75" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">6</text><text x="165" y="340" font-size="11" fill="#4E5964" text-anchor="middle">56 층</text><text x="305" y="322" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">시험 오차 %</text><rect x="245" y="184.8125" width="50" height="115.18749999999999" rx="3" fill="#2A78D6"/><text x="270" y="178.8125" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">9.70</text><text x="270" y="340" font-size="11" fill="#4E5964" text-anchor="middle">20 층</text><rect x="315" y="143.25" width="50" height="156.75" rx="3" fill="#C0392B"/><text x="340" y="137.25" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">13.20</text><text x="340" y="340" font-size="11" fill="#4E5964" text-anchor="middle">56 층</text><line x1="50" y1="300" x2="390" y2="300" stroke="#4E5964" stroke-width="1"/><text x="212" y="372" font-size="11" fill="#7A8590" text-anchor="middle">56 층이 학습 · 시험 둘 다 높다</text><rect x="415" y="50" width="385" height="335" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="607" y="72" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">ImageNet top-1 오차 % (표 2, 10-crop)</text><text x="525" y="322" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">평범한 망</text><rect x="465" y="143.86470588235295" width="50" height="156.13529411764705" rx="3" fill="#2A78D6"/><text x="490" y="137.86470588235295" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">27.94</text><text x="490" y="340" font-size="11" fill="#4E5964" text-anchor="middle">18 층</text><rect x="535" y="140.51176470588237" width="50" height="159.48823529411763" rx="3" fill="#C0392B"/><text x="560" y="134.51176470588237" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">28.54</text><text x="560" y="340" font-size="11" fill="#4E5964" text-anchor="middle">34 층</text><text x="700" y="322" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">잔차 망</text><rect x="640" y="144.20000000000002" width="50" height="155.79999999999998" rx="3" fill="#EB6834"/><text x="665" y="138.20000000000002" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">27.88</text><text x="665" y="340" font-size="11" fill="#4E5964" text-anchor="middle">18 층</text><rect x="710" y="160.1264705882353" width="50" height="139.8735294117647" rx="3" fill="#1E8449"/><text x="735" y="154.1264705882353" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">25.03</text><text x="735" y="340" font-size="11" fill="#4E5964" text-anchor="middle">34 층</text><line x1="445" y1="300" x2="785" y2="300" stroke="#4E5964" stroke-width="1"/><text x="607" y="372" font-size="11" fill="#7A8590" text-anchor="middle">평범한 망은 +0.60, 잔차 망은 −2.85 — 방향이 뒤집힌다</text><text x="410" y="415" font-size="11" fill="#7A8590" text-anchor="middle">왼쪽 막대의 높이는 눈금을 읽은 값이라 소수 첫째 자리까지만 적는다. 오른쪽은 표의 값 그대로다</text></svg>
