ont-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">fc 층</text><text x="330.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle">4096-4096-1000</text><text x="510.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle">평균 풀링 + 1000</text><text x="690.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle">평균 풀링 + 1000</text><rect x="20" y="281" width="760" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">줄이기</text><text x="330.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle">최댓값 풀링 5 번</text><text x="510.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle">보폭 2 합성곱</text><text x="690.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle">보폭 2 합성곱</text><rect x="20" y="319" width="760" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">정규화</text><text x="330.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle">없다 (원 논문)</text><text x="510.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle">BN, 합성곱마다</text><text x="690.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle">BN, 합성곱마다</text><rect x="20" y="357" width="760" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">지름길</text><text x="330.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle">없다</text><text x="510.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle">있다</text><text x="690.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle">있다 (병목)</text><text x="410" y="418" font-size="11" fill="#4E5964" text-anchor="middle">VGG-19 파라미터의 86% 가 fc 세 층에 있다 (내가 센 값). ResNet 은 fc 를 평균 풀링과 fc 하나로 바꿨다</text><text x="410" y="438" font-size="11" fill="#7A8590" text-anchor="middle">34 층의 곱-덧셈이 VGG-19 의 18% 라는 것은 논문의 문장이다. 내가 센 값으로는 18.7%</text></svg>
