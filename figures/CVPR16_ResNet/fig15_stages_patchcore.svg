<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="단계별 출력 크기와 PatchCore 연결"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">224 입력에서 단계마다의 출력 — ResNet-50 과 WideResNet-50-2 (PatchCore 가 쓰는 자리는 내가 이은 것)</text><rect x="46.80000000000001" y="106.80000000000001" width="136.39999999999998" height="136.39999999999998" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="115" y="62" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">conv2_x (layer1)</text><text x="115" y="262" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">56 x 56</text><text x="115" y="282" font-size="11" fill="#1C232C" text-anchor="middle">출력 256 채널</text><text x="115" y="300" font-size="11" fill="#4E5964" text-anchor="middle">병목 안쪽 64 → 128 (WRN)</text><text x="115" y="318" font-size="11" fill="#7A8590" text-anchor="middle">보폭 누적 4</text><rect x="263.4" y="133.4" width="83.19999999999999" height="83.19999999999999" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="2"/><text x="305" y="62" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">conv3_x (layer2)</text><text x="305" y="262" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">28 x 28</text><text x="305" y="282" font-size="11" fill="#1C232C" text-anchor="middle">출력 512 채널</text><text x="305" y="300" font-size="11" fill="#4E5964" text-anchor="middle">병목 안쪽 128 → 256 (WRN)</text><text x="305" y="318" font-size="11" fill="#7A8590" text-anchor="middle">보폭 누적 8</text><rect x="466.7" y="146.7" width="56.599999999999994" height="56.599999999999994" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="2"/><text x="495" y="62" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">conv4_x (layer3)</text><text x="495" y="262" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">14 x 14</text><text x="495" y="282" font-size="11" fill="#1C232C" text-anchor="middle">출력 1,024 채널</text><text x="495" y="300" font-size="11" fill="#4E5964" text-anchor="middle">병목 안쪽 256 → 512 (WRN)</text><text x="495" y="318" font-size="11" fill="#7A8590" text-anchor="middle">보폭 누적 16</text><rect x="663.35" y="153.35" width="43.3" height="43.3" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="685" y="62" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">conv5_x (layer4)</text><text x="685" y="262" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">7 x 7</text><text x="685" y="282" font-size="11" fill="#1C232C" text-anchor="middle">출력 2,048 채널</text><text x="685" y="300" font-size="11" fill="#4E5964" text-anchor="middle">병목 안쪽 512 → 1024 (WRN)</text><text x="685" y="318" font-size="11" fill="#7A8590" text-anchor="middle">보폭 누적 32</text><rect x="30" y="332" width="760" height="88" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="50" y="354" font-size="12" fill="#1C232C" text-anchor="start">PatchCore 는 layer2 (28x28, 512 채널) 와 layer3 (14x14, 1,024 채널) 의 특징을 이어 붙여 위치마다 조각 특징을 만든다</text><text x="50" y="376" font-size="12" fill="#1C232C" text-anchor="start">이어 붙인 채널은 512 + 1,024 = 1,536. 조각 위치는 layer2 격자를 따라 224 입력이면 28 x 28 = 784, 576 입력이면 72 x 72 = 5,184</text><text x="50" y="398" font-size="12" fill="#4E5964" text-anchor="start">이 연결은 ResNet 논문에 없다 — PatchCore 쪽 설정을 내가 옆에 놓은 것이다</text></svg>
