<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="구성 논증"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">구성 논증 — 얕은 망을 베끼고 더한 층을 항등으로 두면 깊은 망도 같은 학습 오차를 낸다</text><text x="120" y="70" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">얕은 망</text><rect x="60" y="90" width="120" height="24" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="120" y="107" font-size="11" fill="#1C232C" text-anchor="middle">층 1 (학습됨)</text><rect x="60" y="120" width="120" height="24" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="120" y="137" font-size="11" fill="#1C232C" text-anchor="middle">층 2 (학습됨)</text><rect x="60" y="150" width="120" height="24" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="120" y="167" font-size="11" fill="#1C232C" text-anchor="middle">층 3 (학습됨)</text><text x="360" y="70" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">깊은 망 (구성한 해)</text><rect x="300" y="90" width="120" height="24" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="360" y="107" font-size="11" fill="#1C232C" text-anchor="middle">층 1 (베낌)</text><rect x="300" y="120" width="120" height="24" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="360" y="137" font-size="11" fill="#1C232C" text-anchor="middle">층 2 (베낌)</text><rect x="300" y="150" width="120" height="24" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="360" y="167" font-size="11" fill="#1C232C" text-anchor="middle">층 3 (베낌)</text><rect x="300" y="180" width="120" height="24" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="360" y="197" font-size="11" fill="#1C232C" text-anchor="middle">더한 층 = 항등</text><rect x="300" y="210" width="120" height="24" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="360" y="227" font-size="11" fill="#1C232C" text-anchor="middle">더한 층 = 항등</text><rect x="300" y="240" width="120" height="24" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="360" y="257" font-size="11" fill="#1C232C" text-anchor="middle">더한 층 = 항등</text><line x1="185" y1="135" x2="295" y2="135" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="240" y="125" font-size="11" fill="#4E5964" text-anchor="middle">그대로 베낀다</text><rect x="470" y="70" width="330" height="200" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="485" y="96" font-size="12" fill="#1C232C" text-anchor="start">이 해의 학습 오차 = 얕은 망의 학습 오차</text><text x="485" y="116" font-size="12" fill="#1C232C" text-anchor="start">→ 깊은 망의 최선은 얕은 망보다 나쁠 수 없다</text><text x="485" y="136" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="485" y="156" font-size="12" fill="#C0392B" text-anchor="start">그런데 실험에서는 더 나빴다 (그림 1)</text><text x="485" y="176" font-size="12" fill="#1C232C" text-anchor="start">→ 해가 없는 것이 아니라 풀이기(SGD)가</text><text x="485" y="196" font-size="12" fill="#1C232C" text-anchor="start">   그 해를 (적당한 시간 안에) 못 찾는다</text><text x="485" y="216" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="485" y="236" font-size="12" fill="#1C232C" text-anchor="start">논문의 가설: 여러 비선형 층으로</text><text x="485" y="256" font-size="12" fill="#1C232C" text-anchor="start">항등을 맞추는 일이 어렵다</text><text x="410" y="310" font-size="12" fill="#1E8449" text-anchor="middle" font-weight="bold">잔차 학습은 이 가설에서 나온다 — 항등이 최선이면 잔차 F 를 0 으로 밀기만 하면 된다</text></svg>
