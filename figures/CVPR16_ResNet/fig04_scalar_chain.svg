<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="평범한 곱과 잔차 곱의 크기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">층마다 y = w·x (평범한 망) 대 y = x + w·x (잔차 망), w ~ N(0, 0.1²) — 입력에 대한 기울기의 크기 (내가 붙인 예)</text><line x1="90" y1="73.52112676056336" x2="520" y2="73.52112676056336" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="77.52112676056336" font-size="10" fill="#7A8590" text-anchor="end">1</text><line x1="90" y1="108.73239436619718" x2="520" y2="108.73239436619718" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="112.73239436619718" font-size="10" fill="#7A8590" text-anchor="end">10^-20</text><line x1="90" y1="143.943661971831" x2="520" y2="143.943661971831" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="147.943661971831" font-size="10" fill="#7A8590" text-anchor="end">10^-40</text><line x1="90" y1="179.15492957746477" x2="520" y2="179.15492957746477" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="183.15492957746477" font-size="10" fill="#7A8590" text-anchor="end">10^-60</text><line x1="90" y1="214.3661971830986" x2="520" y2="214.3661971830986" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="218.3661971830986" font-size="10" fill="#7A8590" text-anchor="end">10^-80</text><line x1="90" y1="249.57746478873239" x2="520" y2="249.57746478873239" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="253.57746478873239" font-size="10" fill="#7A8590" text-anchor="end">10^-100</text><line x1="90" y1="284.7887323943662" x2="520" y2="284.7887323943662" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="288.7887323943662" font-size="10" fill="#7A8590" text-anchor="end">10^-120</text><line x1="90" y1="320.0" x2="520" y2="320.0" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="324.0" font-size="10" fill="#7A8590" text-anchor="end">10^-140</text><text x="90.0" y="338" font-size="11" fill="#7A8590" text-anchor="middle">L = 2</text><text x="233.33333333333331" y="338" font-size="11" fill="#7A8590" text-anchor="middle">L = 10</text><text x="376.66666666666663" y="338" font-size="11" fill="#7A8590" text-anchor="middle">L = 34</text><text x="520.0" y="338" font-size="11" fill="#7A8590" text-anchor="middle">L = 110</text><path d="M90.0,77.8 L233.3,95.8 L376.7,149.7 L520.0,320.1" fill="none" stroke="#2A78D6" stroke-width="2.4"/><path d="M90.0,73.5 L233.3,73.6 L376.7,73.6 L520.0,73.9" fill="none" stroke="#EB6834" stroke-width="2.4"/><circle cx="90.0" cy="77.80527301568694" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="90.0" cy="73.52949101842003" r="4" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><circle cx="233.33333333333331" cy="95.7774755000207" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="233.33333333333331" cy="73.5527480021257" r="4" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><circle cx="376.66666666666663" cy="149.67108887389531" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="376.66666666666663" cy="73.63948507421011" r="4" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><circle cx="520.0" cy="320.09715080290266" r="4" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><circle cx="520.0" cy="73.91773721045396" r="4" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="388.66666666666663" y="153.67108887389531" font-size="12" fill="#2A78D6" text-anchor="start" font-weight="bold">평범한 곱 |Π w|</text><text x="376.66666666666663" y="65.52112676056336" font-size="12" fill="#EB6834" text-anchor="middle" font-weight="bold">잔차 곱 |Π(1 + w)|</text><rect x="550" y="70" width="250" height="250" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="565" y="94" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">중앙값 (2,000 번 뽑기, seed 0)</text><text x="565" y="122" font-size="12" fill="#1C232C" text-anchor="start">L=2    평범 10^-2,  잔차 0.989</text><text x="565" y="148" font-size="12" fill="#1C232C" text-anchor="start">L=10   평범 10^-13,  잔차 0.959</text><text x="565" y="174" font-size="12" fill="#1C232C" text-anchor="start">L=34   평범 10^-43,  잔차 0.857</text><text x="565" y="200" font-size="12" fill="#1C232C" text-anchor="start">L=110  평범 10^-140,  잔차 0.595</text><text x="565" y="236" font-size="11" fill="#4E5964" text-anchor="start">가중치가 0 근처에서 시작하면</text><text x="565" y="256" font-size="11" fill="#4E5964" text-anchor="start">평범한 망은 곱이 사라지고</text><text x="565" y="276" font-size="11" fill="#4E5964" text-anchor="start">잔차 망은 1 근처에 남는다.</text><text x="565" y="296" font-size="11" fill="#C0392B" text-anchor="start">논문의 퇴화 설명과는 다른 자리다(본문)</text></svg>
