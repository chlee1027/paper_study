<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="기본 블록과 병목 블록 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">기본 블록 대 병목 블록 — 1x1 로 줄이고, 3x3 을 좁은 폭에서 하고, 1x1 로 되살린다 (논문 그림 5, 가중치 수는 내가 센 것)</text><text x="150" y="70" font-size="13" fill="#2A78D6" text-anchor="middle" font-weight="bold">기본 (ResNet-34, 64-d)</text><rect x="90.0" y="90" width="120" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="150" y="113" font-size="12" fill="#1C232C" text-anchor="middle">3x3, 64</text><text x="265" y="113" font-size="11" fill="#4E5964" text-anchor="start">36,864</text><line x1="150" y1="128" x2="150" y2="144" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="90.0" y="146" width="120" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="150" y="169" font-size="12" fill="#1C232C" text-anchor="middle">3x3, 64</text><text x="265" y="169" font-size="11" fill="#4E5964" text-anchor="start">36,864</text><text x="150" y="214" font-size="13" fill="#2A78D6" text-anchor="middle" font-weight="bold">합계 73,728</text><text x="540" y="70" font-size="13" fill="#EB6834" text-anchor="middle" font-weight="bold">병목 (ResNet-50 이상, 256-d)</text><rect x="495.0" y="90" width="90" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="540" y="113" font-size="12" fill="#1C232C" text-anchor="middle">1x1, 64</text><text x="655" y="113" font-size="11" fill="#4E5964" text-anchor="start">16,384</text><line x1="540" y1="128" x2="540" y2="144" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="495.0" y="146" width="90" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="540" y="169" font-size="12" fill="#1C232C" text-anchor="middle">3x3, 64</text><text x="655" y="169" font-size="11" fill="#4E5964" text-anchor="start">36,864</text><line x1="540" y1="184" x2="540" y2="200" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="440.0" y="202" width="200" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="540" y="225" font-size="12" fill="#1C232C" text-anchor="middle">1x1, 256</text><text x="655" y="225" font-size="11" fill="#4E5964" text-anchor="start">16,384</text><text x="540" y="270" font-size="13" fill="#EB6834" text-anchor="middle" font-weight="bold">합계 69,632</text><rect x="30" y="300" width="760" height="90" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="50" y="324" font-size="12" fill="#1C232C" text-anchor="start">그림 5 가 「비슷한 시간 복잡도」라 부르는 두 블록: 73,728 대 69,632 (5.6% 차이, 같은 56x56 위라 곱-덧셈도 같은 비율)</text><text x="50" y="348" font-size="12" fill="#1C232C" text-anchor="start">256-d 입출력을 기본 블록으로 하면 1,179,648 로 병목의 16.9 배다 — 병목이 깊이를 싸게 만든다</text><text x="50" y="372" font-size="12" fill="#4E5964" text-anchor="start">병목의 지름길을 사영(256x256 = 65,536)으로 바꾸면 1.94 배 — 논문의 「시간과 크기가 두 배가 된다」와 맞는다</text></svg>
