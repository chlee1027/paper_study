<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="ImageNet 학습 곡선 끝 값"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">논문 그림 4 의 오른쪽 끝 (약 55만 반복) — 가는 선 = 학습 오차, 굵은 선 = 중앙 자르기 검증 오차 (눈금 읽기 ±1)</text><line x1="180.0" y1="60" x2="180.0" y2="270" stroke="#CFD6D3" stroke-width="1"/><text x="180.0" y="288" font-size="10" fill="#7A8590" text-anchor="middle">22</text><line x1="276.66666666666663" y1="60" x2="276.66666666666663" y2="270" stroke="#CFD6D3" stroke-width="1"/><text x="276.66666666666663" y="288" font-size="10" fill="#7A8590" text-anchor="middle">24</text><line x1="373.3333333333333" y1="60" x2="373.3333333333333" y2="270" stroke="#CFD6D3" stroke-width="1"/><text x="373.3333333333333" y="288" font-size="10" fill="#7A8590" text-anchor="middle">26</text><line x1="470.0" y1="60" x2="470.0" y2="270" stroke="#CFD6D3" stroke-width="1"/><text x="470.0" y="288" font-size="10" fill="#7A8590" text-anchor="middle">28</text><line x1="566.6666666666666" y1="60" x2="566.6666666666666" y2="270" stroke="#CFD6D3" stroke-width="1"/><text x="566.6666666666666" y="288" font-size="10" fill="#7A8590" text-anchor="middle">30</text><line x1="663.3333333333334" y1="60" x2="663.3333333333334" y2="270" stroke="#CFD6D3" stroke-width="1"/><text x="663.3333333333334" y="288" font-size="10" fill="#7A8590" text-anchor="middle">32</text><line x1="760.0" y1="60" x2="760.0" y2="270" stroke="#CFD6D3" stroke-width="1"/><text x="760.0" y="288" font-size="10" fill="#7A8590" text-anchor="middle">34</text><text x="166" y="89" font-size="12" fill="#2A78D6" text-anchor="end" font-weight="bold">plain-18</text><line x1="615.0" y1="85" x2="624.6666666666666" y2="85" stroke="#CFD6D3" stroke-width="3"/><circle cx="615.0" cy="85" r="5" fill="#ECEFEC" stroke="#2A78D6" stroke-width="2"/><circle cx="624.6666666666666" cy="85" r="6" fill="#2A78D6" stroke="#2A78D6" stroke-width="2"/><text x="166" y="139" font-size="12" fill="#C0392B" text-anchor="end" font-weight="bold">plain-34</text><line x1="687.5" y1="135" x2="677.8333333333333" y2="135" stroke="#CFD6D3" stroke-width="3"/><circle cx="687.5" cy="135" r="5" fill="#ECEFEC" stroke="#C0392B" stroke-width="2"/><circle cx="677.8333333333333" cy="135" r="6" fill="#C0392B" stroke="#C0392B" stroke-width="2"/><text x="166" y="189" font-size="12" fill="#EB6834" text-anchor="end" font-weight="bold">ResNet-18</text><line x1="590.8333333333334" y1="185" x2="615.0" y2="185" stroke="#CFD6D3" stroke-width="3"/><circle cx="590.8333333333334" cy="185" r="5" fill="#ECEFEC" stroke="#EB6834" stroke-width="2"/><circle cx="615.0" cy="185" r="6" fill="#EB6834" stroke="#EB6834" stroke-width="2"/><text x="166" y="239" font-size="12" fill="#1E8449" text-anchor="end" font-weight="bold">ResNet-34</text><line x1="310.5" y1="235" x2="484.5" y2="235" stroke="#CFD6D3" stroke-width="3"/><circle cx="310.5" cy="235" r="5" fill="#ECEFEC" stroke="#1E8449" stroke-width="2"/><circle cx="484.5" cy="235" r="6" fill="#1E8449" stroke="#1E8449" stroke-width="2"/><text x="410" y="310" font-size="11" fill="#4E5964" text-anchor="middle">빈 점 = 학습, 찬 점 = 검증. 평범한 34 층은 학습 오차가 18 층보다 1.5 높다(퇴화). ResNet-34 는 학습이 18 층보다 5.8 낮다</text><text x="410" y="330" font-size="11" fill="#7A8590" text-anchor="middle">학습 오차가 검증보다 높거나 비슷한 것은 학습 쪽에 데이터 늘리기가 걸려 있어서로 읽는다 (논문이 설명하지 않는다)</text></svg>
