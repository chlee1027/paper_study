<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="깊이 문제의 계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 「깊으면 안 배워진다」에 대한 답들</text><rect x="20" y="60" width="120" height="64" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="80" y="86" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">역전파 1986</text><text x="80" y="106" font-size="10" fill="#4E5964" text-anchor="middle">층마다 기울기가 준다</text><line x1="141" y1="92" x2="151" y2="92" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><rect x="152" y="60" width="120" height="64" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="212" y="86" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">DBN · AE 2006</text><text x="212" y="106" font-size="10" fill="#4E5964" text-anchor="middle">사전학습으로 출발점</text><line x1="273" y1="92" x2="283" y2="92" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><rect x="284" y="60" width="120" height="64" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="344" y="86" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">AlexNet 2012</text><text x="344" y="106" font-size="10" fill="#4E5964" text-anchor="middle">ReLU 로 8 층</text><line x1="405" y1="92" x2="415" y2="92" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><rect x="416" y="60" width="120" height="64" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="476" y="86" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">VGG 2014</text><text x="476" y="106" font-size="10" fill="#4E5964" text-anchor="middle">3x3 으로 19 층</text><line x1="537" y1="92" x2="547" y2="92" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><rect x="548" y="60" width="120" height="64" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="608" y="86" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">BN 2015</text><text x="608" y="106" font-size="10" fill="#4E5964" text-anchor="middle">층 입력을 정규화</text><line x1="669" y1="92" x2="679" y2="92" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><rect x="680" y="60" width="120" height="64" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="740" y="86" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">ResNet 2015</text><text x="740" y="106" font-size="10" fill="#4E5964" text-anchor="middle">항등 지름길로 152 층</text><rect x="20" y="150" width="780" height="190" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="40" y="176" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">무엇이 달라졌나 — 문제가 옮겨 갔다</text><text x="40" y="204" font-size="12" fill="#1C232C" text-anchor="start">역전파 · DBN · AE 의 문제는 기울기가 아래층까지 안 내려오는 것(사라지는 기울기)이었다</text><text x="40" y="230" font-size="12" fill="#1C232C" text-anchor="start">ResNet 은 그 문제가 정규화된 초기화와 BN 으로 「대부분 풀렸다」고 적고 시작한다 — 그 위에서 드러난 것이 퇴화다</text><text x="40" y="256" font-size="12" fill="#1C232C" text-anchor="start">퇴화: 기울기는 건강한데(논문이 확인했다고 적는다) 깊은 평범한 망의 학습 오차가 더 높다</text><text x="40" y="282" font-size="12" fill="#1C232C" text-anchor="start">답은 풀이기를 바꾸는 것이 아니라 문제를 바꿔 적는 것 — H(x) 대신 F(x) = H(x) − x</text><text x="40" y="308" font-size="12" fill="#4E5964" text-anchor="start">PatchCore 같은 이상 탐지는 ImageNet 으로 배운 이 망을 얼려 특징 추출기로 쓴다 (논문 밖, 내가 잇는 자리)</text></svg>
