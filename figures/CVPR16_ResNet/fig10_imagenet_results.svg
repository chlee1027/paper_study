chor="middle" font-weight="bold">앙상블 · 시험 서버</text><text x="577" y="104" font-size="11" fill="#1C232C" text-anchor="end">VGG (ILSVRC'14)</text><rect x="585" y="91" width="178.425" height="18" rx="3" fill="#1BAF7A"/><text x="768.425" y="104" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">7.32</text><text x="577" y="137" font-size="11" fill="#1C232C" text-anchor="end">GoogLeNet (ILSVRC'14)</text><rect x="585" y="124" width="162.3375" height="18" rx="3" fill="#4E5964"/><text x="752.3375" y="137" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">6.66</text><text x="577" y="170" font-size="11" fill="#1C232C" text-anchor="end">VGG (v5)</text><rect x="585" y="157" width="165.75" height="18" rx="3" fill="#1BAF7A"/><text x="755.75" y="170" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">6.80</text><text x="577" y="203" font-size="11" fill="#1C232C" text-anchor="end">PReLU-net</text><rect x="585" y="190" width="120.41250000000001" height="18" rx="3" fill="#4E5964"/><text x="710.4125" y="203" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">4.94</text><text x="577" y="236" font-size="11" fill="#1C232C" text-anchor="end">BN-inception</text><rect x="585" y="223" width="117.48750000000001" height="18" rx="3" fill="#4E5964"/><text x="707.4875" y="236" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">4.82</text><text x="577" y="269" font-size="11" fill="#1C232C" text-anchor="end">ResNet (ILSVRC'15)</text><rect x="585" y="256" width="87.01875" height="18" rx="3" fill="#EB6834"/><text x="677.01875" y="269" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">3.57</text><text x="410" y="400" font-size="11" fill="#4E5964" text-anchor="middle">152 층 단일 모델(4.49, 검증)이 앞선 앙상블(4.82, 시험)보다 낮다고 논문이 적는다 — 검증과 시험을 가로지른 비교다</text></svg>
