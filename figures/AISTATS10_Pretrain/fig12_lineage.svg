<svg xmlns="http://www.w3.org/2000/svg" width="820" height="372" viewBox="0 0 820 372" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="앞선 논문 넷에서 이 논문으로, 그리고 다음에 읽을 다섯 편으로 이어지는 계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="a12" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">이 논문이 서 있는 자리와 여는 다음 자리</text><rect x="30" y="60" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.3"/><text x="135" y="82" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">DBN (2006)</text><text x="135" y="101" font-size="10.5" fill="#4E5964" text-anchor="middle">층별 사전학습을 낸다</text><line x1="242.0" y1="86.0" x2="300.0" y2="196.0" stroke="#4E5964" stroke-width="1.2" marker-end="url(#a12)"/><rect x="30" y="130" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.3"/><text x="135" y="152" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">오토인코더 (2006)</text><text x="135" y="171" font-size="10.5" fill="#4E5964" text-anchor="middle">같은 쌓기를 차원 축소에</text><line x1="242.0" y1="156.0" x2="300.0" y2="196.0" stroke="#4E5964" stroke-width="1.2" marker-end="url(#a12)"/><rect x="30" y="200" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.3"/><text x="135" y="222" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">탐욕 층별 학습 (2007)</text><text x="135" y="241" font-size="10.5" fill="#4E5964" text-anchor="middle">최적화 가설 · 20 유닛 실험</text><line x1="242.0" y1="226.0" x2="300.0" y2="196.0" stroke="#4E5964" stroke-width="1.2" marker-end="url(#a12)"/><rect x="30" y="270" width="210" height="52" rx="8" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.3"/><text x="135" y="292" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">Erhan 외 (2009b)</text><text x="135" y="311" font-size="10.5" fill="#4E5964" text-anchor="middle">정규화 가설 · 400 초기화</text><line x1="242.0" y1="296.0" x2="300.0" y2="196.0" stroke="#4E5964" stroke-width="1.2" marker-end="url(#a12)"/><rect x="304" y="150" width="220" height="92" rx="10" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="414" y="176" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">이 노트 (AISTATS 2010)</text><text x="414" y="198" font-size="11" fill="#4E5964" text-anchor="middle">MNIST: 정규화와 맞는다</text><text x="414" y="216" font-size="11" fill="#4E5964" text-anchor="middle">온라인: 이득이 남는다</text><text x="414" y="234" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">→ 앞 예시가 구역을 정한다</text><rect x="580" y="52" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1" stroke-dasharray="4,3"/><text x="690" y="73" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">JMLR 2010 저널판</text><text x="690" y="91" font-size="10.5" fill="#4E5964" text-anchor="middle">같은 물음의 긴 판</text><line x1="526.0" y1="196.0" x2="578.0" y2="77.0" stroke="#7A8590" stroke-width="1.1" marker-end="url(#a12)"/><rect x="580" y="116" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1" stroke-dasharray="4,3"/><text x="690" y="137" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">Glorot · Bengio (AISTATS 2010)</text><text x="690" y="155" font-size="10.5" fill="#4E5964" text-anchor="middle">같은 학회 · 초기화로 대신</text><line x1="526.0" y1="196.0" x2="578.0" y2="141.0" stroke="#7A8590" stroke-width="1.1" marker-end="url(#a12)"/><rect x="580" y="180" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1" stroke-dasharray="4,3"/><text x="690" y="201" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">Hessian-free (ICML 2010)</text><text x="690" y="219" font-size="10.5" fill="#4E5964" text-anchor="middle">「더 센 최적화」의 실제 예</text><line x1="526.0" y1="196.0" x2="578.0" y2="205.0" stroke="#7A8590" stroke-width="1.1" marker-end="url(#a12)"/><rect x="580" y="244" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1" stroke-dasharray="4,3"/><text x="690" y="265" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">Curriculum learning (2009)</text><text x="690" y="283" font-size="10.5" fill="#4E5964" text-anchor="middle">앞 예시의 순서를 고른다</text><line x1="526.0" y1="196.0" x2="578.0" y2="269.0" stroke="#7A8590" stroke-width="1.1" marker-end="url(#a12)"/><rect x="580" y="308" width="220" height="50" rx="8" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.1" stroke-dasharray="4,3"/><text x="690" y="329" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">Stacked DAE (JMLR 2010)</text><text x="690" y="347" font-size="10.5" fill="#4E5964" text-anchor="middle">3 층에서 DAE 가 앞선 까닭</text><line x1="526.0" y1="196.0" x2="578.0" y2="333.0" stroke="#7A8590" stroke-width="1.1" marker-end="url(#a12)"/></svg>
