<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="식 2와 3의 구역별 균일 사전분포를 다섯 구역 예시로 그린 것"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="410" y="28" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">식 (2) · (3) — 매개변수 공간을 끌림 구역으로 나누고, 구역마다 밀도를 고르게 둔다</text><text x="70" y="62" font-size="12" fill="#B4552B" text-anchor="start" font-weight="600">사전학습  π(k) / v(k)</text><line x1="70.0" y1="180.0" x2="750.0" y2="180.0" stroke="#4E5964" stroke-width="1.2"/><rect x="72" y="172.85714285714286" width="81.0" height="7.142857142857144" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="112.5" y="166.85714285714286" font-size="10.5" fill="#B4552B" text-anchor="middle">0.05</text><text x="112.5" y="195" font-size="10" fill="#7A8590" text-anchor="middle">R1 (v=1, π=0.05)</text><rect x="157.0" y="172.85714285714286" width="166.0" height="7.142857142857144" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="240.0" y="166.85714285714286" font-size="10.5" fill="#B4552B" text-anchor="middle">0.05</text><text x="240.0" y="195" font-size="10" fill="#7A8590" text-anchor="middle">R2 (v=2, π=0.1)</text><line x1="155.0" y1="70.0" x2="155.0" y2="184.0" stroke="#CFD6D3" stroke-width="1" stroke-dasharray="3,3"/><rect x="327.0" y="80.0" width="81.0" height="100.0" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="367.5" y="74.0" font-size="10.5" fill="#B4552B" text-anchor="middle">0.7</text><text x="367.5" y="195" font-size="10" fill="#7A8590" text-anchor="middle">R3 (v=1, π=0.7)</text><line x1="325.0" y1="70.0" x2="325.0" y2="184.0" stroke="#CFD6D3" stroke-width="1" stroke-dasharray="3,3"/><rect x="412.0" y="177.61904761904762" width="251.0" height="2.3809523809523814" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="537.5" y="171.61904761904762" font-size="10.5" fill="#B4552B" text-anchor="middle">0.0167</text><text x="537.5" y="195" font-size="10" fill="#7A8590" text-anchor="middle">R4 (v=3, π=0.05)</text><line x1="410.0" y1="70.0" x2="410.0" y2="184.0" stroke="#CFD6D3" stroke-width="1" stroke-dasharray="3,3"/><rect x="667.0" y="165.71428571428572" width="81.0" height="14.285714285714288" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="707.5" y="159.71428571428572" font-size="10.5" fill="#B4552B" text-anchor="middle">0.1</text><text x="707.5" y="195" font-size="10" fill="#7A8590" text-anchor="middle">R5 (v=1, π=0.1)</text><line x1="665.0" y1="70.0" x2="665.0" y2="184.0" stroke="#CFD6D3" stroke-width="1" stroke-dasharray="3,3"/><text x="70" y="212" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="600">무작위 초기화  r(k) / v(k)</text><line x1="70.0" y1="330.0" x2="750.0" y2="330.0" stroke="#4E5964" stroke-width="1.2"/><rect x="72" y="287.1428571428571" width="81.0" height="42.85714285714286" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="112.5" y="281.1428571428571" font-size="10.5" fill="#2E6B8A" text-anchor="middle">0.3</text><text x="112.5" y="345" font-size="10" fill="#7A8590" text-anchor="middle">R1 (v=1, r=0.3)</text><rect x="157.0" y="312.14285714285717" width="166.0" height="17.857142857142858" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="240.0" y="306.14285714285717" font-size="10.5" fill="#2E6B8A" text-anchor="middle">0.125</text><text x="240.0" y="345" font-size="10" fill="#7A8590" text-anchor="middle">R2 (v=2, r=0.25)</text><line x1="155.0" y1="220.0" x2="155.0" y2="334.0" stroke="#CFD6D3" stroke-width="1" stroke-dasharray="3,3"/><rect x="327.0" y="322.85714285714283" width="81.0" height="7.142857142857144" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="367.5" y="316.85714285714283" font-size="10.5" fill="#2E6B8A" text-anchor="middle">0.05</text><text x="367.5" y="345" font-size="10" fill="#7A8590" text-anchor="middle">R3 (v=1, r=0.05)</text><line x1="325.0" y1="220.0" x2="325.0" y2="334.0" stroke="#CFD6D3" stroke-width="1" stroke-dasharray="3,3"/><rect x="412.0" y="315.7142857142857" width="251.0" height="14.285714285714285" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="537.5" y="309.7142857142857" font-size="10.5" fill="#2E6B8A" text-anchor="middle">0.1</text><text x="537.5" y="345" font-size="10" fill="#7A8590" text-anchor="middle">R4 (v=3, r=0.3)</text><line x1="410.0" y1="220.0" x2="410.0" y2="334.0" stroke="#CFD6D3" stroke-width="1" stroke-dasharray="3,3"/><rect x="667.0" y="315.7142857142857" width="81.0" height="14.285714285714288" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="707.5" y="309.7142857142857" font-size="10.5" fill="#2E6B8A" text-anchor="middle">0.1</text><text x="707.5" y="345" font-size="10" fill="#7A8590" text-anchor="middle">R5 (v=1, r=0.1)</text><line x1="665.0" y1="220.0" x2="665.0" y2="334.0" stroke="#CFD6D3" stroke-width="1" stroke-dasharray="3,3"/><text x="410" y="375" font-size="11.5" fill="#4E5964" text-anchor="middle">작은 예시: R3 는 부피 1 에 확률 0.70 이라 밀도 0.70, R4 는 부피 3 에 확률 0.05 라 밀도 0.0167 — 42 배 차이다.</text><text x="410" y="395" font-size="11.5" fill="#4E5964" text-anchor="middle">정규화 항은 −log P(θ) 이므로 확률 0 인 구역 바깥은 벌점이 무한대다. 「무한 벌점」 이라는 말이 이 뜻이다.</text><text x="410" y="415" font-size="11" fill="#C0392B" text-anchor="middle">숫자는 내가 고른 예시다 — 논문은 π(k) 와 r(k) 의 값을 하나도 재지 않는다.</text></svg>
