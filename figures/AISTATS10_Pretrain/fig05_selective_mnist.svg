<svg xmlns="http://www.w3.org/2000/svg" width="820" height="414" viewBox="0 0 820 414" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="아래 k 층만 사전학습했을 때 마지막 에폭의 학습 NLL과 시험 NLL"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="410" y="26" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">원 그림 2 위 — 아래 k 층만 RBM 으로 사전학습한 3 층 망의 마지막 에폭 (MNIST)</text><rect x="90" y="50" width="400" height="290" rx="2" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><line x1="90.0" y1="50.0" x2="90.0" y2="340.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="90.0" y="355" font-size="10.5" fill="#7A8590" text-anchor="middle">1e-5</text><line x1="223.3" y1="50.0" x2="223.3" y2="340.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="223.33333333333331" y="355" font-size="10.5" fill="#7A8590" text-anchor="middle">1e-4</text><line x1="356.7" y1="50.0" x2="356.7" y2="340.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="356.66666666666663" y="355" font-size="10.5" fill="#7A8590" text-anchor="middle">1e-3</text><line x1="490.0" y1="50.0" x2="490.0" y2="340.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="490.0" y="355" font-size="10.5" fill="#7A8590" text-anchor="middle">1e-2</text><line x1="90.0" y1="296.0" x2="490.0" y2="296.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="84" y="300.0239722971264" font-size="10.5" fill="#7A8590" text-anchor="end">0.04</text><line x1="90.0" y1="234.0" x2="490.0" y2="234.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="84" y="238.04324240752976" font-size="10.5" fill="#7A8590" text-anchor="end">0.06</text><line x1="90.0" y1="190.1" x2="490.0" y2="190.1" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="84" y="194.06721470465627" font-size="10.5" fill="#7A8590" text-anchor="end">0.08</text><line x1="90.0" y1="156.0" 