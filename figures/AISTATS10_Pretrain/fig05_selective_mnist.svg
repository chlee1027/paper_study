x="520" y="50" width="270" height="290" rx="8" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><text x="655" y="74" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">층을 하나 더 사전학습할 때</text><text x="655" y="92" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">시험 NLL 이 줄어드는 몫</text><text x="540" y="124" font-size="11.5" fill="#2E6B8A" text-anchor="start" font-weight="600">k = 0 → 1</text><text x="540" y="144" font-size="11" fill="#4E5964" text-anchor="start">0.123 → 0.081  (차 0.042, 비 1.52)</text><text x="540" y="170" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">k = 1 → 2</text><text x="540" y="190" font-size="11" fill="#4E5964" text-anchor="start">0.081 → 0.064  (차 0.017, 비 1.27)</text><text x="540" y="216" font-size="11.5" fill="#7D4E9C" text-anchor="start" font-weight="600">k = 2 → 3</text><text x="540" y="236" font-size="11" fill="#4E5964" text-anchor="start">0.064 → 0.047  (차 0.017, 비 1.36)</text><text x="655" y="280" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">첫 층의 몫이 가장 크다.</text><text x="655" y="300" font-size="11" fill="#C0392B" text-anchor="middle">본문은 「첫 층에서는 아니다」라고 적는다</text><text x="655" y="320" font-size="11" fill="#7A8590" text-anchor="middle">(논문 5절)</text><text x="410" y="398" font-size="11" fill="#4E5964" text-anchor="middle">학습 NLL 은 k 를 따라 4.9e-5 → 1.8e-3 으로 37 배 올라가고 시험 NLL 은 내려간다 — 정규화 쪽 예측과 맞는다</text></svg>
