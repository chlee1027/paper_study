<svg xmlns="http://www.w3.org/2000/svg" width="820" height="352" viewBox="0 0 820 352" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="맨 위 층을 20 유닛으로 묶었을 때 사전학습 유무에 따른 학습 NLL과 시험 NLL"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="410" y="26" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">원 그림 2 아래 — 맨 위 층을 20 유닛으로 묶고 조기 종료 없이 끝까지 (MNIST)</text><rect x="90" y="50" width="380" height="250" rx="2" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><line x1="90.0" y1="50.0" x2="90.0" y2="300.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="90.0" y="315" font-size="10.5" fill="#7A8590" text-anchor="middle">1e-5</text><line x1="280.0" y1="50.0" x2="280.0" y2="300.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="280.0" y="315" font-size="10.5" fill="#7A8590" text-anchor="middle">1e-4</text><line x1="470.0" y1="50.0" x2="470.0" y2="300.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="470.0" y="315" font-size="10.5" fill="#7A8590" text-anchor="middle">1e-3</text><line x1="90.0" y1="300.0" x2="470.0" y2="300.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="84" y="304.0" font-size="10.5" fill="#7A8590" text-anchor="end">0.06</text><line x1="90.0" y1="221.5" x2="470.0" y2="221.5" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="84" y="225.5090629959325" font-size="10.5" fill="#7A8590" text-anchor="end">0.08</text><line x1="90.0" y1="160.6" x2="470.0" y2="160.6" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="84" y="164.62676233743997" font-size="10.5" fill="#7A8590" text-anchor="end">0.1</text><line x1="90.0" y1="110.9" x2="470.0" y2="110.9" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="84" y="114.88230065849251" font-size="10.5" fill="#7A8590" text-anchor="end">0.12</text><line x1="90.0" y1="50.0" x2="470.0" y2="50.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2,3"/><text x="84" y="54.0" font-size="10.5" fill="#7A8590" text-anchor="end">0.15</text><text x="280.0" y="333" font-size="11" fill="#4E5964" text-anchor="middle">학습 NLL</text><text x="46" y="175.0" font-size="11" fill="#4E5964" text-anchor="middle" transform="rotate(-90 46 175.0)">시험 NLL</text><circle cx="180.7" cy="152.6" r="7" fill="#4E5964" stroke="#4E5964" stroke-width="1.2"/><text x="192.6530383967359" y="156.56196335680264" font-size="11" fill="#4E5964" text-anchor="start" font-weight="600">사전학습 없음 (3.0e-05, 0.103)</text><circle cx="266.6" cy="208.2" r="7" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><text x="278.58959588571565" y="212.19719524691635" font-size="11" fill="#B4552B" text-anchor="start" font-weight="600">DAE 사전학습 (8.5e-05, 0.084)</text><rect x="500" y="50" width="290" height="250" rx="8" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><text x="645" y="76" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">읽는 법</text><text x="516" y="104" font-size="11.5" fill="#4E5964" text-anchor="start">사전학습 쪽 학습 NLL 이 2.8 배 높고</text><text x="516" y="125" font-size="11.5" fill="#4E5964" text-anchor="start">시험 NLL 은 0.82 배다.</text><text x="516" y="146" font-size="11.5" fill="#4E5964" text-anchor="start">Bengio 외(2007)의 「최적화」 결론을</text><text x="516" y="167" font-size="11.5" fill="#4E5964" text-anchor="start">조기 종료를 빼고 다시 잰 것이다.</text><text x="516" y="188" font-size="11.5" fill="#4E5964" text-anchor="start"></text><text x="516" y="209" font-size="11.5" fill="#4E5964" text-anchor="start">각주 1 은 이 판과 위 판(k=3)을</text><text x="516" y="230" font-size="11.5" fill="#4E5964" text-anchor="start">맞대어 「20 유닛이 학습 오차를</text><text x="516" y="251" font-size="11.5" fill="#C0392B" text-anchor="start">낮춘다」고 적는데, 위 판은 RBM,</text><text x="516" y="272" font-size="11.5" fill="#C0392B" text-anchor="start">이 판은 DAE 다 — 두 가지가 함께 바뀐다.</text></svg>
