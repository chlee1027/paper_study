<svg xmlns="http://www.w3.org/2000/svg" width="820" height="346" viewBox="0 0 820 346" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="사전학습 없는 망과 있는 망의 갱신 예산 비교, 그리고 망 크기를 센 값"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="410" y="28" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">InfiniteMNIST 의 갱신 예산 — 모두 1 천만 번인데 지도 학습 몫이 다르다</text><text x="160" y="88" font-size="12" fill="#1C232C" text-anchor="end" font-weight="600">사전학습 없음</text><rect x="170.0" y="66" width="600.0" height="34" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="470.0" y="88" font-size="11.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">지도 1 천만</text><text x="160" y="138" font-size="12" fill="#1C232C" text-anchor="end" font-weight="600">사전학습 있음</text><rect x="170.0" y="116" width="150.0" height="34" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="245.0" y="138" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">비지도 250 만</text><rect x="320.0" y="116" width="450.0" height="34" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="545.0" y="138" font-size="11.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">지도 750 만</text><text x="170.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">0</text><text x="230.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">1</text><text x="290.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">2</text><text x="350.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">3</text><text x="410.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">4</text><text x="470.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">5</text><text x="530.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">6</text><text x="590.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">7</text><text x="650.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">8</text><text x="710.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">9</text><text x="770.0" y="166" font-size="10.5" fill="#7A8590" text-anchor="middle">10</text><text x="470" y="184" font-size="11" fill="#4E5964" text-anchor="middle">본 예시 수 (백만) — 그림 3 · 7 의 가로축이 이 눈금이다. 사전학습 곡선은 250 만에서 시작한다</text><rect x="40" y="202" width="740" height="130" rx="8" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><text x="60" y="226" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="600">망의 크기 (논문 4 · 6.1절). 가중치와 치우침을 내가 센 값:</text><text x="60" y="250" font-size="11.5" fill="#4E5964" text-anchor="start">1 층 망 — 은닉 2500: 1,987,510 개</text><text x="60" y="272" font-size="11.5" fill="#4E5964" text-anchor="start">3 층 망 — 층마다 800 · 1000 · 1200: 1,917,610 · 2,797,010 · 3,836,410 개</text><text x="60" y="294" font-size="11.5" fill="#1C232C" text-anchor="start">3 층 / 1 층 = 0.96 ~ 1.93 배 — 「깊은 망이 더 크다」도 「같은 크기다」도 아니고, 층 폭에 따라 1 배를 사이에 둔다</text><text x="60" y="318" font-size="11" fill="#C0392B" text-anchor="start">비지도 250 만 번이 층 셋에 어떻게 나뉘는지는 본문에 적혀 있지 않다</text></svg>
