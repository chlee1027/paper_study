<svg xmlns="http://www.w3.org/2000/svg" width="820" height="368" viewBox="0 0 820 368" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="최적화 가설과 정규화 가설, 그리고 세 물음에 대한 각 가설의 예측"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="410" y="30" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">사전학습이 돕는 까닭 — 논문이 맞세우는 두 설명</text><rect x="40" y="48" width="350" height="74" rx="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="215" y="72" font-size="13.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">최적화 가설</text><text x="215" y="92" font-size="11" fill="#7A8590" text-anchor="middle">Bengio 외 2007</text><text x="215" y="111" font-size="11.5" fill="#4E5964" text-anchor="middle">학습 기준을 더 잘 내리게 해 준다</text><rect x="430" y="48" width="350" height="74" rx="8" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="605" y="72" font-size="13.5" fill="#B4552B" text-anchor="middle" font-weight="600">정규화 가설</text><text x="605" y="92" font-size="11" fill="#7A8590" text-anchor="middle">Erhan 외 2009b</text><text x="605" y="111" font-size="11.5" fill="#4E5964" text-anchor="middle">갈 수 있는 매개변수 구역을 좁힌다</text><text x="410" y="150" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">사전학습한 망의 학습 오차</text><rect x="40" y="158" width="350" height="26" rx="5" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><text x="215" y="176" font-size="11.5" fill="#2E6B8A" text-anchor="middle">더 낮다</text><rect x="430" y="158" width="350" height="26" rx="5" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><text x="605" y="176" font-size="11.5" fill="#B4552B" text-anchor="middle">더 높다 (시험 오차는 낮다)</text><text x="410" y="196" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">층을 아주 작게 만들면</text><rect x="40" y="204" width="350" height="26" rx="5" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><text x="215" y="222" font-size="11.5" fill="#2E6B8A" text-anchor="middle">그래도 돕는다</text><rect x="430" y="204" width="350" height="26" rx="5" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><text x="605" y="222" font-size="11.5" fill="#B4552B" text-anchor="middle">오히려 해롭다</text><text x="410" y="242" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">데이터가 끝없이 늘면</text><rect x="40" y="250" width="350" height="26" rx="5" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><text x="215" y="268" font-size="11.5" fill="#2E6B8A" text-anchor="middle">남는다</text><rect x="430" y="250" width="350" height="26" rx="5" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1"/><text x="605" y="268" font-size="11.5" fill="#B4552B" text-anchor="middle">흔한 정규화라면 사라진다</text><rect x="40" y="296" width="740" height="56" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="410" y="318" font-size="11.5" fill="#4E5964" text-anchor="middle">MNIST (논문 5절) 는 위 두 줄에서 정규화 쪽 예측과 맞는다.</text><text x="410" y="340" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">InfiniteMNIST (논문 6절) 에서는 셋째 줄이 「남는다」로 나와, 논문은 둘을 엮는 설명(논문 7절)으로 간다.</text></svg>
