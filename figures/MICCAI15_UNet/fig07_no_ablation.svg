<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 290" width="780" height="290"><rect width="780" height="290" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">장치마다 그 장치를 뺀 값이 있는가 (읽은 8 쪽 안에서)</text><rect x="20.0" y="44.0" width="740.0" height="28.0" fill="#f4f4f4" stroke="none"/><text x="32.0" y="63.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">겹침 조각 · 거울상</text><text x="250.0" y="63.0" font-size="12" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">그림 2 로만 보인다</text><rect x="20.0" y="78.0" width="740.0" height="28.0" fill="#f4f4f4" stroke="none"/><text x="32.0" y="97.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">경계 가중치 식 (2)</text><text x="250.0" y="97.0" font-size="12" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">그림 3d 로만 보인다</text><rect x="20.0" y="112.0" width="740.0" height="28.0" fill="#f4f4f4" stroke="none"/><text x="32.0" y="131.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">탄성 변형</text><text x="250.0" y="131.0" font-size="12" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">결론의 「덕분에」 뿐, 끈 실험을 찾지 못했다</text><rect x="20.0" y="146.0" width="740.0" height="28.0" fill="#f4f4f4" stroke="none"/><text x="32.0" y="165.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">길게 잇는 연결</text><text x="250.0" y="165.0" font-size="12" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">끈 실험을 찾지 못했다</text><rect x="20.0" y="180.0" width="740.0" height="28.0" fill="#f4f4f4" stroke="none"/><text x="32.0" y="199.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">드롭아웃</text><text x="250.0" y="199.0" font-size="12" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">뺀 값도, 비율도 적혀 있지 않다</text><rect x="20.0" y="214.0" width="740.0" height="28.0" fill="#f4f4f4" stroke="none"/><text x="32.0" y="233.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">7 회전 평균</text><text x="250.0" y="233.0" font-size="12" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">EM 값에 쓰였고, 뺀 값은 적혀 있지 않다</text><rect x="20.0" y="248.0" width="740.0" height="28.0" fill="#f4f4f4" stroke="none"/><text x="32.0" y="267.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 1 · 표 2</text><text x="250.0" y="267.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">최종 모델의 값이 데이터마다 한 줄씩</text></svg>