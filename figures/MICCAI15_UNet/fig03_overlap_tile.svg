<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 290" width="860" height="290"><rect width="860" height="290" fill="#ffffff"/><text x="20.0" y="24.0" font-size="13" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">겹침 조각: 512 x 512 이미지를 572 입력 · 388 출력으로 덮는 최소 배치 (내 계산, 원문은 조각 수를 적지 않았다)</text><rect x="70.0" y="72.0" width="169.0" height="169.0" fill="#e8eef6" stroke="#2f6db3"/><text x="154.5" y="275.0" font-size="12" fill="#2f6db3" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원본 512 x 512</text><rect x="70.0" y="72.0" width="128.0" height="128.0" fill="none" stroke="#c8553d"/><rect x="110.9" y="112.9" width="128.0" height="128.0" fill="none" stroke="#4a9a6a"/><rect x="39.6" y="41.6" width="188.8" height="188.8" fill="none" stroke="#8a8a8a"/><text x="290.0" y="80.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">회색: 첫 조각의 입력 572 x 572. 위 · 왼쪽 92 픽셀은 원본 밖이라 거울상으로 채운다</text><text x="290.0" y="108.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">빨강: 첫 조각의 출력 388 x 388</text><text x="290.0" y="136.0" font-size="13" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">초록: 대각 조각의 출력 388 x 388</text><text x="290.0" y="164.0" font-size="13" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">한 변에 2 조각이면 2 x 388 = 776 &gt;= 512 라 조각 4 개로 덮인다</text><text x="290.0" y="192.0" font-size="13" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">한 변의 겹침은 776 - 512 = 264 픽셀</text><text x="290.0" y="220.0" font-size="13" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">거울상까지 넣은 입력 영역은 한 변 512 + 2 x 92 = 696 픽셀</text></svg>