<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280"><rect width="720" height="280" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 2c 를 두 요인으로 펼친다 (R50-C4, 평균 집계 기준, RoIPool 은 max 만 있음)</text><text x="310.0" y="50.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">쌍선형 없음</text><text x="530.0" y="50.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">쌍선형 있음</text><text x="190.0" y="99.0" font-size="12" fill="#222222" text-anchor="end" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">정렬 없음(양자화)</text><text x="190.0" y="169.0" font-size="12" fill="#222222" text-anchor="end" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">정렬 있음</text><rect x="200.0" y="60.0" width="220.0" height="70.0" fill="#f4f4f4" stroke="#cccccc"/><text x="310.0" y="99.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RoIPool  26.9 / 48.8 / 26.4</text><rect x="420.0" y="60.0" width="220.0" height="70.0" fill="#f4f4f4" stroke="#cccccc"/><text x="530.0" y="99.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RoIWarp  27.1 / 48.9 / 27.1</text><rect x="200.0" y="130.0" width="220.0" height="70.0" fill="#fbe9e5" stroke="#cccccc"/><text x="310.0" y="169.0" font-size="12" fill="#c8553d" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 칸의 값이 표에 없다</text><rect x="420.0" y="130.0" width="220.0" height="70.0" fill="#e8eef6" stroke="#cccccc"/><text x="530.0" y="169.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RoIAlign  30.3 / 51.2 / 31.5</text><text x="20.0" y="236.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">세 값은 AP / AP50 / AP75. RoIPool 에서 쌍선형만 더하면 AP +0.2, 그 위에 정렬까지 더하면 +3.2.</text><text x="20.0" y="256.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">캡션 「정렬이 유일한 요인」 은 정렬만 있는 칸 없이 내린 판단이다.</text></svg>