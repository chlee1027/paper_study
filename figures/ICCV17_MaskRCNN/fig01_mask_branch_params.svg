<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 240" width="780" height="240"><rect width="780" height="240" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 2e 의 마스크 가지 (R50-FPN). 파라미터는 내가 셈, MLP 의 첫 입력 층은 적혀 있지 않아 뺐다</text><text x="20.0" y="62.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">FCN: conv 256 x 4, deconv, 1 x 1</text><rect x="20.0" y="68.0" width="22.3" height="20.0" fill="#c8553d" stroke="none"/><text x="48.3" y="83.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">2,643,280  (AP 33.6)</text><text x="20.0" y="114.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">MLP: 1024 → 1024 → 80 · 28^2</text><rect x="20.0" y="120.0" width="551.1" height="20.0" fill="#8a8a8a" stroke="none"/><text x="577.1" y="135.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">65,337,600  (AP 31.5)</text><text x="20.0" y="166.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">MLP: 1024 → 1024 → 1024 → 80 · 28^2</text><rect x="20.0" y="172.0" width="560.0" height="20.0" fill="#8a8a8a" stroke="none"/><text x="586.0" y="187.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">66,387,200  (AP 31.5)</text><text x="20.0" y="228.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">MLP 두 층 / FCN = 24.7 배. 출력 하나만 80 x 28 x 28 = 62,720 차원이다.</text></svg>