<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 240" width="860" height="240"><rect width="860" height="240" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RoIPool 의 첫 양자화 [x / 16] 가 경계를 옮기는 양 (내 계산). RoIAlign 은 x / 16 을 그대로 쓴다</text><line x1="40.0" y1="80.0" x2="40.0" y2="96.0" stroke="#8a8a8a" stroke-width="1"/><text x="40.0" y="74.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0</text><line x1="72.0" y1="80.0" x2="72.0" y2="96.0" stroke="#8a8a8a" stroke-width="1"/><text x="72.0" y="74.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">16</text><line x1="104.0" y1="80.0" x2="104.0" y2="96.0" stroke="#8a8a8a" stroke-width="1"/><text x="104.0" y="74.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">32</text><line x1="136.0" y1="80.0" x2="136.0" y2="96.0" stroke="#8a8a8a" stroke-width="1"/><text x="136.0" y="74.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">48</text><line x1="168.0" y1="80.0" x2="168.0" y2="96.0" stroke="#8a8a8a" stroke-width="1"/><text x="168.0" y="74.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">64</text><line x1="200.0" y1="80.0" x2="200.0" y2="96.0" stroke="#8a8a8a" stroke-width="1"/><text x="200.0" y="74.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">80</text><line x1="232.0" y1="80.0" x2="232.0" y2="96.0" stroke="#8a8a8a" stroke-width="1"/><text x="232.0" y="74.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="norm