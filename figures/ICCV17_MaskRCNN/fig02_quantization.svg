] = 6 → 96 픽셀, 이동 4</text><circle cx="280.0" cy="152.0" r="5" fill="#2f6db3"/><circle cx="296.0" cy="152.0" r="5" fill="#c8553d"/><line x1="280.0" y1="152.0" x2="296.0" y2="152.0" stroke="#222222" stroke-width="1.5"/><text x="480.0" y="156.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">경계 120 → 120 / 16 = 7.50 → [·] = 8 → 128 픽셀, 이동 8</text><circle cx="380.0" cy="184.0" r="5" fill="#2f6db3"/><circle cx="392.0" cy="184.0" r="5" fill="#c8553d"/><line x1="380.0" y1="184.0" x2="392.0" y2="184.0" stroke="#222222" stroke-width="1.5"/><text x="480.0" y="188.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">경계 170 → 170 / 16 = 10.62 → [·] = 11 → 176 픽셀, 이동 6</text><text x="480.0" y="84.0" font-size="12" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">걸음 16 이면 이동은 최대 8 픽셀, 걸음 32 면 최대 16 픽셀</text></svg>