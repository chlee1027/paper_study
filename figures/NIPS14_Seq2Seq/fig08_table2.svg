<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 2 막대"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">표 2 (SMT 의 1000 후보를 다시 매김) — 뒤집기의 몫이 직접 번역에서 +4.42, 다시 매김에서 +0.24</text><line x1="260.0" y1="56" x2="260.0" y2="294" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="260.0" y="310" font-size="10" fill="#7A8590" text-anchor="middle">30</text><line x1="385.0" y1="56" x2="385.0" y2="294" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="385.0" y="310" font-size="10" fill="#7A8590" text-anchor="middle">34</text><line x1="510.0" y1="56" x2="510.0" y2="294" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="510.0" y="310" font-size="10" fill="#7A8590" text-anchor="middle">38</text><line x1="635.0" y1="56" x2="635.0" y2="294" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="635.0" y="310" font-size="10" fill="#7A8590" text-anchor="middle">42</text><line x1="760.0" y1="56" x2="760.0" y2="294" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="760.0" y="310" font-size="10" fill="#7A8590" text-anchor="middle">46</text><line x1="363.1249999999999" y1="52" x2="363.1249999999999" y2="294" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="5 3"/><text x="250" y="77" font-size="11" fill="#1C232C" text-anchor="end">기준 SMT [29]</text><rect x="260" y="60" width="103.12499999999989" height="22" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.1"/><text x="369.1249999999999" y="76" font-size="11" fill="#B4552B" text-anchor="start" font-weight="bold">33.30</text><text x="250" y="111" font-size="11" fill="#1C232C" text-anchor="end">Cho 외 [5]</text><rect x="260" y="94" width="141.875" height="22" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.1"/><text x="407.875" y="110" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">34.54</text><text x="250" y="145" font-size="11" fill="#1C232C" text-anchor="end">WMT'14 최고 [9]</text><rect x="260" y="128" width="218.75" height="22" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.1"/><text x="484.75" y="144" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">37.00</text><text x="250" y="179" font-size="11" fill="#1C232C" text-anchor="end">다시 매김 · 단일 · 정방향</text><rect x="260" y="162" width="175.3125" height="22" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.1"/><text x="441.3125" y="178" font-size="11" fill="#2E6B8A" text-anchor="start" font-weight="bold">35.61</text><text x="250" y="213" font-size="11" fill="#1C232C" text-anchor="end">다시 매김 · 단일 · 뒤집음</text><rect x="260" y="196" width="182.81250000000006" height="22" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.1"/><text x="448.81250000000006" y="212" font-size="11" fill="#2E6B8A" text-anchor="start" font-weight="bold">35.85</text><text x="250" y="247" font-size="11" fill="#1C232C" text-anchor="end">다시 매김 · 앙상블 5 · 뒤집음</text><rect x="260" y="230" width="203.125" height="22" rx="2" fill="#EADCF0" stroke="#8E44AD" stroke-width="1.1"/><text x="469.125" y="246" font-size="11" fill="#8E44AD" text-anchor="start" font-weight="bold">36.50</text><text x="250" y="281" font-size="11" fill="#1C232C" text-anchor="end">오라클 다시 매김 (~45)</text><rect x="260" y="264" width="468.75" height="22" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.1" stroke-dasharray="4 2"/><text x="734.75" y="280" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">~45</text><text x="20" y="330" font-size="11" fill="#4E5964" text-anchor="start">다시 매김 점수 = SMT 점수와 LSTM 로그 확률의 단순 평균(원문 「even average」). 무게를 고르지 않았다.</text><text x="20" y="352" font-size="11" fill="#4E5964" text-anchor="start">37.0 은 저자들이 같은 스크립트로 다시 낸 값이다(statmt.org 공지 값은 35.8). 같은 시스템의 점수가 셈 방식으로 1.2 갈린다.</text><text x="20" y="374" font-size="11" fill="#7A8590" text-anchor="start">오라클 ~45 는 1000 후보 안의 가장 좋은 후보를 골랐을 때의 값이다 — 다시 매김이 닿을 수 있는 천장.</text></svg>
