 fill="#4E5964" text-anchor="start">빔 2  34.50  (+1.50)</text><text x="560" y="130" font-size="11" fill="#4E5964" text-anchor="start">빔 12 34.81  (+0.31)</text><text x="560" y="150" font-size="11" fill="#1E8449" text-anchor="start" font-weight="bold">빔 1 -&gt; 12 의 +1.81 가운데 빔 2 가 82.9%</text><text x="560" y="170" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="560" y="190" font-size="11" fill="#4E5964" text-anchor="start">원문 「빔 1 에서도 잘한다」 는 앙상블 5 의 값</text><text x="560" y="210" font-size="11" fill="#4E5964" text-anchor="start">33.00 이다. 단일 모델의 빔 1 값은 표에 없다</text><text x="560" y="230" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="560" y="250" font-size="11" fill="#4E5964" text-anchor="start">캡션 「앙상블 5 빔 2 가 단일 빔 12 보다 싸다」:</text><text x="560" y="270" font-size="11" fill="#4E5964" text-anchor="start">모델 x 빔 = 10 대 12 로 맞다(내가 센 것)</text><text x="560" y="290" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="560" y="310" font-size="11" fill="#C0392B" text-anchor="start" font-weight="bold">모든 값이 실행 하나다. 흩어짐이 없다</text></svg>
