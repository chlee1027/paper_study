<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="학습 시간 다시 세기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">학습 시간 다시 세기 — (3억 4,800만 + 3억 400만) 낱말 x 7.5 바퀴 / 초당 6,300 낱말 = 8.98 일. 원문 「열흘 남짓(about a ten days)」</text><text x="310" y="100" font-size="11" fill="#1C232C" text-anchor="end">GPU 8 장 (층마다 GPU 하나 + 소프트맥스 넷)</text><rect x="320" y="80" width="124.77341759749163" height="30" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="452.77341759749163" y="100" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">8.98 일</text><text x="310" y="160" font-size="11" fill="#1C232C" text-anchor="end">GPU 1 장 (같은 속도로 셈)</text><rect x="320" y="140" width="462.3956063907044" height="30" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="790.3956063907044" y="160" font-size="12" fill="#B4552B" text-anchor="start" font-weight="bold">33.29 일</text><line x1="458.8888888888889" y1="70" x2="458.8888888888889" y2="200" stroke="#1E8449" stroke-width="1.4" stroke-dasharray="4 3"/><text x="458.8888888888889" y="215" font-size="11" fill="#1E8449" text-anchor="middle">원문의 열흘</text><text x="320.0" y="240" font-size="10" fill="#7A8590" text-anchor="middle">0 일</text><text x="458.8888888888889" y="240" font-size="10" fill="#7A8590" text-anchor="middle">10 일</text><text x="597.7777777777778" y="240" font-size="10" fill="#7A8590" text-anchor="middle">20 일</text><text x="736.6666666666667" y="240" font-size="10" fill="#7A8590" text-anchor="middle">30 일</text><text x="20" y="270" font-size="11" fill="#4E5964" text-anchor="start">속도는 원문 3.5절: 단일 GPU 초당 1,700 낱말, 8 GPU 초당 6,300 낱말(영어와 프랑스어를 함께 셈). 8 장으로 3.71 배, GPU 한 장당 46% (내가 센 것).</text><text x="20" y="292" font-size="11" fill="#7A8590" text-anchor="start">앙상블 다섯은 학습 시간이 적혀 있지 않다. 같은 설정이라고 두면 8 GPU 기계로 44.9 일 몫이다(8.98 x 5, 내가 센 것 — 원문은 이 값을 적지 않는다).</text></svg>
