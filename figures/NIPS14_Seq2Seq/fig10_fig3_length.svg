<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="원문 그림 3 왼쪽 옮김"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">원문 그림 3 왼쪽 — 문장 길이별 BLEU. 가장 긴 칸(35 ~ 79 낱말)에서 LSTM 앙상블이 2.16 내려가 SMT 와의 차이가 +0.14 로 준다</text><line x1="80" y1="330" x2="560" y2="330" stroke="#4E5964" stroke-width="1.2"/><line x1="80" y1="60" x2="80" y2="330" stroke="#4E5964" stroke-width="1.2"/><line x1="76" y1="330.0" x2="80" y2="330.0" stroke="#4E5964" stroke-width="1"/><text x="73" y="334.0" font-size="10" fill="#7A8590" text-anchor="end">20</text><line x1="80" y1="330.0" x2="560" y2="330.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="76" y1="262.5" x2="80" y2="262.5" stroke="#4E5964" stroke-width="1"/><text x="73" y="266.5" font-size="10" fill="#7A8590" text-anchor="end">25</text><line x1="80" y1="262.5" x2="560" y2="262.5" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="76" y1="195.0" x2="80" y2="195.0" stroke="#4E5964" stroke-width="1"/><text x="73" y="199.0" font-size="10" fill="#7A8590" text-anchor="end">30</text><line x1="80" y1="195.0" x2="560" y2="195.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="76" y1="127.5" x2="80" y2="127.5" stroke="#4E5964" stroke-width="1"/><text x="73" y="131.5" font-size="10" fill="#7A8590" text-anchor="end">35</text><line x1="80" y1="127.5" x2="560" y2="127.5" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="76" y1="60.0" x2="80" y2="60.0" stroke="#4E5964" stroke-width="1"/><text x="73" y="64.0" font-size="10" fill="#7A8590" text-anchor="end">40</text><line x1="80" y1="60.0" x2="560" y2="60.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="80" y="50" font-size="11" fill="#4E5964" text-anchor="start">BLEU</text><text x="80.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">4</text><text x="140.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">7</text><text x="200.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">8</text><text x="260.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">12</text><text x="320.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">17</text><text x="380.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">22</text><text x="440.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">28</text><text x="500.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">35</text><text x="560.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">79</text><text x="320.0" y="366" font-size="10" fill="#4E5964" text-anchor="middle">길이 순으로 놓은 시험 문장 — 눈금 글자는 그 자리 문장의 낱말 수(원문 그대로, 칸 사이를 같게 폈다)</text><path d="M140.0,179.1 L200.0,277.7 L260.0,143.8 L320.0,151.7 L380.0,131.5 L440.0,1