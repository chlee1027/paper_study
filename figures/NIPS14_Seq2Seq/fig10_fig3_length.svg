10" fill="#7A8590" text-anchor="start">(늘려 읽으면 0.1 · 0.0)</text><text x="566.0" y="127.61786994109198" font-size="11" fill="#2E6B8A" text-anchor="start" font-weight="bold">34.25</text><text x="566.0" y="153.50624049145222" font-size="11" fill="#B4552B" text-anchor="start" font-weight="bold">34.11</text><text x="500.0" y="98.47466670512142" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">36.41</text><text x="500.0" y="165.0791904305254" font-size="11" fill="#B4552B" text-anchor="middle" font-weight="bold">33.55</text><text x="650" y="70" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">길이</text><text x="720" y="70" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">LSTM</text><text x="790" y="70" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">SMT</text><text x="860" y="70" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">차</text><text x="650" y="90" font-size="11" fill="#4E5964" text-anchor="end">7</text><text x="720" y="90" font-size="11" fill="#4E5964" text-anchor="end">31.18</text><text x="790" y="90" font-size="11" fill="#4E5964" text-anchor="end">27.71</text><text x="860" y="90" font-size="11" fill="#4E5964" text-anchor="end">+3.47</text><text x="650" y="110" font-size="11" fill="#4E5964" text-anchor="end">8</text><text x="720" y="110" font-size="11" fill="#4E5964" text-anchor="end">23.87</text><text x="790" y="110" font-size="11" fill="#4E5964" text-anchor="end">23.43</text><text x="860" y="110" font-size="11" fill="#4E5964" text-anchor="end">+0.44</text><text x="650" y="130" font-size="11" fill="#4E5964" text-anchor="end">12</text><text x="720" y="130" font-size="11" fill="#4E5964" text-anchor="end">33.79</text><text x="790" y="130" font-size="11" fill="#4E5964" text-anchor="end">31.12</text><text x="860" y="130" font-size="11" fill="#4E5964" text-anchor="end">+2.67</text><text x="650" y="150" font-size="11" fill="#4E5964" text-anchor="end">17</text><text x="720" y="150" font-size="11" fill="#4E5964" text-anchor="end">33.21</text><text x="790" y="150" font-size="11" fill="#4E5964" text-anchor="end">31.20</text><text x="860" y="150" font-size="11" fill="#4E5964" text-anchor="end">+2.01</text><text x="650" y="170" font-size="11" fill="#4E5964" text-anchor="end">22</text><text x="720" y="170" font-size="11" fill="#4E5964" text-anchor="end">34.70</text><text x="790" y="170" font-size="11" fill="#4E5964" text-anchor="end">33.22</text><text x="860" y="170" font-size="11" fill="#4E5964" text-anchor="end">+1.48</text><text x="650" y="190" font-size="11" fill="#4E5964" text-anchor="end">28</text><text x="720" y="190" font-size="11" fill="#4E5964" text-anchor="end">35.76</text><text x="790" y="190" font-size="11" fill="#4E5964" text-anchor="end">33.94</text><text x="860" y="190" font-size="11" fill="#4E5964" text-anchor="end">+1.82</text><text x="650" y="210" font-size="11" fill="#4E5964" text-anchor="end">35</text><text x="720" y="210" font-size="11" fill="#4E5964" text-anchor="end">36.41</text><text x="790" y="210" font-size="11" fill="#4E5964" text-anchor="end">33.55</text><text x="860" y="210" font-size="11" fill="#4E5964" text-anchor="end">+2.86</text><text x="650" y="230" font-size="11" fill="#4E5964" text-anchor="end">79</text><text x="720" y="230" font-size="11" fill="#4E5964" text-anchor="end">34.25</text><text x="790" y="230" font-size="11" fill="#4E5964" text-anchor="end">34.11</text><text x="860" y="230" font-size="11" fill="#4E5964" text-anchor="end">+0.14</text><text x="600" y="270" font-size="11" fill="#7A8590" text-anchor="start">LSTM = 앙상블 5 (범례 34.8). 정방향 모델의</text><text x="600" y="288" font-size="11" fill="#7A8590" text-anchor="start">곡선은 이 그림에 없다</text><text x="20" y="392" font-size="10.5" fill="#4E5964" text-anchor="start">값은 원문 PDF 안 벡터 선의 꼭짓점 좌표를 눈금으로 바꾼 것이다(내가 읽은 것, 눈금 기준 오차 0.02 BLEU 안). 칸마다 문장이 몇 개인지와 칸을 어떻게 나눴는지는 원문에 없다.</text><text x="20" y="412" font-size="10.5" fill="#7A8590" text-anchor="start">가장 짧은 칸은 두 곡선 모두 축 아래로 나가 원문에서 읽히지 않는다. 잘린 선분을 같은 직선으로 늘리면 LSTM 0.1 · SMT 0.0 이다.</text></svg>
