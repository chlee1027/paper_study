<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="파라미터 다시 세기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">파라미터 384M 을 층 · 폭 · 어휘로 다시 세면 384,112,000 — 그 가운데 83.3% 가 낱말 표와 소프트맥스다</text><rect x="40" y="80" width="341.5670429458075" height="46" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="210.78352147290374" y="100" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">160.0M</text><text x="210.78352147290374" y="116" font-size="10" fill="#2E6B8A" text-anchor="middle">41.7%</text><rect x="381.5670429458075" y="80" width="170.78352147290374" height="46" rx="0" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="466.9588036822594" y="100" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">80.0M</text><text x="466.9588036822594" y="116" font-size="10" fill="#B4552B" text-anchor="middle">20.8%</text><rect x="552.3505644187112" y="80" width="68.34756529345607" height="46" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><rect x="620.6981297121673" y="80" width="68.34756529345607" height="46" rx="0" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><rect x="689.0456950056234" y="80" width="170.95430499437663" height="46" rx="0" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="774.5228475028117" y="100" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">80.1M</text><text x="774.5228475028117" y="116" font-size="10" fill="#4E5964" text-anchor="middle">20.8%</text><rect x="40" y="149" width="12" height="12" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><text x="60" y="160" font-size="12" fill="#1C232C" text-anchor="start">원문 낱말 벡터 160,000 x 1,000</text><text x="470" y="160" font-size="12" fill="#1C232C" text-anchor="end">160,000,000</text><rect x="40" y="173" width="12" height="12" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="60" y="184" font-size="12" fill="#1C232C" text-anchor="start">번역 낱말 벡터 80,000 x 1,000</text><text x="470" y="184" font-size="12" fill="#1C232C" text-anchor="end">80,000,000</text><rect x="40" y="197" width="12" height="12" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><text x="60" y="208" font-size="12" fill="#1C232C" text-anchor="start">인코더 LSTM 4층</text><text x="470" y="208" font-size="12" fill="#1C232C" text-anchor="end">32,016,000</text><rect x="40" y="221" width="12" height="12" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="60" y="232" font-size="12" fill="#1C232C" text-anchor="start">디코더 LSTM 4층</text><text x="470" y="232" font-size="12" fill="#1C232C" text-anchor="end">32,016,000</text><rect x="40" y="245" width="12" height="12" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1"/><text x="60" y="256" font-size="12" fill="#1C232C" text-anchor="start">소프트맥스 1,000 x 80,000 + 치우침</text><text x="470" y="256" font-size="12" fill="#1C232C" text-anchor="end">80,080,000</text><line x1="40" y1="272" x2="470" y2="272" stroke="#4E5964" stroke-width="1"/><text x="60" y="290" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">합계</text><text x="470" y="290" font-size="12" fill="#1C232C" text-anchor="end" font-weight="bold">384,112,000</text><text x="500" y="160" font-size="11" fill="#4E5964" text-anchor="start">LSTM 한 층 = 문 넷 x (입력 1,000 + 되먹임 1,000) x 1,000</text><text x="500" y="180" font-size="11" fill="#4E5964" text-anchor="start">              + 치우침 4 x 1,000 = 8,004,000</text><text x="500" y="200" font-size="11" fill="#1E8449" text-anchor="start" font-weight="bold">4층 = 32,016,000 — 원문 「인코더 32M, 디코더 32M」 과 같다</text><text x="500" y="220" font-size="11" fill="#4E5964" text-anchor="start">원문의 「순수 되먹임 연결 64M」 은 h -&gt; h 만이 아니라</text><text x="500" y="240" font-size="11" fill="#4E5964" text-anchor="start">입력 -&gt; 문 무게까지 넣은 LSTM 전체다(h -&gt; h 만이면 16M)</text><text x="500" y="260" font-size="11" fill="#7A8590" text-anchor="start">Graves 꼴의 엿보기 연결(층마다 3,000)을 넣어도 +24,000 (8층)</text><text x="500" y="280" font-size="11" fill="#7A8590" text-anchor="start">번역 낱말 벡터나 소프트맥스 중 하나를 빼면 304M 이 된다 —</text><text x="500" y="300" font-size="11" fill="#7A8590" text-anchor="start">384M 은 둘을 따로 센 값이다</text></svg>
