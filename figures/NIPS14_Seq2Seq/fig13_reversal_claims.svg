<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="뒤집기 주장의 세기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">입력 뒤집기를 두고 한 말 — 잰 것은 단일 모델의 두 수(혼잡도 · BLEU)이고, 「왜」 는 3.3절 스스로 가설이라 적는다</text><rect x="20" y="60" width="860" height="74" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.3"/><text x="36" y="82" font-size="12.5" fill="#1E8449" text-anchor="start" font-weight="bold">잰 것</text><text x="52" y="106" font-size="11" fill="#1C232C" text-anchor="start">3.3절: 시험 혼잡도 5.8 -&gt; 4.7, 시험 BLEU 25.9 -&gt; 30.6 (단일 모델)</text><text x="52" y="128" font-size="11" fill="#1C232C" text-anchor="start">표 1: 단일 빔 12 정방향 26.17 -&gt; 뒤집음 30.59 / 표 2: 다시 매김 35.61 -&gt; 35.85</text><rect x="20" y="148" width="860" height="96" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.3"/><text x="36" y="170" font-size="12.5" fill="#9A7B00" text-anchor="start" font-weight="bold">가설이라고 적은 것</text><text x="52" y="194" font-size="11" fill="#1C232C" text-anchor="start">3.3절: 「완전한 설명은 없지만 ... 짧은 의존이 많아져서라고 믿는다」</text><text x="52" y="216" font-size="11" fill="#1C232C" text-anchor="start">3.3절: 「긴 문장에서 훨씬 낫다 (3.7절 참고) — 기억을 더 잘 쓰는 것으로 보인다(suggests)」</text><text x="52" y="238" font-size="11" fill="#1C232C" text-anchor="start">5절: 「보통 RNN 도 뒤집으면 쉽게 배워질 것이라 믿는다 (실험으로 확인하지 않았다)」</text><rect x="20" y="258" width="860" height="96" rx="6" fill="#F6D9D5" stroke="#C0392B" stroke-width="1.3"/><text x="36" y="280" font-size="12.5" fill="#C0392B" text-anchor="start" font-weight="bold">원인으로 적었지만 잰 것이 없는 것</text><text x="52" y="304" font-size="11" fill="#1C232C" text-anchor="start">Abstract: 「짧은 의존을 많이 들여왔기 때문에(because) 성능이 크게 나아졌다」</text><text x="52" y="326" font-size="11" fill="#1C232C" text-anchor="start">1절: 「긴 문장을 잘한 것은 뒤집었기 때문이다(because)」 — 정방향 모델의 길이별 곡선은 어디에도 없다</text><text x="52" y="348" font-size="11" fill="#1C232C" text-anchor="start">5절: 「짧은 의존이 가장 많은 부호화를 찾는 것이 중요하다고 결론짓는다」</text><text x="20" y="380" font-size="11" fill="#4E5964" text-anchor="start">같은 현상(뒤집기 이득)에 대한 말이 Abstract · 1절에서는 원인으로, 3.3절에서는 가설로 적혀 있다. 원인 쪽 문장의 근거는 3.3절의 그 가설이다.</text></svg>
