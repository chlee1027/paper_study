<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="빔 탐색 예"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">빔 탐색 작은 예 (어휘 a · b · EOS) — 빔 1 은 a EOS (0.20), 빔 2 는 b EOS (0.36) 를 찾는다</text><circle cx="80" cy="200" r="16" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="80" y="204" font-size="10" fill="#4E5964" text-anchor="middle">시작</text><line x1="96" y1="200" x2="240" y2="120" stroke="#2E6B8A" stroke-width="1.2"/><rect x="240" y="104" width="90" height="32" rx="5" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="285" y="124" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a  0.50</text><line x1="96" y1="200" x2="240" y2="250" stroke="#2E6B8A" stroke-width="1.2"/><rect x="240" y="234" width="90" height="32" rx="5" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="285" y="254" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">b  0.40</text><line x1="96" y1="200" x2="240" y2="340" stroke="#7A8590" stroke-width="1.2"/><rect x="240" y="324" width="90" height="32" rx="5" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.2"/><text x="285" y="344" font-size="12" fill="#7A8590" text-anchor="middle">EOS  0.10</text><text x="285" y="72" font-size="11" fill="#2E6B8A" text-anchor="middle">1 걸음 — 빔 2 는 a · b 를 남긴다</text><line x1="330" y1="120" x2="470" y2="70" stroke="#7A8590" stroke-width="1.0"/><rect x="470" y="56" width="150" height="28" rx="5" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.1"/><text x="545" y="75" font-size="11" fill="#7A8590" text-anchor="middle">a a  0.50 x 0.30 = 0.15</text><line x1="330" y1="120" x2="470" y2="110" stroke="#7A8590" stroke-width="1.0"/><rect x="470" y="96" width="150" height="28" rx="5" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.1"/><text x="545" y="115" font-size="11" fill="#7A8590" text-anchor="middle">a b  0.50 x 0.30 = 0.15</text><line x1="330" y1="120" x2="470" y2="150" stroke="#1E8449" stroke-width="1.0"/><rect x="470" y="136" width="150" height="28" rx="5" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.1"/><text x="545" y="155" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">a EOS  0.50 x 0.40 = 0.20</text><line x1="330" y1="250" x2="470" y2="220" stroke="#7A8590" stroke-width="1.0"/><rect x="470" y="206" width="150" height="28" rx="5" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.1"/><text x="545" y="225" font-size="11" fill="#7A8590" text-anchor="middle">b a  0.40 x 0.05 = 0.02</text><line x1="330" y1="250" x2="470" y2="260" stroke="#7A8590" stroke-width="1.0"/><rect x="470" y="246" width="150" height="28" rx="5" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.1"/><text x="545" y="265" font-size="11" fill="#7A8590" text-anchor="middle">b b  0.40 x 0.05 = 0.02</text><line x1="330" y1="250" x2="470" y2="300" stroke="#1E8449" stroke-width="1.0"/><rect x="470" y="286" width="150" height="28" rx="5" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.1"/><text x="545" y="305" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">b EOS  0.40 x 0.90 = 0.36</text><text x="650" y="80" font-size="11" fill="#1E8449" text-anchor="start" font-weight="bold">2 걸음 — 확장 여섯 가운데 위 둘</text><text x="650" y="100" font-size="11" fill="#4E5964" text-anchor="start">b EOS 0.36, a EOS 0.20 이 남고</text><text x="650" y="120" font-size="11" fill="#4E5964" text-anchor="start">둘 다 EOS 로 끝나 완결 후보가 된다</text><text x="650" y="140" font-size="11" fill="#1E8449" text-anchor="start" font-weight="bold">가장 높은 완결: b EOS 0.36</text><text x="650" y="160" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="650" y="180" font-size="11" fill="#4E5964" text-anchor="start">빔 1(탐욕)은 1 걸음에 a 를 고르고</text><text x="650" y="200" font-size="11" fill="#4E5964" text-anchor="start">a 다음에서 가장 높은 EOS(0.4)를 골라</text><text x="650" y="220" font-size="11" fill="#C0392B" text-anchor="start">a EOS 0.20 에서 멈춘다</text><text x="650" y="240" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="650" y="260" font-size="11" fill="#7A8590" text-anchor="start">원문 크기로는 한 걸음에 빔 12 x 어휘</text><text x="650" y="280" font-size="11" fill="#7A8590" text-anchor="start">80,000 = 960,000 개 확장을 매긴다</text></svg>
