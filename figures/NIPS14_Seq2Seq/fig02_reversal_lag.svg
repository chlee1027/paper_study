<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="입력 뒤집기와 짝 거리"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">입력 뒤집기 — 짝 낱말 사이 거리의 평균은 그대로이고, 가장 짧은 거리(최소 시간 지연)만 6 에서 2 로 준다</text><text x="20" y="52" font-size="11" fill="#7A8590" text-anchor="start">가정: 원문 다섯 낱말이 번역 다섯 낱말과 같은 순서로 하나씩 짝을 이룬다(단조 1 대 1 정렬). 원문은 이 가정을 적지 않는다</text><text x="20" y="148" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">정방향</text><rect x="150" y="130" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="178" y="149" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a1</text><text x="178" y="174" font-size="9" fill="#7A8590" text-anchor="middle">1</text><rect x="216" y="130" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="244" y="149" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a2</text><text x="244" y="174" font-size="9" fill="#7A8590" text-anchor="middle">2</text><rect x="282" y="130" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="310" y="149" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a3</text><text x="310" y="174" font-size="9" fill="#7A8590" text-anchor="middle">3</text><rect x="348" y="130" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="376" y="149" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a4</text><text x="376" y="174" font-size="9" fill="#7A8590" text-anchor="middle">4</text><rect x="414" y="130" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="442" y="149" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a5</text><text x="442" y="174" font-size="9" fill="#7A8590" text-anchor="middle">5</text><rect x="480" y="130" width="56" height="28" rx="4" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.0"/><text x="508" y="149" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">EOS</text><text x="508" y="174" font-size="9" fill="#7A8590" text-anchor="middle">6</text><rect x="546" y="130" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="574" y="149" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b1</text><text x="574" y="174" font-size="9" fill="#7A8590" text-anchor="middle">7</text><rect x="612" y="130" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="640" y="149" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b2</text><text x="640" y="174" font-size="9" fill="#7A8590" text-anchor="middle">8</text><rect x="678" y="130" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="706" y="149" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b3</text><text x="706" y="174" font-size="9" fill="#7A8590" text-anchor="middle">9</text><rect x="744" y="130" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="772" y="149" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b4</text><text x="772" y="174" font-size="9" fill="#7A8590" text-anchor="middle">10</text><rect x="810" y="130" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="838" y="149" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b5</text><text x="838" y="174" font-size="9" fill="#7A8590" text-anchor="middle">11</text><path d="M178,130 C178,106 574,106 574,130" fill="none" stroke="#2E6B8A" stroke-width="1.0"/><path d="M244,130 C244,100 640,100 640,130" fill="none" stroke="#2E6B8A" stroke-width="1.0"/><path d="M310,130 C310,94 706,94 706,130" fill="none" stroke="#2E6B8A" stroke-width="1.0"/><path d="M376,130 C376,88 772,88 772,130" fill="none" stroke="#2E6B8A" stroke-width="1.0"/><path d="M442,130 C442,82 838,82 838,130" fill="none" stroke="#2E6B8A" stroke-width="1.0"/><text x="150" y="196" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">짝 (a_i, b_i) 거리: 6 6 6 6 6 — 평균 6 · 최소 6</text><text x="20" y="308" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">원문 뒤집음</text><rect x="150" y="290" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="178" y="309" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a5</text><text x="178" y="334" font-size="9" fill="#7A8590" text-anchor="middle">1</text><rect x="216" y="290" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="244" y="309" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a4</text><text x="244" y="334" font-size="9" fill="#7A8590" text-anchor="middle">2</text><rect x="282" y="290" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="310" y="309" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a3</text><text x="310" y="334" font-size="9" fill="#7A8590" text-anchor="middle">3</text><rect x="348" y="290" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="376" y="309" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a2</text><text x="376" y="334" font-size="9" fill="#7A8590" text-anchor="middle">4</text><rect x="414" y="290" width="56" height="28" rx="4" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="442" y="309" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">a1</text><text x="442" y="334" font-size="9" fill="#7A8590" text-anchor="middle">5</text><rect x="480" y="290" width="56" height="28" rx="4" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.0"/><text x="508" y="309" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">EOS</text><text x="508" y="334" font-size="9" fill="#7A8590" text-anchor="middle">6</text><rect x="546" y="290" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="574" y="309" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b1</text><text x="574" y="334" font-size="9" fill="#7A8590" text-anchor="middle">7</text><rect x="612" y="290" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="640" y="309" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b2</text><text x="640" y="334" font-size="9" fill="#7A8590" text-anchor="middle">8</text><rect x="678" y="290" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="706" y="309" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b3</text><text x="706" y="334" font-size="9" fill="#7A8590" text-anchor="middle">9</text><rect x="744" y="290" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="772" y="309" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b4</text><text x="772" y="334" font-size="9" fill="#7A8590" text-anchor="middle">10</text><rect x="810" y="290" width="56" height="28" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="838" y="309" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">b5</text><text x="838" y="334" font-size="9" fill="#7A8590" text-anchor="middle">11</text><path d="M442,290 C442,268 574,268 574,290" fill="none" stroke="#1E8449" stroke-width="1.0"/><path d="M376,290 C376,256 640,256 640,290" fill="none" stroke="#1E8449" stroke-width="1.0"/><path d="M310,290 C310,244 706,244 706,290" fill="none" stroke="#1E8449" stroke-width="1.0"/><path d="M244,290 C244,232 772,232 772,290" fill="none" stroke="#1E8449" stroke-width="1.0"/><path d="M178,290 C178,220 838,220 838,290" fill="none" stroke="#1E8449" stroke-width="1.0"/><text x="150" y="356" font-size="12" fill="#1E8449" text-anchor="start" font-weight="bold">짝 (a_i, b_i) 거리: 2 4 6 8 10 — 평균 6 · 최소 2</text><text x="20" y="400" font-size="11" fill="#4E5964" text-anchor="start">일반식(내가 센 것): 원문 길이 T, 짝 i 의 거리는 정방향 T + 1, 뒤집으면 2i. 평균은 둘 다 T + 1 이다 — 원문 3.3절 「평균 거리는 바뀌지 않는다」 와 맞는다.</text><text x="20" y="422" font-size="11" fill="#4E5964" text-anchor="start">T = 25(학습 데이터 영어 문장의 평균 낱말 수 25.3) 이면 거리 10 이하인 짝이 정방향 0 개, 뒤집으면 5 개다. 최소 지연은 26 에서 2.</text><text x="20" y="444" font-size="11" fill="#7A8590" text-anchor="start">이 그림은 정렬이 단조일 때의 셈이다. 어순이 다른 짝(영어 형용사 대 프랑스어 형용사 위치)은 이 셈 밖이다.</text></svg>
