<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 문장 전체를 고정 길이 벡터 하나에 담는 틀. 이 편이 그 틀로 기준 SMT 를 넘었고(앙상블 5), 다음 칸이 그 벡터를 푼다</text><rect x="40" y="70" width="250" height="72" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.3"/><text x="52" y="92" font-size="13" fill="#4E5964" text-anchor="start" font-weight="bold">LSTM</text><text x="52" y="112" font-size="10.5" fill="#7A8590" text-anchor="start">Hochreiter · Schmidhuber 1997</text><text x="52" y="131" font-size="10.5" fill="#4E5964" text-anchor="start">긴 지연을 배우는 기억 칸</text><rect x="40" y="170" width="250" height="72" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.3"/><text x="52" y="192" font-size="13" fill="#4E5964" text-anchor="start" font-weight="bold">Kalchbrenner · Blunsom</text><text x="52" y="212" font-size="10.5" fill="#7A8590" text-anchor="start">EMNLP 2013</text><text x="52" y="231" font-size="10.5" fill="#4E5964" text-anchor="start">문장 -&gt; 벡터 -&gt; 문장 첫 시도 (합성곱 인코더)</text><rect x="40" y="270" width="250" height="72" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.3"/><text x="52" y="292" font-size="13" fill="#4E5964" text-anchor="start" font-weight="bold">Cho 외</text><text x="52" y="312" font-size="10.5" fill="#7A8590" text-anchor="start">EMNLP 2014</text><text x="52" y="331" font-size="10.5" fill="#4E5964" text-anchor="start">RNN 인코더-디코더, SMT 의 구 점수로</text><rect x="330" y="170" width="250" height="72" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="342" y="192" font-size="13" fill="#2E6B8A" text-anchor="start" font-weight="bold">이 편</text><text x="342" y="212" font-size="10.5" fill="#7A8590" text-anchor="start">Sutskever · Vinyals · Le 2014</text><text x="342" y="231" font-size="10.5" fill="#4E5964" text-anchor="start">깊은 LSTM 둘 · 뒤집기 · 직접 번역</text><rect x="630" y="120" width="250" height="72" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.3"/><text x="642" y="142" font-size="13" fill="#1E8449" text-anchor="start" font-weight="bold">Bahdanau 외</text><text x="642" y="162" font-size="10.5" fill="#7A8590" text-anchor="start">ICLR 2015</text><text x="642" y="181" font-size="10.5" fill="#4E5964" text-anchor="start">벡터 하나 대신 원문 자리마다 무게</text><rect x="630" y="240" width="250" height="72" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.3"/><text x="642" y="262" font-size="13" fill="#4E5964" text-anchor="start" font-weight="bold">Pouget-Abadie 외</text><text x="642" y="282" font-size="10.5" fill="#7A8590" text-anchor="start">2014</text><text x="642" y="301" font-size="10.5" fill="#4E5964" text-anchor="start">긴 문장을 조각내 번역</text><line x1="290" y1="106" x2="330" y2="196" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="290" y1="206" x2="330" y2="206" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="290" y1="306" x2="330" y2="216" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="580" y1="196" x2="630" y2="156" stroke="#1E8449" stroke-width="1.4" marker-end="url(#ao)"/><line x1="290" y1="320" x2="630" y2="290" stroke="#4E5964" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ai)"/><text x="470" y="334" font-size="10" fill="#7A8590" text-anchor="middle">원문 4절: Cho 외의 「기억 문제」 를 풀려 한 편</text><text x="598" y="160" font-size="10" fill="#1E8449" text-anchor="end">로드맵 다음 칸</text><text x="20" y="362" font-size="10.5" fill="#7A8590" text-anchor="start">화살표는 원문 2 · 4절의 인용을 따른다. Bahdanau 외는 이 편보다 먼저 arXiv 에 나왔고 이 편 표 1 에 28.45 로 들어 있다 — 「이 편 다음」 은 로드맵의 순서다.</text></svg>
