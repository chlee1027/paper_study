<svg xmlns="http://www.w3.org/2000/svg" width="820" height="434" viewBox="0 0 820 434" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="방향 있는 믿음망은 생성이 쉽고 추론이 어렵다. RBM 은 추론이 쉽고 학습이 어렵다. 이 논문은 둘을 잇는다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="b2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">방향이 있는 믿음망과 방향이 없는 망 — 무엇이 쉬운가</text><rect x="24" y="46" width="372" height="300" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="210" y="70" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">방향 있는 믿음망 (directed belief net)</text><circle cx="110" cy="120" r="16" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="175" cy="120" r="16" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="240" cy="120" r="16" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="305" cy="120" r="16" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="142" cy="230" r="16" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="207" cy="230" r="16" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="272" cy="230" r="16" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><line x1="110" y1="136" x2="142" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="110" y1="136" x2="207" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="110" y1="136" x2="272" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="175" y1="136" x2="142" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="175" y1="136" x2="207" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="175" y1="136" x2="272" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="240" y1="136" x2="142" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="240" y1="136" x2="207" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="240" y1="136" x2="272" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="305" y1="136" x2="142" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="305" y1="136" x2="207" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><line x1="305" y1="136" x2="272" y2="214" stroke="#7A8590" stroke-width="0.9" marker-end="url(#b1)" opacity="0.5"/><text x="210" y="100" font-size="11.5" fill="#7A8590" text-anchor="middle">숨은 층</text><text x="210" y="262" font-size="11.5" fill="#7A8590" text-anchor="middle">보이는 층</text><rect x="44" y="282" width="332" height="50" rx="6" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.2"/><text x="210" y="302" font-size="11.5" fill="#4E5964" text-anchor="middle">생성은 쉽다 — 위에서 아래로 한 번 내려오면 된다</text><text x="210" y="322" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">추론은 어렵다 — 데이터를 보면 숨은 원인들이 얽힌다</text><rect x="412" y="46" width="384" height="300" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="604" y="70" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">방향 없는 망 · 제한 볼츠만 기계 (RBM)</text><circle cx="500" cy="120" r="16" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><circle cx="565" cy="120" r="16" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><circle cx="630" cy="120" r="16" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><circle cx="695" cy="120" r="16" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><circle cx="532" cy="230" r="16" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="597" cy="230" r="16" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="662" cy="230" r="16" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><line x1="500" y1="136" x2="532" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="500" y1="136" x2="597" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="500" y1="136" x2="662" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="565" y1="136" x2="532" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="565" y1="136" x2="597" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="565" y1="136" x2="662" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="630" y1="136" x2="532" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="630" y1="136" x2="597" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="630" y1="136" x2="662" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="695" y1="136" x2="532" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="695" y1="136" x2="597" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="695" y1="136" x2="662" y2="214" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><text x="604" y="100" font-size="11.5" fill="#7A8590" text-anchor="middle">숨은 층 (층 안 연결 없음)</text><text x="604" y="262" font-size="11.5" fill="#7A8590" text-anchor="middle">보이는 층 (층 안 연결 없음)</text><rect x="432" y="282" width="344" height="50" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.2"/><text x="604" y="302" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="600">추론은 쉽다 — 한 층을 보면 다른 층이 서로 독립이다</text><text x="604" y="322" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">학습은 어렵다 — 평형 분포에서 표본을 뽑아야 한다</text><rect x="28" y="356" width="768" height="62" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="380" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">이 논문은 둘을 잇는다 — 방향 있는 망의 한 층을 방향 없는 망 하나로 바꿔 배우고, 그것을 층마다 되풀이한다.</text><text x="412" y="404" font-size="12" fill="#4E5964" text-anchor="middle">잇는 자리를 만드는 것이 「상보 사전분포」다(그림 5).</text></svg>
