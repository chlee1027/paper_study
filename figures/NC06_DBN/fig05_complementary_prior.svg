<svg xmlns="http://www.w3.org/2000/svg" width="820" height="382" viewBox="0 0 820 382" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="가능도가 만드는 상관을 사전분포가 정확히 반대로 만들면 사후분포의 상관이 지워져 곱꼴이 된다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">상보 사전분포 (complementary prior) — 이 논문의 알맹이</text><text x="410" y="52" font-size="12" fill="#4E5964" text-anchor="middle">가능도가 만드는 상관을 사전분포가 정확히 반대로 만들면, 곱한 사후분포가 곱꼴이 된다</text><rect x="58" y="76" width="184" height="150" rx="10" fill="#F4F6F4" stroke="#C0392B" stroke-width="1.3"/><text x="150" y="100" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="600">가능도가 만드는 상관</text><text x="150" y="122" font-size="13" fill="#1C232C" text-anchor="middle">P(v|h)</text><circle cx="116" cy="168" r="14" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><circle cx="184" cy="168" r="14" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><path d="M 116 154 Q 150 128 184 154" fill="none" stroke="#C0392B" stroke-width="2.0"/><text x="150" y="208" font-size="11" fill="#C0392B" text-anchor="middle">얽힌다 (설명해치우기)</text><text x="268" y="156" font-size="18" fill="#7A8590" text-anchor="middle">x</text><rect x="318" y="76" width="184" height="150" rx="10" fill="#F4F6F4" stroke="#2E6B8A" stroke-width="1.3"/><text x="410" y="100" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">사전분포가 만드는 상관</text><text x="410" y="122" font-size="13" fill="#1C232C" text-anchor="middle">P(h)</text><circle cx="376" cy="168" r="14" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><circle cx="444" cy="168" r="14" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><path d="M 376 182 Q 410 208 444 182" fill="none" stroke="#2E6B8A" stroke-width="2.0"/><text x="410" y="208" font-size="11" fill="#2E6B8A" text-anchor="middle">정확히 반대로 얽는다</text><text x="528" y="156" font-size="18" fill="#7A8590" text-anchor="middle">=</text><rect x="578" y="76" width="184" height="150" rx="10" fill="#F4F6F4" stroke="#1E8449" stroke-width="1.3"/><text x="670" y="100" font-size="12" fill="#1E8449" text-anchor="middle" font-weight="600">사후분포</text><text x="670" y="122" font-size="13" fill="#1C232C" text-anchor="middle">P(h|v)</text><circle cx="636" cy="168" r="14" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><circle cx="704" cy="168" r="14" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><text x="670" y="208" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="600">상관이 지워져 곱꼴이 된다</text><rect x="28" y="244" width="768" height="124" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="268" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">그런 사전분포가 정말 있는가 — 논문이 답한 방식</text><text x="52" y="294" font-size="12" fill="#4E5964" text-anchor="start">1. 있다고 주장하지 않고 하나를 짓는다 — 같은 가중치를 무한히 쌓은 망이 층마다 상보 사전분포를 만든다(그림 6).</text><text x="52" y="316" font-size="12" fill="#4E5964" text-anchor="start">2. 부록 A 가 어떤 가능도가 상보 사전분포를 가질 수 있는지를 식 11~13 으로 가른다.</text><text x="52" y="340" font-size="12" fill="#B4552B" text-anchor="start" font-weight="600">3. 이 짓기가 곧 방향 없는 망(RBM)과 같아진다 — 그래서 빠르게 배울 수 있다(그림 7).</text><text x="412" y="362" font-size="11.5" fill="#7A8590" text-anchor="middle">논문의 말: 이것이 가능하다는 것 자체가 널리 불가능하다고 여겨지던 것이었다.</text></svg>
