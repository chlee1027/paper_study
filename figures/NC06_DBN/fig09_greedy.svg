<svg xmlns="http://www.w3.org/2000/svg" width="820" height="444" viewBox="0 0 820 444" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="탐욕 층별 학습은 W0 를 RBM 으로 배워 얼리고 그 표현 위에서 다음 층을 배운다. 데이터에 가중치를 매기는 대신 다시 표현한다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="g1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="g2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">탐욕 층별 학습 (greedy layer-wise learning) — 한 층씩 배우고 얼린다</text><rect x="24" y="50" width="240" height="232" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="144" y="74" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">1. 모든 가중치가 묶여 있다고 보고</text><text x="144" y="94" font-size="11.5" fill="#4E5964" text-anchor="middle">W0 를 RBM 으로 배운다</text><rect x="290" y="50" width="240" height="232" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="410" y="74" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">2. W0 를 얼리고, 전치로 올려</text><text x="410" y="94" font-size="11.5" fill="#4E5964" text-anchor="middle">첫 은닉층의 「데이터」를 만든다</text><rect x="556" y="50" width="240" height="232" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="676" y="74" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">3. 위층끼리는 묶은 채 W0 와는 풀어</text><text x="676" y="94" font-size="11.5" fill="#4E5964" text-anchor="middle">그 「데이터」의 RBM 을 배운다</text><rect x="84" y="114" width="120" height="32" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="144" y="135" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">h2</text><rect x="84" y="166" width="120" height="32" rx="5" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="144" y="187" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">h1</text><rect x="84" y="218" width="120" height="32" rx="5" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="144" y="239" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">v</text><text x="144" y="262" font-size="11" fill="#B4552B" text-anchor="middle" font-weight="600">W0 를 배운다</text><line x1="144" y1="218" x2="144" y2="198" stroke="#B4552B" stroke-width="1.6" marker-end="url(#g2)"/><rect x="350" y="114" width="120" height="32" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="410" y="135" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">h2</text><rect x="350" y="166" width="120" height="32" rx="5" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="410" y="187" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">h1</text><rect x="350" y="218" width="120" height="32" rx="5" fill="#E4E7E4" stroke="#7A8590" stroke-width="1.2"/><text x="410" y="239" font-size="11.5" fill="#7A8590" text-anchor="middle" font-weight="600">v</text><text x="410" y="262" font-size="11" fill="#7A8590" text-anchor="middle" font-weight="600">W0 는 얼었다</text><line x1="410" y1="218" x2="410" y2="198" stroke="#7A8590" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#g1)"/><rect x="616" y="114" width="120" height="32" rx="5" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="676" y="135" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">h2</text><rect x="616" y="166" width="120" height="32" rx="5" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="676" y="187" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">h1</text><rect x="616" y="218" width="120" height="32" rx="5" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="676" y="239" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">v</text><text x="676" y="262" font-size="11" fill="#B4552B" text-anchor="middle" font-weight="600">위층을 배운다</text><line x1="676" y1="166" x2="676" y2="146" stroke="#B4552B" stroke-width="1.6" marker-end="url(#g2)"/><rect x="28" y="296" width="768" height="132" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="320" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">왜 이것이 되는가 — 부스팅과 닮았지만 다른 점 하나</text><text x="52" y="346" font-size="12" fill="#4E5964" text-anchor="start">부스팅은 같은 약한 학습기를 되풀이하되 데이터에 가중치를 다시 매겨 다음이 새것을 배우게 한다.</text><text x="52" y="368" font-size="12" fill="#B4552B" text-anchor="start" font-weight="600">이 알고리즘은 가중치를 다시 매기는 대신 데이터를 다시 표현한다 — 위층은 아래층이 만든 표현을 본다.</text><text x="52" y="394" font-size="12" fill="#4E5964" text-anchor="start">그리고 약한 학습기 자체가 방향 없는 그래프 모델(RBM)이다.</text><text x="52" y="418" font-size="11.5" fill="#7A8590" text-anchor="start">논문의 MNIST 실험은 층마다 30 바퀴를 돌렸고 층당 몇 시간이 걸렸다(3GHz Xeon, Matlab).</text></svg>
