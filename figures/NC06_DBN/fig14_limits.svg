<svg xmlns="http://www.w3.org/2000/svg" width="820" height="458" viewBox="0 0 820 458" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="논문이 적은 한계 여섯과 그것이 여는 다음 자리. 탐욕 학습과 미세조정의 몫이 갈려 있지 않다는 점은 내가 짚은 것이다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">논문이 스스로 적은 한계, 그리고 다음 자리</text><rect x="24" y="52" width="380" height="266" rx="10" fill="#F4F6F4" stroke="#C0392B" stroke-width="1.3"/><text x="214" y="76" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">논문이 한계라고 적은 것</text><text x="44" y="106" font-size="11.5" fill="#4E5964" text-anchor="start">- 이진값이 아닌 값을 확률로 다룰 수 있는</text><text x="44" y="132" font-size="11.5" fill="#4E5964" text-anchor="start">  이미지를 전제한다 — 자연 이미지는 아니다</text><text x="44" y="158" font-size="11.5" fill="#4E5964" text-anchor="start">- 지각할 때의 위에서 아래로의 되먹임이</text><text x="44" y="184" font-size="11.5" fill="#4E5964" text-anchor="start">  위 두 층의 연상 기억에 갇혀 있다</text><text x="44" y="210" font-size="11.5" fill="#4E5964" text-anchor="start">- 지각 불변성을 다루는 방법이 없다</text><text x="44" y="236" font-size="11.5" fill="#4E5964" text-anchor="start">- 분할이 이미 끝났다고 가정한다</text><text x="44" y="262" font-size="11.5" fill="#4E5964" text-anchor="start">- 어려울 때 정보가 많은 부분을 차례로</text><text x="44" y="288" font-size="11.5" fill="#4E5964" text-anchor="start">  살펴보는 것을 배우지 않는다</text><text x="214" y="302" font-size="11" fill="#7A8590" text-anchor="middle">그리고 미세조정이 느리다 — 일그러뜨린 데이터를 못 써 봤다고 적는다</text><rect x="416" y="52" width="380" height="266" rx="10" fill="#F4F6F4" stroke="#B4552B" stroke-width="1.3"/><text x="606" y="76" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">이 한계가 여는 다음 자리</text><rect x="436" y="96" width="340" height="40" rx="6" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.1"/><text x="452" y="113" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">자연 이미지로</text><text x="452" y="131" font-size="11" fill="#4E5964" text-anchor="start">이진 · 확률 가정을 벗는 쪽</text><rect x="436" y="146" width="340" height="40" rx="6" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.1"/><text x="452" y="163" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">불변성을 배우게</text><text x="452" y="181" font-size="11" fill="#4E5964" text-anchor="start">가중치 공유와 부분 표본 뽑기</text><rect x="436" y="196" width="340" height="40" rx="6" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.1"/><text x="452" y="213" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">미세조정을 빠르게</text><text x="452" y="231" font-size="11" fill="#4E5964" text-anchor="start">또는 아예 없애는 쪽</text><rect x="436" y="246" width="340" height="40" rx="6" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.1"/><text x="452" y="263" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">생성 대신 판별로</text><text x="452" y="281" font-size="11" fill="#4E5964" text-anchor="start">층별 사전학습이 정말 필요했는가</text><text x="606" y="302" font-size="10.5" fill="#7A8590" text-anchor="middle">논문의 마지막 문단: 판별 학습이 앞서는 영역은 좋은 생성 모델을 못 배우는 영역뿐이다</text><rect x="28" y="334" width="768" height="108" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="358" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">이 노트를 쓰며 내가 짚은 자리 — 논문의 말이 아니다</text><text x="52" y="384" font-size="12" fill="#4E5964" text-anchor="start">탐욕 학습이 2.49% 이고 미세조정이 1.25% 다. 층별 사전학습이 낸 몫과 미세조정이 낸 몫이 갈려 있지 않다.</text><text x="52" y="406" font-size="12" fill="#C0392B" text-anchor="start" font-weight="600">같은 미세조정을 무작위 초기화 위에 얹으면 얼마가 나오는지가 이 논문 안에 없다.</text><text x="52" y="430" font-size="12" fill="#4E5964" text-anchor="start">곧 「깊은 망에 사전학습이 필요한가」는 이 논문이 답하지 않은 채로 남아 있고, 그것이 다음 몇 해의 주제가 된다.</text></svg>
