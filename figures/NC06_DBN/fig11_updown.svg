<svg xmlns="http://www.w3.org/2000/svg" width="820" height="478" viewBox="0 0 820 478" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="위-아래 알고리즘은 올라갈 때 생성 가중치를, 내려갈 때 인식 가중치를 고친다. 잠 단계를 올라가는 패스로 초기화하는 것이 원래와 다르다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="j1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="j2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">위-아래 알고리즘 (up-down) — 먼저 배운 아래층을 나중에 다시 맞춘다</text><rect x="24" y="50" width="240" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="144" y="74" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">올라가는 패스</text><rect x="84" y="95" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><rect x="84" y="145" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><rect x="84" y="195" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><rect x="84" y="245" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><line x1="144" y1="145" x2="144" y2="125" stroke="#B4552B" stroke-width="1.6" marker-end="url(#j2)"/><line x1="144" y1="195" x2="144" y2="175" stroke="#B4552B" stroke-width="1.6" marker-end="url(#j2)"/><line x1="144" y1="245" x2="144" y2="225" stroke="#B4552B" stroke-width="1.6" marker-end="url(#j2)"/><text x="144" y="288" font-size="10.5" fill="#7A8590" text-anchor="middle">인식 가중치로 상태를 뽑는다</text><rect x="290" y="50" width="240" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="410" y="74" font-size="12.5" fill="#7A8590" text-anchor="middle" font-weight="600">연상 기억에서 기브스</text><rect x="350" y="95" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><rect x="350" y="145" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><rect x="350" y="195" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><rect x="350" y="245" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><path d="M 480 110 C 506 128 506 142 480 160" fill="none" stroke="#7A8590" stroke-width="1.6" marker-end="url(#j1)"/><path d="M 340 160 C 314 142 314 128 340 110" fill="none" stroke="#7A8590" stroke-width="1.6" marker-end="url(#j1)"/><text x="410" y="288" font-size="10.5" fill="#7A8590" text-anchor="middle">위 두 층만 몇 번 번갈아 돈다</text><rect x="556" y="50" width="240" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="676" y="74" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">내려가는 패스</text><rect x="616" y="95" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><rect x="616" y="145" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><rect x="616" y="195" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><rect x="616" y="245" width="120" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><line x1="676" y1="125" x2="676" y2="145" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#j1)"/><line x1="676" y1="175" x2="676" y2="195" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#j1)"/><line x1="676" y1="225" x2="676" y2="245" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#j1)"/><text x="676" y="288" font-size="10.5" fill="#7A8590" text-anchor="middle">생성 가중치로 내려가며 만든다</text><rect x="28" y="314" width="768" height="148" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="338" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">무엇이 바뀌고 무엇이 안 바뀌는가 — 이 구분이 알고리즘의 전부다</text><text x="52" y="364" font-size="12" fill="#B4552B" text-anchor="start">올라갈 때 — 생성 가중치(아래로 가는 것)를 고친다.</text><text x="52" y="386" font-size="12" fill="#2E6B8A" text-anchor="start">내려갈 때 — 인식 가중치(위로 가는 것)만 고친다. 위 두 층과 생성 가중치는 안 건드린다.</text><text x="52" y="412" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">원래 깨어-잠 알고리즘과 다른 점 — 잠 단계를 평형에서 시작하지 않고 올라가는 패스로 초기화한 뒤 몇 번만 돌린다.</text><text x="52" y="434" font-size="12" fill="#4E5964" text-anchor="start">그래서 인식 가중치가 실제 데이터에서 나오는 표현 위에서 배워지고, 최빈값 평균내기 문제가 줄어든다.</text><text x="52" y="456" font-size="11.5" fill="#7A8590" text-anchor="start">논문의 설정: 처음 100 바퀴는 기브스 3 번, 다음 100 바퀴는 6 번, 마지막 100 바퀴는 10 번. 늘릴 때마다 검증 오차가 내려갔다.</text></svg>
