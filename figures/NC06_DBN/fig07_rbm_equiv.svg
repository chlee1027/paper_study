<svg xmlns="http://www.w3.org/2000/svg" width="820" height="500" viewBox="0 0 820 500" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="무한 스택의 미분에서 세로로 줄지은 항이 지워지고 RBM 의 학습 규칙만 남는다. 기브스 한 걸음이 한 층에 해당한다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="e2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">무한 스택은 RBM 과 같다 — 기브스 한 걸음이 한 층이다</text><rect x="24" y="48" width="372" height="300" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="210" y="72" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">무한 스택 (방향 있음)</text><rect x="130" y="95" width="160" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><text x="210" y="114" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">V2</text><rect x="130" y="143" width="160" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><text x="210" y="162" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">H1</text><line x1="210" y1="125" x2="210" y2="141" stroke="#2E6B8A" stroke-width="1.5" marker-end="url(#e1)"/><rect x="130" y="191" width="160" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><text x="210" y="210" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">V1</text><line x1="210" y1="173" x2="210" y2="189" stroke="#2E6B8A" stroke-width="1.5" marker-end="url(#e1)"/><rect x="130" y="239" width="160" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><text x="210" y="258" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">H0</text><line x1="210" y1="221" x2="210" y2="237" stroke="#2E6B8A" stroke-width="1.5" marker-end="url(#e1)"/><rect x="130" y="287" width="160" height="30" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><text x="210" y="306" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">V0</text><line x1="210" y1="269" x2="210" y2="285" stroke="#2E6B8A" stroke-width="1.5" marker-end="url(#e1)"/><text x="210" y="332" font-size="11.5" fill="#7A8590" text-anchor="middle">층을 하나 올라간다</text><text x="410" y="200" font-size="22" fill="#7A8590" text-anchor="middle" font-weight="600">=</text><rect x="424" y="48" width="372" height="300" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="610" y="72" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">RBM (방향 없음)</text><circle cx="540" cy="140" r="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><circle cx="590" cy="140" r="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><circle cx="640" cy="140" r="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><circle cx="690" cy="140" r="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><circle cx="565" cy="236" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="615" cy="236" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><circle cx="665" cy="236" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><line x1="540" y1="155" x2="565" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="540" y1="155" x2="615" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="540" y1="155" x2="665" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="590" y1="155" x2="565" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="590" y1="155" x2="615" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="590" y1="155" x2="665" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="640" y1="155" x2="565" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="640" y1="155" x2="615" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="640" y1="155" x2="665" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="690" y1="155" x2="565" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="690" y1="155" x2="615" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><line x1="690" y1="155" x2="665" y2="221" stroke="#7A8590" stroke-width="0.9" opacity="0.5"/><text x="610" y="112" font-size="11.5" fill="#7A8590" text-anchor="middle">숨은 층 h</text><text x="610" y="268" font-size="11.5" fill="#7A8590" text-anchor="middle">보이는 층 v</text><path d="M 730 140 C 766 160 766 216 730 236" fill="none" stroke="#B4552B" stroke-width="1.8" marker-end="url(#e2)"/><text x="752" y="190" font-size="11" fill="#B4552B" text-anchor="start">번갈아</text><text x="610" y="332" font-size="11.5" fill="#7A8590" text-anchor="middle">기브스를 한 걸음 돈다</text><rect x="28" y="358" width="768" height="128" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="382" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">같은 것이라는 근거 — 미분이 맞아떨어진다 (식 4, 5)</text><text x="52" y="408" font-size="12" fill="#4E5964" text-anchor="start">무한 스택의 미분 = <h(0)(v(0) - v(1))> + <v(1)(h(0) - h(1))> + <h(1)(v(1) - v(2))> + ...</text><text x="52" y="432" font-size="12" fill="#4E5964" text-anchor="start">세로로 줄지은 항들이 서로 지워지고 남는 것이 RBM 의 학습 규칙이다.</text><text x="52" y="458" font-size="12.5" fill="#B4552B" text-anchor="start" font-weight="600">남는 것: d log p(v(0)) / d w(i,j) = <v(0) h(0)> - <v(i,n,f) h(i,n,f)></text><text x="52" y="480" font-size="11.5" fill="#7A8590" text-anchor="start">왼쪽은 데이터를 고정했을 때의 상관, 오른쪽은 평형에 이르렀을 때의 상관이다.</text></svg>
