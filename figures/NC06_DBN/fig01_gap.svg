<svg xmlns="http://www.w3.org/2000/svg" width="820" height="414" viewBox="0 0 820 414" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="로지스틱의 기울기는 최대 0.25 이고 층마다 곱해져 다섯 층이면 0.00098 이 된다. 이 논문은 층을 따로 배우는 길을 낸다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">역전파가 남긴 빈칸 — 층을 쌓으면 아래층까지 기울기가 안 내려온다</text><rect x="24" y="46" width="380" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="214" y="70" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">로지스틱의 기울기는 최대가 0.25 다</text><line x1="60" y1="226" x2="360" y2="226" stroke="#4E5964" stroke-width="1.2"/><line x1="210.0" y1="96" x2="210.0" y2="226" stroke="#CFD6D3" stroke-width="1.0"/><polyline points="60.0,224.9 62.5,224.8 65.0,224.6 67.5,224.5 70.0,224.3 72.5,224.1 75.0,224.0 77.5,223.7 80.0,223.5 82.5,223.2 85.0,223.0 87.5,222.6 90.0,222.3 92.5,221.9 95.0,221.5 97.5,221.0 100.0,220.5 102.5,220.0 105.0,219.3 107.5,218.7 110.0,217.9 112.5,217.1 115.0,216.2 117.5,215.2 120.0,214.2 122.5,213.0 125.0,211.7 127.5,210.3 130.0,208.8 132.5,207.1 135.0,205.3 137.5,203.4 140.0,201.3 142.5,199.0 145.0,196.5 147.5,193.9 150.0,191.1 152.5,188.1 155.0,184.9 157.5,181.5 160.0,178.0 162.5,174.2 165.0,170.3 167.5,166.2 170.0,162.0 172.5,157.8 175.0,153.4 177.5,149.0 180.0,144.6 182.5,140.3 185.0,136.0 187.5,132.0 190.0,128.1 192.5,124.5 195.0,121.3 197.5,118.5 200.0,116.1 202.5,114.1 205.0,112.7 207.5,111.9 210.0,111.6 212.5,111.9 215.0,112.7 217.5,114.1 220.0,116.1 222.5,118.5 225.0,121.3 227.5,124.5 230.0,128.1 232.5,132.0 235.0,136.0 237.5,140.3 240.0,144.6 242.5,149.0 245.0,153.4 247.5,157.8 250.0,162.0 252.5,166.2 255.0,170.3 257.5,174.2 260.0,178.0 262.5,181.5 265.0,184.9 267.5,188.1 270.0,191.1 272.5,193.9 275.0,196.5 277.5,199.0 280.0,201.3 282.5,203.4 285.0,205.3 287.5,207.1 290.0,208.8 292.5,210.3 295.0,211.7 297.5,213.0 300.0,214.2 302.5,215.2 305.0,216.2 307.5,217.1 310.0,217.9 312.5,218.7 315.0,219.3 317.5,220.0 320.0,220.5 322.5,221.0 325.0,221.5 327.5,221.9 330.0,222.3 332.5,222.6 335.0,223.0 337.5,223.2 340.0,223.5 342.5,223.7 345.0,224.0 347.5,224.1 350.0,224.3 352.5,224.5 355.0,224.6 357.5,224.8 360.0,224.9" fill="none" stroke="#B4552B" stroke-width="2.2"/><line x1="60" y1="111.6" x2="360" y2="111.6" stroke="#7A8590" stroke-width="1.0" stroke-dasharray="4 4"/><text x="90" y="103.6" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">0.25</text><text x="210.0" y="244" font-size="11.5" fill="#7A8590" text-anchor="middle">유닛이 받는 총입력</text><text x="214" y="268" font-size="11.5" fill="#4E5964" text-anchor="middle">가장 잘 받아도 한 층을 지날 때마다 4분의 1 이하로 줄어든다</text><rect x="418" y="46" width="380" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="608" y="70" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">층마다 곱하면</text><text x="452" y="104" font-size="12" fill="#4E5964" text-anchor="end">1층</text><rect x="462" y="91" width="300.0" height="18" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="770.0" y="104" font-size="11.5" fill="#4E5964" text-anchor="start">0.25</text><text x="452" y="140" font-size="12" fill="#4E5964" text-anchor="end">2층</text><rect x="462" y="127" width="187.24958233524177" height="18" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="657.2495823352417" y="140" font-size="11.5" fill="#4E5964" text-anchor="start">0.0625</text><text x="452" y="176" font-size="12" fill="#4E5964" text-anchor="end">3층</text><rect x="462" y="163" width="116.87468694907497" height="18" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="586.874686949075" y="176" font-size="11.5" fill="#4E5964" text-anchor="start">0.015625</text><text x="452" y="212" font-size="12" fill="#4E5964" text-anchor="end">4층</text><rect x="462" y="199" width="72.94912105592141" height="18" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="542.9491210559214" y="212" font-size="11.5" fill="#4E5964" text-anchor="start">0.0039062</text><text x="452" y="248" font-size="12" fill="#4E5964" text-anchor="end">5층</text><rect x="462" y="235" width="45.53230816481425" height="18" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="515.5323081648143" y="248" font-size="11.5" fill="#4E5964" text-anchor="start">0.0009766</text><text x="608" y="276" font-size="11.5" fill="#4E5964" text-anchor="middle">다섯 층이면 0.00098 — 아래층 가중치가 사실상 안 움직인다</text><rect x="28" y="306" width="770" height="92" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="413" y="330" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">역전파(1986)는 은닉 유닛에 몫을 나누는 길을 열었지만, 그 몫은 위층에서 곱해져 내려온다.</text><text x="413" y="354" font-size="12" fill="#4E5964" text-anchor="middle">이 논문은 기울기를 더 잘 흘리는 대신, 아래층을 위층과 따로 · 정답 없이 먼저 배우는 길을 낸다.</text><text x="413" y="380" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">곧 「깊은 망을 한 번에 배우지 않는다」가 이 논문의 출발점이다.</text></svg>
