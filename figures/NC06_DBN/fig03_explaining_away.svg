<svg xmlns="http://www.w3.org/2000/svg" width="820" height="576" viewBox="0 0 820 576" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="지진과 트럭은 원래 무관하지만 집이 흔들린 것을 관찰하면 반대로 묶인다. 이것이 설명해치우기이고 추론을 어렵게 만든다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">설명해치우기 (explaining away) — 논문 그림 2 를 숫자로 따라가 보면</text><circle cx="240" cy="100" r="34" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="240" y="96" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">지진</text><text x="240" y="113" font-size="10.5" fill="#7A8590" text-anchor="middle">치우침 -10</text><circle cx="580" cy="100" r="34" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="580" y="96" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">트럭</text><text x="580" y="113" font-size="10.5" fill="#7A8590" text-anchor="middle">치우침 -10</text><circle cx="410" cy="232" r="36" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.6"/><text x="410" y="228" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">집이</text><text x="410" y="245" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">흔들림</text><line x1="262" y1="128" x2="386" y2="204" stroke="#4E5964" stroke-width="1.6" marker-end="url(#c1)"/><line x1="558" y1="128" x2="434" y2="204" stroke="#4E5964" stroke-width="1.6" marker-end="url(#c1)"/><text x="304" y="178" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">+20</text><text x="516" y="178" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">+20</text><text x="410" y="288" font-size="11" fill="#7A8590" text-anchor="middle">치우침 -20</text><rect x="28" y="316" width="768" height="156" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="52" y="340" font-size="12.5" fill="#1C232C" text-anchor="start" font-weight="600">집이 흔들린 것을 보았다. 무엇이 켜졌다고 볼 것인가.</text><text x="60" y="366" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="600">둘 다 꺼짐</text><text x="178" y="366" font-size="11.5" fill="#4E5964" text-anchor="start">총입력 -20</text><text x="330" y="366" font-size="11.5" fill="#C0392B" text-anchor="start">흔들릴 확률이 e^-20 배로 낮다 — 관찰과 안 맞는다</text><text x="60" y="392" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="600">지진만 켜짐</text><text x="178" y="392" font-size="11.5" fill="#4E5964" text-anchor="start">총입력 -20 + 20 = 0</text><text x="330" y="392" font-size="11.5" fill="#1E8449" text-anchor="start">흔들릴 확률이 반반 — 관찰을 잘 설명한다</text><text x="60" y="418" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="600">트럭만 켜짐</text><text x="178" y="418" font-size="11.5" fill="#4E5964" text-anchor="start">총입력 -20 + 20 = 0</text><text x="330" y="418" font-size="11.5" fill="#1E8449" text-anchor="start">마찬가지로 잘 설명한다</text><text x="60" y="444" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="600">둘 다 켜짐</text><text x="178" y="444" font-size="11.5" fill="#4E5964" text-anchor="start">총입력 +20</text><text x="330" y="444" font-size="11.5" fill="#C0392B" text-anchor="start">설명은 되지만 둘이 함께 일어날 확률이 e^-10 x e^-10 = e^-20</text><rect x="28" y="484" width="768" height="76" rx="8" fill="#F4F6F4" stroke="#B4552B" stroke-width="1.3"/><text x="412" y="508" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">그래서 지진이 켜지면 트럭은 꺼지는 쪽으로 기운다 — 원래 서로 무관하던 둘이 관찰 뒤에 반대로 묶인다.</text><text x="412" y="532" font-size="12" fill="#4E5964" text-anchor="middle">이것이 설명해치우기다. 숨은 변수들이 얽히므로 사후분포를 변수마다 따로 적을 수 없고, 그래서 추론이 어렵다.</text></svg>
