<svg xmlns="http://www.w3.org/2000/svg" width="820" height="406" viewBox="0 0 820 406" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="사후분포가 곱꼴이면 유닛마다 따로 정할 수 있고 아니면 조합을 통째로 봐야 한다. 이 논문은 곱꼴이 되도록 모델을 짓는다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">곱꼴 사후분포 (factorial posterior) — 되면 쉽고 안 되면 어렵다</text><rect x="24" y="46" width="372" height="224" rx="10" fill="#F4F6F4" stroke="#1E8449" stroke-width="1.3"/><text x="210" y="70" font-size="12.5" fill="#1E8449" text-anchor="middle" font-weight="600">곱꼴이면</text><text x="210" y="104" font-size="14" fill="#1C232C" text-anchor="middle">P(h(1), h(2), h(3) | v)</text><text x="210" y="130" font-size="13" fill="#7A8590" text-anchor="middle">=</text><text x="210" y="158" font-size="14" fill="#1E8449" text-anchor="middle" font-weight="600">P(h(1)|v) x P(h(2)|v) x P(h(3)|v)</text><circle cx="110" cy="206" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><circle cx="175" cy="206" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><circle cx="240" cy="206" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><circle cx="305" cy="206" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><text x="210" y="246" font-size="11.5" fill="#4E5964" text-anchor="middle">숨은 유닛마다 따로 정하면 된다 — 한 번 훑으면 끝난다</text><rect x="412" y="46" width="384" height="224" rx="10" fill="#F4F6F4" stroke="#C0392B" stroke-width="1.3"/><text x="604" y="70" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">안 되면</text><text x="604" y="104" font-size="14" fill="#1C232C" text-anchor="middle">P(h(1), h(2), h(3) | v)</text><text x="604" y="130" font-size="13" fill="#7A8590" text-anchor="middle">!=</text><text x="604" y="158" font-size="14" fill="#C0392B" text-anchor="middle" font-weight="600">따로따로의 곱</text><circle cx="500" cy="206" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><circle cx="565" cy="206" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><circle cx="630" cy="206" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><circle cx="695" cy="206" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.0"/><path d="M 500 193 Q 532 172 565 193" fill="none" stroke="#C0392B" stroke-width="1.4"/><path d="M 565 193 Q 597 172 630 193" fill="none" stroke="#C0392B" stroke-width="1.4"/><path d="M 630 193 Q 662 172 695 193" fill="none" stroke="#C0392B" stroke-width="1.4"/><path d="M 500 193 Q 565 172 630 193" fill="none" stroke="#C0392B" stroke-width="1.4"/><text x="604" y="246" font-size="11.5" fill="#C0392B" text-anchor="middle">조합을 통째로 봐야 한다 — 유닛 n 개면 경우가 2^n 가지다</text><rect x="28" y="284" width="768" height="108" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="308" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">지금까지의 길 둘, 그리고 이 논문의 길 하나.</text><text x="52" y="334" font-size="12" fill="#4E5964" text-anchor="start">MCMC — 사후분포에서 표본을 뽑는다. 맞지만 오래 걸린다.</text><text x="52" y="356" font-size="12" fill="#4E5964" text-anchor="start">변분법 — 곱꼴인 가짜 분포로 대신한다. 빠르지만 근사가 나쁠 수 있고, 특히 가장 깊은 층에서 나쁘다.</text><text x="52" y="380" font-size="12" fill="#B4552B" text-anchor="start" font-weight="600">이 논문 — 사후분포가 애초에 곱꼴이 되도록 모델을 짓는다. 근사가 아니라 정확해진다.</text></svg>
