<svg xmlns="http://www.w3.org/2000/svg" width="820" height="550" viewBox="0 0 820 550" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="순열 불변 MNIST 에서 이 논문이 1.25%, SVM 이 1.4%, 역전파가 1.51% 다. 탐욕 학습만으로는 2.49% 였다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">MNIST 오차율 — 논문 표 1 에서 순열 불변 조건만 뽑았다</text><text x="410" y="50" font-size="11.5" fill="#7A8590" text-anchor="middle">순열 불변 (permutation-invariant) = 픽셀 순서를 모르는 조건. 기하 지식도 전처리도 쓰지 않는다</text><text x="238" y="93" font-size="11.5" fill="#1C232C" text-anchor="end" font-weight="600">이 논문의 생성 모델</text><rect x="250" y="77" width="158.08823529411765" height="22" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="418.0882352941177" y="93" font-size="12" fill="#B4552B" text-anchor="start" font-weight="600">1.25%</text><text x="474.0882352941177" y="93" font-size="10.5" fill="#7A8590" text-anchor="start">784-500-500-2000-10</text><text x="238" y="137" font-size="11.5" fill="#1C232C" text-anchor="end">서포트 벡터 머신</text><rect x="250" y="121" width="177.05882352941177" height="22" rx="3" fill="#E8EEF1" stroke="#2E6B8A" stroke-width="1.2"/><text x="437.05882352941177" y="137" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="600">1.40%</text><text x="493.05882352941177" y="137" font-size="10.5" fill="#7A8590" text-anchor="start">9차 다항 커널</text><text x="238" y="181" font-size="11.5" fill="#1C232C" text-anchor="end">역전파 784-500-300-10</text><rect x="250" y="165" width="190.97058823529412" height="22" rx="3" fill="#E8EEF1" stroke="#2E6B8A" stroke-width="1.2"/><text x="450.97058823529414" y="181" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="600">1.51%</text><text x="506.97058823529414" y="181" font-size="10.5" fill="#7A8590" text-anchor="start">교차 엔트로피 + 가중치 감쇠</text><text x="238" y="225" font-size="11.5" fill="#1C232C" text-anchor="end">역전파 784-800-10</text><rect x="250" y="209" width="193.5" height="22" rx="3" fill="#E8EEF1" stroke="#2E6B8A" stroke-width="1.2"/><text x="453.5" y="225" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="600">1.53%</text><text x="509.5" y="225" font-size="10.5" fill="#7A8590" text-anchor="start">교차 엔트로피 + 조기 종료</text><text x="238" y="269" font-size="11.5" fill="#1C232C" text-anchor="end">최근접 이웃</text><rect x="250" y="253" width="354.11764705882354" height="22" rx="3" fill="#EAEAEA" stroke="#7A8590" stroke-width="1.2"/><text x="614.1176470588235" y="269" font-size="12" fill="#7A8590" text-anchor="start" font-weight="600">2.80%</text><text x="670.1176470588235" y="269" font-size="10.5" fill="#7A8590" text-anchor="start">60,000 전부, L3 노름</text><text x="238" y="313" font-size="11.5" fill="#1C232C" text-anchor="end">역전파 784-500-150-10</text><rect x="250" y="297" width="373.0882352941177" height="22" rx="3" fill="#EAEAEA" stroke="#7A8590" stroke-width="1.2"/><text x="633.0882352941177" y="313" font-size="12" fill="#7A8590" text-anchor="start" font-weight="600">2.95%</text><text x="689.0882352941177" y="313" font-size="10.5" fill="#7A8590" text-anchor="start">제곱 오차 + 온라인 갱신</text><text x="238" y="357" font-size="11.5" fill="#1C232C" text-anchor="end">최근접 이웃</text><rect x="250" y="341" width="392.05882352941177" height="22" rx="3" fill="#EAEAEA" stroke="#7A8590" stroke-width="1.2"/><text x="652.0588235294117" y="357" font-size="12" fill="#7A8590" text-anchor="start" font-weight="600">3.10%</text><text x="708.0588235294117" y="357" font-size="10.5" fill="#7A8590" text-anchor="start">60,000 전부, L2 노름</text><rect x="28" y="402" width="768" height="132" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="426" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">읽을 때 조심할 것 셋</text><text x="52" y="452" font-size="12" fill="#4E5964" text-anchor="start">1. 이 표는 순열 불변 조건이다. 픽셀 순서를 쓰는 합성곱 망은 0.4~0.95% 로 더 낮다 — 같은 칸에 놓지 않는다.</text><text x="52" y="474" font-size="12" fill="#4E5964" text-anchor="start">2. 1.25% 는 60,000 장 전부로 다시 배운 뒤의 값이다. 44,000 장으로 고른 망의 값은 1.39% 다.</text><text x="52" y="498" font-size="12" fill="#B4552B" text-anchor="start" font-weight="600">3. 탐욕 학습만 끝냈을 때가 2.49% 이고, 위-아래 미세조정이 1.25% 로 내렸다 — 두 단계의 몫이 갈린다.</text><text x="52" y="522" font-size="11.5" fill="#7A8590" text-anchor="start">논문 각주: 아주 작은 학습률로 6 주 더 돌리자 시험 오차가 1.12~1.31% 사이에서 흔들렸다.</text></svg>
