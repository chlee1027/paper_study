<svg xmlns="http://www.w3.org/2000/svg" width="820" height="396" viewBox="0 0 820 396" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="대조 발산은 평형까지 가지 않고 n 걸음에서 끊는다. 빠르지만 최대가능도가 아니고 깊은 망에 바로 쓸 수 없다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">대조 발산 (contrastive divergence) — 평형까지 안 가고 n 걸음에서 끊는다</text><circle cx="90" cy="110" r="22" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="90" y="115" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">v0</text><circle cx="190" cy="110" r="22" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="190" y="115" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">h0</text><circle cx="290" cy="110" r="22" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="290" y="115" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">v1</text><circle cx="390" cy="110" r="22" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="390" y="115" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="600">h1</text><circle cx="640" cy="110" r="22" fill="#EDEDED" stroke="#7A8590" stroke-width="1.3"/><text x="640" y="115" font-size="11.5" fill="#7A8590" text-anchor="middle" font-weight="600">v(i,n,f)</text><circle cx="730" cy="110" r="22" fill="#EDEDED" stroke="#7A8590" stroke-width="1.3"/><text x="730" y="115" font-size="11.5" fill="#7A8590" text-anchor="middle" font-weight="600">h(i,n,f)</text><line x1="112" y1="110" x2="168" y2="110" stroke="#4E5964" stroke-width="1.3" marker-end="url(#f1)"/><line x1="212" y1="110" x2="268" y2="110" stroke="#4E5964" stroke-width="1.3" marker-end="url(#f1)"/><line x1="312" y1="110" x2="368" y2="110" stroke="#4E5964" stroke-width="1.3" marker-end="url(#f1)"/><path d="M 412 110 L 612 110" fill="none" stroke="#7A8590" stroke-width="1.3" stroke-dasharray="6 5" marker-end="url(#f1)"/><text x="512" y="98" font-size="11.5" fill="#7A8590" text-anchor="middle">평형까지 아주 많이</text><text x="90" y="154" font-size="11.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">데이터</text><text x="685" y="154" font-size="11.5" fill="#7A8590" text-anchor="middle">평형 분포</text><rect x="56" y="168" width="300" height="64" rx="8" fill="#F4F6F4" stroke="#1E8449" stroke-width="1.3"/><text x="206" y="192" font-size="12" fill="#1E8449" text-anchor="middle" font-weight="600">여기서 끊는다 (n 걸음)</text><text x="206" y="214" font-size="11.5" fill="#4E5964" text-anchor="middle">논문의 MNIST 실험은 n = 1 로 시작한다</text><rect x="504" y="168" width="262" height="64" rx="8" fill="#F4F6F4" stroke="#C0392B" stroke-width="1.3"/><text x="635" y="192" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="600">여기까지 가면 정확하지만</text><text x="635" y="214" font-size="11.5" fill="#4E5964" text-anchor="middle">깊은 망에서는 시간이 감당 안 된다</text><rect x="28" y="250" width="768" height="130" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="274" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">무엇을 얻고 무엇을 잃는가</text><text x="52" y="300" font-size="12" fill="#1E8449" text-anchor="start">얻는 것 — 평형 표본을 안 뽑아도 되므로 훨씬 빠르다. RBM 하나를 실제로 배울 수 있게 된다.</text><text x="52" y="322" font-size="12" fill="#C0392B" text-anchor="start">잃는 것 — 정확한 최대가능도 학습이 아니다. 논문이 「효율을 비싼 값에 샀다」고 적는다.</text><text x="52" y="348" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">그리고 이것을 그대로 깊은 망에 쓰면 안 된다 — 층마다 가중치가 다르면 데이터를 고정한 조건부 평형에 이르는 데도 너무 오래 걸린다.</text><text x="52" y="370" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">그 막힌 자리를 푸는 것이 다음 그림의 탐욕 학습이다.</text></svg>
