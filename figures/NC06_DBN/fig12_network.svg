<svg xmlns="http://www.w3.org/2000/svg" width="820" height="478" viewBox="0 0 820 478" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="MNIST 망은 784 픽셀에서 500, 500 을 거쳐 위 두 층 2000 과 라벨 10 이 방향 없는 연상 기억을 이룬다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="i1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="i2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">MNIST 에 쓴 망 — 논문 그림 1</text><rect x="230" y="56" width="360" height="44" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="410" y="83" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">2000 units (연상 기억의 위쪽)</text><rect x="150" y="132" width="200" height="40" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="250" y="157" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">500 units</text><rect x="430" y="132" width="160" height="40" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="510" y="157" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">10 label units</text><rect x="150" y="212" width="200" height="40" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="250" y="237" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">500 units</text><rect x="150" y="292" width="200" height="44" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.4"/><text x="250" y="312" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">28 x 28 pixel image</text><text x="250" y="329" font-size="11" fill="#7A8590" text-anchor="middle">784</text><path d="M 250 132 L 250 104 M 240 112 L 250 100 L 260 112" fill="none" stroke="#B4552B" stroke-width="1.8"/><path d="M 250 100 L 250 128 M 240 120 L 250 132 L 260 120" fill="none" stroke="#B4552B" stroke-width="1.8"/><path d="M 510 132 L 510 104 M 500 112 L 510 100 L 520 112" fill="none" stroke="#B4552B" stroke-width="1.8"/><path d="M 510 100 L 510 128 M 500 120 L 510 132 L 520 120" fill="none" stroke="#B4552B" stroke-width="1.8"/><line x1="250" y1="212" x2="250" y2="178" stroke="#2E6B8A" stroke-width="1.8" marker-end="url(#i1)"/><line x1="250" y1="292" x2="250" y2="258" stroke="#2E6B8A" stroke-width="1.8" marker-end="url(#i1)"/><text x="620" y="154" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">방향 없음 — 연상 기억</text><text x="620" y="232" font-size="11.5" fill="#2E6B8A" text-anchor="start" font-weight="600">방향 있음 — 생성 연결</text><text x="620" y="252" font-size="11" fill="#7A8590" text-anchor="start">(반대 방향에 인식 연결)</text><rect x="600" y="292" width="196" height="44" rx="6" fill="#F4F6F4" stroke="#7A8590" stroke-width="1.2"/><text x="698" y="312" font-size="10.5" fill="#7A8590" text-anchor="middle">라벨 자리는 다른 감각 경로의</text><text x="698" y="328" font-size="10.5" fill="#7A8590" text-anchor="middle">위층으로 바꿔도 된다고 적는다</text><rect x="28" y="356" width="768" height="106" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="380" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">숫자로 적어 두는 설정</text><text x="52" y="406" font-size="12" fill="#4E5964" text-anchor="start">가중치 약 170만 개. 학습 이미지 60,000 · 시험 이미지 10,000.</text><text x="52" y="428" font-size="12" fill="#4E5964" text-anchor="start">탐욕 학습은 44,000 장을 10 개씩 균형 잡은 440 묶음으로 나눠 층마다 30 바퀴. 끝났을 때 시험 오차 2.49%.</text><text x="52" y="452" font-size="12" fill="#4E5964" text-anchor="start">그 뒤 위-아래 알고리즘으로 300 바퀴. 학습 전체가 약 일주일 걸렸다.</text></svg>
