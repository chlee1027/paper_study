<svg xmlns="http://www.w3.org/2000/svg" width="820" height="514" viewBox="0 0 820 514" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="가중치를 묶어 무한히 쌓은 방향 있는 망. 아래 화살표가 모델이고 위 화살표는 추론에만 쓴다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">가중치를 묶어 무한히 쌓은 망 — 논문 그림 3</text><rect x="300" y="74" width="220" height="36" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="410" y="97" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">V2</text><rect x="300" y="134" width="220" height="36" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="410" y="157" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">H1</text><rect x="300" y="194" width="220" height="36" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="410" y="217" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">V1</text><rect x="300" y="254" width="220" height="36" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="410" y="277" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">H0</text><rect x="300" y="314" width="220" height="36" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="410" y="337" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">V0</text><text x="410" y="62" font-size="11.5" fill="#7A8590" text-anchor="middle">더 위로 끝없이</text><path d="M 410 46 L 410 70" fill="none" stroke="#7A8590" stroke-width="1.2" stroke-dasharray="4 4"/><line x1="370" y1="110" x2="370" y2="134" stroke="#2E6B8A" stroke-width="1.8" marker-end="url(#d1)"/><line x1="450" y1="134" x2="450" y2="110" stroke="#B4552B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#d2)"/><line x1="370" y1="170" x2="370" y2="194" stroke="#2E6B8A" stroke-width="1.8" marker-end="url(#d1)"/><line x1="450" y1="194" x2="450" y2="170" stroke="#B4552B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#d2)"/><line x1="370" y1="230" x2="370" y2="254" stroke="#2E6B8A" stroke-width="1.8" marker-end="url(#d1)"/><line x1="450" y1="254" x2="450" y2="230" stroke="#B4552B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#d2)"/><line x1="370" y1="290" x2="370" y2="314" stroke="#2E6B8A" stroke-width="1.8" marker-end="url(#d1)"/><line x1="450" y1="314" x2="450" y2="290" stroke="#B4552B" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#d2)"/><text x="268" y="212" font-size="13" fill="#2E6B8A" text-anchor="end" font-weight="600">W</text><text x="556" y="212" font-size="12.5" fill="#B4552B" text-anchor="start">W 의 전치</text><rect x="28" y="372" width="768" height="128" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="396" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">화살표 둘의 뜻이 다르다</text><text x="52" y="422" font-size="12" fill="#2E6B8A" text-anchor="start">아래로 (파랑, 실선) — 이것이 모델이다. 위층 상태에서 아래층을 만들어 낸다.</text><text x="52" y="444" font-size="12" fill="#B4552B" text-anchor="start">위로 (주황, 점선) — 모델의 일부가 아니다. 데이터를 V0 에 고정했을 때 사후분포에서 표본을 뽑는 데 쓴다.</text><text x="52" y="470" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">모든 층이 같은 W 를 쓴다(묶여 있다). 그래서 위로 올라가며 전치 행렬만 곱하면 참 사후분포에서 표본이 나온다.</text><text x="52" y="492" font-size="11.5" fill="#1E8449" text-anchor="start" font-weight="600">곧 이 망에서는 추론이 어렵지 않다 — 상보 사전분포가 층마다 서 있기 때문이다.</text></svg>
