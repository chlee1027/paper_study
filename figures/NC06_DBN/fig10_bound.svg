<svg xmlns="http://www.w3.org/2000/svg" width="820" height="444" viewBox="0 0 820 444" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="가중치가 묶인 자리에서 변분 하한이 참값과 같아지고 위층을 배우면 하한이 올라간다. 대조 발산을 쓰면 이 보장은 무효가 된다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="410" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">층을 더해도 나빠지지 않는다는 보장 (식 8, 9)</text><line x1="70" y1="280" x2="490" y2="280" stroke="#4E5964" stroke-width="1.2"/><line x1="70" y1="60" x2="70" y2="280" stroke="#4E5964" stroke-width="1.2"/><text x="58" y="70" font-size="11" fill="#7A8590" text-anchor="end">높다</text><text x="280.0" y="302" font-size="11.5" fill="#7A8590" text-anchor="middle">학습 단계</text><line x1="90" y1="210" x2="470" y2="210" stroke="#2E6B8A" stroke-width="2.0" stroke-dasharray="6 4"/><text x="466" y="202" font-size="11.5" fill="#2E6B8A" text-anchor="end">참 로그가능도</text><path d="M 90 210 L 250 210 L 470 144" fill="none" stroke="#1E8449" stroke-width="2.4" marker-end="url(#h1)"/><circle cx="90" cy="210" r="6" fill="#1E8449" stroke="#1E8449" stroke-width="0"/><text x="100" y="236" font-size="11.5" fill="#1E8449" text-anchor="start" font-weight="600">2단계: 하한이 참값과 딱 맞는다</text><text x="270" y="168" font-size="11.5" fill="#1E8449" text-anchor="start" font-weight="600">3단계: 하한이 올라간다</text><text x="270" y="190" font-size="11" fill="#4E5964" text-anchor="start">그래서 참값이 2단계 아래로 못 내려간다</text><rect x="516" y="60" width="280" height="220" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="656" y="84" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">왜 딱 맞는가</text><text x="656" y="112" font-size="11.5" fill="#4E5964" text-anchor="middle">가중치가 전부 묶여 있으면</text><text x="656" y="132" font-size="11.5" fill="#4E5964" text-anchor="middle">전치를 곱해 얻은 곱꼴 분포가</text><text x="656" y="152" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="600">참 사후분포와 같다</text><text x="656" y="180" font-size="11.5" fill="#4E5964" text-anchor="middle">하한이 등호가 되는 조건이</text><text x="656" y="200" font-size="11.5" fill="#4E5964" text-anchor="middle">「Q 가 참 사후분포일 때」이므로</text><text x="656" y="220" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="600">그 자리에서 하한 = 참값</text><text x="656" y="252" font-size="11" fill="#7A8590" text-anchor="middle">그 뒤 위층을 배우면 하한만 올라간다</text><rect x="28" y="300" width="768" height="128" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="412" y="324" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">보장의 범위를 정확히 적는다</text><text x="52" y="350" font-size="12" fill="#1E8449" text-anchor="start">보장되는 것 — 각 층을 최대가능도 볼츠만 기계 학습으로 배우면 로그가능도가 내려가지 않는다(기댓값 기준).</text><text x="52" y="372" font-size="12" fill="#C0392B" text-anchor="start" font-weight="600">실제로 한 것 — 대조 발산으로 바꿔 썼다. 논문의 말로 「대조 발산을 쓰면 그 보장이 무효가 된다」.</text><text x="52" y="398" font-size="12" fill="#4E5964" text-anchor="start">논문이 이어 적기를, 그래도 층을 충분히 참을성 있게 배우면 불완전한 모델이 나아진다는 것은 안심이 된다고 했다.</text><text x="52" y="420" font-size="11.5" fill="#7A8590" text-anchor="start">그리고 하한이 조여들면 참값이 내려가는 일도 있을 수 있다고 적는다 — 2단계 값 아래로는 안 내려간다.</text></svg>
