<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="완전연결을 합성곱으로 바꾼 조밀 평가"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">조밀 평가 — 첫 완전연결 층을 7x7 합성곱으로, 뒤 둘을 1x1 로 바꾸면 어떤 크기의 그림에도 돌릴 수 있다</text><rect x="20" y="70" width="104" height="50" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="72" y="100" font-size="10.5" fill="#1C232C" text-anchor="middle" font-weight="bold">그림 Q x Q</text><line x1="125" y1="95" x2="132" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="133" y="70" width="104" height="50" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="185" y="100" font-size="10.5" fill="#1C232C" text-anchor="middle" font-weight="bold">합성곱 + 풀링 다섯</text><line x1="238" y1="95" x2="245" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="246" y="70" width="104" height="50" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="298" y="100" font-size="10.5" fill="#1C232C" text-anchor="middle" font-weight="bold">Q/32 x Q/32 x 512</text><line x1="351" y1="95" x2="358" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="359" y="70" width="104" height="50" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="411" y="100" font-size="10.5" fill="#1C232C" text-anchor="middle" font-weight="bold">7x7 conv 4096</text><line x1="464" y1="95" x2="471" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="472" y="70" width="104" height="50" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="524" y="100" font-size="10.5" fill="#1C232C" text-anchor="middle" font-weight="bold">1x1 conv 4096</text><line x1="577" y1="95" x2="584" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="585" y="70" width="104" height="50" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="637" y="100" font-size="10.5" fill="#1C232C" text-anchor="middle" font-weight="bold">1x1 conv 1000</text><line x1="690" y1="95" x2="697" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="698" y="70" width="104" height="50" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.4"/><text x="750" y="100" font-size="10.5" fill="#1C232C" text-anchor="middle" font-weight="bold">평균 → 1000</text><text x="410" y="148" font-size="12" fill="#4E5964" text-anchor="middle">점수 지도의 크기 = Q/32 − 6 (정사각 그림을 가정한 내 계산). 한 칸이 224x224 조각 하나의 점수에 해당한다</text><rect x="60" y="180" width="11" height="11" rx="1" fill="#FFF3C4" stroke="#9A7B00" stroke-width="0.6"/><text x="120" y="320" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">Q = 224 → 1 x 1 = 1 칸</text><rect x="245" y="180" width="11" height="11" rx="1" fill="#