<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="학습 척도에 따른 자르기 비율"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">학습 척도 S = 짧은 변을 S 로 줄인 뒤 224x224 를 잘라 낸다 — S 가 클수록 자른 조각은 물체의 일부다</text><rect x="40" y="70" width="102.39999999999999" height="76.8" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><rect x="57.599999999999994" y="74.8" width="67.2" height="67.2" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="2"/><text x="91.19999999999999" y="166.8" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">S = 256</text><text x="91.19999999999999" y="184.8" font-size="11" fill="#4E5964" text-anchor="middle">짧은 변의 88%, 넓이의 57%</text><rect x="210" y="70" width="153.6" height="115.19999999999999" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><rect x="253.2" y="94.0" width="67.2" height="67.2" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="2"/><text x="286.8" y="205.2" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">S = 384</text><text x="286.8" y="223.2" font-size="11" fill="#4E5964" text-anchor="middle">짧은 변의 58%, 넓이의 26%</text><rect x="440" y="70" width="204.79999999999998" height="153.6" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><rect x="508.79999999999995" y="113.19999999999999" width="67.2" height="67.2" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="2"/><text x="542.4" y="243.6" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">S = 512</text><text x="542.4" y="261.6" font-size="11" fill="#4E5964" text-anchor="middle">짧은 변의 44%, 넓이의 14%</text><rect x="30" y="290" width="760" height="56" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="50" y="312" font-size="11" fill="#1C232C" text-anchor="start">고정: S = 256 또는 384 (384 망은 256 망에서 시작, 학습률 10⁻³).  흔들기: 그림마다 S 를 [256, 512] 에서 뽑는다 — 384 망에서 미세조정</text><text x="50" y="332" font-size="11" fill="#7A8590" text-anchor="start">넓이 비율은 4:3 사진을 가정한 내 계산이다. 논문은 사진의 가로세로 비를 적지 않는다</text></svg>
