<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="1x1 합성곱과 망 C, D 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">1x1 합성곱은 자리마다 채널을 섞는 선형 사상이다 — 망 C 는 1x1, 망 D 는 같은 자리에 3x3 을 둔다</text><rect x="20" y="50" width="380" height="240" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="210" y="74" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">1x1: 한 자리의 채널 벡터만 본다</text><rect x="70" y="110" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="70" y="132" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="70" y="154" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="70" y="176" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="70" y="198" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="92" y="110" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="92" y="132" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="92" y="154" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="92" y="176" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="92" y="198" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="114" y="110" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="114" y="132" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="114" y="154" width="20" height="20" rx="2" fill="#FFF3C4" stroke="#CFD6D3" stroke-width="1.2"/><rect x="114" y="176" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="114" y="198" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="136" y="110" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="136" y="132" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="136" y="154" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="136" y="176" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="136" y="198" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="158" y="110" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="158" y="132" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="158" y="154" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="158" y="176" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="158" y="198" width="20" height="20" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><line x1="185" y1="165" x2="245" y2="165" stroke="#9A7B00" stroke-width="1.6" marker-end="url(#ac)"/><rect x="255" y="145" width="110" height="40" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="310" y="170" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">W · v (C x C)</text><text x="210" y="250" font-size="12" fill="#4E5964" text-anchor="middle">수용장이 넓어지지 않는다. ReLU 하나를 더할 뿐</text><text x="210" y="270" font-size="11" fill="#7A8590" text-anchor="middle">3 단계 · 4 단계 · 5 단계 끝에 하나씩</text><rect x="420" y="50" width="380" height="240" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="610" y="74" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">같은 자리의 결과 (표 3, S = Q = 256)</text><text x="440" y="115" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">B (13 층)</text><text x="640" y="115" font-size="12" fill="#2A78D6" text-anchor="start">top-1 28.7</text><text x="720" y="115" font-size="12" fill="#EB6834" text-anchor="start">top-5 9.9</text><text x="440" y="159" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">C (16 층, 1x1 셋)</text><text x="640" y="159" font-size="12" fill="#2A78D6" text-anchor="start">top-1 28.1</text><text x="720" y="159" font-size="12" fill="#EB6834" text-anchor="start">top-5 9.4</text><text x="440" y="203" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">D (16 층, 3x3 셋)</text><text x="640" y="203" font-size="12" fill="#2A78D6" text-anchor="start">top-1 27.0</text><text x="720" y="203" font-size="12" fill="#EB6834" text-anchor="start">top-5 8.8</text><text x="610" y="250" font-size="12" fill="#1E8449" text-anchor="middle">B → C: 0.6 / 0.5,  C → D: 1.1 / 0.6 (백분율 점)</text><text x="610" y="270" font-size="11" fill="#4E5964" text-anchor="middle">논문의 해석: 비선형도 돕지만 공간 맥락이 더 돕는다</text><text x="410" y="322" font-size="11" fill="#7A8590" text-anchor="middle">C 와 D 는 층 수가 같지만 파라미터가 다르다 — C 133.6M, D 138.4M. 그래서 C → D 의 차이는 「3x3 이라서」와 「파라미터가 4.7M 많아서」가 섞여 있다</text><text x="410" y="342" font-size="11" fill="#7A8590" text-anchor="middle">(이 섞임은 내가 짚은 것이다. 논문은 두 요인을 가르지 않는다)</text></svg>
