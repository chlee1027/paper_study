<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="AlexNet 과 VGG 비교 표"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">AlexNet(2012) 과 VGG(2015) — 같은 뼈대(합성곱 + 완전연결 셋), 다른 선택</text><rect x="20" y="55" width="780" height="36" rx="4" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="78" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold"></text><text x="380.0" y="78" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">AlexNet 2012</text><text x="660.0" y="78" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">VGG 2015</text><rect x="20" y="91" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="115" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">학습되는 층</text><text x="380.0" y="115" font-size="12" fill="#1C232C" text-anchor="middle">8</text><text x="660.0" y="115" font-size="12" fill="#1C232C" text-anchor="middle">11 ~ 19</text><rect x="20" y="129" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">첫 합성곱</text><text x="380.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">11x11, 보폭 4</text><text x="660.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">3x3, 보폭 1</text><rect x="20" y="167" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="191" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">커널 크기</text><text x="380.0" y="191" font-size="12" fill="#1C232C" text-anchor="middle">11 · 5 · 3</text><text x="660.0" y="191" font-size="12" fill="#1C232C" text-anchor="middle">모두 3 (C 만 1x1 셋)</text><rect x="20" y="205" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="229" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">정규화</text><text x="380.0" y="229" font-size="12" fill="#1C232C" text-anchor="middle">LRN</text><text x="660.0" y="229" font-size="12" fill="#1C232C" text-anchor="middle">없다 (도움이 없었다)</text><rect x="20" y="243" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">풀링</text><text x="380.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle">3x3 보폭 2 (겹침)</text><text x="660.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle">2x2 보폭 2</text><rect x="20" y="281" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">파라미터</text><text x="380.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle">62.4M (GPU 나눔 없이 센 값)</text><text x="660.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle">133 ~ 144M</text><rect x="20" y="319" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">초기화</text><text x="380.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle">무작위</text><text x="660.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle">얕은 A 를 먼저 배워 옮긴다</text><rect x="20" y="357" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">시험</text><text x="380.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle">조각 10 개</text><text x="660.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle">조밀 평가 + 척도 셋</text><rect x="20" y="395" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="419" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">ILSVRC top-5 시험 (망 1)</text><text x="380.0" y="419" font-size="12" fill="#1C232C" text-anchor="middle">18.2 (검증, 표 7)</text><text x="660.0" y="419" font-size="12" fill="#1C232C" text-anchor="middle">7.0</text><text x="410" y="458" font-size="11" fill="#7A8590" text-anchor="middle">AlexNet 칸은 앞 노트의 AlexNet 논문과 이 논문 표 7 에서 옮겼다. 표 7 의 AlexNet 망 1 은 top-5 시험 값이 없어 검증 값을 적었다</text></svg>
