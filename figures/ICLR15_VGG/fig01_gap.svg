<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="AlexNet 의 선택과 VGG 의 규칙 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">AlexNet(2012) 은 층마다 다른 선택을 했다. VGG 는 규칙 하나로 고정하고 깊이만 바꾼다</text><rect x="20" y="50" width="380" height="300" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="210" y="74" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">AlexNet: 층마다 다르다</text><text x="60" y="110" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">합성곱 1</text><text x="170" y="110" font-size="12" fill="#4E5964" text-anchor="start">11x11, 보폭 4, 96</text><text x="60" y="146" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">합성곱 2</text><text x="170" y="146" font-size="12" fill="#4E5964" text-anchor="start">5x5, 256</text><text x="60" y="182" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">합성곱 3~5</text><text x="170" y="182" font-size="12" fill="#4E5964" text-anchor="start">3x3, 384 · 384 · 256</text><text x="60" y="218" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">정규화</text><text x="170" y="218" font-size="12" fill="#4E5964" text-anchor="start">LRN (상수 넷)</text><text x="60" y="254" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">풀링</text><text x="170" y="254" font-size="12" fill="#4E5964" text-anchor="start">3x3, 보폭 2 (겹침)</text><text x="60" y="290" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">깊이</text><text x="170" y="290" font-size="12" fill="#4E5964" text-anchor="start">학습되는 층 8</text><rect x="420" y="50" width="380" height="300" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="610" y="74" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">VGG: 한 규칙, 깊이만 바꾼다</text><text x="450" y="110" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">합성곱</text><text x="540" y="110" font-size="12" fill="#4E5964" text-anchor="start">모두 3x3, 보폭 1, 여백 1</text><text x="450" y="146" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">채널</text><text x="540" y="146" font-size="12" fill="#4E5964" text-anchor="start">64 에서 풀링마다 2 배, 512 까지</text><text x="450" y="182" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">풀링</text><text x="540" y="182" font-size="12" fill="#4E5964" text-anchor="start">2x2, 보폭 2 (겹치지 않음), 다섯 번</text><text x="450" y="218" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">정규화</text><text x="540" y="218" font-size="12" fill="#4E5964" text-anchor="start">없다 (A-LRN 하나만 시험)</text><text x="450" y="254" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">완전연결</text><text x="540" y="254" font-size="12" fill="#4E5964" text-anchor="start">4096 · 4096 · 1000, 모든 망 같다</text><text x="450" y="290" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">깊이</text><text x="540" y="290" font-size="12" fill="#4E5964" text-anchor="start">11 · 13 · 16 · 16 · 19</text><text x="410" y="372" font-size="11" fill="#7A8590" text-anchor="middle">AlexNet 노트가 남긴 물음: 「층을 빼면 top-1 이 약 2% 나빠진다」가 숫자 한 개였다. 이 논문은 깊이를 다섯 단계로 체계적으로 바꾼다</text></svg>
