idth="26" height="26" rx="3" fill="#FFF3C4" stroke="#4E5964" stroke-width="1.2"/><rect x="487.0" y="257.0" width="26" height="26" rx="3" fill="#FFF3C4" stroke="#4E5964" stroke-width="1.2"/><text x="270" y="274" font-size="12" fill="#1C232C" text-anchor="end">입력</text><rect x="307.0" y="195.0" width="26" height="26" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="337.0" y="195.0" width="26" height="26" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><rect x="367.0" y="195.0" width="26" height="26" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><rect x="397.0" y="195.0" width="26" height="26" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><rect x="427.0" y="195.0" width="26" height="26" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><rect x="457.0" y="195.0" width="26" height="26" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><rect x="487.0" y="195.0" width="26" height="26" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="270" y="212" font-size="12" fill="#1C232C" text-anchor="end">3x3 한 층 뒤</text><text x="550" y="212" font-size="12" fill="#2E6B8A" text-anchor="start">이 줄의 한 칸이 입력에서 보는 폭 = 3x3</text><rect x="307.0" y="133.0" width="26" height="26" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="337.0" y="133.0" width="26" height="26" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="367.0" y="133.0" width="26" height="26" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><rect x="397.0" y="133.0" width="26" height="26" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><rect x="427.0" y="133.0" width="26" height="26" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><rect x="457.0" y="133.0" width="26" height="26" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="487.0" y="133.0" width="26" height="26" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="270" y="150" font-siz