<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="7x7 한 층과 3x3 세 층의 파라미터 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">같은 7x7 수용장을 두 방법으로 — 입력·출력 채널이 C 로 같을 때 (C = 512 는 내가 넣은 값)</text><rect x="20" y="50" width="385" height="250" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="212" y="74" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="bold">7x7 한 층</text><rect x="80" y="230" width="170" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="165" y="253" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">7x7 conv</text><text x="270" y="253" font-size="12" fill="#4E5964" text-anchor="start">49C²</text><text x="350" y="253" font-size="11" fill="#1E8449" text-anchor="start">ReLU</text><text x="212" y="286" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">합계 49C² = 12,845,056 개,  ReLU 1 번</text><rect x="415" y="50" width="385" height="250" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="607" y="74" font-size="14" fill="#2E6B8A" text-anchor="middle" font-weight="bold">3x3 세 층</text><rect x="475" y="230" width="170" height="36" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="560" y="253" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">3x3 conv</text><text x="665" y="253" font-size="12" fill="#4E5964" text-anchor="start">9C²</text><text x="745" y="253" font-size="11" fill="#1E8449" text-anchor="start">ReLU</text><rect x="475" y="180" width="170" height="36" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="560" y="203" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">3x3 conv</text><text x="665" y="203" font-size="12" fill="#4E5964" text-anchor="start">9C²</text><text x="745" y="203" font-size="11" fill="#1E8449" text-anchor="start">ReLU</text><rect x="475" y="130" width="170" height="36" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="560" y="153" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">3x3 conv</text><text x="665" y="153" font-size="12" fill="#4E5964" text-anchor="start">9C²</text><text x="745" y="153" font-size="11" fill="#1E8449" text-anchor="start">ReLU</text><text x="607" y="286" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">합계 27C² = 7,077,888 개,  ReLU 3 번</text><text x="410" y="326" font-size="12" fill="#4E5964" text-anchor="middle">7x7 이 3x3 세 층보다 81% 많다 (49/27 = 1.815). 같은 셈으로 5x5 한 층은 3x3 두 층보다 39% 많다 (25/18)</text><text x="410" y="346" font-size="11" fill="#7A8590" text-anchor="middle">논문은 이것을 「7x7 필터가 3x3 들로 분해되도록 강제하는 정규화」로 본다 — 7x7 이 낼 수 있는 모든 필터를 세 층이 낼 수 있는 것은 아니다</text></svg>
