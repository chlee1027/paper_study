<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보와 층별 수용장"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보, 그리고 곁가지 — 망 D 의 각 풀링 뒤 한 칸이 보는 입력 크기 (이 파일이 센 수용장)</text><rect x="25" y="50" width="170" height="56" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="110" y="74" font-size="13" fill="#4E5964" text-anchor="middle" font-weight="bold">LeNet 1998</text><text x="110" y="94" font-size="11" fill="#4E5964" text-anchor="middle">작은 합성곱 망</text><line x1="197" y1="78" x2="223" y2="78" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="225" y="50" width="170" height="56" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="310" y="74" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">AlexNet 2012</text><text x="310" y="94" font-size="11" fill="#4E5964" text-anchor="middle">크게, 층마다 다르게</text><line x1="397" y1="78" x2="423" y2="78" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="425" y="50" width="170" height="56" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="510" y="74" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">VGG 2015</text><text x="510" y="94" font-size="11" fill="#4E5964" text-anchor="middle">3x3 하나로, 깊게</text><line x1="597" y1="78" x2="623" y2="78" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="625" y="50" width="170" height="56" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="710" y="74" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">BN · ResNet (다음)</text><text x="710" y="94" font-size="11" fill="#4E5964" text-anchor="middle">더 깊게 배우는 법</text><text x="410" y="130" font-size="11" fill="#1C232C" text-anchor="middle">넘긴 것: 19 층에서 오차가 멈췄고, 깊은 망은 얕은 A 에서 가중치를 옮겨 와야 시작할 수 있었다 — 다음 두 편이 받는 자리</text><rect x="60" y="160" width="94" height="94" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="105.74" y="205.74" width="2.52" height="2.52" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="107" y="272" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">풀링 1 뒤</text><text x="107" y="290" font-size="11" fill="#4E5964" text-anchor="middle">6 픽셀 (보폭 2)</text><rect x="210" y="160" width="94" height="94" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="253.64" y="203.64" width="6.72" height="6.72" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="257" y="272" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">풀링 2 뒤</text><text x="257" y="290" font-size="11" fill="#4E5964" text-anchor="middle">16 픽셀 (보폭 4)</text><rect x="360" y="160" width="94" height="94" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="397.76" y="197.76" width="18.48" height="18.48" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="407" y="272" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">풀링 3 뒤</text><text x="407" y="290" font-size="11" fill="#4E5964" text-anchor="middle">44 픽셀 (보폭 8)</text><rect x="510" y="160" width="94" height="94" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="536.0" y="186.0" width="42.0" height="42.0" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="557" y="272" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">풀링 4 뒤</text><text x="557" y="290" font-size="11" fill="#4E5964" text-anchor="middle">100 픽셀 (보폭 16)</text><rect x="660" y="160" width="94" height="94" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="662.48" y="162.48000000000002" width="89.03999999999999" height="89.03999999999999" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="707" y="272" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">풀링 5 뒤</text><text x="707" y="290" font-size="11" fill="#4E5964" text-anchor="middle">212 픽셀 (보폭 32)</text><text x="410" y="150" font-size="10" fill="#7A8590" text-anchor="middle">네모 = 224x224 입력, 노란 칸 = 한 자리의 수용장 (224 를 넘으면 가득 찬다)</text><rect x="25" y="310" width="770" height="100" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="45" y="334" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">곁가지 — 이상 탐지로 가는 길 (논문은 이 쓰임을 적지 않는다. 내가 잇는 자리다)</text><text x="45" y="358" font-size="11" fill="#1C232C" text-anchor="start">부록 B: ImageNet 으로 배운 망을 얼려 두고 특징만 떼어 다른 과제에 붙여도 된다 — 사전학습 특징으로 이상을 찾는 방법들의 전제</text><text x="45" y="380" font-size="11" fill="#1C232C" text-anchor="start">조밀 평가처럼 돌리면 중간 층 한 칸이 위 크기의 조각 하나를 요약한다. 어느 층을 쓰느냐가 「얼마나 큰 흠을 보느냐」다</text><text x="45" y="400" font-size="11" fill="#7A8590" text-anchor="start">잴 방법은 이 노트의 돌려 볼 것 D 에 적었다</text></svg>
