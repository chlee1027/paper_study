<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360"><rect width="900" height="360" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 편의 자리 — 가짜 이상으로 판별기를 배우는 계열과 사전학습 특징 계열 (이 저장소의 노트 기준)</text><rect x="20.0" y="60.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="120.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM (ICCV 2021)</text><text x="120.0" y="100.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지에 가짜 결함, 분할 망</text><rect x="250.0" y="60.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="350.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CutPaste (CVPR 2021)</text><text x="350.0" y="100.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">조각을 잘라 붙여 분류</text><rect x="480.0" y="60.0" width="200.0" height="52.0" fill="#ffffff" stroke="#c8553d"/><text x="580.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">SimpleNet (CVPR 2023)</text><text x="580.0" y="100.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">특징에 가우스 잡음, MLP 판별</text><rect x="710.0" y="60.0" width="170.0" height="52.0" fill="#ffffff" stroke="#2f6db3"/><text x="795.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">EfficientAD (WACV 2024)</text><text x="795.0" y="100.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 큰 틀의 마지막 칸</text><line x1="220.0" y1="86.0" x2="250.0" y2="86.0" stroke="#222222" stroke-width="1.5"/><line x1="450.0" y1="86.0" x2="480.0" y2="86.0" stroke="#222222" stroke-width="1.5"/><line x1="680.0" y1="86.0" x2="710.0" y2="86.0" stroke="#222222" stroke-width="1.5"/><rect x="20.0" y="170.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="120.0" y="192.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">SPADE · PaDiM</text><text x="120.0" y="210.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">정상 특징을 저장 · 가우스</text><rect x="250.0" y="170.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="350.0" y="192.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PatchCore (CVPR 2022)</text><text x="350.0" y="210.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">2 · 3 단계 조각 특징 + 뱅크</text><rect x="480.0" y="170.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="580.0" y="192.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RD (CVPR 2022)</text><text x="580.0" y="210.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">선생 부호기 · 학생 복호기</text><line x1="350.0" y1="170.0" x2="560.0" y2="112.0" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/><text x="570.0" y="146.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">특징 추출(식 1 ~ 3)을 PatchCore 에서 그대로 따른다</text><text x="20.0" y="262.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">SimpleNet 은 PatchCore 의 조각 특징을 받고, 뱅크와 최근접 검색 대신 「FC 한 층 + 잡음 + MLP 판별기」 를 둔다.</text><text x="20.0" y="284.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">가짜 결함을 이미지가 아니라 특징 공간에 만든다는 점이 DRAEM · CutPaste 와 갈린다. 같은 설정에서 이미지 공간 결함을 쓴 줄은</text><text x="20.0" y="304.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 편의 끈 실험(표 2 ~ 4, 그림 5 ~ 7)에 들어 있지 않다.</text></svg>