<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330"><rect width="1000" height="330" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원문 그림 4 를 막대 좌표로 읽은 요약: 차원 1,536 개의 표준편차가 퍼진 범위 (내가 읽음)</text><text x="20.0" y="44.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">가는 막대 = 최솟값 ~ 최댓값, 굵은 눈금 = 중앙값. 빨강 세로선 = 잡음 σ = 0.015 (모든 부류에 같은 값).</text><line x1="200.0" y1="64.0" x2="200.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/><text x="200.0" y="286.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.00</text><line x1="262.5" y1="64.0" x2="262.5" y2="270.0" stroke="#eeeeee" stroke-width="1"/><text x="262.5" y="286.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.02</text><line x1="325.0" y1="64.0" x2="325.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/><text x="325.0" y="286.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.04</text><line x1="387.5" y1="64.0" x2="387.5" y2="270.0" stroke="#eeeeee" stroke-width="1"/><text x="387.5" y="286.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.06</text><line x1="450.0" y1="64.0" x2="450.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/><text x="450.0" y="286.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.08</text><line x1="512.5" y1="64.0" x2="512.5" y2="270.0" stroke="#eeeeee" stroke-width="1"/><text x="512.5" y="286.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.10</text><line x1="575.0" y1="64.0" x2="575.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/><text x="575.0" y="286.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.12</text><line x1="637.5" y1="64.0" x2="637.5" y2="270.0" stroke="#eeeeee" stroke-width="1"/><text x="637.5" y="286.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.14</text><line x1="700.0" y1="64.0" x2="700.0" y2="270.0" stroke="#eeeeee" stroke-width="1"/><text x="700.0" y="286.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.16</text><line x1="246.9" y1="60.0" x2="246.9" y2="272.0" stroke="#c8553d" stroke-width="1.5" stroke-dasharray="4 3"/><text x="190.0" y="83.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">screw · 사전학습 특징</text><rect x="200.3" y="76.0" width="490.9" height="6.0" fill="#8a8a8a" stroke="none"/><rect x="323.2" y="72.0" width="3.0" height="14.0" fill="#222222" stroke="none"/><text x="714.0" y="83.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">중앙값 0.040 · σ 보다 작은 차원 120</text><text x="190.0" y="107.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">screw · 적응 뒤</text><rect x="289.7" y="100.0" width="162.5" height="6.0" fill="#2f6db3" stroke="none"/><rect x="323.5" y="96.0" width="3.0" height="14.0" fill="#222222" stroke="none"/><text x="714.0" y="107.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">중앙값 0.040 · 최솟값 0.029</text><text x="190.0" y="133.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">bottle · 사전학습 특징</text><rect x="200.6" y="126.0" width="499.4" height="6.0" fill="#8a8a8a" stroke="none"/><rect x="351.6" y="122.0" width="3.0" height="14.0" fill="#222222" stroke="none"/><text x="714.0" y="133.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">중앙값 0.049 · σ 보다 작은 차원 128 · 최댓값 0.329 (축 밖)</text><text x="190.0" y="157.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">bottle · 적응 뒤</text><rect x="309.4" y="150.0" width="223.4" height="6.0" fill="#2f6db3" stroke="none"/><rect x="384.4" y="146.0" width="3.0" height="14.0" fill="#222222" stroke="none"/><text x="714.0" y="157.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">중앙값 0.059 · 최솟값 0.035</text><text x="190.0" y="183.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">carpet · 사전학습 특징</text><rect x="200.3" y="176.0" width="436.9" height="6.0" fill="#8a8a8a" stroke="none"/><rect x="273.8" y="172.0" width="3.0" height="14.0" fill="#222222" stroke="none"/><text x="714.0" y="183.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">중앙값 0.024 · σ 보다 작은 차원 460</text><text x="190.0" y="207.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">carpet · 적응 뒤</text><rect x="280.0" y="200.0" width="83.1" height="6.0" fill="#2f6db3" stroke="none"/><rect x="299.1" y="196.0" width="3.0" height="14.0" fill="#222222" stroke="none"/><text x="714.0" y="207.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">중앙값 0.032 · 최솟값 0.026</text><text x="190.0" y="233.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">tile · 사전학습 특징</text><rect x="200.0" y="226.0" width="466.2" height="6.0" fill="#8a8a8a" stroke="none"/><rect x="291.6" y="222.0" width="3.0" height="14.0" fill="#222222" stroke="none"/><text x="714.0" y="233.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">중앙값 0.030 · σ 보다 작은 차원 325</text><text x="190.0" y="257.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">tile · 적응 뒤</text><rect x="294.1" y="250.0" width="81.9" height="6.0" fill="#2f6db3" stroke="none"/><rect x="315.7" y="246.0" width="3.0" height="14.0" fill="#222222" stroke="none"/><text x="714.0" y="257.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">중앙값 0.037 · 최솟값 0.030</text><text x="20.0" y="316.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">적응 뒤에는 네 부류 모두 σ 보다 작은 차원이 없다. 중앙값 대비 σ 는 0.25 (bottle) ~ 0.47 (carpet) 로 부류마다 다르다.</text></svg>