<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 422" width="980" height="422"><rect width="980" height="422" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 1 의 상대 열을 원 출처와 칸 단위로 맞대 본 결과 (내 대조)</text><text x="20.0" y="44.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">빨강 = 지표가 바뀌었거나 다른 방법의 값과 섞임 · 초록 = 칸이 모두 같음 · 회색 = 대조할 원문이 없음</text><text x="20.0" y="72.0" font-size="11" fill="#666666" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">열</text><text x="120.0" y="72.0" font-size="11" fill="#666666" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">지표</text><text x="210.0" y="72.0" font-size="11" fill="#666666" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">맞댄 곳</text><text x="640.0" y="72.0" font-size="11" fill="#666666" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">같은 칸</text><text x="720.0" y="72.0" font-size="11" fill="#666666" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">판정</text><rect x="14.0" y="84.0" width="952.0" height="24.0" fill="#ffffff" stroke="none"/><rect x="14.0" y="84.0" width="5.0" height="24.0" fill="#c8553d" stroke="none"/><text x="28.0" y="100.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">AE-SSIM</text><text x="120.0" y="100.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">I-AUROC</text><text x="210.0" y="100.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">MVTec AD 원문 표 3 의 분할 ROC AUC (픽셀)</text><text x="640.0" y="100.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">15/15</text><text x="720.0" y="100.0" font-size="11" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">다른 지표를 옮김</text><rect x="14.0" y="114.0" width="952.0" height="24.0" fill="#f6f6f6" stroke="none"/><rect x="14.0" y="114.0" width="5.0" height="24.0" fill="#c8553d" stroke="none"/><text x="28.0" y="130.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">AE-SSIM</text><text x="120.0" y="130.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">P-AUROC</text><text x="210.0" y="130.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM 원문 표 III AE-SSIM 의 PRO (US 원문 표 1)</text><text x="640.0" y="130.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">14/15</text><text x="720.0" y="130.0" font-size="11" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">다른 지표를 옮김, wood 60.5 -&gt; 60.3</text><rect x="14.0" y="144.0" width="952.0" height="24.0" fill="#ffffff" stroke="none"/><rect x="14.0" y="144.0" width="5.0" height="24.0" fill="#4a9a6a" stroke="none"/><text x="28.0" y="160.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RIAD</text><text x="120.0" y="160.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">I · P</text><text x="210.0" y="160.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM 표 1 · 2 의 RIAD 열</text><text x="640.0" y="160.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">15 · 15</text><text x="720.0" y="160.0" font-size="11" fill="#4a9a6a" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">옮긴 값과 같음</text><rect x="14.0" y="174.0" width="952.0" height="24.0" fill="#f6f6f6" stroke="none"/><rect x="14.0" y="174.0" width="5.0" height="24.0" fill="#4a9a6a" stroke="none"/><text x="28.0" y="190.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM</text><text x="120.0" y="190.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">I · P</text><text x="210.0" y="190.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM 원문 표 1 · 2</text><text x="640.0" y="190.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">15 · 15</text><text x="720.0" y="190.0" font-size="11" fill="#4a9a6a" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원 출처와 같음</text><rect x="14.0" y="204.0" width="952.0" height="24.0" fill="#ffffff" stroke="none"/><rect x="14.0" y="204.0" width="5.0" height="24.0" fill="#4a9a6a" stroke="none"/><text x="28.0" y="220.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CutPaste</text><text x="120.0" y="220.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">I · P</text><text x="210.0" y="220.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RD 표 1 · 2 의 CutPaste 열 (CutPaste 원문 미대조)</text><text x="640.0" y="220.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">15 · 15</text><text x="720.0" y="220.0" font-size="11" fill="#4a9a6a" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">옮긴 값과 같음</text><rect x="14.0" y="234.0" width="952.0" height="24.0" fill="#f6f6f6" stroke="none"/><rect x="14.0" y="234.0" width="5.0" height="24.0" fill="#8a8a8a" stroke="none"/><text x="28.0" y="250.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CS-Flow</text><text x="120.0" y="250.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">I</text><text x="210.0" y="250.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원문을 받지 않았다</text><text x="640.0" y="250.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">-</text><text x="720.0" y="250.0" font-size="11" fill="#8a8a8a" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">대조 못 함</text><rect x="14.0" y="264.0" width="952.0" height="24.0" fill="#ffffff" stroke="none"/><rect x="14.0" y="264.0" width="5.0" height="24.0" fill="#c8553d" stroke="none"/><text x="28.0" y="280.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM</text><text x="120.0" y="280.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">I-AUROC</text><text x="210.0" y="280.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">질감 5 = RD 표 1 PaDiM, 물체 10 = RD 표 1 MetaFormer</text><text x="640.0" y="280.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">5 + 10</text><text x="720.0" y="280.0" font-size="11" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">두 방법의 열이 섞임, 평균 셋은 MetaFormer</text><rect x="14.0" y="294.0" width="952.0" height="24.0" fill="#f6f6f6" stroke="none"/><rect x="14.0" y="294.0" width="5.0" height="24.0" fill="#4a9a6a" stroke="none"/><text x="28.0" y="310.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM</text><text x="120.0" y="310.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">P-AUROC</text><text x="210.0" y="310.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM 원문 WR50-Rd550</text><text x="640.0" y="310.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">15/15</text><text x="720.0" y="310.0" font-size="11" fill="#4a9a6a" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원 출처와 같음</text><rect x="14.0" y="324.0" width="952.0" height="24.0" fill="#ffffff" stroke="none"/><rect x="14.0" y="324.0" width="5.0" height="24.0" fill="#4a9a6a" stroke="none"/><text x="28.0" y="340.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RevDist</text><text x="120.0" y="340.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">I · P</text><text x="210.0" y="340.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RD 원문 표 1 · 2 의 256 열</text><text x="640.0" y="340.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">15 · 15</text><text x="720.0" y="340.0" font-size="11" fill="#4a9a6a" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원 출처와 같음</text><rect x="14.0" y="354.0" width="952.0" height="24.0" fill="#f6f6f6" stroke="none"/><rect x="14.0" y="354.0" width="5.0" height="24.0" fill="#4a9a6a" stroke="none"/><text x="28.0" y="370.0" font-size="11" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PatchCore</text><text x="120.0" y="370.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">I · P</text><text x="210.0" y="370.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PatchCore 원문 표 S1 · S2 의 코어셋 25% 줄</text><text x="640.0" y="370.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">15 · 15</text><text x="720.0" y="370.0" font-size="11" fill="#4a9a6a" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원 출처와 같음 (그림 2 는 10% · 1% 라 적음)</text><text x="20.0" y="410.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">I = 이미지 AUROC, P = 픽셀 AUROC. 대조에 쓴 값은 원 논문 PDF 또는 이 저장소 앞 노트의 그림 코드에 옮긴 값이다.</text></svg>