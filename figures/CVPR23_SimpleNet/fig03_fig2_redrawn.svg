<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470"><rect width="900" height="470" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원문 그림 2 를 벡터 좌표로 읽어 다시 그림 (FPS 대 I-AUROC)</text><text x="20.0" y="44.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원문은 y 축을 97.0 부터 그렸다. 여기서는 95.0 부터 그려 PaDiM 의 이미지 AUROC 가 들어갈 자리를 보인다.</text><line x1="90.0" y1="70.0" x2="90.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="90.0" y="406.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0</text><line x1="160.0" y1="70.0" x2="160.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="160.0" y="406.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">10</text><line x1="230.0" y1="70.0" x2="230.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="230.0" y="406.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">20</text><line x1="300.0" y1="70.0" x2="300.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="300.0" y="406.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">30</text><line x1="370.0" y1="70.0" x2="370.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="370.0" y="406.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">40</text><line x1="440.0" y1="70.0" x2="440.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="440.0" y="406.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">50</text><line x1="510.0" y1="70.0" x2="510.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="510.0" y="406.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">60</text><line x1="580.0" y1="70.0" x2="580.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="580.0" y="406.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">70</text><line x1="650.0" y1="70.0" x2="650.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="650.0" y="406.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">80</text><line x1="90.0" y1="390.0" x2="650.0" y2="390.0" stroke="#cccccc" stroke-width="1"/><text x="82.0" y="394.0" font-size="10" fill="#666666" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">95.0</text><line x1="90.0" y1="326.0" x2="650.0" y2="326.0" stroke="#cccccc" stroke-width="1"/><text x="82.0" y="330.0" font-size="10" fill="#666666" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">96.0</text><line x1="90.0" y1="262.0" x2="650.0" y2="262.0" stroke="#cccccc" stroke-width="1"/><text x="82.0" y="266.0" font-size="10" fill="#666666" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">97.0</text><line x1="90.0" y1="198.0" x2="650.0" y2="198.0" stroke="#cccccc" stroke-width="1"/><text x="82.0" y="202.0" font-size="10" fill="#666666" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">98.0</text><line x1="90.0" y1="134.0" x2="650.0" y2="134.0" stroke="#cccccc" stroke-width="1"/><text x="82.0" y="138.0" font-size="10" fill="#666666" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">99.0</text><line x1="90.0" y1="70.0" x2="650.0" y2="70.0" stroke="#cccccc" stroke-width="1"/><text x="82.0" y="74.0" font-size="10" fill="#666666" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">100.0</text><rect x="90.0" y="262.0" width="560.0" height="128.0" fill="#f3ece9" stroke="none"/><text x="644.0" y="377.2" font-size="10" fill="#c8553d" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원문 그림이 잘라 낸 구간 (97.0 아래)</text><circle cx="163.5" cy="127.6" r="4.0" fill="#222222" stroke="none"/><text x="171.5" y="121.6" font-size="10" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PatchCore 「10%」 99.1 · 10.5 FPS</text><circle cx="193.5" cy="134.0" r="4.0" fill="#222222" stroke="none"/><text x="201.5" y="150.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PatchCore 「1%」 99.0 · 14.8 FPS</text><circle cx="560.2" cy="198.0" r="4.0" fill="#222222" stroke="none"/><text x="552.2" y="192.0" font-size="10" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM 98.0 · 67.2 FPS</text><circle cx="411.7" cy="153.2" r="4.0" fill="#222222" stroke="none"/><text x="419.7" y="147.2" font-size="10" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CS-Flow 98.7 · 46.0 FPS</text><circle cx="94.7" cy="230.0" r="4.0" fill="#c8553d" stroke="none"/><text x="102.7" y="224.0" font-size="10" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM-WRN50 97.5 · 0.7 FPS</text><circle cx="98.5" cy="281.2" r="4.0" fill="#c8553d" stroke="none"/><text x="106.5" y="275.2" font-size="10" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM-RN18 96.7 · 1.2 FPS</text><circle cx="312.2" cy="166.0" r="4.0" fill="#222222" stroke="none"/><text x="320.2" y="160.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RD 98.5 · 31.8 FPS</text><circle cx="631.9" cy="95.3" r="4.0" fill="#2f6db3" stroke="none"/><text x="623.9" y="89.3" font-size="10" fill="#2f6db3" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Ours 99.6 · 77.4 FPS</text><line x1="88.7" y1="338.8" x2="100.7" y2="338.8" stroke="#c8553d" stroke-width="2"/><text x="104.7" y="342.8" font-size="10" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 1 의 PaDiM I-AUROC 95.8</text><line x1="88.7" y1="370.8" x2="100.7" y2="370.8" stroke="#c8553d" stroke-width="2"/><text x="104.7" y="374.8" font-size="10" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM 원문의 이미지 AUROC 95.3</text><text x="370.0" y="424.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Frames per second (FPS)</text><text x="20.0" y="448.0" font-size="10.5" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM 두 점의 y 값 97.5 · 96.7 은 PaDiM 원문 표 III 의 픽셀 AUROC 평균(WR50-Rd550 97.5, R18-Rd100 96.7)과 같다.</text><text x="20.0" y="466.0" font-size="10.5" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PatchCore 「10%」 점은 99.1 인데 PatchCore 원문 표 1 의 10% 는 99.0 이고 99.1 은 25% 다. 표 1 의 PatchCore 열도 25% 줄이다.</text><text x="20.0" y="484.0" font-size="10.5" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">「8 배 빠르다」: 77.42 / 10.50 = 7.37 (「10%」 점), 77.42 / 14.79 = 5.23 (「1%」 점). 가장 가까운 DRAEM 과는 77.42 / 67.17 = 1.15 배다.</text></svg>