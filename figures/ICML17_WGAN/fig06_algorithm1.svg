<svg xmlns="http://www.w3.org/2000/svg" width="900" height="500" viewBox="0 0 900 500" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="알고리즘 1 흐름"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">알고리즘 1 (WGAN) — critic 을 n_critic 번 배우고 생성기를 한 번. 원문 기본값 α = 0.00005, c = 0.01, m = 64, n_critic = 5</text><rect x="30" y="50" width="560" height="430" rx="6" fill="none" stroke="#4E5964" stroke-width="1.2" stroke-dasharray="6 4"/><text x="45" y="72" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">θ 가 수렴하지 않은 동안 (1행)</text><rect x="55" y="85" width="510" height="250" rx="6" fill="none" stroke="#2E6B8A" stroke-width="1.2" stroke-dasharray="4 3"/><text x="70" y="106" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">for t = 0, ..., n_critic (2행) — critic</text><rect x="75" y="118" width="460" height="36" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="305" y="141" font-size="12" fill="#1C232C" text-anchor="middle">진짜 m 개 x 를 P_r 에서, 잡음 m 개 z 를 p(z) 에서 (3 · 4행)</text><rect x="75" y="166" width="460" height="36" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="305" y="189" font-size="12" fill="#1C232C" text-anchor="middle">g_w ← ∇_w [ (1/m) Σ f_w(x) − (1/m) Σ f_w(g_θ(z)) ] (5행)</text><rect x="75" y="214" width="460" height="36" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="305" y="237" font-size="12" fill="#1C232C" text-anchor="middle">w ← w + α · RMSProp(w, g_w) — 올린다 (6행)</text><rect x="75" y="262" width="460" height="36" rx="6" fill="#F6D9D5" stroke="#C0392B" stroke-width="1.2"/><text x="305" y="285" font-size="12" fill="#1C232C" text-anchor="middle">w ← clip(w, −c, c) — 무게를 상자 [−c, c] 에 (7행)</text><line x1="305" y1="154" x2="305" y2="165" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="305" y1="202" x2="305" y2="213" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="305" y1="250" x2="305" y2="261" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M535,280 C568,280 568,136 535,136" fill="none" stroke="#2E6B8A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#af)"/><text x="560" y="314" font-size="11" fill="#2E6B8A" text-anchor="end">n_critic 번</text><line x1="305" y1="335" x2="305" y2="356" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="75" y="358" width="460" height="36" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="305" y="381" font-size="12" fill="#1C232C" text-anchor="middle">잡음 m 개를 새로 (9행)</text><line x1="305" y1="394" x2="305" y2="410" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="75" y="412" width="460" height="50" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="305" y="432" font-size="12" fill="#1C232C" text-anchor="middle">g_θ ← −∇_θ (1/m) Σ f_w(g_θ(z)),  θ ← θ − α · RMSProp(θ, g_θ)</text><text x="305" y="452" font-size="11" fill="#4E5964" text-anchor="middle">(10 · 11행) — 생성기는 f_w(g_θ(z)) 를 올린다</text><rect x="610" y="50" width="270" height="430" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="625" y="74" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">원문에서 확인한 것</text><text x="625" y="100" font-size="12" fill="#1C232C" text-anchor="start">로그 · 시그모이드가 없다</text><text x="625" y="121" font-size="12" fill="#4E5964" text-anchor="start">critic 출력이 확률이 아니다</text><text x="625" y="142" font-size="12" fill="#1C232C" text-anchor="start">최적화기는 RMSProp — Adam(β1 &gt; 0)</text><text x="625" y="163" font-size="12" fill="#4E5964" text-anchor="start">은 「가끔 불안정」해 바꿨다 (4.2절)</text><text x="625" y="184" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="625" y="205" font-size="12" fill="#C0392B" text-anchor="start">2행 「t = 0, ..., n_critic」 은</text><text x="625" y="226" font-size="12" fill="#C0392B" text-anchor="start">글자 그대로 세면 6 번이다</text><text x="625" y="247" font-size="12" fill="#4E5964" text-anchor="start">요구 조건 줄의 뜻(생성기 한 번당</text><text x="625" y="268" font-size="12" fill="#4E5964" text-anchor="start">critic 반복 수)은 5 번</text><text x="625" y="289" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="625" y="310" font-size="12" fill="#1C232C" text-anchor="start">그림 3 의 생성기 반복 600,000 번이면</text><text x="625" y="331" font-size="12" fill="#4E5964" text-anchor="start">critic 갱신 3,000,000 ~ 3,600,000 번,</text><text x="625" y="352" font-size="12" fill="#4E5964" text-anchor="start">critic 이 본 진짜 이미지</text><text x="625" y="373" font-size="12" fill="#4E5964" text-anchor="start">192,000,000 ~ 230,400,000 장 (내 셈)</text><text x="625" y="394" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="625" y="415" font-size="12" fill="#1C232C" text-anchor="start">원문: 「모든 실험이 기본값을 썼다」</text><text x="625" y="436" font-size="12" fill="#C0392B" text-anchor="start">그림 3 아래 칸 캡션은 「학습률이</text><text x="625" y="457" font-size="12" fill="#C0392B" text-anchor="start">상당히 높은」 실행이라고 적는다</text></svg>
