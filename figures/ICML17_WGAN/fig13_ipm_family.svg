<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="IPM 함수 모임"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">적분 확률 거리(IPM) d_F = sup_{f∈F} E_r[f] − E_θ[f] — 함수 모임 F 를 고르면 거리가 정해진다 (5절, 식 4)</text><rect x="30" y="62" width="250" height="86" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="155" y="100" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">1-립시츠 함수 전부</text><text x="155" y="124" font-size="11" fill="#7A8590" text-anchor="middle">F</text><line x1="282" y1="105" x2="330" y2="105" stroke="#1E8449" stroke-width="1.8" marker-end="url(#ai)"/><rect x="332" y="62" width="240" height="86" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="452" y="96" font-size="14" fill="#1E8449" text-anchor="middle" font-weight="bold">W (EM)</text><text x="452" y="122" font-size="11" fill="#4E5964" text-anchor="middle">약한 위상, 연속인 손실</text><rect x="592" y="62" width="300" height="86" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="742" y="100" font-size="12" fill="#1C232C" text-anchor="middle">WGAN — 무게 자르기로 K-립시츠 모임을 흉내</text><text x="742" y="124" font-size="10" fill="#7A8590" text-anchor="middle">생성 모델 쪽 짝</text><rect x="30" y="170" width="250" height="86" rx="6" fill="#F6F7F5" stroke="#8E44AD" stroke-width="1.6"/><text x="155" y="208" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">|f| ≤ 1 인 측정 가능 함수 전부</text><text x="155" y="232" font-size="11" fill="#7A8590" text-anchor="middle">F</text><line x1="282" y1="213" x2="330" y2="213" stroke="#8E44AD" stroke-width="1.8" marker-end="url(#ai)"/><rect x="332" y="170" width="240" height="86" rx="6" fill="#F6F7F5" stroke="#8E44AD" stroke-width="1.6"/><text x="452" y="204" font-size="14" fill="#8E44AD" text-anchor="middle" font-weight="bold">δ (TV) — 원문 표기</text><text x="452" y="230" font-size="11" fill="#4E5964" text-anchor="middle">센 위상, 예 1 에서 불연속</text><rect x="592" y="170" width="300" height="86" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="742" y="208" font-size="12" fill="#1C232C" text-anchor="middle">EBGAN — 판별기가 [0, m] (부록 D)</text><text x="742" y="232" font-size="10" fill="#7A8590" text-anchor="middle">생성 모델 쪽 짝</text><rect x="30" y="278" width="250" height="86" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.6"/><text x="155" y="316" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">RKHS 공의 함수 (‖f‖ ≤ 1)</text><text x="155" y="340" font-size="11" fill="#7A8590" text-anchor="middle">F</text><line x1="282" y1="321" x2="330" y2="321" stroke="#2A78D6" stroke-width="1.8" marker-end="url(#ai)"/><rect x="332" y="278" width="240" height="86" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.6"/><text x="452" y="312" font-size="14" fill="#2A78D6" text-anchor="middle" font-weight="bold">MMD</text><text x="452" y="338" font-size="11" fill="#4E5964" text-anchor="middle">핵이 정한다 — 띠폭이 작으면 TV 쪽</text><rect x="592" y="278" width="300" height="86" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="742" y="316" font-size="12" fill="#1C232C" text-anchor="middle">GMMN — 망 없이 핵 공식으로 (비용 제곱)</text><text x="742" y="340" font-size="10" fill="#7A8590" text-anchor="middle">생성 모델 쪽 짝</text><text x="30" y="400" font-size="11" fill="#7A8590" text-anchor="start">−f 도 F 안에 있으면 d_F 는 0 이상 · 대칭 · 삼각 부등식을 만족하는 의사 거리다(원문). 둘째 줄의 값은 sup_A 정의의 δ 가 아니라 그 두 배(Σ|p − q|)다 — 그림 8</text></svg>
