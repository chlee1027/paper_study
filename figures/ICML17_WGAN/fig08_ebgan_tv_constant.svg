<svg xmlns="http://www.w3.org/2000/svg" width="920" height="450" viewBox="0 0 920 450" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="EBGAN 정리 4 상수 확인"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">부록 D 정리 4 를 무차별 대입으로 — 최적 판별기에서 EBGAN 생성기 비용 L_G 는 δ 에 비례한다. 상수는 m/2 가 아니라 m 으로 나왔다</text><text x="80" y="76" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">P_r</text><text x="210" y="76" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">P_θ</text><text x="300" y="76" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">m</text><text x="420" y="76" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">δ = sup|P_r(A)−P_θ(A)|</text><text x="560" y="76" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">Σ|p_r − p_θ|</text><text x="660" y="76" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">L_G (최적 D)</text><text x="760" y="76" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">원문 (m/2)·δ</text><text x="850" y="76" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">m·δ</text><line x1="30" y1="86" x2="890" y2="86" stroke="#CFD6D3" stroke-width="1"/><text x="80" y="112" font-size="12" fill="#1C232C" text-anchor="middle">(0.7, 0.3, 0.0)</text><text x="210" y="112" font-size="12" fill="#1C232C" text-anchor="middle">(0.2, 0.3, 0.5)</text><text x="300" y="112" font-size="12" fill="#1C232C" text-anchor="middle">1</text><text x="420" y="112" font-size="12" fill="#1C232C" text-anchor="middle">0.50</text><text x="560" y="112" font-size="12" fill="#1C232C" text-anchor="middle">1.00</text><text x="660" y="112" font-size="12" fill="#1C232C" text-anchor="middle">0.500</text><text x="760" y="112" font-size="12" fill="#C0392B" text-anchor="middle">0.250</text><text x="850" y="112" font-size="12" fill="#1E8449" text-anchor="middle">0.500</text><text x="80" y="142" font-size="12" fill="#1C232C" text-anchor="middle">(0.5, 0.5, 0.0)</text><text x="210" y="142" font-size="12" fill="#1C232C" text-anchor="middle">(0.0, 0.5, 0.5)</text><text x="300" y="142" font-size="12" fill="#1C232C" text-anchor="middle">2</text><text x="420" y="142" font-size="12" fill="#1C232C" text-anchor="middle">0.50</text><text x="560" y="142" font-size="12" fill="#1C232C" text-anchor="middle">1.00</text><text x="660" y="142" font-size="12" fill="#1C232C" text-anchor="middle">1.000</text><text x="760" y="142" font-size="12" fill="#C0392B" text-anchor="middle">0.500</text><text x="850" y="142" font-size="12" fill="#1E8449" text-anchor="middle">1.000</text><text x="80" y="172" font-size="12" fill="#1C232C" text-anchor="middle">(0.4, 0.4, 0.2)</text><text x="210" y="172" font-size="12" fill="#1C232C" text-anchor="middle">(0.1, 0.3, 0.6)</text><text x="300" y="172" font-size="12" fill="#1C232C" text-anchor="middle">1</text><text x="420" y="172" font-size="12" fill="#1C232C" text-anchor="middle">0.40</text><text x="560" y="172" font-size="12" fill="#1C232C" text-anchor="middle">0.80</text><text x="660" y="172" font-size="12" fill="#1C232C" text-anchor="middle">0.400</text><text x="760" y="172" font-size="12" fill="#C0392B" text-anchor="middle">0.200</text><text x="850" y="172" font-size="12" fill="#1E8449" text-anchor="middle">0.400</text><text x="80" y="202" font-size="12" fill="#1C232C" text-anchor="middle">(1.0, 0.0, 0.0)</text><text x="210" y="202" font-size="12" fill="#1C232C" text-anchor="middle">(0.0, 0.0, 1.0)</text><text x="300" y="202" font-size="12" fill="#1C232C" text-anchor="middle">1</text><text x="420" y="202" font-size="12" fill="#1C232C" text-anchor="middle">1.00</text><text x="560" y="202" font-size="12" fill="#1C232C" text-anchor="middle">2.00</text><text x="660" y="202" font-size="12" fill="#1C232C" text-anchor="middle">1.000</text><text x="760" y="202" font-size="12" fill="#C0392B" text-anchor="middle">0.500</text><text x="850" y="202" font-size="12" fill="#1E8449" text-anchor="middle">1.000</text><text x="30" y="258" font-size="11" fill="#4E5964" text-anchor="start">판별기 D 를 각 점에서 [0, m] 의 21 칸 격자로 모두 훑어 L_D = E_r[D] + E_θ[[m − D]+] 를 가장 작게 하는 D 를 고르고, 그 D 에서 L_G = E_θ[D] − E_r[D] 를 쟀다</text><text x="30" y="280" font-size="11" fill="#1C232C" text-anchor="start">어긋나는 자리: 원문 2절과 부록 A 는 δ 를 sup_A |P_r(A) − P_θ(A)| 로 정의한다. 식 (7) 의 증명 끝은 |μ|(X) = ‖μ‖_TV = δ 로 적는데,</text><text x="30" y="302" font-size="11" fill="#1C232C" text-anchor="start">두 확률 분포의 차 μ 에서 |μ|(X) = Σ|p_r − p_θ| 는 sup_A |μ(A)| 의 두 배다 (위 표의 다섯째 칸 = 넷째 칸의 2 배)</text><text x="30" y="324" font-size="11" fill="#1E8449" text-anchor="start">그래서 inf_{−1≤f≤1} (E_r f − E_θ f) 는 −δ 가 아니라 −2δ 이고, 정리 4 의 상수는 m 이 된다. 「δ 에 비례한다」 는 결론은 그대로 선다</text><text x="30" y="346" font-size="11" fill="#4E5964" text-anchor="start">같은 두 배가 5절의 「|f| ≤ 1 인 함수 모임의 IPM 은 δ 다」 와 부록 A 의 「Φ 는 등거리」 에도 걸린다 — 정의를 Σ|p − q| 쪽으로 읽으면 셋 다 맞는다</text><text x="30" y="368" font-size="11" fill="#7A8590" text-anchor="start">이 확인은 내가 한 것이고, 세 이산 예에서 나온 값이다. 받침이 따로인 예(넷째 줄)는 손으로도 L_G = m 이 나온다: 진짜 쪽 D = 0, 가짜 쪽 D = m, δ = 1</text></svg>
