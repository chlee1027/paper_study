<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="MMD 비용 셈"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">5절의 MMD 비용 셈 — 「64x64 이미지면 미니배치 4096, 반복당 4096² — 배치 64 인 GAN 반복보다 다섯 자릿수 넘게 많다」</text><line x1="260.0" y1="70" x2="260.0" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="260.0" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^0</text><line x1="326.66666666666663" y1="70" x2="326.66666666666663" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="326.66666666666663" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^1</text><line x1="393.3333333333333" y1="70" x2="393.3333333333333" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="393.3333333333333" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^2</text><line x1="460.0" y1="70" x2="460.0" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="460.0" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^3</text><line x1="526.6666666666666" y1="70" x2="526.6666666666666" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="526.6666666666666" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^4</text><line x1="593.3333333333334" y1="70" x2="593.3333333333334" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="593.3333333333334" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^5</text><line x1="660.0" y1="70" x2="660.0" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="660.0" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^6</text><line x1="726.6666666666667" y1="70" x2="726.6666666666667" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="726.6666666666667" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^7</text><line x1="793.3333333333333" y1="70" x2="793.3333333333333" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="793.3333333333333" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^8</text><line x1="860.0" y1="70" x2="860.0" y2="300" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="860.0" y="318" font-size="10" fill="#7A8590" text-anchor="middle">10^9</text><rect x="260" y="86" width="120.4119982655925" height="30" rx="2" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><text x="250" y="106" font-size="12" fill="#1C232C" text-anchor="end">GAN 반복, 배치 64 (선형)</text><text x="388.4119982655925" y="106" font-size="11" fill="#4E5964" text-anchor="start">64</text><rect x="260" y="138" width="240.82399653118495" height="30" rx="2" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><text x="250" y="158" font-size="12" fill="#1C232C" text-anchor="end">GAN 배치 64 를 제곱으로 셀 때</text><text x="508.82399653118495" y="158" font-size="11" fill="#4E5964" text-anchor="start">4,096</text><rect x="260" y="190" width="481.6479930623699" height="30" rx="2" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><text x="250" y="210" font-size="12" fill="#1C232C" text-anchor="end">MMD, 배치 4096 (원문)</text><text x="749.6479930623699" y="210" font-size="11" fill="#4E5964" text-anchor="start">16,777,216</text><rect x="260" y="242" width="545.2641603583248" height="30" rx="2" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><text x="250" y="262" font-size="12" fill="#1C232C" text-anchor="end">MMD, 배치 12288 (색 채널)</text><text x="813.2641603583248" y="262" font-size="11" fill="#4E5964" text-anchor="start">150,994,944</text><text x="560" y="336" font-size="11" fill="#4E5964" text-anchor="middle">반복 하나의 계산량 (상대 단위, 로그 눈금)</text><text x="30" y="362" font-size="11" fill="#4E5964" text-anchor="start">4096² / 64 = 262,144 배 = 10^5.42 — 원문의 「다섯 자릿수 넘게」 는 MMD 를 제곱으로, GAN 을 선형으로 센 비교다. 둘 다 제곱으로 세면 4096² / 64² = 4,096 배 = 10^3.61</text><text x="30" y="383" font-size="11" fill="#4E5964" text-anchor="start">「차원만큼 표본」 의 차원을 원문은 64 x 64 = 4096 으로 셌다. 색 채널 셋을 넣으면 12,288 이다. 원문은 이 셈이 MMD 에 박할 수 있다고 스스로 적는다(경험 대 이론 표본 복잡도)</text></svg>
