<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="예 1 의 네 거리"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">예 1 의 네 거리를 θ 의 함수로 — 원문 그림 1 은 왼쪽 둘(W · JS)만 그린다. KL 은 θ ≠ 0 에서 +∞ 라 그리지 않았다</text><line x1="70" y1="330" x2="520" y2="330" stroke="#4E5964" stroke-width="1.2"/><line x1="70" y1="60" x2="70" y2="330" stroke="#4E5964" stroke-width="1.2"/><line x1="70.0" y1="330" x2="70.0" y2="334" stroke="#4E5964" stroke-width="1"/><text x="70.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">-1</text><line x1="182.5" y1="330" x2="182.5" y2="334" stroke="#4E5964" stroke-width="1"/><text x="182.5" y="347" font-size="10" fill="#7A8590" text-anchor="middle">-0.5</text><line x1="295.0" y1="330" x2="295.0" y2="334" stroke="#4E5964" stroke-width="1"/><text x="295.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">0</text><line x1="407.5" y1="330" x2="407.5" y2="334" stroke="#4E5964" stroke-width="1"/><text x="407.5" y="347" font-size="10" fill="#7A8590" text-anchor="middle">0.5</text><line x1="520.0" y1="330" x2="520.0" y2="334" stroke="#4E5964" stroke-width="1"/><text x="520.0" y="347" font-size="10" fill="#7A8590" text-anchor="middle">1</text><line x1="66" y1="330.0" x2="70" y2="330.0" stroke="#4E5964" stroke-width="1"/><text x="63" y="334.0" font-size="10" fill="#7A8590" text-anchor="end">0</text><line x1="70" y1="330.0" x2="520" y2="330.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="66" y1="240.0" x2="70" y2="240.0" stroke="#4E5964" stroke-width="1"/><text x="63" y="244.0" font-size="10" fill="#7A8590" text-anchor="end">0.5</text><line x1="70" y1="240.0" x2="520" y2="240.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="66" y1="150.0" x2="70" y2="150.0" stroke="#4E5964" stroke-width="1"/><text x="63" y="154.0" font-size="10" fill="#7A8590" text-anchor="end">1</text><line x1="70" y1="150.0" x2="520" y2="150.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="66" y1="60.0" x2="70" y2="60.0" stroke="#4E5964" stroke-width="1"/><text x="63" y="64.0" font-size="10" fill="#7A8590" text-anchor="end">1.5</text><line x1="70" y1="60.0" x2="520" y2="60.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="295.0" y="364" font-size="11" fill="#4E5964" text-anchor="middle">θ</text><text x="70" y="50" font-size="11" fill="#4E5964" text-anchor="start">값</text><path d="M70.0,150.0 L75.6,154.5 L81.3,159.0 L86.9,163.5 L92.5,168.0 L98.1,172.5 L103.8,177.0 L109.4,181.5 L115.0,186.0 L120.6,190.5 L126.2,195.0 L131.9,199.5 L137.5,204.0 L143.1,208.5 L148.8,213.0 L154.4,217.5 L160.0,222.0 L165.6,226.5 L171.2,231.0 L176.9,235.5 L182.5,240.0 L188.1,244.5 L193.8,249.0 L199.4,253.5 L205.0,258.0 L210.6,262.5 L216.2,267.0 L221.9,271.5 L227.5,276.0 L233.1,280.5 L238.8,285.0 L244.4,289.5 L250.0,294.0 L255.6,298.5 L261.2,303.0 L266.9,307.5 L272.5,312.0 L278.1,316.5 L283.8,321.0 L289.4,325.5 L295.0,330.0 L300.6,325.5 L306.2,321.0 L311.9,316.5 L317.5,312.0 L323.1,307.5 L328.8,303.0 L334.4,298.5 L340.0,294.0 L345.6,289.5 L351.2,285.0 L356.9,280.5 L362.5,276.0 L368.1,271.5 L373.8,267.0 L379.4,262.5 L385.0,258.0 L390.6,253.5 L396.3,249.0 L401.9,244.5 L407.5,240.0 L413.1,235.5 L418.8,231.0 L424.4,226.5 L430.0,222.0 L435.6,217.5 L441.3,213.0 L446.9,208.5 L452.5,204.0 L458.1,199.5 L463.8,195.0 L469.4,190.5 L475.0,186.0 L480.6,181.5 L486.2,177.0 L491.9,172.5 L497.5,168.0 L503.1,163.5 L508.8,159.0 L514.4,154.5 L520.0,150.0" fill="none" stroke="#1E8449" stroke-width="2.4"/><line x1="70.0" y1="205.23350749920985" x2="292.3" y2="205.23350749920985" stroke="#2A78D6" stroke-width="2.4"/><line x1="70.0" y1="150.0" x2="292.3" y2="150.0" stroke="#8E44AD" stroke-width="2.0" stroke-dasharray="6 4"/><line x1="70.0" y1="80.4670149984197" x2="292.3" y2="80.4670149984197" stroke="#2A78D6" stroke-width="1.4" stroke-dasharray="2 3"/><line x1="297.7" y1="205.23350749920985" x2="520.0" y2="205.23350749920985" stroke="#2A78D6" stroke-width="2.4"/><line x1="297.7" y1="150.0" x2="520.0" y2="150.0" stroke="#8E44AD" stroke-width="2.0" stroke-dasharray="6 4"/><line x1="297.7" y1="80.4670149984197" x2="520.0" y2="80.4670149984197" stroke="#2A78D6" stroke-width="1.4" stroke-dasharray="2 3"/><circle cx="295.0" cy="330.0" r="4" fill="#1C232C" stroke="#1C232C" stroke-width="1.2"/><text x="151.0" y="240.0" font-size="12" fill="#1E8449" text-anchor="end" font-weight="bold">W = |θ|</text><text x="306.25" y="197.23350749920985" font-size="11" fill="#2A78D6" text-anchor="start">JS = log 2 = 0.693 (1/2 무게)</text><text x="306.25" y="142.0" font-size="11" fill="#8E44AD" text-anchor="start">δ (TV) = 1</text><text x="74.5" y="72.4670149984197" font-size="11" fill="#2A78D6" text-anchor="start">2 log 2 = 1.386 — 2절 정의(1/2 없음)대로면 이 값</text><text x="303.0" y="322.0" font-size="10" fill="#1C232C" text-anchor="start">θ = 0: 넷 모두 0</text><rect x="550" y="60" width="330" height="290" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="565" y="86" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">원문 그림 1 의 눈금을 읽은 것</text><text x="565" y="112" font-size="12" fill="#1C232C" text-anchor="start">왼쪽: W 가 θ = ±1 에서 1, 0 에서 0 인 V 자</text><text x="565" y="133" font-size="12" fill="#1C232C" text-anchor="start">오른쪽: JSD 가 θ ≠ 0 에서 0.69 로 평평,</text><text x="565" y="154" font-size="12" fill="#1C232C" text-anchor="start">θ = 0 한 점만 0</text><text x="565" y="175" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="565" y="196" font-size="12" fill="#4E5964" text-anchor="start">오른쪽 축의 0.69 는 log 2 = 0.693 다.</text><text x="565" y="217" font-size="12" fill="#4E5964" text-anchor="start">곧 그림은 1/2 무게가 붙은 JS 를 그렸다</text><text x="565" y="238" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="565" y="259" font-size="12" fill="#C0392B" text-anchor="start">원문 2절의 정의 JS = KL(Pr‖Pm) + KL(Pg‖Pm)</text><text x="565" y="280" font-size="12" fill="#C0392B" text-anchor="start">에는 1/2 이 없다. 그 정의를 그대로 쓰면</text><text x="565" y="301" font-size="12" fill="#C0392B" text-anchor="start">예 1 의 값은 2 log 2 = 1.386 이 된다</text><text x="565" y="322" font-size="12" fill="#4E5964" text-anchor="start">부록 C (정리 2 의 증명)는 1/2 을 붙여 쓴다</text></svg>
