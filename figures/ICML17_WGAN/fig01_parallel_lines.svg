<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="예 1 평행선 둘"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">예 1 (평행선 배우기) — P0 는 x = 0 위의 세로 선분, Pθ 는 x = θ 위의 세로 선분. 받침이 겹치지 않는다</text><line x1="80.0" y1="330" x2="440.0" y2="330" stroke="#4E5964" stroke-width="1.2"/><line x1="182.8571428571429" y1="343.0" x2="182.8571428571429" y2="57.0" stroke="#CFD6D3" stroke-width="1"/><line x1="182.8571428571429" y1="330" x2="182.8571428571429" y2="334" stroke="#4E5964" stroke-width="1"/><line x1="337.14285714285717" y1="330" x2="337.14285714285717" y2="334" stroke="#4E5964" stroke-width="1"/><text x="182.8571428571429" y="348" font-size="11" fill="#7A8590" text-anchor="middle">0</text><text x="337.14285714285717" y="348" font-size="11" fill="#7A8590" text-anchor="middle">θ = 0.6</text><text x="86.0" y="74.0" font-size="10" fill="#7A8590" text-anchor="start">z = 1</text><text x="86.0" y="324.0" font-size="10" fill="#7A8590" text-anchor="start">z = 0</text><line x1="182.8571428571429" y1="330" x2="182.8571428571429" y2="70" stroke="#2E6B8A" stroke-width="5"/><line x1="337.14285714285717" y1="330" x2="337.14285714285717" y2="70" stroke="#B4552B" stroke-width="5"/><text x="172.8571428571429" y="200.0" font-size="13" fill="#2E6B8A" text-anchor="end" font-weight="bold">P0</text><text x="347.14285714285717" y="200.0" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">Pθ</text><line x1="186.8571428571429" y1="304.0" x2="332.14285714285717" y2="304.0" stroke="#1E8449" stroke-width="1.3" marker-end="url(#aw)" opacity="0.85"/><line x1="186.8571428571429" y1="252.0" x2="332.14285714285717" y2="252.0" stroke="#1E8449" stroke-width="1.3" marker-end="url(#aw)" opacity="0.85"/><line x1="186.8571428571429" y1="200.0" x2="332.14285714285717" y2="200.0" stroke="#1E8449" stroke-width="1.3" marker-end="url(#aw)" opacity="0.85"/><line x1="186.8571428571429" y1="148.0" x2="332.14285714285717" y2="148.0" stroke="#1E8449" stroke-width="1.3" marker-end="url(#aw)" opacity="0.85"/><line x1="186.8571428571429" y1="96.0" x2="332.14285714285717" y2="96.0" stroke="#1E8449" stroke-width="1.3" marker-end="url(#aw)" opacity="0.85"/><text x="260.0" y="65.20000000000002" font-size="11" fill="#1E8449" text-anchor="middle">결합 γ: (0, z) 를 (θ, z) 로 옮긴다</text><text x="260.0" y="376" font-size="11" fill="#4E5964" text-anchor="middle">Z ~ U[0, 1], gθ(z) = (θ, z). θ 하나가 선분을 가로로만 옮긴다</text><rect x="470" y="60" width="390" height="300" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="485" y="86" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">원문이 적은 값 (θ ≠ 0 일 때)</text><text x="485" y="114" font-size="12" fill="#1E8449" text-anchor="start" font-weight="bold">W(P0, Pθ) = |θ|  — 모든 질량을 가로로 |θ| 옮긴다</text><text x="485" y="135" font-size="12" fill="#2A78D6" text-anchor="start">JS(P0, Pθ) = log 2 = 0.693  — 받침이 따로라 위 끝</text><text x="485" y="156" font-size="12" fill="#B4552B" text-anchor="start">KL(Pθ‖P0) = KL(P0‖Pθ) = +∞</text><text x="485" y="177" font-size="12" fill="#8E44AD" text-anchor="start">δ(P0, Pθ) = 1  — A = P0 의 선분이면 1 − 0</text><text x="485" y="198" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="485" y="219" font-size="12" fill="#1C232C" text-anchor="start">θ = 0 이면 넷 모두 0</text><text x="485" y="240" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="485" y="261" font-size="12" fill="#1C232C" text-anchor="start">θt → 0 인 열은 W 로는 P0 에 수렴하고,</text><text x="485" y="282" font-size="12" fill="#1C232C" text-anchor="start">JS · KL · 역 KL · TV 로는 수렴하지 않는다</text><text x="485" y="303" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="485" y="324" font-size="12" fill="#4E5964" text-anchor="start">W 로 재면 θ 에 대한 기울기가 늘 ±1 이다</text><text x="485" y="345" font-size="12" fill="#4E5964" text-anchor="start">나머지 셋은 θ ≠ 0 에서 상수라 기울기가 0</text></svg>
