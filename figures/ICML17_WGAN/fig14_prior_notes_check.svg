<svg xmlns="http://www.w3.org/2000/svg" width="980" height="470" viewBox="0 0 980 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="앞 노트 물음과 답"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">앞 노트 둘(CACM 개관판 · NIPS 원판)이 이 편에 넘긴 물음과 답</text><text x="30" y="64" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">앞 노트 자리</text><text x="200" y="64" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">물음</text><text x="470" y="64" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">판정</text><text x="590" y="64" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">이 편의 근거</text><line x1="30" y1="72" x2="960" y2="72" stroke="#CFD6D3" stroke-width="1"/><text x="30" y="98" font-size="12" fill="#1C232C" text-anchor="start">CACM 9절 · 18절 다섯</text><text x="200" y="98" font-size="12" fill="#1C232C" text-anchor="start">모델이 멀면 JS 가 log 2 에 붙어 평평</text><text x="200" y="117" font-size="12" fill="#1C232C" text-anchor="start">(m = 5 에서 97.5%)</text><rect x="466" y="82" width="100" height="24" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.4"/><text x="516" y="99" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">닫힘 — 이론</text><text x="590" y="98" font-size="11" fill="#4E5964" text-anchor="start">예 1: 받침이 따로면 정확히 log 2, 기울기 0</text><text x="590" y="117" font-size="11" fill="#4E5964" text-anchor="start">정리 1 의 3 항</text><text x="30" y="158" font-size="12" fill="#1C232C" text-anchor="start">CACM 18절 다섯 (단서)</text><text x="200" y="158" font-size="12" fill="#1C232C" text-anchor="start">최적 D 가정 위의 계산이라</text><text x="200" y="177" font-size="12" fill="#1C232C" text-anchor="start">실제 학습을 막는지는 모른다</text><rect x="466" y="142" width="100" height="24" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.4"/><text x="516" y="159" font-size="11" fill="#9A7B00" text-anchor="middle" font-weight="bold">일부</text><text x="590" y="158" font-size="11" fill="#4E5964" text-anchor="start">그림 4: 39.5만 번에 JS 추정이 log 2 의 97.4 ~ 97.7%</text><text x="590" y="177" font-size="11" fill="#4E5964" text-anchor="start">그래도 DCGAN 표본은 좋아졌다 (캡션)</text><text x="30" y="218" font-size="12" fill="#1C232C" text-anchor="start">NIPS 24절 첫째</text><text x="200" y="218" font-size="12" fill="#1C232C" text-anchor="start">다른 거리를 쓰면 멀리 있는</text><text x="200" y="237" font-size="12" fill="#1C232C" text-anchor="start">모델에 어떤 신호가 가나</text><rect x="466" y="202" width="100" height="24" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.4"/><text x="516" y="219" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">닫힘 — 이론</text><text x="590" y="218" font-size="11" fill="#4E5964" text-anchor="start">W 는 거리와 상관없이 기울기 크기 1</text><text x="590" y="237" font-size="11" fill="#4E5964" text-anchor="start">(예 1 · 가우스), 정리 3</text><text x="30" y="278" font-size="12" fill="#1C232C" text-anchor="start">NIPS 24절 첫째 (실제)</text><text x="200" y="278" font-size="12" fill="#1C232C" text-anchor="start">학습한 critic 이</text><text x="200" y="297" font-size="12" fill="#1C232C" text-anchor="start">그 신호를 주는가</text><rect x="466" y="262" width="100" height="24" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.4"/><text x="516" y="279" font-size="11" fill="#9A7B00" text-anchor="middle" font-weight="bold">일부</text><text x="590" y="278" font-size="11" fill="#4E5964" text-anchor="start">그림 2 하나 (1 차원, 설정 없음)</text><text x="590" y="297" font-size="11" fill="#4E5964" text-anchor="start">이미지 실험의 기울기 크기는 재지 않음</text><text x="30" y="338" font-size="12" fill="#1C232C" text-anchor="start">NIPS 11.1절</text><text x="200" y="338" font-size="12" fill="#1C232C" text-anchor="start">θ 공간에서 C(G) 의 볼록성이</text><text x="200" y="357" font-size="12" fill="#1C232C" text-anchor="start">깨지고 멀면 평평</text><rect x="466" y="322" width="100" height="24" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.4"/><text x="516" y="339" font-size="11" fill="#9A7B00" text-anchor="middle" font-weight="bold">옆으로 닫힘</text><text x="590" y="338" font-size="11" fill="#4E5964" text-anchor="start">W 는 θ 에 대해 연속, 측도 0 집합 밖에서 미분</text><text x="590" y="357" font-size="11" fill="#4E5964" text-anchor="start">(정리 1). 볼록성은 말하지 않는다</text><text x="30" y="398" font-size="12" fill="#1C232C" text-anchor="start">NIPS 20절 다섯</text><text x="200" y="398" font-size="12" fill="#1C232C" text-anchor="start">학습 안정성 · 실패율에</text><text x="200" y="417" font-size="12" fill="#1C232C" text-anchor="start">수가 없다</text><rect x="466" y="382" width="100" height="24" rx="6" fill="#F6F7F5" stroke="#C0392B" stroke-width="1.4"/><text x="516" y="399" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="bold">안 닫힘</text><text x="590" y="398" font-size="11" fill="#4E5964" text-anchor="start">이 편도 실행 수 · 실패 비율을 적지 않는다</text><text x="590" y="417" font-size="11" fill="#4E5964" text-anchor="start">구조 셋에 표본 판 하나씩</text></svg>
