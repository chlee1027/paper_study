<svg xmlns="http://www.w3.org/2000/svg" width="940" height="440" viewBox="0 0 940 440" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 이 편이 받은 것과 넘긴 것 (오른쪽 칸 이름은 내가 이은 것이고 읽지 않았다)</text><rect x="30" y="62" width="270" height="54" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.4"/><text x="165" y="85" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">원 GAN (NIPS 2014)</text><text x="165" y="104" font-size="11" fill="#4E5964" text-anchor="middle">식 (1) · 최적 D · −log D 꼴</text><line x1="302" y1="89" x2="368" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.7"/><rect x="30" y="128" width="270" height="54" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.4"/><text x="165" y="151" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">f-GAN (2016)</text><text x="165" y="170" font-size="11" fill="#4E5964" text-anchor="middle">모든 f-발산으로 넓힘</text><line x1="302" y1="155" x2="368" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.7"/><rect x="30" y="194" width="270" height="54" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.4"/><text x="165" y="217" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">Arjovsky · Bottou (ICLR 2017)</text><text x="165" y="236" font-size="11" fill="#4E5964" text-anchor="middle">포화 · 불안정의 이론 [1]</text><line x1="302" y1="221" x2="368" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.7"/><rect x="30" y="260" width="270" height="54" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.4"/><text x="165" y="283" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">최적 수송 (Villani 2009)</text><text x="165" y="302" font-size="11" fill="#4E5964" text-anchor="middle">칸토로비치-루빈시테인 쌍대 [22]</text><line x1="302" y1="287" x2="368" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.7"/><rect x="30" y="326" width="270" height="54" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.4"/><text x="165" y="349" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">MMD · GMMN (2012 · 2015)</text><text x="165" y="368" font-size="11" fill="#4E5964" text-anchor="middle">다른 IPM 하나</text><line x1="302" y1="353" x2="368" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.7"/><rect x="370" y="160" width="220" height="90" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="2"/><text x="480" y="192" font-size="15" fill="#1E8449" text-anchor="middle" font-weight="bold">WGAN (2017)</text><text x="480" y="214" font-size="11" fill="#4E5964" text-anchor="middle">EM 거리 · critic · 무게 자르기</text><text x="480" y="232" font-size="10" fill="#7A8590" text-anchor="middle">arXiv v3 2017-12 · ICML 2017</text><line x1="592" y1="205" x2="648" y2="89" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.7"/><rect x="650" y="62" width="260" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="780" y="85" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">WGAN-GP (2017)</text><text x="780" y="104" font-size="11" fill="#4E5964" text-anchor="middle">무게 자르기 대신 기울기 벌점</text><line x1="592" y1="205" x2="648" y2="171" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.7"/><rect x="650" y="144" width="260" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="780" y="167" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">스펙트럼 정규화 (2018)</text><text x="780" y="186" font-size="11" fill="#4E5964" text-anchor="middle">층마다 스펙트럼 노름으로 나눔</text><line x1="592" y1="205" x2="648" y2="253" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.7"/><rect x="650" y="226" width="260" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="780" y="249" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">GAN 수렴 분석 (2017 ~)</text><text x="780" y="268" font-size="11" fill="#4E5964" text-anchor="middle">θ 공간의 국소 안정성</text><line x1="592" y1="205" x2="648" y2="335" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.7"/><rect x="650" y="308" width="260" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="780" y="331" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">생성 모델 평가</text><text x="780" y="350" font-size="11" fill="#4E5964" text-anchor="middle">EM 추정을 평가로 쓸 수 있나</text><text x="30" y="404" font-size="11" fill="#7A8590" text-anchor="start">왼쪽 다섯은 원문 참고 문헌에 있다([4] · [17] · [1] · [22] · [5] · [10]). 오른쪽 넷은 원문 3절이 「립시츠 제약을 더 나은 방법으로」 를 권한 자리와</text><text x="30" y="422" font-size="11" fill="#7A8590" text-anchor="start">4.2절이 「아직 평가 방법이라 주장하지 않는다」 고 한 자리에서 이었다</text></svg>
