<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="정리 2 위상의 순서"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">정리 2 — 위상이 센 차례: KL ⇒ (JS ⇔ TV) ⇒ (W ⇔ 분포 수렴). 왼쪽으로 수렴하면 오른쪽으로도 수렴한다</text><rect x="40" y="62" width="190" height="74" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.8"/><text x="135" y="90" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">KL(Pn‖P) → 0</text><text x="135" y="112" font-size="12" fill="#4E5964" text-anchor="middle">또는 KL(P‖Pn) → 0</text><text x="135" y="154" font-size="11" fill="#7A8590" text-anchor="middle">가장 세다</text><rect x="250" y="62" width="190" height="74" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.8"/><text x="345" y="90" font-size="13" fill="#2A78D6" text-anchor="middle" font-weight="bold">JS(Pn, P) → 0</text><text x="345" y="112" font-size="12" fill="#4E5964" text-anchor="middle">⇔ δ(Pn, P) → 0</text><text x="345" y="154" font-size="11" fill="#7A8590" text-anchor="middle">둘이 같은 위상</text><rect x="460" y="62" width="190" height="74" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.8"/><text x="555" y="90" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="bold">W(Pn, P) → 0</text><text x="555" y="112" font-size="12" fill="#4E5964" text-anchor="middle">⇔ Pn 이 분포로 P 에 수렴</text><text x="555" y="154" font-size="11" fill="#7A8590" text-anchor="middle">가장 약하다</text><line x1="232" y1="99" x2="248" y2="99" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><line x1="442" y1="99" x2="458" y2="99" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><text x="240" y="84" font-size="10" fill="#7A8590" text-anchor="middle">(3)</text><text x="450" y="84" font-size="10" fill="#7A8590" text-anchor="middle">(4)</text><rect x="670" y="62" width="210" height="92" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="682" y="84" font-size="11" fill="#1C232C" text-anchor="start">항목 (3): 핀스커 부등식</text><text x="682" y="102" font-size="11" fill="#1C232C" text-anchor="start">항목 (1): 핀스커 + 삼각 부등식</text><text x="682" y="120" font-size="11" fill="#4E5964" text-anchor="start">항목 (2): 바깥 결과 [22] 인용</text><text x="682" y="138" font-size="11" fill="#4E5964" text-anchor="start">항목 (4): 강 · 약* 위상</text><text x="40" y="196" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">증명이 쓰는 부등식을 P = N(0, 1), Pn = N(m, 1) 로 확인 (내 계산, 수치 적분 간격 0.002)</text><text x="60" y="226" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">m</text><text x="150" y="226" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">δ (적분)</text><text x="250" y="226" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">δ (닫힌 꼴)</text><text x="350" y="226" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">JS (nat)</text><text x="440" y="226" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">KL = m²/2</text><text x="540" y="226" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">√(KL/2)</text><text x="640" y="226" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">√(2·JS)</text><text x="760" y="226" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">2·√JS (원문)</text><line x1="40" y1="234" x2="860" y2="234" stroke="#CFD6D3" stroke-width="1"/><text x="60" y="256" font-size="12" fill="#1C232C" text-anchor="middle">0.25</text><text x="150" y="256" font-size="12" fill="#1C232C" text-anchor="middle">0.0995</text><text x="250" y="256" font-size="12" fill="#1C232C" text-anchor="middle">0.0995</text><text x="350" y="256" font-size="12" fill="#1C232C" text-anchor="middle">0.0078</text><text x="440" y="256" font-size="12" fill="#1C232C" text-anchor="middle">0.0312</text><text x="540" y="256" font-size="12" fill="#1C232C" text-anchor="middle">0.1250</text><text x="640" y="256" font-size="12" fill="#1C232C" text-anchor="middle">0.1245</text><text x="760" y="256" font-size="12" fill="#1C232C" text-anchor="middle">0.1761</text><text x="60" y="282" font-size="12" fill="#1C232C" text-anchor="middle">0.50</text><text x="150" y="282" font-size="12" fill="#1C232C" text-anchor="middle">0.1974</text><text x="250" y="282" font-size="12" fill="#1C232C" text-anchor="middle">0.1974</text><text x="350" y="282" font-size="12" fill="#1C232C" text-anchor="middle">0.0303</text><text x="440" y="282" font-size="12" fill="#1C232C" text-anchor="middle">0.1250</text><text x="540" y="282" font-size="12" fill="#1C232C" text-anchor="middle">0.2500</text><text x="640" y="282" font-size="12" fill="#1C232C" text-anchor="middle">0.2462</text><text x="760" y="282" font-size="12" fill="#1C232C" text-anchor="middle">0.3482</text><text x="60" y="308" font-size="12" fill="#1C232C" text-anchor="middle">1.00</text><text x="150" y="308" font-size="12" fill="#1C232C" text-anchor="middle">0.3829</text><text x="250" y="308" font-size="12" fill="#1C232C" text-anchor="middle">0.3829</text><text x="350" y="308" font-size="12" fill="#1C232C" text-anchor="middle">0.1114</text><text x="440" y="308" font-size="12" fill="#1C232C" text-anchor="middle">0.5000</text><text x="540" y="308" font-size="12" fill="#1C232C" text-anchor="middle">0.5000</text><text x="640" y="308" font-size="12" fill="#1C232C" text-anchor="middle">0.4721</text><text x="760" y="308" font-size="12" fill="#1C232C" text-anchor="middle">0.6676</text><text x="60" y="334" font-size="12" fill="#1C232C" text-anchor="middle">2.00</text><text x="150" y="334" font-size="12" fill="#1C232C" text-anchor="middle">0.6827</text><text x="250" y="334" font-size="12" fill="#1C232C" text-anchor="middle">0.6827</text><text x="350" y="334" font-size="12" fill="#1C232C" text-anchor="middle">0.3368</text><text x="440" y="334" font-size="12" fill="#1C232C" text-anchor="middle">2.0000</text><text x="540" y="334" font-size="12" fill="#1C232C" text-anchor="middle">1.0000</text><text x="640" y="334" font-size="12" fill="#1C232C" text-anchor="middle">0.8208</text><text x="760" y="334" font-size="12" fill="#1C232C" text-anchor="middle">1.1607</text><text x="40" y="380" font-size="11" fill="#4E5964" text-anchor="start">핀스커: δ ≤ √(KL/2) — 넷 다 성립. 원문의 항목 (1) 끝은 δ ≤ 2√JS 로 적는데, 같은 줄의 앞 부등식에서 나오는 것은 √(2·JS) 이고 2√JS 는 그보다 늘 크다(느슨하지만 맞다)</text><text x="40" y="400" font-size="11" fill="#7A8590" text-anchor="start">이 확인은 가우스 넷에 대한 것이고 정리의 증명이 아니다. 정리는 받침이 콤팩트한 공간을 가정한다 — 가우스는 그 가정 밖이라 부등식만 확인했다</text></svg>
