<svg xmlns="http://www.w3.org/2000/svg" width="920" height="440" viewBox="0 0 920 440" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="수송 계획과 쌍대 함수"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">식 (1) 과 식 (2) 가 같은 값을 내는가 — 점 셋(0, 1, 2) 위의 작은 이산 예 (내가 고른 수)</text><rect x="68" y="90.0" width="20" height="110.0" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><rect x="92" y="156.0" width="20" height="44.0" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="78" y="84.0" font-size="10" fill="#2E6B8A" text-anchor="middle">0.5</text><text x="102" y="150.0" font-size="10" fill="#B4552B" text-anchor="middle">0.2</text><text x="90" y="218" font-size="11" fill="#4E5964" text-anchor="middle">x = 0</text><rect x="218" y="134.0" width="20" height="66.0" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><rect x="242" y="134.0" width="20" height="66.0" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="228" y="128.0" font-size="10" fill="#2E6B8A" text-anchor="middle">0.3</text><text x="252" y="128.0" font-size="10" fill="#B4552B" text-anchor="middle">0.3</text><text x="240" y="218" font-size="11" fill="#4E5964" text-anchor="middle">x = 1</text><rect x="368" y="156.0" width="20" height="44.0" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><rect x="392" y="90.0" width="20" height="110.0" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="378" y="150.0" font-size="10" fill="#2E6B8A" text-anchor="middle">0.2</text><text x="402" y="84.0" font-size="10" fill="#B4552B" text-anchor="middle">0.5</text><text x="390" y="218" font-size="11" fill="#4E5964" text-anchor="middle">x = 2</text><line x1="50" y1="200" x2="430" y2="200" stroke="#4E5964" stroke-width="1.2"/><text x="60" y="70" font-size="12" fill="#4E5964" text-anchor="start">P_r (파랑) · P_g (주황)</text><path d="M78.0,236 C150.0,276 330.0,276 402.0,236" fill="none" stroke="#1E8449" stroke-width="2" marker-end="url(#aw)"/><text x="240" y="290" font-size="11" fill="#1E8449" text-anchor="middle">0.3 을 0 → 2 로 (거리 2)</text><text x="40" y="322" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">식 (1) — 수송 계획 γ 에 대해 최소화</text><text x="40" y="343" font-size="12" fill="#1E8449" text-anchor="start">결합 γ 를 0.05 간격 격자로 모두 훑은 최솟값 = 0.6000</text><text x="40" y="364" font-size="12" fill="#4E5964" text-anchor="start">최적 계획의 하나: 0 에 0.2 · 1 에 0.3 은 그대로, 0 의 0.3 을 2 로</text><text x="40" y="385" font-size="12" fill="#4E5964" text-anchor="start">1 차원 닫힌 꼴 Σ |F_r − F_g| = 0.6000 와 같다</text><rect x="470" y="60" width="430" height="360" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="485" y="86" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">식 (2) — 1-립시츠 함수 f 에 대해 최대화</text><circle cx="520" cy="130.0" r="5" fill="#1E8449" stroke="#1E8449" stroke-width="1.2"/><text x="520" y="118.0" font-size="11" fill="#1E8449" text-anchor="middle">f(0) = 2.00</text><circle cx="660" cy="190.0" r="5" fill="#1E8449" stroke="#1E8449" stroke-width="1.2"/><text x="660" y="178.0" font-size="11" fill="#1E8449" text-anchor="middle">f(1) = 1.00</text><circle cx="800" cy="250.0" r="5" fill="#1E8449" stroke="#1E8449" stroke-width="1.2"/><text x="800" y="238.0" font-size="11" fill="#1E8449" text-anchor="middle">f(2) = 0.00</text><path d="M520.0,130.0 L660.0,190.0 L800.0,250.0" fill="none" stroke="#1E8449" stroke-width="1.6" stroke-dasharray="4 3"/><text x="485" y="330" font-size="12" fill="#1E8449" text-anchor="start" font-weight="bold">f 를 0.05 간격으로 훑은 최댓값 = 0.6000</text><text x="485" y="351" font-size="12" fill="#4E5964" text-anchor="start">E_r[f] − E_g[f] 를 가장 크게 하는 f 는 기울기 −1 의 직선</text><text x="485" y="372" font-size="12" fill="#7A8590" text-anchor="start">(상수를 더해도 값이 같아 f(2) = 0 으로 두었다)</text><text x="485" y="393" font-size="12" fill="#1C232C" text-anchor="start">두 값이 같다 — 칸토로비치-루빈시테인 쌍대의 한 예</text></svg>
