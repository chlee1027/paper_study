<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="모드 붕괴 주장 넷"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">모드 붕괴를 두고 원문이 적은 문장 넷 — 같은 논문 안에서 세기가 다르다</text><rect x="30" y="62" width="860" height="80" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.6"/><text x="46" y="88" font-size="12" fill="#9A7B00" text-anchor="start" font-weight="bold">1절 기여 목록</text><text x="220" y="88" font-size="13" fill="#1C232C" text-anchor="start">「GAN 에 흔한 모드 떨어뜨림 현상도 크게 줄어든다」</text><text x="220" y="116" font-size="12" fill="#4E5964" text-anchor="start">줄어든다 — 정도를 말하지만 잰 값이 없다</text><rect x="30" y="154" width="860" height="80" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.6"/><text x="46" y="180" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">3절 (알고리즘 1 뒤)</text><text x="220" y="180" font-size="13" fill="#1C232C" text-anchor="start">「critic 을 최적까지 배우면 모드를 무너뜨리는 것이 불가능해진다」</text><text x="220" y="208" font-size="12" fill="#4E5964" text-anchor="start">조건부 논증 — critic 이 최적일 때. 실험은 n_critic = 5</text><rect x="30" y="246" width="860" height="80" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="46" y="272" font-size="12" fill="#1E8449" text-anchor="start" font-weight="bold">4.3절 끝</text><text x="220" y="272" font-size="13" fill="#1C232C" text-anchor="start">「어느 실험에서도 WGAN 의 모드 붕괴 증거를 보지 못했다」</text><text x="220" y="300" font-size="12" fill="#4E5964" text-anchor="start">관찰 — 실험 수를 적지 않는다. 표본 판은 구조마다 64 장씩</text><rect x="30" y="338" width="860" height="80" rx="6" fill="#F6F7F5" stroke="#C0392B" stroke-width="1.6"/><text x="46" y="364" font-size="12" fill="#C0392B" text-anchor="start" font-weight="bold">6절 결론</text><text x="220" y="364" font-size="13" fill="#1C232C" text-anchor="start">「모드 붕괴 같은 문제를 없앨 수 있음을 보였다」</text><text x="220" y="392" font-size="12" fill="#4E5964" text-anchor="start">가장 센 말 — 근거는 위 셋이다</text><text x="30" y="448" font-size="11" fill="#7A8590" text-anchor="start">3절 논증의 바탕: 판별기가 고정되면 최적 생성기는 판별기가 가장 높게 매기는 점들 위의 델타의 합이다 — [4] (원 GAN)가 관찰하고 [11] (Unrolled GAN)가 짚었다고 적는다</text></svg>
