<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="원문 그림 3 읽은 값"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="aw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">원문 그림 3 을 픽셀로 읽은 값 — WGAN 학습 중 EM 추정(식 3). 원문 곡선은 중앙값 거르개를 거친 것이다</text><line x1="70" y1="360" x2="500" y2="360" stroke="#4E5964" stroke-width="1.2"/><line x1="70" y1="70" x2="70" y2="360" stroke="#4E5964" stroke-width="1.2"/><line x1="70.0" y1="360" x2="70.0" y2="364" stroke="#4E5964" stroke-width="1"/><text x="70.0" y="377" font-size="10" fill="#7A8590" text-anchor="middle">0</text><line x1="213.33333333333331" y1="360" x2="213.33333333333331" y2="364" stroke="#4E5964" stroke-width="1"/><text x="213.33333333333331" y="377" font-size="10" fill="#7A8590" text-anchor="middle">200000</text><line x1="356.66666666666663" y1="360" x2="356.66666666666663" y2="364" stroke="#4E5964" stroke-width="1"/><text x="356.66666666666663" y="377" font-size="10" fill="#7A8590" text-anchor="middle">400000</text><line x1="500.0" y1="360" x2="500.0" y2="364" stroke="#4E5964" stroke-width="1"/><text x="500.0" y="377" font-size="10" fill="#7A8590" text-anchor="middle">600000</text><line x1="66" y1="360.0" x2="70" y2="360.0" stroke="#4E5964" stroke-width="1"/><text x="63" y="364.0" font-size="10" fill="#7A8590" text-anchor="end">0</text><line x1="70" y1="360.0" x2="500" y2="360.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="66" y1="287.5" x2="70" y2="287.5" stroke="#4E5964" stroke-width="1"/><text x="63" y="291.5" font-size="10" fill="#7A8590" text-anchor="end">0.4</text><line x1="70" y1="287.5" x2="500" y2="287.5" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="66" y1="215.0" x2="70" y2="215.0" stroke="#4E5964" stroke-width="1"/><text x="63" y="219.0" font-size="10" fill="#7A8590" text-anchor="end">0.8</text><line x1="70" y1="215.0" x2="500" y2="215.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="66" y1="142.50000000000003" x2="70" y2="142.50000000000003" stroke="#4E5964" stroke-width="1"/><text x="63" y="146.50000000000003" font-size="10" fill="#7A8590" text-anchor="end">1.2</text><line x1="70" y1="142.50000000000003" x2="500" y2="142.50000000000003" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="66" y1="70.0" x2="70" y2="70.0" stroke="#4E5964" stroke-width="1"/><text x="63" y="74.0" font-size="10" fill="#7A8590" text-anchor="end">1.6</text><line x1="70" y1="70.0" x2="500" y2="70.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="285.0" y="394" font-size="11" fill="#4E5964" text-anchor="middle">생성기 반복</text><text x="70" y="60" font-size="11" fill="#4E5964" text-anchor="start">EM 추정</text><path d="M71.4,95.4 L77.2,106.3 L105.8,146.1 L141.7,215.0 L213.3,260.3 L285.0,276.6 L356.7,287.5 L428.3,289.3 L492.8,291.1" fill="none" stroke="#B4552B" stroke-width="2.4"/><path d="M71.4,115.3 L77.2,171.5 L105.8,287.5 L141.7,312.9 L213.3,325.6 L285.0,332.8 L356.7,336.4 L428.3,336.4 L492.8,338.2" fill="none" stroke="#2E6B8A" stroke-width="2.4"/><circle cx="71.43333333333334" cy="95.375" r="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="77.16666666666667" cy="106.25000000000003" r="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="105.83333333333333" cy="146.12500000000003" r="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="141.66666666666666" cy="215.0" r="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="213.33333333333331" cy="260.3125" r="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="285.0" cy="276.625" r="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="356.66666666666663" cy="287.5" r="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="428.33333333333337" cy="289.3125" r="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="492.8333333333333" cy="291.125" r="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="71.43333333333334" cy="115.3125" r="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="77.16666666666667" cy="171.5" r="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="105.83333333333333" cy="287.5" r="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="141.66666666666666" cy="312.875" r="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="213.33333333333331" cy="325.5625" r="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="285.0" cy="332.8125" r="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="356.66666666666663" cy="336.4375" r="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="428.33333333333337" cy="336.4375" r="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="492.8333333333333" cy="338.25" r="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><text x="500.0" y="281.125" font-size="11" fill="#B4552B" text-anchor="end" font-weight="bold">MLP 생성기 0.38</text><text x="500.0" y="330.25" font-size="11" fill="#2E6B8A" text-anchor="end" font-weight="bold">DCGAN 생성기 0.12</text><rect x="530" y="60" width="370" height="390" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="545" y="86" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">읽은 값 (위 두 칸 ±0.02)</text><text x="545" y="112" font-size="12" fill="#1C232C" text-anchor="start">위 두 칸: critic 은 둘 다 시그모이드 뺀 DCGAN</text><text x="545" y="134" font-size="12" fill="#4E5964" text-anchor="start">— 그래서 두 곡선끼리는 견줄 수 있다 (캡션)</text><text x="545" y="156" font-size="12" fill="#B4552B" text-anchor="start">MLP 생성기: 1.46 → 0.80 (10만) → 0.38</text><text x="545" y="178" font-size="12" fill="#2E6B8A" text-anchor="start">DCGAN 생성기: 1.35 → 0.26 (10만) → 0.12</text><text x="545" y="200" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="545" y="222" font-size="12" fill="#1C232C" text-anchor="start">아래 칸: 생성기 · critic 둘 다 MLP,</text><text x="545" y="244" font-size="12" fill="#4E5964" text-anchor="start">학습률이 상당히 높아 학습 실패 (캡션)</text><text x="545" y="266" font-size="12" fill="#C0392B" text-anchor="start">60만 번 내내 14.6 ~ 16.0 사이 (중앙 15.2 ~ 15.4)</text><text x="545" y="288" font-size="12" fill="#4E5964" text-anchor="start">critic 이 다르니 위 칸 값과 견주지 않는다</text><text x="545" y="310" font-size="12" fill="#4E5964" text-anchor="start">— 원문 4.2절이 스스로 적는 조건이다</text><text x="545" y="332" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="545" y="354" font-size="12" fill="#1C232C" text-anchor="start">「표본 질과 잘 맞는다」 의 근거는</text><text x="545" y="376" font-size="12" fill="#4E5964" text-anchor="start">곡선 셋과 그 위에 얹은 표본 일곱 장씩이다</text><text x="545" y="398" font-size="12" fill="#C0392B" text-anchor="start">표본 질을 수로 잰 값은 원문에 없다</text><text x="545" y="420" font-size="12" fill="#C0392B" text-anchor="start">실행 횟수(seed)도 적혀 있지 않다</text><text x="70" y="420" font-size="11" fill="#7A8590" text-anchor="start">가로축은 생성기 반복이다. 생성기 한 번에 critic 이 5 번(2행을 글자대로 세면 6 번) 배운다</text></svg>
