r="start">생성기 비용 −log D</text><path d="M524.8,194.8 L567.5,106.4 L615.0,122.0 L710.0,106.4 L805.0,88.2 L895.2,75.2" fill="none" stroke="#B4552B" stroke-width="2.2"/><path d="M524.8,244.2 L567.5,215.6 L615.0,197.4 L710.0,174.0 L805.0,155.8 L895.2,140.2" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><path d="M524.8,257.2 L543.8,301.9 L567.5,300.1 L615.0,298.0 L710.0,291.8 L776.5,291.3 L805.0,272.8 L895.2,253.8" fill="none" stroke="#4E5964" stroke-width="2.2"/><line x1="70" y1="382" x2="96" y2="382" stroke="#B4552B" stroke-width="2.4"/><text x="102" y="386" font-size="11" fill="#B4552B" text-anchor="start">MLP 생성기 · DCGAN 판별기</text><line x1="300" y1="382" x2="326" y2="382" stroke="#2E6B8A" stroke-width="2.4"/><text x="332" y="386" font-size="11" fill="#2E6B8A" text-anchor="start">DCGAN 생성기 · DCGAN 판별기 (점선 = 아래쪽 흔들림)</text><line x1="680" y1="382" x2="706" y2="382" stroke="#4E5964" stroke-width="2.4"/><text x="712" y="386" font-size="11" fill="#4E5964" text-anchor="start">MLP 생성기 · MLP 판별기</text><text x="30" y="414" font-size="11" fill="#4E5964" text-anchor="start">왼쪽 위 두 칸: JS 추정이 0.61 → 0.675 · 0.56 → 0.677 (읽기 ±0.01) 로 오른다. 395,000 번에서 log 2 의 97.4% · 97.7%</text><text x="30" y="435" font-size="11" fill="#1C232C" text-anchor="start">그런데 원문 캡션은 DCGAN 생성기의 표본이 「좋아진다」 고 적는다 — 평평함이 학습을 막았다는 그림이 아니라, 손실이 진척을 알려 주지 않는다는 그림이다</text><text x="30" y="456" font-size="11" fill="#7A8590" text-anchor="start">가로축이 그림 3 은 60만, 그림 4 · 8 은 40만이다. 그림 4 의 값은 학습 중인 판별기로 잰 하한이라 참 JS 보다 작거나 같다(4.2절)</text></svg>
