<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="두 기울기 추정량의 분산 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">같은 기울기를 두 방법으로 추정할 때 표본 하나의 분산 (q=N(μ,1), f(z)=z², 내가 붙인 예시)</text><line x1="90" y1="310.0" x2="520" y2="310.0" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="314.0" font-size="11" fill="#7A8590" text-anchor="end">1</text><line x1="90" y1="226.66666666666669" x2="520" y2="226.66666666666669" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="230.66666666666669" font-size="11" fill="#7A8590" text-anchor="end">10</text><line x1="90" y1="143.33333333333334" x2="520" y2="143.33333333333334" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="147.33333333333334" font-size="11" fill="#7A8590" text-anchor="end">100</text><line x1="90" y1="60.0" x2="520" y2="60.0" stroke="#CFD6D3" stroke-width="1"/><text x="82" y="64.0" font-size="11" fill="#7A8590" text-anchor="end">1,000</text><text x="90.0" y="328" font-size="11" fill="#7A8590" text-anchor="middle">0</text><text x="233.33333333333331" y="328" font-size="11" fill="#7A8590" text-anchor="middle">1</text><text x="376.66666666666663" y="328" font-size="11" fill="#7A8590" text-anchor="middle">2</text><text x="520.0" y="328" font-size="11" fill="#7A8590" text-anchor="middle">3</text><text x="305.0" y="348" font-size="12" fill="#4E5964" text-anchor="middle">μ (q 의 평균)</text><text x="98" y="50" font-size="12" fill="#4E5964" text-anchor="start">분산 (로그 눈금)</text><path d="M90.0,212.0 L97.2,211.9 L104.3,211.7 L111.5,211.2 L118.7,210.7 L125.8,209.9 L133.0,209.1 L140.2,208.0 L147.3,206.9 L154.5,205.6 L161.7,204.3 L168.8,202.8 L176.0,201.3 L183.2,199.7 L190.3,198.0 L197.5,196.2 L204.7,194.4 L211.8,192.6 L219.0,190.7 L226.2,188.8 L233.3,186.9 L240.5,185.0 L247.7,183.0 L254.8,181.1 L262.0,179.1 L269.2,177.1 L276.3,175.1 L283.5,173.2 L290.7,171.2 L297.8,169.3 L305.0,167.3 L312.2,165.4 L319.3,163.4 L326.5,161.5 L333.7,159.6 L340.8,157.7 L348.0,155.8 L355.2,153.9 L362.3,152.1 L369.5,150.2 L376.7,148.4 L383.8,146.5 L391.0,144.7 L398.2,142.9 L405.3,141.2 L412.5,139.4 L419.7,137.6 L426.8,135.9 L434.0,134.2 L441.2,132.5 L448.3,130.8 L455.5,129.1 L462.7,127.4 L469.8,125.7 L477.0,124.1 L484.2,122.5 L491.3,120.8 L498.5,119.2 L505.7,117.6 L512.8,116.0 L520.0,114.5" fill="none" stroke="#C0392B" stroke-width="2.4"/><path d="M90.0,259.8 L520.0,259.8" fill="none" stroke="#1E8449" stroke-width="2.4"/><text x="405.33333333333337" y="131.16119788622103" font-size="12" fill="#C0392B" text-anchor="end" font-weight="bold">소박한 추정량 μ⁴+14μ²+15</text><text x="520.0" y="251.82833405600314" font-size="12" fill="#1E8449" text-anchor="end" font-weight="bold">재매개변수화 4</text><circle cx="90.0" cy="211.99239507869322" r="4" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/><circle cx="233.33333333333331" cy="186.90656210669482" r="4" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/><circle cx="520.0" cy="114.47058546244676" r="4" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/><rect x="550" y="60" width="250" height="250" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="565" y="86" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">배수 (소박한 / 재매개변수화)</text><text x="565" y="120" font-size="12" fill="#1C232C" text-anchor="start">μ = 0:  15 / 4 = 3.75 배</text><text x="565" y="154" font-size="12" fill="#1C232C" text-anchor="start">μ = 1:  30 / 4 = 7.50 배</text><text x="565" y="188" font-size="12" fill="#1C232C" text-anchor="start">μ = 3:  222 / 4 = 55.50 배</text><text x="565" y="238" font-size="11" fill="#4E5964" text-anchor="start">두 추정량의 평균은 둘 다 2μ 다.</text><text x="565" y="256" font-size="11" fill="#4E5964" text-anchor="start">다른 것은 흔들림뿐이다.</text><text x="565" y="284" font-size="11" fill="#7A8590" text-anchor="start">몬테카를로 20 만 번으로 확인</text></svg>
