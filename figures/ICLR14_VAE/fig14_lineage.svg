<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보와 이상 탐지로 가는 곁가지"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 앞 편의 한계를 받아 다음 편에 넘긴다</text><rect x="25" y="60" width="170" height="60" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="110" y="85" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">오토인코더 2006</text><text x="110" y="105" font-size="11" fill="#4E5964" text-anchor="middle">코드에 분포가 없다</text><line x1="197" y1="90" x2="223" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="225" y="60" width="170" height="60" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="310" y="85" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">VAE 2014</text><text x="310" y="105" font-size="11" fill="#4E5964" text-anchor="middle">코드에 분포를 준다</text><line x1="397" y1="90" x2="423" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="425" y="60" width="170" height="60" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="510" y="85" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">GAN (다음)</text><text x="510" y="105" font-size="11" fill="#4E5964" text-anchor="middle">가능도 없이 배운다</text><line x1="597" y1="90" x2="623" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="625" y="60" width="170" height="60" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="710" y="85" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">DDPM 2020 (읽음)</text><text x="710" y="105" font-size="11" fill="#4E5964" text-anchor="middle">같은 하한, 많은 층</text><text x="225" y="148" font-size="11" fill="#1C232C" text-anchor="middle">받은 것: 코드 공간에서</text><text x="225" y="164" font-size="11" fill="#1C232C" text-anchor="middle">점을 골라 만들 길이 없다</text><text x="425" y="148" font-size="11" fill="#1C232C" text-anchor="middle">넘긴 것: 픽셀별 가능도를</text><text x="425" y="164" font-size="11" fill="#1C232C" text-anchor="middle">정해야 한다(베르누이·가우스)</text><text x="625" y="148" font-size="11" fill="#1C232C" text-anchor="middle">넘긴 것: q 가 대각 가우스</text><text x="625" y="164" font-size="11" fill="#1C232C" text-anchor="middle">하나 — 하한과의 틈</text><rect x="25" y="200" width="770" height="160" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="45" y="226" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">곁가지 — 이상 탐지로 가는 길 (논문은 이 쓰임을 적지 않는다. 내가 잇는 자리다)</text><text x="45" y="252" font-size="12" fill="#1C232C" text-anchor="start">정상 데이터만으로 VAE 를 배우면 입력마다 하한 L(x) 가 나온다. 이것은 재구성 오차와 달리 「이 입력이 얼마나 그럴듯한가」의 하한이다</text><text x="45" y="276" font-size="12" fill="#1C232C" text-anchor="start">점수가 둘로 갈린다 — 재구성 항(픽셀을 얼마나 되살리나) 과 KL 항(코드가 사전분포에서 얼마나 벗어났나)</text><text x="45" y="300" font-size="12" fill="#1C232C" text-anchor="start">재구성 기반 이상 탐지의 긴장(잘 일반화하면 이상도 되살린다)은 그대로 남는다 — 목표가 여전히 시험 데이터의 L 을 올리는 것이다</text><text x="45" y="324" font-size="12" fill="#4E5964" text-anchor="start">그리고 하한 L 은 log p(x) 보다 KL(q‖사후분포) 만큼 낮다. 그 틈이 입력마다 다르면 점수 순서가 틈 때문에 바뀔 수 있다</text><text x="45" y="348" font-size="11" fill="#7A8590" text-anchor="start">잴 방법은 이 노트 24절 D 에 적었다</text></svg>
