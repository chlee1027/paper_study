<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="오토인코더와 VAE 비교 표"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">오토인코더(2006) 와 VAE(2014) — 같은 모양, 다른 목표</text><rect x="20" y="55" width="780" height="36" rx="4" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="78" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold"></text><text x="375.0" y="78" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">오토인코더 2006</text><text x="655.0" y="78" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">VAE 2014</text><rect x="20" y="91" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="115" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">부호기가 내는 것</text><text x="375.0" y="115" font-size="12" fill="#1C232C" text-anchor="middle">점 z</text><text x="655.0" y="115" font-size="12" fill="#1C232C" text-anchor="middle">분포 N(μ, σ²) 의 μ, σ</text><rect x="20" y="129" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">코드 공간</text><text x="375.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">정한 것이 없다</text><text x="655.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">사전분포 N(0, I)</text><rect x="20" y="167" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="191" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">학습 목표</text><text x="375.0" y="191" font-size="12" fill="#1C232C" text-anchor="middle">재구성 오차</text><text x="655.0" y="191" font-size="12" fill="#1C232C" text-anchor="middle">변분 하한 = 재구성 − KL</text><rect x="20" y="205" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="229" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">코드의 벌점</text><text x="375.0" y="229" font-size="12" fill="#1C232C" text-anchor="middle">없다</text><text x="655.0" y="229" font-size="12" fill="#1C232C" text-anchor="middle">KL(q(z|x) ‖ N(0, I))</text><rect x="20" y="243" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">망 깊이 (MNIST)</text><text x="375.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle">784-1000-500-250-30 거울상</text><text x="655.0" y="267" font-size="12" fill="#1C232C" text-anchor="middle">784-500-Nz 와 Nz-500-784</text><rect x="20" y="281" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">파라미터 (MNIST)</text><text x="375.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle">2,837,314</text><text x="655.0" y="305" font-size="12" fill="#1C232C" text-anchor="middle">815,824 (Nz=20)</text><rect x="20" y="319" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">초기화</text><text x="375.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle">RBM 을 쌓아 사전학습</text><text x="655.0" y="343" font-size="12" fill="#1C232C" text-anchor="middle">N(0, 0.01) 무작위</text><rect x="20" y="357" width="780" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">새 데이터 만들기</text><text x="375.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle">길이 없다</text><text x="655.0" y="381" font-size="12" fill="#1C232C" text-anchor="middle">z ~ N(0, I) 를 복호기에</text><rect x="20" y="395" width="780" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="419" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">보고한 지표</text><text x="375.0" y="419" font-size="12" fill="#1C232C" text-anchor="middle">재구성 제곱 오차</text><text x="655.0" y="419" font-size="12" fill="#1C232C" text-anchor="middle">하한 L, 추정 주변 가능도</text><text x="410" y="458" font-size="11" fill="#7A8590" text-anchor="middle">망 깊이가 다른 것은 두 논문이 고른 설정이다. VAE 가 깊은 망을 못 쓴다는 뜻이 아니다(논문 7절이 깊은 망을 다음 일로 꼽는다)</text></svg>
