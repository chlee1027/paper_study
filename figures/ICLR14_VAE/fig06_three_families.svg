ize="11" fill="#4E5964" text-anchor="middle">지수분포: ε~U(0,1) → z = −ln(1−ε)</text><text x="150" y="322" font-size="11" fill="#4E5964" text-anchor="middle">세로축 ε 에서 가로축 z 로 옮긴다</text><rect x="290" y="50" width="250" height="290" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="415" y="74" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">2. 위치-척도 족</text><text x="415" y="110" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">z = 위치 + 척도 · ε</text><text x="415" y="135" font-size="12" fill="#4E5964" text-anchor="middle">ε 는 위치 0 · 척도 1 인 표준형</text><text x="415" y="170" font-size="12" fill="#1E8449" text-anchor="middle">가우스 (이 논문이 쓰는 것)</text><text x="415" y="194" font-size="12" fill="#1C232C" text-anchor="middle">라플라스</text><text x="415" y="218" font-size="12" fill="#1C232C" text-anchor="middle">스튜던트 t</text><text x="415" y="242" font-size="12" fill="#1C232C" text-anchor="middle">로지스틱</text><text x="415" y="266" font-size="12" fill="#1C232C" text-anchor="middle">균등</text><text x="415" y="290" font-size="12" fill="#1C232C" text-anchor="middle">삼각</text><rect x="550" y="50" width="250" height="290" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="675" y="74" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">3. 합성</text><text x="675" y="115" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">로그 정규</text><text x="675" y="133" font-size="11" fill="#4E5964" text-anchor="middle">정규 변수의 exp</text><text x="675" y="163" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">감마</text><text x="675" y="181" font-size="11" fill="#4E5964" text-anchor="middle">지수 변수의 합</text><text x="675" y="211" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">디리클레</text><text x="675" y="229" font-size="11" fill="#4E5964" text-anchor="middle">감마 변수의 가중 합</text><text x="675" y="259" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">베타 · 카이제곱 · F</text><text x="675" y="277" font-size="11" fill="#4E5964" text-anchor="middle">같은 식으로</text><text x="675" y="322" font-size="11" fill="#7A8590" text-anchor="middle">셋 다 안 되면 역누적분포 근사</text></svg>
