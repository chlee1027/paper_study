<svg xmlns="http://www.w3.org/2000/svg" width="820" height="340" viewBox="0 0 820 340" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="방향 그래프 모델과 근사 추론"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">논문 그림 1 — 실선은 생성 모델 pθ(z)pθ(x|z), 점선은 근사 추론 qφ(z|x)</text><rect x="250" y="60" width="260" height="250" rx="6" fill="none" stroke="#4E5964" stroke-width="1.4"/><text x="495" y="298" font-size="14" fill="#4E5964" text-anchor="middle" font-weight="bold">N</text><circle cx="380" cy="115" r="30" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.8"/><text x="380" y="121" font-size="18" fill="#1C232C" text-anchor="middle" font-weight="bold" font-style="italic">z</text><circle cx="380" cy="245" r="30" fill="#C9D2D6" stroke="#1C232C" stroke-width="1.8"/><text x="380" y="251" font-size="18" fill="#1C232C" text-anchor="middle" font-weight="bold" font-style="italic">x</text><line x1="374" y1="146" x2="374" y2="212" stroke="#2E6B8A" stroke-width="2" marker-end="url(#af)"/><path d="M402,223 Q450,180 404,135" fill="none" stroke="#B4552B" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ar)"/><circle cx="130" cy="180" r="26" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="130" y="187" font-size="18" fill="#2E6B8A" text-anchor="middle" font-weight="bold">θ</text><line x1="155" y1="170" x2="348" y2="121" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><line x1="155" y1="190" x2="348" y2="237" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><circle cx="640" cy="180" r="26" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="640" y="187" font-size="18" fill="#B4552B" text-anchor="middle" font-weight="bold">φ</text><line x1="615" y1="170" x2="414" y2="125" stroke="#B4552B" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar)"/><text x="130" y="230" font-size="12" fill="#2E6B8A" text-anchor="middle">생성 파라미터</text><text x="130" y="247" font-size="12" fill="#2E6B8A" text-anchor="middle">(복호기)</text><text x="640" y="230" font-size="12" fill="#B4552B" text-anchor="middle">변분 파라미터</text><text x="640" y="247" font-size="12" fill="#B4552B" text-anchor="middle">(부호기 = 인식 모델)</text><text x="410" y="330" font-size="11" fill="#7A8590" text-anchor="middle">사각형(판) = 데이터 점 N 개마다 되풀이된다. θ 와 φ 는 판 밖에 있어 모든 데이터 점이 함께 쓴다</text></svg>
