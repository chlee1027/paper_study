<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="변분 하한 분해의 숫자 예시"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">식 (1) 을 숫자로 — 사후분포를 아는 1 차원 예시 (p(z)=N(0,1), p(x|z)=N(2z,1), x=3)</text><line x1="151.5789473684211" y1="70" x2="151.5789473684211" y2="330" stroke="#CFD6D3" stroke-width="1"/><text x="151.5789473684211" y="350" font-size="11" fill="#7A8590" text-anchor="middle">-4.0</text><line x1="330.5263157894737" y1="70" x2="330.5263157894737" y2="330" stroke="#CFD6D3" stroke-width="1"/><text x="330.5263157894737" y="350" font-size="11" fill="#7A8590" text-anchor="middle">-3.5</text><line x1="509.4736842105263" y1="70" x2="509.4736842105263" y2="330" stroke="#CFD6D3" stroke-width="1"/><text x="509.4736842105263" y="350" font-size="11" fill="#7A8590" text-anchor="middle">-3.0</text><line x1="688.4210526315788" y1="70" x2="688.4210526315788" y2="330" stroke="#CFD6D3" stroke-width="1"/><text x="688.4210526315788" y="350" font-size="11" fill="#7A8590" text-anchor="middle">-2.5</text><text x="420" y="372" font-size="12" fill="#4E5964" text-anchor="middle">로그 확률 (nat)</text><line x1="644.164687996436" y1="62" x2="644.164687996436" y2="335" stroke="#1C232C" stroke-width="2" stroke-dasharray="5 3"/><text x="650.164687996436" y="56" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">log p(x) = -2.624</text><text x="650.164687996436" y="74" font-size="11" fill="#4E5964" text-anchor="start">(q 와 상관없이 하나)</text><text x="80" y="92" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">q 가 사후분포와 다를 때: q = N(0.5, 0.6²)</text><rect x="80" y="100" width="87.76861750523642" height="26" rx="4" fill="#D8E7EE"/><text x="88" y="118" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">L = -3.955</text><rect x="167.76861750523642" y="100" width="476.39607049119957" height="26" rx="4" fill="#F2DED2"/><text x="405.9666527508362" y="118" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">KL(q‖p(z|x)) = 1.331</text><text x="80" y="150" font-size="12" fill="#4E5964" text-anchor="start">L 을 식 (3) 으로 가르면: 재구성 E[log p(x|z)] = -3.639,  KL(q‖p(z)) = 0.316,  -3.639 − 0.316 = -3.955</text><text x="80" y="212" font-size="13" fill="#1E8449" text-anchor="start" font-weight="bold">q 를 사후분포로 둘 때: q = N(1.2, 0.200)</text><rect x="80" y="220" width="564.164687996436" height="26" rx="4" fill="#D8E7EE"/><text x="88" y="238" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">L = -2.624</text><text x="636.164687996436" y="238" font-size="12" fill="#1E8449" text-anchor="end" font-weight="bold">KL(q‖p(z|x)) = 0 → L 이 log p(x) 에 닿는다</text><text x="80" y="270" font-size="12" fill="#4E5964" text-anchor="start">L 을 식 (3) 으로 가르면: 재구성 E[log p(x|z)] = -1.499,  KL(q‖p(z)) = 1.125,  -1.499 − 1.125 = -2.624</text><text x="420" y="392" font-size="11" fill="#7A8590" text-anchor="middle">q 를 바꿔도 log p(x) 는 그대로다 — 그래서 L 을 올리는 일이 곧 KL(q‖사후분포) 를 줄이는 일이다</text></svg>
