<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="재매개변수화 전후의 계산 그래프"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">재매개변수화 — 뽑기를 φ 밖으로 옮기면 기울기가 μ, σ 까지 내려간다</text><rect x="20" y="50" width="380" height="290" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><rect x="420" y="50" width="380" height="290" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2"/><text x="210" y="74" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="bold">원래 꼴: z ~ N(μ, σ²)</text><rect x="60" y="250" width="120" height="40" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="120" y="275" font-size="14" fill="#1C232C" text-anchor="middle" font-style="italic">x</text><rect x="60" y="170" width="120" height="40" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="120" y="195" font-size="12" fill="#1C232C" text-anchor="middle">μ, σ = 부호기_φ(x)</text><line x1="120" y1="248" x2="120" y2="212" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><polygon points="120,100 160,125 120,150 80,125" fill="#FFF3C4" stroke="#C0392B" stroke-width="1.6"/><text x="120" y="130" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">z 뽑기</text><line x1="120" y1="168" x2="120" y2="152" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="250" y="110" font-size="12" fill="#C0392B" text-anchor="start">뽑기 마디는 미분이 안 된다</text><text x="250" y="128" font-size="12" fill="#C0392B" text-anchor="start">∂z/∂μ 가 정의되지 않는다</text><line x1="240" y1="160" x2="180" y2="160" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#an)"/><text x="250" y="165" font-size="12" fill="#C0392B" text-anchor="start">기울기가 여기서 끊긴다</text><text x="610" y="74" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="bold">재매개변수화: z = μ + σ ⊙ ε,  ε ~ N(0, I)</text><rect x="450" y="250" width="120" height="40" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="510" y="275" font-size="14" fill="#1C232C" text-anchor="middle" font-style="italic">x</text><rect x="450" y="170" width="120" height="40" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="510" y="195" font-size="12" fill="#1C232C" text-anchor="middle">μ, σ = 부호기_φ(x)</text><line x1="510" y1="248" x2="510" y2="212" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><polygon points="690,165 730,190 690,215 650,190" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="690" y="195" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">ε 뽑기</text><rect x="560" y="100" width="110" height="40" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="615" y="125" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">z = μ + σ ε</text><line x1="520" y1="168" x2="580" y2="142" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="680" y1="166" x2="650" y2="142" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><path d="M600,98 Q560,70 525,168" fill="none" stroke="#1E8449" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#ao)"/><text x="560" y="238" font-size="12" fill="#1E8449" text-anchor="middle" font-weight="bold">∂z/∂μ = 1,  ∂z/∂σ = ε</text><text x="610" y="312" font-size="12" fill="#4E5964" text-anchor="middle">무작위는 φ 와 상관없는 ε 에만 남는다</text><text x="610" y="330" font-size="12" fill="#4E5964" text-anchor="middle">예: μ=2, σ=0.5, ε=1.2 이면 z=2.6,  ∂z/∂σ=1.2</text></svg>
