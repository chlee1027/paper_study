565" y="244" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="565" y="264" font-size="11" fill="#4E5964" text-anchor="start">μ 를 멀리 두면 ½μ² 만큼 붙는다.</text><text x="565" y="284" font-size="11" fill="#4E5964" text-anchor="start">코드를 원점 가까이 모으는 힘이다.</text></svg>
