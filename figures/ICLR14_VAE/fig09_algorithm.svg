<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="미니배치 AEVB 알고리즘 흐름"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">알고리즘 1 — 미니배치 하나로 하한 전체의 기울기를 추정해 θ 와 φ 를 함께 올린다</text><rect x="30" y="80" width="170" height="90" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="48" y="104" font-size="14" fill="#2E6B8A" text-anchor="middle" font-weight="bold">1</text><text x="115" y="124" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">미니배치 X_M 뽑기</text><text x="115" y="148" font-size="11" fill="#4E5964" text-anchor="middle">M = 100 장</text><line x1="202" y1="125" x2="223" y2="125" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><rect x="225" y="80" width="170" height="90" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="243" y="104" font-size="14" fill="#4E5964" text-anchor="middle" font-weight="bold">2</text><text x="310" y="124" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">잡음 ε 뽑기</text><text x="310" y="148" font-size="11" fill="#4E5964" text-anchor="middle">데이터 점마다 L = 1 개</text><line x1="397" y1="125" x2="418" y2="125" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><rect x="420" y="80" width="170" height="90" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="438" y="104" font-size="14" fill="#9A7B00" text-anchor="middle" font-weight="bold">3</text><text x="505" y="124" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">L̃ 의 기울기 g</text><text x="505" y="148" font-size="11" fill="#4E5964" text-anchor="middle">(N/M)·Σ L̃(θ,φ;x⁽ⁱ⁾), 식 (8)</text><line x1="592" y1="125" x2="613" y2="125" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><rect x="615" y="80" width="170" height="90" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="633" y="104" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="bold">4</text><text x="700" y="124" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">θ, φ 갱신</text><text x="700" y="148" font-size="11" fill="#4E5964" text-anchor="middle">Adagrad (+ 작은 가중치 감쇠)</text><path d="M700,172 Q420,225 115,172" fill="none" stroke="#4E5964" stroke-width="1.6" stroke-dasharray="5 3" marker-end="url(#ai)"/><text x="420" y="222" font-size="12" fill="#4E5964" text-anchor="middle">θ, φ 가 수렴할 때까지 되풀이</text><rect x="30" y="250" width="760" height="90" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="50" y="274" font-size="12" fill="#1C232C" text-anchor="start">N/M 을 곱하는 이유: 미니배치 100 장의 평균을 데이터 전체의 합으로 키운다. 예: N=50,000 이면 500 을 곱한다</text><text x="50" y="298" font-size="12" fill="#1C232C" text-anchor="start">L = 1 로 충분했다는 것은 논문이 적은 관찰이다 — 조건은 「M 이 충분히 크면(예: 100)」</text><text x="50" y="322" font-size="12" fill="#4E5964" text-anchor="start">계산량: 논문 그림 2 캡션이 백만 개당 20~40 분이라 적는다. 10⁸ 개면 33~67 시간이다 (40 GFLOPS Xeon CPU)</text></svg>
