<svg xmlns="http://www.w3.org/2000/svg" width="900" height="372" viewBox="0 0 900 372" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="교차 주의 모양"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/></marker></defs><text x="450.0" y="28.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">교차 주의의 모양 — 글 모델의 32x32 층에서 작은 예 (N = 1,024, d_eps = 320, M = 77, d_tau = 1,280, d = 320)</text><rect x="30.0" y="50.0" width="240.0" height="120.0" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="150.0" y="72.0" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">UNet 특징 phi(z_t)</text><text x="150.0" y="94.0" font-size="12" fill="#1C232C" text-anchor="middle">N x d_eps = 1,024 x 320</text><text x="150.0" y="118.0" font-size="11" fill="#4E5964" text-anchor="middle">질의를 만든다</text><text x="150.0" y="140.0" font-size="11" fill="#1C232C" text-anchor="middle">W_Q: 320 -&gt; 320</text><rect x="30.0" y="190.0" width="240.0" height="120.0" rx="6" fill="#EADCF0" stroke="#8E44AD" stroke-width="1.2"/><text x="150.0" y="212.0" font-size="12" fill="#8E44AD" text-anchor="middle" font-weight="600">조건 tau(y)</text><text x="150.0" y="234.0" font-size="12" fill="#1C232C" text-anchor="middle">M x d_tau = 77 x 1,280</text><text x="150.0" y="258.0" font-size="11" fill="#4E5964" text-anchor="middle">키와 값을 만든다</text><text x="150.0" y="280.0" font-size="11" fill="#1C232C" text-anchor="middle">W_K, W_V: 1,280 -&gt; 320</text><line x1="270.0" y1="110.0" x2="350.0" y2="110.0" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><line x1="270.0" y1="250.0" x2="350.0" y2="150.0" stroke="#8E44AD" stroke-width="1.4" marker-end="url(#ap)"/><rect x="350.0" y="90.0" width="190.0" height="60.0" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="445.0" y="116.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">softmax(Q K^T / sqrt d)</text><text x="445.0" y="133.0" font-size="10" fill="#4E5964" text-anchor="middle">1,024 x 77</text><line x1="540.0" y1="120.0" x2="610.0" y2="120.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="610.0" y="90.0" width="110.0" height="60.0" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="665.0" y="116.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">곱하기 V</text><text x="665.0" y="133.0" font-size="10" fill="#4E5964" text-anchor="middle">1,024 x 320</text><text x="445.0" y="176.0" font-size="11" fill="#4E5964" text-anchor="middle">자리마다 낱말 77 개에 무게를 나눠 준다</text><rect x="380.0" y="214.0" width="490.0" height="96.0" rx="6" fill="#F6D9D5" stroke="#C0392B" stroke-width="1.2"/><text x="625.0" y="236.0" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="600">원문 4 · 5 쪽의 차원 표기</text><text x="625.0" y="258.0" font-size="12" fill="#1C232C" text-anchor="middle">W_V ∈ R^(d x d_eps), W_Q ∈ R^(d x d_tau), W_K ∈ R^(d x d_tau)</text><text x="625.0" y="282.0" font-size="11" fill="#C0392B" text-anchor="middle">그런데 Q = W_Q · phi, V = W_V · tau 다. W_Q 와 W_V 의 모양이 뒤바뀌어 있다</text><text x="450.0" y="350.0" font-size="11" fill="#4E5964" text-anchor="middle">N · d_eps 는 표 15(채널 320, 곱 1 단) 에서, M · d_tau 는 표 17 에서 왔다. 머리 8 개를 합친 폭으로 적었다</text></svg>
