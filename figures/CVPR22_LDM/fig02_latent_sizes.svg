<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="잠재 수의 개수"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/></marker></defs><text x="430.0" y="28.0" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">표 13 의 z-shape 를 수의 개수로 — 256x256x3 = 196,608 개 기준</text><text x="140.0" y="77.0" font-size="12" fill="#1C232C" text-anchor="end" font-weight="600">LDM-1</text><rect x="150.0" y="62.0" width="650.0" height="22.0" fill="#B4552B"/><text x="792.0" y="77.0" font-size="11" fill="#FFFFFF" text-anchor="end">256x256x3 = 196,608 개 · 1 분의 1</text><text x="140.0" y="117.0" font-size="12" fill="#1C232C" text-anchor="end" font-weight="600">LDM-2</text><rect x="150.0" y="102.0" width="447.2" height="22.0" fill="#2E6B8A"/><text x="605.2" y="117.0" font-size="11" fill="#1C232C" text-anchor="start">128x128x2 = 32,768 개 · 6 분의 1</text><text x="140.0" y="157.0" font-size="12" fill="#1C232C" text-anchor="end" font-weight="600">LDM-4</text><rect x="150.0" y="142.0" width="336.1" height="22.0" fill="#2E6B8A"/><text x="494.1" y="157.0" font-size="11" fill="#1C232C" text-anchor="start">64x64x3 = 12,288 개 · 16 분의 1</text><text x="140.0" y="197.0" font-size="12" fill="#1C232C" text-anchor="end" font-weight="600">LDM-8</text><rect x="150.0" y="182.0" width="211.8" height="22.0" fill="#2E6B8A"/><text x="369.8" y="197.0" font-size="11" fill="#1C232C" text-anchor="start">32x32x4 = 4,096 개 · 48 분의 1</text><text x="140.0" y="237.0" font-size="12" fill="#1C232C" text-anchor="end" font-weight="600">LDM-16</text><rect x="150.0" y="222.0" width="133.3" height="22.0" fill="#2E6B8A"/><text x="291.3" y="237.0" font-size="11" fill="#1C232C" text-anchor="start">16x16x8 = 2,048 개 · 96 분의 1</text><text x="140.0" y="277.0" font-size="12" fill="#1C232C" text-anchor="end" font-weight="600">LDM-32</text><rect x="150.0" y="262.0" width="133.3" height="22.0" fill="#2E6B8A"/><text x="291.3" y="277.0" font-size="11" fill="#1C232C" text-anchor="start">8x8x32 = 2,048 개 · 96 분의 1</text><rect x="150.0" y="286.0" width="54.8" height="7.0" fill="#C0392B"/><text x="212.8" y="294.0" font-size="10" fill="#C0392B" text-anchor="start">표 8 의 f = 32 는 c = 16 이라 1,024 개(표 13 과 어긋남)</text><text x="430.0" y="326.0" font-size="11" fill="#4E5964" text-anchor="middle">가로는 로그. LDM-16 과 LDM-32 는 수의 개수가 같다(2,048). 자리 수는 256 과 64 로 네 배 다르다. 내가 센 것</text></svg>
