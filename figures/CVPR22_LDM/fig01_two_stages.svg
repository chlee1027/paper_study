<svg xmlns="http://www.w3.org/2000/svg" width="940" height="364" viewBox="0 0 940 364" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="두 단계 파이프라인"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/></marker></defs><text x="470.0" y="26.0" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">두 단계: 오토인코더를 먼저 배워 얼리고, 그 잠재 공간에서 확산을 배운다</text><rect x="20.0" y="44.0" width="196.0" height="300.0" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2" stroke-dasharray="5,4"/><text x="118.0" y="64.0" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">1 단계 — 픽셀 공간</text><rect x="40.0" y="84.0" width="66.0" height="48.0" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.2"/><text x="73.0" y="104.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">x</text><text x="73.0" y="121.0" font-size="9" fill="#4E5964" text-anchor="middle">256x256x3</text><rect x="136.0" y="84.0" width="62.0" height="48.0" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.2"/><text x="167.0" y="104.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">E</text><text x="167.0" y="121.0" font-size="9" fill="#4E5964" text-anchor="middle">부호기</text><line x1="106.0" y1="108.0" x2="136.0" y2="108.0" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><rect x="136.0" y="240.0" width="62.0" height="48.0" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.2"/><text x="167.0" y="260.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">D</text><text x="167.0" y="277.0" font-size="9" fill="#4E5964" text-anchor="middle">복호기</text><rect x="40.0" y="240.0" width="66.0" height="48.0" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.2"/><text x="73.0" y="260.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">x 복원</text><text x="73.0" y="277.0" font-size="9" fill="#4E5964" text-anchor="middle">256x256x3</text><line x1="136.0" y1="264.0" x2="106.0" y2="264.0" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><text x="118.0" y="165.0" font-size="11" fill="#4E5964" text-anchor="middle">지각 손실 + 조각 판별기</text><text x="118.0" y="183.0" font-size="11" fill="#4E5964" text-anchor="middle">+ KL(무게 10^-6 자리)</text><text x="118.0" y="201.0" font-size="11" fill="#4E5964" text-anchor="middle">또는 VQ</text><text x="118.0" y="318.0" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="600">배운 뒤 얼린다</text><rect x="236.0" y="44.0" width="470.0" height="300.0" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2" stroke-dasharray="5,4"/><text x="471.0" y="64.0" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="600">2 단계 — 잠재 공간 (f = 4 면 64x64x3)</text><rect x="256.0" y="84.0" width="62.0" height="48.0" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.2"/><text x="287.0" y="104.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">z</text><text x="287.0" y="121.0" font-size="9" fill="#4E5964" text-anchor="middle">z = E(x)</text><line x1="198.0" y1="108.0" x2="256.0" y2="108.0" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><rect x="420.0" y="84.0" width="62.0" height="48.0" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.2"/><text x="451.0" y="104.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">z_t</text><text x="451.0" y="121.0" font-size="9" fill="#4E5964" text-anchor="middle">닫힌 꼴</text><line x1="318.0" y1="108.0" x2="420.0" y2="108.0" stroke="#9A7B00" stroke-width="1.4" marker-end="url(#ac)"/><text x="369.0" y="100.0" font-size="10" fill="#4E5964" text-anchor="middle">잡음 더하기</text><rect x="584.0" y="84.0" width="100.0" height="48.0" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.2"/><text x="634.0" y="104.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">eps 맞히기</text><text x="634.0" y="121.0" font-size="9" fill="#4E5964" text-anchor="middle">식 (2) · (3)</text><line x1="482.0" y1="108.0" x2="584.0" y2="108.0" stroke="#9A7B00" stroke-width="1.4" marker-end="url(#ac)"/><rect x="290.0" y="170.0" width="300.0" height="92.0" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="440.0" y="190.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">시간 조건 UNet</text><text x="440.0" y="208.0" font-size="11" fill="#4E5964" text-anchor="middle">합성곱 + 교차 주의(질의 = UNet 특징)</text><text x="440.0" y="226.0" font-size="11" fill="#4E5964" text-anchor="middle">키 · 값 = tau(y) · 표 16 블록</text><text x="440.0" y="248.0" font-size="10" fill="#7A8590" text-anchor="middle">표본 뽑기: z_T 에서 걸음마다 eps 를 뺀다</text><line x1="451.0" y1="132.0" x2="451.0" y2="170.0" stroke="#9A7B00" stroke-width="1.4" marker-end="url(#ac)"/><line x1="290.0" y1="264.0" x2="198.0" y2="264.0" stroke="#9A7B00" stroke-width="1.4" marker-end="url(#ac)"/><text x="248.0" y="256.0" font-size="10" fill="#4E5964" text-anchor="middle">z_0</text><rect x="726.0" y="44.0" width="194.0" height="300.0" rx="6" fill="#EADCF0" stroke="#8E44AD" stroke-width="1.2" stroke-dasharray="5,4"/><text x="823.0" y="64.0" font-size="12" fill="#8E44AD" text-anchor="middle" font-weight="600">조건 y</text><rect x="746.0" y="84.0" width="154.0" height="42.0" rx="6" fill="#F6F7F5" stroke="#8E44AD" stroke-width="1.2"/><text x="823.0" y="101.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="600">글 · 부류 · 상자</text><text x="823.0" y="118.0" font-size="9" fill="#4E5964" text-anchor="middle">tau 가 M x d_tau 로</text><line x1="746.0" y1="110.0" x2="590.0" y2="195.0" stroke="#8E44AD" stroke-width="1.4" marker-end="url(#ap)"/><text x="632.0" y="192.0" font-size="10" fill="#8E44AD" text-anchor="middle">교차 주의</text><rect x="746.0" y="214.0" width="154.0" height="42.0" rx="6" fill="#F6F7F5" stroke="#8E44AD" stroke-width="1.2"/><text x="823.0" y="231.0" font-size="10" fill="#1C232C" text-anchor="middle" font-weight="600">낮은 해상도 · 지도 · 가림</text><text x="823.0" y="248.0" font-size="8" fill="#4E5964" text-anchor="middle">z_t 에 이어 붙임</text><line x1="746.0" y1="235.0" x2="590.0" y2="235.0" stroke="#8E44AD" stroke-width="1.4" marker-end="url(#ap)"/><text x="668.0" y="228.0" font-size="10" fill="#8E44AD" text-anchor="middle">concat</text><text x="823.0" y="300.0" font-size="11" fill="#4E5964" text-anchor="middle">tau 와 eps_theta 는</text><text x="823.0" y="318.0" font-size="11" fill="#4E5964" text-anchor="middle">함께 배운다(식 3)</text></svg>
