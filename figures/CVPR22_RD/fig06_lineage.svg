<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" width="900" height="380"><rect width="900" height="380" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 편의 자리 — 선생-학생 계열과 이웃 계열 (이 저장소의 노트 기준)</text><rect x="20.0" y="60.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="120.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">US (CVPR 2020)</text><text x="120.0" y="100.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">같은 꼴 학생 여럿, 정상만 학습</text><rect x="250.0" y="60.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="350.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">MKD (CVPR 2021)</text><text x="350.0" y="100.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">선생보다 작은 학생, 층 여럿 맞춤</text><rect x="480.0" y="60.0" width="200.0" height="52.0" fill="#ffffff" stroke="#c8553d"/><text x="580.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RD (CVPR 2022) 이 노트</text><text x="580.0" y="100.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">부호기 선생 → 복호기 학생</text><rect x="710.0" y="60.0" width="170.0" height="52.0" fill="#ffffff" stroke="#2f6db3"/><text x="795.0" y="82.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">EfficientAD (WACV 2024)</text><text x="795.0" y="100.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 큰 틀의 마지막 칸</text><line x1="220.0" y1="86.0" x2="250.0" y2="86.0" stroke="#222222" stroke-width="1.5"/><line x1="450.0" y1="86.0" x2="480.0" y2="86.0" stroke="#222222" stroke-width="1.5"/><line x1="680.0" y1="86.0" x2="710.0" y2="86.0" stroke="#222222" stroke-width="1.5"/><rect x="20.0" y="170.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="120.0" y="192.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">SPADE · PaDiM</text><text x="120.0" y="210.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">정상 특징을 저장</text><rect x="250.0" y="170.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="350.0" y="192.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PatchCore (CVPR 2022)</text><text x="350.0" y="210.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">저장 + 코어셋</text><rect x="480.0" y="170.0" width="200.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="580.0" y="192.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">UniAD (NeurIPS 2022)</text><text x="580.0" y="210.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">특징 재구성, 통합 설정</text><rect x="710.0" y="170.0" width="170.0" height="52.0" fill="#ffffff" stroke="#8a8a8a"/><text x="795.0" y="192.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM (ICCV 2021)</text><text x="795.0" y="210.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">가짜 결함 + 분할 망</text><line x1="540.0" y1="112.0" x2="540.0" y2="170.0" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/><text x="548.0" y="136.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">같은 「특징을 되살린다」</text><text x="548.0" y="150.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">발상, 학생 대신 변환기</text><line x1="660.0" y1="112.0" x2="760.0" y2="170.0" stroke="#c8553d" stroke-width="1" stroke-dasharray="4 3"/><text x="722.0" y="130.0" font-size="10" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RD 의 표에 없다</text><text x="20.0" y="262.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RD 가 표 3 에서 비용을 견준 상대는 저장 계열(SPADE · PaDiM)이다. 저장하지 않고 학생 망 하나를 둔다는 것이 이 편의 비용 주장이다.</text><text x="20.0" y="284.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">같은 해 같은 학회(CVPR 2022)의 PatchCore 는 RD 참고 문헌 50 건에 없다.</text><text x="20.0" y="306.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM 은 RD 의 참고 문헌에 없고, 같은 저자의 앞 편 RIAD [46] 만 있다.</text></svg>