<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340"><rect width="1000" height="340" fill="#ffffff"/><text x="20.0" y="26.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 편의 자리 — 이 저장소의 노트와 이 큰 틀의 세 칸</text><rect x="20.0" y="60.0" width="220.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="130.0" y="83.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Transformer (NIPS 2017)</text><text x="130.0" y="102.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">글 부호기의 뼈대</text><rect x="20.0" y="140.0" width="220.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="130.0" y="163.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">ViT (ICLR 2021)</text><text x="130.0" y="182.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지 부호기 하나 (ViT-L/14)</text><rect x="20.0" y="220.0" width="220.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="130.0" y="243.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">ResNet (CVPR 2016)</text><text x="130.0" y="262.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지 부호기 다른 하나 (RN50)</text><rect x="320.0" y="140.0" width="230.0" height="54.0" rx="4" fill="#ffffff" stroke="#2f6db3"/><text x="435.0" y="163.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CLIP (ICML 2021)</text><text x="435.0" y="182.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">글-이미지 대조, 제로샷 분류</text><rect x="630.0" y="100.0" width="170.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="715.0" y="123.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">WinCLIP (CVPR 2023)</text><text x="715.0" y="142.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">창 단위 제로샷 이상 탐지</text><rect x="630.0" y="180.0" width="170.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="715.0" y="203.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">AnomalyCLIP (ICLR 2024)</text><text x="715.0" y="222.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">물체와 무관한 프롬프트 학습</text><line x1="240.0" y1="87.0" x2="320.0" y2="167.0" stroke="#222222" stroke-width="1.2"/><line x1="240.0" y1="167.0" x2="320.0" y2="167.0" stroke="#222222" stroke-width="1.2"/><line x1="240.0" y1="247.0" x2="320.0" y2="167.0" stroke="#222222" stroke-width="1.2"/><line x1="550.0" y1="167.0" x2="630.0" y2="127.0" stroke="#222222" stroke-width="1.2"/><line x1="550.0" y1="167.0" x2="630.0" y2="207.0" stroke="#222222" stroke-width="1.2"/><text x="820.0" y="132.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 큰 틀의 둘째 · 셋째 칸</text><text x="20.0" y="300.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CLIP 은 이상 탐지를 다루지 않는다. 이 큰 틀에서 이 편을 읽는 까닭은 뒤 두 편이 쓰는 「글로 분류기를 만든다」 · 「프롬프트 묶음」 · 「이미지-글 코사인」 의 원 출처라서다.</text><text x="20.0" y="320.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">BERT 노트와는 「사전학습 뒤 과제마다 미세조정」 대 「사전학습 뒤 글로 과제를 적는다」 로 갈린다.</text></svg>