<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400"><rect width="1000" height="400" fill="#ffffff"/><text x="20.0" y="26.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">글 쪽에서 얻는 몫: 프롬프트 (부록 B, ImageNet) 와 사전학습 데이터 (부록 G 표 12, ResNet-50)</text><text x="20.0" y="46.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">왼쪽은 원문이 문장으로 적은 오름 둘을 쌓은 것이다. 오른쪽은 YFCC100M 걸러 낸 몫과 같은 크기의 WIT 몫으로 따로 배운 두 모형의 제로샷 차(YFCC - WIT).</text><text x="60.0" y="94.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">클래스 이름만</text><text x="60.0" y="144.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">+ 「A photo of a {label}.」</text><rect x="270.0" y="128.0" width="52.0" height="22.0" rx="2" fill="#2f6db3" stroke="none"/><text x="328.0" y="144.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">+1.3 점</text><text x="60.0" y="194.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">+ 프롬프트 80 개 묶음</text><rect x="322.0" y="178.0" width="140.0" height="22.0" rx="2" fill="#d9a21b" stroke="none"/><text x="468.0" y="194.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">+3.5 점</text><text x="60.0" y="250.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">합 +4.8 점 (원문 「almost 5%」). 80 개를 고른 방법은 적혀 있지 않다.</text><text x="60.0" y="270.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">묶음은 확률이 아니라 글 임베딩을 평균해 한 번만 계산한다.</text><line x1="760.0" y1="70.0" x2="760.0" y2="278.0" stroke="#222222" stroke-width="1"/><text x="660.0" y="89.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Birdsnap</text><rect x="760.0" y="78.0" width="92.4" height="16.0" rx="2" fill="#2f6db3" stroke="none"/><text x="858.4" y="90.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">+15.4</text><text x="660.0" y="115.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Country211</text><rect x="759.4" y="104.0" width="2.0" height="16.0" rx="2" fill="#c8553d" stroke="none"/><text x="753.4" y="116.0" font-size="10" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">-0.1</text><text x="660.0" y="141.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Flowers102</text><rect x="760.0" y="130.0" width="161.4" height="16.0" rx="2" fill="#2f6db3" stroke="none"/><text x="927.4" y="142.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">+26.9</text><text x="660.0" y="167.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">GTSRB</text><rect x="759.4" y="156.0" width="2.0" height="16.0" rx="2" fill="#c8553d" stroke="none"/><text x="753.4" y="168.0" font-size="10" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">-0.1</text><text x="660.0" y="193.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">UCF101</text><rect x="705.4" y="182.0" width="54.6" height="16.0" rx="2" fill="#c8553d" stroke="none"/><text x="699.4" y="194.0" font-size="10" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">-9.1</text><text x="660.0" y="219.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Stanford Cars</text><rect x="717.4" y="208.0" width="42.6" height="16.0" rx="2" fill="#c8553d" stroke="none"/><text x="711.4" y="220.0" font-size="10" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">-7.1</text><text x="660.0" y="245.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">ImageNet</text><rect x="760.0" y="234.0" width="22.2" height="16.0" rx="2" fill="#2f6db3" stroke="none"/><text x="788.2" y="246.0" font-size="10" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">+3.7</text><text x="660.0" y="271.0" font-size="11" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Dataset Average</text><rect x="757.6" y="260.0" width="2.4" height="16.0" rx="2" fill="#c8553d" stroke="none"/><text x="751.6" y="272.0" font-size="10" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">-0.4</text><text x="600.0" y="302.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">평균 -0.4 점. 데이터셋별로는 +26.9 (Flowers102) 에서 -9.1 (UCF101).</text><text x="20.0" y="388.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">부록 G 는 「YFCC 와 WIT 는 평균이 비슷하다」 고 적는다. 그 비교는 ResNet-50 한 크기 · 32 에폭 · 묶음 2,048 이고, 400M 전체와 견준 것이 아니다.</text></svg>