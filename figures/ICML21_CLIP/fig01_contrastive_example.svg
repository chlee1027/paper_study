<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430"><rect width="1000" height="430" fill="#ffffff"/><text x="20.0" y="26.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">대조 사전학습의 손실을 묶음 3 쌍으로 셈 (그림 3 의 의사 코드를 그대로 따름, 값은 내가 고른 예)</text><text x="20.0" y="46.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">칸 = 이미지 i 와 글 j 의 코사인 유사도. 대각선(진하게)이 실제 쌍. 행마다 · 열마다 소프트맥스 교차 엔트로피를 내 평균한다.</text><text x="175.0" y="80.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">글 T1</text><text x="245.0" y="80.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">글 T2</text><text x="315.0" y="80.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">글 T3</text><text x="128.0" y="129.0" font-size="12" fill="#222222" text-anchor="end" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지 I1</text><rect x="141.0" y="91.0" width="68.0" height="68.0" rx="4" fill="#2f6db3" stroke="none"/><text x="175.0" y="130.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.30</text><rect x="211.0" y="91.0" width="68.0" height="68.0" rx="4" fill="#e8eef6" stroke="none"/><text x="245.0" y="130.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.10</text><rect x="281.0" y="91.0" width="68.0" height="68.0" rx="4" fill="#e8eef6" stroke="none"/><text x="315.0" y="130.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.05</text><text x="128.0" y="199.0" font-size="12" fill="#222222" text-anchor="end" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지 I2</text><rect x="141.0" y="161.0" width="68.0" height="68.0" rx="4" fill="#e8eef6" stroke="none"/><text x="175.0" y="200.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.08</text><rect x="211.0" y="161.0" width="68.0" height="68.0" rx="4" fill="#2f6db3" stroke="none"/><text x="245.0" y="200.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.25</text><rect x="281.0" y="161.0" width="68.0" height="68.0" rx="4" fill="#e8eef6" stroke="none"/><text x="315.0" y="200.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.12</text><text x="128.0" y="269.0" font-size="12" fill="#222222" text-anchor="end" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지 I3</text><rect x="141.0" y="231.0" width="68.0" height="68.0" rx="4" fill="#e8eef6" stroke="none"/><text x="175.0" y="270.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.02</text><rect x="211.0" y="231.0" width="68.0" height="68.0" rx="4" fill="#e8eef6" stroke="none"/><text x="245.0" y="270.0" font-size="14" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.11</text><rect x="281.0" y="231.0" width="68.0" height="68.0" rx="4" fill="#2f6db3" stroke="none"/><text x="315.0" y="270.0" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.28</text><text x="420.0" y="100.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">logit = 코사인 x exp(t). t 는 배우는 값이고, 표 18 의 「최대 온도 100」 이 배율의 위 끝이다.</text><text x="420.0" y="124.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">같은 유사도 행렬이라도 배율에 따라 손실이 크게 달라진다 (내 셈):</text><text x="430.0" y="154.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">배율   1.0 (τ = 1.000):  이미지 쪽 0.972 · 글 쪽 0.972 · 평균 0.972</text><text x="430.0" y="180.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">배율  14.3 (τ = 0.070):  이미지 쪽 0.135 · 글 쪽 0.138 · 평균 0.137</text><text x="430.0" y="206.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">배율 100.0 (τ = 0.010):  이미지 쪽 0.000 · 글 쪽 0.000 · 평균 0.000</text><text x="420.0" y="248.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">아무것도 못 가르면 손실은 ln 3 = 1.099 이다. 묶음이 32,768 이면 이 값이 ln 32,768 = 10.40 이고,</text><text x="420.0" y="270.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지 하나가 오답 글 32,767 개와 겨룬다. 한 걸음의 행렬 칸은 1,073,741,824 개다.</text><text x="20.0" y="382.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원문은 이 묶음 구성과 목적 함수를 Sohn(2016)의 multi-class N-pair 손실로, 의료 영상의 글-이미지 쌍에 처음 쓴 것을 ConVIRT(Zhang 외 2020)로 적는다.</text><text x="20.0" y="400.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CLIP 이 바꾼 것은 처음부터 배우기(사전학습 가중치 없음), 비선형 투영 대신 선형 투영, 글 한 문장 뽑기 생략, 무작위 정사각 자르기 하나뿐인 증강,</text><text x="20.0" y="418.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">그리고 온도를 하이퍼파라미터로 두지 않고 배우는 것이다(2.2절).</text></svg>