<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="ViT 의 앞 칸과 남은 일"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="450.0" y="26" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">그림 18. 이 편이 앞 칸에서 받은 것</text><rect x="30" y="60" width="210" height="52" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="135.0" y="80" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">Transformer (2017)</text><text x="135.0" y="98" font-size="10.5" fill="#4E5964" text-anchor="middle">인코더, 다중 머리, 자리 합</text><rect x="30" y="136" width="210" height="52" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="135.0" y="156" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">BERT (2019)</text><text x="135.0" y="174" font-size="10.5" fill="#4E5964" text-anchor="middle">[class], 사전학습 후 미세조정</text><rect x="30" y="212" width="210" height="52" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="135.0" y="232" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">ResNet · BN · GN + WS (BiT)</text><text x="135.0" y="250" font-size="10.5" fill="#4E5964" text-anchor="middle">비교 상대, 하이브리드의 앞단</text><rect x="350" y="124" width="200" height="76" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="450.0" y="144" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">ViT (2021)</text><text x="450.0" y="162" font-size="10.5" fill="#4E5964" text-anchor="middle">조각 = 낱말, 표준 인코더</text><line x1="240" y1="86" x2="348" y2="162" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><line x1="240" y1="162" x2="348" y2="162" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><line x1="240" y1="238" x2="348" y2="162" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><rect x="660" y="60" width="214" height="52" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="767.0" y="80" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">원문이 꼽은 남은 일 하나</text><text x="767.0" y="98" font-size="10.5" fill="#4E5964" text-anchor="middle">검출 · 분할 등 다른 과제</text><rect x="660" y="136" width="214" height="52" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="767.0" y="156" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">원문이 꼽은 남은 일 둘</text><text x="767.0" y="174" font-size="10.5" fill="#4E5964" text-anchor="middle">자기 지도 사전학습 (79.9%)</text><rect x="660" y="212" width="214" height="52" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="767.0" y="232" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">원문이 꼽은 남은 일 셋</text><text x="767.0" y="250" font-size="10.5" fill="#4E5964" text-anchor="middle">더 키우기 (포화를 못 봄)</text><line x1="550" y1="162" x2="658" y2="86" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><line x1="550" y1="162" x2="658" y2="162" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/><line x1="550" y1="162" x2="658" y2="238" stroke="#4E5964" stroke-width="1.3" marker-end="url(#ai)"/></svg>
