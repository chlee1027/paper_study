<svg xmlns="http://www.w3.org/2000/svg" width="940" height="370" viewBox="0 0 940 370" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 2 사전학습 비용과 에폭"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="470.0" y="26" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">그림 7. 표 2 의 TPUv3-코어-일 — 에폭이 칸마다 다르고 표에 적혀 있지 않다</text><text x="160" y="75" font-size="12" fill="#1C232C" text-anchor="end">H/14 JFT</text><rect x="170" y="60" width="75.0" height="22" rx="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><text x="253.0" y="76" font-size="11.5" fill="#1C232C" text-anchor="start">2,500</text><text x="650" y="76" font-size="11.5" fill="#4E5964" text-anchor="start">표 3: 14 에폭</text><text x="160" y="113" font-size="12" fill="#1C232C" text-anchor="end">L/16 JFT</text><rect x="170" y="98" width="20.4" height="22" rx="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><text x="198.4" y="114" font-size="11.5" fill="#1C232C" text-anchor="start">680</text><text x="650" y="114" font-size="11.5" fill="#4E5964" text-anchor="start">표 3: 7 또는 14 에폭</text><text x="160" y="151" font-size="12" fill="#1C232C" text-anchor="end">L/16 I21k</text><rect x="170" y="136" width="6.9" height="22" rx="3" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><text x="184.9" y="152" font-size="11.5" fill="#1C232C" text-anchor="start">230</text><text x="650" y="152" font-size="11.5" fill="#4E5964" text-anchor="start">표 3: 30 또는 90 에폭</text><text x="160" y="189" font-size="12" fill="#1C232C" text-anchor="end">BiT-L R152x4</text><rect x="170" y="174" width="297.0" height="22" rx="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><text x="475.0" y="190" font-size="11.5" fill="#1C232C" text-anchor="start">9,900</text><text x="650" y="190" font-size="11.5" fill="#4E5964" text-anchor="start">D.1 이 BiT 논문을 두고 적은 값: 30 에폭</text><text x="160" y="227" font-size="12" fill="#1C232C" text-anchor="end">Noisy Student</text><rect x="170" y="212" width="369.0" height="22" rx="3" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><text x="547.0" y="228" font-size="11.5" fill="#1C232C" text-anchor="start">12,300</text><text x="650" y="228" font-size="11.5" fill="#4E5964" text-anchor="start">이 편에 적혀 있지 않다</text><rect x="40" y="258" width="860" height="92" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="56" y="280" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="700">BiT-L / H/14 = 9,900 / 2,500 = 3.96 배. BiT-L 이 30 에폭이라면 에폭당 1.85 배 (내가 센 것, 표 2 의 BiT-L 에폭은 적혀 있지 않다).</text><text x="56" y="301" font-size="11.5" fill="#4E5964" text-anchor="start">같은 편 그림 11 의 224 입력 추론 속도는 H/14 87.3 · R152x4 110.7 이미지/초/코어로 H/14 가 R152x4 의 0.79 배다(벡터 좌표로 읽음).</text><text x="56" y="322" font-size="11.5" fill="#4E5964" text-anchor="start">원문도 「스케줄 · 최적화기 · 가중치 감쇠에도 달렸다」 고 적고 통제된 비교를 4.4절로 넘긴다(6 쪽). 그 4.4절에 R152x4 와 Noisy Student 는 없다.</text></svg>
