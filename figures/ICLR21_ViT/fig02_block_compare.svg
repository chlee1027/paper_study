<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="ViT 블록과 원 Transformer 층의 정규화 자리 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="450.0" y="26" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">그림 2. 블록 — 정규화 자리가 원 Transformer 와 다르다</text><text x="180" y="56" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">ViT 인코더 블록 (식 2, 3)</text><text x="180" y="74" font-size="11" fill="#7A8590" text-anchor="middle">정규화 먼저, 지름길은 정규화 밖</text><text x="180" y="390" font-size="11" fill="#7A8590" text-anchor="middle">입력</text><rect x="110" y="326" width="140" height="28" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="180" y="344" font-size="12" fill="#1C232C" text-anchor="middle">LN</text><line x1="180" y1="378" x2="180" y2="354" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="110" y="284" width="140" height="28" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="180" y="302" font-size="12" fill="#1C232C" text-anchor="middle">다중 머리 주의</text><line x1="180" y1="326" x2="180" y2="312" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><circle cx="180" cy="256" r="12" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="180" y="260" font-size="13" fill="#1C232C" text-anchor="middle">+</text><line x1="180" y1="284" x2="180" y2="268" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="110" y="202" width="140" height="28" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="180" y="220" font-size="12" fill="#1C232C" text-anchor="middle">LN</text><line x1="180" y1="244" x2="180" y2="230" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="110" y="160" width="140" height="28" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="180" y="178" font-size="12" fill="#1C232C" text-anchor="middle">MLP (GELU)</text><line x1="180" y1="202" x2="180" y2="188" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><circle cx="180" cy="132" r="12" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="180" y="136" font-size="13" fill="#1C232C" text-anchor="middle">+</text><line x1="180" y1="160" x2="180" y2="144" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="600" y="56" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">원 Transformer 인코더 층</text><text x="600" y="74" font-size="11" fill="#7A8590" text-anchor="middle">더한 뒤 정규화, 지름길이 정규화를 지난다</text><text x="600" y="390" font-size="11" fill="#7A8590" text-anchor="middle">입력</text><rect x="530" y="326" width="140" height="28" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="600" y="344" font-size="12" fill="#1C232C" text-anchor="middle">다중 머리 주의</text><line x1="600" y1="378" x2="600" y2="354" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><circle cx="600" cy="298" r="12" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="600" y="302" font-size="13" fill="#1C232C" text-anchor="middle">+</text><line x1="600" y1="326" x2="600" y2="310" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="530" y="244" width="140" height="28" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="600" y="262" font-size="12" fill="#1C232C" text-anchor="middle">LN</text><line x1="600" y1="286" x2="600" y2="272" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="530" y="202" width="140" height="28" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="600" y="220" font-size="12" fill="#1C232C" text-anchor="middle">앞먹임 (ReLU)</text><line x1="600" y1="244" x2="600" y2="230" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><circle cx="600" cy="174" r="12" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="600" y="178" font-size="13" fill="#1C232C" text-anchor="middle">+</text><line x1="600" y1="202" x2="600" y2="186" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="530" y="120" width="140" height="28" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="600" y="138" font-size="12" fill="#1C232C" text-anchor="middle">LN</text><line x1="600" y1="162" x2="600" y2="148" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="322" y="130" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="700">ViT 의 길</text><text x="322" y="150" font-size="11.5" fill="#4E5964" text-anchor="start">z' = MSA(LN(z)) + z</text><text x="322" y="170" font-size="11.5" fill="#4E5964" text-anchor="start">z = MLP(LN(z')) + z'</text><text x="322" y="190" font-size="11.5" fill="#4E5964" text-anchor="start"></text><text x="322" y="210" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="700">Transformer 의 길</text><text x="322" y="230" font-size="11.5" fill="#4E5964" text-anchor="start">z' = LN(z + MSA(z))</text><text x="322" y="250" font-size="11.5" fill="#4E5964" text-anchor="start">z = LN(z' + FF(z'))</text></svg>
