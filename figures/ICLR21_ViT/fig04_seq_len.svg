<svg xmlns="http://www.w3.org/2000/svg" width="760" height="290" viewBox="0 0 760 290" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="입력 크기와 패치 크기별 조각 수"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="380.0" y="26" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">그림 4. 입력 크기와 패치 크기가 조각 수 N 을 정한다 (N = HW / P²)</text><rect x="60" y="48" width="130" height="30" fill="#DDE3E0"/><text x="125.0" y="67.5" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">입력 / 패치</text><rect x="190" y="48" width="180" height="30" fill="#DDE3E0"/><text x="280.0" y="67.5" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">P = 14</text><rect x="370" y="48" width="180" height="30" fill="#DDE3E0"/><text x="460.0" y="67.5" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">P = 16</text><rect x="550" y="48" width="150" height="30" fill="#DDE3E0"/><text x="625.0" y="67.5" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">P = 32</text><line x1="60" y1="78" x2="700" y2="78" stroke="#CFD6D3" stroke-width="0.8"/><text x="125.0" y="97.5" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">224</text><text x="280.0" y="97.5" font-size="12.5" fill="#4E5964" text-anchor="middle">16² = 256</text><text x="460.0" y="97.5" font-size="12.5" fill="#4E5964" text-anchor="middle">14² = 196</text><text x="625.0" y="97.5" font-size="12.5" fill="#4E5964" text-anchor="middle">7² = 49</text><line x1="60" y1="108" x2="700" y2="108" stroke="#CFD6D3" stroke-width="0.8"/><text x="125.0" y="127.5" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">384</text><rect x="190" y="108" width="180" height="30" fill="#F6D9D5"/><text x="280.0" y="127.5" font-size="12.5" fill="#C0392B" text-anchor="middle">27.43² = 안 나뉜다</text><text x="460.0" y="127.5" font-size="12.5" fill="#4E5964" text-anchor="middle">24² = 576</text><text x="625.0" y="127.5" font-size="12.5" fill="#4E5964" text-anchor="middle">12² = 144</text><line x1="60" y1="138" x2="700" y2="138" stroke="#CFD6D3" stroke-width="0.8"/><text x="125.0" y="157.5" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">512</text><rect x="190" y="138" width="180" height="30" fill="#F6D9D5"/><text x="280.0" y="157.5" font-size="12.5" fill="#C0392B" text-anchor="middle">36.57² = 안 나뉜다</text><text x="460.0" y="157.5" font-size="12.5" fill="#4E5964" text-anchor="middle">32² = 1,024</text><text x="625.0" y="157.5" font-size="12.5" fill="#4E5964" text-anchor="middle">16² = 256</text><line x1="60" y1="168" x2="700" y2="168" stroke="#CFD6D3" stroke-width="0.8"/><text x="125.0" y="187.5" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">518</text><text x="280.0" y="187.5" font-size="12.5" fill="#4E5964" text-anchor="middle">37² = 1,369</text><rect x="370" y="168" width="180" height="30" fill="#F6D9D5"/><text x="460.0" y="187.5" font-size="12.5" fill="#C0392B" text-anchor="middle">32.38² = 안 나뉜다</text><rect x="550" y="168" width="150" height="30" fill="#F6D9D5"/><text x="625.0" y="187.5" font-size="12.5" fill="#C0392B" text-anchor="middle">16.19² = 안 나뉜다</text><line x1="60" y1="198" x2="700" y2="198" stroke="#CFD6D3" stroke-width="0.8"/><line x1="60" y1="48" x2="700" y2="48" stroke="#4E5964" stroke-width="1"/><text x="60" y="228" font-size="12" fill="#4E5964" text-anchor="start">표 2 의 미세조정은 L/16 이 512, H/14 가 518 이다. 표 5 는 「384」 라 적는데 384 는 14 로 나뉘지 않는다.</text><text x="60" y="250" font-size="12" fill="#9A7B00" text-anchor="start" font-weight="700">그림 11 의 H/14 선은 입력 70 · 126 · 224 · 378 · 518 에 찍혀 있다(벡터 좌표로 읽음). 378 = 27 x 14.</text><text x="60" y="272" font-size="12" fill="#4E5964" text-anchor="start">픽셀 하나를 자리 하나로 두면 N = 50,176. 16 조각으로 묶어 n 은 1/256, n² 은 1/65,536 이 된다.</text></svg>
