.82" font-size="12" fill="#4E5964" text-anchor="middle">-</text><line x1="20" y1="129" x2="880" y2="129" stroke="#CFD6D3" stroke-width="0.8"/><text x="80.0" y="146.82" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">ImageNet-21k</text><text x="167.0" y="146.82" font-size="12" fill="#4E5964" text-anchor="middle">21k</text><text x="227.0" y="146.82" font-size="12" fill="#4E5964" text-anchor="middle">14M</text><text x="287.0" y="146.82" font-size="12" fill="#4E5964" text-anchor="middle">90</text><text x="362.0" y="146.82" font-size="12" fill="#4E5964" text-anchor="middle">307,617</text><text x="458.0" y="146.82" font-size="12" fill="#4E5964" text-anchor="middle">12.60 억</text><text x="557.0" y="146.82" font-size="12" fill="#4E5964" text-anchor="middle">linear</text><text x="659.0" y="146.82" font-size="12" fill="#4E5964" text-anchor="middle">0.03</text><text x="752.0" y="146.82" font-size="12" fill="#4E5964" text-anchor="middle">0.1</text><text x="837.0" y="146.82" font-size="12" fill="#4E5964" text-anchor="middle">-</text><line x1="20" y1="156" x2="880" y2="156" stroke="#CFD6D3" stroke-width="0.8"/><text x="80.0" y="173.82" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">JFT-300M</text><text x="167.0" y="173.82" font-size="12" fill="#4E5964" text-anchor="middle">18k</text><text x="227.0" y="173.82" font-size="12" fill="#4E5964" text-anchor="middle">303M</text><text x="287.0" y="173.82" font-size="12" fill="#4E5964" text-anchor="middle">7</text><text x="362.0" y="173.82" font-size="12" fill="#4E5964" text-anchor="middle">517,822</text><text x="458.0" y="173.82" font-size="12" fill="#4E5964" text-anchor="middle">21.21 억</text><text x="557.0" y="173.82" font-size="12" fill="#4E5964" text-anchor="middle">linear</text><text x="659.0" y="173.82" font-size="12" fill="#4E5964" text-anchor="middle">0.1</text><text x="752.0" y="173.82" font-size="12" fill="#4E5964" text-anchor="middle">0.0</text><text x="837.0" y="173.82" font-size="12" fill="#4E5964" text-anchor="middle">-</text><line x1="20" y1="183" x2="880" y2="183" stroke="#CFD6D3" stroke-width="0.8"/><text x="80.0" y="200.82" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">JFT-300M</text><text x="167.0" y="200.82" font-size="12" fill="#4E5964" text-anchor="middle">18k</text><text x="227.0" y="200.82" font-size="12" fill="#4E5964" text-anchor="middle">303M</text><text x="287.0" y="200.82" font-size="12" fill="#4E5964" text-anchor="middle">14</text><text x="362.0" y="200.82" font-size="12" fill="#4E5964" text-anchor="middle">1,035,645</text><text x="458.0" y="200.82" font-size="12" fill="#4E5964" text-anchor="middle">42.42 억</text><text x="557.0" y="200.82" font-size="12" fill="#4E5964" text-anchor="middle">linear</text><text x="659.0" y="200.82" font-size="12" fill="#4E5964" text-anchor="middle">0.1</text><text x="752.0" y="200.82" font-size="12" fill="#4E5964" text-anchor="middle">0.0</text><text x="837.0" y="200.82" font-size="12" fill="#4E5964" text-anchor="middle">-</text><line x1="20" y1="210" x2="880" y2="210" stroke="#CFD6D3" stroke-width="0.8"/><line x1="20" y1="48" x2="880" y2="48" stroke="#4E5964" stroke-width="1"/><text x="24" y="234" font-size="11.5" fill="#4E5964" text-anchor="start">부류 수 · 갱신 걸음 · 정칙화 셋 · 감쇠 꼴이 데이터와 함께 움직인다. 원문은 「작은 데이터의 성능을 올리려고 정칙화 셋을 최적화했다」 고 적는다(6 쪽).</text><text x="24" y="256" font-size="11.5" fill="#4E5964" text-anchor="start">둘째 실험(그림 4)은 설정을 하나로 묶었지만 부분 데이터에서 에폭을 묶었는지 걸음을 묶었는지 적혀 있지 않다.</text><text x="24" y="278" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="700">7 에폭으로 묶었다면 9M 은 15,381 걸음이고 그중 65% 가 예열 1 만 걸음이다(내 셈).</text></svg>
