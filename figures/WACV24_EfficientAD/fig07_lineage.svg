<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380"><rect width="1000" height="380" fill="#ffffff"/><text x="20.0" y="26.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 편의 자리 — 선생 · 학생 계열과 이 큰 틀의 네 칸 (이 저장소의 노트 기준)</text><text x="20.0" y="46.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">윗줄은 연도 차례이고 인용 관계가 아니다. RD 는 EfficientAD 의 참고 문헌 74 건에 없다. 점선 = EfficientAD 가 가져온 부품.</text><rect x="20.0" y="62.0" width="220.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="130.0" y="85.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Uninformed Students (CVPR 2020)</text><text x="130.0" y="104.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">선생 1 + 학생 셋, 수용장 17 · 33 · 65</text><rect x="270.0" y="62.0" width="220.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="380.0" y="85.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RD (CVPR 2022)</text><text x="380.0" y="104.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">선생 부호기 · 거꾸로 된 학생</text><rect x="520.0" y="62.0" width="220.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="630.0" y="85.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">AST (WACV 2023)</text><text x="630.0" y="104.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">가역 선생 · 비대칭 구조</text><rect x="770.0" y="62.0" width="210.0" height="54.0" rx="4" fill="#ffffff" stroke="#2f6db3"/><text x="875.0" y="85.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">EfficientAD (WACV 2024)</text><text x="875.0" y="104.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">같은 꼴 선생 · 학생 + 손실 비대칭</text><line x1="240.0" y1="89.0" x2="270.0" y2="89.0" stroke="#222222" stroke-width="1.5"/><line x1="490.0" y1="89.0" x2="520.0" y2="89.0" stroke="#222222" stroke-width="1.5"/><line x1="740.0" y1="89.0" x2="770.0" y2="89.0" stroke="#222222" stroke-width="1.5"/><rect x="20.0" y="172.0" width="220.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="130.0" y="195.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PatchCore (CVPR 2022)</text><text x="130.0" y="214.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">WRN-101 특징 -&gt; PDN 으로 증류</text><rect x="270.0" y="172.0" width="220.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="380.0" y="195.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">GCAD (IJCV 2022)</text><text x="380.0" y="214.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">선생 특징 공간의 자기부호기</text><rect x="520.0" y="172.0" width="220.0" height="54.0" rx="4" fill="#ffffff" stroke="#8a8a8a"/><text x="630.0" y="195.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM -&gt; SimpleNet</text><text x="630.0" y="214.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">가짜 이상 계열 (이 큰 틀의 1 · 3 칸)</text><line x1="130.0" y1="172.0" x2="875.0" y2="116.0" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/><line x1="380.0" y1="172.0" x2="875.0" y2="116.0" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/><text x="20.0" y="262.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">EfficientAD 는 PatchCore 가 쓰는 WRN-101 특징을 작은 PDN 에 증류해 선생으로 쓰고, 같은 꼴 학생을 「어려운 특징 손실 + 사전학습 벌점」 으로 배운다.</text><text x="20.0" y="282.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">논리 이상은 GCAD 처럼 선생 특징 공간의 자기부호기로 잡되, 자기부호기와 선생의 차가 아니라 자기부호기와 학생(덧붙인 출력 384)의 차를 쓴다.</text><text x="20.0" y="302.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RD 노트가 남긴 「같은 꼴 학생의 보통 증류」 는 표 3 의 p_hard = 0 · 표 4 의 PDN 줄이 가장 가깝다. 다만 그 줄에도 자기부호기 갈래가 들어 있다.</text><text x="20.0" y="322.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM · SimpleNet 은 이 편 표에 SimpleNet 만 들어 있다. DRAEM 대신 같은 저자의 다음 편 DSR(ECCV 2022)이 들어 있다.</text></svg>