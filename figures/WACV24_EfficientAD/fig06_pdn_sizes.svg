<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300"><rect width="1000" height="300" fill="#ffffff"/><text x="20.0" y="26.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PDN-S 의 층마다 출력 크기와 수용장 (표 6 의 보폭 · 커널 · 패딩으로 내가 셈, 256 x 256 입력)</text><text x="20.0" y="46.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">본문 「출력 하나의 수용장이 33 x 33」 과 알고리즘 1 의 「384 x 64 x 64」 는 패딩이 있을 때 맞는다. 시간을 잰 설정은 패딩을 끈 것이다.</text><rect x="30.0" y="70.0" width="145.0" height="120.0" rx="4" fill="#f6f6f6" stroke="#cccccc"/><text x="102.5" y="92.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Conv-1</text><text x="102.5" y="110.0" font-size="9.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">4x4 합성곱, 보폭 1, 패딩 3</text><text x="102.5" y="136.0" font-size="11" fill="#2f6db3" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 있음 259 x 259</text><text x="102.5" y="156.0" font-size="11" fill="#c8553d" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 없음 253 x 253</text><text x="102.5" y="178.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">수용장 4</text><rect x="190.0" y="70.0" width="145.0" height="120.0" rx="4" fill="#f6f6f6" stroke="#cccccc"/><text x="262.5" y="92.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">AvgPool-1</text><text x="262.5" y="110.0" font-size="9.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">2x2 평균 풀링, 보폭 2, 패딩 1</text><text x="262.5" y="136.0" font-size="11" fill="#2f6db3" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 있음 130 x 130</text><text x="262.5" y="156.0" font-size="11" fill="#c8553d" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 없음 126 x 126</text><text x="262.5" y="178.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">수용장 5</text><rect x="350.0" y="70.0" width="145.0" height="120.0" rx="4" fill="#f6f6f6" stroke="#cccccc"/><text x="422.5" y="92.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Conv-2</text><text x="422.5" y="110.0" font-size="9.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">4x4 합성곱, 보폭 1, 패딩 3</text><text x="422.5" y="136.0" font-size="11" fill="#2f6db3" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 있음 133 x 133</text><text x="422.5" y="156.0" font-size="11" fill="#c8553d" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 없음 123 x 123</text><text x="422.5" y="178.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">수용장 11</text><rect x="510.0" y="70.0" width="145.0" height="120.0" rx="4" fill="#f6f6f6" stroke="#cccccc"/><text x="582.5" y="92.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">AvgPool-2</text><text x="582.5" y="110.0" font-size="9.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">2x2 평균 풀링, 보폭 2, 패딩 1</text><text x="582.5" y="136.0" font-size="11" fill="#2f6db3" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 있음 67 x 67</text><text x="582.5" y="156.0" font-size="11" fill="#c8553d" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 없음 61 x 61</text><text x="582.5" y="178.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">수용장 13</text><rect x="670.0" y="70.0" width="145.0" height="120.0" rx="4" fill="#f6f6f6" stroke="#cccccc"/><text x="742.5" y="92.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Conv-3</text><text x="742.5" y="110.0" font-size="9.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">3x3 합성곱, 보폭 1, 패딩 1</text><text x="742.5" y="136.0" font-size="11" fill="#2f6db3" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 있음 67 x 67</text><text x="742.5" y="156.0" font-size="11" fill="#c8553d" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 없음 59 x 59</text><text x="742.5" y="178.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">수용장 21</text><rect x="830.0" y="70.0" width="145.0" height="120.0" rx="4" fill="#f6f6f6" stroke="#cccccc"/><text x="902.5" y="92.0" font-size="12" fill="#222222" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Conv-4</text><text x="902.5" y="110.0" font-size="9.5" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">4x4 합성곱, 보폭 1, 패딩 0</text><text x="902.5" y="136.0" font-size="11" fill="#2f6db3" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 있음 64 x 64</text><text x="902.5" y="156.0" font-size="11" fill="#c8553d" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩 없음 56 x 56</text><text x="902.5" y="178.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">수용장 33</text><text x="20.0" y="222.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">마지막 크기: 패딩 있음 64 x 64, 패딩 없음 56 x 56. 패딩을 끄면 원소 수가 76.6 % 로 준다.</text><text x="20.0" y="242.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">부록 E 는 「패딩을 끄면 PDN 통과가 80 µs 빨라지고 검출은 나빠지지 않는다」 고 적고, 표의 성능은 패딩을 끈 설정의 값이라 적는다.</text><text x="20.0" y="262.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">패딩을 끈 PDN 의 출력이 56 x 56 이면 자기부호기 출력(표 8, 64 x 64)과 크기가 다르다. 둘을 어떻게 맞췄는지 원문에 적혀 있지 않다.</text><text x="20.0" y="282.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">곱셈-덧셈으로 센 계산량의 두 배가 표 16 의 FLOPs 76 과 맞는 쪽은 패딩을 끈 쪽이다(패딩 있음 93, 없음 76, 셈 9).</text></svg>