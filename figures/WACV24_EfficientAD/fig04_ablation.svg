<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380"><rect width="1000" height="380" fill="#ffffff"/><text x="20.0" y="26.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">구성 요소의 몫: 차례로 더한 표 4 와 하나씩 뺀 표 5 (EfficientAD-S, 세 모음 평균 이미지 AU-ROC)</text><text x="20.0" y="46.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">막대 길이 = 점수 차 (점). 비교 잣대: EfficientAD-S 다섯 번 실행의 표준편차는 0.06 점이다(표 1). 두 표가 몇 번 실행인지는 적혀 있지 않다.</text><text x="260.0" y="78.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0</text><line x1="390.0" y1="84.0" x2="390.0" y2="300.0" stroke="#eeeeee" stroke-width="1"/><text x="390.0" y="78.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.5</text><line x1="520.0" y1="84.0" x2="520.0" y2="300.0" stroke="#eeeeee" stroke-width="1"/><text x="520.0" y="78.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">1.0</text><line x1="260.0" y1="84.0" x2="260.0" y2="300.0" stroke="#222222" stroke-width="1"/><text x="248.0" y="122.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">지도 정규화</text><rect x="260.0" y="102.0" width="208.0" height="18.0" rx="2" fill="#2f6db3" stroke="none"/><text x="474.0" y="116.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 4 에서 더할 때 +0.8</text><rect x="260.0" y="126.0" width="182.0" height="18.0" rx="2" fill="#d9a21b" stroke="none"/><text x="448.0" y="140.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 5 에서 뺄 때 -0.7</text><text x="248.0" y="190.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">어려운 특징 손실</text><rect x="260.0" y="170.0" width="260.0" height="18.0" rx="2" fill="#2f6db3" stroke="none"/><text x="526.0" y="184.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 4 에서 더할 때 +1.0</text><rect x="260.0" y="194.0" width="182.0" height="18.0" rx="2" fill="#d9a21b" stroke="none"/><text x="448.0" y="208.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 5 에서 뺄 때 -0.7</text><text x="248.0" y="258.0" font-size="12" fill="#222222" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">사전학습 벌점</text><rect x="260.0" y="238.0" width="104.0" height="18.0" rx="2" fill="#2f6db3" stroke="none"/><text x="370.0" y="252.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 4 에서 더할 때 +0.4</text><rect x="260.0" y="262.0" width="104.0" height="18.0" rx="2" fill="#d9a21b" stroke="none"/><text x="370.0" y="276.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 5 에서 뺄 때 -0.4</text><text x="20.0" y="332.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">더한 몫의 합 2.2 (93.2 -&gt; 95.4) 과 뺀 몫의 합 1.8 이 다르다: 셋이 서로 겹치는 몫이 있다.</text><text x="20.0" y="350.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">본문의 「어려운 특징 손실 하나로 +1.0, 표 1 의 잇단 상대 사이 차 이상」 은 더한 차례의 값이다. 뺀 값 0.7 로는 FastFlow -&gt; DSR 0.8 · PatchCore -&gt; Ens 1.0 보다 작다.</text><text x="20.0" y="368.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">자기부호기(논리 이상 갈래)를 빼거나 PDN 을 원래 WRN-101 특징으로 바꾼 줄은 두 표 어디에도 없다.</text></svg>