<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="맥락 벡터 한 걸음의 작은 예"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">한 걸음의 셈 — 점수 e -&gt; 소프트맥스 -&gt; 무게 alpha -&gt; 주석의 무게 합 c (원문 식 5 · 6, 수는 내가 고른 것)</text><text x="90" y="72" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">원문 자리 j</text><rect x="45" y="88" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="90" y="109" font-size="12.5" fill="#4E5964" text-anchor="middle">1</text><rect x="45" y="132" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="90" y="153" font-size="12.5" fill="#4E5964" text-anchor="middle">2</text><rect x="45" y="176" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="90" y="197" font-size="12.5" fill="#4E5964" text-anchor="middle">3</text><text x="235" y="72" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">점수 eij = a(s(i-1), hj)</text><rect x="190" y="88" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="235" y="109" font-size="12.5" fill="#4E5964" text-anchor="middle">1.2</text><rect x="190" y="132" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="235" y="153" font-size="12.5" fill="#4E5964" text-anchor="middle">2.5</text><rect x="190" y="176" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="235" y="197" font-size="12.5" fill="#4E5964" text-anchor="middle">0.3</text><text x="380" y="72" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">exp(eij)</text><rect x="335" y="88" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="380" y="109" font-size="12.5" fill="#4E5964" text-anchor="middle">3.320</text><rect x="335" y="132" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="380" y="153" font-size="12.5" fill="#4E5964" text-anchor="middle">12.182</text><rect x="335" y="176" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="380" y="197" font-size="12.5" fill="#4E5964" text-anchor="middle">1.350</text><text x="525" y="72" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">alpha ij = exp / 합</text><rect x="480" y="88" width="90" height="32" rx="6" fill="#FFF3C4" stroke="#CFD6D3" stroke-width="1"/><text x="525" y="109" font-size="12.5" fill="#4E5964" text-anchor="middle">0.197</text><rect x="480" y="132" width="90" height="32" rx="6" fill="#FFF3C4" stroke="#CFD6D3" stroke-width="1"/><text x="525" y="153" font-size="12.5" fill="#4E5964" text-anchor="middle">0.723</text><rect x="480" y="176" width="90" height="32" rx="6" fill="#FFF3C4" stroke="#CFD6D3" stroke-width="1"/><text x="525" y="197" font-size="12.5" fill="#4E5964" text-anchor="middle">0.080</text><text x="670" y="72" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">주석 hj (한 칸만)</text><rect x="625" y="88" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="670" y="109" font-size="12.5" fill="#4E5964" text-anchor="middle">+0.2</text><rect x="625" y="132" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="670" y="153" font-size="12.5" fill="#4E5964" text-anchor="middle">+0.9</text><rect x="625" y="176" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="670" y="197" font-size="12.5" fill="#4E5964" text-anchor="middle">-0.4</text><text x="815" y="72" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">alpha ij x hj</text><rect x="770" y="88" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="815" y="109" font-size="12.5" fill="#4E5964" text-anchor="middle">+0.039</text><rect x="770" y="132" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="815" y="153" font-size="12.5" fill="#4E5964" text-anchor="middle">+0.651</text><rect x="770" y="176" width="90" height="32" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="815" y="197" font-size="12.5" fill="#4E5964" text-anchor="middle">-0.032</text><text x="380" y="236" font-size="11" fill="#7A8590" text-anchor="middle">합 16.852</text><text x="525" y="236" font-size="11" fill="#9A7B00" text-anchor="middle">합 1.000</text><text x="815" y="236" font-size="12.5" fill="#9A7B00" text-anchor="middle" font-weight="bold">c = +0.658</text><text x="30" y="270" font-size="11" fill="#4E5964" text-anchor="start">점수가 가장 큰 자리 2 가 무게 0.723 를 받는다. 점수 차 1.3 이 무게 비 3.67 배가 된다(exp(1.3)).</text><text x="30" y="291" font-size="11" fill="#4E5964" text-anchor="start">무게는 모든 자리에 0 보다 크게 남는다 — 원문이 「부드러운(soft) 정렬」 이라 부르는 까닭.</text><text x="30" y="312" font-size="11" fill="#7A8590" text-anchor="start">실제 모델의 주석은 2,000 개의 수이고 c 도 2,000 개다. 무게 alpha 는 같은 값을 2,000 칸 모두에 곱한다.</text></svg>
