80" width="149.7" height="36" fill="#CFD6D3" stroke="#7A8590" stroke-width="0.8"/><text x="452.7951219512196" y="102" font-size="10.5" fill="#7A8590" text-anchor="middle">18.6M</text><rect x="527.6" y="80" width="87.4" height="36" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.8"/><text x="571.3536585365855" y="102" font-size="10.5" fill="#2E6B8A" text-anchor="middle">10.9M</text><rect x="615.1" y="80" width="8.0" height="36" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.8"/><rect x="623.1" y="80" width="24.2" height="36" fill="#FFF3C4" stroke="#9A7B00" stroke-width="0.8"/><rect x="647.3" y="80" width="29.1" height="36" fill="#F2DED2" stroke="#B4552B" stroke-width="0.8"/><rect x="676.4" y="80" width="120.7" height="36" fill="#CFD6D3" stroke="#7A8590" stroke-width="0.8"/><text x="736.7641463414634" y="102" font-size="10.5" fill="#7A8590" text-anchor="middle">15.0M</text><text x="803.13" y="103" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">80.40M</text><text x="20" y="234" font-size="12.5" fill="#1C232C" text-anchor="start" font-weight="bold">RNNencdec (가정 셋)</text><rect x="150.0" y="210" width="149.7" height="36" fill="#CFD6D3" stroke="#7A8590" stroke-width="0.8"/><text x="224.85365853658539" y="232" font-size="10.5" fill="#7A8590" text-anchor="middle">18.6M</text><rect x="299.7" y="210" width="39.1" height="36" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.8"/><rect x="338.8" y="210" width="149.7" height="36" fill="#CFD6D3" stroke="#7A8590" stroke-width="0.8"/><text x="413.67804878048787" y="232" font-size="10.5" fill="#7A8590" text-anchor="middle">18.6M</text><rect x="488.5" y="210" width="63.3" height="36" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.8"/><text x="520.1634146341464" y="232" font-size="10.5" fill="#2E6B8A" text-anchor="middle">7.9M</text><rect x="551.8" y="210" width="8.0" height="36" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.8"/><rect x="559.8" y="210" width="21.1" height="36" fill="#F2DED2" stroke="#B4552B" stroke-width="0.8"/><rect x="580.9" y="210" width="120.7" height="36" fill="#CFD6D3" stroke="#7A8590" stroke-width="0.8"/><text x="641.2975609756098" y="232" font-size="10.5" fill="#7A8590" text-anchor="middle">15.0M</text><text x="707.6634146341464" y="233" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">68.54M</text><rect x="150" y="300" width="14" height="14" rx="2" fill="#CFD6D3" stroke="#7A8590" stroke-width="1"/><text x="170" y="312" font-size="11" fill="#4E5964" text-anchor="start">낱말 표 둘 · 소프트맥스</text><rect x="330" y="300" width="14" height="14" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><text x="350" y="312" font-size="11" fill="#4E5964" text-anchor="start">RNN · 첫 상태</text><rect x="510" y="300" width="14" height="14" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="530" y="312" font-size="11" fill="#4E5964" text-anchor="start">정렬 모델</text><rect x="690" y="300" width="14" height="14" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="710" y="312" font-size="11" fill="#4E5964" text-anchor="start">깊은 출력(maxout)</text><text x="20" y="345" font-size="11" fill="#4E5964" text-anchor="start">RNNsearch 80.40M 가운데 64.9% 가 낱말 표 둘과 소프트맥스다.</text><text x="20" y="366" font-size="11" fill="#4E5964" text-anchor="start">RNNencdec 은 원문이 「은닉 1,000」 밖에 적지 않아, 같은 m · l 을 쓰고 c 를 인코더 끝 상태(1,000)로 둔다는 가정으로 셌다.</text><text x="20" y="387" font-size="11" fill="#7A8590" text-anchor="start">두 모델의 차 11.86M (RNNsearch 가 17.3% 크다) = 뒤 RNN 4.86M + 정렬 모델 3.00M + 디코더 C 의 늘어난 몫 3.00M + Co 의 늘어난 몫 1.00M.</text><text x="20" y="408" font-size="11" fill="#7A8590" text-anchor="start">원문은 두 모델의 파라미터 수를 적지 않는다.</text></svg>
