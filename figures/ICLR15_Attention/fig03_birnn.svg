<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="양방향 RNN 주석"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">주석 hj — 앞에서 읽은 상태와 뒤에서 읽은 상태를 잇는다 (원문 3.2절 · 식 7)</text><rect x="60" y="90" width="90" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="105" y="112" font-size="11.5" fill="#2E6B8A" text-anchor="middle">앞 h1</text><rect x="60" y="140" width="90" height="34" rx="6" fill="#EADCF0" stroke="#8E44AD" stroke-width="1.2"/><text x="105" y="162" font-size="11.5" fill="#8E44AD" text-anchor="middle">뒤 h1</text><text x="105" y="205" font-size="12" fill="#4E5964" text-anchor="middle">The</text><rect x="70" y="230" width="70" height="30" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="105" y="250" font-size="12" fill="#9A7B00" text-anchor="middle">h1</text><rect x="220" y="90" width="90" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="265" y="112" font-size="11.5" fill="#2E6B8A" text-anchor="middle">앞 h2</text><rect x="220" y="140" width="90" height="34" rx="6" fill="#EADCF0" stroke="#8E44AD" stroke-width="1.2"/><text x="265" y="162" font-size="11.5" fill="#8E44AD" text-anchor="middle">뒤 h2</text><text x="265" y="205" font-size="12" fill="#4E5964" text-anchor="middle">agreement</text><rect x="230" y="230" width="70" height="30" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="265" y="250" font-size="12" fill="#9A7B00" text-anchor="middle">h2</text><line x1="150" y1="107" x2="220" y2="107" stroke="#2E6B8A" stroke-width="1.2" marker-end="url(#af)"/><line x1="220" y1="157" x2="150" y2="157" stroke="#8E44AD" stroke-width="1.2" marker-end="url(#ai)"/><rect x="380" y="90" width="90" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="425" y="112" font-size="11.5" fill="#2E6B8A" text-anchor="middle">앞 h3</text><rect x="380" y="140" width="90" height="34" rx="6" fill="#EADCF0" stroke="#8E44AD" stroke-width="1.2"/><text x="425" y="162" font-size="11.5" fill="#8E44AD" text-anchor="middle">뒤 h3</text><text x="425" y="205" font-size="12" fill="#4E5964" text-anchor="middle">on</text><rect x="390" y="230" width="70" height="30" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="425" y="250" font-size="12" fill="#9A7B00" text-anchor="middle">h3</text><line x1="310" y1="107" x2="380" y2="107" stroke="#2E6B8A" stroke-width="1.2" marker-end="url(#af)"/><line x1="380" y1="157" x2="310" y2="157" stroke="#8E44AD" stroke-width="1.2" marker-end="url(#ai)"/><rect x="540" y="90" width="90" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="585" y="112" font-size="11.5" fill="#2E6B8A" text-anchor="middle">앞 h4</text><rect x="540" y="140" width="90" height="34" rx="6" fill="#EADCF0" stroke="#8E44AD" stroke-width="1.2"/><text x="585" y="162" font-size="11.5" fill="#8E44AD" text-anchor="middle">뒤 h4</text><text x="585" y="205" font-size="12" fill="#4E5964" text-anchor="middle">the</text><rect x="550" y="230" width="70" height="30" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="585" y="250" font-size="12" fill="#9A7B00" text-anchor="middle">h4</text><line x1="470" y1="107" x2="540" y2="107" stroke="#2E6B8A" stroke-width="1.2" marker-end="url(#af)"/><line x1="540" y1="157" x2="470" y2="157" stroke="#8E44AD" stroke-width="1.2" marker-end="url(#ai)"/><rect x="700" y="90" width="90" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="745" y="112" font-size="11.5" fill="#2E6B8A" text-anchor="middle">앞 h5</text><rect x="700" y="140" width="90" height="34" rx="6" fill="#EADCF0" stroke="#8E44AD" stroke-width="1.2"/><text x="745" y="162" font-size="11.5" fill="#8E44AD" text-anchor="middle">뒤 h5</text><text x="745" y="205" font-size="12" fill="#4E5964" text-anchor="middle">European</text><rect x="710" y="230" width="70" height="30" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="745" y="250" font-size="12" fill="#9A7B00" text-anchor="middle">h5</text><line x1="630" y1="107" x2="700" y2="107" stroke="#2E6B8A" stroke-width="1.2" marker-end="url(#af)"/><line x1="700" y1="157" x2="630" y2="157" stroke="#8E44AD" stroke-width="1.2" marker-end="url(#ai)"/><text x="60" y="290" font-size="11" fill="#4E5964" text-anchor="start">앞 상태 1,000 + 뒤 상태 1,000 = 주석 2,000 개의 수. 낱말 벡터 표 E 는 두 방향이 함께 쓰고, 무게 행렬은 따로다(부록 A.2.1).</text><text x="60" y="310" font-size="11" fill="#7A8590" text-anchor="start">원문의 주장: 「RNN 은 최근 입력을 더 잘 나타내므로 hj 가 xj 주변에 모인다」 — 이 편 안에서 잰 것은 없다.</text></svg>
