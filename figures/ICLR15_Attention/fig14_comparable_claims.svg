<svg xmlns="http://www.w3.org/2000/svg" width="920" height="430" viewBox="0 0 920 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="견줄 만하다는 말의 세기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">같은 비교를 두고 한 말의 세기 — RNNsearch 대 기준 구문 기반 시스템(Moses)</text><rect x="20" y="62" width="70" height="30" rx="4" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.2"/><text x="55" y="82" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="bold">잰 것</text><text x="100" y="82" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">표 1 전체 열</text><text x="215" y="82" font-size="11" fill="#4E5964" text-anchor="start">RNNsearch-50* 28.45 대 Moses 33.30 (-4.85). RNNsearch-50 26.75 (-6.55)</text><rect x="20" y="108" width="70" height="30" rx="4" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.2"/><text x="55" y="128" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="bold">잰 것</text><text x="100" y="128" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">표 1 UNK 없는 열</text><text x="215" y="128" font-size="11" fill="#4E5964" text-anchor="start">RNNsearch-50* 36.15 대 35.63 (+0.52). RNNsearch-50 34.16 (-1.47)</text><rect x="20" y="154" width="70" height="30" rx="4" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.2"/><text x="55" y="174" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="bold">말</text><text x="100" y="174" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">요약</text><text x="215" y="174" font-size="11" fill="#4E5964" text-anchor="start">「the existing state-of-the-art phrase-based system 과 견줄 만한(comparable) 번역 성능」</text><rect x="20" y="200" width="70" height="30" rx="4" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.2"/><text x="55" y="220" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="bold">말</text><text x="100" y="220" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">1절</text><text x="215" y="220" font-size="11" fill="#4E5964" text-anchor="start">「단일 모델로 기존 구문 기반 시스템과 견줄 만하거나 가까운(comparable, or close) 성능」</text><rect x="20" y="246" width="70" height="30" rx="4" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.2"/><text x="55" y="266" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="bold">말</text><text x="100" y="266" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">5.1절</text><text x="215" y="266" font-size="11" fill="#4E5964" text-anchor="start">「알려진 낱말로 된 문장만 보면 Moses 만큼 높다(as high as)」 — 50* 만 넘고 50 은 1.47 아래</text><rect x="20" y="292" width="70" height="30" rx="4" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.2"/><text x="55" y="312" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="bold">말</text><text x="100" y="312" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">7절</text><text x="215" y="312" font-size="11" fill="#4E5964" text-anchor="start">「기존 구문 기반 통계 번역과 견줄 만한 성능을 냈다 ... 놀라운(striking) 결과」</text><rect x="20" y="338" width="70" height="30" rx="4" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.2"/><text x="55" y="358" font-size="11.5" fill="#7A8590" text-anchor="middle" font-weight="bold">조건</text><text x="100" y="358" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">각주 1 · 5.1절</text><text x="215" y="358" font-size="11" fill="#4E5964" text-anchor="start">「state-of-the-art」 = 신경망 부품이 없는 구문 기반 시스템. Moses 는 단일어 418M 낱말을 더 쓴다</text><text x="20" y="400" font-size="11" fill="#4E5964" text-anchor="start">「견줄 만하다」 를 받치는 수는 UNK 없는 열의 RNNsearch-50* 한 줄이다. 그 열은 모델의 어휘 30,000 으로 문장을 고른 부분집합이고, 문장 수와 흩어짐이 없다.</text></svg>
