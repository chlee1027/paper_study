580" y="120" width="64" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="612" y="143" font-size="12" fill="#B4552B" text-anchor="middle">s(i-1)</text><rect x="710" y="120" width="56" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="738" y="143" font-size="12" fill="#B4552B" text-anchor="middle">si</text><line x1="644" y1="138" x2="710" y2="138" stroke="#B4552B" stroke-width="1.2" marker-end="url(#ar)"/><path d="M670,216 C675,190 715,175 730,158" fill="none" stroke="#9A7B00" stroke-width="1.5" marker-end="url(#ac)"/><path d="M612,156 C600,200 630,230 655,232" fill="none" stroke="#4E5964" stroke-width="1.0" stroke-dasharray="3 3" marker-end="url(#ai)"/><text x="580" y="196" font-size="10" fill="#7A8590" text-anchor="end">점수 eij 에</text><text x="580" y="210" font-size="10" fill="#7A8590" text-anchor="end">s(i-1) 이 들어간다</text><text x="738" y="104" font-size="12" fill="#4E5964" text-anchor="middle">yi</text><text x="490" y="400" font-size="11.5" fill="#4E5964" text-anchor="start">ci 는 원문 길이 T 만큼의 주석에서 다시 고른다</text><text x="490" y="419" font-size="11.5" fill="#7A8590" text-anchor="start">(주석 하나 2,000 개의 수, 무게 a 는 합이 1)</text></svg>
