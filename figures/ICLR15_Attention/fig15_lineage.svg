<svg xmlns="http://www.w3.org/2000/svg" width="920" height="400" viewBox="0 0 920 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 고정 길이 벡터 하나를 원문 자리마다의 주석과 그 무게 합으로 바꾼 자리</text><rect x="30" y="70" width="260" height="72" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.3"/><text x="42" y="92" font-size="13" fill="#4E5964" text-anchor="start" font-weight="bold">Cho 외</text><text x="42" y="112" font-size="10.5" fill="#7A8590" text-anchor="start">EMNLP 2014</text><text x="42" y="131" font-size="10.5" fill="#4E5964" text-anchor="start">RNN 인코더-디코더 · 게이트 둘 유닛</text><rect x="30" y="170" width="260" height="72" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.3"/><text x="42" y="192" font-size="13" fill="#4E5964" text-anchor="start" font-weight="bold">Sutskever 외</text><text x="42" y="212" font-size="10.5" fill="#7A8590" text-anchor="start">NIPS 2014</text><text x="42" y="231" font-size="10.5" fill="#4E5964" text-anchor="start">깊은 LSTM 둘 · 입력 뒤집기 · 직접 번역</text><rect x="30" y="270" width="260" height="72" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.3"/><text x="42" y="292" font-size="13" fill="#4E5964" text-anchor="start" font-weight="bold">Graves</text><text x="42" y="312" font-size="10.5" fill="#7A8590" text-anchor="start">arXiv 2013</text><text x="42" y="331" font-size="10.5" fill="#4E5964" text-anchor="start">필기 생성: 가우스 창, 한 방향으로만 움직임</text><rect x="330" y="170" width="260" height="72" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.3"/><text x="342" y="192" font-size="13" fill="#1E8449" text-anchor="start" font-weight="bold">이 편</text><text x="342" y="212" font-size="10.5" fill="#7A8590" text-anchor="start">Bahdanau · Cho · Bengio, ICLR 2015</text><text x="342" y="231" font-size="10.5" fill="#4E5964" text-anchor="start">낱말마다 맥락 벡터 ci = 주석의 무게 합</text><rect x="630" y="120" width="260" height="72" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="642" y="142" font-size="13" fill="#2E6B8A" text-anchor="start" font-weight="bold">Vaswani 외</text><text x="642" y="162" font-size="10.5" fill="#7A8590" text-anchor="start">NIPS 2017</text><text x="642" y="181" font-size="10.5" fill="#4E5964" text-anchor="start">되먹임 없이 주의(attention) 만</text><rect x="630" y="240" width="260" height="72" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.3"/><text x="642" y="262" font-size="13" fill="#4E5964" text-anchor="start" font-weight="bold">Luong 외 · Jean 외</text><text x="642" y="282" font-size="10.5" fill="#7A8590" text-anchor="start">2015</text><text x="642" y="301" font-size="10.5" fill="#4E5964" text-anchor="start">주의 꼴 비교 · 큰 어휘 (원문 뒤의 편)</text><line x1="290" y1="106" x2="330" y2="196" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="290" y1="206" x2="330" y2="206" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="290" y1="306" x2="330" y2="216" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="590" y1="196" x2="630" y2="156" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><line x1="590" y1="216" x2="630" y2="266" stroke="#4E5964" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#ai)"/><text x="612" y="150" font-size="10" fill="#2E6B8A" text-anchor="end">로드맵 다음 칸</text><text x="20" y="362" font-size="10.5" fill="#7A8590" text-anchor="start">화살표는 원문 2 · 6.1절의 인용을 따른다(Graves 2013 은 원문이 가장 가까운 편으로 꼽은 것). 오른쪽 아래 상자는 이 편 뒤에 나와 원문 참고 문헌에 없다.</text></svg>
