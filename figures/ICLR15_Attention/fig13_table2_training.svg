stroke-width="1.2"/><circle cx="281.8181818181815" cy="256" r="5" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.2"/><text x="281.8181818181815" y="276" font-size="10" fill="#1E8449" text-anchor="middle">10.47</text><rect x="560" y="244" width="68.1" height="24" fill="#D6EEDD" stroke="#1E8449"/><text x="634.1081081081081" y="261" font-size="10" fill="#4E5964" text-anchor="start">2,595 / 시간 · 111 시간</text><text x="120" y="314" font-size="11.5" fill="#1E8449" text-anchor="end" font-weight="bold">RNNsearch-50*</text><text x="120" y="330" font-size="9" fill="#7A8590" text-anchor="end">Quadro K-6000</text><line x1="309.90099009901024" y1="308" x2="373.93939393939394" y2="308" stroke="#1E8449" stroke-width="1.2"/><circle cx="341.6" cy="308" r="5" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.2"/><text x="341.6" y="328" font-size="10" fill="#1E8449" text-anchor="middle">10.67</text><rect x="560" y="296" width="69.5" height="24" fill="#D6EEDD" stroke="#1E8449"/><text x="635.4791666666666" y="313" font-size="10" fill="#4E5964" text-anchor="start">2,647 / 시간 · 252 시간</text><text x="140.0" y="356" font-size="9.5" fill="#7A8590" text-anchor="middle">10.0</text><text x="290.0" y="356" font-size="9.5" fill="#7A8590" text-anchor="middle">10.5</text><text x="440.0" y="356" font-size="9.5" fill="#7A8590" text-anchor="middle">11.0</text><text x="20" y="380" font-size="10.5" fill="#4E5964" text-anchor="start">-30 과 -50 의 바퀴당 문장 수가 10.47M ~ 10.67M 로 겹친다. 「30 낱말 이하 문장으로 학습」 이 긴 문장을 빼는 것이라면 -30 쪽 바퀴가 그만큼 작아야 한다.</text><text x="20" y="400" font-size="10.5" fill="#4E5964" text-anchor="start">같은 GPU 에서 RNNsearch 의 시간당 갱신이 RNNencdec 의 0.47 ~ 0.54 배다.</text></svg>
