<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="그림 2 남는 몫"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">그림 2 — 곡선마다 가로 59 의 값이 자기 꼭대기의 몇 % 인가 (내가 센 것)</text><text x="150" y="92" font-size="12" fill="#1E8449" text-anchor="end" font-weight="bold">RNNsearch-50</text><rect x="165" y="70" width="400" height="32" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><rect x="165" y="70" width="380.7" height="32" fill="#D6EEDD" stroke="#1E8449"/><text x="575" y="91" font-size="10.5" fill="#4E5964" text-anchor="start">95.2%  (꼭대기 27.77 가로 29 -&gt; 가로 59 26.43, 1.34 내려감)</text><text x="150" y="148" font-size="12" fill="#1E8449" text-anchor="end" font-weight="bold">RNNsearch-30</text><rect x="165" y="126" width="400" height="32" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><rect x="165" y="126" width="113.1" height="32" fill="#D6EEDD" stroke="#1E8449"/><text x="575" y="147" font-size="10.5" fill="#4E5964" text-anchor="start">28.3%  (꼭대기 26.99 가로 20 -&gt; 가로 59 7.63, 19.36 내려감)</text><text x="150" y="204" font-size="12" fill="#2E6B8A" text-anchor="end" font-weight="bold">RNNencdec-50</text><rect x="165" y="182" width="400" height="32" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><rect x="165" y="182" width="115.2" height="32" fill="#D8E7EE" stroke="#2E6B8A"/><text x="575" y="203" font-size="10.5" fill="#4E5964" text-anchor="start">28.8%  (꼭대기 22.48 가로 20 -&gt; 가로 59 6.47, 16.00 내려감)</text><text x="150" y="260" font-size="12" fill="#2E6B8A" text-anchor="end" font-weight="bold">RNNencdec-30</text><rect x="165" y="238" width="400" height="32" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><rect x="165" y="238" width="28.6" height="32" fill="#D8E7EE" stroke="#2E6B8A"/><text x="575" y="259" font-size="10.5" fill="#4E5964" text-anchor="start">7.2%  (꼭대기 21.90 가로 14 -&gt; 가로 59 1.57, 20.33 내려감)</text><text x="20" y="304" font-size="10.5" fill="#4E5964" text-anchor="start">원문 5.1절: 「RNNsearch-30 과 RNNsearch-50 둘 다 길이에 더 강하다(more robust)」.</text><text x="20" y="324" font-size="10.5" fill="#4E5964" text-anchor="start">RNNsearch-30 의 남는 몫 28.3% 는 같은 길이로 배운 RNNencdec-30(7.2%)보다 크지만 RNNencdec-50(28.8%)과 0.5 백분율 점 차다.</text><text x="20" y="344" font-size="10.5" fill="#7A8590" text-anchor="start">내려간 폭으로는 RNNsearch-30 (19.36) 이 RNNencdec-50 (16.00) 보다 크다. 「더 강하다」 가 어느 모델과 견준 말인지 원문은 가르지 않는다.</text></svg>
