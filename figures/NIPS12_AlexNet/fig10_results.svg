<svg xmlns="http://www.w3.org/2000/svg" width="950" height="384" viewBox="0 0 950 384" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="ILSVRC-2010 에서 37.5 / 17.0, ILSVRC-2012 에서 top-5 15.3"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="450" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">결과 — 표 1(ILSVRC-2010)과 표 2(ILSVRC-2012)</text><text x="230" y="58" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">표 1 · ILSVRC-2010 시험 집합</text><text x="242" y="90.96" font-size="11.5" fill="#4E5964" text-anchor="end">희소 부호화 여섯 평균</text><rect x="250" y="78" width="178.98000000000002" height="18" rx="3" fill="#E8E8E8" stroke="#7A8590" stroke-width="1.0"/><text x="435.98" y="90.96" font-size="11.5" fill="#4E5964" text-anchor="start">47.1 %</text><text x="242" y="110.96" font-size="11.5" fill="#4E5964" text-anchor="end"></text><rect x="250" y="98" width="107.16" height="18" rx="3" fill="#E8E8E8" stroke="#7A8590" stroke-width="1.0"/><text x="364.15999999999997" y="110.96" font-size="11.5" fill="#4E5964" text-anchor="start">28.2 %</text><text x="242" y="136.96" font-size="11.5" fill="#4E5964" text-anchor="end">SIFT + 피셔 벡터 둘 평균</text><rect x="250" y="124" width="173.66" height="18" rx="3" fill="#E8E8E8" stroke="#7A8590" stroke-width="1.0"/><text x="430.65999999999997" y="136.96" font-size="11.5" fill="#4E5964" text-anchor="start">45.7 %</text><text x="242" y="156.96" font-size="11.5" fill="#4E5964" text-anchor="end"></text><rect x="250" y="144" width="97.66" height="18" rx="3" fill="#E8E8E8" stroke="#7A8590" stroke-width="1.0"/><text x="354.65999999999997" y="156.96" font-size="11.5" fill="#4E5964" text-anchor="start">25.7 %</text><text x="242" y="182.96" font-size="11.5" fill="#4E5964" text-anchor="end">이 논문의 CNN</text><rect x="250" y="170" width="142.5" height="18" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="399.5" y="182.96" font-size="11.5" fill="#4E5964" text-anchor="start">37.5 %</text><text x="242" y="202.96" font-size="11.5" fill="#4E5964" text-anchor="end"></text><rect x="250" y="190" width="64.60000000000001" height="18" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="321.6" y="202.96" font-size="11.5" fill="#4E5964" text-anchor="start">17.0 %</text><text x="250" y="218" font-size="10.5" fill="#7A8590" text-anchor="start">위 막대가 top-1, 아래가 top-5</text><text x="700" y="58" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">표 2 · ILSVRC-2012 (top-5)</text><text x="692" y="94.4" font-size="11.5" fill="#4E5964" text-anchor="end">SIFT + FV (2등, 시험)</text><rect x="700" y="80" width="168.42857142857142" height="20" rx="3" fill="#E8E8E8" stroke="#7A8590" stroke-width="1.0"/><text x="875.4285714285714" y="94.4" font-size="11.5" fill="#4E5964" text-anchor="start">26.2 %</text><text x="692" y="124.4" font-size="11.5" fill="#4E5964" text-anchor="end">CNN 하나 (검증)</text><rect x="700" y="110" width="117.0" height="20" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="824.0" y="124.4" font-size="11.5" fill="#4E5964" text-anchor="start">18.2 %</text><text x="692" y="154.4" font-size="11.5" fill="#4E5964" text-anchor="end">CNN 다섯 평균</text><rect x="700" y="140" width="105.42857142857142" height="20" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="812.4285714285714" y="154.4" font-size="11.5" fill="#4E5964" text-anchor="start">16.4 %</text><text x="692" y="184.4" font-size="11.5" fill="#4E5964" text-anchor="end">CNN 하나* (검증)</text><rect x="700" y="170" width="106.71428571428571" height="20" rx="3" fill="#E4EFE4" stroke="#1E8449" stroke-width="1.0"/><text x="813.7142857142857" y="184.4" font-size="11.5" fill="#4E5964" text-anchor="start">16.6 %</text><text x="692" y="214.4" font-size="11.5" fill="#4E5964" text-anchor="end">CNN 일곱* (시험)</text><rect x="700" y="200" width="98.35714285714286" height="20" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="805.3571428571429" y="214.4" font-size="11.5" fill="#4E5964" text-anchor="start">15.3 %</text><text x="700" y="238" font-size="10.5" fill="#7A8590" text-anchor="start">* 는 ImageNet 2011 가을 판 전체(1,500만 장 · 22,000 부류)로</text><text x="700" y="254" font-size="10.5" fill="#7A8590" text-anchor="start">   먼저 배운 뒤 미세조정한 것이고, 여섯째 합성곱 층이 하나 더 있다</text><rect x="30" y="272" width="900" height="96" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="480" y="296" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">표 1 의 17.0% 와 표 2 의 15.3% 를 「좋아졌다」로 이어 읽으면 안 된다 — 데이터가 다르다.</text><text x="480" y="320" font-size="11.3" fill="#4E5964" text-anchor="middle">2010 은 시험 라벨이 공개된 유일한 판이고, 2012 는 시험 라벨이 없어 검증 값을 섞어 적는다(둘의 차이가 0.1% 를 넘은 적이 없다고 적는다).</text><text x="480" y="346" font-size="11.3" fill="#4E5964" text-anchor="middle">ImageNet 2009 가을 판(10,184 부류 · 890만 장)에서는 top-1 67.4% · top-5 40.9% 이고 그전 최고가 78.1% · 60.9% 였다.</text></svg>
