<svg xmlns="http://www.w3.org/2000/svg" width="876" height="398" viewBox="0 0 876 398" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="논문이 적은 한계 일곱과 CIFAR-10 에서 잴 다섯 자리"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="440" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">이 논문이 스스로 적은 한계와, 내가 재 보려는 자리</text><rect x="24" y="48" width="426" height="330" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="237" y="72" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="600">논문이 적은 한계</text><text x="46" y="100" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">1.</text><text x="70" y="100" font-size="11.5" fill="#4E5964" text-anchor="start">망 크기가 GPU 메모리와 학습 시간에 묶여 있다</text><text x="46" y="136" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">2.</text><text x="70" y="136" font-size="11.5" fill="#4E5964" text-anchor="start">비지도 사전학습을 쓰지 않았다(도움될 것으로 본다)</text><text x="46" y="172" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">3.</text><text x="70" y="172" font-size="11.5" fill="#4E5964" text-anchor="start">사람의 시각 경로에 견주면 자릿수가 여러 번 남았다</text><text x="46" y="208" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">4.</text><text x="70" y="208" font-size="11.5" fill="#4E5964" text-anchor="start">정지 영상만 다룬다 — 영상으로 가고 싶다</text><text x="46" y="244" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">5.</text><text x="70" y="244" font-size="11.5" fill="#4E5964" text-anchor="start">두 GPU 비교가 1-GPU 쪽에 유리하게 치우쳐 있다</text><text x="46" y="280" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">6.</text><text x="70" y="280" font-size="11.5" fill="#4E5964" text-anchor="start">데이터 늘리기 2048 배는 서로 크게 의존한다</text><text x="46" y="316" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">7.</text><text x="70" y="316" font-size="11.5" fill="#4E5964" text-anchor="start">CIFAR-10 쪽 망은 자리가 모자라 적지 못했다</text><text x="237" y="362" font-size="10.8" fill="#7A8590" text-anchor="middle">다섯째와 여섯째는 저자들이 직접 적어 둔 치우침이다</text><rect x="462" y="48" width="384" height="330" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="654" y="72" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">CIFAR-10 에서 잴 것 다섯</text><rect x="482" y="88" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="114" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">A</text><text x="522" y="114" font-size="11.2" fill="#4E5964" text-anchor="start">ReLU 가 tanh 보다 몇 배 빠른가</text><rect x="482" y="142" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="168" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">B</text><text x="522" y="168" font-size="11.2" fill="#4E5964" text-anchor="start">LRN 을 넣고 빼면 얼마인가 (13% 대 11%)</text><rect x="482" y="196" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="222" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">C</text><text x="522" y="222" font-size="11.2" fill="#4E5964" text-anchor="start">겹치는 풀링 대 안 겹치는 풀링</text><rect x="482" y="250" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="276" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">D</text><text x="522" y="276" font-size="11.2" fill="#4E5964" text-anchor="start">드롭아웃을 빼면 얼마인가 (논문에 없다)</text><rect x="482" y="304" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="330" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">E</text><text x="522" y="330" font-size="11.2" fill="#4E5964" text-anchor="start">넷을 하나씩 켜고 끈 값을 한 표에</text><text x="654" y="368" font-size="10.8" fill="#7A8590" text-anchor="middle">A 와 B 는 논문 자신이 CIFAR-10 에서 확인한 자리다</text></svg>
