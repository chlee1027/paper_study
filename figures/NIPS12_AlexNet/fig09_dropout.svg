l="#F6F7F5" stroke="#4E5964" stroke-width="1.1"/><circle cx="504.0" cy="212" r="11" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.1"/><circle cx="538.0" cy="212" r="11" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.1"/><text x="470" y="240" font-size="11.5" fill="#4E5964" text-anchor="middle">전부 쓰되 출력에 0.5 를 곱한다</text><rect x="620" y="52" width="220" height="208" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="730" y="76" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">논문이 적는 값</text><rect x="640" y="92" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.2"/><text x="730" y="114" font-size="11" fill="#4E5964" text-anchor="middle">수렴까지의 반복 수</text><text x="730" y="134" font-size="12" fill="#1E8449" text-anchor="middle" font-weight="600">두 배 (논문의 말: roughly)</text><rect x="640" y="156" width="180" height="52" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2"/><text x="730" y="178" font-size="11" fill="#4E5964" text-anchor="middle">빼면 얼마인가</text><text x="730" y="198" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="600">숫자가 없다</text><text x="730" y="232" font-size="10.8" fill="#7A8590" text-anchor="middle">「없으면 과적합이 상당했다」</text><text x="730" y="248" font-size="10.8" fill="#7A8590" text-anchor="middle">까지만 적혀 있다</text><rect x="28" y="274" width="812" height="66" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="434" y="298" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">노리는 것은 유닛끼리의 복잡한 공적응을 깨는 것이다 — 특정한 다른 유닛이 있다고 기대할 수 없게 만든다.</text><text x="434" y="322" font-size="11.5" fill="#4E5964" text-anchor="middle">모델 여럿을 묶는 효과를 학습 비용 두 배로 얻는 방법이라고 적는다. 시험할 때의 0.5 곱하기는 기하 평균의 근사다.</text></svg>
