<svg xmlns="http://www.w3.org/2000/svg" width="866" height="472" viewBox="0 0 866 472" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="층별 파라미터 막대. fc6 하나가 전체의 62%"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="430" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">파라미터 6천만의 96%% 가 완전연결 층 셋에 있다</text><text x="172" y="75.84" font-size="12" fill="#4E5964" text-anchor="end">conv1</text><rect x="180" y="60" width="2.0" height="22" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="189.0" y="75.84" font-size="12" fill="#4E5964" text-anchor="start">34,944</text><text x="830" y="76" font-size="11.5" fill="#4E5964" text-anchor="end">0.1%</text><text x="172" y="109.84" font-size="12" fill="#4E5964" text-anchor="end">conv2</text><rect x="180" y="94" width="3.827641857437344" height="22" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="190.82764185743736" y="109.84" font-size="12" fill="#4E5964" text-anchor="start">307,456</text><text x="830" y="110" font-size="11.5" fill="#4E5964" text-anchor="end">0.5%</text><text x="172" y="143.84" font-size="12" fill="#4E5964" text-anchor="end">conv3</text><rect x="180" y="128" width="11.019210426386026" height="22" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="198.01921042638602" y="143.84" font-size="12" fill="#4E5964" text-anchor="start">885,120</text><text x="830" y="144" font-size="11.5" fill="#4E5964" text-anchor="end">1.5%</text><text x="172" y="177.84" font-size="12" fill="#4E5964" text-anchor="end">conv4</text><rect x="180" y="162" width="8.265602961918194" height="22" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="195.2656029619182" y="177.84" font-size="12" fill="#4E5964" text-anchor="start">663,936</text><text x="830" y="178" font-size="11.5" fill="#4E5964" text-anchor="end">1.1%</text><text x="172" y="211.84" font-size="12" fill="#4E5964" text-anchor="end">conv5</text><rect x="180" y="196" width="5.51040197461213" height="22" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="192.51040197461214" y="211.84" font-size="12" fill="#4E5964" text-anchor="start">442,624</text><text x="830" y="212" font-size="11.5" fill="#4E5964" text-anchor="end">0.7%</text><text x="172" y="245.84" font-size="12" fill="#4E5964" text-anchor="end">fc6</text><rect x="180" y="230" width="470.0" height="22" rx="3" fill="#E4EFE4" stroke="#1E8449" stroke-width="1.0"/><text x="657.0" y="245.84" font-size="12" fill="#4E5964" text-anchor="start">37,752,832</text><text x="830" y="246" font-size="11.5" fill="#4E5964" text-anchor="end">61.9%</text><text x="172" y="279.84" font-size="12" fill="#4E5964" text-anchor="end">fc7</text><rect x="180" y="264" width="208.91721818379082" height="22" rx="3" fill="#E4EFE4" stroke="#1E8449" stroke-width="1.0"/><text x="395.91721818379085" y="279.84" font-size="12" fill="#4E5964" text-anchor="start">16,781,312</text><text x="830" y="280" font-size="11.5" fill="#4E5964" text-anchor="end">27.5%</text><text x="172" y="313.84" font-size="12" fill="#4E5964" text-anchor="end">fc8</text><rect x="180" y="298" width="51.00518022065206" height="22" rx="3" fill="#E4EFE4" stroke="#1E8449" stroke-width="1.0"/><text x="238.00518022065205" y="313.84" font-size="12" fill="#4E5964" text-anchor="start">4,097,000</text><text x="830" y="314" font-size="11.5" fill="#4E5964" text-anchor="end">6.7%</text><text x="830" y="46" font-size="10.5" fill="#7A8590" text-anchor="end">전체 대비</text><rect x="30" y="340" width="810" height="108" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="435" y="366" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">합계 60,965,224 — 초록의 「6천만」과 맞는다. (층별로 더한 것은 내가 한 셈이다)</text><text x="435" y="390" font-size="11.5" fill="#4E5964" text-anchor="middle">합성곱 다섯을 다 더해도 2,334,080 로 전체의 3.8% 다. 그런데 논문은 </text><text x="435" y="410" font-size="11.5" fill="#4E5964" text-anchor="middle">「합성곱 층 하나를 빼면 top-1 이 약 2% 나빠진다」고 적는다 — 그 층 하나가 파라미터의 1% 도 안 되는데도.</text><text x="435" y="434" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="600">드롭아웃을 fc6 · fc7 에만 건 이유도 이 그림에서 읽힌다.</text></svg>
