<svg xmlns="http://www.w3.org/2000/svg" width="866" height="396" viewBox="0 0 866 396" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="깊이가 중요하다는 결론과 그 근거에 없는 것들, 그리고 GPU 별 필터 특화"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="430" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">「깊이가 실제로 중요하다」가 얹혀 있는 숫자</text><rect x="24" y="52" width="400" height="230" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="224" y="76" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">논문이 두 번 적는 말</text><rect x="48" y="94" width="352" height="56" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.2"/><text x="224" y="116" font-size="11.5" fill="#4E5964" text-anchor="middle">합성곱 층을 아무거나 하나 빼면</text><text x="224" y="138" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">top-1 이 약 2% 나빠진다</text><rect x="48" y="162" width="352" height="56" rx="6" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.2"/><text x="224" y="184" font-size="11.5" fill="#4E5964" text-anchor="middle">그 층 하나가 모델 파라미터의</text><text x="224" y="206" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="600">1% 도 안 되는데도 그렇다</text><text x="224" y="244" font-size="11.5" fill="#4E5964" text-anchor="middle">합성곱 다섯을 다 더해도 전체의 3.8% 다</text><text x="224" y="266" font-size="10.5" fill="#7A8590" text-anchor="middle">(이 그림에서 센 값이다)</text><rect x="440" y="52" width="400" height="230" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="640" y="76" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">그런데 없는 것</text><text x="470" y="108" font-size="12" fill="#4E5964" text-anchor="start">· 어느 층을 뺐는지</text><text x="470" y="138" font-size="12" fill="#4E5964" text-anchor="start">· 몇 번 돌렸는지</text><text x="470" y="168" font-size="12" fill="#4E5964" text-anchor="start">· 파라미터 수를 맞췄는지</text><text x="470" y="198" font-size="12" fill="#4E5964" text-anchor="start">· 층을 더 뺐을 때의 곡선</text><rect x="460" y="228" width="360" height="40" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2"/><text x="640" y="254" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">표가 없고 숫자 한 개뿐이다</text><rect x="28" y="296" width="812" height="84" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="434" y="320" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">그림 3 의 관찰 하나 — GPU 1 쪽 커널은 대체로 색과 무관하고 GPU 2 쪽은 대체로 색에 특화된다.</text><text x="434" y="344" font-size="11.5" fill="#4E5964" text-anchor="middle">이 갈림이 실행할 때마다 나타나고 가중치 초기화와 무관하다고 적는다(GPU 번호가 바뀌는 것 빼고).</text><text x="434" y="368" font-size="11.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">곧 3.2 절의 끊어 놓은 연결이 만든 것이다 — 구조가 특징의 분업을 강제한 자리다.</text></svg>
