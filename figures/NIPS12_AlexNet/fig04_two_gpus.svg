<svg xmlns="http://www.w3.org/2000/svg" width="866" height="396" viewBox="0 0 866 396" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="커널을 GPU 두 장에 나누고 conv3 에서만 서로 넘나든다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="d1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="d2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="430" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">3.2 GPU 둘로 쪼개기 — 메모리 3GB 가 정한 구조</text><rect x="90" y="70" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="145.0" y="100" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv1</text><rect x="90" y="182" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="145.0" y="212" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv1</text><rect x="242" y="70" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="297.0" y="100" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv2</text><rect x="242" y="182" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="297.0" y="212" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv2</text><rect x="394" y="70" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="449.0" y="100" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv3</text><rect x="394" y="182" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="449.0" y="212" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv3</text><rect x="546" y="70" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="601.0" y="100" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv4</text><rect x="546" y="182" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="601.0" y="212" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv4</text><rect x="698" y="70" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="753.0" y="100" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv5</text><rect x="698" y="182" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="753.0" y="212" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">conv5</text><text x="52" y="100" font-size="12" fill="#2E6B8A" text-anchor="end" font-weight="600">GPU 1</text><text x="52" y="212" font-size="12" fill="#2E6B8A" text-anchor="end" font-weight="600">GPU 2</text><line x1="200" y1="94" x2="242" y2="94" stroke="#4E5964" stroke-width="1.3" marker-end="url(#d1)"/><line x1="200" y1="206" x2="242" y2="206" stroke="#4E5964" stroke-width="1.3" marker-end="url(#d1)"/><line x1="352" y1="94" x2="394" y2="94" stroke="#4E5964" stroke-width="1.3" marker-end="url(#d1)"/><line x1="352" y1="206" x2="394" y2="206" stroke="#4E5964" stroke-width="1.3" marker-end="url(#d1)"/><line x1="504" y1="94" x2="546" y2="94" stroke="#4E5964" stroke-width="1.3" marker-end="url(#d1)"/><line x1="504" y1="206" x2="546" y2="206" stroke="#4E5964" stroke-width="1.3" marker-end="url(#d1)"/><line x1="656" y1="94" x2="698" y2="94" stroke="#4E5964" stroke-width="1.3" marker-end="url(#d1)"/><line x1="656" y1="206" x2="698" y2="206" stroke="#4E5964" stroke-width="1.3" marker-end="url(#d1)"/><path d="M 352 102 L 394 198" fill="none" stroke="#1E8449" stroke-width="2.0" marker-end="url(#d2)"/><path d="M 352 198 L 394 102" fill="none" stroke="#1E8449" stroke-width="2.0" marker-end="url(#d2)"/><text x="373.0" y="158" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="600">conv3 만 서로 넘나든다</text><rect x="30" y="254" width="400" height="122" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="230" y="278" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">이득과 견준 상대</text><text x="50" y="302" font-size="13" fill="#B4552B" text-anchor="start" font-weight="600">top-1 -1.7% · top-5 -1.2%</text><text x="50" y="326" font-size="11.5" fill="#4E5964" text-anchor="start">견준 상대는 합성곱 층마다 커널이 절반인 1-GPU 망</text><text x="50" y="352" font-size="11.5" fill="#4E5964" text-anchor="start">GTX 580 한 장의 메모리가 3GB 라 크기가 거기 묶인다</text><rect x="446" y="254" width="394" height="122" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/><text x="643" y="278" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">논문이 스스로 적는 치우침</text><text x="466" y="302" font-size="11.5" fill="#4E5964" text-anchor="start">1-GPU 망의 마지막 합성곱 층은 절반으로 줄이지</text><text x="466" y="320" font-size="11.5" fill="#4E5964" text-anchor="start">않았다(파라미터 수를 맞추려고).</text><text x="466" y="346" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">그래서 이 비교는 1-GPU 쪽에 유리하게 치우쳐 있다</text><text x="466" y="366" font-size="10.8" fill="#7A8590" text-anchor="start">— 각주에 저자들이 직접 적는다.</text></svg>
