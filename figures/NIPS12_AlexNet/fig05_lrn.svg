<svg xmlns="http://www.w3.org/2000/svg" width="866" height="386" viewBox="0 0 866 386" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="LRN 은 같은 자리에서 이웃한 커널 지도 다섯과 겨룬다. 상수 넷과 이득"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="e1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="430" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">3.3 국소 반응 정규화 — 같은 자리에서 커널끼리 겨룬다</text><rect x="24" y="50" width="420" height="230" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="234" y="74" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">이웃한 커널 지도 n = 5 장</text><rect x="60" y="96" width="34" height="76" rx="3" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.1"/><circle cx="77" cy="134" r="6" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.0"/><text x="77" y="186" font-size="10" fill="#7A8590" text-anchor="middle">0</text><rect x="102" y="96" width="34" height="76" rx="3" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.1"/><circle cx="119" cy="134" r="6" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.0"/><text x="119" y="186" font-size="10" fill="#7A8590" text-anchor="middle">1</text><rect x="144" y="96" width="34" height="76" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.1"/><circle cx="161" cy="134" r="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.0"/><text x="161" y="186" font-size="10" fill="#7A8590" text-anchor="middle">2</text><rect x="186" y="96" width="34" height="76" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.1"/><circle cx="203" cy="134" r="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.0"/><text x="203" y="186" font-size="10" fill="#7A8590" text-anchor="middle">3</text><rect x="228" y="96" width="34" height="76" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.1"/><circle cx="245" cy="134" r="6" fill="#B4552B" stroke="#B4552B" stroke-width="1.0"/><text x="245" y="186" font-size="10" fill="#7A8590" text-anchor="middle">4</text><rect x="270" y="96" width="34" height="76" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.1"/><circle cx="287" cy="134" r="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.0"/><text x="287" y="186" font-size="10" fill="#7A8590" text-anchor="middle">5</text><rect x="312" y="96" width="34" height="76" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.1"/><circle cx="329" cy="134" r="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.0"/><text x="329" y="186" font-size="10" fill="#7A8590" text-anchor="middle">6</text><rect x="354" y="96" width="34" height="76" rx="3" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.1"/><circle cx="371" cy="134" r="6" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.0"/><text x="371" y="186" font-size="10" fill="#7A8590" text-anchor="middle">7</text><rect x="396" y="96" width="34" height="76" rx="3" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.1"/><circle cx="413" cy="134" r="6" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.0"/><text x="413" y="186" font-size="10" fill="#7A8590" text-anchor="middle">8</text><text x="234" y="206" font-size="11.5" fill="#4E5964" text-anchor="middle">가운데 하나(i)를 그 좌우 두 장씩과 함께 본다</text><text x="234" y="228" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">같은 자리 (x, y) 에서만 — 한 지도 안의 이웃 픽셀이 아니다</text><text x="234" y="258" font-size="11" fill="#7A8590" text-anchor="middle">커널 지도의 순서는 학습 전에 정해지는 임의의 것이다</text><rect x="460" y="50" width="380" height="230" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="650" y="74" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">상수와 이득</text><rect x="500" y="82" width="150" height="36" rx="5" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><text x="540" y="106" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="600">k</text><text x="610" y="106" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">2</text><rect x="680" y="82" width="150" height="36" rx="5" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><text x="720" y="106" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="600">n</text><text x="790" y="106" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">5</text><rect x="500" y="126" width="150" height="36" rx="5" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><text x="540" y="150" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="600">알파</text><text x="610" y="150" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">10^-4</text><rect x="680" y="126" width="150" height="36" rx="5" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.0"/><text x="720" y="150" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="600">베타</text><text x="790" y="150" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">0.75</text><text x="650" y="206" font-size="11" fill="#7A8590" text-anchor="middle">검증 집합으로 골랐다고만 적혀 있다 —</text><text x="650" y="222" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="600">어느 범위에서 몇 개를 훑었는지가 없다</text><rect x="480" y="236" width="340" height="34" rx="5" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.2"/><text x="650" y="258" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">top-1 -1.4% · top-5 -1.2%</text><rect x="28" y="294" width="812" height="76" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="434" y="318" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">CIFAR-10 네 층 망에서도 확인했다고 적는다 — 정규화 없이 13%, 넣으면 11%.</text><text x="434" y="342" font-size="11.5" fill="#4E5964" text-anchor="middle">다만 그 망은 자리가 모자라 자세히 적지 못한다고 각주에 적혀 있다(코드로 대신한다).</text><text x="434" y="362" font-size="11" fill="#7A8590" text-anchor="middle">평균을 빼지 않으므로 「밝기 정규화」라 부르는 편이 더 맞다고 논문이 덧붙인다.</text></svg>
