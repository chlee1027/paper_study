<svg xmlns="http://www.w3.org/2000/svg" width="866" height="448" viewBox="0 0 866 448" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="1998 과 2012 사이에 무엇이 그대로이고 무엇이 바뀌었는가"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="430" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">LeNet-5 (1998) 와 AlexNet (2012)</text><rect x="24" y="44" width="816" height="36" rx="6" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.0"/><text x="150" y="66" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">자리</text><text x="400" y="66" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">LeNet-5 (1998)</text><text x="660" y="66" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">AlexNet (2012)</text><text x="150" y="102" font-size="11.5" fill="#4E5964" text-anchor="middle">학습되는 층</text><text x="400" y="102" font-size="11.5" fill="#2E6B8A" text-anchor="middle">7</text><text x="660" y="102" font-size="11.5" fill="#B4552B" text-anchor="middle">8</text><line x1="40" y1="112" x2="824" y2="112" stroke="#CFD6D3" stroke-width="0.7"/><text x="150" y="132" font-size="11.5" fill="#4E5964" text-anchor="middle">학습되는 값</text><text x="400" y="132" font-size="11.5" fill="#2E6B8A" text-anchor="middle">60,000</text><text x="660" y="132" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">60,965,224</text><line x1="40" y1="142" x2="824" y2="142" stroke="#CFD6D3" stroke-width="0.7"/><text x="150" y="162" font-size="11.5" fill="#4E5964" text-anchor="middle">학습 사례</text><text x="400" y="162" font-size="11.5" fill="#2E6B8A" text-anchor="middle">60,000</text><text x="660" y="162" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">1,200,000</text><line x1="40" y1="172" x2="824" y2="172" stroke="#CFD6D3" stroke-width="0.7"/><text x="150" y="192" font-size="11.5" fill="#4E5964" text-anchor="middle">부류</text><text x="400" y="192" font-size="11.5" fill="#2E6B8A" text-anchor="middle">10</text><text x="660" y="192" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">1,000</text><line x1="40" y1="202" x2="824" y2="202" stroke="#CFD6D3" stroke-width="0.7"/><text x="150" y="222" font-size="11.5" fill="#4E5964" text-anchor="middle">비선형</text><text x="400" y="222" font-size="11.5" fill="#2E6B8A" text-anchor="middle">1.7159 tanh(2/3 a)</text><text x="660" y="222" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">ReLU</text><line x1="40" y1="232" x2="824" y2="232" stroke="#CFD6D3" stroke-width="0.7"/><text x="150" y="252" font-size="11.5" fill="#4E5964" text-anchor="middle">해상도 깎기</text><text x="400" y="252" font-size="11.5" fill="#2E6B8A" text-anchor="middle">부분 표본(학습되는 계수 있음)</text><text x="660" y="252" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">겹치는 최댓값 풀링(없음)</text><line x1="40" y1="262" x2="824" y2="262" stroke="#CFD6D3" stroke-width="0.7"/><text x="150" y="282" font-size="11.5" fill="#4E5964" text-anchor="middle">출력층</text><text x="400" y="282" font-size="11.5" fill="#2E6B8A" text-anchor="middle">유클리드 RBF (고정)</text><text x="660" y="282" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">1000-way 소프트맥스</text><line x1="40" y1="292" x2="824" y2="292" stroke="#CFD6D3" stroke-width="0.7"/><text x="150" y="312" font-size="11.5" fill="#4E5964" text-anchor="middle">층 사이 희소 연결</text><text x="400" y="312" font-size="11.5" fill="#2E6B8A" text-anchor="middle">표 I</text><text x="660" y="312" font-size="11.5" fill="#B4552B" text-anchor="middle">GPU 둘로 쪼개기</text><line x1="40" y1="322" x2="824" y2="322" stroke="#CFD6D3" stroke-width="0.7"/><text x="150" y="342" font-size="11.5" fill="#4E5964" text-anchor="middle">장비와 시간</text><text x="400" y="342" font-size="11.5" fill="#2E6B8A" text-anchor="middle">CPU 하나 · 2~3 일</text><text x="660" y="342" font-size="11.5" fill="#B4552B" text-anchor="middle">GPU 둘 · 5~6 일</text><rect x="24" y="330" width="400" height="100" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="224" y="354" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">같은 동기가 이름만 바뀐 자리</text><text x="44" y="378" font-size="11.5" fill="#4E5964" text-anchor="start">표 I 의 비완전 연결도, GPU 둘로 쪼개기도</text><text x="44" y="398" font-size="11.5" fill="#4E5964" text-anchor="start">계산 예산을 지키면서 대칭을 깨는 장치다.</text><text x="44" y="420" font-size="11" fill="#7A8590" text-anchor="start">1998 은 연결 수 때문에, 2012 는 메모리 3GB 때문에.</text><rect x="440" y="330" width="400" height="100" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2"/><text x="640" y="354" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">두 논문 모두 답하지 않은 자리</text><text x="460" y="378" font-size="11.5" fill="#4E5964" text-anchor="start">최댓값 풀링이 부분 표본 뽑기를 왜 대신하는가 —</text><text x="460" y="398" font-size="11.5" fill="#4E5964" text-anchor="start">AlexNet 도 겹치게 할지만 재고 그 선택은 변호하지 않는다.</text><text x="460" y="420" font-size="11" fill="#7A8590" text-anchor="start">파라미터가 많은 망이 왜 되는가도 여전히 열려 있다.</text></svg>
