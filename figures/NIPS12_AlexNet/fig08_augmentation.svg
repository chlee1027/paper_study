<svg xmlns="http://www.w3.org/2000/svg" width="866" height="396" viewBox="0 0 866 396" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="224 조각과 좌우 뒤집기로 2048배, 그리고 RGB 주성분 흔들기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="h1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="430" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">4.1 데이터 늘리기 둘 — 디스크에 저장하지 않는다</text><rect x="24" y="50" width="420" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="234" y="74" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">하나. 자르기와 좌우 뒤집기</text><rect x="70" y="92" width="130" height="130" rx="4" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.2"/><text x="135" y="232" font-size="11" fill="#7A8590" text-anchor="middle">256 x 256</text><rect x="76" y="98" width="78" height="78" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3" opacity="0.75"/><rect x="96" y="118" width="78" height="78" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3" opacity="0.75"/><rect x="116" y="102" width="78" height="78" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3" opacity="0.75"/><text x="135" y="160" font-size="11" fill="#B4552B" text-anchor="middle" font-weight="600">224</text><text x="300" y="120" font-size="11.5" fill="#4E5964" text-anchor="middle">무작위 조각</text><text x="300" y="142" font-size="11.5" fill="#4E5964" text-anchor="middle">+ 좌우 뒤집기</text><rect x="250" y="160" width="160" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.3"/><text x="330" y="188" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">2048 배</text><text x="300" y="222" font-size="10.8" fill="#7A8590" text-anchor="middle">다만 서로 크게 의존하는</text><text x="300" y="238" font-size="10.8" fill="#7A8590" text-anchor="middle">사례들이라고 논문이 덧붙인다</text><text x="234" y="268" font-size="11" fill="#4E5964" text-anchor="middle">시험할 때는 네 모퉁이 + 가운데 다섯 조각과</text><text x="234" y="286" font-size="11" fill="#4E5964" text-anchor="middle">각각의 뒤집기, 곧 열 장의 소프트맥스를 평균한다</text><rect x="460" y="50" width="380" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="650" y="74" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">둘. RGB 세기 흔들기</text><text x="650" y="100" font-size="11" fill="#4E5964" text-anchor="middle">학습 집합 전체의 RGB 값에 주성분 분석을 돌려</text><text x="650" y="118" font-size="11" fill="#4E5964" text-anchor="middle">이미지마다 주성분 방향으로 흔들어 더한다</text><rect x="490" y="134" width="320" height="40" rx="5" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="650" y="160" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">[p1 p2 p3][a1 L1, a2 L2, a3 L3]^T</text><text x="650" y="194" font-size="11" fill="#4E5964" text-anchor="middle">a 는 평균 0 · 표준편차 0.1 에서 뽑고,</text><text x="650" y="212" font-size="11" fill="#4E5964" text-anchor="middle">한 이미지의 모든 픽셀에 같은 값을 쓴다</text><rect x="500" y="226" width="300" height="40" rx="5" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.2"/><text x="650" y="252" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">top-1 이 1% 넘게 내려간다</text><text x="650" y="286" font-size="10.8" fill="#7A8590" text-anchor="middle">노리는 것: 물체는 조명의 세기와 색이 바뀌어도 그대로다</text><rect x="28" y="314" width="812" height="66" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="434" y="338" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">GPU 가 앞 묶음을 배우는 동안 CPU 가 파이썬으로 만들어내므로 사실상 계산이 공짜라고 적는다.</text><text x="434" y="362" font-size="12" fill="#4E5964" text-anchor="middle">열 조각 평균을 하지 않으면 각주의 값은 top-1 39.0% · top-5 18.3% 다(하면 37.5% · 17.0%).</text></svg>
