="116" y="106" font-size="11.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">tanh — 포화한다</text><text x="320" y="106" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">ReLU</text><text x="220" y="272" font-size="11.5" fill="#4E5964" text-anchor="middle">포화한 자리에서는 기울기가 0 으로 눌린다</text><rect x="432" y="48" width="408" height="240" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="636" y="72" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">그림 1 의 값 — CIFAR-10, 네 층 망</text><text x="636" y="94" font-size="11.5" fill="#7A8590" text-anchor="middle">학습 오차 25% 에 닿기까지 걸린 바퀴 수</text><text x="592" y="129.28" font-size="12" fill="#4E5964" text-anchor="end">ReLU</text><rect x="600" y="112" width="31.666666666666664" height="24" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="638.6666666666666" y="129.28" font-size="12" fill="#4E5964" text-anchor="start">1 배</text><text x="592" y="167.28" font-size="12" fill="#4E5964" text-anchor="end">tanh</text><rect x="600" y="150" width="190.0" height="24" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="797.0" y="167.28" font-size="12" fill="#4E5964" text-anchor="start">6 배</text><rect x="452" y="190" width="368" height="82" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2"/><text x="636" y="212" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">그림 설명이 붙여 놓은 조건 셋</text><text x="470" y="232" font-size="11" fill="#4E5964" text-anchor="start">두 망의 학습률을 각각 따로 골랐다</text><text x="470" y="250" font-size="11" fill="#4E5964" text-anchor="start">정칙화를 전혀 걸지 않았다</text><text x="470" y="268" font-size="11" fill="#4E5964" text-anchor="start">효과의 크기는 구조에 따라 달라진다</text><rect x="28" y="302" width="812" height="62" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="434" y="326" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">그래서 「ReLU 가 6 배 빠르다」로 옮겨 적으면 안 된다 — 조건이 붙은 값이다.</text><text x="434" y="350" font-size="11.5" fill="#4E5964" text-anchor="middle">논문이 말하는 것은 「포화하지 않는 비선형이 학습 집합에 빨리 맞춰 간다」이고, 과적합을 막는 이야기와는 다른 자리다.</text></svg>
