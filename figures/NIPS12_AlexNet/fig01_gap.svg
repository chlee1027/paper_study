<svg xmlns="http://www.w3.org/2000/svg" width="866" height="388" viewBox="0 0 866 388" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="1998 과 2012 사이에 학습 사례 20배, 부류 100배, 학습되는 값 1000배가 되었다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="430" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">1998 에서 2012 사이에 먼저 커진 것은 데이터다</text><rect x="24" y="44" width="816" height="40" rx="6" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.0"/><text x="150" y="68" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">무엇</text><text x="360" y="68" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">LeNet-5 (1998)</text><text x="580" y="68" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">AlexNet (2012)</text><text x="760" y="68" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="600">배수</text><text x="150" y="104" font-size="12" fill="#4E5964" text-anchor="middle">학습 사례</text><text x="360" y="104" font-size="12.5" fill="#2E6B8A" text-anchor="middle">60,000</text><text x="580" y="104" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">1,200,000</text><text x="760" y="104" font-size="12" fill="#4E5964" text-anchor="middle">20 배</text><line x1="40" y1="116" x2="824" y2="116" stroke="#CFD6D3" stroke-width="0.8"/><text x="150" y="140" font-size="12" fill="#4E5964" text-anchor="middle">부류</text><text x="360" y="140" font-size="12.5" fill="#2E6B8A" text-anchor="middle">10</text><text x="580" y="140" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">1,000</text><text x="760" y="140" font-size="12" fill="#4E5964" text-anchor="middle">100 배</text><line x1="40" y1="152" x2="824" y2="152" stroke="#CFD6D3" stroke-width="0.8"/><text x="150" y="176" font-size="12" fill="#4E5964" text-anchor="middle">학습되는 값</text><text x="360" y="176" font-size="12.5" fill="#2E6B8A" text-anchor="middle">60,000</text><text x="580" y="176" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">60,000,000</text><text x="760" y="176" font-size="12" fill="#4E5964" text-anchor="middle">1,000 배</text><line x1="40" y1="188" x2="824" y2="188" stroke="#CFD6D3" stroke-width="0.8"/><text x="150" y="212" font-size="12" fill="#4E5964" text-anchor="middle">장비</text><text x="360" y="212" font-size="12.5" fill="#2E6B8A" text-anchor="middle">CPU 하나</text><text x="580" y="212" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">GPU 두 장</text><text x="760" y="212" font-size="12" fill="#4E5964" text-anchor="middle">—</text><line x1="40" y1="224" x2="824" y2="224" stroke="#CFD6D3" stroke-width="0.8"/><text x="150" y="248" font-size="12" fill="#4E5964" text-anchor="middle">학습 시간</text><text x="360" y="248" font-size="12.5" fill="#2E6B8A" text-anchor="middle">2~3 일</text><text x="580" y="248" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">5~6 일</text><text x="760" y="248" font-size="12" fill="#4E5964" text-anchor="middle">—</text><rect x="24" y="250" width="400" height="120" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="224" y="274" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">이 논문이 적는 출발점 셋</text><text x="44" y="298" font-size="11.5" fill="#4E5964" text-anchor="start">하나. 작은 데이터로는 실제 장면의 물체를 못 배운다</text><text x="44" y="320" font-size="11.5" fill="#4E5964" text-anchor="start">둘. 그러려면 용량이 큰 모델이 필요하다</text><text x="44" y="342" font-size="11.5" fill="#4E5964" text-anchor="start">셋. 합성곱 망은 좋지만 큰 규모로 쓰기에 비쌌다</text><text x="224" y="362" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">— 그 셋째를 GPU 가 푼다</text><rect x="440" y="250" width="400" height="120" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="640" y="274" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">합성곱 망이 담는 사전 지식 둘</text><text x="460" y="298" font-size="11.5" fill="#2E6B8A" text-anchor="start" font-weight="600">통계가 자리에 따라 변하지 않는다</text><text x="460" y="320" font-size="11.5" fill="#2E6B8A" text-anchor="start" font-weight="600">픽셀의 의존이 가깝다</text><text x="640" y="350" font-size="11" fill="#4E5964" text-anchor="middle">데이터가 아무리 커도 이 과제를 다 적을 수 없으니,</text><text x="640" y="366" font-size="11" fill="#4E5964" text-anchor="middle">모델이 없는 데이터를 메울 가정을 담아야 한다</text></svg>
