<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 2 생성 모델 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">표 2 — 생성 모델 네 갈래가 각 연산에서 만나는 어려움 (원문 표를 옮긴 것. 빨강은 걸림이 적힌 칸으로 내가 칠한 것)</text><rect x="20" y="46" width="860" height="400" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="114" y="52" width="177" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="202.5" y="74" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">깊은 유향 그래프 모델</text><rect x="299" y="52" width="177" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="387.5" y="74" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">깊은 무향 그래프 모델</text><rect x="484" y="52" width="177" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="572.5" y="74" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">생성 오토인코더</text><rect x="669" y="52" width="177" height="34" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="757.5" y="74" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">적대 모델 (GAN)</text><text x="32" y="134" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">학습</text><line x1="30" y1="164" x2="870" y2="164" stroke="#CFD6D3" stroke-width="0.8"/><text x="202.5" y="134" font-size="11" fill="#C0392B" text-anchor="middle">학습 중 추론이 필요</text><text x="387.5" y="116" font-size="11" fill="#C0392B" text-anchor="middle">학습 중 추론이 필요</text><text x="387.5" y="134" font-size="11" fill="#C0392B" text-anchor="middle">분배 함수 기울기를</text><text x="387.5" y="152" font-size="11" fill="#C0392B" text-anchor="middle">MCMC 로 근사</text><text x="572.5" y="125" font-size="11" fill="#C0392B" text-anchor="middle">섞임과 재구성 능력</text><text x="572.5" y="143" font-size="11" fill="#C0392B" text-anchor="middle">사이의 맞교환이 강제됨</text><text x="757.5" y="116" font-size="11" fill="#C0392B" text-anchor="middle">판별기를 생성기와</text><text x="757.5" y="134" font-size="11" fill="#C0392B" text-anchor="middle">맞춰 가기</text><text x="757.5" y="152" font-size="11" fill="#C0392B" text-anchor="middle">헬베티카</text><text x="32" y="204" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">추론</text><line x1="30" y1="234" x2="870" y2="234" stroke="#CFD6D3" stroke-width="0.8"/><text x="202.5" y="204" font-size="11" fill="#1C232C" text-anchor="middle">배운 근사 추론</text><text x="387.5" y="204" font-size="11" fill="#1C232C" text-anchor="middle">변분 추론</text><text x="572.5" y="204" font-size="11" fill="#1C232C" text-anchor="middle">MCMC 기반 추론</text><text x="757.5" y="204" font-size="11" fill="#1C232C" text-anchor="middle">배운 근사 추론</text><text x="32" y="274" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">표본 뽑기</text><line x1="30" y1="304" x2="870" y2="304" stroke="#CFD6D3" stroke-width="0.8"/><text x="202.5" y="274" font-size="11" fill="#1C232C" text-anchor="middle">어려움 없음</text><text x="387.5" y="274" font-size="11" fill="#C0392B" text-anchor="middle">마르코프 사슬 필요</text><text x="572.5" y="274" font-size="11" fill="#C0392B" text-anchor="middle">마르코프 사슬 필요</text><text x="757.5" y="274" font-size="11" fill="#1C232C" text-anchor="middle">어려움 없음</text><text x="32" y="344" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">p(x) 평가</text><line x1="30" y1="374" x2="870" y2="374" stroke="#CFD6D3" stroke-width="0.8"/><text x="202.5" y="335" font-size="11" fill="#C0392B" text-anchor="middle">계산 불가,</text><text x="202.5" y="353" font-size="11" fill="#C0392B" text-anchor="middle">AIS 로 근사할 수 있다</text><text x="387.5" y="335" font-size="11" fill="#C0392B" text-anchor="middle">계산 불가,</text><text x="387.5" y="353" font-size="11" fill="#C0392B" text-anchor="middle">AIS 로 근사할 수 있다</text><text x="572.5" y="335" font-size="11" fill="#C0392B" text-anchor="middle">명시적으로 없음,</text><text x="572.5" y="353" font-size="11" fill="#C0392B" text-anchor="middle">Parzen 으로 근사</text><text x="757.5" y="335" font-size="11" fill="#C0392B" text-anchor="middle">명시적으로 없음,</text><text x="757.5" y="353" font-size="11" fill="#C0392B" text-anchor="middle">Parzen 으로 근사</text><text x="32" y="414" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">모델 설계</text><line x1="30" y1="444" x2="870" y2="444" stroke="#CFD6D3" stroke-width="0.8"/><text x="202.5" y="405" font-size="11" fill="#C0392B" text-anchor="middle">원하는 추론 방식에</text><text x="202.5" y="423" font-size="11" fill="#C0392B" text-anchor="middle">맞게 설계해야 한다</text><text x="387.5" y="405" font-size="11" fill="#C0392B" text-anchor="middle">여러 성질을 갖추게</text><text x="387.5" y="423" font-size="11" fill="#C0392B" text-anchor="middle">조심스러운 설계</text><text x="572.5" y="405" font-size="11" fill="#1C232C" text-anchor="middle">미분 가능한 함수는</text><text x="572.5" y="423" font-size="11" fill="#1C232C" text-anchor="middle">이론상 무엇이든</text><text x="757.5" y="405" font-size="11" fill="#1C232C" text-anchor="middle">미분 가능한 함수는</text><text x="757.5" y="423" font-size="11" fill="#1C232C" text-anchor="middle">이론상 무엇이든</text><text x="450" y="462" font-size="11" fill="#7A8590" text-anchor="middle">원문 표는 칸을 글로만 적는다. 「생성 오토인코더」 열은 GSN 계열처럼 마르코프 사슬로 표본을 뽑는 오토인코더를 말한다</text></svg>
