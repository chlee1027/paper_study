<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="GAN 계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 원문 2절이 든 앞선 편과, 7절 결론의 다섯 확장이 이어진 자리 (오른쪽 칸 둘째 줄은 내가 이은 것, 읽지 않았다)</text><rect x="20" y="60" width="210" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="125" y="87" font-size="12" fill="#1C232C" text-anchor="middle">깊은 볼츠만 기계 (2009)</text><line x1="230" y1="82" x2="330" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="20" y="126" width="210" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="125" y="153" font-size="12" fill="#1C232C" text-anchor="middle">잡음 대조 추정 (2010)</text><line x1="230" y1="148" x2="330" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="20" y="192" width="210" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="125" y="219" font-size="12" fill="#1C232C" text-anchor="middle">예측 가능성 최소화 (1992)</text><line x1="230" y1="214" x2="330" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="20" y="258" width="210" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="125" y="285" font-size="12" fill="#1C232C" text-anchor="middle">생성 확률망 (2014)</text><line x1="230" y1="280" x2="330" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="20" y="324" width="210" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="125" y="351" font-size="12" fill="#1C232C" text-anchor="middle">VAE (2014, 같은 시기)</text><line x1="230" y1="346" x2="330" y2="205" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="335" y="170" width="170" height="70" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="2"/><text x="420" y="200" font-size="16" fill="#B4552B" text-anchor="middle" font-weight="bold">GAN</text><text x="420" y="222" font-size="11" fill="#1C232C" text-anchor="middle">NIPS 2014 (이 노트)</text><line x1="505" y1="205" x2="555" y2="82" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="560" y="56" width="320" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="574" y="78" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">1. 조건부 p(x | c)</text><text x="574" y="98" font-size="11" fill="#4E5964" text-anchor="start">Conditional GAN (Mirza · Osindero 2014)</text><line x1="505" y1="205" x2="555" y2="148" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="560" y="122" width="320" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="574" y="144" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">2. 배운 근사 추론 (x → z)</text><text x="574" y="164" font-size="11" fill="#4E5964" text-anchor="start">BiGAN / ALI (2016)</text><line x1="505" y1="205" x2="555" y2="214" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="560" y="188" width="320" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="574" y="210" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">3. 모든 조건부 p(x_S | 나머지)</text><text x="574" y="230" font-size="11" fill="#4E5964" text-anchor="start">(이을 편을 아직 못 골랐다)</text><line x1="505" y1="205" x2="555" y2="280" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="560" y="254" width="320" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="574" y="276" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">4. 준지도 학습</text><text x="574" y="296" font-size="11" fill="#4E5964" text-anchor="start">Improved Techniques (Salimans 외 2016)</text><line x1="505" y1="205" x2="555" y2="346" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)" opacity="0.6"/><rect x="560" y="320" width="320" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="574" y="342" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">5. G 와 D 맞추기 · 효율</text><text x="574" y="362" font-size="11" fill="#4E5964" text-anchor="start">WGAN (2017), 수렴 분석 편들 (2017)</text><rect x="335" y="290" width="170" height="60" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="420" y="315" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">CACM 2020 개관판</text><text x="420" y="335" font-size="11" fill="#4E5964" text-anchor="middle">(앞서 읽은 노트)</text><line x1="420" y1="240" x2="420" y2="288" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="450" y="410" font-size="11" fill="#7A8590" text-anchor="middle">왼쪽 다섯은 원문 2절이 직접 견준 편. 오른쪽 칸의 첫 줄은 원문 7절, 둘째 줄(뒤에 나온 편)은 내가 이은 것이다</text></svg>
