<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="개관판 노트 유도와 원문 대조"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">CACM 2020 개관판 노트에서 내가 유도한 것 · 옮긴 것을 원문과 맞춘 결과</text><rect x="20" y="50" width="860" height="44" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="77" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">가치 함수 (개관판 노트 식 b)</text><text x="262" y="77" font-size="11" fill="#4E5964" text-anchor="start">원문 식 (1) 과 같다 — 무게 1/2 없음. z 의 분포를 원문은 p_z(z) 로 적는다</text><rect x="770" y="59" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.2"/><text x="820" y="77" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">같다</text><rect x="20" y="100" width="860" height="44" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="127" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">최적 판별기 D* (식 c)</text><text x="262" y="127" font-size="11" fill="#4E5964" text-anchor="start">원문 명제 1 · 식 (2) 와 같다. 원문은 미분 대신 최대 자리를 바로 적고 받침 밖을 뺀다</text><rect x="770" y="109" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.2"/><text x="820" y="127" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">같다</text><rect x="20" y="150" width="860" height="44" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="177" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">−log 4 + 2·JSD (식 d)</text><text x="262" y="177" font-size="11" fill="#4E5964" text-anchor="start">원문 정리 1 · 식 (5)(6) 과 같다. 원문은 KL 둘을 먼저 적고 JSD 로 묶는다</text><rect x="770" y="159" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.2"/><text x="820" y="177" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">같다</text><rect x="20" y="200" width="860" height="44" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="227" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">포화 기울기 (10절 표)</text><text x="262" y="227" font-size="11" fill="#4E5964" text-anchor="start">원문은 식 없이 문장뿐. 방향(초기 D 가 확신 있게 거부 → 포화)은 같다</text><rect x="770" y="209" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#9A7B00" stroke-width="1.2"/><text x="820" y="227" font-size="11" fill="#9A7B00" text-anchor="middle" font-weight="bold">식은 내 것</text><rect x="20" y="250" width="860" height="44" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="277" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">「NS-GAN 의 이론이 없다」</text><text x="262" y="277" font-size="11" fill="#4E5964" text-anchor="start">원문 3절이 「같은 고정점」이라고 한 문장 적는다 — 증명은 없다</text><rect x="770" y="259" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2"/><text x="820" y="277" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="bold">고쳐 적을 것</text><rect x="20" y="300" width="860" height="44" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="327" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">그림 4 (a) 의 설명</text><text x="262" y="327" font-size="11" fill="#4E5964" text-anchor="start">원문 그림 1 (a) 는 「수렴 근처의 쌍」, 개관판은 「초기화 때」로 바꿨다</text><rect x="770" y="309" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2"/><text x="820" y="327" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="bold">두 판이 다르다</text><rect x="20" y="350" width="860" height="44" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="377" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">물음: NS-GAN 을 이론 절에서?</text><text x="262" y="377" font-size="11" fill="#4E5964" text-anchor="start">다루지 않는다. 4절은 식 (1) 의 최소최대 게임만 다룬다</text><rect x="770" y="359" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.2"/><text x="820" y="377" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">답</text><rect x="20" y="400" width="860" height="44" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="32" y="427" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">물음: 2014 얼굴의 데이터셋</text><text x="262" y="427" font-size="11" fill="#4E5964" text-anchor="start">원문의 얼굴 표본은 TFD (그림 2b) 뿐 — 개관판 그림 6 의 출처라고 적지는 않는다</text><rect x="770" y="409" width="100" height="26" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.2"/><text x="820" y="427" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="bold">추정</text></svg>
