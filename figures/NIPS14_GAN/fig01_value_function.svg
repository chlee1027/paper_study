<svg xmlns="http://www.w3.org/2000/svg" width="860" height="380" viewBox="0 0 860 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="가치 함수의 두 항"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">식 (1) 의 가치 함수 V(D, G) — 판별기는 두 항을 함께 올리고, 생성기는 둘째 항만 움직여 내린다</text><text x="430" y="72" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">min_G  max_D  V(D, G)  =  E_{x~p_data}[ log D(x) ]  +  E_{z~p_z}[ log(1 − D(G(z))) ]</text><rect x="130" y="92" width="290" height="96" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="275" y="118" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">첫째 항: 진짜에 매긴 log D</text><text x="275" y="140" font-size="12" fill="#4E5964" text-anchor="middle">진짜 x 에 D(x) → 1 이면 0 으로 올라간다</text><text x="275" y="160" font-size="12" fill="#4E5964" text-anchor="middle">G 와 상관없다</text><text x="275" y="178" font-size="11" fill="#7A8590" text-anchor="middle">(G 에 대한 기울기가 0)</text><rect x="450" y="92" width="300" height="96" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="600" y="118" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">둘째 항: 가짜에 매긴 log(1 − D)</text><text x="600" y="140" font-size="12" fill="#4E5964" text-anchor="middle">D 는 D(G(z)) → 0 으로 올리고</text><text x="600" y="160" font-size="12" fill="#4E5964" text-anchor="middle">G 는 D(G(z)) → 1 로 내린다</text><text x="600" y="178" font-size="11" fill="#7A8590" text-anchor="middle">두 사람이 함께 움직이는 유일한 자리</text><rect x="40" y="214" width="380" height="140" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="55" y="238" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">작은 예시 (내가 고른 수)</text><text x="55" y="264" font-size="12" fill="#1C232C" text-anchor="start">진짜 한 장에 D = 0.9, 가짜 한 장에 D = 0.2</text><text x="55" y="288" font-size="12" fill="#1C232C" text-anchor="start">V = ln 0.9 + ln 0.8 = -0.329</text><text x="55" y="312" font-size="12" fill="#4E5964" text-anchor="start">판별기가 완벽하면(1 과 0) V = 0 — 위 끝</text><text x="55" y="336" font-size="12" fill="#4E5964" text-anchor="start">평형(어디서나 D = 1/2) V = −log 4 = -1.386</text><rect x="450" y="214" width="370" height="140" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="465" y="238" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">읽는 법</text><text x="465" y="262" font-size="12" fill="#4E5964" text-anchor="start">V 는 D 가 진짜/가짜 라벨에 매긴</text><text x="465" y="283" font-size="12" fill="#4E5964" text-anchor="start">로그 가능도다 (논문 4.1 의 해석)</text><text x="465" y="304" font-size="12" fill="#4E5964" text-anchor="start">판별기: 이진 분류기의 로그 가능도 최대화</text><text x="465" y="325" font-size="12" fill="#4E5964" text-anchor="start">생성기: 그 분류기가 틀리게 만든다</text><text x="465" y="346" font-size="12" fill="#4E5964" text-anchor="start">식 (1) 에는 무게 1/2 이 없다</text></svg>
