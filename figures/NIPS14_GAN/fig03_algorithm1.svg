<svg xmlns="http://www.w3.org/2000/svg" width="880" height="470" viewBox="0 0 880 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="알고리즘 1 흐름"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">알고리즘 1 — 판별기 k 걸음, 생성기 한 걸음을 번갈아 (논문은 k = 1 · 모멘텀을 썼다)</text><rect x="30" y="50" width="540" height="400" rx="6" fill="none" stroke="#4E5964" stroke-width="1.2" stroke-dasharray="6 4"/><text x="45" y="72" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">학습 반복마다</text><rect x="55" y="85" width="490" height="205" rx="6" fill="none" stroke="#2E6B8A" stroke-width="1.2" stroke-dasharray="4 3"/><text x="70" y="106" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">k 걸음 되풀이 (판별기)</text><rect x="75" y="120" width="440" height="38" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="295" y="144" font-size="12" fill="#1C232C" text-anchor="middle">잡음 m 개를 뽑는다 (원문 「p_g(z)」 는 p_z(z) 의 오기)</text><rect x="75" y="170" width="440" height="38" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="295" y="194" font-size="12" fill="#1C232C" text-anchor="middle">데이터 m 개를 p_data 에서 뽑는다</text><rect x="75" y="220" width="440" height="38" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="295" y="244" font-size="12" fill="#1C232C" text-anchor="middle">θ_d 를 올린다: ∇ (1/m) Σ [ log D(x) + log(1 − D(G(z))) ]</text><line x1="295" y1="158" x2="295" y2="170" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="295" y1="208" x2="295" y2="220" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M515,239 C548,239 548,139 515,139" fill="none" stroke="#2E6B8A" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#af)"/><text x="552" y="194" font-size="11" fill="#2E6B8A" text-anchor="start">k 번</text><line x1="295" y1="290" x2="295" y2="315" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="75" y="318" width="440" height="38" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="295" y="342" font-size="12" fill="#1C232C" text-anchor="middle">잡음 m 개를 새로 뽑는다</text><line x1="295" y1="356" x2="295" y2="372" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="75" y="375" width="440" height="38" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="295" y="399" font-size="12" fill="#1C232C" text-anchor="middle">θ_g 를 내린다: ∇ (1/m) Σ log(1 − D(G(z)))</text><rect x="590" y="50" width="270" height="400" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="605" y="74" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">원문에서 확인한 것</text><text x="605" y="102" font-size="12" fill="#1C232C" text-anchor="start">k 는 초매개변수, 실험은 k = 1</text><text x="605" y="126" font-size="12" fill="#4E5964" text-anchor="start">「가장 싼 선택」이라고 적는다</text><text x="605" y="150" font-size="12" fill="#1C232C" text-anchor="start">갱신 규칙은 아무 기울기 규칙,</text><text x="605" y="174" font-size="12" fill="#4E5964" text-anchor="start">실험은 모멘텀</text><text x="605" y="198" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="605" y="222" font-size="12" fill="#C0392B" text-anchor="start">인쇄된 생성기 갱신은 log(1 − D)</text><text x="605" y="246" font-size="12" fill="#4E5964" text-anchor="start">— 3절 끝이 권한 log D 최대화</text><text x="605" y="270" font-size="12" fill="#4E5964" text-anchor="start">(포화 안 하는 쪽)가 아니다</text><text x="605" y="294" font-size="12" fill="#4E5964" text-anchor="start">실험에 어느 쪽을 썼는지는</text><text x="605" y="318" font-size="12" fill="#4E5964" text-anchor="start">본문에 없다 (코드 주소만 있다)</text><text x="605" y="342" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="605" y="366" font-size="12" fill="#1C232C" text-anchor="start">D 를 끝까지 배우지 않는 이유 둘:</text><text x="605" y="390" font-size="12" fill="#4E5964" text-anchor="start">계산이 너무 비싸고,</text><text x="605" y="414" font-size="12" fill="#4E5964" text-anchor="start">유한 데이터에서 과적합한다 (3절)</text></svg>
