="1"/><text x="683.3333333333334" y="298" font-size="10" fill="#7A8590" text-anchor="middle">1900</text><line x1="683.3333333333334" y1="80" x2="683.3333333333334" y2="280" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="738.8888888888889" y1="280" x2="738.8888888888889" y2="284" stroke="#4E5964" stroke-width="1"/><text x="738.8888888888889" y="298" font-size="10" fill="#7A8590" text-anchor="middle">2000</text><line x1="738.8888888888889" y1="80" x2="738.8888888888889" y2="280" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="794.4444444444445" y1="280" x2="794.4444444444445" y2="284" stroke="#4E5964" stroke-width="1"/><text x="794.4444444444445" y="298" font-size="10" fill="#7A8590" text-anchor="middle">2100</text><line x1="794.4444444444445" y1="80" x2="794.4444444444445" y2="280" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="850.0" y1="280" x2="850.0" y2="284" stroke="#4E5964" stroke-width="1"/><text x="850.0" y="298" font-size="10" fill="#7A8590" text-anchor="middle">2200</text><line x1="850.0" y1="80" x2="850.0" y2="280" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="590" y="104" font-size="12" fill="#2E6B8A" text-anchor="end">DBN</text><line x1="600.0" y1="100" x2="688.3333333333334" y2="100" stroke="#2E6B8A" stroke-width="10" opacity="0.35"/><line x1="651.6666666666666" y1="100" x2="725.0" y2="100" stroke="#2E6B8A" stroke-width="2.2"/><line x1="651.6666666666666" y1="94" x2="651.6666666666666" y2="106" stroke="#2E6B8A" stroke-width="1.6"/><line x1="725.0" y1="94" x2="725.0" y2="106" stroke="#2E6B8A" stroke-width="1.6"/><text x="688.3333333333334" y="90" font-size="11" fill="#2E6B8A" text-anchor="middle">1909 ± 66</text><text x="590" y="152" font-size="12" fill="#2E6B8A" text-anchor="end">Stacked CAE</text><line x1="600.0" y1="148" x2="800.0" y2="148" stroke="#2E6B8A" stroke-width="10" opacity="0.35"/><line x1="772.2222222222222" y1="148" x2="827.7777777777778" y2="148" stroke="#2E6B8A" stroke-width="2.2"/><line x1="772.2222222222222" y1="142" x2="772.2222222222222" y2="154" stroke="#2E6B8A" stroke-width="1.6"/><line x1="827.7777777777778" y1="142" x2="827.7777777777778" y2="154" stroke="#2E6B8A" stroke-width="1.6"/><text x="800.0" y="138" font-size="11" fill="#2E6B8A" text-anchor="middle">2110 ± 50</text><text x="590" y="200" font-size="12" fill="#2E6B8A" text-anchor="end">Deep GSN</text><line x1="600.0" y1="196" x2="677.7777777777778" y2="196" stroke="#2E6B8A" stroke-width="10" opacity="0.35"/><line x1="661.6666666666666" y1="196" x2="693.8888888888889" y2="196" stroke="#2E6B8A" stroke-width="2.2"/><line x1="661.6666666666666" y1="190" x2="661.6666666666666" y2="202" stroke="#2E6B8A" stroke-width="1.6"/><line x1="693.8888888888889" y1="190" x2="693.8888888888889" y2="202" stroke="#2E6B8A" stroke-width="1.6"/><text x="677.7777777777778" y="186" font-size="11" fill="#2E6B8A" text-anchor="middle">1890 ± 29</text><text x="590" y="248" font-size="12" fill="#B4552B" text-anchor="end" font-weight="bold">Adversarial nets</text><line x1="600.0" y1="244" x2="770.5555555555555" y2="244" stroke="#B4552B" stroke-width="10" opacity="0.35"/><line x1="756.1111111111111" y1="244" x2="785.0" y2="244" stroke="#B4552B" stroke-width="2.2"/><line x1="756.1111111111111" y1="238" x2="756.1111111111111" y2="250" stroke="#B4552B" stroke-width="1.6"/><line x1="785.0" y1="238" x2="785.0" y2="250" stroke="#B4552B" stroke-width="1.6"/><text x="770.5555555555555" y="234" font-size="11" fill="#B4552B" text-anchor="middle">2057 ± 26</text><text x="30" y="330" font-size="11" fill="#4E5964" text-anchor="start">MNIST: GAN 이 넷 중 가장 높다 — 둘째(Deep GSN)와 차이 11, 두 표준오차의 제곱합 제곱근 2.3.</text><text x="30" y="348" font-size="11" fill="#4E5964" text-anchor="start">이쪽 ± 는 시험 예시 사이의 표준오차라 학습 seed 의 흔들림은 들어 있지 않다</text><text x="30" y="366" font-size="11" fill="#4E5964" text-anchor="start">TFD: GAN 은 둘째 — 첫째(Stacked CAE)보다 53 낮고, 같은 방식으로 합친 표준오차 56.4 보다 차이가 작다. 이쪽 ± 는 묶음(fold) 사이의 표준오차</text><text x="30" y="384" font-size="11" fill="#7A8590" text-anchor="start">본문은 이 표에 「결과는 표 1 에 있다」만 적고 순위를 말하지 않는다. CIFAR-10 은 표에 없다. 제곱합은 두 값이 독립이라고 친 내 계산</text></svg>
