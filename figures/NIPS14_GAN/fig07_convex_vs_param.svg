<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="섞기 방향과 파라미터 방향의 볼록성"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">명제 2 는 p_g 공간의 볼록성에 기댄다 — 같은 C 가 파라미터 방향으로는 볼록하지 않다 (내가 계산한 예)</text><line x1="70" y1="320" x2="410" y2="320" stroke="#4E5964" stroke-width="1.2"/><line x1="70" y1="80" x2="70" y2="320" stroke="#4E5964" stroke-width="1.2"/><line x1="70" y1="320" x2="70" y2="324" stroke="#4E5964" stroke-width="1"/><text x="70" y="337" font-size="10" fill="#7A8590" text-anchor="middle">0</text><line x1="155.0" y1="320" x2="155.0" y2="324" stroke="#4E5964" stroke-width="1"/><text x="155.0" y="337" font-size="10" fill="#7A8590" text-anchor="middle">0.25</text><line x1="240.0" y1="320" x2="240.0" y2="324" stroke="#4E5964" stroke-width="1"/><text x="240.0" y="337" font-size="10" fill="#7A8590" text-anchor="middle">0.5</text><line x1="325.0" y1="320" x2="325.0" y2="324" stroke="#4E5964" stroke-width="1"/><text x="325.0" y="337" font-size="10" fill="#7A8590" text-anchor="middle">0.75</text><line x1="410" y1="320" x2="410" y2="324" stroke="#4E5964" stroke-width="1"/><text x="410" y="337" font-size="10" fill="#7A8590" text-anchor="middle">1</text><line x1="66" y1="320.0" x2="70" y2="320.0" stroke="#4E5964" stroke-width="1"/><text x="63" y="324.0" font-size="10" fill="#7A8590" text-anchor="end">-1.39</text><line x1="70" y1="320.0" x2="410" y2="320.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="66" y1="199.97451960032618" x2="70" y2="199.97451960032618" stroke="#4E5964" stroke-width="1"/><text x="63" y="203.97451960032618" font-size="10" fill="#7A8590" text-anchor="end">-0.69</text><line x1="70" y1="199.97451960032618" x2="410" y2="199.97451960032618" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="66" y1="80.0" x2="70" y2="80.0" stroke="#4E5964" stroke-width="1"/><text x="63" y="84.0" font-size="10" fill="#7A8590" text-anchor="end">0.00</text><line x1="70" y1="80.0" x2="410" y2="80.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="240.0" y="354" font-size="11" fill="#4E5964" text-anchor="middle">λ   (p_g = (1−λ)·N(4,1) + λ·N(0,1))</text><text x="70" y="70" font-size="11" fill="#4E5964" text-anchor="start">C(G)</text><path d="M70.0,100.9 L87.0,131.8 L104.0,153.0 L121.0,170.6 L138.0,185.9 L155.0,199.6 L172.0,211.9 L189.0,223.3 L206.0,233.7 L223.0,243.5 L240.0,252.6 L257.0,261.2 L274.0,269.2 L291.0,276.9 L308.0,284.1 L325.0,291.0 L342.0,297.5 L359.0,303.8 L376.0,309.6 L393.0,315.2 L410.0,320.0" fill="none" stroke="#1E8449" stroke-width="2.4"/><text x="240.0" y="54" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="bold">섞기 방향 — p_g 를 직접 움직인다</text><text x="404" y="100" font-size="11" fill="#1E8449" text-anchor="end">이계 차분 최소 0.0019 ≥ 0 : 볼록</text><line x1="500" y1="320" x2="840" y2="320" stroke="#4E5964" stroke-width="1.2"/><line x1="500" y1="80" x2="500" y2="320" stroke="#4E5964" stroke-width="1.2"/><line x1="500.0" y1="320" x2="500.0" y2="324" stroke="#4E5964" stroke-width="1"/><text x="500.0" y="337" font-size="10" fill="#7A8590" text-anchor="middle">0</text><line x1="556.6666666666666" y1="320" x2="556.6666666666666" y2="324" stroke="#4E5964" stroke-width="1"/><text x="556.6666666666666" y="337" font-size="10" fill="#7A8590" text-anchor="middle">1</text><line x1="613.3333333333334" y1="320" x2="613.3333333333334" y2="324" stroke="#4E5964" stroke-width="1"/><text x="613.3333333333334" y="337" font-size="10" fill="#7A8590" text-anchor="middle">2</text><line x1="670.0" y1="320" x2="670.0" y2="324" stroke="#4E5964" stroke-width="1"/><text x="670.0" y="337" font-size="10" fill="#7A8590" text-anchor="middle">3</text><line x1="726.6666666666666" y1="320" x2="726.6666666666666" y2="324" stroke="#4E5964" stroke-width="1"/><text x="726.6666666666666" y="337" font-size="10" fill="#7A8590" text-anchor="middle">4</text><line x1="783.3333333333334" y1="320" x2="783.3333333333334" y2="324" stroke="#4E5964" stroke-width="1"/><text x="783.3333333333334" y="337" font-size="10" fill="#7A8590" text-anchor="middle">5</text><line x1="840.0" y1="320" x2="840.0" y2="324" stroke="#4E5964" stroke-width="1"/><text x="840.0" y="337" font-size="10" fill="#7A8590" text-anchor="middle">6</text><line x1="496" y1="320.0" x2="500" y2="320.0" stroke="#4E5964" stroke-width="1"/><text x="493" y="324.0" font-size="10" fill="#7A8590" text-anchor="end">-1.39</text><line x1="500" y1="320.0" x2="840" y2="320.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="496" y1="199.97451960032618" x2="500" y2="199.97451960032618" stroke="#4E5964" stroke-width="1"/><text x="493" y="203.97451960032618" font-size="10" fill="#7A8590" text-anchor="end">-0.69</text><line x1="500" y1="199.97451960032618" x2="840" y2="199.97451960032618" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="496" y1="80.0" x2="500" y2="80.0" stroke="#4E5964" stroke-width="1"/><text x="493" y="84.0" font-size="10" fill="#7A8590" text-anchor="end">0.00</text><line x1="500" y1="80.0" x2="840" y2="80.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="670.0" y="354" font-size="11" fill="#4E5964" text-anchor="middle">m   (p_g = N(m, 1), 생성기 파라미터 하나)</text><text x="500" y="70" font-size="11" fill="#4E5964" text-anchor="start">C(G)</text><path d="M500.0,320.0 L514.2,317.3 L528.3,309.5 L542.5,297.2 L556.7,281.4 L570.8,263.1 L585.0,243.4 L599.2,223.2 L613.3,203.4 L627.5,184.5 L641.7,167.1 L655.8,151.4 L670.0,137.6 L684.2,125.8 L698.3,115.8 L712.5,107.6 L726.7,100.9 L740.8,95.6 L755.0,91.5 L769.2,88.3 L783.3,86.0 L797.5,84.2 L811.7,82.9 L825.8,82.0 L840.0,81.3" fill="none" stroke="#B4552B" stroke-width="2.4"/><line x1="592.0833333333334" y1="80" x2="592.0833333333334" y2="320" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="4 3"/><text x="598.0833333333334" y="308" font-size="11" fill="#C0392B" text-anchor="start">m ≈ 1.62 에서 굽는 방향이 바뀐다</text><text x="670.0" y="54" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="bold">파라미터 방향 — θ_g 를 움직인다</text><text x="440" y="374" font-size="11" fill="#7A8590" text-anchor="middle">왼쪽: C 는 p_g 에 대해 볼록하다 — 원문 증명이 쓰는 성질(두 분포 섞기로 확인). 오른쪽: 같은 C 를 평균 m 으로 재면 오목한 구간이 생긴다</text><text x="440" y="394" font-size="11" fill="#7A8590" text-anchor="middle">평균 이동 한 축만으로도 볼록성이 깨진다 — 논문이 「θ_g 를 최적화하므로 증명이 적용되지 않는다」고 적는 자리를 수로 옮긴 것</text></svg>
