<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="4절 증명의 사슬과 가정"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">4절 증명의 사슬 — 무엇이 어디서 가정되는가</text><rect x="20" y="60" width="158" height="70" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.5"/><text x="99" y="88" font-size="13" fill="#4E5964" text-anchor="middle" font-weight="bold">식 (1)</text><text x="99" y="110" font-size="11" fill="#1C232C" text-anchor="middle">min_G max_D V(D, G)</text><line x1="178" y1="95" x2="190" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="192" y="60" width="158" height="70" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="271" y="88" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">명제 1 · 식 (2)</text><text x="271" y="110" font-size="11" fill="#1C232C" text-anchor="middle">D* = p_data / (p_data + p_g)</text><line x1="350" y1="95" x2="362" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="364" y="60" width="158" height="70" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.5"/><text x="443" y="88" font-size="13" fill="#4E5964" text-anchor="middle" font-weight="bold">식 (4)</text><text x="443" y="110" font-size="11" fill="#1C232C" text-anchor="middle">C(G) = max_D V(G, D)</text><line x1="522" y1="95" x2="534" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="536" y="60" width="158" height="70" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="615" y="88" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">정리 1 · 식 (5)(6)</text><text x="615" y="110" font-size="11" fill="#1C232C" text-anchor="middle">C(G) = −log 4 + 2·JSD</text><line x1="694" y1="95" x2="706" y2="95" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="708" y="60" width="158" height="70" rx="6" fill="#DDEFE3" stroke="#1E8449" stroke-width="1.5"/><text x="787" y="88" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="bold">명제 2</text><text x="787" y="110" font-size="11" fill="#1C232C" text-anchor="middle">p_g → p_data</text><line x1="271" y1="132" x2="271" y2="156" stroke="#9A7B00" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="192" y="158" width="158" height="78" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="271" y="180" font-size="11" fill="#1C232C" text-anchor="middle">D 는 아무 함수나 된다</text><text x="271" y="201" font-size="11" fill="#1C232C" text-anchor="middle">두 받침의 합집합 밖은</text><text x="271" y="222" font-size="11" fill="#1C232C" text-anchor="middle">정의하지 않아도 된다</text><line x1="615" y1="132" x2="615" y2="156" stroke="#9A7B00" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="536" y="158" width="158" height="78" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="615" y="180" font-size="11" fill="#1C232C" text-anchor="middle">밀도 함수 공간에서</text><text x="615" y="201" font-size="11" fill="#1C232C" text-anchor="middle">(비모수 설정, 무한 용량)</text><text x="615" y="222" font-size="11" fill="#1C232C" text-anchor="middle">JSD ≥ 0, 같을 때만 0</text><line x1="787" y1="132" x2="787" y2="156" stroke="#9A7B00" stroke-width="1.2" stroke-dasharray="3 3"/><rect x="708" y="158" width="158" height="78" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="787" y="180" font-size="11" fill="#1C232C" text-anchor="middle">G, D 가 충분한 용량</text><text x="787" y="201" font-size="11" fill="#1C232C" text-anchor="middle">매 걸음 D 가 최적에 닿는다</text><text x="787" y="222" font-size="11" fill="#1C232C" text-anchor="middle">p_g 를 직접, 작게 갱신</text><text x="20" y="270" font-size="11" fill="#7A8590" text-anchor="start">가정 (노랑) 은 원문 명제 · 정리 · 증명에 적힌 것을 옮겼다</text><rect x="20" y="290" width="840" height="120" rx="6" fill="#F2DED2" stroke="#C0392B" stroke-width="1.5"/><text x="40" y="316" font-size="13" fill="#C0392B" text-anchor="start" font-weight="bold">실제 학습과의 거리 — 논문 4.2 끝이 스스로 적는다</text><text x="40" y="344" font-size="12" fill="#1C232C" text-anchor="start">「실제로는 G(z; θ_g) 가 나타내는 제한된 p_g 가족을 쓰고, p_g 자체가 아니라 θ_g 를 최적화하므로 증명이 적용되지 않는다」</text><text x="40" y="368" font-size="12" fill="#4E5964" text-anchor="start">그리고 알고리즘 1 은 k = 1 — 판별기가 매 걸음 최적에 닿는다는 명제 2 의 가정과도 다르다 (이 줄은 내가 맞춘 것)</text><text x="40" y="392" font-size="12" fill="#4E5964" text-anchor="start">논문이 대신 드는 근거: 「실제로 다층 퍼셉트론의 성능이 뛰어나다」 — 잰 값이 붙은 문장이 아니다</text></svg>
