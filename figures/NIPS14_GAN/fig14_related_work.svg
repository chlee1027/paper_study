<svg xmlns="http://www.w3.org/2000/svg" width="900" height="460" viewBox="0 0 900 460" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="관련 연구와의 차이"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">2절 — 원문이 견주는 여섯과 GAN 과의 차이 (원문 문장을 줄여 옮겼다)</text><text x="42" y="62" font-size="12" fill="#7A8590" text-anchor="start" font-weight="bold">편</text><text x="250" y="62" font-size="12" fill="#7A8590" text-anchor="start" font-weight="bold">그 방법</text><text x="580" y="62" font-size="12" fill="#7A8590" text-anchor="start" font-weight="bold">GAN 이 다른 점</text><rect x="30" y="74" width="840" height="52" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="42" y="105" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">깊은 볼츠만 기계</text><text x="250" y="96" font-size="11" fill="#4E5964" text-anchor="start">가능도를 식으로 적는다</text><text x="250" y="114" font-size="11" fill="#4E5964" text-anchor="start">기울기에 근사가 많이 든다</text><text x="580" y="105" font-size="11" fill="#B4552B" text-anchor="start">가능도를 적지 않는다</text><rect x="30" y="134" width="840" height="52" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="42" y="165" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">생성 확률망 (GSN)</text><text x="250" y="156" font-size="11" fill="#4E5964" text-anchor="start">가능도 없이 표본을 내는 「생성 기계」</text><text x="250" y="174" font-size="11" fill="#4E5964" text-anchor="start">정확한 역전파로 학습</text><text x="580" y="165" font-size="11" fill="#B4552B" text-anchor="start">마르코프 사슬까지 없앴다</text><rect x="30" y="194" width="840" height="52" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="42" y="225" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">VAE (Kingma · Rezende)</text><text x="250" y="216" font-size="11" fill="#4E5964" text-anchor="start">미분되는 생성망 + 둘째 망</text><text x="250" y="234" font-size="11" fill="#4E5964" text-anchor="start">둘째 망은 인식 모델(근사 추론)</text><text x="580" y="216" font-size="11" fill="#B4552B" text-anchor="start">둘째 망이 판별기다</text><text x="580" y="234" font-size="11" fill="#B4552B" text-anchor="start">GAN 은 이산 데이터 불가 / VAE 는 이산 잠재 불가</text><rect x="30" y="254" width="840" height="52" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="42" y="285" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">잡음 대조 추정 (NCE)</text><text x="250" y="276" font-size="11" fill="#4E5964" text-anchor="start">고정된 잡음 분포와 데이터를 가르며 학습</text><text x="250" y="294" font-size="11" fill="#4E5964" text-anchor="start">판별 기준이 두 밀도의 비</text><text x="580" y="276" font-size="11" fill="#B4552B" text-anchor="start">두 밀도를 계산하고</text><text x="580" y="294" font-size="11" fill="#B4552B" text-anchor="start">미분할 필요가 없다</text><rect x="30" y="314" width="840" height="52" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="42" y="345" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">예측 가능성 최소화</text><text x="250" y="336" font-size="11" fill="#4E5964" text-anchor="start">은닉 유닛이 다른 망의 예측과 다르게</text><text x="250" y="354" font-size="11" fill="#4E5964" text-anchor="start">다른 과제에 붙는 정칙화 항</text><text x="580" y="336" font-size="11" fill="#B4552B" text-anchor="start">경쟁이 유일한 기준 · 고차원 벡터 입력</text><text x="580" y="354" font-size="11" fill="#B4552B" text-anchor="start">최적화가 아니라 최소최대 게임</text><rect x="30" y="374" width="840" height="52" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="42" y="405" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">적대적 예시</text><text x="250" y="396" font-size="11" fill="#4E5964" text-anchor="start">분류기 입력을 기울기로 바꿔</text><text x="250" y="414" font-size="11" fill="#4E5964" text-anchor="start">틀리게 만드는 분석 도구</text><text x="580" y="396" font-size="11" fill="#B4552B" text-anchor="start">생성 모델 학습 장치가 아니다</text><text x="580" y="414" font-size="11" fill="#B4552B" text-anchor="start">(GAN 학습이 비효율일 수 있음을 시사)</text><text x="450" y="446" font-size="11" fill="#7A8590" text-anchor="middle">VAE 문단은 「이 일을 할 때 Kingma · Welling 과 Rezende 외의 규칙을 몰랐다」로 시작한다 — 두 편이 같은 시기에 나왔다는 것을 원문이 밝힌다</text></svg>
