<svg xmlns="http://www.w3.org/2000/svg" width="760" height="270" viewBox="0 0 760 270" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="퍼셉트론은 감각 층 S, 연합 층 A, 반응 층 R 로 되어 있고 S 에서 A 로 가는 연결은 무작위로 고정이며 A 에서 R 로 가는 가중치만 학습한다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7A8590"/></marker><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="380" y="26" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">퍼셉트론의 세 층 — 배우는 것은 마지막 한 줄뿐이다</text><circle cx="90" cy="70" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="90" cy="110" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="90" cy="150" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="90" cy="190" r="15" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="330" cy="70" r="18" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="330" y="75" font-size="12" fill="#1C232C" text-anchor="middle">A1</text><circle cx="330" cy="120" r="18" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="330" y="125" font-size="12" fill="#1C232C" text-anchor="middle">A2</text><circle cx="330" cy="170" r="18" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="330" y="175" font-size="12" fill="#1C232C" text-anchor="middle">A3</text><circle cx="600" cy="120" r="24" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="600" y="125" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">R</text><line x1="105" y1="70" x2="312" y2="70" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="70" x2="312" y2="120" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="70" x2="312" y2="170" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="110" x2="312" y2="70" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="110" x2="312" y2="120" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="110" x2="312" y2="170" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="150" x2="312" y2="70" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="150" x2="312" y2="120" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="150" x2="312" y2="170" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="190" x2="312" y2="70" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="190" x2="312" y2="120" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="105" y1="190" x2="312" y2="170" stroke="#7A8590" stroke-width="0.8" opacity="0.55"/><line x1="348" y1="70" x2="576" y2="120" stroke="#B4552B" stroke-width="2.2" marker-end="url(#a2)"/><line x1="348" y1="120" x2="576" y2="120" stroke="#B4552B" stroke-width="2.2" marker-end="url(#a2)"/><line x1="348" y1="170" x2="576" y2="120" stroke="#B4552B" stroke-width="2.2" marker-end="url(#a2)"/><text x="90" y="232" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">감각 층 S</text><text x="90" y="250" font-size="11.5" fill="#7A8590" text-anchor="middle">빛이 닿는 자리</text><text x="330" y="232" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">연합 층 A</text><text x="330" y="250" font-size="11.5" fill="#7A8590" text-anchor="middle">S 에서 무작위로 연결</text><text x="600" y="232" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">반응 층 R</text><text x="600" y="250" font-size="11.5" fill="#7A8590" text-anchor="middle">0 또는 1 을 낸다</text><text x="210" y="45" font-size="12" fill="#7A8590" text-anchor="middle">고정 · 학습하지 않는다</text><text x="462" y="42" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">학습되는 가중치 w — 이 한 줄만 바뀐다</text></svg>
