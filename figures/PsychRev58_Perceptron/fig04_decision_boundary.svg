<svg xmlns="http://www.w3.org/2000/svg" width="760" height="268" viewBox="0 0 760 268" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="퍼셉트론의 결정 경계는 직선 하나이고 가중치 벡터가 그 직선의 법선이다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="380" y="26" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">퍼셉트론이 그을 수 있는 경계는 직선 하나뿐이다</text><line x1="120" y1="230" x2="420" y2="230" stroke="#1C232C" stroke-width="1"/><line x1="140" y1="60" x2="140" y2="246" stroke="#1C232C" stroke-width="1"/><text x="425" y="234" font-size="12" fill="#1C232C" text-anchor="start">x₁</text><text x="136" y="54" font-size="12" fill="#1C232C" text-anchor="end">x₂</text><line x1="160" y1="222" x2="402" y2="74" stroke="#1C232C" stroke-width="2.4"/><text x="392" y="62" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">w·x = θ</text><circle cx="190" cy="190" r="7" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><circle cx="230" cy="205" r="7" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><circle cx="215" cy="160" r="7" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><circle cx="170" cy="210" r="7" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><circle cx="255" cy="178" r="7" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><rect x="314" y="134" width="13" height="13" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><rect x="354" y="154" width="13" height="13" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><rect x="324" y="94" width="13" height="13" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><rect x="374" y="114" width="13" height="13" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><rect x="294" y="89" width="13" height="13" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="196" y="252" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">출력 0 (경계 아래)</text><text x="345" y="78" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">출력 1 (경계 위)</text><line x1="281" y1="148" x2="330" y2="192" stroke="#B4552B" stroke-width="2.2" marker-start="url(#a4)"/><text x="322" y="214" font-size="11.5" fill="#B4552B" text-anchor="middle">w 는 경계의 법선</text><text x="600" y="70" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">이것이 할 수 있는 전부다</text><text x="600" y="100" font-size="12" fill="#4E5964" text-anchor="middle">· 평면을 직선 하나로 가른다</text><text x="600" y="124" font-size="12" fill="#4E5964" text-anchor="middle">· 입력이 n 개면 n 차원의</text><text x="600" y="146" font-size="12" fill="#4E5964" text-anchor="middle">  평평한 칸막이 하나</text><text x="600" y="176" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="600">· 굽은 경계는 만들 수 없다</text><text x="600" y="206" font-size="11.8" fill="#4E5964" text-anchor="middle">그래서 "직선으로 갈리는 문제"만</text><text x="600" y="226" font-size="11.8" fill="#4E5964" text-anchor="middle">풀 수 있다. 다음 그림이 그 경계다.</text></svg>
