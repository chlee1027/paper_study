<svg xmlns="http://www.w3.org/2000/svg" width="760" height="326" viewBox="0 0 760 326" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="한 층은 직선 하나만 긋고 두 층은 굽은 경계를 만들지만 은닉층에는 정답이 없어 1958년의 규칙을 쓸 수 없다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C232C"/></marker><marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="380" y="26" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">층을 하나 더 쌓으면 풀린다. 그런데 안쪽 가중치를 무엇으로 고치나</text><rect x="40" y="70" width="300" height="150" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="190" y="96" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">한 층 (1958)</text><circle cx="100" cy="140" r="14" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="100" cy="185" r="14" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="250" cy="162" r="18" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><line x1="114" y1="140" x2="230" y2="162" stroke="#B4552B" stroke-width="2" marker-end="url(#a8)"/><line x1="114" y1="185" x2="230" y2="162" stroke="#B4552B" stroke-width="2" marker-end="url(#a8)"/><text x="190" y="206" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">직선 하나 · XOR 못 푼다</text><rect x="420" y="70" width="300" height="150" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="570" y="96" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">두 층 (1986)</text><circle cx="460" cy="140" r="13" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="460" cy="185" r="13" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="570" cy="130" r="13" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><line x1="473" y1="140" x2="556" y2="130" stroke="#7A8590" stroke-width="1.6"/><line x1="473" y1="185" x2="556" y2="130" stroke="#7A8590" stroke-width="1.6"/><line x1="583" y1="130" x2="668" y2="165" stroke="#B4552B" stroke-width="1.8" marker-end="url(#a8)"/><circle cx="570" cy="165" r="13" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><line x1="473" y1="140" x2="556" y2="165" stroke="#7A8590" stroke-width="1.6"/><line x1="473" y1="185" x2="556" y2="165" stroke="#7A8590" stroke-width="1.6"/><line x1="583" y1="165" x2="668" y2="165" stroke="#B4552B" stroke-width="1.8" marker-end="url(#a8)"/><circle cx="570" cy="200" r="13" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><line x1="473" y1="140" x2="556" y2="200" stroke="#7A8590" stroke-width="1.6"/><line x1="473" y1="185" x2="556" y2="200" stroke="#7A8590" stroke-width="1.6"/><line x1="583" y1="200" x2="668" y2="165" stroke="#B4552B" stroke-width="1.8" marker-end="url(#a8)"/><circle cx="682" cy="165" r="16" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="570" y="116" font-size="11.5" fill="#4E5964" text-anchor="middle">은닉층</text><text x="570" y="234" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="600">굽은 경계 · XOR 풀린다</text><text x="515" y="256" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="600">그런데 은닉층의 가중치는 정답이 없다</text><text x="190" y="256" font-size="12" fill="#4E5964" text-anchor="middle">정답이 바로 옆에 있어 규칙이 성립</text><text x="380" y="290" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">이 빈칸을 채운 것이 1986년 역전파다. 오차를 연쇄 법칙으로 뒤로 보내 층마다 몫을 나눈다.</text><text x="380" y="312" font-size="11.8" fill="#4E5964" text-anchor="middle">그러려면 활성 함수의 기울기가 0이 아니어야 한다 — 그림 3이 왜 문제였는지가 여기서 이어진다.</text></svg>
