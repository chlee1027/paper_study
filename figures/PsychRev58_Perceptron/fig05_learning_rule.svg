<svg xmlns="http://www.w3.org/2000/svg" width="760" height="292" viewBox="0 0 760 292" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="맞히면 그대로 두고 틀린 예가 나올 때만 그 입력 방향으로 가중치를 옮긴다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="380" y="26" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">학습 규칙 — 틀린 예가 있으면 그쪽으로 경계를 민다</text><line x1="60" y1="215" x2="330" y2="215" stroke="#1C232C" stroke-width="1"/><line x1="80" y1="60" x2="80" y2="228" stroke="#1C232C" stroke-width="1"/><text x="195" y="50" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">틀렸을 때</text><line x1="430" y1="215" x2="700" y2="215" stroke="#1C232C" stroke-width="1"/><line x1="450" y1="60" x2="450" y2="228" stroke="#1C232C" stroke-width="1"/><text x="565" y="50" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="600">고친 뒤</text><line x1="70" y1="200" x2="300" y2="80" stroke="#1C232C" stroke-width="2.2"/><circle cx="235" cy="170" r="8" fill="#F2DED2" stroke="#C0392B" stroke-width="2"/><text x="235" y="195" font-size="11.5" fill="#C0392B" text-anchor="middle">정답 1 인데 0 이라 함</text><line x1="440" y1="212" x2="670" y2="74" stroke="#1C232C" stroke-width="2.2"/><line x1="440" y1="200" x2="670" y2="80" stroke="#7A8590" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.6"/><circle cx="605" cy="170" r="8" fill="#F2DED2" stroke="#1E8449" stroke-width="2"/><text x="605" y="195" font-size="11.5" fill="#1E8449" text-anchor="middle">이제 맞는 쪽에 있다</text><path d="M330,140 C360,140 370,140 395,140" fill="none" stroke="#1E8449" stroke-width="2" marker-end="url(#a6)"/><text x="363" y="128" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="600">갱신</text><text x="248" y="254" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">w ← w + η (y − ŷ) x</text><line x1="380" y1="238" x2="380" y2="262" stroke="#CFD6D3" stroke-width="1"/><text x="512" y="254" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">θ ← θ − η (y − ŷ)</text><text x="380" y="278" font-size="11.8" fill="#4E5964" text-anchor="middle">맞히면 y − ŷ = 0 이라 아무것도 하지 않는다. 틀렸을 때만 그 입력 x 의 방향으로 w 를 옮긴다.</text></svg>
