<svg xmlns="http://www.w3.org/2000/svg" width="760" height="298" viewBox="0 0 760 298" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="AND 와 OR 는 직선 하나로 갈리지만 XOR 는 1 인 두 점이 대각선으로 마주 보아 직선 하나로 갈리지 않는다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="380" y="26" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">핵심 한계 — 직선 하나로 갈리지 않는 문제가 있다</text><line x1="42" y1="200" x2="210" y2="200" stroke="#1C232C" stroke-width="1"/><line x1="60" y1="72" x2="60" y2="216" stroke="#1C232C" stroke-width="1"/><text x="126" y="56" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="600">AND — 갈린다</text><line x1="95" y1="90" x2="200" y2="208" stroke="#1E8449" stroke-width="2.4"/><circle cx="60" cy="200" r="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.8"/><circle cx="60" cy="90" r="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.8"/><circle cx="170" cy="200" r="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.8"/><rect x="163" y="83" width="15" height="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.8"/><text x="56" y="216" font-size="11" fill="#7A8590" text-anchor="middle">0</text><text x="170" y="216" font-size="11" fill="#7A8590" text-anchor="middle">1</text><text x="48" y="96" font-size="11" fill="#7A8590" text-anchor="middle">1</text><line x1="297" y1="200" x2="465" y2="200" stroke="#1C232C" stroke-width="1"/><line x1="315" y1="72" x2="315" y2="216" stroke="#1C232C" stroke-width="1"/><text x="381" y="56" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="600">OR — 갈린다</text><line x1="296" y1="136" x2="376" y2="216" stroke="#1E8449" stroke-width="2.4"/><circle cx="315" cy="200" r="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.8"/><rect x="308" y="83" width="15" height="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.8"/><rect x="418" y="193" width="15" height="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.8"/><rect x="418" y="83" width="15" height="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.8"/><text x="311" y="216" font-size="11" fill="#7A8590" text-anchor="middle">0</text><text x="425" y="216" font-size="11" fill="#7A8590" text-anchor="middle">1</text><text x="303" y="96" font-size="11" fill="#7A8590" text-anchor="middle">1</text><line x1="552" y1="200" x2="720" y2="200" stroke="#1C232C" stroke-width="1"/><line x1="570" y1="72" x2="570" y2="216" stroke="#1C232C" stroke-width="1"/><text x="636" y="56" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="600">XOR — 갈리지 않는다</text><circle cx="570" cy="200" r="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.8"/><rect x="563" y="83" width="15" height="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.8"/><rect x="673" y="193" width="15" height="15" fill="#F2DED2" stroke="#B4552B" stroke-width="1.8"/><circle cx="680" cy="90" r="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.8"/><text x="566" y="216" font-size="11" fill="#7A8590" text-anchor="middle">0</text><text x="680" y="216" font-size="11" fill="#7A8590" text-anchor="middle">1</text><text x="558" y="96" font-size="11" fill="#7A8590" text-anchor="middle">1</text><line x1="600" y1="180" x2="700" y2="90" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4" opacity="0.8"/><line x1="600" y1="100" x2="700" y2="190" stroke="#C0392B" stroke-width="2" stroke-dasharray="5 4" opacity="0.8"/><text x="650" y="236" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">어느 직선을 그어도</text><text x="650" y="252" font-size="11.5" fill="#C0392B" text-anchor="middle">네모 둘이 같은 쪽에 안 온다</text><text x="146" y="244" font-size="11.5" fill="#2E6B8A" text-anchor="middle">원 = 출력 0</text><text x="146" y="260" font-size="11.5" fill="#B4552B" text-anchor="middle">네모 = 출력 1</text><text x="380" y="284" font-size="12" fill="#4E5964" text-anchor="middle">XOR 는 같은 값이면 0, 다르면 1 이다. 1 인 두 점이 대각선으로 마주 보고 있어 직선 하나로는 떼어 낼 수 없다.</text></svg>
