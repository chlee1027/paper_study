<svg xmlns="http://www.w3.org/2000/svg" width="760" height="252" viewBox="0 0 760 252" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계단 함수는 문턱 앞뒤로 평평해 기울기가 0이고 문턱에서는 정의되지 않는다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="380" y="26" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">계단 함수 — 이 모양이 뒤에서 발목을 잡는다</text><line x1="80" y1="150" x2="350" y2="150" stroke="#1C232C" stroke-width="1"/><line x1="215" y1="60" x2="215" y2="168" stroke="#1C232C" stroke-width="1"/><path d="M85,150 L215,150" stroke="#B4552B" stroke-width="2.6" fill="none"/><path d="M215,80 L345,80" stroke="#B4552B" stroke-width="2.6" fill="none"/><line x1="215" y1="150" x2="215" y2="80" stroke="#B4552B" stroke-width="2.6" stroke-dasharray="4 3"/><circle cx="215" cy="80" r="4" fill="#B4552B"/><text x="215" y="184" font-size="12" fill="#1C232C" text-anchor="middle">문턱 θ</text><text x="70" y="84" font-size="12" fill="#1C232C" text-anchor="middle">1</text><text x="70" y="154" font-size="12" fill="#1C232C" text-anchor="middle">0</text><text x="345" y="184" font-size="12" fill="#1C232C" text-anchor="middle">z</text><line x1="430" y1="150" x2="700" y2="150" stroke="#1C232C" stroke-width="1"/><line x1="565" y1="60" x2="565" y2="168" stroke="#1C232C" stroke-width="1"/><path d="M435,150 L560,150" stroke="#7A8590" stroke-width="2.6"/><path d="M570,150 L695,150" stroke="#7A8590" stroke-width="2.6"/><line x1="565" y1="150" x2="565" y2="72" stroke="#C0392B" stroke-width="2.6"/><text x="565" y="66" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="600">∞</text><text x="500" y="136" font-size="12" fill="#7A8590" text-anchor="middle">기울기 0</text><text x="640" y="136" font-size="12" fill="#7A8590" text-anchor="middle">기울기 0</text><text x="565" y="184" font-size="11.5" fill="#C0392B" text-anchor="middle">θ 에서만 정의되지 않는다</text><text x="215" y="210" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">출력</text><text x="565" y="210" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">기울기</text><text x="380" y="238" font-size="11.8" fill="#4E5964" text-anchor="middle">어디서나 기울기가 0이라 "얼마나 틀렸는지"가 뒤로 흐르지 못한다. 그래서 층을 쌓아도 안쪽을 고칠 길이 없다.</text></svg>
