<svg xmlns="http://www.w3.org/2000/svg" width="760" height="264" viewBox="0 0 760 264" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="입력마다 가중치를 곱해 더한 값이 문턱을 넘으면 1, 넘지 못하면 0 을 낸다"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1C232C"/></marker></defs><text x="380" y="26" font-size="13.5" fill="#1C232C" text-anchor="middle" font-weight="600">소자 하나가 하는 일 — 더하고, 문턱을 넘었는지 본다</text><rect x="40" y="54" width="56" height="32" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><text x="68" y="75" font-size="12.5" fill="#1C232C" text-anchor="middle">x₁</text><line x1="96" y1="70" x2="266" y2="130" stroke="#4E5964" stroke-width="1.6" marker-end="url(#a3)"/><text x="150" y="82.05882352941177" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">w₁</text><rect x="40" y="94" width="56" height="32" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><text x="68" y="115" font-size="12.5" fill="#1C232C" text-anchor="middle">x₂</text><line x1="96" y1="110" x2="266" y2="130" stroke="#4E5964" stroke-width="1.6" marker-end="url(#a3)"/><text x="150" y="109.3529411764706" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">w₂</text><rect x="40" y="134" width="56" height="32" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><text x="68" y="155" font-size="12.5" fill="#1C232C" text-anchor="middle">x₃</text><line x1="96" y1="150" x2="266" y2="130" stroke="#4E5964" stroke-width="1.6" marker-end="url(#a3)"/><text x="150" y="136.64705882352942" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">w₃</text><rect x="40" y="174" width="56" height="32" rx="5" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.1"/><text x="68" y="195" font-size="12.5" fill="#1C232C" text-anchor="middle">x₄</text><line x1="96" y1="190" x2="266" y2="130" stroke="#4E5964" stroke-width="1.6" marker-end="url(#a3)"/><text x="150" y="163.94117647058823" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">w₄</text><circle cx="300" cy="130" r="30" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="300" y="137" font-size="22" fill="#2E6B8A" text-anchor="middle">Σ</text><text x="300" y="180" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="600">가중합 z</text><line x1="330" y1="130" x2="404" y2="130" stroke="#4E5964" stroke-width="1.6" marker-end="url(#a3)"/><rect x="410" y="96" width="130" height="68" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="475" y="124" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">계단 함수</text><text x="475" y="146" font-size="11.5" fill="#B4552B" text-anchor="middle">z ≥ θ 면 1, 아니면 0</text><line x1="540" y1="130" x2="604" y2="130" stroke="#4E5964" stroke-width="1.6" marker-end="url(#a3)"/><rect x="610" y="108" width="110" height="44" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="665" y="136" font-size="12.5" fill="#B4552B" text-anchor="middle">출력 ŷ ∈ {0, 1}</text><text x="380" y="224" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="600">z = w₁x₁ + w₂x₂ + w₃x₃ + w₄x₄ − θ</text><text x="380" y="248" font-size="11.5" fill="#4E5964" text-anchor="middle">작은 예시: w = (0.6, −0.2), θ = 0.3, x = (1, 1) 이면 z = 0.6 − 0.2 − 0.3 = 0.1 ≥ 0 이라 ŷ = 1</text></svg>
