<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="WRN-n-k 의 구조와 이름 붙이기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">WRN-n-k 의 모양 (표 1) — 단계 셋, 단계마다 블록 N 개, 폭은 16k · 32k · 64k</text><rect x="25" y="60" width="140" height="110" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="95" y="84" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">conv1</text><text x="95" y="108" font-size="12" fill="#1C232C" text-anchor="middle">3x3, 16</text><text x="95" y="130" font-size="11" fill="#4E5964" text-anchor="middle">출력 32x32</text><text x="95" y="154" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">1 층</text><line x1="165" y1="115" x2="180" y2="115" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="182" y="60" width="140" height="110" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="252" y="84" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">conv2</text><text x="252" y="108" font-size="12" fill="#1C232C" text-anchor="middle">[3x3, 16k] x2</text><text x="252" y="130" font-size="11" fill="#4E5964" text-anchor="middle">출력 32x32</text><text x="252" y="154" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">x N</text><line x1="322" y1="115" x2="337" y2="115" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="339" y="60" width="140" height="110" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="409" y="84" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">conv3</text><text x="409" y="108" font-size="12" fill="#1C232C" text-anchor="middle">[3x3, 32k] x2</text><text x="409" y="130" font-size="11" fill="#4E5964" text-anchor="middle">출력 16x16</text><text x="409" y="154" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">x N</text><line x1="479" y1="115" x2="494" y2="115" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="496" y="60" width="140" height="110" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="566" y="84" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">conv4</text><text x="566" y="108" font-size="12" fill="#1C232C" text-anchor="middle">[3x3, 64k] x2</text><text x="566" y="130" font-size="11" fill="#4E5964" text-anchor="middle">출력 8x8</text><text x="566" y="154" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">x N</text><line x1="636" y1="115" x2="651" y2="115" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><rect x="653" y="60" width="140" height="110" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="723" y="84" font-size="13" fill="#4E5964" text-anchor="middle" font-weight="bold">평균 풀링 · fc</text><text x="723" y="108" font-size="12" fill="#1C232C" text-anchor="middle">[8x8] → 부류</text><text x="723" y="130" font-size="11" fill="#4E5964" text-anchor="middle">출력 1x1</text><text x="723" y="154" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold"></text><text x="25" y="205" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">이름 붙이기 — n 은 합성곱 층 수다 (논문 2.3절). 블록이 B(3,3) 일 때:</text><text x="45" y="232" font-size="13" fill="#1C232C" text-anchor="start">n = 1 (conv1)  +  3 단계 x N 블록 x 2 층  +  3 (단계 첫 블록의 1x1 사영 지름길)  =  6N + 4</text><rect x="45" y="250" width="175" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="132" y="272" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">WRN-16-k</text><text x="132" y="293" font-size="11" fill="#4E5964" text-anchor="middle">N = 2  (6 x 2 + 4 = 16)</text><rect x="235" y="250" width="175" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="322" y="272" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">WRN-22-k</text><text x="322" y="293" font-size="11" fill="#4E5964" text-anchor="middle">N = 3  (6 x 3 + 4 = 22)</text><rect x="425" y="250" width="175" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="512" y="272" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">WRN-28-k</text><text x="512" y="293" font-size="11" fill="#4E5964" text-anchor="middle">N = 4  (6 x 4 + 4 = 28)</text><rect x="615" y="250" width="175" height="54" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="702" y="272" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">WRN-40-k</text><text x="702" y="293" font-size="11" fill="#4E5964" text-anchor="middle">N = 6  (6 x 6 + 4 = 40)</text><text x="25" y="336" font-size="12" fill="#1C232C" text-anchor="start">작은 예시 — WRN-28-10: N = 4, 폭 160 · 320 · 640, 이 파일이 센 파라미터 36,479,194 (논문 36.5M)</text><text x="25" y="360" font-size="11" fill="#C0392B" text-anchor="start">주의 하나. k = 1 이면 conv2 첫 블록에 사영이 필요 없어 실제 합성곱은 6N + 3 이다(WRN-40-1 은 39 층). 이름은 그대로 40 이다</text><text x="25" y="382" font-size="11" fill="#C0392B" text-anchor="start">주의 둘. 표 5 의 가는 망 ResNet-164 · 1001 은 다른 규칙(9N + 2, fc 를 세고 사영은 안 센다)으로 이름이 붙어 있다</text><text x="25" y="404" font-size="11" fill="#7A8590" text-anchor="start">드롭아웃 위치 · BN 순서는 그림 1. 이 그림의 값은 논문 표 1 을 그대로 옮기고 n 의 셈만 내가 풀어 적었다</text></svg>
