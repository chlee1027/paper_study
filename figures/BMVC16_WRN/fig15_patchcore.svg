<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="PatchCore 가 쓰는 WRN-50-2 의 단계"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">PatchCore 가 쓰는 자리 — layer2 · layer3 의 출력 (224 입력). 넓혀도 특징의 차원은 ResNet-50 과 같다</text><rect x="60.199999999999996" y="90.19999999999999" width="119.60000000000001" height="119.60000000000001" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1"/><text x="120" y="60" font-size="13" fill="#7A8590" text-anchor="middle" font-weight="bold">layer1</text><text x="120" y="250" font-size="12" fill="#1C232C" text-anchor="middle">256 채널 x 56x56</text><text x="120" y="270" font-size="11" fill="#4E5964" text-anchor="middle">보폭 누적 4</text><text x="120" y="290" font-size="10" fill="#7A8590" text-anchor="middle">파라미터 0.6M (R50 0.2M)</text><rect x="277.6" y="112.6" width="74.80000000000001" height="74.80000000000001" rx="6" fill="#F2DED2" stroke="#EB6834" stroke-width="2"/><text x="315" y="60" font-size="13" fill="#EB6834" text-anchor="middle" font-weight="bold">layer2</text><text x="315" y="250" font-size="12" fill="#1C232C" text-anchor="middle">512 채널 x 28x28</text><text x="315" y="270" font-size="11" fill="#4E5964" text-anchor="middle">보폭 누적 8</text><text x="315" y="290" font-size="10" fill="#7A8590" text-anchor="middle">파라미터 3.5M (R50 1.2M)</text><rect x="483.8" y="123.8" width="52.400000000000006" height="52.400000000000006" rx="6" fill="#F2DED2" stroke="#EB6834" stroke-width="2"/><text x="510" y="60" font-size="13" fill="#EB6834" text-anchor="middle" font-weight="bold">layer3</text><text x="510" y="250" font-size="12" fill="#1C232C" text-anchor="middle">1024 채널 x 14x14</text><text x="510" y="270" font-size="11" fill="#4E5964" text-anchor="middle">보폭 누적 16</text><text x="510" y="290" font-size="10" fill="#7A8590" text-anchor="middle">파라미터 20.7M (R50 7.1M)</text><rect x="684.4" y="129.4" width="41.2" height="41.2" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1"/><text x="705" y="60" font-size="13" fill="#7A8590" text-anchor="middle" font-weight="bold">layer4</text><text x="705" y="250" font-size="12" fill="#1C232C" text-anchor="middle">2048 채널 x 7x7</text><text x="705" y="270" font-size="11" fill="#4E5964" text-anchor="middle">보폭 누적 32</text><text x="705" y="290" font-size="10" fill="#7A8590" text-anchor="middle">파라미터 42.0M (R50 15.0M)</text><rect x="30" y="310" width="370" height="110" rx="6" fill="#F6F7F5" stroke="#EB6834" stroke-width="1.2"/><text x="45" y="334" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">논문이 말한 것</text><text x="45" y="356" font-size="11" fill="#4E5964" text-anchor="start">ImageNet 에서는 같은 깊이에서 폭이 더 있어야 같은 정확도에</text><text x="45" y="378" font-size="11" fill="#4E5964" text-anchor="start">닿는다(표 7 · 8). WRN-50-2 가 ResNet-152 보다 top-1 0.26 낮다.</text><text x="45" y="400" font-size="11" fill="#4E5964" text-anchor="start">특징 추출 · 이상 탐지에 대해서는 아무 말도 하지 않는다</text><rect x="420" y="310" width="380" height="110" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.2" stroke-dasharray="5,4"/><text x="435" y="334" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">내 추측 (재지 않았다)</text><text x="435" y="356" font-size="11" fill="#4E5964" text-anchor="start">출력 채널(512 + 1,024 = 1,536)은 그대로이고 안쪽 폭만</text><text x="435" y="378" font-size="11" fill="#4E5964" text-anchor="start">두 배라, 기억 뱅크 크기는 그대로 둔 채 같은 차원에 더 많은</text><text x="435" y="400" font-size="11" fill="#4E5964" text-anchor="start">필터를 거친 특징을 얻는 쪽이다. 몫은 ResNet-50 과 바꿔 재야 안다</text></svg>
