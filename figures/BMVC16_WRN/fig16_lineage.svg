<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="Wide ResNet 의 계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 깊이를 늘리던 흐름에서 폭으로 돌아선 자리</text><rect x="40" y="44" width="330" height="52" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="205" y="65" font-size="13" fill="#4E5964" text-anchor="middle" font-weight="bold">Highway (2015-05)</text><text x="205" y="85" font-size="11" fill="#4E5964" text-anchor="middle">게이트 지름길 · 특징 재사용 감소라는 말</text><rect x="40" y="124" width="330" height="52" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.6"/><text x="205" y="145" font-size="13" fill="#2A78D6" text-anchor="middle" font-weight="bold">ResNet (2015-12)</text><text x="205" y="165" font-size="11" fill="#4E5964" text-anchor="middle">항등 지름길, 병목으로 가늘게</text><rect x="40" y="204" width="330" height="52" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.6"/><text x="205" y="225" font-size="13" fill="#2A78D6" text-anchor="middle" font-weight="bold">사전 활성 ResNet (2016-03)</text><text x="205" y="245" font-size="11" fill="#4E5964" text-anchor="middle">BN-ReLU-합성곱, 1001 층</text><rect x="40" y="284" width="330" height="52" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.6"/><text x="205" y="305" font-size="13" fill="#2A78D6" text-anchor="middle" font-weight="bold">확률 깊이 (2016-03)</text><text x="205" y="325" font-size="11" fill="#4E5964" text-anchor="middle">학습 중 블록을 통째로 끈다</text><rect x="430" y="164" width="330" height="52" rx="6" fill="#F6F7F5" stroke="#EB6834" stroke-width="1.6"/><text x="595" y="185" font-size="13" fill="#EB6834" text-anchor="middle" font-weight="bold">Wide ResNet (2016-05, 이 논문)</text><text x="595" y="205" font-size="11" fill="#4E5964" text-anchor="middle">깊이 대신 폭, 블록 안 드롭아웃</text><rect x="430" y="274" width="330" height="52" rx="6" fill="#F6F7F5" stroke="#1BAF7A" stroke-width="1.6"/><text x="595" y="295" font-size="13" fill="#1BAF7A" text-anchor="middle" font-weight="bold">PatchCore (2022) — 이 논문 뒤</text><text x="595" y="315" font-size="11" fill="#4E5964" text-anchor="middle">WRN-50-2 를 얼려 특징 추출기로</text><path d="M370,70 C400,70 400,190 428,190" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M370,150 C400,150 400,190 428,190" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M370,230 C400,230 400,190 428,190" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M370,310 C400,310 400,190 428,190" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="595" y1="216" x2="595" y2="272" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="20" y="365" font-size="11" fill="#7A8590" text-anchor="start">날짜는 arXiv 첫 판. PatchCore 는 이 논문의 참고 문헌에 없다(뒤에 나온 편이다)</text></svg>
