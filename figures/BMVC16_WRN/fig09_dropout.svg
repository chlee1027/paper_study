<svg xmlns="http://www.w3.org/2000/svg" width="820" height="410" viewBox="0 0 820 410" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="드롭아웃의 효과"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">드롭아웃을 넣었을 때의 차이 (표 6) — 넣은 값 − 뺀 값, 백분율 점. 왼쪽으로 갈수록 좋아짐</text><line x1="315.55555555555554" y1="60" x2="315.55555555555554" y2="310" stroke="#CFD6D3" stroke-width="1"/><text x="315.55555555555554" y="326" font-size="10" fill="#7A8590" text-anchor="middle">-0.4</text><line x1="366.6666666666667" y1="60" x2="366.6666666666667" y2="310" stroke="#CFD6D3" stroke-width="1"/><text x="366.6666666666667" y="326" font-size="10" fill="#7A8590" text-anchor="middle">-0.3</text><line x1="417.77777777777777" y1="60" x2="417.77777777777777" y2="310" stroke="#CFD6D3" stroke-width="1"/><text x="417.77777777777777" y="326" font-size="10" fill="#7A8590" text-anchor="middle">-0.2</text><line x1="468.8888888888889" y1="60" x2="468.8888888888889" y2="310" stroke="#CFD6D3" stroke-width="1"/><text x="468.8888888888889" y="326" font-size="10" fill="#7A8590" text-anchor="middle">-0.1</text><line x1="520.0" y1="60" x2="520.0" y2="310" stroke="#4E5964" stroke-width="1"/><text x="520.0" y="326" font-size="10" fill="#7A8590" text-anchor="middle">0</text><line x1="571.1111111111111" y1="60" x2="571.1111111111111" y2="310" stroke="#CFD6D3" stroke-width="1"/><text x="571.1111111111111" y="326" font-size="10" fill="#7A8590" text-anchor="middle">+0.1</text><line x1="622.2222222222222" y1="60" x2="622.2222222222222" y2="310" stroke="#CFD6D3" stroke-width="1"/><text x="622.2222222222222" y="326" font-size="10" fill="#7A8590" text-anchor="middle">+0.2</text><line x1="673.3333333333333" y1="60" x2="673.3333333333333" y2="310" stroke="#CFD6D3" stroke-width="1"/><text x="673.3333333333333" y="326" font-size="10" fill="#7A8590" text-anchor="middle">+0.3</text><text x="25" y="78" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">WRN-16-4</text><text x="700" y="58" font-size="10" fill="#7A8590" text-anchor="start">뺀 값 → 넣은 값</text><text x="250" y="84" font-size="11" fill="#4E5964" text-anchor="end">CIFAR-10</text><rect x="520" y="72" width="112.4444444444448" height="16" rx="2" fill="#C0392B"/><text x="638.4444444444448" y="84" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">+0.22</text><text x="700" y="84" font-size="10" fill="#7A8590" text-anchor="start">5.02 → 5.24</text><text x="250" y="106" font-size="11" fill="#4E5964" text-anchor="end">CIFAR-100</text><rect x="458.6666666666662" y="94" width="61.333333333333826" height="16" rx="2" fill="#1BAF7A"/><text x="452.6666666666662" y="106" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">-0.12</text><text x="700" y="106" font-size="10" fill="#7A8590" text-anchor="start">24.03 → 23.91</text><text x="250" y="128" font-size="11" fill="#4E5964" text-anchor="end">SVHN</text><rect x="412.6666666666666" y="116" width="107.33333333333343" height="16" rx="2" fill="#1BAF7A"/><text x="406.6666666666666" y="128" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">-0.21</text><text x="700" y="128" font-size="10" fill="#7A8590" text-anchor="start">1.85 → 1.64</text><text x="25" y="162" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">WRN-28-10</text><text x="250" y="168" font-size="11" fill="#4E5964" text-anchor="end">CIFAR-10</text><rect x="463.7777777777778" y="156" width="56.22222222222217" height="16" rx="2" fill="#1BAF7A"/><text x="457.7777777777778" y="168" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">-0.11</text><text x="700" y="168" font-size="10" fill="#7A8590" text-anchor="start">4.00 → 3.89</text><text x="250" y="190" font-size="11" fill="#4E5964" text-anchor="end">CIFAR-100</text><rect x="315.5555555555563" y="178" width="204.44444444444372" height="16" rx="2" fill="#1BAF7A"/><text x="309.5555555555563" y="190" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">-0.40</text><text x="700" y="190" font-size="10" fill="#7A8590" text-anchor="start">19.25 → 18.85</text><text x="250" y="212" font-size="11" fill="#4E5964" text-anchor="end">SVHN</text><text x="530" y="212" font-size="10" fill="#7A8590" text-anchor="start">(표에 없음)</text><text x="25" y="246" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">WRN-52-1 (가는 망)</text><text x="250" y="252" font-size="11" fill="#4E5964" text-anchor="end">CIFAR-10</text><rect x="443.3333333333336" y="240" width="76.6666666666664" height="16" rx="2" fill="#1BAF7A"/><text x="437.3333333333336" y="252" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">-0.15</text><text x="700" y="252" font-size="10" fill="#7A8590" text-anchor="start">6.43 → 6.28</text><text x="250" y="274" font-size="11" fill="#4E5964" text-anchor="end">CIFAR-100</text><rect x="463.77777777777806" y="262" width="56.222222222221944" height="16" rx="2" fill="#1BAF7A"/><text x="457.77777777777806" y="274" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">-0.11</text><text x="700" y="274" font-size="10" fill="#7A8590" text-anchor="start">29.89 → 29.78</text><text x="250" y="296" font-size="11" fill="#4E5964" text-anchor="end">SVHN</text><rect x="325.7777777777777" y="284" width="194.22222222222229" height="16" rx="2" fill="#1BAF7A"/><text x="319.7777777777777" y="296" font-size="11" fill="#1C232C" text-anchor="end" font-weight="bold">-0.38</text><text x="700" y="296" font-size="10" fill="#7A8590" text-anchor="start">2.08 → 1.70</text><text x="410" y="352" font-size="11" fill="#4E5964" text-anchor="middle">아홉 칸 중 여덟이 내려갔고, WRN-16-4 의 CIFAR-10 하나가 +0.22 로 올랐다(본문: '파라미터가 적어서일 것'이라는 추측)</text><text x="410" y="372" font-size="11" fill="#C0392B" text-anchor="middle">CIFAR 는 다섯 번의 중앙값이지만 흩어짐이 적혀 있지 않아, −0.11 같은 차이가 실행마다 흔들리는 폭 밖인지 알 수 없다</text><text x="410" y="392" font-size="11" fill="#7A8590" text-anchor="middle">SVHN 칸은 몇 번 돌린 값인지 캡션에 없다. 드롭아웃 확률은 교차 검증으로 CIFAR 0.3, SVHN 0.4</text></svg>
