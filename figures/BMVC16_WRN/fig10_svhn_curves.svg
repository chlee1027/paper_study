<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="SVHN 학습 곡선 다시 그리기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">SVHN, WRN-16-4 드롭아웃 유무 (논문 그림 3 오른쪽을 눈금으로 읽어 다시 그림, 읽기 ±0.1)</text><line x1="70" y1="340.0" x2="520" y2="340.0" stroke="#CFD6D3" stroke-width="1"/><text x="64" y="344.0" font-size="10" fill="#7A8590" text-anchor="end">0</text><line x1="70" y1="286.0" x2="520" y2="286.0" stroke="#CFD6D3" stroke-width="1"/><text x="64" y="290.0" font-size="10" fill="#7A8590" text-anchor="end">1</text><line x1="70" y1="232.0" x2="520" y2="232.0" stroke="#CFD6D3" stroke-width="1"/><text x="64" y="236.0" font-size="10" fill="#7A8590" text-anchor="end">2</text><line x1="70" y1="178.0" x2="520" y2="178.0" stroke="#CFD6D3" stroke-width="1"/><text x="64" y="182.0" font-size="10" fill="#7A8590" text-anchor="end">3</text><line x1="70" y1="124.0" x2="520" y2="124.0" stroke="#CFD6D3" stroke-width="1"/><text x="64" y="128.0" font-size="10" fill="#7A8590" text-anchor="end">4</text><line x1="70" y1="70.0" x2="520" y2="70.0" stroke="#CFD6D3" stroke-width="1"/><text x="64" y="74.0" font-size="10" fill="#7A8590" text-anchor="end">5</text><text x="70.0" y="358" font-size="10" fill="#7A8590" text-anchor="middle">0</text><text x="182.5" y="358" font-size="10" fill="#7A8590" text-anchor="middle">40</text><text x="295.0" y="358" font-size="10" fill="#7A8590" text-anchor="middle">80</text><text x="407.5" y="358" font-size="10" fill="#7A8590" text-anchor="middle">120</text><text x="520.0" y="358" font-size="10" fill="#7A8590" text-anchor="middle">160</text><line x1="295.0" y1="70" x2="295.0" y2="340" stroke="#7A8590" stroke-width="1" stroke-dasharray="2,3"/><line x1="407.5" y1="70" x2="407.5" y2="340" stroke="#7A8590" stroke-width="1" stroke-dasharray="2,3"/><rect x="300.625" y="70" width="104.0625" height="270" fill="#FFF3C4" opacity="0.6"/><path d="M70.0,70.0 L84.1,167.2 L126.2,194.2 L182.5,199.6 L238.8,199.6 L292.2,205.0 L300.6,240.1 L351.2,242.8 L404.7,243.9 L410.3,156.4 L415.9,234.7 L463.8,237.4 L520.0,239.0" fill="none" stroke="#EB6834" stroke-width="2.0"/><path d="M70.0,70.0 L84.1,172.6 L126.2,194.2 L182.5,205.0 L238.8,205.0 L292.2,205.0 L300.6,245.5 L351.2,245.5 L404.7,242.8 L410.3,232.0 L415.9,248.2 L463.8,250.4 L520.0,250.9" fill="none" stroke="#1BAF7A" stroke-width="2.0"/><text x="351.25" y="86" font-size="10" fill="#9A7B00" text-anchor="middle">82~119 바퀴: 두 선이 겹친다</text><text x="416.3125" y="156.4" font-size="10" fill="#EB6834" text-anchor="start">드롭아웃 없는 쪽이 튄다</text><text x="76" y="376" font-size="10" fill="#7A8590" text-anchor="start">바퀴 (epoch). 학습률은 80 · 120 에서 x 0.1. 세로축은 시험 오차 %</text><rect x="545" y="70" width="255" height="270" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="560" y="94" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">최종</text><text x="560" y="114" font-size="11" fill="#4E5964" text-anchor="start">드롭아웃 없음 1.85%</text><text x="560" y="134" font-size="11" fill="#4E5964" text-anchor="start">드롭아웃 0.4 1.64%</text><text x="560" y="154" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="560" y="174" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">곡선에서 읽은 것 (내 읽기)</text><text x="560" y="194" font-size="11" fill="#4E5964" text-anchor="start">차이 0.21 은 120 바퀴 뒤</text><text x="560" y="214" font-size="11" fill="#4E5964" text-anchor="start">마지막 40 바퀴에서 생긴다.</text><text x="560" y="234" font-size="11" fill="#4E5964" text-anchor="start">그 전 40 바퀴 동안은 두 선이</text><text x="560" y="254" font-size="11" fill="#4E5964" text-anchor="start">0.1 안에서 겹친다.</text><text x="560" y="274" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="560" y="294" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">곡선은 한 번의 실행이다</text><text x="560" y="314" font-size="11" fill="#4E5964" text-anchor="start">(캡션에 중앙값이라는 말이 없다)</text><text x="410" y="408" font-size="11" fill="#7A8590" text-anchor="middle">학습 손실 점선은 왼쪽 로그 축(10~100)인데 단위가 적혀 있지 않아 다시 그리지 않았다. 드롭아웃 없는 쪽이 120 바퀴 뒤 0 쪽으로 내려간다</text></svg>
