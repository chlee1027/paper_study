<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="ImageNet 기본 블록 망의 폭"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">ImageNet, 병목 없는 망의 폭 (표 7, top-1 검증 오차, 한 조각) — 파라미터가 비슷하면 깊은 쪽이 0.3~1.1 낮다</text><line x1="80" y1="342.94117647058823" x2="560" y2="342.94117647058823" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="346.94117647058823" font-size="10" fill="#7A8590" text-anchor="end">23</text><line x1="80" y1="308.8235294117647" x2="560" y2="308.8235294117647" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="312.8235294117647" font-size="10" fill="#7A8590" text-anchor="end">24</text><line x1="80" y1="274.70588235294116" x2="560" y2="274.70588235294116" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="278.70588235294116" font-size="10" fill="#7A8590" text-anchor="end">25</text><line x1="80" y1="240.58823529411765" x2="560" y2="240.58823529411765" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="244.58823529411765" font-size="10" fill="#7A8590" text-anchor="end">26</text><line x1="80" y1="206.47058823529412" x2="560" y2="206.47058823529412" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="210.47058823529412" font-size="10" fill="#7A8590" text-anchor="end">27</text><line x1="80" y1="172.35294117647058" x2="560" y2="172.35294117647058" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="176.35294117647058" font-size="10" fill="#7A8590" text-anchor="end">28</text><line x1="80" y1="138.23529411764707" x2="560" y2="138.23529411764707" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="142.23529411764707" font-size="10" fill="#7A8590" text-anchor="end">29</text><line x1="80" y1="104.11764705882354" x2="560" y2="104.11764705882354" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="108.11764705882354" font-size="10" fill="#7A8590" text-anchor="end">30</text><line x1="80" y1="70.0" x2="560" y2="70.0" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="74.0" font-size="10" fill="#7A8590" text-anchor="end">31</text><text x="80.0" y="378" font-size="10" fill="#7A8590" text-anchor="middle">10M</text><text x="213.89261391254237" y="378" font-size="10" fill="#7A8590" text-anchor="middle">20M</text><text x="390.8890219414386" y="378" font-size="10" fill="#7A8590" text-anchor="middle">50M</text><text x="524.7816358539809" y="378" font-size="10" fill="#7A8590" text-anchor="middle">100M</text><path d="M110.3,90.5 L263.8,204.4 L373.1,254.9 L528.2,306.8" fill="none" stroke="#2A78D6" stroke-width="2.2"/><circle cx="110.32781912957118" cy="90.4705882352942" r="5" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><text x="120.32781912957118" y="80.4705882352942" font-size="10" fill="#2A78D6" text-anchor="start">폭 1.0  30.40</text><circle cx="263.8281451661236" cy="204.42352941176478" r="5" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><text x="273.8281451661236" y="194.42352941176478" font-size="10" fill="#2A78D6" text-anchor="start">폭 1.5  27.06</text><circle cx="373.0954606905486" cy="254.9176470588236" r="5" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><text x="383.0954606905486" y="244.9176470588236" font-size="10" fill="#2A78D6" text-anchor="start">폭 2.0  25.58</text><circle cx="528.2277052273836" cy="306.7764705882353" r="5" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><text x="518.2277052273836" y="296.7764705882353" font-size="10" fill="#2A78D6" text-anchor="end">폭 3.0  24.06</text><path d="M230.5,214.3 L385.4,291.8 L495.6,329.6" fill="none" stroke="#EB6834" stroke-width="2.2"/><circle cx="230.53923289085859" cy="214.31764705882352" r="5" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="220.53923289085859" y="232.31764705882352" font-size="10" fill="#EB6834" text-anchor="end">폭 1.0  26.77</text><circle cx="385.4032030791574" cy="291.7647058823529" r="5" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="375.4032030791574" y="309.7647058823529" font-size="10" fill="#EB6834" text-anchor="end">폭 1.5  24.50</text><circle cx="495.6477498471257" cy="329.63529411764705" r="5" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="485.6477498471257" y="347.63529411764705" font-size="10" fill="#EB6834" text-anchor="end">폭 2.0  23.39</text><text x="114.32781912957118" y="114.4705882352942" font-size="11" fill="#2A78D6" text-anchor="start" font-weight="bold">WRN-18 (기본 블록 8 개)</text><text x="200.53923289085859" y="254.31764705882352" font-size="11" fill="#EB6834" text-anchor="start" font-weight="bold">WRN-34 (기본 블록 16 개)</text><rect x="585" y="70" width="215" height="290" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="600" y="94" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">파라미터가 비슷한 짝</text><text x="600" y="124" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">18-1.5 대 34-1.0</text><text x="600" y="144" font-size="11" fill="#4E5964" text-anchor="start">25.9M 대 21.8M</text><text x="600" y="162" font-size="11" fill="#EB6834" text-anchor="start">27.06 대 26.77 → 깊은 쪽 0.29 낮음</text><text x="600" y="188" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">18-2.0 대 34-1.5</text><text x="600" y="208" font-size="11" fill="#4E5964" text-anchor="start">45.6M 대 48.6M</text><text x="600" y="226" font-size="11" fill="#EB6834" text-anchor="start">25.58 대 24.50 → 깊은 쪽 1.08 낮음</text><text x="600" y="252" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">18-3.0 대 34-2.0</text><text x="600" y="272" font-size="11" fill="#4E5964" text-anchor="start">101.8M 대 86.0M</text><text x="600" y="290" font-size="11" fill="#EB6834" text-anchor="start">24.06 대 23.39 → 깊은 쪽 0.67 낮음</text><text x="600" y="330" font-size="11" fill="#7A8590" text-anchor="start">캡션: '비슷한 정확도'</text><text x="410" y="400" font-size="11" fill="#7A8590" text-anchor="middle">파라미터는 이 파일이 센 값과 표가 0.0~0.2M 안에서 맞는다(폭 1.0 은 torchvision 의 ResNet-18 · 34 와 같다). 한 번의 실행인지는 적혀 있지 않다</text><text x="410" y="420" font-size="11" fill="#7A8590" text-anchor="middle">가로축은 로그. 이 표의 망은 사전 활성이 아니라 원래 ResNet 블록이다(본문 3절: 100 층 아래에서는 차이가 없었다)</text></svg>
