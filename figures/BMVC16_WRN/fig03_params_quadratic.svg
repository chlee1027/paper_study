</text><line x1="80" y1="220.0" x2="530" y2="220.0" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="224.0" font-size="10" fill="#7A8590" text-anchor="end">30M</text><line x1="80" y1="166.66666666666669" x2="530" y2="166.66666666666669" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="170.66666666666669" font-size="10" fill="#7A8590" text-anchor="end">40M</text><line x1="80" y1="113.33333333333331" x2="530" y2="113.33333333333331" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="117.33333333333331" font-size="10" fill="#7A8590" text-anchor="end">50M</text><line x1="80" y1="60.0" x2="530" y2="60.0" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="64.0" font-size="10" fill="#7A8590" text-anchor="end">60M</text><text x="80.0" y="398" font-size="10" fill="#7A8590" text-anchor="middle">k=1</text><text x="120.9090909090909" y="398" font-size="10" fill="#7A8590" text-anchor="middle">k=2</text><text x="202.72727272727272" y="398" font-size="10" fill="#7A8590" text-anchor="middle">k=4</text><text x="284.5454545454545" y="398" font-size="10" fill="#7A8590" text-anchor="middle">k=6</text><text x="366.3636363636364" y="398" font-size="10" fill="#7A8590" text-anchor="middle">k=8</text><text x="448.1818181818182" y="398" font-size="10" fill="#7A8590" text-anchor="middle">k=10</text><text x="530.0" y="398" font-size="10" fill="#7A8590" text-anchor="middle">k=12</text><path d="M80.0,379.1 L88.2,378.7 L96.4,378.2 L104.5,377.6 L112.7,377.0 L120.9,376.3 L129.1,375.5 L137.3,374.7 L145.5,373.8 L153.6,372.8 L161.8,371.7 L170.0,370.6 L178.2,369.4 L186.4,368.1 L194.5,366.8 L202.7,365.3 L210.9,363.8 L219.1,362.3 L227.3,360.6 L235.5,358.9 L243.6,357.1 L251.8,355.3 L260.0,353.3 L268.2,351.3 L276.4,349.2 L284.5,347.1 L292.7,344.9 L300.9,342.6 L309.1,340.2 L317.3,337.7 L325.5,335.2 L333.6,332.6 L341.8,330.0 L350.0,327.2 L358.2,324.4 L366.4,321.5 L374.5,318.6 L382.7,315.6 L390.9,312.5 L399.1,309.3 L407.3,306.0 L415.5,302.7 L423.6,299.3 L431.8,295.9 L440.0,292.3 L448.2,288.7 L456.4,285.0 