roke-dasharray="5,4"/><text x="86" y="319.6" font-size="11" fill="#2A78D6" text-anchor="start" font-weight="bold">가는 ResNet-1001 (10.2M)</text><rect x="615" y="60" width="190" height="320" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="625" y="86" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">블록 하나의 3x3 두 층:</text><text x="625" y="108" font-size="12" fill="#4E5964" text-anchor="start"> 2 x 9 x (16k)² = 4,608 k²</text><text x="625" y="130" font-size="12" fill="#4E5964" text-anchor="start">k = 1 →  4,608</text><text x="625" y="152" font-size="12" fill="#4E5964" text-anchor="start">k = 10 → 460,800 (100 배)</text><text x="625" y="174" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="625" y="196" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">깊이를 두 배로 하면</text><text x="625" y="218" font-size="12" fill="#4E5964" text-anchor="start">블록 수 N 이 두 배 → 2 배</text><text x="625" y="240" font-size="12" fill="#4E5964" text-anchor="start">폭을 두 배로 하면 → 4 배</text><text x="625" y="262" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="625" y="284" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">곱-덧셈도 같은 모양이다</text><text x="625" y="306" font-size="12" fill="#4E5964" text-anchor="start">(합성곱 계산 = 파라미터 x</text><text x="625" y="328" font-size="12" fill="#4E5964" text-anchor="start"> 출력 칸 수)</text><text x="410" y="420" font-size="11" fill="#7A8590" text-anchor="middle">점(속 빈 원) 열 개가 모두 선 위에 놓인다 — 표 4 의 파라미터 칸 열 행을 모두 소수 첫째 자리까지 맞게 셌다</text></svg>
