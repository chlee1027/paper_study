<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="WRN-50-2 병목 블록의 폭"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">WRN-50-2 — 병목의 안쪽 두 층(1x1 줄이기의 출력 · 3x3)만 두 배, 블록의 입출력 채널은 ResNet-50 과 같다</text><text x="190" y="66" font-size="13" fill="#2A78D6" text-anchor="middle" font-weight="bold">ResNet-50 — 안쪽 64</text><rect x="141.25" y="84" width="97.5" height="36" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="190" y="107" font-size="12" fill="#1C232C" text-anchor="middle">1x1, 256 → 64</text><line x1="190" y1="120" x2="190" y2="140" stroke="#4E5964" stroke-width="1.1" marker-end="url(#ai)"/><rect x="141.25" y="142" width="97.5" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="190" y="165" font-size="12" fill="#1C232C" text-anchor="middle">3x3, 64 → 64</text><line x1="190" y1="178" x2="190" y2="198" stroke="#4E5964" stroke-width="1.1" marker-end="url(#ai)"/><rect x="85.0" y="200" width="210" height="36" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="190" y="223" font-size="12" fill="#1C232C" text-anchor="middle">1x1, 64 → 256</text><text x="190" y="268" font-size="11" fill="#4E5964" text-anchor="middle">layer1 의 블록 (입력 256 채널, 56x56)</text><text x="190" y="290" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">합성곱 파라미터 69,632</text><text x="580" y="66" font-size="13" fill="#EB6834" text-anchor="middle" font-weight="bold">WRN-50-2 — 안쪽 128</text><rect x="512.5" y="84" width="135.0" height="36" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="580" y="107" font-size="12" fill="#1C232C" text-anchor="middle">1x1, 256 → 128</text><line x1="580" y1="120" x2="580" y2="140" stroke="#4E5964" stroke-width="1.1" marker-end="url(#ai)"/><rect x="512.5" y="142" width="135.0" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="580" y="165" font-size="12" fill="#1C232C" text-anchor="middle">3x3, 128 → 128</text><line x1="580" y1="178" x2="580" y2="198" stroke="#4E5964" stroke-width="1.1" marker-end="url(#ai)"/><rect x="475.0" y="200" width="210" height="36" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="580" y="223" font-size="12" fill="#1C232C" text-anchor="middle">1x1, 128 → 256</text><text x="580" y="268" font-size="11" fill="#4E5964" text-anchor="middle">layer1 의 블록 (입력 256 채널, 56x56)</text><text x="580" y="290" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">합성곱 파라미터 212,992</text><text x="410" y="325" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">단계별 파라미터 (이 파일이 센 값, BN · 사영 포함)</text><rect x="40" y="340" width="175" height="64" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="127" y="360" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">layer1 · 출력 256</text><text x="127" y="378" font-size="11" fill="#4E5964" text-anchor="middle">0.22M → 0.63M</text><text x="127" y="396" font-size="11" fill="#EB6834" text-anchor="middle" font-weight="bold">2.94 배</text><rect x="230" y="340" width="175" height="64" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="317" y="360" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">layer2 · 출력 512</text><text x="317" y="378" font-size="11" fill="#4E5964" text-anchor="middle">1.22M → 3.48M</text><text x="317" y="396" font-size="11" fill="#EB6834" text-anchor="middle" font-weight="bold">2.86 배</text><rect x="420" y="340" width="175" height="64" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="507" y="360" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">layer3 · 출력 1024</text><text x="507" y="378" font-size="11" fill="#4E5964" text-anchor="middle">7.10M → 20.74M</text><text x="507" y="396" font-size="11" fill="#EB6834" text-anchor="middle" font-weight="bold">2.92 배</text><rect x="610" y="340" width="175" height="64" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="697" y="360" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">layer4 · 출력 2048</text><text x="697" y="378" font-size="11" fill="#4E5964" text-anchor="middle">14.96M → 41.97M</text><text x="697" y="396" font-size="11" fill="#EB6834" text-anchor="middle" font-weight="bold">2.80 배</text><text x="410" y="428" font-size="11" fill="#7A8590" text-anchor="middle">전체 25,557,032 대 68,883,240 (2.70 배) — torchvision 의 resnet50 · wide_resnet50_2 와 한 자리까지 같다. 곱-덧셈 4.09 G 대 11.40 G</text><text x="410" y="446" font-size="11" fill="#7A8590" text-anchor="middle">논문 문장은 '안쪽 3x3 층의 폭을 늘렸다'. 3x3 의 입력 폭도 늘어야 하므로 앞 1x1 의 출력까지 함께 두 배가 된다(내 풀이)</text></svg>
