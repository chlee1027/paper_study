<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="유닛 하나의 상수 오차 흐름"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">3.2절 — 유닛 j 하나가 자기 자신과만 이어져 있으면 오차는 걸음마다 f'(net) w_jj 배가 된다</text><text x="40" y="80" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">보통 유닛: 시그모이드, w_jj = 1.0</text><circle cx="80" cy="125" r="20" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="80" y="130" font-size="11" fill="#1C232C" text-anchor="middle">t</text><line x1="102" y1="125" x2="178" y2="125" stroke="#B4552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="80" y="165" font-size="11" fill="#B4552B" text-anchor="middle">1</text><circle cx="200" cy="125" r="20" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="200" y="130" font-size="11" fill="#1C232C" text-anchor="middle">t-1</text><line x1="222" y1="125" x2="298" y2="125" stroke="#B4552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="200" y="165" font-size="11" fill="#B4552B" text-anchor="middle">0.25</text><circle cx="320" cy="125" r="20" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="320" y="130" font-size="11" fill="#1C232C" text-anchor="middle">t-2</text><line x1="342" y1="125" x2="418" y2="125" stroke="#B4552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="320" y="165" font-size="11" fill="#B4552B" text-anchor="middle">0.0625</text><circle cx="440" cy="125" r="20" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="440" y="130" font-size="11" fill="#1C232C" text-anchor="middle">t-3</text><line x1="462" y1="125" x2="538" y2="125" stroke="#B4552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="440" y="165" font-size="11" fill="#B4552B" text-anchor="middle">0.0156</text><circle cx="560" cy="125" r="20" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="560" y="130" font-size="11" fill="#1C232C" text-anchor="middle">t-4</text><text x="560" y="165" font-size="11" fill="#B4552B" text-anchor="middle">0.00391</text><text x="820" y="130" font-size="11" fill="#4E5964" text-anchor="end">f' 최대 0.25 -&gt; 10 걸음 뒤 9.5 x 10^-7</text><text x="40" y="215" font-size="13" fill="#1E8449" text-anchor="start" font-weight="bold">CEC: f 가 항등, w_jj = 1.0</text><circle cx="80" cy="260" r="20" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="80" y="265" font-size="11" fill="#1C232C" text-anchor="middle">t</text><line x1="102" y1="260" x2="178" y2="260" stroke="#1E8449" stroke-width="1.6" marker-end="url(#ao)"/><text x="80" y="300" font-size="11" fill="#1E8449" text-anchor="middle">1</text><circle cx="200" cy="260" r="20" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="200" y="265" font-size="11" fill="#1C232C" text-anchor="middle">t-1</text><line x1="222" y1="260" x2="298" y2="260" stroke="#1E8449" stroke-width="1.6" marker-end="url(#ao)"/><text x="200" y="300" font-size="11" fill="#1E8449" text-anchor="middle">1</text><circle cx="320" cy="260" r="20" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="320" y="265" font-size="11" fill="#1C232C" text-anchor="middle">t-2</text><line x1="342" y1="260" x2="418" y2="260" stroke="#1E8449" stroke-width="1.6" marker-end="url(#ao)"/><text x="320" y="300" font-size="11" fill="#1E8449" text-anchor="middle">1</text><circle cx="440" cy="260" r="20" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="440" y="265" font-size="11" fill="#1C232C" text-anchor="middle">t-3</text><line x1="462" y1="260" x2="538" y2="260" stroke="#1E8449" stroke-width="1.6" marker-end="url(#ao)"/><text x="440" y="300" font-size="11" fill="#1E8449" text-anchor="middle">1</text><circle cx="560" cy="260" r="20" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="560" y="265" font-size="11" fill="#1C232C" text-anchor="middle">t-4</text><text x="560" y="300" font-size="11" fill="#1E8449" text-anchor="middle">1</text><text x="820" y="265" font-size="11" fill="#4E5964" text-anchor="end">f'(net) w_jj = 1.0 -&gt; 몇 걸음이든 1.0</text><text x="40" y="345" font-size="11" fill="#4E5964" text-anchor="start">화살표는 오차가 시간을 거꾸로 가는 방향. 원문: 이것을 지키려면 f 가 선형이어야 하고 j 의 활성은 그대로 머문다 — y_j(t+1) = y_j(t).</text></svg>
