text-anchor="end">0.1</text><line x1="80" y1="84.54545454545453" x2="560" y2="84.54545454545453" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="320.0" y="364" font-size="11" fill="#4E5964" text-anchor="middle">k</text><text x="80" y="50" font-size="11" fill="#4E5964" text-anchor="start">P(k) = 0.1 x 0.9^k</text><rect x="81.17073170731707" y="84.54545454545453" width="9.365853658536585" height="245.45454545454547" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="92.8780487804878" y="109.09090909090907" width="9.365853658536585" height="220.90909090909093" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="104.58536585365853" y="131.18181818181813" width="9.365853658536585" height="198.81818181818187" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="116.29268292682926" y="151.06363636363633" width="9.365853658536585" height="178.93636363636367" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="128.0" y="168.95727272727274" width="9.365853658536585" height="161.04272727272726" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="139.7073170731707" y="185.06154545454544" width="9.365853658536585" height="144.93845454545456" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="151.41463414634146" y="199.55539090909087" width="9.365853658536585" height="130.44460909090913" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="163.1219512195122" y="212.5998518181818" width="9.365853658536585" height="117.4001481818182" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="174.8292682926829" y="224.3398666363636" width="9.365853658536585" height="105.66013336363639" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="186.53658536585365" y="234.90587997272723" width="9.365853658536585" height="95.09412002727277" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="198.2439024390244" y="244.4152