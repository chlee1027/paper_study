e="#2E6B8A" stroke-width="0.6"/><rect x="490.9268292682927" y="323.8558910331984" width="9.365853658536585" height="6.144108966801582" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="502.6341463414634" y="324.4703019298786" width="9.365853658536585" height="5.5296980701214125" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="514.3414634146342" y="325.0232717368907" width="9.365853658536585" height="4.976728263109294" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="526.048780487805" y="325.5209445632016" width="9.365853658536585" height="4.479055436798376" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="537.7560975609757" y="325.96885010688146" width="9.365853658536585" height="4.031149893118538" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><rect x="549.4634146341464" y="326.3719650961933" width="9.365853658536585" height="3.628034903806679" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="0.6"/><line x1="191.21951219512195" y1="60" x2="191.21951219512195" y2="330" stroke="#C0392B" stroke-width="1.6" stroke-dasharray="5 3"/><text x="197.21951219512195" y="74" font-size="11" fill="#C0392B" text-anchor="start">E[k] = 0.9 / 0.1 = 9</text><text x="590" y="80" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">원문의 식</text><text x="590" y="100" font-size="11" fill="#4E5964" text-anchor="start">4 + Σ_k (1/10)(9/10)^k (q + k) = q + 14</text><text x="590" y="120" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="590" y="140" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">내가 계산한 것</text><text x="590" y="160" font-size="11" fill="#4E5964" text-anchor="start">Σ_k (1/10)(9/10)^k = 1</text><text x="590" y="180" font-size="11" fill="#4E5964" text-anchor="start">Σ_k k (1/10)(9/10)^k = 9</text><text x="590" y="200" font-size="11" fill="#4E5964" text-anchor="start">-&gt; 4 + q + 9 = q + 13</text><text x="590" y="220" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="590" y="240" font-size="11" fill="#4E5964" text-anchor="start">서열 = b, x 또는 y, 방해 기호 q + k 개,</text><text x="590" y="260" font-size="11" fill="#4E5964" text-anchor="start">e, 끝 기호 -&gt; 길이 q + k + 4.</text><text x="590" y="280" font-size="11" fill="#4E5964" text-anchor="start">같은 이유로 방해 기호 하나의 기대</text><text x="590" y="300" font-size="11" fill="#4E5964" text-anchor="start">출현 수도 (q+10)/p 가 아니라 (q+9)/p.</text><text x="590" y="320" font-size="11" fill="#4E5964" text-anchor="start">q = 1000 이면 차이는 0.1% 다.</text></svg>
