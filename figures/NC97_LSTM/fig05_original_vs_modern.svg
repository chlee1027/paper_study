<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="1997 원판과 나중 판 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">이 논문의 LSTM 과 지금 흔히 쓰는 LSTM 은 같은 식이 아니다 — 오른쪽 칸은 이 논문에 없다</text><rect x="20" y="55" width="420" height="395" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><rect x="460" y="55" width="420" height="395" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="230" y="80" font-size="14" fill="#2E6B8A" text-anchor="middle" font-weight="bold">1997 원판 (이 논문)</text><text x="670" y="80" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="bold">나중 판 (Gers 외 2000 부터)</text><text x="40" y="110" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">상태</text><text x="40" y="132" font-size="12" fill="#4E5964" text-anchor="start">s(t) = s(t-1) + y^in(t) · g(net_c(t))</text><text x="40" y="154" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">출력</text><text x="40" y="176" font-size="12" fill="#4E5964" text-anchor="start">y^c(t) = y^out(t) · h(s(t))</text><text x="40" y="198" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">게이트</text><text x="40" y="220" font-size="12" fill="#4E5964" text-anchor="start">입력 · 출력 둘. 블록 하나가 게이트를 공유</text><text x="40" y="242" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">g · h</text><text x="40" y="264" font-size="12" fill="#4E5964" text-anchor="start">g = 4σ - 2 ∈ [-2, 2],  h = 2σ - 1 ∈ [-1, 1]</text><text x="40" y="286" font-size="12" fill="#4E5964" text-anchor="start">(h(x) = tanh(x/2), g(x) = 2 tanh(x/2) 와 같다)</text><text x="40" y="308" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">학습</text><text x="40" y="330" font-size="12" fill="#4E5964" text-anchor="start">RTRL 변형, 셀 밖으로 나가는 오차는 자른다</text><text x="40" y="352" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">상태 비우기</text><text x="40" y="374" font-size="12" fill="#4E5964" text-anchor="start">서열마다 활성을 0 으로 되돌린다</text><text x="40" y="396" font-size="12" fill="#4E5964" text-anchor="start">(5절 서두: 모든 실험. 끝없이 이어지는 입력은 없다)</text><text x="480" y="110" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">상태</text><text x="480" y="132" font-size="12" fill="#4E5964" text-anchor="start">c_t = f_t ⊙ c_(t-1) + i_t ⊙ g_t</text><text x="480" y="154" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">출력</text><text x="480" y="176" font-size="12" fill="#4E5964" text-anchor="start">h_t = o_t ⊙ tanh(c_t)</text><text x="480" y="198" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">게이트</text><text x="480" y="220" font-size="12" fill="#4E5964" text-anchor="start">망각 게이트 f_t 가 더해진다 (Gers 2000)</text><text x="480" y="242" font-size="12" fill="#4E5964" text-anchor="start">엿보기 연결 (Gers 2002) 은 고를 수 있다</text><text x="480" y="264" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">g · h</text><text x="480" y="286" font-size="12" fill="#4E5964" text-anchor="start">둘 다 tanh, 범위 [-1, 1]</text><text x="480" y="308" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">학습</text><text x="480" y="330" font-size="12" fill="#4E5964" text-anchor="start">자르지 않은 BPTT (Graves 외 2005)</text><text x="480" y="352" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">상태 비우기</text><text x="480" y="374" font-size="12" fill="#4E5964" text-anchor="start">망각 게이트가 스스로 비운다</text><text x="480" y="396" font-size="12" fill="#4E5964" text-anchor="start">f_t = 1 로 두면 원판의 CEC 와 같다</text></svg>
