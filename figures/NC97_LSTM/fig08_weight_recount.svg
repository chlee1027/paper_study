t x="790.0" y="223.0" font-size="11" fill="#1C232C" text-anchor="middle">모든 비입력 유닛</text><rect x="20" y="232" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="90.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">6a (표 9)</text><text x="325.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">입력 8 · 출력 4 · 블록 2 x 2</text><rect x="491" y="233" width="108" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="545.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">156</text><text x="650.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">156</text><text x="790.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">모든 비입력 유닛</text><rect x="20" y="258" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="90.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">6b (표 9)</text><text x="325.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">입력 8 · 출력 8 · 블록 3 x 2</text><rect x="491" y="259" width="108" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="545.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">308</text><text x="650.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">308</text><text x="790.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">모든 비입력 유닛</text><rect x="20" y="284" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="90.0" y="301.0" font-size="11" fill="#1C232C" text-anchor="middle">2a RTRL (표 2)</text><text x="325.0" y="301.0" font-size="11" fill="#1C232C" text-anchor="middle">p = 4: 입력 5 · 숨은 1 · 출력 5</text><rect x="491" y="285" width="108" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="545.0" y="301.0" font-size="11" fill="#1C232C" text-anchor="middle">36</text><text x="650.0" y="301.0" font-size="11" fill="#1C232C" text-anchor="middle">36</text><text x="790.0" y="301.0" font-size="11" fill="#1C232C" text-anchor="middle">치우침 없음</text><rect x="20" y="310" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="90.0" y="327.0" font-size="11" fill="#1C232C" text-anchor="middle">2a RTRL (표 2)</text><text x="325.0" y="327.0" font-size="11" fill="#1C232C" text-anchor="middle">p = 10: 입력 11 · 숨은 1 · 출력 11</text><rect x="491" y="311" width="108" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="545.0" y="327.0" font-size="11" fill="#1C232C" text-anchor="middle">144</text><text x="650.0" y="327.0" font-size="11" fill="#1C232C" text-anchor="middle">144</text><text x="790.0" y="327.0" font-size="11" fill="#1C232C" text-anchor="middle">치우침 없음</text><rect x="20" y="336" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="90.0" y="353.0" font-size="11" fill="#1C232C" text-anchor="middle">2a RTRL (표 2)</text><text x="325.0" y="353.0" font-size="11" fill="#1C232C" text-anchor="middle">p = 100: 입력 101 · 숨은 1 · 출력 101</text><rect x="491" y="337" width="108" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="545.0" y="353.0" font-size="11" fill="#1C232C" text-anchor="middle">10,404</text><text x="650.0" y="353.0" font-size="11" fill="#1C232C" text-anchor="middle">10,404</text><text x="790.0" y="353.0" font-size="11" fill="#1C232C" text-anchor="middle">치우침 없음</text><rect x="20" y="362" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="90.0" y="379.0" font-size="11" fill="#1C232C" text-anchor="middle">2a LSTM (표 2)</text><text x="325.0" y="379.0" font-size="11" fill="#1C232C" text-anchor="middle">p = 100: 셀 · 게이트는 입력만 받는다고 가정</text><rect x="491" y="363" width="108" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="545.0" y="379.0" font-size="11" fill="#1C232C" text-anchor="middle">10,504</text><text x="650.0" y="379.0" font-size="11" fill="#1C232C" text-anchor="middle">10,504</text><rect x="701" y="363" width="178" height="24" rx="0" fill="#FFF3C4" stroke="none" stroke-width="0"/><text x="790.0" y="379.0" font-size="11" fill="#1C232C" text-anchor="middle">가정 하나</text><text x="20" y="418" font-size="11" fill="#4E5964" text-anchor="start">세는 규칙: 숨은 층(셀 + 게이트) 의 각 유닛이 입력 전부와 숨은 층 전부를 받고, 출력은 셀에서만 받는다(원문 표 10 의 「F」).</text><text x="20" y="436" font-size="11" fill="#4E5964" text-anchor="start">실험 4 · 5 · 6 은 출력도 치우침을 갖는다(표 10 의 「all」). 2a LSTM 의 10,504 는 셀과 입력 게이트가 입력 101 개만 받을 때 맞는다 — 원문은 이 짜임을 적지 않았다.</text></svg>
