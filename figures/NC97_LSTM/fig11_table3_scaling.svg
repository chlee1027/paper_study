<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 3 지연과 학습 시간"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">표 3 위 칸 — 지연 q 를 20 배로 늘렸을 때, 무엇으로 세느냐에 따라 「배우는 시간」 이 1.6 배도 되고 438 배도 된다</text><line x1="80" y1="360" x2="560" y2="360" stroke="#4E5964" stroke-width="1.2"/><line x1="80" y1="60" x2="80" y2="360" stroke="#4E5964" stroke-width="1.2"/><line x1="80.0" y1="360" x2="80.0" y2="364" stroke="#4E5964" stroke-width="1"/><text x="80.0" y="377" font-size="10" fill="#7A8590" text-anchor="middle">50</text><line x1="191.06154231668444" y1="360" x2="191.06154231668444" y2="364" stroke="#4E5964" stroke-width="1"/><text x="191.06154231668444" y="377" font-size="10" fill="#7A8590" text-anchor="middle">100</text><line x1="302.1230846333689" y1="360" x2="302.1230846333689" y2="364" stroke="#4E5964" stroke-width="1"/><text x="302.1230846333689" y="377" font-size="10" fill="#7A8590" text-anchor="middle">200</text><line x1="448.93845768331556" y1="360" x2="448.93845768331556" y2="364" stroke="#4E5964" stroke-width="1"/><text x="448.93845768331556" y="377" font-size="10" fill="#7A8590" text-anchor="middle">500</text><line x1="560.0" y1="360" x2="560.0" y2="364" stroke="#4E5964" stroke-width="1"/><text x="560.0" y="377" font-size="10" fill="#7A8590" text-anchor="middle">1000</text><line x1="76" y1="360.0" x2="80" y2="360.0" stroke="#4E5964" stroke-width="1"/><text x="73" y="364.0" font-size="10" fill="#7A8590" text-anchor="end">1x</text><line x1="80" y1="360.0" x2="560" y2="360.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="76" y1="260.0" x2="80" y2="260.0" stroke="#4E5964" stroke-width="1"/><text x="73" y="264.0" font-size="10" fill="#7A8590" text-anchor="end">10x</text><line x1="80" y1="260.0" x2="560" y2="260.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="76" y1="160.0" x2="80" y2="160.0" stroke="#4E5964" stroke-width="1"/><text x="73" y="164.0" font-size="10" fill="#7A8590" text-anchor="end">100x</text><line x1="80" y1="160.0" x2="560" y2="160.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="76" y1="60.0" x2="80" y2="60.0" stroke="#4E5964" stroke-width="1"/><text x="73" y="64.0" font-size="10" fill="#7A8590" text-anchor="end">1000x</text><line x1="80" y1="60.0" x2="560" y2="60.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="320.0" y="394" font-size="11" fill="#4E5964" text-anchor="middle">q (= 지연 - 1), p = q</text><text x="80" y="50" font-size="11" fill="#4E5964" text-anchor="start">q = 50 대비 배수 (로그)</text><path d="M80.0,360.0 L191.1,358.6 L302.1,355.9 L448.9,349.7 L560.0,338.7" fill="none" stroke="#2E6B8A" stroke-width="2.2"/><circle cx="80.0" cy="360.0" r="3.5" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="191.06154231668444" cy="358.575956088539" r="3.5" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="302.1230846333689" cy="355.8607314841775" r="3.5" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="448.93845768331556" cy="349.7337658102852" r="3.5" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><circle cx="560.0" cy="338.6925174691149" r="3.5" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="1.2"/><text x="568.0" y="342.6925174691149" font-size="11" fill="#2E6B8A" text-anchor="start" font-weight="bold">1.6x</text><text x="600" y="90" font-size="11" fill="#2E6B8A" text-anchor="start">성공까지 본 서열 수 (원문 표의 값)</text><path d="M80.0,360.0 L191.1,333.2 L302.1,303.0 L448.9,258.7 L560.0,218.1" fill="none" stroke="#9A7B00" stroke-width="2.2"/><circle cx="80.0" cy="360.0" r="3.5" fill="#9A7B00" stroke="#9A7B00" stroke-width="1.2"/><circle cx="191.06154231668444" cy="333.2021666855552" r="3.5" fill="#9A7B00" stroke="#9A7B00" stroke-width="1.2"/><circle cx="302.1230846333689" cy="302.9568260856619" r="3.5" fill="#9A7B00" stroke="#9A7B00" stroke-width="1.2"/><circle cx="448.93845768331556" cy="258.6560842444618" r="3.5" fill="#9A7B00" stroke="#9A7B00" stroke-width="1.2"/><circle cx="560.0" cy="218.06562787844499" r="3.5" fill="#9A7B00" stroke="#9A7B00" stroke-width="1.2"/><text x="568.0" y="222.06562787844499" font-size="11" fill="#9A7B00" text-anchor="start" font-weight="bold">26.3x</text><text x="600" y="114" font-size="11" fill="#9A7B00" text-anchor="start">처리한 시간 걸음 수 (서열 수 x 기대 길이 q+13)</text><path d="M80.0,360.0 L191.1,307.1 L302.1,248.9 L448.9,166.1 L560.0,95.9" fill="none" stroke="#B4552B" stroke-width="2.2"/><circle cx="80.0" cy="360.0" r="3.5" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="191.06154231668444" cy="307.095497113659" r="3.5" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="302.1230846333689" cy="248.89225705593088" r="3.5" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="448.93845768331556" cy="166.13734651331072" r="3.5" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><circle cx="560.0" cy="95.89984698095088" r="3.5" fill="#B4552B" stroke="#B4552B" stroke-width="1.2"/><text x="568.0" y="99.89984698095088" font-size="11" fill="#B4552B" text-anchor="start" font-weight="bold">438x</text><text x="600" y="138" font-size="11" fill="#B4552B" text-anchor="start">걸음 x 무게 수 (걸음마다 셈이 O(W))</text><text x="600" y="180" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">아래 칸 (q = 1000 고정, p 를 줄임)</text><text x="600" y="200" font-size="11" fill="#4E5964" text-anchor="start">q/p = 1 · 2 · 5 · 10 · 20 에서</text><text x="600" y="220" font-size="11" fill="#4E5964" text-anchor="start">서열 수 49,000 · 49,000 · 75,000 ·</text><text x="600" y="240" font-size="11" fill="#4E5964" text-anchor="start">135,000 · 203,000</text><text x="600" y="260" font-size="11" fill="#4E5964" text-anchor="start">방해 기호가 자주 나올수록 느려진다</text><text x="600" y="280" font-size="11" fill="#4E5964" text-anchor="start">(원문: 자주 보는 입력이 무게를 흔든다).</text><text x="600" y="300" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="600" y="320" font-size="11" fill="#4E5964" text-anchor="start">원문 주장은 서열 수로 센 것이다.</text><text x="600" y="340" font-size="11" fill="#4E5964" text-anchor="start">벽시계 시간은 원문에 없다.</text></svg>
