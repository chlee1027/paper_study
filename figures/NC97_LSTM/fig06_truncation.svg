<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="잘린 역전파의 오차 경로"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">잘린 역전파 (4절, 부록 A.1 · A.2): 셀 안 CEC 에서만 오차가 시간을 거슬러 가고, 셀 밖으로 나가려 하면 0 으로 둔다</text><circle cx="720" cy="170" r="26" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.6"/><text x="720" y="175" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">s(t)</text><line x1="692" y1="170" x2="598" y2="170" stroke="#1E8449" stroke-width="2" marker-end="url(#ao)"/><text x="645" y="160" font-size="11" fill="#1E8449" text-anchor="middle">x 1.0</text><circle cx="570" cy="170" r="26" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.6"/><text x="570" y="175" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">s(t-1)</text><line x1="542" y1="170" x2="448" y2="170" stroke="#1E8449" stroke-width="2" marker-end="url(#ao)"/><text x="495" y="160" font-size="11" fill="#1E8449" text-anchor="middle">x 1.0</text><circle cx="420" cy="170" r="26" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.6"/><text x="420" y="175" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">s(t-2)</text><line x1="392" y1="170" x2="298" y2="170" stroke="#1E8449" stroke-width="2" marker-end="url(#ao)"/><text x="345" y="160" font-size="11" fill="#1E8449" text-anchor="middle">x 1.0</text><circle cx="270" cy="170" r="26" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.6"/><text x="270" y="175" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">...</text><line x1="242" y1="170" x2="148" y2="170" stroke="#1E8449" stroke-width="2" marker-end="url(#ao)"/><text x="195" y="160" font-size="11" fill="#1E8449" text-anchor="middle">x 1.0</text><circle cx="120" cy="170" r="26" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.6"/><text x="120" y="175" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">s(t-q)</text><line x1="840" y1="90" x2="748" y2="152" stroke="#B4552B" stroke-width="2" marker-end="url(#ar)"/><text x="845" y="82" font-size="11" fill="#B4552B" text-anchor="end">오차가 y^c(t) 에 닿는다</text><text x="845" y="120" font-size="11" fill="#B4552B" text-anchor="end">x y^out(t) h'(s(t))</text><line x1="120" y1="196" x2="70" y2="290" stroke="#B4552B" stroke-width="2" marker-end="url(#ar)"/><text x="60" y="310" font-size="11" fill="#B4552B" text-anchor="start">셀에 들어올 때 한 번 더: x g'(net_c) y^in  또는  x g(net_c) f'_in(net_in)</text><text x="60" y="330" font-size="11" fill="#4E5964" text-anchor="start">여기서 들어오는 무게(w_cu, w_in,u)를 고치는 데만 쓰고, 그 앞 유닛으로는 넘기지 않는다</text><line x1="720" y1="200" x2="720" y2="250" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="4 3"/><text x="720" y="268" font-size="10" fill="#C0392B" text-anchor="middle">x 0 (자름)</text><line x1="570" y1="200" x2="570" y2="250" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="4 3"/><text x="570" y="268" font-size="10" fill="#C0392B" text-anchor="middle">x 0 (자름)</text><line x1="420" y1="200" x2="420" y2="250" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="4 3"/><text x="420" y="268" font-size="10" fill="#C0392B" text-anchor="middle">x 0 (자름)</text><text x="60" y="360" font-size="11" fill="#4E5964" text-anchor="start">원문 식 (41): 배율은 셀에 들어올 때(t)와 나갈 때(t-q) 두 번만 곱해지고 그 사이 q 걸음에서는 1.0 이다. 무게 하나당 걸음마다 O(1) 셈이다.</text></svg>
