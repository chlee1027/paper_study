<svg xmlns="http://www.w3.org/2000/svg" width="900" height="374" viewBox="0 0 900 374" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 4 ~ 6 비율을 개수로"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">표 4 ~ 6 의 「잘못 분류한 비율」 은 시험 서열 2,560 개를 10 번 돌린 평균이다. 개수로 되돌려 본 것 (내가 센 것)</text><rect x="20" y="50" width="860" height="26" rx="0" fill="#D8E7EE" stroke="#CFD6D3" stroke-width="0.8"/><text x="75.0" y="67.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">표</text><text x="195.0" y="67.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">설정</text><text x="315.0" y="67.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">원문 비율</text><text x="495.0" y="67.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">x 25,600 (2,560 개 x 10 번)</text><text x="750.0" y="67.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">정수로 되돌리면</text><rect x="20" y="76" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="75.0" y="93.0" font-size="11" fill="#1C232C" text-anchor="middle">표 4 (3a)</text><text x="195.0" y="93.0" font-size="11" fill="#1C232C" text-anchor="middle">T=100, N=3</text><text x="315.0" y="93.0" font-size="11" fill="#1C232C" text-anchor="middle">0.000195</text><rect x="371" y="77" width="248" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="495.0" y="93.0" font-size="11" fill="#1C232C" text-anchor="middle">4.99</text><text x="750.0" y="93.0" font-size="11" fill="#1C232C" text-anchor="middle">5 개 -&gt; 0.000195</text><rect x="20" y="102" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="75.0" y="119.0" font-size="11" fill="#1C232C" text-anchor="middle">표 4 (3a)</text><text x="195.0" y="119.0" font-size="11" fill="#1C232C" text-anchor="middle">T=100, N=1</text><text x="315.0" y="119.0" font-size="11" fill="#1C232C" text-anchor="middle">0.000117</text><rect x="371" y="103" width="248" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="495.0" y="119.0" font-size="11" fill="#1C232C" text-anchor="middle">3.00</text><text x="750.0" y="119.0" font-size="11" fill="#1C232C" text-anchor="middle">3 개 -&gt; 0.000117</text><rect x="20" y="128" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="75.0" y="145.0" font-size="11" fill="#1C232C" text-anchor="middle">표 4 (3a)</text><text x="195.0" y="145.0" font-size="11" fill="#1C232C" text-anchor="middle">T=1000, N=3</text><text x="315.0" y="145.0" font-size="11" fill="#1C232C" text-anchor="middle">0.000078</text><rect x="371" y="129" width="248" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="495.0" y="145.0" font-size="11" fill="#1C232C" text-anchor="middle">2.00</text><text x="750.0" y="145.0" font-size="11" fill="#1C232C" text-anchor="middle">2 개 -&gt; 0.000078</text><rect x="20" y="154" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="75.0" y="171.0" font-size="11" fill="#1C232C" text-anchor="middle">표 5 (3b)</text><text x="195.0" y="171.0" font-size="11" fill="#1C232C" text-anchor="middle">T=100, N=3</text><text x="315.0" y="171.0" font-size="11" fill="#1C232C" text-anchor="middle">0.00828</text><rect x="371" y="155" width="248" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="495.0" y="171.0" font-size="11" fill="#1C232C" text-anchor="middle">211.97</text><text x="750.0" y="171.0" font-size="11" fill="#1C232C" text-anchor="middle">212 개 -&gt; 0.008281</text><rect x="20" y="180" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="75.0" y="197.0" font-size="11" fill="#1C232C" text-anchor="middle">표 5 (3b)</text><text x="195.0" y="197.0" font-size="11" fill="#1C232C" text-anchor="middle">T=100, N=1</text><text x="315.0" y="197.0" font-size="11" fill="#1C232C" text-anchor="middle">0.015</text><rect x="371" y="181" width="248" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="495.0" y="197.0" font-size="11" fill="#1C232C" text-anchor="middle">384.00</text><text x="750.0" y="197.0" font-size="11" fill="#1C232C" text-anchor="middle">384 개 -&gt; 0.015000</text><rect x="20" y="206" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="75.0" y="223.0" font-size="11" fill="#1C232C" text-anchor="middle">표 5 (3b)</text><text x="195.0" y="223.0" font-size="11" fill="#1C232C" text-anchor="middle">T=1000, N=1</text><text x="315.0" y="223.0" font-size="11" fill="#1C232C" text-anchor="middle">0.01207</text><rect x="371" y="207" width="248" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="495.0" y="223.0" font-size="11" fill="#1C232C" text-anchor="middle">308.99</text><text x="750.0" y="223.0" font-size="11" fill="#1C232C" text-anchor="middle">309 개 -&gt; 0.012070</text><rect x="20" y="232" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="75.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">표 6 (3c)</text><text x="195.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">T=100, N=3</text><text x="315.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">0.00558</text><rect x="371" y="233" width="248" height="24" rx="0" fill="#FFF3C4" stroke="none" stroke-width="0"/><text x="495.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">142.85</text><text x="750.0" y="249.0" font-size="11" fill="#1C232C" text-anchor="middle">143 개 -&gt; 0.005586</text><rect x="20" y="258" width="860" height="26" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="75.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">표 6 (3c)</text><text x="195.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">T=100, N=1</text><text x="315.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">0.00441</text><rect x="371" y="259" width="248" height="24" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="495.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">112.90</text><text x="750.0" y="275.0" font-size="11" fill="#1C232C" text-anchor="middle">113 개 -&gt; 0.004414</text><text x="20" y="314" font-size="11" fill="#4E5964" text-anchor="start">표 4 는 10 번을 다 합쳐 25,600 개 중 5 · 3 · 2 개를 틀렸다는 뜻이다. 표 5 · 6 은 112 ~ 384 개.</text><text x="20" y="332" font-size="11" fill="#4E5964" text-anchor="start">노란 칸 하나(표 6 첫 줄)는 142.85 라 정수가 아니다. 143 개면 0.005586 이고, 원문은 끝자리를 버린 것으로 읽힌다.</text><text x="20" y="350" font-size="11" fill="#4E5964" text-anchor="start">표 7 · 8 은 개수로 적었다: 실험 4 는 2,560 개 중 1 · 0 · 1 개, 실험 5 는 139 · 14 개 (10 번 평균).</text></svg>
