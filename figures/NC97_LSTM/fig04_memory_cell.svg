<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="기억 셀과 입력 게이트 출력 게이트"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">기억 셀 c_j 와 게이트 둘 (원문 그림 1 · 4절의 식). 1997 원판 — 망각 게이트가 없다</text><rect x="150" y="70" width="600" height="150" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="160" y="90" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">기억 셀 c_j</text><line x1="40" y1="120" x2="185" y2="145" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="40" y1="145" x2="185" y2="145" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="40" y1="170" x2="185" y2="145" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="40" y="110" font-size="11" fill="#4E5964" text-anchor="start">net_c(t) = Σ w_cu y^u(t-1)</text><circle cx="210" cy="145" r="24" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="210" y="150" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">g</text><text x="210" y="192" font-size="10" fill="#7A8590" text-anchor="middle">[-2, 2]</text><line x1="234" y1="145" x2="318" y2="145" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><circle cx="330" cy="145" r="10" fill="#9A7B00" stroke="#9A7B00" stroke-width="1.2"/><text x="330" y="125" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">x</text><line x1="340" y1="145" x2="418" y2="145" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><circle cx="450" cy="145" r="28" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.8"/><text x="450" y="150" font-size="14" fill="#1E8449" text-anchor="middle" font-weight="bold">s_c</text><path d="M 438,119 C 420,80 480,80 462,119" fill="none" stroke="#1E8449" stroke-width="1.8" marker-end="url(#ao)"/><text x="450" y="82" font-size="11" fill="#1E8449" text-anchor="middle">무게 1.0 고정 (CEC)</text><line x1="478" y1="145" x2="548" y2="145" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><circle cx="575" cy="145" r="24" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="575" y="150" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">h</text><text x="575" y="192" font-size="10" fill="#7A8590" text-anchor="middle">[-1, 1]</text><line x1="599" y1="145" x2="668" y2="145" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><circle cx="680" cy="145" r="10" fill="#9A7B00" stroke="#9A7B00" stroke-width="1.2"/><text x="680" y="125" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">x</text><line x1="690" y1="145" x2="860" y2="120" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="690" y1="145" x2="860" y2="145" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="690" y1="145" x2="860" y2="170" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="860" y="110" font-size="12" fill="#4E5964" text-anchor="end">y^c(t)</text><line x1="330" y1="155" x2="330" y2="258" stroke="#9A7B00" stroke-width="1.6"/><circle cx="330" cy="280" r="22" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="330" y="285" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">f</text><text x="362" y="274" font-size="12" fill="#9A7B00" text-anchor="start" font-weight="bold">in_j (입력 게이트)</text><text x="362" y="293" font-size="11" fill="#4E5964" text-anchor="start">y^in = f(net_in) ∈ [0, 1]</text><line x1="303.0" y1="350" x2="319.2" y2="304" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)"/><line x1="330.0" y1="350" x2="330.0" y2="304" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)"/><line x1="357.0" y1="350" x2="340.8" y2="304" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)"/><line x1="680" y1="155" x2="680" y2="258" stroke="#9A7B00" stroke-width="1.6"/><circle cx="680" cy="280" r="22" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="680" y="285" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">f</text><text x="712" y="274" font-size="12" fill="#9A7B00" text-anchor="start" font-weight="bold">out_j (출력 게이트)</text><text x="712" y="293" font-size="11" fill="#4E5964" text-anchor="start">y^out = f(net_out) ∈ [0, 1]</text><line x1="653.0" y1="350" x2="669.2" y2="304" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)"/><line x1="680.0" y1="350" x2="680.0" y2="304" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)"/><line x1="707.0" y1="350" x2="690.8" y2="304" stroke="#4E5964" stroke-width="1" marker-end="url(#ai)"/><text x="40" y="395" font-size="12" fill="#4E5964" text-anchor="start">s_c(t) = s_c(t-1) + y^in(t) g(net_c(t)),  s_c(0) = 0</text><text x="500" y="395" font-size="12" fill="#4E5964" text-anchor="start">y^c(t) = y^out(t) h(s_c(t))</text></svg>
