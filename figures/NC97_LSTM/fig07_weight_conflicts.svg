<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="입력 무게 충돌과 출력 무게 충돌"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">3.2절 — 같은 무게 하나가 서로 다른 때에 반대 일을 해야 한다. 게이트는 이것을 「때」에 따라 가르려는 장치다</text><rect x="30" y="55" width="420" height="300" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="240" y="80" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">입력 무게 충돌</text><text x="240" y="110" font-size="12" fill="#4E5964" text-anchor="middle">같은 무게 w_ji (i -&gt; j)</text><rect x="50" y="130" width="380" height="40" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.2"/><text x="240" y="155" font-size="12" fill="#1E8449" text-anchor="middle">t1: 이 입력을 저장하라 (j 를 켠다)</text><rect x="50" y="185" width="380" height="40" rx="6" fill="#F6D9D5" stroke="#C0392B" stroke-width="1.2"/><text x="240" y="210" font-size="12" fill="#C0392B" text-anchor="middle">t2 ~ t9: 무관한 입력은 무시하라 (j 를 지킨다)</text><text x="240" y="260" font-size="11" fill="#4E5964" text-anchor="middle">두 일이 같은 무게에 반대 방향의 갱신을 보낸다</text><rect x="50" y="280" width="380" height="50" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="240" y="310" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">입력 게이트 in_j: 쓰기를 연다 / 닫는다</text><rect x="470" y="55" width="420" height="300" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="680" y="80" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">출력 무게 충돌</text><text x="680" y="110" font-size="12" fill="#4E5964" text-anchor="middle">같은 무게 w_kj (j -&gt; k)</text><rect x="490" y="130" width="380" height="40" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.2"/><text x="680" y="155" font-size="12" fill="#1E8449" text-anchor="middle">t10: j 의 내용을 꺼내라</text><rect x="490" y="185" width="380" height="40" rx="6" fill="#F6D9D5" stroke="#C0392B" stroke-width="1.2"/><text x="680" y="210" font-size="12" fill="#C0392B" text-anchor="middle">t1 ~ t9: k 를 흔들지 마라</text><text x="680" y="260" font-size="11" fill="#4E5964" text-anchor="middle">두 일이 같은 무게에 반대 방향의 갱신을 보낸다</text><rect x="490" y="280" width="380" height="50" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="680" y="310" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">출력 게이트 out_j: 읽기를 연다 / 닫는다</text></svg>
