<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 2 과제 2a 결과"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">표 2 — 과제 2a (잡음 없는 서열, 지연 p): 성공한 실행의 비율. 각 줄 18 번의 평균</text><line x1="330.0" y1="55" x2="330.0" y2="327" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="330.0" y="343" font-size="10" fill="#7A8590" text-anchor="middle">0%</text><line x1="407.5" y1="55" x2="407.5" y2="327" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="407.5" y="343" font-size="10" fill="#7A8590" text-anchor="middle">25%</text><line x1="485.0" y1="55" x2="485.0" y2="327" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="485.0" y="343" font-size="10" fill="#7A8590" text-anchor="middle">50%</text><line x1="562.5" y1="55" x2="562.5" y2="327" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="562.5" y="343" font-size="10" fill="#7A8590" text-anchor="middle">75%</text><line x1="640.0" y1="55" x2="640.0" y2="327" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="640.0" y="343" font-size="10" fill="#7A8590" text-anchor="middle">100%</text><text x="20" y="75" font-size="11" fill="#B4552B" text-anchor="start">RTRL  p=4  lr 1.0  (w 36)</text><rect x="330" y="61" width="241.79999999999995" height="20" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="577.8" y="76" font-size="10" fill="#4E5964" text-anchor="start">78%  (18 번 중 14 번)</text><text x="880" y="76" font-size="10" fill="#4E5964" text-anchor="end">성공까지 1,043,000</text><text x="20" y="109" font-size="11" fill="#B4552B" text-anchor="start">RTRL  p=4  lr 4.0  (w 36)</text><rect x="330" y="95" width="173.60000000000002" height="20" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="509.6" y="110" font-size="10" fill="#4E5964" text-anchor="start">56%  (18 번 중 10 번)</text><text x="880" y="110" font-size="10" fill="#4E5964" text-anchor="end">성공까지 892,000</text><text x="20" y="143" font-size="11" fill="#B4552B" text-anchor="start">RTRL  p=4  lr 10.0  (w 36)</text><rect x="330" y="129" width="68.19999999999999" height="20" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="404.2" y="144" font-size="10" fill="#4E5964" text-anchor="start">22%  (18 번 중 4 번)</text><text x="880" y="144" font-size="10" fill="#4E5964" text-anchor="end">성공까지 254,000</text><text x="20" y="177" font-size="11" fill="#B4552B" text-anchor="start">RTRL  p=10  lr 1.0-10.0  (w 144)</text><text x="336.0" y="178" font-size="10" fill="#4E5964" text-anchor="start">0%  (18 번 중 0 번)</text><text x="880" y="178" font-size="10" fill="#4E5964" text-anchor="end">성공까지 &gt; 5,000,000</text><text x="20" y="211" font-size="11" fill="#B4552B" text-anchor="start">RTRL  p=100  lr 1.0-10.0  (w 10,404)</text><text x="336.0" y="212" font-size="10" fill="#4E5964" text-anchor="start">0%  (18 번 중 0 번)</text><text x="880" y="212" font-size="10" fill="#4E5964" text-anchor="end">성공까지 &gt; 5,000,000</text><text x="20" y="245" font-size="11" fill="#B4552B" text-anchor="start">BPTT  p=100  lr 1.0-10.0  (w 10,404)</text><text x="336.0" y="246" font-size="10" fill="#4E5964" text-anchor="start">0%  (18 번 중 0 번)</text><text x="880" y="246" font-size="10" fill="#4E5964" text-anchor="end">성공까지 &gt; 5,000,000</text><text x="20" y="279" font-size="11" fill="#B4552B" text-anchor="start">CH  p=100  lr 1.0  (w 10,506)</text><rect x="330" y="265" width="102.30000000000001" height="20" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="438.3" y="280" font-size="10" fill="#4E5964" text-anchor="start">33%  (18 번 중 6 번)</text><text x="880" y="280" font-size="10" fill="#4E5964" text-anchor="end">성공까지 32,400</text><text x="20" y="313" font-size="11" fill="#2E6B8A" text-anchor="start">LSTM  p=100  lr 1.0  (w 10,504)</text><rect x="330" y="299" width="310.0" height="20" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="646.0" y="314" font-size="10" fill="#4E5964" text-anchor="start">100%  (18 번 중 18 번)</text><text x="880" y="314" font-size="10" fill="#4E5964" text-anchor="end">성공까지 5,040</text><text x="20" y="365" font-size="11" fill="#4E5964" text-anchor="start">18 번 중 정수 번으로 되돌리면 14 · 10 · 4 · 6 번이 원문의 78 · 56 · 22 · 33% 와 맞는다(내가 센 것).</text><text x="20" y="385" font-size="11" fill="#4E5964" text-anchor="start">본문의 「p = 4 에서 전체 실행의 7/9 가 성공」 은 학습률 1.0 줄(14/18) 하나와만 맞는다. 세 학습률을 합치면 28/54 = 51.9% 다.</text><text x="20" y="405" font-size="11" fill="#4E5964" text-anchor="start">「성공까지」 는 성공한 실행만의 평균으로 읽힌다(캡션: 실패한 실행을 빼고 보아도). 그러면 RTRL 14 번과 LSTM 18 번은 다른 모집단이다.</text></svg>
