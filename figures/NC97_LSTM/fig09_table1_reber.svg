<svg xmlns="http://www.w3.org/2000/svg" width="900" height="440" viewBox="0 0 900 440" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 1 내장 Reber 문법 결과"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">표 1 — 내장 Reber 문법: 성공까지 본 서열 수 (가로축 로그). 위 넷은 다른 논문에서 옮긴 값이다</text><line x1="300.0" y1="60" x2="300.0" y2="366" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="300.0" y="382" font-size="10" fill="#7A8590" text-anchor="middle">3,200</text><line x1="420.0" y1="60" x2="420.0" y2="366" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="420.0" y="382" font-size="10" fill="#7A8590" text-anchor="middle">10,000</text><line x1="540.0" y1="60" x2="540.0" y2="366" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="540.0" y="382" font-size="10" fill="#7A8590" text-anchor="middle">31,600</text><line x1="660.0" y1="60" x2="660.0" y2="366" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="660.0" y="382" font-size="10" fill="#7A8590" text-anchor="middle">100,000</text><line x1="780.0" y1="60" x2="780.0" y2="366" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="780.0" y="382" font-size="10" fill="#7A8590" text-anchor="middle">316,200</text><text x="20" y="80" font-size="11" fill="#B4552B" text-anchor="start">RTRL  3  (w ≈170, lr 0.05)</text><rect x="300" y="66" width="417.1310647509108" height="20" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="723.1310647509108" y="81" font-size="10" fill="#4E5964" text-anchor="start">173,000  ·  성공 일부</text><text x="20" y="114" font-size="11" fill="#B4552B" text-anchor="start">RTRL  12  (w ≈494, lr 0.1)</text><rect x="300" y="100" width="215.505602081289" height="20" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="521.505602081289" y="115" font-size="10" fill="#4E5964" text-anchor="start">25,000  ·  성공 일부</text><text x="20" y="148" font-size="11" fill="#B4552B" text-anchor="start">ELM  15  (w ≈435)</text><rect x="300" y="134" width="432.2471989593555" height="20" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="738.2471989593555" y="149" font-size="10" fill="#4E5964" text-anchor="start">&gt; 200,000  ·  성공 0%</text><text x="20" y="182" font-size="11" fill="#B4552B" text-anchor="start">RCC  7-9  (w ≈119-198)</text><rect x="300" y="168" width="422.417133116418" height="20" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="728.417133116418" y="183" font-size="10" fill="#4E5964" text-anchor="start">182,000  ·  성공 50%</text><text x="20" y="216" font-size="11" fill="#2E6B8A" text-anchor="start">LSTM  4 블록 x 1  (w 264, lr 0.1)</text><rect x="300" y="202" width="263.81468706571115" height="20" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="569.8146870657112" y="217" font-size="10" fill="#4E5964" text-anchor="start">39,740  ·  성공 100%</text><text x="20" y="250" font-size="11" fill="#2E6B8A" text-anchor="start">LSTM  3 블록 x 2  (w 276, lr 0.1)</text><rect x="300" y="236" width="200.8943343169259" height="20" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="506.8943343169259" y="251" font-size="10" fill="#4E5964" text-anchor="start">21,730  ·  성공 100%</text><text x="20" y="284" font-size="11" fill="#2E6B8A" text-anchor="start">LSTM  3 블록 x 2  (w 276, lr 0.2)</text><rect x="300" y="270" width="155.51647696411322" height="20" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="461.5164769641132" y="285" font-size="10" fill="#4E5964" text-anchor="start">14,060  ·  성공 97%</text><text x="20" y="318" font-size="11" fill="#2E6B8A" text-anchor="start">LSTM  4 블록 x 1  (w 264, lr 0.5)</text><rect x="300" y="304" width="114.65366526932343" height="20" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="420.6536652693234" y="319" font-size="10" fill="#4E5964" text-anchor="start">9,500  ·  성공 97%</text><text x="20" y="352" font-size="11" fill="#2E6B8A" text-anchor="start">LSTM  3 블록 x 2  (w 276, lr 0.5)</text><rect x="300" y="338" width="102.32218719015725" height="20" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="408.32218719015725" y="353" font-size="10" fill="#4E5964" text-anchor="start">8,440  ·  성공 100%</text><text x="20" y="400" font-size="11" fill="#4E5964" text-anchor="start">LSTM 다섯 줄 = 각 30 번(학습 · 시험 짝 셋 x 초기값 10). 97% 는 30 번 중 29 번(96.7%)이고, 두 줄이 하나씩 실패해 캡션의 「150 번 중 실패 둘」 과 맞는다(내가 센 것).</text><text x="20" y="420" font-size="11" fill="#4E5964" text-anchor="start">ELM 은 「&gt; 200,000」 이라 막대 끝이 하한이다. 맨 아래 줄의 30 번 범위는 3,800 ~ 24,100 (캡션). 다른 줄은 흩어짐이 없다.</text></svg>
