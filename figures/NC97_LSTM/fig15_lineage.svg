<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="LSTM 계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 왼쪽 칸은 이 논문이 인용한 것, 오른쪽 칸은 이 논문 뒤에 나온 것이다 (오른쪽 칸은 이 노트에서 읽지 않았다)</text><rect x="5" y="62" width="210" height="56" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="110" y="84" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">Elman 1988 / 1990</text><text x="110" y="104" font-size="10" fill="#4E5964" text-anchor="middle">단순 순환망, 문맥 유닛</text><rect x="5" y="142" width="210" height="56" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="110" y="164" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">Hochreiter 1991 (학위논문)</text><text x="110" y="184" font-size="10" fill="#4E5964" text-anchor="middle">오차가 지수로 사라진다</text><rect x="5" y="222" width="210" height="56" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="110" y="244" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">Bengio 외 1994</text><text x="110" y="264" font-size="10" fill="#4E5964" text-anchor="middle">기울기로 긴 의존을 배우기 어렵다</text><rect x="5" y="302" width="210" height="56" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="110" y="324" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">Mozer 1992 · Schmidhuber 1992</text><text x="110" y="344" font-size="10" fill="#4E5964" text-anchor="middle">시간 상수 · 서열 덩이 짓기</text><rect x="345" y="182" width="210" height="56" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="450" y="204" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">LSTM 1997 (이 논문)</text><text x="450" y="224" font-size="10" fill="#4E5964" text-anchor="middle">CEC + 입력 · 출력 게이트, 잘린 기울기</text><rect x="675" y="52" width="210" height="56" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="780" y="74" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">Gers 외 2000</text><text x="780" y="94" font-size="10" fill="#4E5964" text-anchor="middle">망각 게이트</text><rect x="675" y="122" width="210" height="56" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="780" y="144" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">Gers 외 2002</text><text x="780" y="164" font-size="10" fill="#4E5964" text-anchor="middle">엿보기 연결</text><rect x="675" y="192" width="210" height="56" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="780" y="214" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">Graves 외 2005</text><text x="780" y="234" font-size="10" fill="#4E5964" text-anchor="middle">자르지 않은 BPTT</text><rect x="675" y="262" width="210" height="56" rx="6"