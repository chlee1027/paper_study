<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="실험마다 근거의 모양"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">실험마다 근거의 모양 — 견준 방법을 저자가 같은 조건에서 돌린 것은 실험 2a · 2b 뿐이다</text><rect x="20" y="50" width="860" height="30" rx="0" fill="#D8E7EE" stroke="#CFD6D3" stroke-width="0.8"/><text x="110.0" y="69.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">실험</text><text x="245.0" y="69.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">반복 수</text><text x="360.0" y="69.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">흩어짐</text><text x="510.0" y="69.0" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">저자가 돌린 비교</text><text x="680.0" y="69.0" font-si