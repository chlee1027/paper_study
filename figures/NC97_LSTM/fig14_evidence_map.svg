" font-size="11" fill="#1C232C" text-anchor="middle">2b (본문)</text><text x="245.0" y="159.0" font-size="11" fill="#1C232C" text-anchor="middle">18</text><rect x="291" y="141" width="138" height="28" rx="0" fill="#F6D9D5" stroke="none" stroke-width="0"/><text x="360.0" y="159.0" font-size="11" fill="#1C232C" text-anchor="middle">없다</text><rect x="431" y="141" width="158" height="28" rx="0" fill="#D6EEDD" stroke="none" stroke-width="0"/><text x="510.0" y="159.0" font-size="11" fill="#1C232C" text-anchor="middle">CH (실패만 적음)</text><text x="680.0" y="159.0" font-size="11" fill="#1C232C" text-anchor="middle"></text><text x="825.0" y="159.0" font-size="11" fill="#1C232C" text-anchor="middle"></text><rect x="20" y="170" width="860" height="30" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="110.0" y="189.0" font-size="11" fill="#1C232C" text-anchor="middle">2c (표 3)</text><text x="245.0" y="189.0" font-size="11" fill="#1C232C" text-anchor="middle">20</text><rect x="291" y="171" width="138" height="28" rx="0" fill="#F6D9D5" stroke="none" stroke-width="0"/><text x="360.0" y="189.0" font-size="11" fill="#1C232C" text-anchor="middle">없다</text><rect x="431" y="171" width="158" height="28" rx="0" fill="#F6F7F5" stroke="none" stroke-width="0"/><text x="510.0" y="189.0" font-size="11" fill="#1C232C" text-anchor="middle">아니다</text><text x="680.0" y="189.0" font-size="11" fill="#1C232C" text-anchor="middle"></text><rect x="771" y="171" width="108" height="28" rx="0" fill="#F6D9D5" stroke="none" stroke-width="0"/><text x="825.0" y="189.0" font-size="11" fill="#1C232C" text-anchor="middle">LSTM 만</text><rect x="20" y="200" width="860" height="30" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="110.0" y="219.0" font-size="11" fill="#1C232C" text-anchor="middle">3a · 3b · 3c (표 4 ~ 6)</text><text x="245.0" y="219.0" font-size="11" fill="#1C232C" text-anchor="middle">10</text><rect x="291" y="201" width="138" height="28" rx="0" fill="#F6D9D5" strok