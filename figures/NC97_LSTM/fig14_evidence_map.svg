ct x="431" y="261" width="158" height="28" rx="0" fill="#F6F7F5" stroke="none" stroke-width="0"/><text x="510.0" y="279.0" font-size="11" fill="#1C232C" text-anchor="middle">아니다</text><text x="680.0" y="279.0" font-size="11" fill="#1C232C" text-anchor="middle"></text><rect x="771" y="261" width="108" height="28" rx="0" fill="#F6D9D5" stroke="none" stroke-width="0"/><text x="825.0" y="279.0" font-size="11" fill="#1C232C" text-anchor="middle">LSTM 만</text><rect x="20" y="290" width="860" height="30" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="0.8"/><text x="110.0" y="309.0" font-size="11" fill="#1C232C" text-anchor="middle">6a · 6b (표 9)</text><text x="245.0" y="309.0" font-size="11" fill="#1C232C" text-anchor="middle">20 · 10</text><rect x="291" y="291" width="138" height="28" rx="0" fill="#F6D9D5" stroke="none" stroke-width="0"/><text x="360.0" y="309.0" font-size="11" fill="#1C232C" text-anchor="middle">없다</text><rect x="431" y="291" width="158" height="28" rx="0" fill="#F6F7F5" stroke="none" stroke-width="0"/><text x="510.0" y="309.0" font-size="11" fill="#1C232C" text-anchor="middle">아니다</text><text x="680.0" y="309.0" font-size="11" fill="#1C232C" text-anchor="middle"></text><rect x="771" y="291" width="108" height="28" rx="0" fill="#F6D9D5" stroke="none" stroke-width="0"/><text x="825.0" y="309.0" font-size="11" fill="#1C232C" text-anchor="middle">LSTM 만</text><text x="20" y="350" font-size="11" fill="#4E5964" text-anchor="start">「다른 순환망 알고리즘으로 풀린 적 없다」(실험 2c ~ 6) 는 저자가 아는 문헌에 대한 말이고, 같은 과제에서 RTRL · BPTT 를 돌린 값은 없다.</text><text x="20" y="368" font-size="11" fill="#4E5964" text-anchor="start">근거로 든 것은 2a 에서 RTRL · BPTT 가 지연 10 에서도 실패했다는 것 하나다.</text></svg>
