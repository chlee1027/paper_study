<svg xmlns="http://www.w3.org/2000/svg" width="820" height="335" viewBox="0 0 820 335" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="단계별 유닛 종류 표"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">어느 유닛이 어떤 값을 갖는가 — 논문이 한 문단에 몰아 적은 것을 풀어 놓는다</text><rect x="20" y="50" width="220" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="74" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold"></text><rect x="240" y="50" width="300" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="390.0" y="74" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">사전학습 (RBM)</text><rect x="540" y="50" width="260" height="38" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="670.0" y="74" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">미세조정 (펼친 망)</text><rect x="20" y="92" width="220" height="38" rx="0" fill="#E3E8E5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="116" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">맨 아래 보이는 층</text><rect x="240" y="92" width="300" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="390.0" y="116" font-size="12" fill="#1C232C" text-anchor="middle">[0,1] 실수값(로지스틱). 얼굴은 선형 + 가우스 잡음</text><rect x="540" y="92" width="260" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="670.0" y="116" font-size="12" fill="#1C232C" text-anchor="middle">입력 그대로</text><rect x="20" y="134" width="220" height="38" rx="0" fill="#E3E8E5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="158" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">중간 층 (RBM 의 보이는 쪽)</text><rect x="240" y="134" width="300" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="390.0" y="158" font-size="12" fill="#1C232C" text-anchor="middle">아래 RBM 숨은 유닛의 활성 확률(실수)</text><rect x="540" y="134" width="260" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="670.0" y="158" font-size="12" fill="#1C232C" text-anchor="middle">—</text><rect x="20" y="176" width="220" height="38" rx="0" fill="#E3E8E5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="200" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">중간 층 (RBM 의 숨은 쪽)</text><rect x="240" y="176" width="300" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="390.0" y="200" font-size="12" fill="#1C232C" text-anchor="middle">확률적 이진값 0/1</text><rect x="540" y="176" width="260" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="670.0" y="200" font-size="12" fill="#B4552B" text-anchor="middle">결정적 실수 확률 σ(·)</text><rect x="20" y="218" width="220" height="38" rx="0" fill="#E3E8E5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="242" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">맨 위 RBM 의 숨은 층 = 코드</text><rect x="240" y="218" width="300" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="390.0" y="242" font-size="12" fill="#1C232C" text-anchor="middle">분산 1 가우스, 평균은 입력으로 정해짐</text><rect x="540" y="218" width="260" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="670.0" y="242" font-size="12" fill="#1C232C" text-anchor="middle">선형 유닛</text><rect x="20" y="260" width="220" height="38" rx="0" fill="#E3E8E5" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="284" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">출력 층</text><rect x="240" y="260" width="300" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="390.0" y="284" font-size="12" fill="#1C232C" text-anchor="middle">—</text><rect x="540" y="260" width="260" height="38" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="670.0" y="284" font-size="12" fill="#1C232C" text-anchor="middle">로지스틱 + 교차 엔트로피 (곡선·MNIST)</text><text x="410" y="322" font-size="12" fill="#B4552B" text-anchor="middle">주황 칸: 사전학습의 확률적 이진 상태가 미세조정에서 결정적 실수로 바뀐다</text></svg>
