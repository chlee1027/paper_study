<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="큰 초기 가중치, 작은 초기 가중치, 좋은 초기 가중치"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">처음 가중치를 어디에 두는가 — 세 경우</text><rect x="20" y="50" width="240" height="250" rx="6" fill="#F6F7F5" stroke="#C0392B" stroke-width="1.6"/><text x="140" y="76" font-size="14" fill="#C0392B" text-anchor="middle" font-weight="bold">큰 초기 가중치</text><text x="140" y="110" font-size="12" fill="#1C232C" text-anchor="middle">나쁜 국소 최소에 갇힌다</text><text x="140" y="132" font-size="12" fill="#1C232C" text-anchor="middle"></text><text x="140" y="154" font-size="12" fill="#4E5964" text-anchor="middle"></text><text x="140" y="176" font-size="12" fill="#4E5964" text-anchor="middle">논문: 대개(typically) 나쁜</text><text x="140" y="198" font-size="12" fill="#4E5964" text-anchor="middle">국소 최소를 찾는다</text><path d="M50,230 C80,280 110,240 140,260 S190,295 230,230" fill="none" stroke="#4E5964" stroke-width="1.6"/><circle cx="103" cy="252" r="5" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/><rect x="290" y="50" width="240" height="250" rx="6" fill="#F6F7F5" stroke="#C0392B" stroke-width="1.6"/><text x="410" y="76" font-size="14" fill="#C0392B" text-anchor="middle" font-weight="bold">작은 초기 가중치</text><text x="410" y="110" font-size="12" fill="#1C232C" text-anchor="middle">앞쪽 층의 기울기가 아주 작다</text><text x="410" y="132" font-size="12" fill="#1C232C" text-anchor="middle">은닉층 여럿이면 학습이 안 된다</text><text x="410" y="154" font-size="12" fill="#4E5964" text-anchor="middle"></text><text x="410" y="176" font-size="12" fill="#4E5964" text-anchor="middle">곡선 망에서 로지스틱 층 10 개:</text><text x="410" y="198" font-size="12" fill="#4E5964" text-anchor="middle">0.25^10 = 9.5e-07 (가장 잘 받을 때)</text><path d="M320,230 C350,280 380,240 410,260 S460,295 500,230" fill="none" stroke="#4E5964" stroke-width="1.6"/><circle cx="475" cy="242" r="5" fill="#C0392B" stroke="#C0392B" stroke-width="1.2"/><rect x="560" y="50" width="240" height="250" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="680" y="76" font-size="14" fill="#1E8449" text-anchor="middle" font-weight="bold">좋은 해에 가까운 초기 가중치</text><text x="680" y="110" font-size="12" fill="#1C232C" text-anchor="middle">경사 하강이 잘 된다</text><text x="680" y="132" font-size="12" fill="#1C232C" text-anchor="middle"></text><text x="680" y="154" font-size="12" fill="#4E5964" text-anchor="middle">그 자리를 찾는 것이</text><text x="680" y="176" font-size="12" fill="#4E5964" text-anchor="middle">이 논문의 사전학습이다</text><text x="680" y="198" font-size="12" fill="#4E5964" text-anchor="middle">(한 층씩 배우는 전혀 다른 알고리즘)</text><path d="M600,230 Q680,300 760,230" fill="none" stroke="#4E5964" stroke-width="1.6"/><circle cx="660" cy="262" r="5" fill="#1E8449" stroke="#1E8449" stroke-width="1.2"/><text x="410" y="322" font-size="11" fill="#7A8590" text-anchor="middle">0.25 는 로지스틱 기울기 σ'(z) 의 최댓값. 이 곱은 내가 층 수를 세어 붙인 상한이고 논문의 계산이 아니다</text></svg>
