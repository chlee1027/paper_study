<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보와 이상 탐지로 가는 곁가지"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 앞 편의 한계를 받아 다음 편에 넘긴다</text><rect x="25" y="60" width="170" height="60" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="110" y="85" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">역전파 1986</text><text x="110" y="105" font-size="11" fill="#4E5964" text-anchor="middle">은닉층에 몫을 나눈다</text><line x1="197" y1="90" x2="223" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="225" y="60" width="170" height="60" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="310" y="85" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">DBN 2006</text><text x="310" y="105" font-size="11" fill="#4E5964" text-anchor="middle">한 층씩 RBM 으로 쌓는다</text><line x1="397" y1="90" x2="423" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="425" y="60" width="170" height="60" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="510" y="85" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">오토인코더 2006</text><text x="510" y="105" font-size="11" fill="#4E5964" text-anchor="middle">펼쳐서 역전파로 다듬는다</text><line x1="597" y1="90" x2="623" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="625" y="60" width="170" height="60" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="710" y="85" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">VAE (다음)</text><text x="710" y="105" font-size="11" fill="#4E5964" text-anchor="middle">코드에 확률 분포를 준다</text><text x="225" y="148" font-size="11" fill="#1C232C" text-anchor="middle">넘긴 것: 깊은 망은</text><text x="225" y="164" font-size="11" fill="#1C232C" text-anchor="middle">초기값에 따라 안 배워진다</text><text x="425" y="148" font-size="11" fill="#1C232C" text-anchor="middle">넘긴 것: 쌓은 층을</text><text x="425" y="164" font-size="11" fill="#1C232C" text-anchor="middle">차원 줄이기에 쓰지 않았다</text><text x="625" y="148" font-size="11" fill="#1C232C" text-anchor="middle">남긴 것: 코드의 분포를 정하지 않아</text><text x="625" y="164" font-size="11" fill="#1C232C" text-anchor="middle">코드를 뽑아 새 이미지를 만들 길이 없다</text><rect x="25" y="200" width="770" height="140" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="45" y="226" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">곁가지 — 재구성 오차를 이상 점수로 쓰는 길 (논문은 이 쓰임을 적지 않는다. 내가 잇는 자리다)</text><text x="45" y="252" font-size="12" fill="#1C232C" text-anchor="start">정상 데이터만으로 오토인코더를 배우고, 재구성이 잘 안 되는 입력을 이상으로 본다</text><text x="45" y="276" font-size="12" fill="#1C232C" text-anchor="start">이 논문의 목표는 반대 방향이다 — 처음 보는 시험 이미지도 잘 재구성하는 것이 성공이다</text><text x="45" y="300" font-size="12" fill="#1C232C" text-anchor="start">그래서 「잘 일반화하는 오토인코더」는 이상도 잘 재구성해 버릴 수 있다. 이상 탐지에 가져가려면 이 긴장부터 잰다</text><text x="45" y="324" font-size="12" fill="#4E5964" text-anchor="start">사전학습이 없을 때 「평균만 재구성한다」는 논문의 관찰은, 반대로 모든 입력의 점수를 같게 만든다</text></svg>
