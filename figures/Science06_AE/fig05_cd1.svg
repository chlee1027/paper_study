<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="대조 발산 한 걸음"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">식 (2) 의 한 번 갱신 — 데이터에서 한 번, 지어낸 것(confabulation)에서 한 번</text><rect x="35" y="186" width="110" height="48" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="90" y="216" font-size="18" fill="#2E6B8A" text-anchor="middle" font-weight="bold">v</text><text x="90" y="254" font-size="11" fill="#4E5964" text-anchor="middle">학습 이미지</text><line x1="145" y1="198" x2="212" y2="112" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="215" y="76" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.5"/><text x="270" y="106" font-size="18" fill="#B4552B" text-anchor="middle" font-weight="bold">h</text><text x="270" y="66" font-size="11" fill="#4E5964" text-anchor="middle">σ(b(j)+Σv w) 로 0/1 뽑기</text><line x1="325" y1="112" x2="392" y2="198" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="395" y="186" width="110" height="48" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="450" y="216" font-size="18" fill="#2E6B8A" text-anchor="middle" font-weight="bold">v′</text><text x="450" y="254" font-size="11" fill="#4E5964" text-anchor="middle">σ(b(i)+Σh w) 로 지어낸 이미지</text><line x1="505" y1="198" x2="572" y2="112" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="575" y="76" width="110" height="48" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.5"/><text x="630" y="106" font-size="18" fill="#B4552B" text-anchor="middle" font-weight="bold">h′</text><text x="630" y="66" font-size="11" fill="#4E5964" text-anchor="middle">다시 한 번 올린다</text><path d="M90,160 Q180,150 270,130" fill="none" stroke="#1E8449" stroke-width="0"/><rect x="140" y="150" width="150" height="26" rx="6" fill="#DDEFE3" stroke="#1E8449" stroke-width="1.2"/><text x="215" y="168" font-size="12" fill="#1E8449" text-anchor="middle" font-weight="bold">⟨v h⟩ data</text><rect x="500" y="150" width="150" height="26" rx="6" fill="#F6DAD6" stroke="#C0392B" stroke-width="1.2"/><text x="575" y="168" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">⟨v h⟩ recon</text><text x="410" y="282" font-size="12" fill="#1C232C" text-anchor="middle">Δw(i,j) = ε ( ⟨v(i) h(j)⟩data − ⟨v(i) h(j)⟩recon ) — 데이터의 에너지를 낮추고 지어낸 것의 에너지를 올린다</text></svg>
