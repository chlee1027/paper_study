 y="252" font-size="11" fill="#4E5964" text-anchor="end">(픽셀)</text><text x="80" y="132" font-size="11" fill="#4E5964" text-anchor="end">(특징 검출기)</text><text x="345" y="285" font-size="12" fill="#4E5964" text-anchor="middle">층 안 연결이 없으므로 v 를 알면 h 의 유닛들이 서로 독립이다(반대도 같다)</text><rect x="610" y="70" width="195" height="205" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="707" y="94" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">식 (1) 에너지</text><text x="707" y="120" font-size="12" fill="#1C232C" text-anchor="middle">E(v,h) = − Σ b(i) v(i)</text><text x="707" y="140" font-size="12" fill="#1C232C" text-anchor="middle">− Σ b(j) h(j)</text><text x="707" y="160" font-size="12" fill="#1C232C" text-anchor="middle">− Σ v(i) h(j) w(i,j)</text><text x="707" y="190" font-size="12" fill="#4E5964" text-anchor="middle">에너지가 낮은 (v,h) 가</text><text x="707" y="208" font-size="12" fill="#4E5964" text-anchor="middle">높은 확률을 받는다</text><text x="707" y="238" font-size="12" fill="#B4552B" text-anchor="middle">p(h(j)=1 | v)</text><text x="707" y="256" font-size="12" fill="#B4552B" text-anchor="middle">= σ(b(j) + Σ v(i) w(i,j))</text></svg>
