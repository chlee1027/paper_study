<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="문서 검색 절차"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">문서 검색 — 기사 하나를 10 개의 수로 줄이고, 코드끼리의 코사인으로 찾는다</text><rect x="30" y="70" width="160" height="52" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="110" y="101" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">기사 한 편</text><text x="110" y="145" font-size="11" fill="#4E5964" text-anchor="middle">뉴스 기사 804,414 편</text><line x1="192" y1="96" x2="226" y2="96" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="230" y="70" width="160" height="52" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="310" y="101" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">단어 2000 개 확률</text><text x="310" y="145" font-size="11" fill="#4E5964" text-anchor="middle">가장 흔한 어간 2000 개의</text><text x="310" y="161" font-size="11" fill="#4E5964" text-anchor="middle">기사 안 비율</text><line x1="392" y1="96" x2="426" y2="96" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="430" y="70" width="160" height="52" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.5"/><text x="510" y="101" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">10 차원 코드</text><text x="510" y="145" font-size="11" fill="#4E5964" text-anchor="middle">2000-500-250-125-10</text><text x="510" y="161" font-size="11" fill="#4E5964" text-anchor="middle">오토인코더</text><line x1="592" y1="96" x2="626" y2="96" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="630" y="70" width="160" height="52" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.5"/><text x="710" y="101" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">코사인 유사도</text><text x="710" y="145" font-size="11" fill="#4E5964" text-anchor="middle">질의 코드와 각도가</text><text x="710" y="161" font-size="11" fill="#4E5964" text-anchor="middle">가까운 순서로 꺼낸다</text><rect x="30" y="200" width="760" height="100" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="50" y="224" font-size="12" fill="#1C232C" text-anchor="start">학습: 절반(402,207 편). 미세조정 손실은 여러 부류 교차 엔트로피 −Σ p(i) log p̂(i)</text><text x="50" y="246" font-size="12" fill="#1C232C" text-anchor="start">평가: 나머지 절반의 기사 하나하나를 질의로 삼아 같은 부류 기사가 몇 % 나오는지 — 질의 402,207 개의 평균</text><text x="50" y="268" font-size="12" fill="#1C232C" text-anchor="start">비교: 잠재 의미 분석(LSA, 주성분 분석과 같은 뿌리) 10 차원 · 50 차원</text><text x="50" y="290" font-size="12" fill="#1E8449" text-anchor="start">804,414 / 2 = 402,207 — 질의 수와 정확히 맞는다(이 파일이 나눠 본 값)</text></svg>
