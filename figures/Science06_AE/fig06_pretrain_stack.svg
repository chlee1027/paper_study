<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="RBM 넷을 쌓는 사전학습"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">사전학습 — RBM 넷을 아래에서부터 하나씩 배운다 (논문 그림 1 의 얼굴 망)</text><rect x="40" y="60" width="170" height="250" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2" stroke-dasharray="4 3"/><text x="125" y="82" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">RBM 1</text><rect x="65" y="250" width="120" height="30" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="125" y="270" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">625</text><rect x="65" y="120" width="120" height="30" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="125" y="140" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">2,000</text><line x1="125" y1="245" x2="125" y2="156" stroke="#4E5964" stroke-width="1.5"/><text x="137" y="205" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">W1</text><text x="125" y="300" font-size="11" fill="#4E5964" text-anchor="middle">보이는 층 = 픽셀</text><text x="125" y="112" font-size="11" fill="#4E5964" text-anchor="middle">숨은 층</text><path d="M187,135 C215,135 230,265 258,265" fill="none" stroke="#1E8449" stroke-width="1.6" marker-end="url(#ao)"/><rect x="235" y="60" width="170" height="250" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2" stroke-dasharray="4 3"/><text x="320" y="82" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">RBM 2</text><rect x="260" y="250" width="120" height="30" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="320" y="270" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">2,000</text><rect x="260" y="120" width="120" height="30" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="320" y="140" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">1,000</text><line x1="320" y1="245" x2="320" y2="156" stroke="#4E5964" stroke-width="1.5"/><text x="332" y="205" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">W2</text><text x="320" y="300" font-size="11" fill="#4E5964" text-anchor="middle">보이는 층</text><text x="320" y="112" font-size="11" fill="#4E5964" text-anchor="middle">숨은 층</text><path d="M382,135 C410,135 425,265 453,265" fill="none" stroke="#1E8449" stroke-width="1.6" marker-end="url(#ao)"/><rect x="430" y="60" width="170" height="250" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2" stroke-dasharray="4 3"/><text x="515" y="82" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">RBM 3</text><rect x="455" y="250" width="120" height="30" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="515" y="270" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">1,000</text><rect x="455" y="120" width="120" height="30" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="515" y="140" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">500</text><line x1="515" y1="245" x2="515" y2="156" stroke="#4E5964" stroke-width="1.5"/><text x="527" y="205" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">W3</text><text x="515" y="300" font-size="11" fill="#4E5964" text-anchor="middle">보이는 층</text><text x="515" y="112" font-size="11" fill="#4E5964" text-anchor="middle">숨은 층</text><path d="M577,135 C605,135 620,265 648,265" fill="none" stroke="#1E8449" stroke-width="1.6" marker-end="url(#ao)"/><rect x="625" y="60" width="170" height="250" rx="6" fill="none" stroke="#CFD6D3" stroke-width="1.2" stroke-dasharray="4 3"/><text x="710" y="82" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">RBM 4 (맨 위)</text><rect x="650" y="250" width="120" height="30" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="710" y="270" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">500</text><rect x="650" y="120" width="120" height="30" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="710" y="140" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">30</text><line x1="710" y1="245" x2="710" y2="156" stroke="#4E5964" stroke-width="1.5"/><text x="722" y="205" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">W4</text><text x="710" y="300" font-size="11" fill="#4E5964" text-anchor="middle">보이는 층</text><text x="710" y="112" font-size="11" fill="#4E5964" text-anchor="middle">숨은 층</text><text x="410" y="338" font-size="12" fill="#1E8449" text-anchor="middle">초록 화살표: 아래 RBM 을 다 배우고 얼린 뒤, 데이터를 넣어 얻은 숨은 층 활성을 다음 RBM 의 「데이터」로 쓴다</text><text x="410" y="360" font-size="12" fill="#4E5964" text-anchor="middle">RBM 하나에는 숨은 층이 하나뿐이다. 깊이는 쌓아서 얻는다</text></svg>
