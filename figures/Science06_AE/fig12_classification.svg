<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="MNIST 분류 오차 막대그래프"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">MNIST 분류 시험 오차 (%) — 논문이 적은 셋과, 같은 해 DBN 논문의 값 하나</text><path d="M70,270 L70,94.0 Q70,90.0 74,90.0 L136,90.0 Q140,90.0 140,94.0 L140,270 z" fill="#2A78D6"/><text x="105" y="82.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">1.6</text><text x="105" y="288" font-size="11" fill="#1C232C" text-anchor="middle">무작위 초기화 역전파</text><text x="105" y="304" font-size="10" fill="#7A8590" text-anchor="middle">논문이 인용한 최고 보고값</text><path d="M250,270 L250,116.50000000000003 Q250,112.50000000000003 254,112.50000000000003 L316,112.50000000000003 Q320,112.50000000000003 320,116.50000000000003 L320,270 z" fill="#1BAF7A"/><text x="285" y="104.50000000000003" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">1.4</text><text x="285" y="288" font-size="11" fill="#1C232C" text-anchor="middle">서포트 벡터 머신</text><text x="285" y="304" font-size="10" fill="#7A8590" text-anchor="middle">논문이 인용한 최고 보고값</text><path d="M430,270 L430,139.0 Q430,135.0 434,135.0 L496,135.0 Q500,135.0 500,139.0 L500,270 z" fill="#EB6834"/><text x="465" y="127.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">1.2</text><text x="465" y="288" font-size="11" fill="#1C232C" text-anchor="middle">사전학습 + 역전파</text><text x="465" y="304" font-size="10" fill="#7A8590" text-anchor="middle">784-500-500-2000-10, 이 논문</text><path d="M610,270 L610,133.375 Q610,129.375 614,129.375 L676,129.375 Q680,129.375 680,133.375 L680,270 z" fill="#7A8590"/><text x="645" y="121.375" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">1.25</text><text x="645" y="288" font-size="11" fill="#1C232C" text-anchor="middle">DBN 위-아래 미세조정</text><text x="645" y="304" font-size="10" fill="#7A8590" text-anchor="middle">같은 해 다른 논문(참고로만)</text><line x1="50" y1="270" x2="790" y2="270" stroke="#4E5964" stroke-width="1"/><text x="790" y="60" font-size="11" fill="#7A8590" text-anchor="end">논문에 seed 수 · 변동 폭이 없다 — 1.2 와 1.25 의 순서를 매기지 않는다</text></svg>
