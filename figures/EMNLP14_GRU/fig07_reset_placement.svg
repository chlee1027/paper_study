<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="재설정 게이트 곱하는 자리 두 꼴"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="20" y="30" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">재설정 게이트를 어디서 곱하나 — 원문 식 (8) 은 행렬 곱 전에, PyTorch nn.GRU 는 행렬 곱 뒤에 곱한다 (내가 고른 2 차원 예)</text><text x="40" y="75" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">U = [[1, 1], [0, 1]],  h&lt;t-1&gt; = (1, 1),  r = (0, 1)</text><text x="40" y="97" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="40" y="119" font-size="12" fill="#B4552B" text-anchor="start" font-weight="bold">원문 식 (8):   U (r ⊙ h) = U (0, 1) = (1, 1)</text><text x="40" y="141" font-size="12" fill="#4E5964" text-anchor="start">    유닛 1 의 재설정(r1 = 0)이 유닛 1 의 옛 값만 지운다. 유닛 2 의 옛 값은 U 를 거쳐 유닛 1 에 들어온다</text><text x="40" y="163" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="40" y="185" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">PyTorch:       r ⊙ (U h) = (0, 1) ⊙ (2, 1) = (0, 1)</text><text x="40" y="207" font-size="12" fill="#4E5964" text-anchor="start">    유닛 1 이 받는 순환 입력 전체가 지워진다</text><text x="40" y="229" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="40" y="251" font-size="12" fill="#7A8590" text-anchor="start">유닛이 하나면(U 가 수 하나) 두 꼴이 같다. 둘 이상이고 U 가 유닛끼리 섞을 때만 갈린다</text><text x="40" y="273" font-size="12" fill="#7A8590" text-anchor="start">원문 꼴은 r 을 먼저 구해야 U 를 곱할 수 있다. PyTorch 꼴은 U_r h · U_z h · U h 를 한 번의 행렬 곱으로 묶을 수 있다 (내 정리, 원문에 없다)</text></svg>
