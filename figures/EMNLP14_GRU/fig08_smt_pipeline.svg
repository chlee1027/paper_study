<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="SMT 안에서 RNN 점수가 들어가는 자리"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">실험에서 RNN 인코더-디코더가 하는 일 (3 · 3.1 · 4.2절) — 번역을 만들지 않는다. 구문표의 짝마다 점수 한 칸을 더한다</text><rect x="40" y="70" width="300" height="150" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="190" y="92" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">구문표 (348M 단어에서 만든 것)</text><text x="55" y="118" font-size="11" fill="#4E5964" text-anchor="start">영어 구문  |  프랑스어 구문  |  기존 점수들 ...</text><text x="55" y="140" font-size="11" fill="#4E5964" text-anchor="start">at the end of the | à la fin de la | ...</text><text x="55" y="162" font-size="11" fill="#4E5964" text-anchor="start">for the first time | pour la première fois | ...</text><rect x="240" y="175" width="90" height="36" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="285" y="198" font-size="11" fill="#B4552B" text-anchor="middle" font-weight="bold">+ RNN 점수</text><rect x="40" y="260" width="300" height="70" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="190" y="285" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">RNN 인코더-디코더</text><text x="190" y="307" font-size="11" fill="#4E5964" text-anchor="middle">구문 짝을 빈도 없이 고르게 뽑아 학습, 64 짝씩</text><line x1="285" y1="257" x2="285" y2="214" stroke="#B4552B" stroke-width="1.4" marker-end="url(#ar)"/><rect x="400" y="70" width="250" height="110" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="525" y="95" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">로그 선형 모형 식 (9)</text><text x="525" y="120" font-size="11" fill="#4E5964" text-anchor="middle">log p(f|e) = Σ w_n f_n(f, e) + log Z(e)</text><text x="525" y="145" font-size="11" fill="#4E5964" text-anchor="middle">w_n 은 개발 셋 BLEU 로 MERT 가 맞춘다</text><text x="525" y="166" font-size="10" fill="#7A8590" text-anchor="middle">(newstest2012 · 2013)</text><line x1="342" y1="130" x2="397" y2="130" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="400" y="210" width="250" height="60" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="525" y="235" font-size="11" fill="#9A7B00" text-anchor="middle" font-weight="bold">CSLM (목표어 신경망 언어 모형)</text><text x="525" y="255" font-size="10" fill="#4E5964" text-anchor="middle">디코딩 중 부분 번역에 점수</text><line x1="525" y1="207" x2="525" y2="183" stroke="#9A7B00" stroke-width="1.2" marker-end="url(#ac)"/><rect x="400" y="290" width="250" height="44" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2" stroke-dasharray="4 3"/><text x="525" y="317" font-size="11" fill="#4E5964" text-anchor="middle">단어 벌점 WP = 미등록 단어 수 (각주 3)</text><line x1="652" y1="310" x2="700" y2="160" stroke="#4E5964" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#ai)"/><rect x="700" y="100" width="170" height="80" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.2"/><text x="785" y="128" font-size="12" fill="#1E8449" text-anchor="middle" font-weight="bold">Moses 디코더</text><text x="785" y="150" font-size="11" fill="#4E5964" text-anchor="middle">-&gt; 시험 셋 BLEU</text><text x="785" y="168" font-size="10" fill="#7A8590" text-anchor="middle">(newstest2014, 참조 하나)</text><line x1="652" y1="130" x2="697" y2="130" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="450" y="365" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">그래서 표 1 의 BLEU 는 「RNN 인코더-디코더의 번역 품질」 이 아니라 「기존 SMT 에 점수 한 칸을 더한 결과」 다</text></svg>
