<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="게이트 은닉 유닛의 계산 흐름"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">제안한 은닉 유닛 (2.3절, 식 5-8) — 게이트 둘. 원문은 이 유닛에 이름을 붙이지 않는다(나중 이름: GRU)</text><rect x="40" y="150" width="90" height="50" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="85" y="180" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">h&lt;t-1&gt;</text><rect x="40" y="280" width="90" height="44" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="85" y="307" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">x</text><rect x="220" y="70" width="150" height="50" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="295" y="92" font-size="11" fill="#9A7B00" text-anchor="middle">재설정 r = σ(W_r x + U_r h)</text><text x="295" y="110" font-size="10" fill="#7A8590" text-anchor="middle">식 (5)</text><rect x="220" y="235" width="150" height="50" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="295" y="257" font-size="11" fill="#9A7B00" text-anchor="middle">갱신 z = σ(W_z x + U_z h)</text><text x="295" y="275" font-size="10" fill="#7A8590" text-anchor="middle">식 (6)</text><rect x="450" y="70" width="190" height="50" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="545" y="92" font-size="11" fill="#B4552B" text-anchor="middle">후보 h~ = tanh(W x + U(r⊙h))</text><text x="545" y="110" font-size="10" fill="#7A8590" text-anchor="middle">식 (8). φ 는 4.1.1절에서 tanh</text><rect x="690" y="170" width="180" height="60" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.2"/><text x="780" y="195" font-size="12" fill="#1E8449" text-anchor="middle" font-weight="bold">h&lt;t&gt; = z·h&lt;t-1&gt; + (1-z)·h~</text><text x="780" y="215" font-size="10" fill="#7A8590" text-anchor="middle">식 (7)</text><line x1="130" y1="168" x2="218" y2="100" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="130" y1="182" x2="218" y2="255" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="130" y1="296" x2="218" y2="270" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="130" y1="290" x2="218" y2="108" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="370" y1="95" x2="448" y2="95" stroke="#9A7B00" stroke-width="1.2" marker-end="url(#ac)"/><line x1="640" y1="95" x2="720" y2="168" stroke="#B4552B" stroke-width="1.2" marker-end="url(#ar)"/><line x1="370" y1="260" x2="688" y2="210" stroke="#9A7B00" stroke-width="1.2" marker-end="url(#ac)"/><line x1="130" y1="160" x2="448" y2="82" stroke="#2E6B8A" stroke-width="1.2" marker-end="url(#af)"/><path d="M85,150 L85,52 L780,52 L780,168" fill="none" stroke="#2E6B8A" stroke-width="1.2" stroke-dasharray="5 4" marker-end="url(#af)"/><text x="780" y="252" font-size="11" fill="#2E6B8A" text-anchor="middle">점선: z 가 1 이면 h&lt;t-1&gt; 이 그대로 건너간다</text><text x="780" y="270" font-size="11" fill="#2E6B8A" text-anchor="middle">(이 길에는 곱하는 행렬도 tanh 도 없다)</text><text x="450" y="350" font-size="11" fill="#4E5964" text-anchor="middle">표기: 원문 식은 유닛 j 하나의 값([·]_j)으로 적고, 바이어스 항이 없다. 유닛 하나에 재설정 · 갱신 게이트가 따로 있다</text></svg>
