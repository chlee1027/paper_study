<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="층 하나의 무게 수 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="20" y="30" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">층 하나(입력 100, 은닉 1,000)의 무게 수 — 내가 센 것. 무게 묶음 (W, U) 하나 = 100x1,000 + 1,000x1,000 = 1,100,000</text><text x="250" y="92" font-size="12" fill="#4E5964" text-anchor="end" font-weight="bold">게이트 없는 tanh</text><rect x="260" y="70" width="130.0" height="32" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="398.0" y="92" font-size="12" fill="#4E5964" text-anchor="start">1 묶음 = 1,100,000</text><text x="250" y="147" font-size="12" fill="#B4552B" text-anchor="end" font-weight="bold">제안 유닛 (게이트 둘)</text><rect x="260" y="125" width="390.0" height="32" rx="3" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.4"/><text x="658.0" y="147" font-size="12" fill="#B4552B" text-anchor="start">3 묶음 = 3,300,000</text><text x="250" y="202" font-size="12" fill="#2E6B8A" text-anchor="end" font-weight="bold">LSTM (게이트 셋 + 셀 입력)</text><rect x="260" y="180" width="520.0" height="32" rx="3" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.4"/><text x="788.0" y="202" font-size="12" fill="#2E6B8A" text-anchor="start">4 묶음 = 4,400,000</text><text x="40" y="255" font-size="11" fill="#4E5964" text-anchor="start">제안 유닛 / LSTM = 3/4 = 0.75. 바이어스 둘씩을 넣는 PyTorch 의 nn.GRU(100, 1000) 는 3,306,000, nn.LSTM(100, 1000) 은 4,408,000 (내가 세어 맞춘 값)</text><text x="40" y="278" font-size="11" fill="#7A8590" text-anchor="start">원문 각주 1 은 LSTM 을 「기억 셀과 게이트 넷」, 제안 유닛을 「게이트 둘」 로 센다 — LSTM 의 넷은 게이트 셋에 셀 입력을 더한 셈으로 읽힌다</text></svg>
