<svg xmlns="http://www.w3.org/2000/svg" width="900" height="470" viewBox="0 0 900 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="실험 모델 파라미터 세기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="20" y="30" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">실험 모델의 파라미터 수 — 내가 센 것. 바이어스는 원문 식에 없어 넣지 않았다. 「가정」 줄은 학회판 본문만으로 정해지지 않는 자리</text><text x="350" y="76" font-size="11" fill="#4E5964" text-anchor="end">인코더 입력 임베딩 100x15,000</text><rect x="360" y="62" width="178.125" height="18" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><text x="544.125" y="76" font-size="11" fill="#2E6B8A" text-anchor="start">1,500,000</text><text x="350" y="104" font-size="11" fill="#4E5964" text-anchor="end">인코더 W · W_r · W_z (1,000x100 셋)</text><rect x="360" y="90" width="35.625" height="18" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><text x="401.625" y="104" font-size="11" fill="#2E6B8A" text-anchor="start">300,000</text><text x="350" y="132" font-size="11" fill="#4E5964" text-anchor="end">인코더 U · U_r · U_z (1,000x1,000 셋)</text><rect x="360" y="118" width="356.25" height="18" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><text x="722.25" y="132" font-size="11" fill="#2E6B8A" text-anchor="start">3,000,000</text><text x="350" y="160" font-size="11" fill="#4E5964" text-anchor="end">c = tanh(V h&lt;T&gt;) 의 V</text><rect x="360" y="146" width="118.75" height="18" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1" stroke-dasharray="4 2"/><text x="484.75" y="160" font-size="11" fill="#9A7B00" text-anchor="start">1,000,000  (가정)</text><text x="350" y="188" font-size="11" fill="#4E5964" text-anchor="end">디코더 입력 임베딩 100x15,000</text><rect x="360" y="174" width="178.125" height="18" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="544.125" y="188" font-size="11" fill="#B4552B" text-anchor="start">1,500,000</text><text x="350" y="216" font-size="11" fill="#4E5964" text-anchor="end">디코더 W · W_r · W_z</text><rect x="360" y="202" width="35.625" height="18" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="401.625" y="216" font-size="11" fill="#B4552B" text-anchor="start">300,000</text><text x="350" y="244" font-size="11" fill="#4E5964" text-anchor="end">디코더 U · U_r · U_z</text><rect x="360" y="230" width="356.25" height="18" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="722.25" y="244" font-size="11" fill="#B4552B" text-anchor="start">3,000,000</text><text x="350" y="272" font-size="11" fill="#4E5964" text-anchor="end">디코더가 c 를 받는 C · C_r · C_z</text><rect x="360" y="258" width="356.25" height="18" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1" stroke-dasharray="4 2"/><text x="722.25" y="272" font-size="11" fill="#9A7B00" text-anchor="start">3,000,000  (가정)</text><text x="350" y="300" font-size="11" fill="#4E5964" text-anchor="end">디코더 첫 상태 h&lt;0&gt; = tanh(V' c) 의 V'</text><rect x="360" y="286" width="118.75" height="18" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1" stroke-dasharray="4 2"/><text x="484.75" y="300" font-size="11" fill="#9A7B00" text-anchor="start">1,000,000  (가정)</text><text x="350" y="328" font-size="11" fill="#4E5964" text-anchor="end">maxout 층 입력 (h, y_{t-1}, c) -&gt; 1,000</text><rect x="360" y="314" width="249.375" height="18" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="615.375" y="328" font-size="11" fill="#B4552B" text-anchor="start">2,100,000</text><text x="350" y="356" font-size="11" fill="#4E5964" text-anchor="end">출력 낮은 계수 500x100 + 100x15,000</text><rect x="360" y="342" width="184.0625" height="18" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="550.0625" y="356" font-size="11" fill="#B4552B" text-anchor="start">1,550,000</text><text x="40" y="388" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">합계 18,250,000 (18.25백만). 가정 셋을 모두 빼면 13,250,000. 곧 이 모델은 13.25 ~ 18.25백만 사이다</text><text x="40" y="412" font-size="11" fill="#4E5964" text-anchor="start">낮은 계수의 몫: 입력 한쪽을 전 계수(1,000x15,000 셋)로 두면 45,000,000 — 지금의 1,800,000 의 25 배. 출력은 7,500,000 대 1,550,000 (4.84 배)</text><text x="40" y="434" font-size="11" fill="#7A8590" text-anchor="start">원문: 「입력 행렬과 출력 행렬을 계수 100 행렬 둘로 근사했다 — 단어마다 100 차원 임베딩을 배우는 것과 같다」(4.1.1절). 나머지 구조는 보충 자료로 미룬다</text></svg>
