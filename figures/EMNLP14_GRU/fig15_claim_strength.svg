<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="주장과 근거의 세기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">주장과 그 근거 — 근거 칸은 원문에서 그 주장을 받치는 것 전부 (내가 정리한 것)</text><rect x="30" y="60" width="350" height="36" rx="6" fill="#F6F7F5" stroke="#C0392B" stroke-width="1.4"/><text x="40" y="83" font-size="11" fill="#1C232C" text-anchor="start">제안 유닛이 꼭 필요했다 (2.3절)</text><line x1="382" y1="78" x2="405" y2="78" stroke="#4E5964" stroke-width="1"/><text x="412" y="83" font-size="11" fill="#C0392B" text-anchor="start">예비 실험, 수 없음. 「게이트 없는 tanh 로는 의미 있는 결과를 못 얻었다」 한 문장</text><rect x="30" y="106" width="350" height="36" rx="6" fill="#F6F7F5" stroke="#C0392B" stroke-width="1.4"/><text x="40" y="129" font-size="11" fill="#1C232C" text-anchor="start">유닛마다 다른 시간 척도를 배운다 (2.3절)</text><line x1="382" y1="124" x2="405" y2="124" stroke="#4E5964" stroke-width="1"/><text x="412" y="129" font-size="11" fill="#C0392B" text-anchor="start">재지 않았다. 게이트 값의 분포 · 그림 없음</text><rect x="30" y="152" width="350" height="36" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.4"/><text x="40" y="175" font-size="11" fill="#1C232C" text-anchor="start">RNN 점수가 번역 성능을 올린다 (4.2절)</text><line x1="382" y1="170" x2="405" y2="170" stroke="#4E5964" stroke-width="1"/><text x="412" y="175" font-size="11" fill="#9A7B00" text-anchor="start">시험 BLEU +0.57, 실행 하나, 시험 셋 하나, 흩어짐 · 검정 없음</text><rect x="30" y="198" width="350" height="36" rx="6" fill="#F6F7F5" stroke="#C0392B" stroke-width="1.4"/><text x="40" y="221" font-size="11" fill="#1C232C" text-anchor="start">CSLM 과 RNN 의 몫이 「너무 상관되지는 않는다」 (4.2절)</text><line x1="382" y1="216" x2="405" y2="216" stroke="#4E5964" stroke-width="1"/><text x="412" y="221" font-size="11" fill="#C0392B" text-anchor="start">CSLM 혼자의 줄이 없다. 더하기 꼴을 셈할 수 없다</text><rect x="30" y="244" width="350" height="36" rx="6" fill="#F6F7F5" stroke="#C0392B" stroke-width="1.4"/><text x="40" y="267" font-size="11" fill="#1C232C" text-anchor="start">-&gt; 결론: 「rather orthogonal」 (5절)</text><line x1="382" y1="262" x2="405" y2="262" stroke="#4E5964" stroke-width="1"/><text x="412" y="267" font-size="11" fill="#C0392B" text-anchor="start">같은 표 1 하나. 4.2절의 「시사한다」 가 결론에서 단정이 된다</text><rect x="30" y="290" width="350" height="36" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.4"/><text x="40" y="313" font-size="11" fill="#1C232C" text-anchor="start">RNN 이 고른 구문이 문자 그대로의 번역에 더 가깝다 (4.3절)</text><line x1="382" y1="308" x2="405" y2="308" stroke="#4E5964" stroke-width="1"/><text x="412" y="313" font-size="11" fill="#9A7B00" text-anchor="start">영어 구문 10 개, 세 개씩. 판정 기준 없음. [le] 같은 반례가 표 안에 있다</text><rect x="30" y="336" width="350" height="36" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.4"/><text x="40" y="359" font-size="11" fill="#1C232C" text-anchor="start">의미 · 문법 구조를 둘 다 잡는다 (요약 · 4.4절)</text><line x1="382" y1="354" x2="405" y2="354" stroke="#4E5964" stroke-width="1"/><text x="412" y="359" font-size="11" fill="#9A7B00" text-anchor="start">t-SNE 그림 둘. 무리를 수로 잰 값 없음</text><text x="450" y="390" font-size="11" fill="#7A8590" text-anchor="middle">빨강 = 근거가 수로 없음 또는 주장을 셈할 칸이 빠짐. 노랑 = 수는 있으나 반복 · 기준이 없음</text></svg>
