<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="말뭉치 단어 수 더하기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">4.1절의 단어 수를 더해 본 것 — 단위는 백만 단어(M), 토큰화 뒤 프랑스어 단어 수 (원문)</text><rect x="60" y="70" width="18.009523809523813" height="34" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><rect x="78.00952380952381" y="70" width="1.623809523809527" height="34" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><rect x="79.63333333333334" y="70" width="124.29523809523809" height="34" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><text x="141.78095238095239" y="92" font-size="10" fill="#2E6B8A" text-anchor="middle">UN 421M</text><rect x="203.92857142857144" y="70" width="26.57142857142857" height="34" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><rect x="230.5" y="70" width="230.28571428571433" height="34" rx="0" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><text x="345.64285714285717" y="92" font-size="10" fill="#2E6B8A" text-anchor="middle">크롤 2 780M</text><text x="468.78571428571433" y="92" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">합 1357.5M</text><text x="60" y="124" font-size="10" fill="#7A8590" text-anchor="start">막대 왼쪽 끝의 좁은 셋은 차례로 Europarl 61M · news commentary 5.5M, UN 뒤의 좁은 칸이 크롤 1 90M</text><rect x="60" y="150" width="250.95238095238096" height="30" rx="0" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="60" y="150" width="102.74285714285713" height="30" rx="0" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="318.95238095238096" y="170" font-size="11" fill="#B4552B" text-anchor="start" font-weight="bold">RNN 학습: 「850M 가운데 348M」 = 40.9%</text><text x="60" y="200" font-size="11" fill="#C0392B" text-anchor="start">원문의 850M 은 위 다섯의 합 1357.5M 과 다르다. 원문은 무엇을 뺐는지 적지 않는다 (UN 과 크롤 1 을 빼면 846.5M — 내가 맞춰 본 조합일 뿐)</text><rect x="60" y="230" width="610.9952380952382" height="30" rx="0" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.4" stroke-dasharray="5 3"/><rect x="60" y="230" width="123.40952380952382" height="30" rx="0" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="189.40952380952382" y="250" font-size="11" fill="#9A7B00" text-anchor="start" font-weight="bold">언어 모형: 「2G 넘는 것 가운데 418M」</text><text x="60" y="280" font-size="11" fill="#4E5964" text-anchor="start">신문 712M + 양국어 목표 쪽 1357.5M = 2069.5M — 「2G 넘는다」 와 맞는다. 418M 은 그 20.2%</text><text x="60" y="320" font-size="11" fill="#4E5964" text-anchor="start">어휘: 두 언어 모두 가장 잦은 15,000 단어 (데이터의 93% 를 덮는다 — 원문은 approximately). 나머지는 [UNK] 하나로</text><text x="60" y="344" font-size="11" fill="#4E5964" text-anchor="start">개발 · 시험 셋: 각각 7만 단어 넘음, 참조 번역 하나 (원문)</text></svg>
