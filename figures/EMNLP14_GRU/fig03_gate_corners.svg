<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="게이트 값 네 모서리에서 새 상태"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">게이트 네 모서리 — 유닛 하나, 내가 고른 수: 이전 상태 h&lt;t-1&gt; = 0.8, 입력 몫 Wx = 0.3, 순환 무게 U = 1.2</text><text x="40" y="70" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">r</text><text x="100" y="70" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">z</text><text x="160" y="70" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">후보 h~ = tanh(0.3 + 1.2·r·0.8)</text><text x="470" y="70" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">새 상태 h&lt;t&gt;</text><text x="600" y="70" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">읽는 법</text><line x1="30" y1="80" x2="880" y2="80" stroke="#CFD6D3" stroke-width="1"/><text x="40" y="108" font-size="13" fill="#1C232C" text-anchor="start">0</text><text x="100" y="108" font-size="13" fill="#1C232C" text-anchor="start">0</text><text x="160" y="108" font-size="13" fill="#B4552B" text-anchor="start">0.291</text><text x="470" y="108" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">0.291</text><text x="600" y="108" font-size="11" fill="#4E5964" text-anchor="start">이전 상태를 버리고 지금 입력만으로 새로 쓴다</text><text x="40" y="148" font-size="13" fill="#1C232C" text-anchor="start">1</text><text x="100" y="148" font-size="13" fill="#1C232C" text-anchor="start">0</text><text x="160" y="148" font-size="13" fill="#B4552B" text-anchor="start">0.851</text><text x="470" y="148" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">0.851</text><text x="600" y="148" font-size="11" fill="#4E5964" text-anchor="start">옛 상태를 본 후보로 통째로 바꾼다 (tanh 유닛과 같다)</text><text x="40" y="188" font-size="13" fill="#1C232C" text-anchor="start">0</text><text x="100" y="188" font-size="13" fill="#1C232C" text-anchor="start">1</text><text x="160" y="188" font-size="13" fill="#B4552B" text-anchor="start">0.291</text><text x="470" y="188" font-size="13" fill="#1E8449" text-anchor="start" font-weight="bold">0.800</text><text x="600" y="188" font-size="11" fill="#4E5964" text-anchor="start">이전 상태를 그대로 넘긴다 (r 은 상관없다)</text><text x="40" y="228" font-size="13" fill="#1C232C" text-anchor="start">1</text><text x="100" y="228" font-size="13" fill="#1C232C" text-anchor="start">1</text><text x="160" y="228" font-size="13" fill="#B4552B" text-anchor="start">0.851</text><text x="470" y="228" font-size="13" fill="#1E8449" text-anchor="start" font-weight="bold">0.800</text><text x="600" y="228" font-size="11" fill="#4E5964" text-anchor="start">이전 상태를 그대로 넘긴다</text><text x="40" y="268" font-size="13" fill="#1C232C" text-anchor="start">0.5</text><text x="100" y="268" font-size="13" fill="#1C232C" text-anchor="start">0.5</text><text x="160" y="268" font-size="13" fill="#B4552B" text-anchor="start">0.653</text><text x="470" y="268" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">0.726</text><text x="600" y="268" font-size="11" fill="#4E5964" text-anchor="start">반씩 섞는다</text><text x="450" y="318" font-size="11" fill="#7A8590" text-anchor="middle">r = 1, z = 0 줄의 0.851 이 게이트 없는 tanh 유닛 tanh(Wx + U·h) 의 값과 같다 — 게이트 유닛은 그 유닛을 한 모서리로 품는다</text></svg>
