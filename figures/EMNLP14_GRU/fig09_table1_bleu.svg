<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 1 BLEU 와 빠진 칸"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">표 1 다시 그림 — 줄마다 한 번 돌린 값. 맨 아래 칸 「Baseline + CSLM」 은 원문에 없다</text><line x1="90" y1="340" x2="560" y2="340" stroke="#4E5964" stroke-width="1.2"/><line x1="90" y1="60" x2="90" y2="340" stroke="#4E5964" stroke-width="1.2"/><line x1="86" y1="340.0" x2="90" y2="340.0" stroke="#4E5964" stroke-width="1"/><text x="83" y="344.0" font-size="10" fill="#7A8590" text-anchor="end">30</text><line x1="90" y1="340.0" x2="560" y2="340.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="86" y1="284.0" x2="90" y2="284.0" stroke="#4E5964" stroke-width="1"/><text x="83" y="288.0" font-size="10" fill="#7A8590" text-anchor="end">31</text><line x1="90" y1="284.0" x2="560" y2="284.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="86" y1="228.0" x2="90" y2="228.0" stroke="#4E5964" stroke-width="1"/><text x="83" y="232.0" font-size="10" fill="#7A8590" text-anchor="end">32</text><line x1="90" y1="228.0" x2="560" y2="228.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="86" y1="172.0" x2="90" y2="172.0" stroke="#4E5964" stroke-width="1"/><text x="83" y="176.0" font-size="10" fill="#7A8590" text-anchor="end">33</text><line x1="90" y1="172.0" x2="560" y2="172.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="86" y1="116.0" x2="90" y2="116.0" stroke="#4E5964" stroke-width="1"/><text x="83" y="120.0" font-size="10" fill="#7A8590" text-anchor="end">34</text><line x1="90" y1="116.0" x2="560" y2="116.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><line x1="86" y1="60.0" x2="90" y2="60.0" stroke="#4E5964" stroke-width="1"/><text x="83" y="64.0" font-size="10" fill="#7A8590" text-anchor="end">35</text><line x1="90" y1="60.0" x2="560" y2="60.0" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="90" y="50" font-size="11" fill="#4E5964" text-anchor="start">BLEU (축은 30 에서 시작)</text><rect x="110" y="304.15999999999997" width="28" height="35.84000000000003" rx="1" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><rect x="142" y="155.20000000000016" width="28" height="184.79999999999984" rx="1" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="124" y="299.15999999999997" font-size="10" fill="#2E6B8A" text-anchor="middle">30.64</text><text x="156" y="150.20000000000016" font-size="10" fill="#B4552B" text-anchor="middle">33.30</text><text x="140" y="358" font-size="10" fill="#4E5964" text-anchor="middle">Baseline</text><rect x="205" y="272.80000000000007" width="28" height="67.19999999999993" rx="1" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><rect x="237" y="123.28000000000014" width="28" height="216.71999999999986" rx="1" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="219" y="267.80000000000007" font-size="10" fill="#2E6B8A" text-anchor="middle">31.20</text><text x="251" y="118.28000000000014" font-size="10" fill="#B4552B" text-anchor="middle">33.87</text><text x="235" y="358" font-size="10" fill="#4E5964" text-anchor="middle">RNN</text><rect x="300" y="257.12" width="28" height="82.88" rx="1" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><rect x="332" y="80.15999999999997" width="28" height="259.84000000000003" rx="1" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="314" y="252.12" font-size="10" fill="#2E6B8A" text-anchor="middle">31.48</text><text x="346" y="75.15999999999997" font-size="10" fill="#B4552B" text-anchor="middle">34.64</text><text x="330" y="358" font-size="10" fill="#4E5964" text-anchor="middle">CSLM + RNN</text><rect x="395" y="256.0" width="28" height="84.0" rx="1" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1"/><rect x="427" y="85.76000000000005" width="28" height="254.23999999999995" rx="1" fill="#F2DED2" stroke="#B4552B" stroke-width="1"/><text x="409" y="251.0" font-size="10" fill="#2E6B8A" text-anchor="middle">31.50</text><text x="441" y="80.76000000000005" font-size="10" fill="#B4552B" text-anchor="middle">34.54</text><text x="425" y="358" font-size="10" fill="#4E5964" text-anchor="middle">CSLM + RNN + WP</text><rect x="490" y="100" width="60" height="240" rx="2" fill="#F6F7F5" stroke="#C0392B" stroke-width="1.4" stroke-dasharray="5 4"/><text x="520" y="200" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="bold">없다</text><text x="520" y="358" font-size="10" fill="#4E5964" text-anchor="middle">Baseline + CSLM</text><text x="590" y="80" font-size="12" fill="#4E5964" text-anchor="start" font-weight="bold">파랑 = 개발(dev), 주황 = 시험(test)</text><text x="590" y="101" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="590" y="122" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">차이 (내가 뺀 값)</text><text x="590" y="143" font-size="12" fill="#4E5964" text-anchor="start">RNN - Baseline:  dev +0.56, test +0.57</text><text x="590" y="164" font-size="12" fill="#4E5964" text-anchor="start">CSLM+RNN - RNN:  dev +0.28, test +0.77</text><text x="590" y="185" font-size="12" fill="#4E5964" text-anchor="start">+WP - CSLM+RNN:  dev +0.02, test -0.10</text><text x="590" y="206" font-size="12" fill="#4E5964" text-anchor="start">CSLM+RNN - Baseline: dev +0.84, test +1.34</text><text x="590" y="227" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="590" y="248" font-size="12" fill="#C0392B" text-anchor="start" font-weight="bold">CSLM 혼자의 줄이 없어서</text><text x="590" y="269" font-size="12" fill="#C0392B" text-anchor="start">「두 몫이 서로 겹치지 않는다」 를</text><text x="590" y="290" font-size="12" fill="#C0392B" text-anchor="start">이 표로는 셈할 수 없다</text><text x="590" y="311" font-size="12" fill="#4E5964" text-anchor="start"></text><text x="590" y="332" font-size="12" fill="#7A8590" text-anchor="start">반복 · 흩어짐 · 유의성 검정: 적혀 있지 않다</text><text x="590" y="353" font-size="12" fill="#7A8590" text-anchor="start">개발 셋은 MERT 가 무게를 맞춘 셋이다</text></svg>
