<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 이 편의 두 몫(인코더-디코더 틀, 게이트 둘 유닛)이 어디서 와서 어디로 가나</text><rect x="40" y="70" width="250" height="40" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="165" y="95" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">Elman 1990 · 단순 순환망</text><rect x="40" y="140" width="250" height="40" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="165" y="165" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">LSTM 1997 (게이트 + 셀)</text><rect x="40" y="210" width="250" height="40" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="165" y="235" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">Schwenk 2012 (앞먹임 구문 점수, 7 단어 고정)</text><rect x="40" y="280" width="250" height="40" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="165" y="305" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">Kalchbrenner · Blunsom 2013 (합성곱 인코더)</text><rect x="350" y="160" width="250" height="40" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="475" y="185" font-size="11" fill="#B4552B" text-anchor="middle" font-weight="bold">이 편 · EMNLP 2014</text><rect x="620" y="70" width="250" height="40" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.4"/><text x="745" y="95" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">seq2seq · Sutskever 외 NIPS 2014</text><rect x="620" y="160" width="250" height="40" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.4"/><text x="745" y="185" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="bold">Bahdanau 외 ICLR 2015 (주의)</text><rect x="620" y="250" width="250" height="40" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.4"/><text x="745" y="275" font-size="11" fill="#9A7B00" text-anchor="middle" font-weight="bold">Chung 외 2014 (「GRU」 이름, 견주기)</text><line x1="290" y1="90" x2="348" y2="170" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="290" y1="160" x2="348" y2="176" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="290" y1="230" x2="348" y2="186" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="290" y1="300" x2="348" y2="194" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="600" y1="180" x2="618" y2="90" stroke="#B4552B" stroke-width="1.2" marker-end="url(#ar)"/><line x1="600" y1="180" x2="618" y2="180" stroke="#B4552B" stroke-width="1.2" marker-end="url(#ar)"/><line x1="600" y1="180" x2="618" y2="270" stroke="#B4552B" stroke-width="1.2" marker-end="url(#ar)"/><text x="475" y="225" font-size="10" fill="#B4552B" text-anchor="middle">벡터 c 하나에 입력 전체</text><text x="745" y="125" font-size="10" fill="#1E8449" text-anchor="middle">같은 틀, LSTM, 번역을 직접 만든다</text><text x="745" y="215" font-size="10" fill="#1E8449" text-anchor="middle">c 하나의 병목을 푼다 (같은 연구실)</text><text x="450" y="340" font-size="11" fill="#7A8590" text-anchor="middle">오른쪽 칸 셋은 이 노트에서 읽지 않았다. 「GRU」 라는 이름이 Chung 외 2014 에서 붙었다는 것은 내가 아는 것이다</text></svg>
