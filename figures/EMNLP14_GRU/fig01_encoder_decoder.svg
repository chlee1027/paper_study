<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="RNN 인코더-디코더 구조"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">RNN 인코더-디코더 (2.2절) — 인코더가 입력 전체를 길이가 정해진 벡터 c 하나로 줄이고, 디코더는 매 걸음 c 를 다시 받는다</text><rect x="60" y="200" width="60" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="90" y="227" font-size="12" fill="#2E6B8A" text-anchor="middle">h&lt;1&gt;</text><line x1="90" y1="300" x2="90" y2="247" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><text x="90" y="318" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">x1</text><rect x="160" y="200" width="60" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="190" y="227" font-size="12" fill="#2E6B8A" text-anchor="middle">h&lt;2&gt;</text><line x1="190" y1="300" x2="190" y2="247" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><text x="190" y="318" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">x2</text><rect x="300" y="200" width="60" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="330" y="227" font-size="12" fill="#2E6B8A" text-anchor="middle">h&lt;T&gt;</text><line x1="330" y1="300" x2="330" y2="247" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><text x="330" y="318" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">xT</text><line x1="120" y1="222" x2="157" y2="222" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><text x="260" y="227" font-size="16" fill="#2E6B8A" text-anchor="middle">…</text><line x1="222" y1="222" x2="237" y2="222" stroke="#2E6B8A" stroke-width="1.4"/><line x1="282" y1="222" x2="297" y2="222" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><text x="210" y="362" font-size="11" fill="#4E5964" text-anchor="middle">인코더: h&lt;t&gt; = f(h&lt;t-1&gt;, x_t)  — 식 (1). 끝 기호를 읽은 뒤의 상태가 요약 c</text><circle cx="450" cy="140" r="30" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.8"/><text x="450" y="146" font-size="18" fill="#9A7B00" text-anchor="middle" font-weight="bold">c</text><path d="M360,222 C400,222 410,170 424,158" fill="none" stroke="#9A7B00" stroke-width="1.6" marker-end="url(#ac)"/><text x="450" y="92" font-size="11" fill="#9A7B00" text-anchor="middle">1,000 차원 (4.4절)</text><rect x="540" y="200" width="60" height="44" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="570" y="227" font-size="12" fill="#B4552B" text-anchor="middle">h&lt;1&gt;</text><line x1="570" y1="197" x2="570" y2="155" stroke="#B4552B" stroke-width="1.4" marker-end="url(#ar)"/><text x="570" y="145" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">y1</text><path d="M478,148 C510,170 560,190 564,200" fill="none" stroke="#9A7B00" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ac)"/><rect x="650" y="200" width="60" height="44" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="680" y="227" font-size="12" fill="#B4552B" text-anchor="middle">h&lt;2&gt;</text><line x1="680" y1="197" x2="680" y2="155" stroke="#B4552B" stroke-width="1.4" marker-end="url(#ar)"/><text x="680" y="145" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">y2</text><path d="M478,152 C620,174 670,190 674,200" fill="none" stroke="#9A7B00" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ac)"/><rect x="790" y="200" width="60" height="44" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="820" y="227" font-size="12" fill="#B4552B" text-anchor="middle">h&lt;T'&gt;</text><line x1="820" y1="197" x2="820" y2="155" stroke="#B4552B" stroke-width="1.4" marker-end="url(#ar)"/><text x="820" y="145" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">yT'</text><path d="M478,156 C760,178 810,190 814,200" fill="none" stroke="#9A7B00" stroke-width="1.1" stroke-dasharray="4 3" marker-end="url(#ac)"/><line x1="600" y1="222" x2="647" y2="222" stroke="#B4552B" stroke-width="1.4" marker-end="url(#ar)"/><text x="750" y="227" font-size="16" fill="#B4552B" text-anchor="middle">…</text><line x1="710" y1="222" x2="725" y2="222" stroke="#B4552B" stroke-width="1.4"/><line x1="772" y1="222" x2="787" y2="222" stroke="#B4552B" stroke-width="1.4" marker-end="url(#ar)"/><path d="M584,140 C640,150 620,285 668,250" fill="none" stroke="#4E5964" stroke-width="1.1" marker-end="url(#ai)"/><text x="640" y="300" font-size="10" fill="#4E5964" text-anchor="middle">y1 이 다음 걸음 입력</text><text x="690" y="340" font-size="11" fill="#4E5964" text-anchor="middle">디코더: h&lt;t&gt; = f(h&lt;t-1&gt;, y_{t-1}, c),  P(y_t | y_{&lt;t}, c) = g(h&lt;t&gt;, y_{t-1}, c)</text><text x="690" y="362" font-size="11" fill="#9A7B00" text-anchor="middle">점선 = c 가 모든 걸음에 들어간다 (원문 그림 1 의 화살표)</text><text x="450" y="388" font-size="11" fill="#7A8590" text-anchor="middle">길이 T 와 T' 는 달라도 된다. 학습은 식 (4): 짝 N 개의 조건부 로그 가능도 평균을 최대화</text></svg>
