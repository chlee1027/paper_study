<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250"><rect width="820" height="250" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">픽셀 AP 13.4 점을 나눠 보면 (내 뺄셈)</text><text x="20.0" y="44.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">재구성 망 없이 가짜 이상으로 분할만 배운 Disc. 가 이미 PaDiM 보다 7.5 점(13.4 의 56%) 높다.</text><text x="20.0" y="82.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM (표 2 의 가장 센 상대)</text><rect x="330.0" y="64.0" width="330.0" height="26.0" fill="#8a8a8a" stroke="none"/><text x="668.0" y="82.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">55.0</text><text x="20.0" y="122.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Božič 외, 가짜 이상으로 학습 (표 3)</text><rect x="330.0" y="104.0" width="364.2" height="26.0" fill="#8a8a8a" stroke="none"/><text x="702.2" y="122.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">60.7</text><text x="20.0" y="162.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">Disc. = 재구성 망을 뺀 DRAEM (표 3)</text><rect x="330.0" y="144.0" width="375.0" height="26.0" fill="#2f6db3" stroke="none"/><text x="713.0" y="162.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">62.5</text><text x="20.0" y="202.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM (표 2 · 3)</text><rect x="330.0" y="184.0" width="410.4" height="26.0" fill="#c8553d" stroke="none"/><text x="748.4" y="202.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">68.4</text><line x1="660.0" y1="56.0" x2="660.0" y2="224.0" stroke="#666666" stroke-width="1" stroke-dasharray="4 3"/><text x="20.0" y="240.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">같은 저자가 같은 평가로 낸 줄끼리의 차이다. 반복이 없어 흩어짐은 모른다.</text></svg>