<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 290" width="820" height="290"><rect width="820" height="290" fill="#ffffff"/><text x="20.0" y="24.0" font-size="14" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">표 4 의 TPR · TNR · CA 로 거꾸로 낸 「시험 이미지 중 결함 비율」 w (내 계산)</text><text x="20.0" y="44.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">같은 시험 집합을 같은 문턱으로 셌다면 CA = w TPR + (1 - w) TNR 이고 w 는 줄마다 같아야 한다. 막대는 반올림 폭 ±0.05 를 넣은 범위.</text><line x1="200.0" y1="60.0" x2="200.0" y2="230.0" stroke="#cccccc" stroke-width="1"/><text x="200.0" y="248.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.0</text><line x1="245.0" y1="60.0" x2="245.0" y2="230.0" stroke="#cccccc" stroke-width="1"/><text x="245.0" y="248.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.1</text><line x1="290.0" y1="60.0" x2="290.0" y2="230.0" stroke="#cccccc" stroke-width="1"/><text x="290.0" y="248.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.2</text><line x1="335.0" y1="60.0" x2="335.0" y2="230.0" stroke="#cccccc" stroke-width="1"/><text x="335.0" y="248.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.3</text><line x1="380.0" y1="60.0" x2="380.0" y2="230.0" stroke="#cccccc" stroke-width="1"/><text x="380.0" y="248.0" font-size="10" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.4</text><line x1="258.7" y1="58.0" x2="258.7" y2="232.0" stroke="#c8553d" stroke-width="1.5" stroke-dasharray="5 3"/><text x="262.7" y="70.0" font-size="10" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.130</text><text x="20.0" y="92.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">RIAD</text><rect x="253.5" y="82.0" width="8.9" height="14.0" fill="#d9e4f2" stroke="#2f6db3"/><circle cx="257.9" cy="89.0" r="3.5" fill="#2f6db3" stroke="none"/><text x="270.4" y="93.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.129 (0.119 ~ 0.139)</text><text x="20.0" y="122.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">US</text><rect x="249.3" y="112.0" width="12.3" height="14.0" fill="#d9e4f2" stroke="#2f6db3"/><circle cx="255.5" cy="119.0" r="3.5" fill="#2f6db3" stroke="none"/><text x="269.6" y="123.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.123 (0.110 ~ 0.137)</text><text x="20.0" y="152.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">MAD</text><text x="200.0" y="152.0" font-size="11" fill="#c8553d" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CA 66.2 가 TPR 78.7 · TNR 85.7 사이에 있지 않다 → 같은 문턱의 정확도일 수 없다</text><text x="20.0" y="182.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">PaDiM</text><rect x="253.9" y="172.0" width="6.3" height="14.0" fill="#d9e4f2" stroke="#2f6db3"/><circle cx="257.0" cy="179.0" r="3.5" fill="#2f6db3" stroke="none"/><text x="268.2" y="183.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.127 (0.120 ~ 0.134)</text><text x="20.0" y="212.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">DRAEM</text><rect x="324.1" y="202.0" width="31.0" height="14.0" fill="#d9e4f2" stroke="#2f6db3"/><circle cx="339.7" cy="209.0" r="3.5" fill="#2f6db3" stroke="none"/><text x="363.2" y="213.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.310 (0.276 ~ 0.345)</text><text x="20.0" y="276.0" font-size="11" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">점선 0.130 = 150 / 1,150. DAGM 의 부류별 구성은 이 편에 없고 내가 아는 값이다. 세 줄은 그 값을 범위에 품고 DRAEM 줄은 품지 않는다.</text></svg>