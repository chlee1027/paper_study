<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 지름길을 깨끗하게 둔다는 생각이 어디서 와서 어디로 갔나</text><rect x="40" y="54" width="340" height="50" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="210" y="75" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="bold">Highway (2015-05)</text><text x="210" y="94" font-size="11" fill="#4E5964" text-anchor="middle">게이트 지름길, 처음 치우침 음수</text><rect x="40" y="139" width="340" height="50" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.6"/><text x="210" y="160" font-size="12.5" fill="#2A78D6" text-anchor="middle" font-weight="bold">ResNet (2015-12)</text><text x="210" y="179" font-size="11" fill="#4E5964" text-anchor="middle">항등 지름길, 덧셈 뒤 ReLU</text><rect x="40" y="224" width="340" height="50" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="210" y="245" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="bold">Inception-v4 (2016-02)</text><text x="210" y="264" font-size="11" fill="#4E5964" text-anchor="middle">잔차를 0.1 ~ 0.3 배로 줄여 더한다</text><rect x="430" y="139" width="340" height="50" rx="6" fill="#F6F7F5" stroke="#EB6834" stroke-width="1.6"/><text x="600" y="160" font-size="12.5" fill="#EB6834" text-anchor="middle" font-weight="bold">사전 활성 ResNet (2016-03, 이 논문)</text><text x="600" y="179" font-size="11" fill="#4E5964" text-anchor="middle">지름길 · 덧셈 뒤를 둘 다 항등으로</text><rect x="40" y="309" width="340" height="50" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="210" y="330" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="bold">확률 깊이 (2016-03)</text><text x="210" y="349" font-size="11" fill="#4E5964" text-anchor="middle">학습 중 블록을 통째로 끈다</text><rect x="430" y="244" width="340" height="50" rx="6" fill="#F6F7F5" stroke="#1BAF7A" stroke-width="1.6"/><text x="600" y="265" font-size="12.5" fill="#1BAF7A" text-anchor="middle" font-weight="bold">Wide ResNet (2016-05)</text><text x="600" y="284" font-size="11" fill="#4E5964" text-anchor="middle">이 블록(CIFAR)을 넓히고 층을 줄인다</text><rect x="430" y="334" width="340" height="50" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.6"/><text x="600" y="355" font-size="12.5" fill="#7A8590" text-anchor="middle" font-weight="bold">PatchCore (2022)</text><text x="600" y="374" font-size="11" fill="#4E5964" text-anchor="middle">WRN-50-2 는 원래 블록(덧셈 뒤 ReLU)</text><path d="M380,80 C405,80 405,165 428,165" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M380,165 C405,165 405,165 428,165" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M380,250 C405,250 405,165 428,165" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="600" y1="191" x2="600" y2="242" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M380,335 C405,335 405,270 428,270" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="600" y1="296" x2="600" y2="332" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="20" y="412" font-size="10.5" fill="#7A8590" text-anchor="start">날짜는 arXiv 첫 판. 확률 깊이 · Inception-v4 는 이 논문과 같은 시기의 편이다(뒤의 것은 이 논문이 '동시 연구' 로 적었다). PatchCore 는 이 논문 뒤다</text></svg>
