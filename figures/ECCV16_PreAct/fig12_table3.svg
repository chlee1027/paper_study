iddle">2</text><line x1="505.71428571428567" y1="60" x2="505.71428571428567" y2="330" stroke="#CFD6D3" stroke-width="0.8"/><text x="505.71428571428567" y="346" font-size="9.5" fill="#7A8590" text-anchor="middle">3</text><line x1="564.2857142857142" y1="60" x2="564.2857142857142" y2="330" stroke="#CFD6D3" stroke-width="0.8"/><text x="564.2857142857142" y="346" font-size="9.5" fill="#7A8590" text-anchor="middle">4</text><line x1="622.8571428571429" y1="60" x2="622.8571428571429" y2="330" stroke="#CFD6D3" stroke-width="0.8"/><text x="622.8571428571429" y="346" font-size="9.5" fill="#7A8590" text-anchor="middle">5</text><line x1="681.4285714285713" y1="60" x2="681.4285714285713" y2="330" stroke="#CFD6D3" stroke-width="0.8"/><text x="681.4285714285713" y="346" font-size="9.5" fill="#7A8590" text-anchor="middle">6</text><line x1="740.0" y1="60" x2="740.0" y2="330" stroke="#CFD6D3" stroke-width="0.8"/><text x="740.0" y="346" font-size="9.5" fill="#7A8590" text-anchor="middle">7</text><text x="40" y="80" font-size="11" fill="#7A8590" text-anchor="start">CIFAR-10</text><text x="120" y="80" font-size="12" fill="#1C232C" text-anchor="start">ResNet-110 (한 층 지름길)</text><text x="120" y="98" font-size="10.5" fill="#4E5964" text-anchor="start">9.90 -&gt; 8.91</text><rect x="330" y="72" width="57.985714285714266" height="20" rx="2" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="393.98571428571427" y="87" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">0.99</text><text x="40" y="124" font-size="11" fill="#7A8590" text-anchor="start">CIFAR-10</text><text x="120" y="124" font-size="12" fill="#1C232C" text-anchor="start">ResNet-110</text><text x="120" y="142" font-size="10.5" fill="#4E5964" text-anchor="start">6.61 -&gt; 6.37</text><rect x="330" y="116" width="14.057142857142878" height="20" rx="2" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="350.0571428571429" y="131" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold"