" stroke="#EB6834" stroke-width="1.2"/><text x="635.3" y="307" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">5.11</text><text x="675.3" y="307" font-size="10" fill="#7A8590" text-anchor="start">(평균 22.68 ± 0.22)</text><text x="535.0" y="364" font-size="10.5" fill="#7A8590" text-anchor="middle">원래 - 사전 활성 (양수면 사전 활성이 낮다)</text><text x="20" y="392" font-size="10.5" fill="#7A8590" text-anchor="start">여섯 행 모두 양수다. 흩어짐이 적힌 것은 사전 활성 1001 층 둘뿐이고, 원래 블록 쪽 흩어짐은 어느 행에도 없다</text><text x="20" y="410" font-size="10.5" fill="#7A8590" text-anchor="start">가장 작은 차이 0.24 (ResNet-110) 는 원 ResNet 논문이 적은 ResNet-110 다섯 번의 표준편차 0.16 과 같은 크기 대다 — 빌린 수라 판정하지 않는다</text></svg>
