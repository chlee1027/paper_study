<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="식 4 와 5 의 전파"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="13.5" fill="#1C232C" text-anchor="start" font-weight="bold">식 (4) · (5) — 덧셈 뒤가 항등이면 깊은 블록 L 의 특징은 얕은 블록 l 의 특징에 잔차를 더한 합이다</text><rect x="70" y="113" width="580" height="14" fill="#E9DFA8"/><circle cx="90" cy="120" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="90" y="124" font-size="10.5" fill="#1C232C" text-anchor="middle">x_l</text><line x1="105" y1="120" x2="203" y2="120" stroke="#9A7B00" stroke-width="2.2" marker-end="url(#ac)"/><rect x="133.0" y="154" width="44" height="24" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="155.0" y="170" font-size="10.5" fill="#1C232C" text-anchor="middle">F_l</text><path d="M98,133 Q110,166 133.0,166" fill="none" stroke="#B4552B" stroke-width="1.1" marker-end="url(#ar)"/><path d="M177.0,166 Q200,166 212,133" fill="none" stroke="#B4552B" stroke-width="1.1" marker-end="url(#ar)"/><circle cx="220" cy="120" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="220" y="124" font-size="10.5" fill="#1C232C" text-anchor="middle">x_l+1</text><line x1="235" y1="120" x2="333" y2="120" stroke="#9A7B00" stroke-width="2.2" marker-end="url(#ac)"/><rect x="263.0" y="154" width="44" height="24" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="285.0" y="170" font-size="10.5" fill="#1C232C" text-anchor="middle">F_l+1</text><path d="M228,133 Q240,166 263.0,166" fill="none" stroke="#B4552B" stroke-width="1.1" marker-end="url(#ar)"/><path d="M307.0,166 Q330,166 342,133" fill="none" stroke="#B4552B" stroke-width="1.1" marker-end="url(#ar)"/><circle cx="350" cy="120" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="350" y="124" font-size="10.5" fill="#1C232C" text-anchor="middle">x_l+2</text><line x1="365" y1="120" x2="463" y2="120" stroke="#9A7B00" stroke-width="2.2" marker-end="url(#ac)"/><rect x="393.0" y="154" width="44" height="24" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="415.0" y="170" font-size="10.5" fill="#1C232C" text-anchor="middle">F_l+2</text><path d="M358,133 Q370,166 393.0,166" fill="none" stroke="#B4552B" stroke-width="1.1" marker-end="url(#ar)"/><path d="M437.0,166 Q460,166 472,133" fill="none" stroke="#B4552B" stroke-width="1.1" marker-end="url(#ar)"/><circle cx="480" cy="120" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="480" y="124" font-size="10.5" fill="#1C232C" text-anchor="middle">...</text><line x1="495" y1="120" x2="593" y2="120" stroke="#9A7B00" stroke-width="2.2" marker-end="url(#ac)"/><rect x="523.0" y="154" width="44" height="24" rx="4" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="545.0" y="170" font-size="10.5" fill="#1C232C" text-anchor="middle">F_L-1</text><path d="M488,133 Q500,166 523.0,166" fill="none" stroke="#B4552B" stroke-width="1.1" marker-end="url(#ar)"/><path d="M567.0,166 Q590,166 602,133" fill="none" stroke="#B4552B" stroke-width="1.1" marker-end="url(#ar)"/><circle cx="610" cy="120" r="15" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="610" y="124" font-size="10.5" fill="#1C232C" text-anchor="middle">x_L</text><text x="350" y="94" font-size="11" fill="#9A7B00" text-anchor="middle">노란 길: 가중치를 하나도 거치지 않고 x_l 이 x_L 로 간다</text><text x="40" y="230" font-size="13" fill="#2E6B8A" text-anchor="start" font-weight="bold">앞으로 (식 4)   x_L = x_l + Σ_{i=l}^{L-1} F(x_i, W_i)</text><text x="40" y="256" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">뒤로 (식 5)     ∂E/∂x_l = ∂E/∂x_L · ( 1 + ∂/∂x_l Σ F )   — 다차원이면 1 은 단위 행렬 I</text><text x="40" y="282" font-size="12" fill="#4E5964" text-anchor="start">평범한 망은 곱 (식 4 아래 문장)   x_L = W_{L-1} ··· W_l x_l   (BN · ReLU 를 무시하면)</text><rect x="40" y="300" width="740" height="96" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="56" y="324" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">내가 붙인 1 차원 예 (논문에 없다) — F_i(x) = w x, 블록 54 개 (ResNet-110 의 블록 수)</text><text x="56" y="348" font-size="12" fill="#EB6834" text-anchor="start">잔차: ∂x_L/∂x_l = (1 + w)^54  ·  w = 0.01 이면 1.711, w = -0.01 이면 0.581</text><text x="56" y="370" font-size="12" fill="#2A78D6" text-anchor="start">평범: ∂x_L/∂x_l = w^54  ·  w = 0.01 이면 1e-108</text><text x="56" y="390" font-size="11" fill="#7A8590" text-anchor="start">논문의 '가중치가 아무리 작아도 기울기가 사라지지 않는다' 는 이 자리 — 대신 (1+w) 가 1 에서 멀면 곱이 커지거나 작아진다</text></svg>
