ill="#7A8590" text-anchor="middle">20</text><line x1="515.0" y1="58" x2="515.0" y2="344" stroke="#CFD6D3" stroke-width="0.8"/><text x="515.0" y="360" font-size="9.5" fill="#7A8590" text-anchor="middle">21</text><line x1="576.6666666666666" y1="58" x2="576.6666666666666" y2="344" stroke="#CFD6D3" stroke-width="0.8"/><text x="576.6666666666666" y="360" font-size="9.5" fill="#7A8590" text-anchor="middle">22</text><line x1="638.3333333333334" y1="58" x2="638.3333333333334" y2="344" stroke="#CFD6D3" stroke-width="0.8"/><text x="638.3333333333334" y="360" font-size="9.5" fill="#7A8590" text-anchor="middle">23</text><line x1="700.0" y1="58" x2="700.0" y2="344" stroke="#CFD6D3" stroke-width="0.8"/><text x="700.0" y="360" font-size="9.5" fill="#7A8590" text-anchor="middle">24</text><text x="40" y="77" font-size="12" fill="#1C232C" text-anchor="start">ResNet-152 원래</text><text x="220" y="77" font-size="10" fill="#7A8590" text-anchor="start">scale · 시험 224</text><rect x="330" y="64" width="308.33333333333337" height="20" rx="2" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><text x="644.3333333333334" y="79" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">23.0 / 6.7</text><text x="40" y="117" font-size="12" fill="#1C232C" text-anchor="start">ResNet-152 원래</text><text x="220" y="117" font-size="10" fill="#7A8590" text-anchor="start">scale · 시험 320</text><rect x="330" y="104" width="203.5" height="20" rx="2" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><text x="539.5" y="119" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">21.3 / 5.5</text><text x="40" y="157" font-size="12" fill="#1C232C" text-anchor="start">ResNet-152 사전 활성</text><text x="220" y="157" font-size="10" fill="#7A8590" text-anchor="start">scale · 시험 320</text><rect x="330" y="144" width="191.16666666666674" height="20" rx="2" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="527.1666666666667" y="159" font-size="11" fill="#1C232C" text-anchor="start" 