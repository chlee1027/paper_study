text x="20" y="418" font-size="10.5" fill="#7A8590" text-anchor="start">† 는 다른 구현(fb.resnet.torch)의 공개 모델이고 늘리기도 다르다. 같은 칸의 비교는 위 다섯 행(scale · 320)이다</text></svg>
