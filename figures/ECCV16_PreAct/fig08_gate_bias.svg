<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="게이트 치우침"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="13.5" fill="#1C232C" text-anchor="start" font-weight="bold">게이트 치우침 b_g — 처음 값만으로 지름길이 얼마나 열려 있나 (1x1 합성곱 출력을 0 으로 두고 내가 센 것)</text><line x1="70" y1="350" x2="370" y2="350" stroke="#CFD6D3" stroke-width="0.8"/><text x="64" y="354" font-size="9.5" fill="#7A8590" text-anchor="end">0</text><line x1="70" y1="282.5" x2="370" y2="282.5" stroke="#CFD6D3" stroke-width="0.8"/><text x="64" y="286.5" font-size="9.5" fill="#7A8590" text-anchor="end">0.25</text><line x1="70" y1="215.0" x2="370" y2="215.0" stroke="#CFD6D3" stroke-width="0.8"/><text x="64" y="219.0" font-size="9.5" fill="#7A8590" text-anchor="end">0.5</text><line x1="70" y1="147.5" x2="370" y2="147.5" stroke="#CFD6D3" stroke-width="0.8"/><text x="64" y="151.5" font-size="9.5" fill="#7A8590" text-anchor="end">0.75</text><line x1="70" y1="80.0" x2="370" y2="80.0" stroke="#CFD6D3" stroke-width="0.8"/><text x="64" y="84.0" font-size="9.5" fill="#7A8590" text-anchor="end">1</text><text x="70.0" y="366" font-size="9.5" fill="#7A8590" text-anchor="middle">0</text><text x="130.0" y="366" font-size="9.5" fill="#7A8590" text-anchor="middle">-2</text><text x="190.0" y="366" font-size="9.5" fill="#7A8590" text-anchor="middle">-4</text><text x="250.0" y="366" font-size="9.5" fill="#7A8590" text-anchor="middle">-6</text><text x="310.0" y="366" font-size="9.5" fill="#7A8590" text-anchor="middle">-8</text><text x="370.0" y="366" font-size="9.5" fill="#7A8590" text-anchor="middle">-10</text><text x="220.0" y="384" font-size="10.5" fill="#7A8590" text-anchor="middle">b_g 처음 값</text><path d="M70.0,215.0 L100.0,152.6 L130.0,112.2 L160.0,92.8 L190.0,84.9 L220.0,81.8 L250.0,80.7 L280.0,80.2 L310.0,80.1 L340.0,80.0 L370.0,80.0" fill="none" stroke="#9A7B00" stroke-width="2.2"/><path d="M70.0,350.0 L100.0,350.0 L130.0,349.7 L160.0,330.4 L190.0,248.7 L220.0,162.1 L250.0,113.8 L280.0,93.0 L310.0,84.8 L340.0,81.8 L370.0,80.7" fill="none" stroke="#C0392B" stroke-width="2.2"/><path d="M70.0,215.0 L100.0,277.4 L130.0,317.8 L160.0,337.2 L190.0,345.1 L220.0,348.2 L250.0,349.3 L280.0,349.8 L310.0,349.9 L340.0,350.0 L370.0,350.0" fill="none" stroke="#B4552B" stroke-width="1.6" stroke-dasharray="4,3"/><text x="368" y="72.01225742454966" font-size="10.5" fill="#9A7B00" text-anchor="end">1 - g (블록 하나의 지름길)</text><text x="166.0" y="317.6" font-size="10.5" fill="#C0392B" text-anchor="start">(1 - g)^54 (110 층 전체)</text><text x="112.0" y="269.0" font-size="10.5" fill="#B4552B" text-anchor="start">g (F 쪽, 배타 게이트)</text><text x="420" y="84" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">표 1 의 결과 (시험 오차 %)</text><text x="420" y="110" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">b_g</text><text x="472" y="110" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">1 - g</text><text x="550" y="110" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">(1-g)^54</text><text x="640" y="110" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">배타</text><text x="710" y="110" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">지름길만</text><text x="420" y="134" font-size="11" fill="#1C232C" text-anchor="start">0</text><text x="472" y="134" font-size="11" fill="#1C232C" text-anchor="start">0.5000</text><text x="550" y="134" font-size="11" fill="#1C232C" text-anchor="start">5.55e-17</text><text x="640" y="134" font-size="11" fill="#C0392B" text-anchor="start">fail</text><text x="710" y="134" font-size="11" fill="#1C232C" text-anchor="start">12.86</text><text x="420" y="158" font-size="11" fill="#1C232C" text-anchor="start">-1</text><text x="472" y="158" font-size="11" fill="#1C232C" text-anchor="start">0.7311</text><text x="550" y="158" font-size="11" fill="#1C232C" text-anchor="start">4.5e-08</text><text x="640" y="158" font-size="11" fill="#C0392B" text-anchor="start">fail</text><text x="710" y="158" font-size="11" fill="#1C232C" text-anchor="start">-</text><text x="420" y="182" font-size="11" fill="#1C232C" text-anchor="start">-2</text><text x="472" y="182" font-size="11" fill="#1C232C" text-anchor="start">0.8808</text><text x="550" y="182" font-size="11" fill="#1C232C" text-anchor="start">0.00106</text><text x="640" y="182" font-size="11" fill="#C0392B" text-anchor="start">fail</text><text x="710" y="182" font-size="11" fill="#1C232C" text-anchor="start">-</text><text x="420" y="206" font-size="11" fill="#1C232C" text-anchor="start">-3</text><text x="472" y="206" font-size="11" fill="#1C232C" text-anchor="start">0.9526</text><text x="550" y="206" font-size="11" fill="#1C232C" text-anchor="start">0.0725</text><text x="640" y="206" font-size="11" fill="#C0392B" text-anchor="start">fail</text><text x="710" y="206" font-size="11" fill="#1C232C" text-anchor="start">-</text><text x="420" y="230" font-size="11" fill="#1C232C" text-anchor="start">-4</text><text x="472" y="230" font-size="11" fill="#1C232C" text-anchor="start">0.9820</text><text x="550" y="230" font-size="11" fill="#1C232C" text-anchor="start">0.375</text><text x="640" y="230" font-size="11" fill="#C0392B" text-anchor="start">fail</text><text x="710" y="230" font-size="11" fill="#1C232C" text-anchor="start">-</text><text x="420" y="254" font-size="11" fill="#1C232C" text-anchor="start">-5</text><text x="472" y="254" font-size="11" fill="#1C232C" text-anchor="start">0.9933</text><text x="550" y="254" font-size="11" fill="#1C232C" text-anchor="start">0.696</text><text x="640" y="254" font-size="11" fill="#C0392B" text-anchor="start">fail</text><text x="710" y="254" font-size="11" fill="#1C232C" text-anchor="start">-</text><text x="420" y="278" font-size="11" fill="#1C232C" text-anchor="start">-6</text><text x="472" y="278" font-size="11" fill="#1C232C" text-anchor="start">0.9975</text><text x="550" y="278" font-size="11" fill="#1C232C" text-anchor="start">0.875</text><text x="640" y="278" font-size="11" fill="#1C232C" text-anchor="start">8.70</text><text x="710" y="278" font-size="11" fill="#1C232C" text-anchor="start">6.91</text><text x="420" y="302" font-size="11" fill="#1C232C" text-anchor="start">-7</text><text x="472" y="302" font-size="11" fill="#1C232C" text-anchor="start">0.9991</text><text x="550" y="302" font-size="11" fill="#1C232C" text-anchor="start">0.952</text><text x="640" y="302" font-size="11" fill="#1C232C" text-anchor="start">9.81</text><text x="710" y="302" font-size="11" fill="#1C232C" text-anchor="start">-</text><text x="420" y="332" font-size="10.5" fill="#7A8590" text-anchor="start">b_g 는 0 ~ -10 을 학습 집합 교차 검증으로 골랐다(본문).</text><text x="420" y="352" font-size="10.5" fill="#7A8590" text-anchor="start">표에 적힌 것은 위 여덟 행뿐이다.</text><text x="20" y="418" font-size="10.5" fill="#7A8590" text-anchor="start">배타 게이트는 1 - g 가 1 에 가까울수록 F 쪽 g 가 0 에 가까워진다 — 지름길을 열면 잔차 가지가 닫힌다. 그래서 논문은 지름길만 게이트로 따로 쟀다</text></svg>
