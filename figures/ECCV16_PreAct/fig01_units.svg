<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="원래 블록과 사전 활성 블록"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="13.5" fill="#1C232C" text-anchor="start" font-weight="bold">원래 블록과 사전 활성 블록 (논문 그림 1 왼쪽) — 노란 띠 = 연산 없이 이어지는 길, 빨간 테 = 그 길 위에 놓인 연산</text><rect x="55" y="68" width="18" height="276" fill="#E9DFA8" opacity="0.9"/><text x="155.0" y="60" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">(a) 원래 (ResNet 2015)</text><text x="64" y="82" font-size="11" fill="#4E5964" text-anchor="middle">x_l</text><line x1="64" y1="86" x2="64" y2="273" stroke="#4E5964" stroke-width="1.2"/><circle cx="64" cy="90" r="2.5" fill="#1C232C" stroke="#1C232C" stroke-width="1.2"/><path d="M64,90 L219.0,90 L219.0,98" fill="none" stroke="#4E5964" stroke-width="1.1" marker-end="url(#ai)"/><rect x="174.0" y="100" width="90" height="20" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.0"/><text x="219.0" y="114" font-size="10.5" fill="#1C232C" text-anchor="middle">weight</text><line x1="219.0" y1="120" x2="219.0" y2="134" stroke="#4E5964" stroke-width="1.0" marker-end="url(#ai)"/><rect x="174.0" y="134" width="90" height="20" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.0"/><text x="219.0" y="148" font-size="10.5" fill="#1C232C" text-anchor="middle">BN</text><line x1="219.0" y1="154" x2="219.0" y2="168" stroke="#4E5964" stroke-width="1.0" marker-end="url(#ai)"/><rect x="174.0" y="168" width="90" height="20" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="219.0" y="182" font-size="10.5" fill="#1C232C" text-anchor="middle">ReLU</text><line x1="219.0" y1="188" x2="219.0" y2="202" stroke="#4E5964" stroke-width="1.0" marker-end="url(#ai)"/><rect x="174.0" y="202" width="90" height="20" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.0"/><text x="219.0" y="216" font-size="10.5" fill="#1C232C" text-anchor="middle">weight</text><line x1="219.0" y1="222" x2="219.0" y2="236" stroke="#4E5964" stroke-width="1.0" marker-end="url(#ai)"/><rect x="174.0" y="236" width="90" height="20" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.0"/><text x="219.0" y="250" font-size="10.5" fill="#1C232C" text-anchor="middle">BN</text><path d="M219.0,256 L219.0,278 L96,278" fill="none" stroke="#4E5964" stroke-width="1.1" marker-end="url(#ai)"/><rect x="34" y="270" width="60" height="18" rx="3" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.0"/><text x="64" y="283" font-size="10" fill="#1C232C" text-anchor="middle">addition</text><rect x="34" y="296" width="60" height="20" rx="3" fill="#D8E7EE" stroke="#C0392B" stroke-width="1.6"/><text x="64" y="310" font-size="10.5" fill="#1C232C" text-anchor="middle">ReLU</text><line x1="64" y1="316" x2="64" y2="338" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="86" y="338" font-size="11" fill="#4E5964" text-anchor="start">x_l+1</text><text x="155.0" y="362" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="bold">f = ReLU 가 길 위에 있다</text><rect x="315" y="68" width="18" height="310" fill="#E9DFA8" opacity="0.9"/><text x="415.0" y="60" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">(b) 사전 활성 (이 논문)</text><text x="324" y="82" font-size="11" fill="#4E5964" text-anchor="middle">x_l</text><line x1="324" y1="86" x2="324" y2="307" stroke="#4E5964" stroke-width="1.2"/><circle cx="324" cy="90" r="2.5" fill="#1C232C" stroke="#1C232C" stroke-width="1.2"/><path d="M324,90 L479.0,90 L479.0,98" fill="none" stroke="#4E5964" stroke-width="1.1" marker-end="url(#ai)"/><rect x="434.0" y="100" width="90" height="20" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.0"/><text x="479.0" y="114" font-size="10.5" fill="#1C232C" text-anchor="middle">BN</text><line x1="479.0" y1="120" x2="479.0" y2="134" stroke="#4E5964" stroke-width="1.0" marker-end="url(#ai)"/><rect x="434.0" y="134" width="90" height="20" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="479.0" y="148" font-size="10.5" fill="#1C232C" text-anchor="middle">ReLU</text><line x1="479.0" y1="154" x2="479.0" y2="168" stroke="#4E5964" stroke-width="1.0" marker-end="url(#ai)"/><rect x="434.0" y="168" width="90" height="20" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.0"/><text x="479.0" y="182" font-size="10.5" fill="#1C232C" text-anchor="middle">weight</text><line x1="479.0" y1="188" x2="479.0" y2="202" stroke="#4E5964" stroke-width="1.0" marker-end="url(#ai)"/><rect x="434.0" y="202" width="90" height="20" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.0"/><text x="479.0" y="216" font-size="10.5" fill="#1C232C" text-anchor="middle">BN</text><line x1="479.0" y1="222" x2="479.0" y2="236" stroke="#4E5964" stroke-width="1.0" marker-end="url(#ai)"/><rect x="434.0" y="236" width="90" height="20" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="479.0" y="250" font-size="10.5" fill="#1C232C" text-anchor="middle">ReLU</text><line x1="479.0" y1="256" x2="479.0" y2="270" stroke="#4E5964" stroke-width="1.0" marker-end="url(#ai)"/><rect x="434.0" y="270" width="90" height="20" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.0"/><text x="479.0" y="284" font-size="10.5" fill="#1C232C" text-anchor="middle">weight</text><path d="M479.0,290 L479.0,312 L356,312" fill="none" stroke="#4E5964" stroke-width="1.1" marker-end="url(#ai)"/><rect x="294" y="304" width="60" height="18" rx="3" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.0"/><text x="324" y="317" font-size="10" fill="#1C232C" text-anchor="middle">addition</text><line x1="324" y1="322" x2="324" y2="372" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="346" y="372" font-size="11" fill="#4E5964" text-anchor="start">x_l+1</text><text x="415.0" y="396" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="bold">덧셈 뒤가 비어 있다: f = 항등</text><text x="560" y="92" font-size="11.5" fill="#1C232C" text-anchor="start">같은 부품(가중치 둘 · BN 둘 · ReLU 둘)의</text><text x="560" y="114" font-size="11.5" fill="#1C232C" text-anchor="start">순서만 바꿨다.</text><text x="560" y="136" font-size="11.5" fill="#1C232C" text-anchor="start"></text><text x="560" y="158" font-size="11.5" fill="#2A78D6" text-anchor="start">(a) 다음 블록의 입력 x_l+1 = ReLU(y_l)</text><text x="560" y="180" font-size="11.5" fill="#2A78D6" text-anchor="start">   - 늘 0 이상이고, 덧셈 결과가 음수인</text><text x="560" y="202" font-size="11.5" fill="#2A78D6" text-anchor="start">     자리는 다음 블록으로 가지 않는다</text><text x="560" y="224" font-size="11.5" fill="#1C232C" text-anchor="start"></text><text x="560" y="246" font-size="11.5" fill="#EB6834" text-anchor="start">(b) x_l+1 = y_l = x_l + F(x_l)</text><text x="560" y="268" font-size="11.5" fill="#EB6834" text-anchor="start">   - 식 (3) 이 근사 없이 성립한다</text><text x="560" y="290" font-size="11.5" fill="#EB6834" text-anchor="start">   - 모든 가중치 층의 입력이 BN 을</text><text x="560" y="312" font-size="11.5" fill="#EB6834" text-anchor="start">     거친 값이다 (4.2절, 정칙화 설명)</text><text x="560" y="334" font-size="11.5" fill="#1C232C" text-anchor="start"></text><text x="560" y="356" font-size="11.5" fill="#4E5964" text-anchor="start">표 3 · CIFAR-10 · 다섯 번의 중앙값</text><text x="560" y="378" font-size="11.5" fill="#4E5964" text-anchor="start">  ResNet-164  5.93 -&gt; 5.46</text><text x="560" y="400" font-size="11.5" fill="#4E5964" text-anchor="start">  ResNet-1001 7.61 -&gt; 4.92</text></svg>
