<svg xmlns="http://www.w3.org/2000/svg" width="820" height="434" viewBox="0 0 820 434" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="파라미터와 곱-덧셈"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="13.5" fill="#1C232C" text-anchor="start" font-weight="bold">내가 센 파라미터와 곱-덧셈 — 논문의 10.2M 은 BN 을 빼고 셀 때 맞는다</text><text x="40" y="70" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">망</text><text x="160" y="70" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">깊이</text><text x="215" y="70" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">블록</text><text x="270" y="70" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">BN 넣고 (사전 활성)</text><text x="440" y="70" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">BN 빼고</text><text x="560" y="70" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">논문</text><text x="640" y="70" font-size="11" fill="#4E5964" text-anchor="start" font-weight="bold">곱-덧셈</text><text x="40" y="100" font-size="11.5" fill="#1C232C" text-anchor="start">ResNet-110</text><text x="160" y="100" font-size="11.5" fill="#1C232C" text-anchor="start">110</text><text x="215" y="100" font-size="11.5" fill="#1C232C" text-anchor="start">54</text><text x="270" y="100" font-size="11.5" fill="#1E8449" text-anchor="start">1,727,962</text><text x="440" y="100" font-size="11.5" fill="#1E8449" text-anchor="start">1,719,866</text><text x="560" y="100" font-size="11.5" fill="#1C232C" text-anchor="start">1.7M</text><text x="640" y="100" font-size="11.5" fill="#1C232C" text-anchor="start">0.253 G</text><text x="40" y="132" font-size="11.5" fill="#1C232C" text-anchor="start">ResNet-164</text><text x="160" y="132" font-size="11.5" fill="#1C232C" text-anchor="start">164</text><text x="215" y="132" font-size="11.5" fill="#1C232C" text-anchor="start">54</text><text x="270" y="132" font-size="11.5" fill="#1E8449" text-anchor="start">1,703,258</text><text x="440" y="132" font-size="11.5" fill="#1E8449" text-anchor="start">1,679,034</text><text x="560" y="132" font-size="11.5" fill="#1C232C" text-anchor="start">1.7M</text><text x="640" y="132" font-size="11.5" fill="#1C232C" text-anchor="start">0.245 G</text><text x="40" y="164" font-size="11.5" fill="#1C232C" text-anchor="start">ResNet-1001</text><text x="160" y="164" font-size="11.5" fill="#1C232C" text-anchor="start">1001</text><text x="215" y="164" font-size="11.5" fill="#1C232C" text-anchor="start">333</text><text x="270" y="164" font-size="11.5" fill="#C0392B" text-anchor="start">10,327,706</text><text x="440" y="164" font-size="11.5" fill="#1E8449" text-anchor="start">10,178,490</text><text x="560" y="164" font-size="11.5" fill="#1C232C" text-anchor="start">10.2M</text><text x="640" y="164" font-size="11.5" fill="#1C232C" text-anchor="start">1.488 G</text><text x="40" y="196" font-size="11.5" fill="#1C232C" text-anchor="start">ResNet-1202</text><text x="160" y="196" font-size="11.5" fill="#1C232C" text-anchor="start">1202</text><text x="215" y="196" font-size="11.5" fill="#1C232C" text-anchor="start">600</text><text x="270" y="196" font-size="11.5" fill="#1E8449" text-anchor="start">19,421,274</text><text x="440" y="196" font-size="11.5" fill="#C0392B" text-anchor="start">19,331,642</text><text x="560" y="196" font-size="11.5" fill="#1C232C" text-anchor="start">19.4M</text><text x="640" y="196" font-size="11.5" fill="#1C232C" text-anchor="start">2.829 G</text><text x="40" y="238" font-size="10.5" fill="#7A8590" text-anchor="start">초록 = 반올림하면 논문 값과 같다, 빨강 = 다르다. 1202 층의 19.4M 은 원 ResNet 논문의 값이고, 내 셈은 기본 블록 · 0 채움 지름길이다</text><text x="40" y="256" font-size="10.5" fill="#C0392B" text-anchor="start">ResNet-1001 은 BN 을 빼야 10.2M 이고, ResNet-1202 는 BN 을 넣어야 19.4M 이다 — 두 수가 같은 셈법이 아니다 (내 추정)</text><text x="112" y="298" font-size="11" fill="#1C232C" text-anchor="end">ResNet-110</text><rect x="120" y="284" width="48.89161813333334" height="18" rx="2" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><text x="174.89161813333334" y="298" font-size="10.5" fill="#1C232C" text-anchor="start">0.253 G  (110 의 1.00 배)</text><text x="112" y="326" font-size="11" fill="#1C232C" text-anchor="end">ResNet-164</text><rect x="120" y="312" width="47.27019178666666" height="18" rx="2" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="173.27019178666666" y="326" font-size="10.5" fill="#1C232C" text-anchor="start">0.245 G  (110 의 0.97 배)</text><text x="112" y="354" font-size="11" fill="#1C232C" text-anchor="end">ResNet-1001</text><rect x="120" y="340" width="287.65099690666665" height="18" rx="2" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="413.65099690666665" y="354" font-size="10.5" fill="#1C232C" text-anchor="start">1.488 G  (110 의 5.88 배)</text><text x="112" y="382" font-size="11" fill="#1C232C" text-anchor="end">ResNet-1202</text><rect x="120" y="368" width="546.9861896533333" height="18" rx="2" fill="#2A78D6" stroke="#2A78D6" stroke-width="1.2"/><text x="672.9861896533333" y="382" font-size="10.5" fill="#1C232C" text-anchor="start">2.829 G  (110 의 11.19 배)</text><text x="410" y="412" font-size="10.5" fill="#7A8590" text-anchor="middle">본문 '1001 층은 100 층의 10 배쯤 복잡하다' — 곱-덧셈으로 세면 ResNet-110 의 5.9 배, ResNet-164 의 6.1 배</text></svg>
