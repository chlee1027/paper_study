"start">  0.5^54 = 5.55e-17</text><text x="590" y="262" font-size="10.5" fill="#1C232C" text-anchor="start">  0.9^54 = 0.0034</text><text x="590" y="282" font-size="10.5" fill="#1C232C" text-anchor="start">  0.99^54 = 0.581</text><text x="590" y="302" font-size="10.5" fill="#1C232C" text-anchor="start">  0.9975^54 = 0.875</text><text x="590" y="322" font-size="10.5" fill="#4E5964" text-anchor="start">블록 333 개를 지나면</text><text x="590" y="342" font-size="10.5" fill="#1C232C" text-anchor="start">  0.99^333 = 0.035</text><text x="590" y="362" font-size="10.5" fill="#1C232C" text-anchor="start">  0.9975^333 = 0.438</text><text x="20" y="424" font-size="10.5" fill="#7A8590" text-anchor="start">논문은 λ &gt; 1 이면 지수로 커지고 λ &lt; 1 이면 지수로 작아진다고만 적는다. 위 수는 내가 센 것이다. 이 식은 f = 항등을 가정한다 — 표 1 의 실험은 f = ReLU 다</text></svg>
