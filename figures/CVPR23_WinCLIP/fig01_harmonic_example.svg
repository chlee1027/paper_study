<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 350" width="640" height="350"><rect width="640" height="350" fill="#ffffff"/><text x="20.0" y="28.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">한 화소를 덮는 창 넷의 결함 점수와 두 평균 (식 3, 내 예시)</text><line x1="70.0" y1="260.0" x2="560.0" y2="260.0" stroke="#222222" stroke-width="1"/><line x1="70.0" y1="60.0" x2="70.0" y2="260.0" stroke="#222222" stroke-width="1"/><line x1="66.0" y1="260.0" x2="70.0" y2="260.0" stroke="#222222" stroke-width="1"/><text x="62.0" y="264.0" font-size="11" fill="#666666" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.0</text><line x1="66.0" y1="160.0" x2="70.0" y2="160.0" stroke="#222222" stroke-width="1"/><text x="62.0" y="164.0" font-size="11" fill="#666666" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.5</text><line x1="66.0" y1="60.0" x2="70.0" y2="60.0" stroke="#222222" stroke-width="1"/><text x="62.0" y="64.0" font-size="11" fill="#666666" text-anchor="end" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">1.0</text><rect x="95.0" y="80.0" width="44.0" height="180.0" rx="0" fill="#2f6db3" stroke="none"/><text x="117.0" y="278.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">창 1</text><text x="117.0" y="74.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.9</text><rect x="165.0" y="80.0" width="44.0" height="180.0" rx="0" fill="#2f6db3" stroke="none"/><text x="187.0" y="278.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">창 2</text><text x="187.0" y="74.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.9</text><rect x="235.0" y="80.0" width="44.0" height="180.0" rx="0" fill="#2f6db3" stroke="none"/><text x="257.0" y="278.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">창 3</text><text x="257.0" y="74.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.9</text><rect x="305.0" y="240.0" width="44.0" height="20.0" rx="0" fill="#8a8a8a" stroke="none"/><text x="327.0" y="278.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">창 4</text><text x="327.0" y="234.0" font-size="11" fill="#222222" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">0.1</text><line x1="70.0" y1="120.0" x2="380.0" y2="120.0" stroke="#d9a21b" stroke-width="2" stroke-dasharray="6 4"/><text x="390.0" y="124.0" font-size="12" fill="#d9a21b" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">산술 평균 0.70</text><line x1="70.0" y1="200.0" x2="380.0" y2="200.0" stroke="#c8553d" stroke-width="2" stroke-dasharray="6 4"/><text x="390.0" y="204.0" font-size="12" fill="#c8553d" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">조화 평균 0.30</text><text x="20.0" y="308.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">창 셋이 결함(0.9)이라 해도 하나가 정상(0.1)이라 하면 조화 평균은 0.30 으로 정상 쪽에 붙는다.</text><text x="20.0" y="328.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">원문: 「정상 예측(0)으로 더 무게를 둔다」. 창 넷이 모두 0.9 면 두 평균 모두 0.90 이다.</text></svg>