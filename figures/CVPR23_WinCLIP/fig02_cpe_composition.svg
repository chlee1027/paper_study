<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 730 375" width="730" height="375"><rect width="730" height="375" fill="#ffffff"/><text x="20.0" y="28.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">조합 프롬프트 묶음: 상태 낱말 x 문장 틀 -&gt; 평균 -&gt; 원형 둘 (부록 그림 6, 문장 수는 내 셈)</text><rect x="20.0" y="50.0" width="200.0" height="150.0" rx="6" fill="#eef3fa" stroke="#2f6db3"/><text x="30.0" y="72.0" font-size="13" fill="#2f6db3" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">정상 상태 7 개</text><text x="30.0" y="92.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">[o]</text><text x="30.0" y="107.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">flawless [o]</text><text x="30.0" y="122.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">perfect [o]</text><text x="30.0" y="137.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">unblemished [o]</text><text x="30.0" y="152.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">[o] without flaw</text><text x="30.0" y="167.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">[o] without defect</text><text x="30.0" y="182.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">[o] without damage</text><rect x="20.0" y="215.0" width="200.0" height="98.0" rx="6" fill="#fbefec" stroke="#c8553d"/><text x="30.0" y="237.0" font-size="13" fill="#c8553d" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">결함 상태 4 개</text><text x="30.0" y="257.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">damaged [o]</text><text x="30.0" y="272.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">[o] with flaw</text><text x="30.0" y="287.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">[o] with defect</text><text x="30.0" y="302.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">[o] with damage</text><rect x="260.0" y="50.0" width="230.0" height="255.0" rx="6" fill="#f6f6f6" stroke="#8a8a8a"/><text x="270.0" y="72.0" font-size="13" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">문장 틀 22 개</text><text x="270.0" y="92.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">a cropped photo of the [c].</text><text x="270.0" y="107.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">a close-up photo of a [c].</text><text x="270.0" y="122.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">a bright photo of a [c].</text><text x="270.0" y="137.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">a dark photo of the [c].</text><text x="270.0" y="152.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">a jpeg corrupted photo of a [c].</text><text x="270.0" y="167.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">a blurry photo of the [c].</text><text x="270.0" y="182.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">a photo of a [c].</text><text x="270.0" y="197.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">a photo of a small [c].</text><text x="270.0" y="212.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">a photo of a large [c].</text><text x="270.0" y="232.0" font-size="10" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">... (a / the 짝으로 22 개)</text><text x="270.0" y="256.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CLIP ImageNet 80 개에 있는 것 18</text><text x="270.0" y="274.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">새로 넣은 것 4: for visual inspection,</text><text x="270.0" y="290.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">for anomaly detection (a / the)</text><line x1="222.0" y1="125.0" x2="258.0" y2="125.0" stroke="#666666" stroke-width="1.5"/><polygon points="258.0,125.0 250.6,128.1 250.6,121.9" fill="#666666"/><line x1="222.0" y1="260.0" x2="258.0" y2="260.0" stroke="#666666" stroke-width="1.5"/><polygon points="258.0,260.0 250.6,263.1 250.6,256.9" fill="#666666"/><rect x="530.0" y="80.0" width="180.0" height="70.0" rx="6" fill="#eef3fa" stroke="#2f6db3"/><text x="540.0" y="102.0" font-size="13" fill="#2f6db3" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">7 x 22 = 154 문장</text><text x="540.0" y="122.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">글 부호기 -&gt; 평균</text><text x="540.0" y="140.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">-&gt; 정상 원형 1 개</text><rect x="530.0" y="205.0" width="180.0" height="70.0" rx="6" fill="#fbefec" stroke="#c8553d"/><text x="540.0" y="227.0" font-size="13" fill="#c8553d" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">4 x 22 = 88 문장</text><text x="540.0" y="247.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">글 부호기 -&gt; 평균</text><text x="540.0" y="265.0" font-size="11" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">-&gt; 결함 원형 1 개</text><line x1="492.0" y1="125.0" x2="528.0" y2="115.0" stroke="#666666" stroke-width="1.5"/><polygon points="528.0,115.0 521.7,120.0 520.1,114.0" fill="#666666"/><line x1="492.0" y1="260.0" x2="528.0" y2="240.0" stroke="#666666" stroke-width="1.5"/><polygon points="528.0,240.0 523.1,246.3 520.0,240.9" fill="#666666"/><text x="20.0" y="335.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">[o] 는 데이터셋의 물체 이름(bottle 등)이다. 정상 쪽 첫 줄 「[o]」 는 상태 낱말 없이 물체 이름만 넣은 것이다.</text><text x="20.0" y="355.0" font-size="12" fill="#666666" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지 임베딩과 두 원형의 코사인으로 두 부류 소프트맥스(식 1)를 낸다. 결함 쪽 확률이 ascore0 라는 것은 내 해석이다(원문에 식이 없다).</text></svg>