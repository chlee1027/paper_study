<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 810 420" width="810" height="420"><rect width="810" height="420" fill="#ffffff"/><text x="20.0" y="28.0" font-size="15" fill="#222222" text-anchor="start" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">WinCLIP 의 자리: 무엇을 가져와 어떻게 묶었나</text><rect x="20.0" y="50.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#2f6db3"/><text x="120.0" y="72.0" font-size="13" fill="#2f6db3" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">CLIP (2021)</text><text x="120.0" y="92.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지-글 대조 사전학습</text><text x="120.0" y="108.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">클래스 이름 글로 제로샷 분류</text><text x="120.0" y="124.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이미지 하나에 임베딩 하나</text><rect x="20.0" y="165.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#8a8a8a"/><text x="120.0" y="187.0" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">MAE (2022)</text><text x="120.0" y="207.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">가린 조각을 빼고 순전파</text><text x="120.0" y="223.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">-&gt; 창마다 계산을 줄인 근거</text><rect x="20.0" y="280.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#d9a21b"/><text x="120.0" y="302.0" font-size="13" fill="#d9a21b" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">SPADE · PatchCore</text><text x="120.0" y="322.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">정상 조각 특징을 기억해 두고</text><text x="120.0" y="338.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">가장 가까운 거리로 결함 점수</text><rect x="290.0" y="130.0" width="230.0" height="150.0" rx="6" fill="#ffffff" stroke="#c8553d"/><text x="405.0" y="152.0" font-size="13" fill="#c8553d" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">WinCLIP / WinCLIP+ (2023)</text><text x="405.0" y="172.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">상태 낱말 x 틀 -&gt; 원형 둘 (4.1)</text><text x="405.0" y="188.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">창으로 가린 이미지를 CLIP 에</text><text x="405.0" y="204.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">다시 넣어 창마다 클래스 토큰 (4.2)</text><text x="405.0" y="220.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">조화 평균 · 다중 크기</text><text x="405.0" y="236.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">+ 정상 1~4 장 기억과 최근접 (4.3)</text><text x="405.0" y="252.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">학습하는 파라미터 없음</text><rect x="590.0" y="165.0" width="200.0" height="90.0" rx="6" fill="#ffffff" stroke="#8a8a8a"/><text x="690.0" y="187.0" font-size="13" fill="#8a8a8a" text-anchor="middle" font-weight="bold" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">AnomalyCLIP (2024)</text><text x="690.0" y="207.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">이 큰 틀의 다음 칸</text><text x="690.0" y="223.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">프롬프트를 배운다</text><text x="690.0" y="239.0" font-size="11" fill="#666666" text-anchor="middle" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">(이 노트에서는 안 읽음)</text><line x1="222.0" y1="95.0" x2="288.0" y2="170.0" stroke="#666666" stroke-width="1.5"/><polygon points="288.0,170.0 280.8,166.5 285.5,162.4" fill="#666666"/><line x1="222.0" y1="210.0" x2="288.0" y2="205.0" stroke="#666666" stroke-width="1.5"/><polygon points="288.0,205.0 280.9,208.7 280.4,202.5" fill="#666666"/><line x1="222.0" y1="325.0" x2="288.0" y2="250.0" stroke="#666666" stroke-width="1.5"/><polygon points="288.0,250.0 285.5,257.6 280.8,253.5" fill="#666666"/><line x1="522.0" y1="205.0" x2="588.0" y2="210.0" stroke="#666666" stroke-width="1.5"/><polygon points="588.0,210.0 580.4,212.5 580.9,206.3" fill="#666666"/><text x="20.0" y="400.0" font-size="12" fill="#222222" text-anchor="start" font-weight="normal" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">WinCLIP 의 기본 백본은 OpenAI CLIP 이 아니라 OpenCLIP 의 LAION-400M ViT-B/16+ 다. CLIP 논문의 WIT 와 사전학습 데이터가 다르다.</text></svg>