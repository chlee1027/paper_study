      <g font-size="13" fill="#1C232C" text-anchor="middle">
        <text x="180" y="30" font-weight="600">종 하나 = 중심 하나 + 폭 하나</text>
        <text x="560" y="30" font-weight="600">폭은 잡음의 크기 β가 정한다</text>
      </g>
      <!-- 왼쪽 -->
      <line x1="50" y1="160" x2="320" y2="160" stroke="#1C232C" stroke-width="1"/>
      <use href="#g30" transform="translate(180,160)" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="2"/>
      <line x1="180" y1="80" x2="180" y2="160" stroke="#2E6B8A" stroke-width="1" stroke-dasharray="3 3"/>
      <line x1="180" y1="128" x2="210" y2="128" stroke="#1C232C" stroke-width="1.4"/>
      <line x1="210" y1="123" x2="210" y2="133" stroke="#1C232C" stroke-width="1.4"/>
      <g font-size="12" fill="#1C232C" text-anchor="middle">
        <text x="180" y="178">중심 μ (어디에 몰리나)</text>
        <text x="250" y="126">폭 σ</text>
        <text x="100" y="100" fill="#7A8590" font-size="11.5">높을수록</text>
        <text x="100" y="114" fill="#7A8590" font-size="11.5">자주 나오는 값</text>
      </g>
      <!-- 오른쪽 -->
      <line x1="400" y1="160" x2="730" y2="160" stroke="#1C232C" stroke-width="1"/>
      <use href="#g45" transform="translate(560,160)" fill="none" stroke="#7A8590" stroke-width="2"/>
      <use href="#g22" transform="translate(560,160)" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="2"/>
      <g font-size="12" text-anchor="middle">
        <text x="560" y="68" fill="#2E6B8A">β 작음: 좁은 종 (값이 거의 정해짐)</text>
        <text x="670" y="118" fill="#7A8590">β 큼: 넓은 종</text>
        <text x="560" y="178" fill="#1C232C">같은 중심, 다른 폭</text>
      </g>
    </svg>
