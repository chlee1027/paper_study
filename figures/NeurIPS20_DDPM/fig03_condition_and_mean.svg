<svg xmlns="http://www.w3.org/2000/svg" width="760" height="200" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" viewBox="0 0 760 200" role="img" aria-label="왼쪽: x_t를 한 값으로 고정하면 x_{t-1}의 종 하나가 그려진다. 오른쪽: 기대값은 데이터 여러 장에서 나온 값들의 평균이다."><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/>
      <defs>
        <path id="h30" d="M-105,-0.2 L-99,-0.3 L-93,-0.7 L-87,-1.2 L-81,-2.1 L-75,-3.5 L-69,-5.7 L-63,-8.8 L-57,-13.2 L-51,-18.9 L-45,-26 L-39,-34.4 L-33,-43.7 L-27,-53.4 L-21,-62.6 L-15,-70.6 L-9,-76.5 L-3,-79.6 L0,-80 L3,-79.6 L9,-76.5 L15,-70.6 L21,-62.6 L27,-53.4 L33,-43.7 L39,-34.4 L45,-26 L51,-18.9 L57,-13.2 L63,-8.8 L69,-5.7 L75,-3.5 L81,-2.1 L87,-1.2 L93,-0.7 L99,-0.3 L105,-0.2"/>
        <marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1C232C"/></marker>
      </defs>
      <g font-size="13" fill="#1C232C" text-anchor="middle">
        <text x="190" y="30" font-weight="600">막대 | 는 "이 값을 알 때"</text>
        <text x="570" y="30" font-weight="600">E[ · ] 는 "여러 장 뽑아 평균"</text>
      </g>
      <!-- 왼쪽: 조건부 -->
      <line x1="40" y1="160" x2="350" y2="160" stroke="#1C232C" stroke-width="1"/>
      <use href="#h30" transform="translate(190,160)" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="2"/>
      <circle cx="240" cy="160" r="5" fill="#1C232C"/>
      <line x1="240" y1="160" x2="240" y2="56" stroke="#1C232C" stroke-width="1" stroke-dasharray="3 3"/>
      <g font-size="12" text-anchor="middle">
        <text x="240" y="50" fill="#1C232C">조건: xₜ 는 이 값으로 고정</text>
        <text x="130" y="72" fill="#2E6B8A">그때 xₜ₋₁ 의 종</text>
        <text x="130" y="86" fill="#2E6B8A">q(xₜ₋₁ | xₜ)</text>
        <text x="190" y="180" fill="#7A8590" font-size="11.5">xₜ 값을 바꾸면 종이 따라 움직인다</text>
      </g>
      <!-- 오른쪽: 기대값 -->
      <line x1="430" y1="160" x2="730" y2="160" stroke="#1C232C" stroke-width="1"/>
      <g stroke="#7A8590" stroke-width="1">
        <line x1="460" y1="160" x2="460" y2="100"/><line x1="508" y1="160" x2="508" y2="130"/><line x1="556" y1="160" x2="556" y2="80"/>
        <line x1="604" y1="160" x2="604" y2="120"/><line x1="652" y1="160" x2="652" y2="140"/><line x1="700" y1="160" x2="700" y2="95"/>
      </g>
      <g fill="#B4552B">
        <circle cx="460" cy="100" r="5"/><circle cx="508" cy="130" r="5"/><circle cx="556" cy="80" r="5"/>
        <circle cx="604" cy="120" r="5"/><circle cx="652" cy="140" r="5"/><circle cx="700" cy="95" r="5"/>
      </g>
      <line x1="440" y1="111" x2="725" y2="111" stroke="#1C232C" stroke-width="1.6" stroke-dasharray="6 3"/>
      <g font-size="12" text-anchor="middle">
        <text x="580" y="60" fill="#B4552B">데이터 한 장마다 값 하나 (점)</text>
        <text x="710" y="126" fill="#1C232C" text-anchor="end">평균 = 기대값</text>
        <text x="580" y="180" fill="#7A8590" font-size="11.5">x₀, t, ε 를 뽑을 때마다 점 하나</text>
      </g>
    </svg>
