<svg xmlns="http://www.w3.org/2000/svg" width="760" height="230" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" viewBox="0 0 760 230" role="img" aria-label="사슬 x0부터 xT까지에서 L0는 왼쪽 끝 마디, L_{t-1}은 가운데 모든 마디, L_T는 오른쪽 끝에서 xT와 표준 정규분포를 비교하는 항이다."><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/>
      <text x="380" y="30" font-size="13.5" font-weight="600" fill="#1C232C" text-anchor="middle">L = L_T + L_{T−1} + … + L₁ + L₀   (마디 하나에 항 하나, 모두 T+1개)</text>
      <g font-size="14" text-anchor="middle" fill="#1C232C">
        <rect x="40" y="80" width="60" height="44" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="70" y="108">x₀</text>
        <rect x="140" y="80" width="60" height="44" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="170" y="108">x₁</text>
        <text x="250" y="108" fill="#7A8590" font-size="18">…</text>
        <rect x="300" y="80" width="70" height="44" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="335" y="108">xₜ₋₁</text>
        <rect x="410" y="80" width="60" height="44" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="440" y="108">xₜ</text>
        <text x="515" y="108" fill="#7A8590" font-size="18">…</text>
        <rect x="560" y="80" width="60" height="44" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="590" y="108">x_T</text>
        <circle cx="700" cy="102" r="30" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="700" y="107" font-size="12.5" fill="#2E6B8A">N(0, I)</text>
      </g>
      <g stroke="#1C232C" stroke-width="1.2" fill="none">
        <line x1="100" y1="102" x2="140" y2="102"/><line x1="200" y1="102" x2="230" y2="102"/><line x1="270" y1="102" x2="300" y2="102"/>
        <line x1="370" y1="102" x2="410" y2="102"/><line x1="470" y1="102" x2="500" y2="102"/><line x1="530" y1="102" x2="560" y2="102"/>
      </g>
      <line x1="620" y1="102" x2="670" y2="102" stroke="#2E6B8A" stroke-width="1.2" stroke-dasharray="4 3"/>
      <!-- L0 -->
      <path d="M40,140 L40,150 L200,150 L200,140" fill="none" stroke="#B4552B" stroke-width="1.6"/>
      <text x="120" y="170" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">L₀</text>
      <text x="120" y="186" font-size="11.5" fill="#B4552B" text-anchor="middle">x₁에서 정수 픽셀 x₀의 확률</text>
      <text x="120" y="202" font-size="11.5" fill="#7A8590" text-anchor="middle">학습 대상 · 항 1개</text>
      <!-- Lt-1 -->
      <path d="M300,140 L300,150 L470,150 L470,140" fill="none" stroke="#B4552B" stroke-width="1.6"/>
      <text x="385" y="170" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">Lₜ₋₁</text>
      <text x="385" y="186" font-size="11.5" fill="#B4552B" text-anchor="middle">정답 종과 모델 종의 KL</text>
      <text x="385" y="202" font-size="11.5" fill="#7A8590" text-anchor="middle">학습 대상 · 항 T−1개, 전부 같은 꼴</text>
      <!-- LT -->
      <path d="M560,140 L560,150 L730,150 L730,140" fill="none" stroke="#2E6B8A" stroke-width="1.6"/>
      <text x="645" y="170" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">L_T</text>
      <text x="645" y="186" font-size="11.5" fill="#2E6B8A" text-anchor="middle">x_T 의 종과 N(0, I)의 KL</text>
      <text x="645" y="202" font-size="11.5" fill="#7A8590" text-anchor="middle">θ 없음 · 상수로 버림</text>
    </svg>
