<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="합성곱 층 BN 의 유효 미니배치"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">합성곱 층에서는 한 특징 지도의 모든 자리를 한 묶음으로 — 유효 미니배치 m' = m · p · q (논문 3.2절)</text><rect x="60" y="64" width="130" height="130" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><rect x="78" y="78" width="130" height="130" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><rect x="96" y="92" width="130" height="130" rx="2" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><rect x="114" y="106" width="130" height="130" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="190" y="290" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">미니배치 m 장 × 한 특징 지도(p × q)</text><text x="190" y="308" font-size="12" fill="#9A7B00" text-anchor="middle">이 모두가 알고리즘 1 의 B 하나</text><text x="190" y="326" font-size="12" fill="#4E5964" text-anchor="middle">γ⁽ᵏ⁾, β⁽ᵏ⁾ 도 특징 지도 k 마다 한 쌍</text><rect x="380" y="60" width="420" height="150" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="395" y="84" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">m = 32 (논문 ImageNet 실험의 미니배치)</text><text x="395" y="110" font-size="12" fill="#1C232C" text-anchor="start">특징 지도 56 × 56  →  m' = 100,352</text><text x="395" y="132" font-size="12" fill="#1C232C" text-anchor="start">특징 지도 28 × 28  →  m' = 25,088</text><text x="395" y="154" font-size="12" fill="#1C232C" text-anchor="start">특징 지도 14 × 14  →  m' = 6,272</text><text x="395" y="176" font-size="12" fill="#1C232C" text-anchor="start">특징 지도 7 × 7  →  m' = 1,568</text><rect x="380" y="220" width="420" height="110" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="395" y="244" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">학습되는 γ, β 의 수 (C = 64 지도, 28 × 28)</text><text x="395" y="268" font-size="12" fill="#1E8449" text-anchor="start">특징 지도마다:  2 × 64 = 128 개</text><text x="395" y="290" font-size="12" fill="#C0392B" text-anchor="start">활성마다였다면:  2 × 64 × 28 × 28 = 100,352 개</text><text x="395" y="314" font-size="11" fill="#4E5964" text-anchor="start">같은 지도의 다른 자리를 같은 방식으로 정규화 — 합성곱의 성질</text></svg>
