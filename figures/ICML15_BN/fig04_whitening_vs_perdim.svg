<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="전체 백색화와 차원별 정규화 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">전체 백색화 대신 차원마다 따로 — 논문 3절의 첫째 단순화 (d, m 은 논문 MNIST 실험의 값)</text><rect x="20" y="50" width="385" height="250" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="212" y="76" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">전체 백색화  Cov[x]^(−1/2) (x − E[x])</text><text x="212" y="110" font-size="12" fill="#1C232C" text-anchor="middle">통계: 공분산 d(d+1)/2 = 5,050 개</text><text x="212" y="134" font-size="12" fill="#1C232C" text-anchor="middle">역제곱근과 그 미분이 필요하다</text><text x="212" y="158" font-size="12" fill="#1C232C" text-anchor="middle"></text><text x="212" y="182" font-size="12" fill="#1C232C" text-anchor="middle">미니배치 m = 60 로 추정하면</text><text x="212" y="206" font-size="12" fill="#C0392B" text-anchor="middle">표본 공분산의 계수가 59 (= m − 1)</text><text x="212" y="230" font-size="12" fill="#C0392B" text-anchor="middle">d = 100 보다 작아 역행렬이 없다</text><text x="212" y="254" font-size="12" fill="#1C232C" text-anchor="middle">(그림 코드가 소거법으로 센 계수)</text><rect x="415" y="50" width="385" height="250" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="607" y="76" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">차원별 정규화  (x⁽ᵏ⁾ − E[x⁽ᵏ⁾]) / √Var[x⁽ᵏ⁾]</text><text x="607" y="110" font-size="12" fill="#1C232C" text-anchor="middle">통계: 평균과 분산 2d = 200 개</text><text x="607" y="134" font-size="12" fill="#1C232C" text-anchor="middle">m ≥ 2 면 어느 차원이든 계산된다</text><text x="607" y="158" font-size="12" fill="#1C232C" text-anchor="middle"></text><text x="607" y="182" font-size="12" fill="#1C232C" text-anchor="middle">대신 차원 사이의 상관은 그대로 둔다</text><text x="607" y="206" font-size="12" fill="#1C232C" text-anchor="middle"></text><text x="607" y="230" font-size="12" fill="#1C232C" text-anchor="middle">LeCun 외(1998b): 상관을 안 없애도</text><text x="607" y="254" font-size="12" fill="#1C232C" text-anchor="middle">이 정규화만으로 수렴이 빨라진다</text><text x="410" y="322" font-size="11" fill="#7A8590" text-anchor="middle">논문: 「결합 공분산이면 미니배치가 백색화할 활성 수보다 작을 가능성이 커서 공분산이 특이해지고 정규화가 필요하다」</text></svg>
