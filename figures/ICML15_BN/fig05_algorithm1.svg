<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="알고리즘 1 손계산"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">알고리즘 1 을 손으로 — 미니배치 넷, γ = 2, β = 0.5, ε = 10⁻⁵ (값은 내가 고른 것)</text><rect x="20" y="60" width="780" height="34" rx="4" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1.2"/><text x="80.0" y="82" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">xᵢ</text><text x="210.0" y="82" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">xᵢ − μ</text><text x="355.0" y="82" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">x̂ᵢ</text><text x="520.0" y="82" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">yᵢ = γx̂ᵢ + β</text><text x="705.0" y="82" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">γ=√(σ²+ε), β=μ 이면</text><rect x="20" y="94" width="780" height="36" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="80.0" y="117" font-size="12" fill="#1C232C" text-anchor="middle">1</text><text x="210.0" y="117" font-size="12" fill="#1C232C" text-anchor="middle">-3</text><text x="355.0" y="117" font-size="12" fill="#1C232C" text-anchor="middle">-0.9733</text><text x="520.0" y="117" font-size="12" fill="#1C232C" text-anchor="middle">-1.4467</text><text x="705.0" y="117" font-size="12" fill="#1E8449" text-anchor="middle">1.0000</text><rect x="20" y="130" width="780" height="36" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="80.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">2</text><text x="210.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">-2</text><text x="355.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">-0.6489</text><text x="520.0" y="153" font-size="12" fill="#1C232C" text-anchor="middle">-0.7978</text><text x="705.0" y="153" font-size="12" fill="#1E8449" text-anchor="middle">2.0000</text><rect x="20" y="166" width="780" height="36" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="80.0" y="189" font-size="12" fill="#1C232C" text-anchor="middle">4</text><text x="210.0" y="189" font-size="12" fill="#1C232C" text-anchor="middle">+0</text><text x="355.0" y="189" font-size="12" fill="#1C232C" text-anchor="middle">+0.0000</text><text x="520.0" y="189" font-size="12" fill="#1C232C" text-anchor="middle">+0.5000</text><text x="705.0" y="189" font-size="12" fill="#1E8449" text-anchor="middle">4.0000</text><rect x="20" y="202" width="780" height="36" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="80.0" y="225" font-size="12" fill="#1C232C" text-anchor="middle">9</text><text x="210.0" y="225" font-size="12" fill="#1C232C" text-anchor="middle">+5</text><text x="355.0" y="225" font-size="12" fill="#1C232C" text-anchor="middle">+1.6222</text><text x="520.0" y="225" font-size="12" fill="#1C232C" text-anchor="middle">+3.7444</text><text x="705.0" y="225" font-size="12" fill="#1E8449" text-anchor="middle">9.0000</text><text x="30" y="258" font-size="12" fill="#1C232C" text-anchor="start">1. μ_B = (1 + 2 + 4 + 9) / 4 = 4.0</text><text x="30" y="280" font-size="12" fill="#1C232C" text-anchor="start">2. σ²_B = (9 + 4 + 0 + 25) / 4 = 9.50   (m 으로 나눈다 — 추론에서는 m/(m−1) 로 고친다, 그림 7)</text><text x="30" y="302" font-size="12" fill="#1C232C" text-anchor="start">3. x̂ = (x − μ) / √(σ² + ε):  합 1.1e-16, 제곱 평균 0.999999 — 평균 0, 분산 1 (ε 만큼 1 에 못 미친다)</text><text x="30" y="324" font-size="12" fill="#1C232C" text-anchor="start">4. y = γx̂ + β:  평균 0.50 (= β), 표준편차 2.0000 (≈ γ) — 다음 층이 받는 값</text><text x="30" y="346" font-size="12" fill="#1E8449" text-anchor="start">오른쪽 끝 열: γ, β 를 그렇게 두면 원래 x 로 돌아온다 — 논문이 말하는 「항등 변환도 나타낼 수 있다」</text></svg>
