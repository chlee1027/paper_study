<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="역전파 식과 유한 차분 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">논문 3절의 역전파 식 여섯을 그림 5 의 미니배치에 — 식과 유한 차분이 맞는가 (∂ℓ/∂y 는 내가 고른 값)</text><rect x="20" y="55" width="770" height="32" rx="4" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1.2"/><text x="105.0" y="76" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold"></text><text x="265.0" y="76" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">i = 1</text><text x="415.0" y="76" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">i = 2</text><text x="565.0" y="76" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">i = 3</text><text x="715.0" y="76" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">i = 4</text><rect x="20" y="87" width="770" height="34" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="30" y="109" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">∂ℓ/∂yᵢ (주어짐)</text><text x="265.0" y="109" font-size="12" fill="#1C232C" text-anchor="middle">+0.30</text><text x="415.0" y="109" font-size="12" fill="#1C232C" text-anchor="middle">-1.20</text><text x="565.0" y="109" font-size="12" fill="#1C232C" text-anchor="middle">+0.50</text><text x="715.0" y="109" font-size="12" fill="#1C232C" text-anchor="middle">+0.80</text><rect x="20" y="121" width="770" height="34" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="30" y="143" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">∂ℓ/∂x̂ᵢ = ∂ℓ/∂yᵢ · γ</text><text x="265.0" y="143" font-size="12" fill="#1C232C" text-anchor="middle">+0.60</text><text x="415.0" y="143" font-size="12" fill="#1C232C" text-anchor="middle">-2.40</text><text x="565.0" y="143" font-size="12" fill="#1C232C" text-anchor="middle">+1.00</text><text x="715.0" y="143" font-size="12" fill="#1C232C" text-anchor="middle">+1.60</text><rect x="20" y="155" width="770" height="34" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="30" y="177" font-size="12" fill="#EB6834" text-anchor="start" font-weight="bold">∂ℓ/∂xᵢ — 논문 식</text><text x="265.0" y="177" font-size="12" fill="#EB6834" text-anchor="middle">+0.41153</text><text x="415.0" y="177" font-size="12" fill="#EB6834" text-anchor="middle">-0.65572</text><text x="565.0" y="177" font-size="12" fill="#EB6834" text-anchor="middle">+0.25955</text><text x="715.0" y="177" font-size="12" fill="#EB6834" text-anchor="middle">-0.01537</text><rect x="20" y="189" width="770" height="34" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="30" y="211" font-size="12" fill="#2A78D6" text-anchor="start" font-weight="bold">∂ℓ/∂xᵢ — 유한 차분</text><text x="265.0" y="211" font-size="12" fill="#2A78D6" text-anchor="middle">+0.41153</text><text x="415.0" y="211" font-size="12" fill="#2A78D6" text-anchor="middle">-0.65572</text><text x="565.0" y="211" font-size="12" fill="#2A78D6" text-anchor="middle">+0.25955</text><text x="715.0" y="211" font-size="12" fill="#2A78D6" text-anchor="middle">-0.01537</text><text x="30" y="249" font-size="12" fill="#1C232C" text-anchor="start">∂ℓ/∂σ²_B = -0.18784,  ∂ℓ/∂μ_B = -0.25955   (중간 값)</text><text x="30" y="271" font-size="12" fill="#1C232C" text-anchor="start">∂ℓ/∂γ = Σ ∂ℓ/∂yᵢ · x̂ᵢ = 1.78443 (유한 차분 1.78443),  ∂ℓ/∂β = Σ ∂ℓ/∂yᵢ = 0.40 (유한 차분 0.40000)</text><text x="30" y="293" font-size="12" fill="#1E8449" text-anchor="start">식과 유한 차분의 최대 차이 4.5e-10 — 여섯 식이 맞다</text><text x="30" y="315" font-size="12" fill="#1C232C" text-anchor="start"></text><text x="30" y="337" font-size="12" fill="#4E5964" text-anchor="start">눈여겨볼 것: Σ ∂ℓ/∂xᵢ = 1.4e-17,  Σ ∂ℓ/∂xᵢ · x̂ᵢ = 1.2e-06</text><text x="30" y="359" font-size="12" fill="#4E5964" text-anchor="start">→ x 로 가는 기울기에는 미니배치 전체를 한꺼번에 옮기는 성분이 없고, 한꺼번에 늘이는 성분은 ε 때문에 10⁻⁶ 만큼만 남는다.</text><text x="30" y="381" font-size="12" fill="#4E5964" text-anchor="start">   정규화가 어차피 지울 방향으로는 기울기가 가지 않는다 — 그림 3 의 발산을 막는 것이 이것이다 (내가 붙인 읽기)</text></svg>
