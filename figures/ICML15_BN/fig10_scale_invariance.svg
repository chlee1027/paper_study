<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="BN 의 가중치 척도 불변"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">가중치를 a 배 해도 BN 출력은 같고, 그 가중치의 기울기는 1/a 배 (논문 3.3절, 수는 내가 고른 예, a = 10)</text><rect x="20" y="60" width="780" height="32" rx="4" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1.2"/><text x="130.0" y="81" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold"></text><text x="310.0" y="81" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">예시 1</text><text x="450.0" y="81" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">예시 2</text><text x="590.0" y="81" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">예시 3</text><text x="730.0" y="81" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">예시 4</text><rect x="20" y="92" width="780" height="34" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="30" y="114" font-size="12" fill="#2A78D6" text-anchor="start" font-weight="bold">BN(Wu)</text><text x="310.0" y="114" font-size="12" fill="#2A78D6" text-anchor="middle">+0.7176</text><text x="450.0" y="114" font-size="12" fill="#2A78D6" text-anchor="middle">+0.0552</text><text x="590.0" y="114" font-size="12" fill="#2A78D6" text-anchor="middle">-1.6480</text><text x="730.0" y="114" font-size="12" fill="#2A78D6" text-anchor="middle">+0.8753</text><rect x="20" y="126" width="780" height="34" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="30" y="148" font-size="12" fill="#EB6834" text-anchor="start" font-weight="bold">BN((10W)u)</text><text x="310.0" y="148" font-size="12" fill="#EB6834" text-anchor="middle">+0.7176</text><text x="450.0" y="148" font-size="12" fill="#EB6834" text-anchor="middle">+0.0552</text><text x="590.0" y="148" font-size="12" fill="#EB6834" text-anchor="middle">-1.6480</text><text x="730.0" y="148" font-size="12" fill="#EB6834" text-anchor="middle">+0.8753</text><text x="30" y="190" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">가중치 기울기 (유한 차분, 가중치 셋):</text><text x="30" y="214" font-size="12" fill="#2A78D6" text-anchor="start">∂ℓ/∂W = (-3.1935, -1.2495, +3.7212)</text><text x="30" y="236" font-size="12" fill="#EB6834" text-anchor="start">∂ℓ/∂(10W) = (-0.3194, -0.1250, +0.3721)  — 정확히 1/10</text><text x="30" y="268" font-size="12" fill="#4E5964" text-anchor="start">논문의 읽기: 학습률이 커서 가중치가 자라면 그 기울기가 줄어 성장이 스스로 잦아든다. 그리고 u 로 가는 야코비안은 척도와 무관하다</text><text x="30" y="290" font-size="11" fill="#7A8590" text-anchor="start">이 예는 ε = 0 으로 계산했다. ε 이 있으면 척도가 아주 작을 때 등식이 조금 어긋난다</text></svg>
