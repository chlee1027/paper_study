<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보와 이상 탐지로 가는 곁가지"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 앞 편의 한계를 받아 다음 편에 넘긴다</text><rect x="25" y="60" width="170" height="60" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="110" y="85" font-size="13" fill="#4E5964" text-anchor="middle" font-weight="bold">LeCun 외 1998</text><text x="110" y="105" font-size="11" fill="#4E5964" text-anchor="middle">입력을 백색화하면 빠르다</text><line x1="197" y1="90" x2="223" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="225" y="60" width="170" height="60" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.6"/><text x="310" y="85" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">AlexNet 2012 (읽음)</text><text x="310" y="105" font-size="11" fill="#4E5964" text-anchor="middle">LRN · 드롭아웃 · ReLU</text><line x1="397" y1="90" x2="423" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="425" y="60" width="170" height="60" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="510" y="85" font-size="13" fill="#9A7B00" text-anchor="middle" font-weight="bold">BN 2015</text><text x="510" y="105" font-size="11" fill="#4E5964" text-anchor="middle">층 입력을 미니배치로 정규화</text><line x1="597" y1="90" x2="623" y2="90" stroke="#4E5964" stroke-width="1.5" marker-end="url(#ai)"/><rect x="625" y="60" width="170" height="60" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.6"/><text x="710" y="85" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">ResNet 2015</text><text x="710" y="105" font-size="11" fill="#4E5964" text-anchor="middle">잔차 연결 + 층마다 BN</text><text x="225" y="148" font-size="11" fill="#1C232C" text-anchor="middle">받은 것: 입력에만 하던 정규화를</text><text x="225" y="164" font-size="11" fill="#1C232C" text-anchor="middle">모든 층 안으로</text><text x="425" y="148" font-size="11" fill="#1C232C" text-anchor="middle">받은 것: LRN 을 빼고</text><text x="425" y="164" font-size="11" fill="#1C232C" text-anchor="middle">드롭아웃을 줄여도 된다</text><text x="625" y="148" font-size="11" fill="#1C232C" text-anchor="middle">넘긴 것: 미니배치에 기대는 통계</text><text x="625" y="164" font-size="11" fill="#1C232C" text-anchor="middle">(m 이 작으면? RNN 은?)</text><rect x="25" y="200" width="770" height="180" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="45" y="226" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">곁가지 — 이상 탐지로 가는 길 (논문은 이 쓰임을 적지 않는다. 내가 잇는 자리다)</text><text x="45" y="252" font-size="12" fill="#1C232C" text-anchor="start">PatchCore 같은 방법은 ImageNet 으로 미리 배운 합성곱 망(BN 포함)을 얼려 두고 중간 층 특징만 뽑는다</text><text x="45" y="276" font-size="12" fill="#1C232C" text-anchor="start">그때 BN 은 추론 모드 — 알고리즘 2 의 선형 변환이고, 통계는 ImageNet 의 E[x], Var[x] 로 고정되어 있다</text><text x="45" y="300" font-size="12" fill="#1C232C" text-anchor="start">그래서 특징의 척도가 「ImageNet 기준」으로 맞춰진다. 산업 이미지의 분포는 ImageNet 과 다르므로 정규화 뒤 평균이 0 이 아닐 수 있다</text><text x="45" y="324" font-size="12" fill="#4E5964" text-anchor="start">논문 결론의 「모집단 평균 · 분산만 다시 계산해 새 분포에 적응」이 이 자리의 물음이다 — 정상 이미지로 통계만 다시 재면?</text><text x="45" y="348" font-size="12" fill="#4E5964" text-anchor="start">그리고 학습 모드로 특징을 뽑으면 한 이미지의 특징이 같은 묶음의 다른 이미지에 달린다(그림 8) — 점수가 묶음에 따라 바뀐다</text><text x="45" y="372" font-size="11" fill="#7A8590" text-anchor="start">잴 방법은 이 노트의 돌려 볼 것 D 에 적었다</text></svg>
