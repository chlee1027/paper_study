<svg xmlns="http://www.w3.org/2000/svg" width="820" height="330" viewBox="0 0 820 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="BN 삽입 위치"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">BN 을 넣는 자리 — z = g(Wu + b) 를 z = g(BN(Wu)) 로 (논문 3.2절)</text><rect x="40" y="68" width="30" height="44" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.5"/><text x="55.0" y="95" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">u</text><line x1="72" y1="90" x2="100" y2="90" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="102" y="68" width="102" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="153.0" y="95" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">W u + b</text><line x1="206" y1="90" x2="234" y2="90" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="236" y="68" width="66" height="44" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.5"/><text x="269.0" y="95" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">g(·)</text><line x1="304" y1="90" x2="332" y2="90" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="334" y="68" width="30" height="44" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.5"/><text x="349.0" y="95" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">z</text><text x="396" y="95" font-size="12" fill="#4E5964" text-anchor="start">원래 층</text><rect x="40" y="148" width="30" height="44" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.5"/><text x="55.0" y="175" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">u</text><line x1="72" y1="170" x2="100" y2="170" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="102" y="148" width="54" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.5"/><text x="129.0" y="175" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">W u</text><line x1="158" y1="170" x2="186" y2="170" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="188" y="148" width="114" height="44" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.5"/><text x="245.0" y="175" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">BN: γ, β</text><line x1="304" y1="170" x2="332" y2="170" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="334" y="148" width="66" height="44" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.5"/><text x="367.0" y="175" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">g(·)</text><line x1="402" y1="170" x2="430" y2="170" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="432" y="148" width="30" height="44" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.5"/><text x="447.0" y="175" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">z</text><text x="494" y="175" font-size="12" fill="#1E8449" text-anchor="start">BN 층 — b 는 β 가 맡는다</text><rect x="40" y="220" width="760" height="90" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="55" y="244" font-size="11" fill="#1C232C" text-anchor="start">왜 u 가 아니라 Wu 인가 — u 는 앞 비선형의 출력이라 분포 모양이 학습 중에 바뀌기 쉬워 1 · 2차 적률만 맞춰서는 이동을 못 없앤다.</text><text x="55" y="268" font-size="11" fill="#1C232C" text-anchor="start">Wu + b 는 대칭이고 희소하지 않은, 「더 가우스 같은」 분포일 가능성이 크다(논문의 말).</text><text x="55" y="292" font-size="11" fill="#1C232C" text-anchor="start">b 를 빼는 이유 — 평균을 빼는 순간 b 의 효과가 지워진다. 작은 예: b = 3 을 더해도 μ_B 도 3 커져 x̂ 는 그대로다.</text></svg>
