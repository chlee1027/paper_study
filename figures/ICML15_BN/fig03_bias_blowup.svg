<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="기울기 밖 정규화에서 치우침 발산"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">논문 2절의 예를 숫자로 — 정규화의 b 의존을 기울기에서 빼면 b 는 자라고 손실은 그대로다 (값은 내가 고른 것)</text><line x1="70" y1="300" x2="470" y2="300" stroke="#4E5964" stroke-width="1"/><line x1="70" y1="300" x2="70" y2="70" stroke="#4E5964" stroke-width="1"/><text x="64" y="304.0" font-size="10" fill="#7A8590" text-anchor="end">0</text><text x="64" y="227.33333333333334" font-size="10" fill="#7A8590" text-anchor="end">4</text><text x="64" y="150.66666666666669" font-size="10" fill="#7A8590" text-anchor="end">8</text><text x="64" y="74.0" font-size="10" fill="#7A8590" text-anchor="end">12</text><text x="70.0" y="316" font-size="10" fill="#7A8590" text-anchor="middle">0</text><text x="170.0" y="316" font-size="10" fill="#7A8590" text-anchor="middle">10</text><text x="270.0" y="316" font-size="10" fill="#7A8590" text-anchor="middle">20</text><text x="370.0" y="316" font-size="10" fill="#7A8590" text-anchor="middle">30</text><text x="470.0" y="316" font-size="10" fill="#7A8590" text-anchor="middle">40</text><text x="270.0" y="336" font-size="12" fill="#4E5964" text-anchor="middle">기울기 걸음</text><path d="M70.0,300.0 L80.0,294.2 L90.0,288.3 L100.0,282.5 L110.0,276.6 L120.0,270.8 L130.0,264.9 L140.0,259.1 L150.0,253.2 L160.0,247.4 L170.0,241.5 L180.0,235.7 L190.0,229.9 L200.0,224.0 L210.0,218.2 L220.0,212.3 L230.0,206.5 L240.0,200.6 L250.0,194.8 L260.0,188.9 L270.0,183.1 L280.0,177.2 L290.0,171.4 L300.0,165.5 L310.0,159.7 L320.0,153.9 L330.0,148.0 L340.0,142.2 L350.0,136.3 L360.0,130.5 L370.0,124.6 L380.0,118.8 L390.0,112.9 L400.0,107.1 L410.0,101.2 L420.0,95.4 L430.0,89.6 L440.0,83.7 L450.0,77.9 L460.0,72.0 L470.0,66.2" fill="none" stroke="#C0392B" stroke-width="2.4"/><path d="M70.0,300.0 L80.0,300.0 L90.0,300.0 L100.0,300.0 L110.0,300.0 L120.0,300.0 L130.0,300.0 L140.0,300.0 L150.0,300.0 L160.0,300.0 L170.0,300.0 L180.0,300.0 L190.0,300.0 L200.0,300.0 L210.0,300.0 L220.0,300.0 L230.0,300.0 L240.0,300.0 L250.0,300.0 L260.0,300.0 L270.0,300.0 L280.0,300.0 L290.0,300.0 L300.0,300.0 L310.0,300.0 L320.0,300.0 L330.0,300.0 L340.0,300.0 L350.0,300.0 L360.0,300.0 L370.0,300.0 L380.0,300.0 L390.0,300.0 L400.0,300.0 L410.0,300.0 L420.0,300.0 L430.0,300.0 L440.0,300.0 L450.0,300.0 L460.0,300.0 L470.0,300.0" fill="none" stroke="#1E8449" stroke-width="2.4"/><path d="M70.0,222.7 L80.0,222.7 L90.0,222.7 L100.0,222.7 L110.0,222.7 L120.0,222.7 L130.0,222.7 L140.0,222.7 L150.0,222.7 L160.0,222.7 L170.0,222.7 L180.0,222.7 L190.0,222.7 L200.0,222.7 L210.0,222.7 L220.0,222.7 L230.0,222.7 L240.0,222.7 L250.0,222.7 L260.0,222.7 L270.0,222.7 L280.0,222.7 L290.0,222.7 L300.0,222.7 L310.0,222.7 L320.0,222.7 L330.0,222.7 L340.0,222.7 L350.0,222.7 L360.0,222.7 L370.0,222.7 L380.0,222.7 L390.0,222.7 L400.0,222.7 L410.0,222.7 L420.0,222.7 L430.0,222.7 L440.0,222.7 L450.0,222.7 L460.0,222.7" fill="none" stroke="#4E5964" stroke-width="1.6" stroke-dasharray="5 3"/><text x="450.0" y="67.85833333333343" font-size="12" fill="#C0392B" text-anchor="end" font-weight="bold">b (평균을 무시)</text><text x="450.0" y="292.0" font-size="12" fill="#1E8449" text-anchor="end" font-weight="bold">b (평균을 통과시킴) — 안 움직인다</text><text x="270.0" y="214.66249999999997" font-size="11" fill="#4E5964" text-anchor="middle">손실 4.035 — 40 걸음 내내 같다</text><rect x="500" y="60" width="300" height="250" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="515" y="84" font-size="11" fill="#1C232C" text-anchor="start">x = u + b,  x̂ = x − E[x]</text><text x="515" y="105" font-size="11" fill="#1C232C" text-anchor="start">기울기가 E[x] 가 b 에 달린 것을 모르면</text><text x="515" y="126" font-size="11" fill="#1C232C" text-anchor="start">Δb ∝ −∂ℓ/∂x̂ 만큼 b 를 옮긴다.</text><text x="515" y="147" font-size="11" fill="#1C232C" text-anchor="start">그런데 b 가 옮긴 만큼 E[x] 도 옮겨</text><text x="515" y="168" font-size="11" fill="#1C232C" text-anchor="start">x̂ 는 그대로 — 손실도 그대로다.</text><text x="515" y="189" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="515" y="210" font-size="11" fill="#4E5964" text-anchor="start">이 예: 걸음마다 b 가 +0.305</text><text x="515" y="231" font-size="11" fill="#4E5964" text-anchor="start">40 걸음 뒤 b = 12.20</text><text x="515" y="252" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="515" y="273" font-size="11" fill="#4E5964" text-anchor="start">논문: 척도까지 맞추면 더 나빠지고,</text><text x="515" y="294" font-size="11" fill="#4E5964" text-anchor="start">초기 실험에서 모델이 터졌다</text></svg>
