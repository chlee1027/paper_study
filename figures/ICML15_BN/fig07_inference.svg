<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="추론용 모집단 통계와 분산 보정"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="14" fill="#1C232C" text-anchor="start" font-weight="bold">추론은 모집단 통계로 — 분산은 m/(m−1) 로 고친다 (모집단 N(3, 2²), 미니배치 4,000 개씩, 내가 계산)</text><line x1="80" y1="300" x2="470" y2="300" stroke="#4E5964" stroke-width="1"/><line x1="80" y1="300.0" x2="470" y2="300.0" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="304.0" font-size="10" fill="#7A8590" text-anchor="end">0</text><line x1="80" y1="250.0" x2="470" y2="250.0" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="254.0" font-size="10" fill="#7A8590" text-anchor="end">1</text><line x1="80" y1="200.0" x2="470" y2="200.0" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="204.0" font-size="10" fill="#7A8590" text-anchor="end">2</text><line x1="80" y1="150.0" x2="470" y2="150.0" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="154.0" font-size="10" fill="#7A8590" text-anchor="end">3</text><line x1="80" y1="99.99999999999997" x2="470" y2="99.99999999999997" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="103.99999999999997" font-size="10" fill="#7A8590" text-anchor="end">4</text><line x1="80" y1="99.99999999999997" x2="470" y2="99.99999999999997" stroke="#1E8449" stroke-width="1.4" stroke-dasharray="5 3"/><text x="84" y="113.99999999999997" font-size="11" fill="#1E8449" text-anchor="start">참 분산 4</text><rect x="110" y="201.7" width="28" height="98.3" fill="#2A78D6"/><rect x="142" y="103.4" width="28" height="196.6" fill="#EB6834"/><text x="140" y="316" font-size="11" fill="#1C232C" text-anchor="middle">m = 2</text><text x="124" y="197.69225565405708" font-size="9" fill="#2A78D6" text-anchor="middle">1.97</text><text x="156" y="99.38451130811413" font-size="9" fill="#EB6834" text-anchor="middle">3.93</text><rect x="205" y="148.6" width="28" height="151.4" fill="#2A78D6"/><rect x="237" y="98.1" width="28" height="201.9" fill="#EB6834"/><text x="235" y="316" font-size="11" fill="#1C232C" text-anchor="middle">m = 4</text><text x="219" y="144.57061408593796" font-size="9" fill="#2A78D6" text-anchor="middle">3.03</text><text x="251" y="94.09415211458392" font-size="9" fill="#EB6834" text-anchor="middle">4.04</text><rect x="300" y="106.7" width="28" height="193.3" fill="#2A78D6"/><rect x="332" y="100.4" width="28" height="199.6" fill="#EB6834"/><text x="330" y="316" font-size="11" fill="#1C232C" text-anchor="middle">m = 32</text><text x="314" y="102.68460669671248" font-size="9" fill="#2A78D6" text-anchor="middle">3.87</text><text x="346" y="96.44862626757418" font-size="9" fill="#EB6834" text-anchor="middle">3.99</text><rect x="395" y="102.4" width="28" height="197.6" fill="#2A78D6"/><rect x="427" y="99.1" width="28" height="200.9" fill="#EB6834"/><text x="425" y="316" font-size="11" fill="#1C232C" text-anchor="middle">m = 60</text><text x="409" y="98.41976920510194" font-size="9" fill="#2A78D6" text-anchor="middle">3.95</text><text x="441" y="95.07095173400197" font-size="9" fill="#EB6834" text-anchor="middle">4.02</text><rect x="90" y="332" width="12" height="12" fill="#2A78D6"/><text x="108" y="343" font-size="11" fill="#1C232C" text-anchor="start">E_B[σ²_B] (m 으로 나눈 미니배치 분산의 평균)</text><rect x="90" y="352" width="12" height="12" fill="#EB6834"/><text x="108" y="363" font-size="11" fill="#1C232C" text-anchor="start">× m/(m−1) — 알고리즘 2 의 10 행</text><rect x="500" y="60" width="300" height="260" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="515" y="84" font-size="11" fill="#1C232C" text-anchor="start">m = 2 이면 미니배치 분산이 참 분산의</text><text x="515" y="104" font-size="11" fill="#1C232C" text-anchor="start">49% 다. m = 60 이면 99%.</text><text x="515" y="124" font-size="11" fill="#1C232C" text-anchor="start"></text><text x="515" y="144" font-size="11" fill="#1C232C" text-anchor="start">알고리즘 2 의 11 행: 통계를 얼리면</text><text x="515" y="164" font-size="11" fill="#1C232C" text-anchor="start">BN 은 선형 변환 하나로 합쳐진다.</text><text x="515" y="184" font-size="11" fill="#1C232C" text-anchor="start">y = γ/√(Var+ε) · x + (β − γE/√(Var+ε))</text><text x="515" y="204" font-size="11" fill="#1C232C" text-anchor="start"></text><text x="515" y="224" font-size="11" fill="#1C232C" text-anchor="start">예: γ=1.5, β=0.5, E=3, Var=4 이면</text><text x="515" y="244" font-size="11" fill="#1C232C" text-anchor="start">y = 0.7500 · x -1.7500</text><text x="515" y="264" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="515" y="284" font-size="11" fill="#4E5964" text-anchor="start">앞의 합성곱 가중치에 곱해 넣을 수 있어</text><text x="515" y="304" font-size="11" fill="#4E5964" text-anchor="start">추론 비용이 사실상 0 이 된다 (내 읽기)</text></svg>
