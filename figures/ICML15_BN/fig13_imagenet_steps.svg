<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="ImageNet 걸음 수 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">논문 그림 3 의 표 — Inception 의 최고 정확도 72.2% 에 닿기까지의 걸음 수 (배수는 내가 나눈 값)</text><line x1="180.0" y1="60" x2="180.0" y2="300" stroke="#CFD6D3" stroke-width="1"/><text x="180.0" y="316" font-size="10" fill="#7A8590" text-anchor="middle">0 M</text><line x1="298.75" y1="60" x2="298.75" y2="300" stroke="#CFD6D3" stroke-width="1"/><text x="298.75" y="316" font-size="10" fill="#7A8590" text-anchor="middle">10 M</text><line x1="417.5" y1="60" x2="417.5" y2="300" stroke="#CFD6D3" stroke-width="1"/><text x="417.5" y="316" font-size="10" fill="#7A8590" text-anchor="middle">20 M</text><line x1="536.25" y1="60" x2="536.25" y2="300" stroke="#CFD6D3" stroke-width="1"/><text x="536.25" y="316" font-size="10" fill="#7A8590" text-anchor="middle">30 M</text><text x="170" y="85" font-size="12" fill="#2A78D6" text-anchor="end" font-weight="bold">Inception</text><rect x="180" y="69" width="368.1" height="22" rx="3" fill="#2A78D6"/><text x="542.125" y="85" font-size="11" fill="#FFFFFF" text-anchor="end" font-weight="bold">31.0 M (기준)</text><text x="170" y="131" font-size="12" fill="#1BAF7A" text-anchor="end" font-weight="bold">BN-Baseline</text><rect x="180" y="115" width="157.9" height="22" rx="3" fill="#1BAF7A"/><text x="343.9375" y="131" font-size="11" fill="#1C232C" text-anchor="start">13.3 M  (2.3 배)</text><text x="170" y="177" font-size="12" fill="#EB6834" text-anchor="end" font-weight="bold">BN-x5</text><rect x="180" y="161" width="24.9" height="22" rx="3" fill="#EB6834"/><text x="210.9375" y="177" font-size="11" fill="#1C232C" text-anchor="start">2.1 M  (14.8 배)</text><text x="170" y="223" font-size="12" fill="#C0392B" text-anchor="end" font-weight="bold">BN-x30</text><rect x="180" y="207" width="32.1" height="22" rx="3" fill="#C0392B"/><text x="218.0625" y="223" font-size="11" fill="#1C232C" text-anchor="start">2.7 M  (11.5 배)</text><text x="170" y="269" font-size="12" fill="#9A7B00" text-anchor="end" font-weight="bold">BN-x5-Sigmoid</text><text x="186" y="269" font-size="11" fill="#C0392B" text-anchor="start">72.2% 에 닿지 못함</text><rect x="590" y="60" width="210" height="250" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="605" y="82" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">최고 정확도 · 첫 학습률</text><text x="605" y="110" font-size="11" fill="#2A78D6" text-anchor="start" font-weight="bold">Inception</text><text x="785" y="110" font-size="11" fill="#1C232C" text-anchor="end">72.2% · 0.0015</text><text x="605" y="140" font-size="11" fill="#1BAF7A" text-anchor="start" font-weight="bold">BN-Baseline</text><text x="785" y="140" font-size="11" fill="#1C232C" text-anchor="end">72.7% · 0.0015</text><text x="605" y="170" font-size="11" fill="#EB6834" text-anchor="start" font-weight="bold">BN-x5</text><text x="785" y="170" font-size="11" fill="#1C232C" text-anchor="end">73.0% · 0.0075</text><text x="605" y="200" font-size="11" fill="#C0392B" text-anchor="start" font-weight="bold">BN-x30</text><text x="785" y="200" font-size="11" fill="#1C232C" text-anchor="end">74.8% · 0.045</text><text x="605" y="230" font-size="11" fill="#9A7B00" text-anchor="start" font-weight="bold">BN-x5-Sigmoid</text><text x="785" y="230" font-size="11" fill="#1C232C" text-anchor="end">69.8% · 0.0075</text><text x="605" y="268" font-size="10" fill="#4E5964" text-anchor="start">BN 없는 Inception 을 시그모이드로</text><text x="605" y="284" font-size="10" fill="#4E5964" text-anchor="start">배우면 1/1000(우연 수준)에 머문다</text><text x="410" y="344" font-size="12" fill="#1C232C" text-anchor="middle">「14 배」는 31.0 / 2.1 = 14.8. 「7% 의 걸음」은 2.1 / 31.0 = 6.8%. BN 만 넣은 것(BN-Baseline)은 2.33 배다</text><text x="410" y="366" font-size="12" fill="#C0392B" text-anchor="middle">BN-x5 · BN-x30 은 BN 에 일곱 가지 변경을 더한 것이다(그림 14) — 14 배는 BN 하나의 몫이 아니다</text><text x="410" y="388" font-size="11" fill="#7A8590" text-anchor="middle">BN-x30 은 처음엔 BN-x5 보다 느리지만 더 높이 간다 — 논문: 「직관에 어긋나고 더 조사해야 한다」</text></svg>
