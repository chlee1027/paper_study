<svg xmlns="http://www.w3.org/2000/svg" width="820" height="300" viewBox="0 0 820 300" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="미니배치에 따른 정규화 값 차이"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">같은 예시 x = 2 가 어느 미니배치에 들어가느냐에 따라 다른 값으로 정규화된다 (값은 내가 고른 것)</text><text x="30" y="75" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">미니배치 A</text><rect x="140" y="54" width="44" height="30" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="162" y="74" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">2</text><rect x="190" y="54" width="44" height="30" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="212" y="74" font-size="12" fill="#1C232C" text-anchor="middle">1</text><rect x="240" y="54" width="44" height="30" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="262" y="74" font-size="12" fill="#1C232C" text-anchor="middle">4</text><rect x="290" y="54" width="44" height="30" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="312" y="74" font-size="12" fill="#1C232C" text-anchor="middle">9</text><line x1="345" y1="70" x2="395" y2="70" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="405" y="75" font-size="14" fill="#EB6834" text-anchor="start" font-weight="bold">x̂ = -0.649</text><text x="30" y="135" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">미니배치 B</text><rect x="140" y="114" width="44" height="30" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="162" y="134" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">2</text><rect x="190" y="114" width="44" height="30" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="212" y="134" font-size="12" fill="#1C232C" text-anchor="middle">2.5</text><rect x="240" y="114" width="44" height="30" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="262" y="134" font-size="12" fill="#1C232C" text-anchor="middle">3</text><rect x="290" y="114" width="44" height="30" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="312" y="134" font-size="12" fill="#1C232C" text-anchor="middle">1.5</text><line x1="345" y1="130" x2="395" y2="130" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="405" y="135" font-size="14" fill="#EB6834" text-anchor="start" font-weight="bold">x̂ = -0.447</text><text x="30" y="195" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">미니배치 C</text><rect x="140" y="174" width="44" height="30" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="162" y="194" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">2</text><rect x="190" y="174" width="44" height="30" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="212" y="194" font-size="12" fill="#1C232C" text-anchor="middle">0</text><rect x="240" y="174" width="44" height="30" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="262" y="194" font-size="12" fill="#1C232C" text-anchor="middle">0.5</text><rect x="290" y="174" width="44" height="30" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="312" y="194" font-size="12" fill="#1C232C" text-anchor="middle">1</text><line x1="345" y1="190" x2="395" y2="190" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="405" y="195" font-size="14" fill="#EB6834" text-anchor="start" font-weight="bold">x̂ = +1.521</text><rect x="560" y="50" width="240" height="190" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="575" y="74" font-size="11" fill="#1C232C" text-anchor="start">논문 4.2.1: 한 예시의 활성이</text><text x="575" y="93" font-size="11" fill="#1C232C" text-anchor="start">같은 미니배치에 무작위로 뽑힌</text><text x="575" y="112" font-size="11" fill="#1C232C" text-anchor="start">다른 예시들에 영향을 받으므로</text><text x="575" y="131" font-size="11" fill="#1C232C" text-anchor="start">드롭아웃과 비슷한 정규화 효과를</text><text x="575" y="150" font-size="11" fill="#1C232C" text-anchor="start">낼 것이라고 추측한다(conjecture).</text><text x="575" y="169" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="575" y="188" font-size="11" fill="#4E5964" text-anchor="start">섞기를 철저히 해 같은 예시끼리</text><text x="575" y="207" font-size="11" fill="#4E5964" text-anchor="start">늘 같이 묶이지 않게 하자 검증</text><text x="575" y="226" font-size="11" fill="#4E5964" text-anchor="start">정확도가 약 1% 올랐다고 적는다</text><text x="410" y="282" font-size="11" fill="#7A8590" text-anchor="middle">그래서 학습 중의 BN 출력은 입력 하나만의 함수가 아니다 — 추론에서 모집단 통계로 바꾸는 이유가 이것이다(그림 7)</text></svg>
