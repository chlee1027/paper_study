">치솟았다 0.9 로 떨어진 뒤 오른다</text><text x="692" y="250" font-size="11" fill="#4E5964" text-anchor="middle">중앙값은 0 에 붙어 있다.</text><text x="692" y="268" font-size="11" fill="#C0392B" text-anchor="middle">85−15 폭은 2.5 → 3.9 로 넓어진다</text><text x="447" y="300" font-size="11" fill="#7A8590" text-anchor="middle">(b)(c) 는 가로축 눈금이 없다 — 읽기 ±0.2</text><text x="410" y="376" font-size="11" fill="#7A8590" text-anchor="middle">(c) 의 값은 γ, β 를 거친 뒤의 시그모이드 입력이다. 평균은 고정되지만 폭은 학습 중에 바뀐다 — 「분포가 더 안정적」은 이 두 줄의 비교다</text></svg>
