<svg xmlns="http://www.w3.org/2000/svg" width="820" height="400" viewBox="0 0 820 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="BN-x5 에 함께 들어간 변경 목록"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">논문 4.2.1 — BN-x5 · BN-x30 은 BN 에 일곱 가지를 함께 바꾼 모델이다. 하나씩 뺀 표는 없다</text><rect x="20" y="55" width="780" height="32" rx="4" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="76" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">바꾼 것</text><text x="330.0" y="76" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">얼마나</text><text x="620.0" y="76" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">논문이 보인 근거</text><rect x="20" y="87" width="780" height="36" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="110" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">학습률 올리기</text><text x="330.0" y="110" font-size="12" fill="#1C232C" text-anchor="middle">×5 (BN-x5), ×30 (BN-x30)</text><text x="620.0" y="110" font-size="12" fill="#1E8449" text-anchor="middle">그림 3 의 표로 BN-x5 대 BN-Baseline</text><rect x="20" y="123" width="780" height="36" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="146" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">드롭아웃 빼기</text><text x="330.0" y="146" font-size="12" fill="#1C232C" text-anchor="middle">40% → 0</text><text x="620.0" y="146" font-size="12" fill="#C0392B" text-anchor="middle">「검증 정확도가 더 높았다」 — 수치 없음</text><rect x="20" y="159" width="780" height="36" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="182" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">더 철저히 섞기</text><text x="330.0" y="182" font-size="12" fill="#1C232C" text-anchor="middle">샤드 안에서 섞기</text><text x="620.0" y="182" font-size="12" fill="#C0392B" text-anchor="middle">「약 1% 향상」 — 표 없음</text><rect x="20" y="195" width="780" height="36" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="218" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">L2 가중치 벌점 줄이기</text><text x="330.0" y="218" font-size="12" fill="#1C232C" text-anchor="middle">1/5 로</text><text x="620.0" y="218" font-size="12" fill="#C0392B" text-anchor="middle">「검증 정확도가 좋아졌다」 — 수치 없음</text><rect x="20" y="231" width="780" height="36" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="254" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">학습률 감쇠 빠르게</text><text x="330.0" y="254" font-size="12" fill="#1C232C" text-anchor="middle">6 배 빠르게</text><text x="620.0" y="254" font-size="12" fill="#4E5964" text-anchor="middle">따로 재지 않음</text><rect x="20" y="267" width="780" height="36" rx="0" fill="#ECEFEC" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="290" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">LRN 빼기</text><text x="330.0" y="290" font-size="12" fill="#1C232C" text-anchor="middle">국소 응답 정규화 제거</text><text x="620.0" y="290" font-size="12" fill="#C0392B" text-anchor="middle">「필요 없었다」 — 수치 없음</text><rect x="20" y="303" width="780" height="36" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="120.0" y="326" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="bold">사진 왜곡 줄이기</text><text x="330.0" y="326" font-size="12" fill="#1C232C" text-anchor="middle">밝기·색 왜곡을 덜</text><text x="620.0" y="326" font-size="12" fill="#4E5964" text-anchor="middle">따로 재지 않음</text><text x="410" y="372" font-size="11" fill="#4E5964" text-anchor="middle">초록의 「14 배 적은 걸음」과 「드롭아웃이 필요 없어질 때가 있다」는 이 묶음 전체의 결과다. 어느 줄이 얼마를 냈는지는 이 논문에서 가를 수 없다</text><text x="410" y="392" font-size="11" fill="#7A8590" text-anchor="middle">색: 초록 = 표로 확인 가능, 빨강 = 문장만 있다, 회색 = 따로 재지 않았다 (내가 가른 것)</text></svg>
