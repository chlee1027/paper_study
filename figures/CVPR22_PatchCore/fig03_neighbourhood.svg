-width="1.2"/><rect x="184" y="168" width="34" height="34" rx="2" fill="#F2DED2" stroke="#EB6834" stroke-width="1.2"/><rect x="220" y="168" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="256" y="168" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="40" y="204" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="76" y="204" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="112" y="204" width="34" height="34" rx="2" fill="#F2DED2" stroke="#EB6834" stroke-width="1.2"/><rect x="148" y="204" width="34" height="34" rx="2" fill="#F2DED2" stroke="#EB6834" stroke-width="1.2"/><rect x="184" y="204" width="34" height="34" rx="2" fill="#F2DED2" stroke="#EB6834" stroke-width="1.2"/><rect x="220" y="204" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="256" y="204" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="40" y="240" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="76" y="240" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="112" y="240" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="148" y="240" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="184" y="240" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="220" y="240" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="256" y="240" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="40" y="276" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="76" y="276" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="112" y="276" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="148" y="276" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="184" y="276" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="220" y="276" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="256" y="276" width="34" height="34" rx="2" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><rect x="154" y="174" width="22" height="22" rx="2" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="165.0" y="334" font-size="11" fill="#4E5964" text-anchor="middle">특징 지도 φ(i, j): 칸마다 c* 차원 벡터</text><line x1="310.0" y1="186.0" x2="380.0" y2="186.0" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><text x="345" y="176" font-size="11" fill="#4E5964" text-anchor="middle" font-style="italic">f_agg</text><text x="345" y="206" font-size="10" fill="#4E5964" text-anchor="middle">= 평균</text><rect x="395" y="150" width="70" height="70" rx="6" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="430" y="190" font-size="11" fill="#FFFFFF" text-anchor="middle" font-weight="bold">(h, w)</text><text x="430" y="240" font-size="10" fill="#4E5964" text-anchor="middle">같은 (h, w) 에 놓는다</text><rect x="500" y="60" width="320" height="240" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="512" y="84" font-size="11" fill="#1C232C" text-anchor="start">식 (1): N_p(h,w) = {(a,b): |a−h| ≤ ⌊p/2⌋, |b−w| ≤ ⌊p/2⌋}</text><text x="512" y="102" font-size="11" fill="#4E5964" text-anchor="start">p = 3 이면 9 칸, p = 5 이면 25 칸.</text><text x="512" y="120" font-size="11" fill="#1C232C" text-anchor="start">식 (3): 모든 (h, w) 에서 만들고 보폭 s = 1 이라</text><text x="512" y="138" font-size="11" fill="#4E5964" text-anchor="start">격자 크기가 그대로다 (28x28 → 28x28).</text><text x="512" y="156" font-size="11" fill="#1C232C" text-anchor="start"></text><text x="512" y="174" font-size="11" fill="#1C232C" text-anchor="start">왜: 수용장을 넓히되 더 깊은 단계로 가지 않는다.</text><text x="512" y="192" font-size="11" fill="#4E5964" text-anchor="start">깊이 가면 ImageNet 쪽으로 치우치고 해상도가 준다.</text><text x="512" y="210" font-size="11" fill="#1C232C" text-anchor="start"></text><text x="512" y="228" font-size="11" fill="#C0392B" text-anchor="start">읽을 때 걸리는 자리: 식 (1) 은 홀수 p 를 전제한다</text><text x="512" y="246" font-size="11" fill="#C0392B" text-anchor="start">('uneven patchsizes'). 그런데 그림 4 는 p = 2 · 4 · 6</text><text x="512" y="264" font-size="11" fill="#C0392B" text-anchor="start">값도 그린다. 식 (1) 대로면 p = 2 와 3 이 같은 9 칸인데</text><text x="512" y="282" font-size="11" fill="#C0392B" text-anchor="start">그림 4 의 값은 98.48 대 99.11 로 다르다.</text><text x="20" y="350" font-size="11" fill="#7A8590" text-anchor="start">작은 예시: 28x28 지도의 가장자리 칸 (1, 1) 은 이웃이 지도 밖으로 나간다. 논문은 가장자리 처리(채우기)를 적지 않았다.</text><text x="20" y="370" font-size="11" fill="#7A8590" text-anchor="start">'적응 평균 풀링(adaptive average pooling)' 이 공간 이웃 평균인지 채널 쪽 차원 맞추기인지도 문장 하나로는 갈리지 않는다(24절).</text></svg>
