<svg xmlns="http://www.w3.org/2000/svg" width="840" height="400" viewBox="0 0 840 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="PatchCore 의 계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">계보 — 사전학습 특징 + 정상 모음 + 최근접 거리</text><rect x="30" y="44" width="360" height="52" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="210" y="65" font-size="12" fill="#4E5964" text-anchor="middle" font-weight="bold">ResNet (2015) · WRN (2016)</text><text x="210" y="85" font-size="11" fill="#4E5964" text-anchor="middle">얼려 쓰는 특징 추출기 (WRN-50-2)</text><rect x="30" y="124" width="360" height="52" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.6"/><text x="210" y="145" font-size="12" fill="#2A78D6" text-anchor="middle" font-weight="bold">DN2 (Bergman 외, 2020)</text><text x="210" y="165" font-size="11" fill="#4E5964" text-anchor="middle">이미지 전체 특징의 kNN — 마지막 단계</text><rect x="30" y="204" width="360" height="52" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.6"/><text x="210" y="225" font-size="12" fill="#2A78D6" text-anchor="middle" font-weight="bold">SPADE (Cohen &amp; Hoshen, 2020)</text><text x="210" y="245" font-size="11" fill="#4E5964" text-anchor="middle">여러 단계 뱅크, 이미지 kNN 으로 먼저 고름</text><rect x="30" y="284" width="360" height="52" rx="6" fill="#F6F7F5" stroke="#2A78D6" stroke-width="1.6"/><text x="210" y="305" font-size="12" fill="#2A78D6" text-anchor="middle" font-weight="bold">PaDiM (Defard 외, 2020)</text><text x="210" y="325" font-size="11" fill="#4E5964" text-anchor="middle">위치마다 가우스 하나, 마할라노비스</text><rect x="440" y="124" width="360" height="52" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.6"/><text x="620" y="145" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">코어셋 (Agarwal 외 2004 ·</text><text x="620" y="165" font-size="11" fill="#4E5964" text-anchor="middle">Sener &amp; Savarese 2018 · Sinha 외 2020)</text><rect x="440" y="244" width="360" height="52" rx="6" fill="#F6F7F5" stroke="#EB6834" stroke-width="1.6"/><text x="620" y="265" font-size="12" fill="#EB6834" text-anchor="middle" font-weight="bold">PatchCore (2021-06 arXiv, 2022 CVPR)</text><text x="620" y="285" font-size="11" fill="#4E5964" text-anchor="middle">조각 뱅크 하나 + 탐욕 코어셋 + 재가중</text><path d="M390,70 C415,70 415,270 438,270" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M390,150 C415,150 415,270 438,270" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M390,230 C415,230 415,270 438,270" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><path d="M390,310 C415,310 415,270 438,270" fill="none" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="620.0" y1="176.0" x2="620.0" y2="242.0" stroke="#9A7B00" stroke-width="1.4" marker-end="url(#ac)"/><text x="20" y="372" font-size="10" fill="#7A8590" text-anchor="start">왼쪽 넷과 코어셋 셋은 이 논문의 참고 문헌 [4] [10] [14] [23] [57] [1] [48] [49]. 탐욕 max-min 뽑기의 원 출처(Gonzalez 1985)는</text><text x="20" y="388" font-size="10" fill="#7A8590" text-anchor="start">이 논문의 참고 문헌에 없다 — 노트 참고 문헌 절에 따로 적었다. 이 저장소의 노트로는 ResNet · Wide ResNet 이 앞자리다.</text></svg>
