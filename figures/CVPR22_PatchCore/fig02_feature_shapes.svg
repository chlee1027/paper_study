<svg xmlns="http://www.w3.org/2000/svg" width="840" height="420" viewBox="0 0 840 420" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="WRN-50-2 단계별 출력 크기와 조각 수"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">224 입력에서 WRN-50-2 의 단계 출력 — 쓰는 것은 layer2 와 layer3 (내 셈)</text><rect x="46.39999999999999" y="101.39999999999999" width="147.20000000000002" height="147.20000000000002" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1"/><text x="120" y="62" font-size="13" fill="#7A8590" text-anchor="middle" font-weight="bold">layer1</text><text x="120" y="315" font-size="12" fill="#1C232C" text-anchor="middle">256 채널 x 56x56</text><text x="120" y="335" font-size="11" fill="#4E5964" text-anchor="middle">보폭 누적 4 px</text><rect x="277.2" y="132.2" width="85.60000000000001" height="85.60000000000001" rx="6" fill="#F2DED2" stroke="#EB6834" stroke-width="2"/><text x="320" y="62" font-size="13" fill="#EB6834" text-anchor="middle" font-weight="bold">layer2</text><text x="320" y="315" font-size="12" fill="#1C232C" text-anchor="middle">512 채널 x 28x28</text><text x="320" y="335" font-size="11" fill="#4E5964" text-anchor="middle">보폭 누적 8 px</text><rect x="492.6" y="147.6" width="54.800000000000004" height="54.800000000000004" rx="6" fill="#F2DED2" stroke="#EB6834" stroke-width="2"/><text x="520" y="62" font-size="13" fill="#EB6834" text-anchor="middle" font-weight="bold">layer3</text><text x="520" y="315" font-size="12" fill="#1C232C" text-anchor="middle">1,024 채널 x 14x14</text><text x="520" y="335" font-size="11" fill="#4E5964" text-anchor="middle">보폭 누적 16 px</text><rect x="700.3" y="155.3" width="39.400000000000006" height="39.400000000000006" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1"/><text x="720" y="62" font-size="13" fill="#7A8590" text-anchor="middle" font-weight="bold">layer4</text><text x="720" y="315" font-size="12" fill="#1C232C" text-anchor="middle">2,048 채널 x 7x7</text><text x="720" y="335" font-size="11" fill="#4E5964" text-anchor="middle">보폭 누적 32 px</text><line x1="490.0" y1="175.0" x2="368.0" y2="175.0" stroke="#EB6834" stroke-width="1.6" marker-end="url(#ar)"/><text x="429" y="166" font-size="10" fill="#EB6834" text-anchor="middle">양선형으로 28x28 로 늘림</text><text x="30" y="365" font-size="11" fill="#1C232C" text-anchor="start">조각 수 = layer2 격자 = 28 x 28 = 784.  이어 붙이면 512 + 1,024 = 1,536 차원 — 논문은 이 숫자를 적지 않고 '미리 정한 차원 d' 라고만 적는다.</text><text x="30" y="390" font-size="11" fill="#4E5964" text-anchor="start">입력 크기별 조각 수 (layer2 격자):  224 → 784 · 280 → 1,225 · 320 → 1,600 · 360 → 2,025 · 448 → 3,136 · 576 → 5,184</text><text x="30" y="410" font-size="10" fill="#7A8590" text-anchor="start">layer1 · layer4 는 그림 4 의 단계 실험에서만 쓴다. 단계 번호 1 ~ 4 는 논문의 j 와 같다(공간 해상도가 바뀌는 블록 묶음의 끝 출력).</text></svg>
