oke-width="1"/><text x="64" y="214.00000000000003" font-size="10" fill="#7A8590" text-anchor="end">0.7</text><line x1="70.0" y1="160.0" x2="470.0" y2="160.0" stroke="#CFD6D3" stroke-width="1"/><text x="64" y="163.99999999999997" font-size="10" fill="#7A8590" text-anchor="end">0.8</text><line x1="70.0" y1="110.0" x2="470.0" y2="110.0" stroke="#CFD6D3" stroke-width="1"/><text x="64" y="114.0" font-size="10" fill="#7A8590" text-anchor="end">0.9</text><line x1="70.0" y1="60.0" x2="470.0" y2="60.0" stroke="#CFD6D3" stroke-width="1"/><text x="64" y="64.0" font-size="10" fill="#7A8590" text-anchor="end">1.0</text><text x="70.0" y="378" font-size="10" fill="#7A8590" text-anchor="middle">0</text><text x="150.0" y="378" font-size="10" fill="#7A8590" text-anchor="middle">1</text><text x="230.0" y="378" font-size="10" fill="#7A8590" text-anchor="middle">2</text><text x="310.0" y="378" font-size="10" fill="#7A8590" text-anchor="middle">3</text><text x="390.0" y="378" font-size="10" fill="#7A8590" text-anchor="middle">4</text><text x="470.0" y="378" font-size="10" fill="#7A8590" text-anchor="middle">5</text><text x="270.0" y="398" font-size="11" fill="#4E5964" text-anchor="middle">Δ = (m* 의 다른 이웃까지 시험 조각의 거리) − d*   (특징 공간의 L2 거리 그대로)</text><path d="M70.0,310.0 L74.0,303.8 L78.0,297.5 L82.0,291.3 L86.0,285.1 L90.0,278.9 L94.0,272.8 L98.0,266.7 L102.0,260.7 L106.0,254.7 L110.0,248.8 L114.0,242.9 L118.0,237.2 L122.0,231.5 L126.0,225.9 L130.0,220.4 L134.0,215.0 L138.0,209.7 L142.0,204.5 L146.0,199.4 L150.0,194.5 L154.0,189.6 L158.0,184.9 L162.0,180.2 L166.0,175.7 L170.0,171.4 L174.0,167.1 L178.0,162.9 L182.0,158.9 L186.0,155.0 L190.0,151.2 L194.0,147.5 L198.0,144.0 L202.0,140.6 L206.0,137.2 L210.0,134.0 L214.0,130.9 L218.0,127.9 L222.0,125.1 L226.0,122.3 L230.0,119.6 L234.0,117.0 L238.0,114.5 L242.0,112.2 L246.0,109.9 L250.0,107.7 L254.0,105.6 L258.0,103.5 L262.0,101.6 L266.0,99.7 L270.0,97.9 L274.0,96.2 L278.0,94.6 L282.0,93.0 L286.0,91.5 L290.0,90.0 L294.0,88.7 L298.0,87.3 L302.0,