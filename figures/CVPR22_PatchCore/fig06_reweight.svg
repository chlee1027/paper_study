6.0,68.7 L230.0,68.3 L234.0,67.9 L238.0,67.5 L242.0,67.2 L246.0,66.8 L250.0,66.5 L254.0,66.2 L258.0,65.9 L262.0,65.6 L266.0,65.3 L270.0,65.1 L274.0,64.8 L278.0,64.6 L282.0,64.4 L286.0,64.2 L290.0,64.0 L294.0,63.8 L298.0,63.6 L302.0,63.4 L306.0,63.2 L310.0,63.1 L314.0,62.9 L318.0,62.8 L322.0,62.7 L326.0,62.5 L330.0,62.4 L334.0,62.3 L338.0,62.2 L342.0,62.1 L346.0,62.0 L350.0,61.9 L354.0,61.8 L358.0,61.7 L362.0,61.6 L366.0,61.5 L370.0,61.5 L374.0,61.4 L378.0,61.3 L382.0,61.3 L386.0,61.2 L390.0,61.1 L394.0,61.1 L398.0,61.0 L402.0,61.0 L406.0,60.9 L410.0,60.9 L414.0,60.8 L418.0,60.8 L422.0,60.8 L426.0,60.7 L430.0,60.7 L434.0,60.7 L438.0,60.6 L442.0,60.6 L446.0,60.6 L450.0,60.5 L454.0,60.5 L458.0,60.5 L462.0,60.5 L466.0,60.4 L470.0,60.4" fill="none" stroke="#8A939B" stroke-width="2.2"/><text x="76.0" y="109.55555555555557" font-size="10" fill="#8A939B" text-anchor="start" font-weight="bold">b = 9 (최소 0.889)</text><rect x="500" y="60" width="320" height="300" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="512" y="84" font-size="11" fill="#1C232C" text-anchor="start">식 (7):  s = (1 − e^{d*} / Σ_{m∈N_b(m*)} e^{d_m}) · s*</text><text x="512" y="105" font-size="11" fill="#4E5964" text-anchor="start">d_m = ||m_test,* − m||,  d* = 가장 가까운 거리</text><text x="512" y="126" font-size="11" fill="#1C232C" text-anchor="start"></text><text x="512" y="147" font-size="11" fill="#1C232C" text-anchor="start">m* 가 시험 조각에 가장 가까우므로 모든 d_m ≥ d*.</text><text x="512" y="168" font-size="11" fill="#1C232C" text-anchor="start">그래서 분수는 1/b 이하이고 w ≥ 1 − 1/b.</text><text x="512" y="189" font-size="11" fill="#1C232C" text-anchor="start"></text><text x="512" y="210" font-size="11" fill="#1C232C" text-anchor="start">뜻: 재가중은 s* 를 많아야 b/(b−1) 배까지만</text><text x="512" y="231" font-size="11" fill="#4E5964" text-anchor="start">갈라 놓는다. b = 3 이면 1.5 배.</text><text x="512" y="252" font-size="11" fill="#1C232C" text-anchor="start"></text><text x="512" y="273" font-size="11" fill="#C0392B" text-anchor="start">지수가 거리 그 자체라 축척을 탄다.</text><text x="512" y="294" font-size="11" fill="#C0392B" text-anchor="start">거리 차이 Δ 가 3 이면 b = 3 에서 w = 0.976.</text><text x="512" y="315" font-size="11" fill="#C0392B" text-anchor="start">논문은 b 의 값을 적지 않았다.</text><text x="20" y="428" font-size="10" fill="#7A8590" text-anchor="start">곡선은 'm* 가 N_b(m*) 안에 들고 나머지 b−1 개가 모두 d* + Δ 에 있는' 경우다. 이웃이 제각각이면 곡선 사이 어딘가에 놓인다.</text></svg>
