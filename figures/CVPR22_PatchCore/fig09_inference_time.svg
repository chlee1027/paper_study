oke="#CFD6D3" stroke-width="1"/><text x="74" y="229.71428571428572" font-size="10" fill="#7A8590" text-anchor="end">0.3</text><line x1="80.0" y1="184.3" x2="470.0" y2="184.3" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="188.28571428571425" font-size="10" fill="#7A8590" text-anchor="end">0.4</text><line x1="80.0" y1="142.9" x2="470.0" y2="142.9" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="146.85714285714286" font-size="10" fill="#7A8590" text-anchor="end">0.5</text><line x1="80.0" y1="101.4" x2="470.0" y2="101.4" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="105.42857142857142" font-size="10" fill="#7A8590" text-anchor="end">0.6</text><line x1="80.0" y1="60.0" x2="470.0" y2="60.0" stroke="#CFD6D3" stroke-width="1"/><text x="74" y="64.0" font-size="10" fill="#7A8590" text-anchor="end">0.7</text><text x="80" y="368" font-size="10" fill="#7A8590" text-anchor="middle">0%</text><text x="177.5" y="368" font-size="10" fill="#7A8590" text-anchor="middle">25%</text><text x="275.0" y="368" font-size="10" fill="#7A8590" text-anchor="middle">50%</text><text x="372.5" y="368" font-size="10" fill="#7A8590" text-anchor="middle">75%</text><text x="470.0" y="368" font-size="10" fill="#7A8590" text-anchor="middle">100%</text><text x="275.0" y="388" font-size="11" fill="#4E5964" text-anchor="middle">남긴 뱅크 비율</text><text x="34" y="50" font-size="10" fill="#4E5964" text-anchor="start">초 / 이미지</text><line x1="80.0" y1="279.1" x2="470.0" y2="101.2" stroke="#EB6834" stroke-width="1.6" stroke-dasharray="6,4"/><line x1="80.0" y1="279.1" x2="470.0" y2="279.1" stroke="#7A8590" stroke-width="1" stroke-dasharray="2,3"/><text x="294.5" y="295.11111111111114" font-size="10" fill="#7A8590" text-anchor="middle">고정 몫 a = 0.171 초 (내 셈)</text><circle cx="470.0" cy="101.4" r="5" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="478.0" y="93.42857142857142" font-size="10" fill="#EB6834" text-anchor="start">100% 0.60</text><circle cx="119.0" cy="258.9" r="5" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="127.0" y="250.85714285714283" font-size="10" fill="#EB6834" text-anchor="start">10% 0.22</text><circle cx="83.9" cy="279.6" r="5" fill="#EB6834" stroke="#EB6834" stroke-width="1.2"/><text x="91.9" y="271.57142857142856" font-size="10" fill="#EB6834" text-anchor="start">1% 0.17</text><line x1="476.0" y1="76.6" x2="492.0" y2="76.6" stroke="#2A78D6" stroke-width="3"/><text x="496" y="80.57142857142856" font-size="10" fill="#2A78D6" text-anchor="start">SPADE 0.66</text><line x1="476.0" y1="271.3" x2="492.0" y2="271.3" stroke="#2A78D6" stroke-width="3"/><text x="496" y="285.2857142857143" font-size="10" fill="#2A78D6" text-anchor="start">PaDiM 0.19</text><line x1="476.0" y1="267.1" x2="492.0" y2="267.1" stroke="#8A939B" stroke-width="3"/><text x="496" y="263.1428571428571" font-size="10" fill="#8A939B" text-anchor="start">100% + IVFPQ 0.20</text><rect x="600" y="60" width="225" height="290" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="610" y="82" font-size="11" fill="#4E5964" text-anchor="start">세 점에 시간 = a + b x 비율</text><text x="610" y="101" font-size="11" fill="#4E5964" text-anchor="start">을 맞추면 a = 0.171, b = 0.429.</text><text x="610" y="120" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="610" y="139" font-size="11" fill="#4E5964" text-anchor="start">1% 의 0.17 초가 고정 몫과</text><text x="610" y="158" font-size="11" fill="#4E5964" text-anchor="start">같은 값이다. 백본 앞 계산 ·</text><text x="610" y="177" font-size="11" fill="#4E5964" text-anchor="start">늘리기 · 흐림 같은 몫이</text><text x="610" y="196" font-size="11" fill="#4E5964" text-anchor="start">줄지 않는 것으로 읽힌다</text><text x="610" y="215" font-size="11" fill="#4E5964" text-anchor="start">(논문은 나누어 적지 않았다).</text><text x="610" y="234" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="610" y="253" font-size="11" fill="#4E5964" text-anchor="start">장치는 부록 A 의 'Tesla V4'</text><text x="610" y="272" font-size="11" fill="#4E5964" text-anchor="start">뿐 — 그런 이름의 GPU 가</text><text x="610" y="291" font-size="11" fill="#4E5964" text-anchor="start">따로 있는지 나는 확인하지</text><text x="610" y="310" font-size="11" fill="#4E5964" text-anchor="start">못했다. 배치 크기 · 시간</text><text x="610" y="329" font-size="11" fill="#4E5964" text-anchor="start">재는 범위도 적혀 있지 않다.</text><text x="20" y="410" font-size="10" fill="#7A8590" text-anchor="start">점수 칸: 100% (99.1, 98.0, 93.3) · 10% (99.0, 98.1, 93.5) · 1% (99.0, 98.0, 93.1) · IVFPQ (98.0, 97.9, 93.0) — 근사 탐색은 이미지 AUROC 를 1.1 점 잃는다.</text></svg>
