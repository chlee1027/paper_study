<svg xmlns="http://www.w3.org/2000/svg" width="840" height="440" viewBox="0 0 840 440" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="PatchCore 의 학습과 시험 흐름"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">PatchCore 의 흐름 — 학습은 '배우기'가 아니라 '모으고 줄이기'다</text><rect x="20" y="50" width="520" height="230" rx="6" fill="none" stroke="#2E6B8A" stroke-width="1.2" stroke-dasharray="5,4"/><text x="30" y="70" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">학습 쪽 (정상 이미지만, 역전파 없음)</text><rect x="40" y="95" width="110" height="62" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="95" y="121" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">정상 이미지 N 장</text><text x="95" y="139" font-size="10" fill="#4E5964" text-anchor="middle">224x224 로 자름</text><rect x="160" y="95" width="110" height="62" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="215" y="121" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">ImageNet 으로 배운</text><text x="215" y="139" font-size="10" fill="#4E5964" text-anchor="middle">WRN-50-2 (얼림)</text><rect x="280" y="95" width="110" height="62" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="335" y="121" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">layer2 · layer3</text><text x="335" y="139" font-size="10" fill="#4E5964" text-anchor="middle">3x3 이웃 평균 · 합침</text><rect x="400" y="95" width="110" height="62" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="455" y="121" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">기억 뱅크 M</text><text x="455" y="139" font-size="10" fill="#4E5964" text-anchor="middle">784 x N 개 조각 특징</text><line x1="150.0" y1="126.0" x2="160.0" y2="126.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="270.0" y1="126.0" x2="280.0" y2="126.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="390.0" y1="126.0" x2="400.0" y2="126.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="455.0" y1="157.0" x2="455.0" y2="190.0" stroke="#9A7B00" stroke-width="1.6" marker-end="url(#ac)"/><rect x="360" y="192" width="170" height="70" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.6"/><text x="445" y="214" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">탐욕 코어셋 뽑기</text><text x="445" y="232" font-size="10" fill="#4E5964" text-anchor="middle">무작위 사영 뒤 max-min 으로</text><text x="445" y="248" font-size="10" fill="#4E5964" text-anchor="middle">25 · 10 · 1 % 만 남김</text><text x="40" y="214" font-size="11" fill="#4E5964" text-anchor="start">학습되는 파라미터가 없다.</text><text x="40" y="232" font-size="11" fill="#4E5964" text-anchor="start">부류마다 뱅크 하나 (15 부류 = 15 개).</text><text x="40" y="250" font-size="11" fill="#4E5964" text-anchor="start">평균 부류 뱅크 189,676 개 (내 셈).</text><rect x="560" y="50" width="260" height="360" rx="6" fill="none" stroke="#B4552B" stroke-width="1.2" stroke-dasharray="5,4"/><text x="570" y="70" font-size="12" fill="#B4552B" text-anchor="start" font-weight="bold">시험 쪽</text><rect x="580" y="95" width="220" height="55" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="690" y="117" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">시험 이미지 → 같은 추출</text><text x="690" y="135" font-size="10" fill="#4E5964" text-anchor="middle">조각 784 개</text><rect x="580" y="170" width="220" height="55" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="690" y="192" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">조각마다 M 에서</text><text x="690" y="210" font-size="10" fill="#4E5964" text-anchor="middle">가장 가까운 거리 (식 6)</text><rect x="580" y="245" width="220" height="55" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="690" y="267" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">가장 먼 조각 하나</text><text x="690" y="285" font-size="10" fill="#4E5964" text-anchor="middle">+ 이웃 재가중 (식 7) → 이미지 점수</text><rect x="580" y="320" width="220" height="55" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="690" y="342" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="bold">조각 거리를 제자리에</text><text x="690" y="360" font-size="10" fill="#4E5964" text-anchor="middle">→ 224 로 늘리고 σ=4 흐림 → 분할 지도</text><line x1="690.0" y1="150.0" x2="690.0" y2="168.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="690.0" y1="225.0" x2="690.0" y2="243.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="690.0" y1="300.0" x2="690.0" y2="318.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><path d="M530,227 C548,227 548,197 578,197" fill="none" stroke="#9A7B00" stroke-width="1.6" marker-end="url(#ac)"/><text x="20" y="306" font-size="12" fill="#1C232C" text-anchor="start">새로 만든 것 셋: (1) 중간 단계 특징을 3x3 이웃 평균으로 묶은</text><text x="20" y="325" font-size="12" fill="#1C232C" text-anchor="start">조각 특징, (2) 그 조각을 다 모은 뱅크를 탐욕 코어셋으로 줄이기,</text><text x="20" y="344" font-size="12" fill="#1C232C" text-anchor="start">(3) 최근접 거리에 이웃 밀도를 곱하는 재가중.</text><text x="20" y="370" font-size="11" fill="#4E5964" text-anchor="start">SPADE 는 이미지 전체 특징으로 먼저 후보를 고른 뒤 픽셀을 봤고,</text><text x="20" y="387" font-size="11" fill="#4E5964" text-anchor="start">PaDiM 은 위치마다 가우스 하나를 뒀다. PatchCore 는 위치를 묻지</text><text x="20" y="404" font-size="11" fill="#4E5964" text-anchor="start">않는 뱅크 하나에 모든 조각을 넣고 시험 조각마다 그 전체를 찾는다.</text><text x="20" y="424" font-size="10" fill="#7A8590" text-anchor="start">784 · 189,676 은 내가 센 값이다(224 입력 · WRN-50-2). 논문 본문에는 조각 수와 뱅크 크기가 없다.</text></svg>
