<svg xmlns="http://www.w3.org/2000/svg" width="840" height="430" viewBox="0 0 840 430" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="MVTec AD 이미지 수준 오차"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="20" y="30" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">MVTec AD 이미지 수준 — 오차(100 − AUROC) 로 보면 (표 1)</text><line x1="190.0" y1="50.0" x2="190.0" y2="355.0" stroke="#CFD6D3" stroke-width="1"/><text x="190.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">0</text><line x1="265.0" y1="50.0" x2="265.0" y2="355.0" stroke="#CFD6D3" stroke-width="1"/><text x="265.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">2.5</text><line x1="340.0" y1="50.0" x2="340.0" y2="355.0" stroke="#CFD6D3" stroke-width="1"/><text x="340.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">5</text><line x1="415.0" y1="50.0" x2="415.0" y2="355.0" stroke="#CFD6D3" stroke-width="1"/><text x="415.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">7.5</text><line x1="490.0" y1="50.0" x2="490.0" y2="355.0" stroke="#CFD6D3" stroke-width="1"/><text x="490.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">10</text><line x1="565.0" y1="50.0" x2="565.0" y2="355.0" stroke="#CFD6D3" stroke-width="1"/><text x="565.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">12.5</text><line x1="640.0" y1="50.0" x2="640.0" y2="355.0" stroke="#CFD6D3" stroke-width="1"/><text x="640.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">15</text><text x="180" y="72" font-size="12" fill="#1C232C" text-anchor="end">SPADE</text><rect x="190.0" y="58.0" width="435.0" height="20.0" fill="#2A78D6"/><text x="631.0" y="73" font-size="11" fill="#1C232C" text-anchor="start">14.5</text><text x="180" y="105" font-size="12" fill="#1C232C" text-anchor="end">PatchSVDD</text><rect x="190.0" y="91.0" width="237.0" height="20.0" fill="#2A78D6"/><text x="433.00000000000017" y="106" font-size="11" fill="#1C232C" text-anchor="start">7.9</text><text x="180" y="138" font-size="12" fill="#1C232C" text-anchor="end">DifferNet</text><rect x="190.0" y="124.0" width="153.0" height="20.0" fill="#2A78D6"/><text x="348.99999999999983" y="139" font-size="11" fill="#1C232C" text-anchor="start">5.1</text><text x="180" y="171" font-size="12" fill="#1C232C" text-anchor="end">PaDiM</text><rect x="190.0" y="157.0" width="141.0" height="20.0" fill="#2A78D6"/><text x="337.0000000000001" y="172" font-size="11" fill="#1C232C" text-anchor="start">4.7</text><text x="180" y="204" font-size="12" fill="#1C232C" text-anchor="end">Mah.AD</text><rect x="190.0" y="190.0" width="126.0" height="20.0" fill="#2A78D6"/><text x="322.0000000000001" y="205" font-size="11" fill="#1C232C" text-anchor="start">4.2</text><text x="180" y="237" font-size="12" fill="#1C232C" text-anchor="end">PaDiM*</text><rect x="190.0" y="223.0" width="63.0" height="20.0" fill="#8A939B"/><text x="258.99999999999983" y="238" font-size="11" fill="#1C232C" text-anchor="start">2.1</text><text x="180" y="270" font-size="12" fill="#EB6834" text-anchor="end" font-weight="bold">PatchCore-25%</text><rect x="190.0" y="256.0" width="27.0" height="20.0" fill="#EB6834"/><text x="223.00000000000017" y="271" font-size="11" fill="#1C232C" text-anchor="start">0.9  오분류 42 / 1,725</text><text x="180" y="303" font-size="12" fill="#EB6834" text-anchor="end" font-weight="bold">PatchCore-10%</text><rect x="190.0" y="289.0" width="30.0" height="20.0" fill="#EB6834"/><text x="226.0" y="304" font-size="11" fill="#1C232C" text-anchor="start">1.0  오분류 47 / 1,725</text><text x="180" y="336" font-size="12" fill="#EB6834" text-anchor="end" font-weight="bold">PatchCore-1%</text><rect x="190.0" y="322.0" width="30.0" height="20.0" fill="#EB6834"/><text x="226.0" y="337" font-size="11" fill="#1C232C" text-anchor="start">1.0  오분류 49 / 1,725</text><text x="415.0" y="392" font-size="11" fill="#4E5964" text-anchor="middle">부류 평균 이미지 AUROC 의 오차, %</text><rect x="655" y="60" width="170" height="230" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="665" y="82" font-size="11" fill="#4E5964" text-anchor="start">회색 PaDiM* 는</text><text x="665" y="101" font-size="11" fill="#4E5964" text-anchor="start">부류에 맞춰 백본을</text><text x="665" y="120" font-size="11" fill="#4E5964" text-anchor="start">고른 값이고, 부록 표 S1</text><text x="665" y="139" font-size="11" fill="#4E5964" text-anchor="start">캡션이 '다시 내지</text><text x="665" y="158" font-size="11" fill="#4E5964" text-anchor="start">못했다' 고 적는다.</text><text x="665" y="177" font-size="11" fill="#4E5964" text-anchor="start"></text><text x="665" y="196" font-size="11" fill="#4E5964" text-anchor="start">'오차 57% 감소' 는</text><text x="665" y="215" font-size="11" fill="#4E5964" text-anchor="start">2.1 → 0.9 로 이 값과의</text><text x="665" y="234" font-size="11" fill="#4E5964" text-anchor="start">비교다. 다시 낸 PaDiM</text><text x="665" y="253" font-size="11" fill="#4E5964" text-anchor="start">(표 5, 95.4) 과 비교하면</text><text x="665" y="272" font-size="11" fill="#4E5964" text-anchor="start">4.6 → 0.9.</text><text x="20" y="418" font-size="10" fill="#7A8590" text-anchor="start">오분류 수는 F1 이 가장 큰 문턱에서 센 거짓 양성 + 거짓 음성. 그 문턱을 무엇으로 정했는지(시험 라벨인지)는 적혀 있지 않다.</text></svg>
