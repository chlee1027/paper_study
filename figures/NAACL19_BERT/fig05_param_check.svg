<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="원문 파라미터 값과 내 셈"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="450.0" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">원문의 110M · 340M 과 내 셈 (원문 3절 · 5.2절)</text><text x="70" y="72" font-size="11.5" fill="#4E5964" text-anchor="middle" font-weight="bold"></text><text x="170" y="72" font-size="11.5" fill="#4E5964" text-anchor="middle" font-weight="bold">원문</text><text x="330" y="72" font-size="11.5" fill="#4E5964" text-anchor="middle" font-weight="bold">V=30,000 [CLS] 변환 뺌</text><text x="500" y="72" font-size="11.5" fill="#4E5964" text-anchor="middle" font-weight="bold">V=30,000</text><text x="640" y="72" font-size="11.5" fill="#4E5964" text-anchor="middle" font-weight="bold">V=30,522</text><text x="800" y="72" font-size="11.5" fill="#4E5964" text-anchor="middle" font-weight="bold">V=30,522 + 사전학습 머리</text><line x1="30" y1="84" x2="870" y2="84" stroke="#CFD6D3" stroke-width="1.2"/><text x="70" y="118" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">Base</text><text x="170" y="118" font-size="14" fill="#9A7B00" text-anchor="middle" font-weight="bold">110M</text><text x="330" y="118" font-size="12.5" fill="#1C232C" text-anchor="middle">108,490,752</text><text x="330" y="138" font-size="10.5" fill="#7A8590" text-anchor="middle">원문 대비 -1.4%</text><text x="500" y="118" font-size="12.5" fill="#1C232C" text-anchor="middle">109,081,344</text><text x="500" y="138" font-size="10.5" fill="#7A8590" text-anchor="middle">원문 대비 -0.8%</text><text x="640" y="118" font-size="12.5" fill="#1C232C" text-anchor="middle">109,482,240</text><text x="640" y="138" font-size="10.5" fill="#7A8590" text-anchor="middle">원문 대비 -0.5%</text><text x="800" y="118" font-size="12.5" fill="#1C232C" text-anchor="middle">110,106,428</text><text x="800" y="138" font-size="10.5" fill="#7A8590" text-anchor="middle">원문 대비 +0.1%</text><text x="70" y="176" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">Large</text><text x="170" y="176" font-size="14" fill="#9A7B00" text-anchor="middle" font-weight="bold">340M</text><text x="330" y="176" font-size="12.5" fill="#1C232C" text-anchor="middle">333,557,760</text><text x="330" y="196" font-size="10.5" fill="#7A8590" text-anchor="middle">원문 대비 -1.9%</text><text x="500" y="176" font-size="12.5" fill="#1C232C" text-anchor="middle">334,607,360</text><text x="500" y="196" font-size="10.5" fill="#7A8590" text-anchor="middle">원문 대비 -1.6%</text><text x="640" y="176" font-size="12.5" fill="#1C232C" text-anchor="middle">335,141,888</text><text x="640" y="196" font-size="10.5" fill="#7A8590" text-anchor="middle">원문 대비 -1.4%</text><text x="800" y="176" font-size="12.5" fill="#1C232C" text-anchor="middle">336,226,108</text><text x="800" y="196" font-size="10.5" fill="#7A8590" text-anchor="middle">원문 대비 -1.1%</text><line x1="30" y1="214" x2="870" y2="214" stroke="#CFD6D3" stroke-width="1.2"/><text x="40" y="240" font-size="11.5" fill="#4E5964" text-anchor="start">어휘 30,000 은 원문 3절의 값이다. 30,522 는 원문에 없고, Hugging Face 의 bert-base-uncased · bert-large-uncased config.json 값이다(2026-11-05 확인).</text><text x="40" y="266" font-size="11.5" fill="#4E5964" text-anchor="start">Base 는 어느 셈이든 110M 에서 -1.4 ~ +0.1% 다. Large 는 어느 셈이든 340M 보다 1.1 ~ 1.9% 작다. 원문은 셈한 방식을 적지 않는다.</text><text x="40" y="292" font-size="11.5" fill="#4E5964" text-anchor="start">낱말 표를 소프트맥스와 공유한다고 가정했다(원문에 적혀 있지 않다). 공유하지 않으면 Base 에 23,040,000 이 더해져 110M 과 맞지 않는다.</text></svg>
