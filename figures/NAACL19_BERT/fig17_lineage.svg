<svg xmlns="http://www.w3.org/2000/svg" width="900" height="390" viewBox="0 0 900 390" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="450.0" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">이 편이 놓인 자리 (원문이 인용한 관계와 이 저장소의 앞 노트)</text><rect x="40" y="70" width="190" height="56" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.2"/><text x="135" y="93" font-size="12" fill="#7A8590" text-anchor="middle" font-weight="bold">DBN · 오토인코더 2006</text><text x="135" y="113" font-size="10" fill="#4E5964" text-anchor="middle">층별 비지도 사전학습 후 미세조정</text><rect x="260" y="70" width="190" height="56" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.2"/><text x="355" y="93" font-size="12" fill="#7A8590" text-anchor="middle" font-weight="bold">사전학습은 왜 돕는가 2010</text><text x="355" y="113" font-size="10" fill="#4E5964" text-anchor="middle">처음부터 학습과 견줬다</text><rect x="480" y="70" width="190" height="56" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.2"/><text x="575" y="93" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">Transformer 2017</text><text x="575" y="113" font-size="10" fill="#4E5964" text-anchor="middle">인코더 · 디코더, 번역에서 처음부터</text><rect x="680" y="70" width="190" height="56" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.2"/><text x="775" y="93" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">ELMo 2018</text><text x="775" y="113" font-size="10" fill="#4E5964" text-anchor="middle">두 방향 LSTM, 특징 방식</text><rect x="680" y="170" width="190" height="56" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.2"/><text x="775" y="193" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="bold">OpenAI GPT 2018</text><text x="775" y="213" font-size="10" fill="#4E5964" text-anchor="middle">왼쪽만 Transformer, 미세조정</text><rect x="370" y="170" width="190" height="56" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.6"/><text x="465" y="193" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="bold">BERT 2019 (이 편)</text><text x="465" y="213" font-size="10" fill="#4E5964" text-anchor="middle">인코더만 · 가림 과제 · NSP</text><rect x="120" y="280" width="190" height="56" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.2"/><text x="215" y="303" font-size="12" fill="#1E8449" text-anchor="middle" font-weight="bold">ViT 2021 (다음 큰 틀)</text><text x="215" y="323" font-size="10" fill="#4E5964" text-anchor="middle">이미지 조각 열 위의 인코더</text><rect x="620" y="280" width="190" height="56" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.2"/><text x="715" y="303" font-size="12" fill="#7A8590" text-anchor="middle" font-weight="bold">큰 틀 다음 칸</text><text x="715" y="323" font-size="10" fill="#4E5964" text-anchor="middle">사용자가 아직 정하지 않았다</text><line x1="575" y1="126" x2="500" y2="168" stroke="#9A7B00" stroke-width="1.4" marker-end="url(#ac)"/><line x1="680" y1="198" x2="562" y2="198" stroke="#B4552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="700" y1="126" x2="540" y2="168" stroke="#B4552B" stroke-width="1.4" marker-end="url(#ar)"/><line x1="340" y1="126" x2="420" y2="168" stroke="#4E5964" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#ai)"/><line x1="400" y1="226" x2="250" y2="278" stroke="#1E8449" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#ao)"/><line x1="520" y1="226" x2="680" y2="278" stroke="#4E5964" stroke-width="1.2" stroke-dasharray="4 4" marker-end="url(#ai)"/><text x="450.0" y="360" font-size="11" fill="#4E5964" text-anchor="middle">점선은 원문이 적은 관계가 아니라 이 저장소에서 내가 잇는 물음이다. 사전학습의 몫을 처음부터 학습과 견준 칸은 2010 편에 있고 이 편에는 없다.</text></svg>
