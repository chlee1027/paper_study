="#2E6B8A" text-anchor="end">특징 Base: 끝 넷 가중합</text><circle cx="648.2500000000005" cy="315" r="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.6"/><text x="658.2500000000005" y="319" font-size="10.5" fill="#4E5964" text-anchor="start">95.9</text><text x="236" y="349" font-size="11.5" fill="#2E6B8A" text-anchor="end">특징 Base: 끝 넷 잇기</text><circle cx="661.7499999999995" cy="345" r="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.6"/><text x="671.7499999999995" y="349" font-size="10.5" fill="#4E5964" text-anchor="start">96.1</text><text x="236" y="379" font-size="11.5" fill="#2E6B8A" text-anchor="end">특징 Base: 12 층 가중합</text><circle cx="621.25" cy="375" r="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.6"/><text x="631.25" y="379" font-size="10.5" fill="#4E5964" text-anchor="start">95.5</text><circle cx="820" cy="80" r="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.6"/><text x="830" y="84" font-size="11" fill="#4E5964" text-anchor="start">Dev</text><circle cx="820" cy="102" r="6" fill="#4E5964" stroke="#4E5964" stroke-width="1.2"/><text x="830" y="106" font-size="11" fill="#4E5964" text-anchor="start">Test</text><text x="40" y="412" font-size="11.5" fill="#4E5964" text-anchor="start">「0.3 F1 차」 = Base 미세조정 96.4 - 끝 넷 잇기 96.1. 개발셋 값이다. 특징 줄에는 시험셋 값이 하나도 없다.</text><text x="40" y="435" font-size="11.5" fill="#4E5964" text-anchor="start">미세조정 줄의 출력 머리는 선형 층 하나, 특징 줄은 무작위로 시작한 2 층 BiLSTM + 분류 층이다. 0.3 에는 머리 차이도 들어 있다.</text><text x="40" y="458" font-size="11.5" fill="#C0392B" text-anchor="start">시험셋 최고는 CSE 93.1 이고 Large 92.8 은 그 아래다. 원문 Abstract · 4 절의 「11 과제」 에 이 과제는 들어 있지 않다(내가 센 것).</text></svg>
