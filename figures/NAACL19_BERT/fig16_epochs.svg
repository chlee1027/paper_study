<svg xmlns="http://www.w3.org/2000/svg" width="900" height="350" viewBox="0 0 900 350" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="에폭 셈"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="450.0" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">A.2 절 「약 40 에폭」 과 같은 절의 「90% 걸음은 길이 128」 (내가 센 것)</text><text x="310" y="84" font-size="11.5" fill="#1C232C" text-anchor="end">원문 셈: 128,000 토큰 x 100 만 걸음</text><rect x="320.0" y="62" width="320.0" height="32" fill="#2E6B8A"/><text x="648.0" y="83" font-size="11.5" fill="#4E5964" text-anchor="start">1.28 x 10¹¹ 토큰 = 38.8 에폭 (원문 약 40)</text><text x="310" y="134" font-size="11.5" fill="#1C232C" text-anchor="end">일정대로, 배치 256 열 유지</text><rect x="320.0" y="112" width="106.5" height="32" fill="#B4552B"/><text x="434.496" y="133" font-size="11.5" fill="#4E5964" text-anchor="start">4.26 x 10¹⁰ 토큰 = 12.9 에폭</text><text x="310" y="184" font-size="11.5" fill="#1C232C" text-anchor="end">OpenAI GPT: 32,000 낱말 x 100 만 걸음 (A.4절)</text><rect x="320.0" y="162" width="80.0" height="32" fill="#9A7B00"/><text x="408.0" y="183" font-size="11.5" fill="#4E5964" text-anchor="start">3.2 x 10¹⁰ 토큰 = 9.7 에폭 상당</text><text x="40" y="232" font-size="11" fill="#C0392B" text-anchor="start">A.2 절은 길이 128 구간의 배치 크기를 적지 않는다. 토큰 128,000 으로 맞췄다면(열 1,000 개) 원문 셈이 맞고, 256 열 그대로면 12.9 에폭이다.</text><text x="40" y="256" font-size="11" fill="#4E5964" text-anchor="start">256 x 512 = 131,072 인데 원문은 128,000 이라 적는다(2.3% 작다). 열이 512 보다 짧으면 위 값들은 모두 더 작아진다(「≤ 512」).</text><text x="40" y="280" font-size="11" fill="#4E5964" text-anchor="start">256 열 유지라면 길이 128 구간은 32,768 토큰으로 GPT 의 32,000 과 2.4% 차이고, A.4 절의 「128,000 대 32,000」 은 100 만 걸음 중 10 만 걸음의 값이다.</text><text x="40" y="304" font-size="11" fill="#4E5964" text-anchor="start">자리 128 ~ 511 (512 칸의 75%) 은 마지막 10 만 걸음에만 쓰인다. 원문이 「자리 임베딩을 배우려고」 라 적는 그 구간이다.</text></svg>
