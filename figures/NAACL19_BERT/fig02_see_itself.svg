<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="양쪽을 보는 모델이 자기 자신을 보는 경로"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="450.0" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">왜 양쪽을 보는 언어 모델은 그대로 배울 수 없나 (3.1절 「see itself」 를 두 층으로 풀었다)</text><text x="210" y="66" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">가리지 않으면: 정답 낱말이 두 걸음에 자기 자리로 돌아온다</text><rect x="46" y="232" width="68" height="28" rx="5" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.3"/><text x="80" y="251" font-size="11.5" fill="#1C232C" text-anchor="middle">my</text><circle cx="80" cy="177" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><circle cx="80" cy="109" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="80" y="181" font-size="10" fill="#7A8590" text-anchor="middle">1</text><text x="80" y="113" font-size="10" fill="#7A8590" text-anchor="middle">2</text><rect x="136" y="232" width="68" height="28" rx="5" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.3"/><text x="170" y="251" font-size="11.5" fill="#1C232C" text-anchor="middle">dog</text><circle cx="170" cy="177" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><circle cx="170" cy="109" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="170" y="181" font-size="10" fill="#7A8590" text-anchor="middle">1</text><text x="170" y="113" font-size="10" fill="#7A8590" text-anchor="middle">2</text><rect x="226" y="232" width="68" height="28" rx="5" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.3"/><text x="260" y="251" font-size="11.5" fill="#1C232C" text-anchor="middle">is</text><circle cx="260" cy="177" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><circle cx="260" cy="109" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="260" y="181" font-size="10" fill="#7A8590" text-anchor="middle">1</text><text x="260" y="113" font-size="10" fill="#7A8590" text-anchor="middle">2</text><rect x="316" y="232" width="68" height="28" rx="5" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="350" y="251" font-size="11.5" fill="#1C232C" text-anchor="middle">hairy</text><circle cx="350" cy="177" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><circle cx="350" cy="109" r="13" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="350" y="181" font-size="10" fill="#7A8590" text-anchor="middle">1</text><text x="350" y="113" font-size="10" fill="#7A8590" text-anchor="middle">2</text><line x1="350" y1="232" x2="178" y2="190" stroke="#B4552B" stroke-width="2" marker-end="url(#ar)"/><line x1="176" y1="164" x2="342" y2="122" stroke="#B4552B" stroke-width="2" marker-end="url(#ar)"/><text x="210" y="290" font-size="11.5" fill="#4E5964" text-anchor="middle">목표 hairy = 입력 hairy. 입력 자리 → 1 층 dog → 2 층 자기 자리</text><text x="650" y="66" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">가리면: 그 자리의 입력에 정답이 없다</text><rect x="486" y="232" width="68" height="28" rx="5" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.3"/><text x="520" y="251" font-size="11.5" fill="#1C232C" text-anchor="middle">my</text><circle cx="520" cy="177" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><circle cx="520" cy="109" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="520" y="181" font-size="10" fill="#7A8590" text-anchor="middle">1</text><text x="520" y="113" font-size="10" fill="#7A8590" text-anchor="middle">2</text><rect x="576" y="232" width="68" height="28" rx="5" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.3"/><text x="610" y="251" font-size="11.5" fill="#1C232C" text-anchor="middle">dog</text><circle cx="610" cy="177" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><circle cx="610" cy="109" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="610" y="181" font-size="10" fill="#7A8590" text-anchor="middle">1</text><text x="610" y="113" font-size="10" fill="#7A8590" text-anchor="middle">2</text><rect x="666" y="232" width="68" height="28" rx="5" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.3"/><text x="700" y="251" font-size="11.5" fill="#1C232C" text-anchor="middle">is</text><circle cx="700" cy="177" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><circle cx="700" cy="109" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="700" y="181" font-size="10" fill="#7A8590" text-anchor="middle">1</text><text x="700" y="113" font-size="10" fill="#7A8590" text-anchor="middle">2</text><rect x="756" y="232" width="68" height="28" rx="5" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="790" y="251" font-size="11.5" fill="#1C232C" text-anchor="middle">[MASK]</text><circle cx="790" cy="177" r="13" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><circle cx="790" cy="109" r="13" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="790" y="181" font-size="10" fill="#7A8590" text-anchor="middle">1</text><text x="790" y="113" font-size="10" fill="#7A8590" text-anchor="middle">2</text><text x="650" y="290" font-size="11.5" fill="#4E5964" text-anchor="middle">목표 hairy, 입력 [MASK]. 나머지 자리에서 맞혀야 한다</text></svg>
