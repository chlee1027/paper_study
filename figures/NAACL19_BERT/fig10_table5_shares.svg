<svg xmlns="http://www.w3.org/2000/svg" width="900" height="370" viewBox="0 0 900 370" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 5 차의 몫"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="450.0" y="28" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="bold">표 5 의 Base → LTR 차를 NSP 를 뺀 몫과 LTR 로 바꾼 몫으로 (내가 센 것)</text><text x="110" y="80" font-size="12" fill="#1C232C" text-anchor="end" font-weight="bold">MNLI-m</text><rect x="120.0" y="60" width="24.5" height="30" fill="#9A7B00"/><rect x="144.5" y="60" width="88.4" height="30" fill="#B4552B"/><text x="240.9090909090915" y="80" font-size="11.5" fill="#4E5964" text-anchor="start">합 2.3 = NSP 0.5 (21.7%) + LTR 1.8</text><text x="110" y="126" font-size="12" fill="#1C232C" text-anchor="end" font-weight="bold">QNLI</text><rect x="120.0" y="106" width="171.8" height="30" fill="#9A7B00"/><rect x="291.8" y="106" width="29.5" height="30" fill="#B4552B"/><text x="329.2727272727277" y="126" font-size="11.5" fill="#4E5964" text-anchor="start">합 4.1 = NSP 3.5 (85.4%) + LTR 0.6</text><text x="110" y="172" font-size="12" fill="#1C232C" text-anchor="end" font-weight="bold">MRPC</text><rect x="120.0" y="152" width="9.8" height="30" fill="#9A7B00"/><rect x="129.8" y="152" width="441.8" height="30" fill="#B4552B"/><text x="579.6363636363637" y="172" font-size="11.5" fill="#4E5964" text-anchor="start">합 9.2 = NSP 0.2 (2.2%) + LTR 9.0</text><text x="110" y="218" font-size="12" fill="#1C232C" text-anchor="end" font-weight="bold">SST-2</text><rect x="120.0" y="198" width="4.9" height="30" fill="#9A7B00"/><rect x="124.9" y="198" width="24.5" height="30" fill="#B4552B"/><text x="157.4545454545459" y="218" font-size="11.5" fill="#4E5964" text-anchor="start">합 0.6 = NSP 0.1 (16.7%) + LTR 0.5</text><text x="110" y="264" font-size="12" fill="#1C232C" text-anchor="end" font-weight="bold">SQuAD</text><rect x="120.0" y="244" width="29.5" height="30" fill="#9A7B00"/><rect x="149.5" y="244" width="495.8" height="30" fill="#B4552B"/><text x="653.2727272727274" y="264" font-size="11.5" fill="#4E5964" text-anchor="start">합 10.7 = NSP 0.6 (5.6%) + LTR 10.1</text><rect x="120" y="298" width="14" height="14" rx="2" fill="#9A7B00" stroke="#9A7B00" stroke-width="1"/><text x="140" y="310" font-size="11.5" fill="#4E5964" text-anchor="start">NSP 를 뺀 몫 (Base - No NSP)</text><rect x="370" y="298" width="14" height="14" rx="2" fill="#B4552B" stroke="#B4552B" stroke-width="1"/><text x="390" y="310" font-size="11.5" fill="#4E5964" text-anchor="start">가림 → 왼쪽만 (No NSP - LTR), 미세조정의 왼쪽 제약 포함</text><text x="450.0" y="346" font-size="11.5" fill="#C0392B" text-anchor="middle">순서는 표가 정한 한 가지뿐이다. NSP 만 쓰고 가림 과제를 뺀 줄이 없어, 가림 과제만의 몫은 이 표로 뽑을 수 없다.</text></svg>
