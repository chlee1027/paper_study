nchor="start">r = 0.16,  1 배</text><text x="190.0" y="131.0" font-size="11.5" fill="#4E5964" text-anchor="end">VE PC1000 확률 흐름</text><rect x="200.0" y="118.0" width="191.9" height="18.0" rx="2" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="0"/><text x="397.9" y="132.0" font-size="11" fill="#1C232C" text-anchor="start">r = 0.17,  1.129 배</text><text x="190.0" y="157.0" font-size="11.5" fill="#4E5964" text-anchor="end">VE C2000</text><rect x="200.0" y="144.0" width="321.4" height="18.0" rx="2" fill="#2E6B8A" stroke="#2E6B8A" stroke-width="0"/><text x="527.4" y="158.0" font-size="11" fill="#1C232C" text-anchor="start">r = 0.22,  1.891 배</text><text x="190.0" y="183.0" font-size="11.5" fill="#4E5964" text-anchor="end">VP PC1000 조상</text><rect x="200.0" y="170.0" width="1.0" height="18.0" rx="2" fill="#B4552B" stroke="#B4552B" stroke-width="0"/><text x="206.7" y="184.0" font-size="11" fill="#1C232C" text-anchor="start">r = 0.01,  0.003906 배</text><text x="190.0" y="209.0" font-size="11.5" fill="#4E5964" text-anchor="end">VP PC1000 거꾸로 확산</text><rect x="200.0" y="196.0" width="1.0" height="18.0" rx="2" fill="#B4552B" stroke="#B4552B" stroke-width="0"/><text x="206.7" y="210.0" font-size="11" fill="#1C232C" text-anchor="start">r = 0.01,  0.003906 배</text><text x="190.0" y="235.0" font-size="11.5" fill="#4E5964" text-anchor="end">VP PC1000 확률 흐름</text><rect x="200.0" y="222.0" width="10.6" height="18.0" rx="2" fill="#B4552B" stroke="#B4552B" stroke-width="0"/><text x="216.6" y="236.0" font-size="11" fill="#1C232C" text-anchor="start">r = 0.04,  0.0625 배</text><text x="190.0" y="261.0" font-size="11.5" fill="#4E5964" text-anchor="end">VP C2000</text><rect x="200.0" y="248.0" width="484.1" height="18.0" rx="2" fill="#B4552B" stroke="#B4552B" stroke-width="0"/><text x="690.1" y="262.0" font-size="11" fill="#1C232C" text-anchor="start">r = 0.27,  2.848 배</text></svg>
