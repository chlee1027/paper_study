<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="PC 표본기와 앞선 방법의 대응"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/></marker></defs><text x="440.0" y="26.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">PC 표본기의 칸에 앞선 방법들을 놓으면 (4.2절 · 부록 G)</text><text x="440.0" y="46.0" font-size="12" fill="#4E5964" text-anchor="middle">칸이 뜻하는 것은 한 눈금마다의 할 일이다. 점수 평가는 P 한 걸음 1 회, C 한 걸음 1 회</text><text x="290.0" y="82.0" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="700">예측기 (식을 푼다)</text><text x="545.0" y="82.0" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="700">수정기 (주변 분포를 맞춘다)</text><text x="770.0" y="82.0" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="700">눈금당 점수 평가</text><rect x="30.0" y="96.0" width="150.0" height="42.0" rx="3" fill="#D8E7EE" stroke="#CFD6D3" stroke-width="1"/><text x="105.0" y="122.0" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="700">SMLD (Song · Ermon)</text><rect x="190.0" y="96.0" width="200.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="290.0" y="122.0" font-size="11" fill="#1C232C" text-anchor="middle">항등 (아무것도 안 함)</text><rect x="445.0" y="96.0" width="200.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="545.0" y="122.0" font-size="11.5" fill="#1C232C" text-anchor="middle">담금질 랑주뱅 M 걸음</text><rect x="710.0" y="96.0" width="120.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="770.0" y="122.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">M</text><rect x="30.0" y="146.0" width="150.0" height="42.0" rx="3" fill="#F2DED2" stroke="#CFD6D3" stroke-width="1"/><text x="105.0" y="172.0" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="700">DDPM (Ho 외)</text><rect x="190.0" y="146.0" width="200.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="290.0" y="172.0" font-size="11" fill="#1C232C" text-anchor="middle">조상 표집 식 (4)</text><rect x="445.0" y="146.0" width="200.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="545.0" y="172.0" font-size="11.5" fill="#1C232C" text-anchor="middle">항등</text><rect x="710.0" y="146.0" width="120.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="770.0" y="172.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">1</text><rect x="30.0" y="196.0" width="150.0" height="42.0" rx="3" fill="#FFF3C4" stroke="#CFD6D3" stroke-width="1"/><text x="105.0" y="222.0" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="700">표 1 PC1000</text><rect x="190.0" y="196.0" width="200.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="290.0" y="222.0" font-size="11" fill="#1C232C" text-anchor="middle">조상 · 거꾸로 확산 · 확률 흐름</text><rect x="445.0" y="196.0" width="200.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="545.0" y="222.0" font-size="11.5" fill="#1C232C" text-anchor="middle">랑주뱅 1 걸음, r 격자 탐색</text><rect x="710.0" y="196.0" width="120.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="770.0" y="222.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">2</text><rect x="30.0" y="246.0" width="150.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="105.0" y="272.0" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="700">표 1 C2000</text><rect x="190.0" y="246.0" width="200.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="290.0" y="272.0" font-size="11" fill="#1C232C" text-anchor="middle">항등</text><rect x="445.0" y="246.0" width="200.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="545.0" y="272.0" font-size="11.5" fill="#1C232C" text-anchor="middle">랑주뱅 2 걸음</text><rect x="710.0" y="246.0" width="120.0" height="42.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="770.0" y="272.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">2</text></svg>
