<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="SMLD와 DDPM이 VE와 VP SDE의 이산화라는 대응"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/></marker></defs><text x="480.0" y="26.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">이산 사슬 둘이 SDE 둘의 이산화다</text><text x="480.0" y="46.0" font-size="12" fill="#4E5964" text-anchor="middle">표의 이름은 이 노트의 이름이고 식 번호는 원문 번호다</text><rect x="40.0" y="62.0" width="150.0" height="30.0" rx="3" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1"/><text x="115.0" y="82.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">모델</text><rect x="200.0" y="62.0" width="280.0" height="30.0" rx="3" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1"/><text x="340.0" y="82.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">이산 사슬</text><rect x="490.0" y="62.0" width="240.0" height="30.0" rx="3" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1"/><text x="610.0" y="82.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">N -&gt; 무한</text><rect x="740.0" y="62.0" width="180.0" height="30.0" rx="3" fill="#DDE3E0" stroke="#CFD6D3" stroke-width="1"/><text x="830.0" y="82.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="700">t = 1 의 분포</text><rect x="40.0" y="100.0" width="150.0" height="56.0" rx="3" fill="#D8E7EE" stroke="#CFD6D3" stroke-width="1"/><text x="115.0" y="133.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">SMLD (NCSN)</text><rect x="200.0" y="100.0" width="280.0" height="56.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="340.0" y="133.0" font-size="11.5" fill="#1C232C" text-anchor="middle">x_i = x_{i-1} + √(σ_i² - σ_{i-1}²) z  식 (8)</text><rect x="490.0" y="100.0" width="240.0" height="56.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="610.0" y="124.0" font-size="11.5" fill="#1C232C" text-anchor="middle">VE:  dx = √(d[σ²]/dt) dw</text><text x="610.0" y="142.0" font-size="11.5" fill="#1C232C" text-anchor="middle">식 (9)</text><rect x="740.0" y="100.0" width="180.0" height="56.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="830.0" y="133.0" font-size="10.5" fill="#1C232C" text-anchor="middle">N(x(0), σmax²)</text><rect x="40.0" y="166.0" width="150.0" height="56.0" rx="3" fill="#F2DED2" stroke="#CFD6D3" stroke-width="1"/><text x="115.0" y="199.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">DDPM</text><rect x="200.0" y="166.0" width="280.0" height="56.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="340.0" y="199.0" font-size="11.5" fill="#1C232C" text-anchor="middle">x_i = √(1-β_i) x_{i-1} + √β_i z  식 (10)</text><rect x="490.0" y="166.0" width="240.0" height="56.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="610.0" y="190.0" font-size="11.5" fill="#1C232C" text-anchor="middle">VP:  dx = -½βx dt + √β dw</text><text x="610.0" y="208.0" font-size="11.5" fill="#1C232C" text-anchor="middle">식 (11)</text><rect x="740.0" y="166.0" width="180.0" height="56.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="830.0" y="199.0" font-size="10.5" fill="#1C232C" text-anchor="middle">평균 0.0066 x(0), 분산 0.99996</text><rect x="40.0" y="232.0" width="150.0" height="56.0" rx="3" fill="#EADCF0" stroke="#CFD6D3" stroke-width="1"/><text x="115.0" y="265.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">새로 낸 꼴</text><rect x="200.0" y="232.0" width="280.0" height="56.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="340.0" y="265.0" font-size="11.5" fill="#1C232C" text-anchor="middle">(이산 사슬에서 오지 않는다)</text><rect x="490.0" y="232.0" width="240.0" height="56.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="610.0" y="256.0" font-size="11.5" fill="#1C232C" text-anchor="middle">sub-VP:  dx = -½βx dt</text><text x="610.0" y="274.0" font-size="11.5" fill="#1C232C" text-anchor="middle">+ √(β(1-e^(-2∫β))) dw  식 (12)</text><rect x="740.0" y="232.0" width="180.0" height="56.0" rx="3" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="830.0" y="265.0" font-size="10.5" fill="#1C232C" text-anchor="middle">평균 0.0066 x(0), 분산 0.99991</text><text x="480.0" y="312.0" font-size="11.5" fill="#4E5964" text-anchor="middle">오른쪽 칸의 수는 β 0.1 ~ 20 으로 내가 센 것. VE 의 σmax 는 원문 그림 5(a) · 그림 13 에서 읽은 50.</text></svg>
