<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 3의 단계별 변경"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/></marker></defs><text x="500.0" y="26.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">표 3 의 FID 사다리: 한 칸에 바뀐 것이 하나가 아니다 (부록 H)</text><text x="500.0" y="46.0" font-size="12" fill="#4E5964" text-anchor="middle">숫자는 표 3. 칸 사이 글은 부록 H.1 · H.2 에 적힌 변경을 모은 것</text><rect x="50.0" y="70.0" width="150.0" height="72.0" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.6"/><text x="125.0" y="98.0" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">NCSN++</text><text x="125.0" y="124.0" font-size="14" fill="#2E6B8A" text-anchor="middle" font-weight="700">FID 2.45</text><line x1="202.0" y1="84.0" x2="398.0" y2="84.0" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><text x="300.0" y="80.0" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="700">-0.07</text><text x="300.0" y="104.0" font-size="10.5" fill="#4E5964" text-anchor="middle">목적 함수 이산 -&gt; 연속</text><text x="300.0" y="119.0" font-size="10.5" fill="#4E5964" text-anchor="middle">위치 임베딩 -&gt; 푸리에 특징</text><text x="300.0" y="134.0" font-size="10.5" fill="#4E5964" text-anchor="middle">반복 1.3M -&gt; 0.95M</text><rect x="400.0" y="70.0" width="150.0" height="72.0" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.6"/><text x="475.0" y="98.0" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">cont.</text><text x="475.0" y="124.0" font-size="14" fill="#2E6B8A" text-anchor="middle" font-weight="700">FID 2.38</text><line x1="552.0" y1="84.0" x2="748.0" y2="84.0" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><text x="650.0" y="80.0" font-size="12" fill="#2E6B8A" text-anchor="middle" font-weight="700">-0.18</text><text x="650.0" y="104.0" font-size="10.5" fill="#4E5964" text-anchor="middle">잔차 블록 두 배</text><rect x="750.0" y="70.0" width="150.0" height="72.0" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.6"/><text x="825.0" y="98.0" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">cont. (deep)</text><text x="825.0" y="124.0" font-size="14" fill="#2E6B8A" text-anchor="middle" font-weight="700">FID 2.20</text><rect x="50.0" y="206.0" width="150.0" height="72.0" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="125.0" y="234.0" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">DDPM++</text><text x="125.0" y="260.0" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="700">FID 2.78</text><line x1="202.0" y1="220.0" x2="398.0" y2="220.0" stroke="#B4552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="300.0" y="216.0" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="700">-0.23</text><text x="300.0" y="240.0" font-size="10.5" fill="#4E5964" text-anchor="middle">목적 함수 이산 -&gt; 연속</text><text x="300.0" y="255.0" font-size="10.5" fill="#4E5964" text-anchor="middle">연속 시간 조건</text><text x="300.0" y="270.0" font-size="10.5" fill="#4E5964" text-anchor="middle">예측기 -&gt; 오일러-마루야마</text><rect x="400.0" y="206.0" width="150.0" height="72.0" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="475.0" y="234.0" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">cont.</text><text x="475.0" y="260.0" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="700">FID 2.55</text><line x1="552.0" y1="220.0" x2="748.0" y2="220.0" stroke="#B4552B" stroke-width="1.6" marker-end="url(#ar)"/><text x="650.0" y="216.0" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="700">-0.14</text><text x="650.0" y="240.0" font-size="10.5" fill="#4E5964" text-anchor="middle">깊이 두 배</text><text x="650.0" y="255.0" font-size="10.5" fill="#4E5964" text-anchor="middle">반복 0.95M</text><rect x="750.0" y="206.0" width="150.0" height="72.0" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="825.0" y="234.0" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">cont. (deep)</text><text x="825.0" y="260.0" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="700">FID 2.41</text><text x="500.0" y="310.0" font-size="11.5" fill="#4E5964" text-anchor="middle">VE 칸의 PC 는 눈금당 평가 2 회다. H.1 은 VP 탐색에서 수정기를 뺐다고 적고, 4.4절은 표 3 이 PC 표본기라고 적는다.</text><text x="500.0" y="332.0" font-size="11.5" fill="#4E5964" text-anchor="middle">원문 그림 10 의 VE · CIFAR-10 에서 가장 낮은 체크포인트 평균 FID 는 2.60 이고, 표 3 의 2.45 는 학습 중 가장 낮은 체크포인트 값이다.</text></svg>
