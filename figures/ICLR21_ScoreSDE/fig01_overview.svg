<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="앞으로 가는 SDE, 거꾸로 가는 SDE, 확률 흐름 ODE, 점수 모델의 관계"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E44AD"/></marker></defs><text x="480.0" y="26.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">SDE 하나로 놓은 전체 틀</text><text x="480.0" y="46.0" font-size="12" fill="#4E5964" text-anchor="middle">앞으로 가는 식에는 학습할 것이 없고, 뒤로 가는 두 식이 함께 점수 하나만 요구한다</text><rect x="40.0" y="110.0" width="130.0" height="150.0" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="105.0" y="170.0" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="700">데이터</text><text x="105.0" y="192.0" font-size="12" fill="#4E5964" text-anchor="middle">x(0) ~ p0</text><rect x="790.0" y="110.0" width="130.0" height="150.0" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="855.0" y="170.0" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="700">사전분포</text><text x="855.0" y="192.0" font-size="12" fill="#4E5964" text-anchor="middle">x(T) ~ pT</text><line x1="170.0" y1="130.0" x2="788.0" y2="130.0" stroke="#2E6B8A" stroke-width="2" marker-end="url(#af)"/><text x="480.0" y="120.0" font-size="13" fill="#2E6B8A" text-anchor="middle">식 (5) 앞으로 가는 SDE:  dx = f(x,t) dt + g(t) dw</text><line x1="790.0" y1="190.0" x2="172.0" y2="190.0" stroke="#B4552B" stroke-width="2" marker-end="url(#ar)"/><text x="480.0" y="180.0" font-size="13" fill="#B4552B" text-anchor="middle">식 (6) 거꾸로 가는 SDE:  dx = [f - g² · 점수] dt + g dw̄   (걸음마다 잡음이 더해진다)</text><line x1="790.0" y1="245.0" x2="172.0" y2="245.0" stroke="#8E44AD" stroke-width="2" marker-end="url(#ap)"/><text x="480.0" y="235.0" font-size="13" fill="#8E44AD" text-anchor="middle">식 (13) 확률 흐름 ODE:  dx = [f - ½ g² · 점수] dt   (같은 주변 분포, 잡음 없음)</text><rect x="250.0" y="290.0" width="460.0" height="74.0" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="480.0" y="316.0" font-size="14" fill="#1C232C" text-anchor="middle" font-weight="700">점수 모델 s(x, t) ≈ ∇x log p_t(x)</text><text x="480.0" y="342.0" font-size="12" fill="#4E5964" text-anchor="middle">식 (7): 시간 t 를 뽑아 잡음 제거 점수 맞추기로 배운다</text><line x1="420.0" y1="288.0" x2="420.0" y2="194.0" stroke="#9A7B00" stroke-width="1.4" stroke-dasharray="4 3"/><line x1="560.0" y1="288.0" x2="560.0" y2="249.0" stroke="#9A7B00" stroke-width="1.4" stroke-dasharray="4 3"/></svg>
