3" stroke-width="1"/><text x="800.0" y="62.0" font-size="11" fill="#4E5964" text-anchor="middle">100</text><text x="198.0" y="96.0" font-size="13" fill="#1C232C" text-anchor="end" font-weight="bold">무작위 10 장</text><text x="198.0" y="114.0" font-size="11" fill="#4E5964" text-anchor="end">표 7</text><rect x="210.0" y="82.0" width="377.6" height="16.0" fill="#B4552B"/><text x="593.6" y="95.0" font-size="12" fill="#1C232C" text-anchor="start">평균 89.2</text><rect x="210.0" y="102.0" width="62.9" height="16.0" fill="#B4552B"/><text x="278.9" y="115.0" font-size="12" fill="#1C232C" text-anchor="start">Grid 73.2</text><text x="198.0" y="162.0" font-size="13" fill="#1C232C" text-anchor="end" font-weight="bold">kNN 10 장</text><text x="198.0" y="180.0" font-size="11" fill="#4E5964" text-anchor="end">표 7</text><rect x="210.0" y="148.0" width="420.9" height="16.0" fill="#2E6B8A"/><text x="636.9" y="161.0" font-size="12" fill="#1C232C" text-anchor="start">평균 91.4</text><rect x="210.0" y="168.0" width="320.6" height="16.0" fill="#2E6B8A"/><text x="536.6" y="181.0" font-size="12" fill="#1C232C" text-anchor="start">Grid 86.3</text><text x="198.0" y="228.0" font-size="13" fill="#1C232C" text-anchor="end" font-weight="bold">kNN 50 장</text><text x="198.0" y="246.0" font-size="11" fill="#4E5964" text-anchor="end">표 3 · 표 6</text><rect x="210.0" y="214.0" width="426.8" height="16.0" fill="#1E8449"/><text x="642.8" y="227.0" font-size="12" fill="#1C232C" text-anchor="start">평균 91.7</text><rect x="210.0" y="234.0" width="328.4" height="16.0" fill="#1E8449"/><text x="544.4" y="247.0" font-size="12" fill="#1C232C" text-anchor="start">Grid 86.7</text><text x="198.0" y="294.0" font-size="13" fill="#1C232C" text-anchor="end" font-weight="bold">학습 전체</text><text x="198.0" y="312.0" font-size="11" fill="#C0392B" text-anchor="end">원문에 없음</text><rect x="210.0" y="278.0" width="590.0" height="40.0" rx="6" fill="#F6D9D5" stroke="#C0392B" stroke-width="1.2" stroke-dasharray="5,3"/><text x="505.0" y="303.0" font-size="12" fill="#1C232C" text-anchor="middle">먼저 고르지 않은 칸은 표가 없다 — 고르는 단계가 잃는 값은 이 편에서 뽑히지 않는다</text><text x="440.0" y="374.0" font-size="12" fill="#4E5964" text-anchor="middle">눈금은 70 에서 시작한다. 표 7 의 캡션은 지표 이름을 적지 않았고, 값이 PRO 열과 같은 범위라 PRO 로 읽었다(내 판단)</text><text x="440.0" y="396.0" font-size="12" fill="#4E5964" text-anchor="middle">무작위 대 kNN 차 2.2 중 Grid 13.1 이 15 부류 차의 합의 39.7% (평균이 부류 평균이라 할 때, 내가 센 것)</text><text x="440.0" y="418.0" font-size="12" fill="#4E5964" text-anchor="middle">무작위 추첨을 몇 번 돌렸는지 적혀 있지 않다</text></svg>
