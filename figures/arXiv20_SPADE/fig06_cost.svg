<svg xmlns="http://www.w3.org/2000/svg" width="880" height="356" viewBox="0 0 880 356" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="K 별 거리 계산 수"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="440.0" y="28.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">시험 이미지 한 장의 픽셀 단계 거리 계산 수 — 내가 센 것, 원문에 없음</text><line x1="230.0" y1="56.0" x2="230.0" y2="226.0" stroke="#CFD6D3" stroke-width="1"/><text x="230.0" y="50.0" font-size="11" fill="#4E5964" text-anchor="middle">10^6</text><line x1="370.0" y1="56.0" x2="370.0" y2="226.0" stroke="#CFD6D3" stroke-width="1"/><text x="370.0" y="50.0" font-size="11" fill="#4E5964" text-anchor="middle">10^7</text><line x1="510.0" y1="56.0" x2="510.0" y2="226.0" stroke="#CFD6D3" stroke-width="1"/><text x="510.0" y="50.0" font-size="11" fill="#4E5964" text-anchor="middle">10^8</text><line x1="650.0" y1="56.0" x2="650.0" y2="226.0" stroke="#CFD6D3" stroke-width="1"/><text x="650.0" y="50.0" font-size="11" fill="#4E5964" text-anchor="middle">10^9</text><line x1="790.0" y1="56.0" x2="790.0" y2="226.0" stroke="#CFD6D3" stroke-width="1"/><text x="790.0" y="50.0" font-size="11" fill="#4E5964" text-anchor="middle">10^10</text><text x="218.0" y="84.0" font-size="12" fill="#1C232C" text-anchor="end">K = 1</text><rect x="230.0" y="70.0" width="139.0" height="22.0" fill="#2E6B8A"/><text x="375.0" y="86.0" font-size="12" fill="#1C232C" text-anchor="start">9,834,496</text><text x="218.0" y="124.0" font-size="12" fill="#1C232C" text-anchor="end">K = 10 (표 7)</text><rect x="230.0" y="110.0" width="279.0" height="22.0" fill="#2E6B8A"/><text x="515.0" y="126.0" font-size="12" fill="#1C232C" text-anchor="start">98,344,960</text><text x="218.0" y="164.0" font-size="12" fill="#1C232C" text-anchor="end">K = 50 (MVTec)</text><rect x="230.0" y="150.0" width="376.8" height="22.0" fill="#2E6B8A"/><text x="612.8" y="166.0" font-size="12" fill="#1C232C" text-anchor="start">491,724,800</text><text x="218.0" y="204.0" font-size="12" fill="#1C232C" text-anchor="end">학습 전체 (평균 241.9 장)</text><rect x="230.0" y="190.0" width="472.7" height="22.0" fill="#C0392B"/><text x="708.7" y="206.0" font-size="12" fill="#1C232C" text-anchor="start">2,379,292,399</text><rect x="24.0" y="240.0" width="832.0" height="102.0" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="40.0" y="262.0" font-size="12" fill="#1C232C" text-anchor="start">가정: 세 단계를 56 x 56 격자 하나에 이어 붙이면 칸 3,136 · 차원 256 + 512 + 1,024 = 1,792. 원문은 이을 때 키우는 법을 적지 않는다.</text><text x="40.0" y="284.0" font-size="12" fill="#4E5964" text-anchor="start">K = 50 갤러리는 156,800 벡터이고 부동소수 4 바이트면 1.12 GB. 이미지 단계는 평균 241.9 번(2,048 차원)이라 쌍 수의 비가 2,032,481 배다.</text><text x="40.0" y="306.0" font-size="12" fill="#4E5964" text-anchor="start">표 7 에서 K 를 50 에서 10 으로 줄이면 쌍 수는 5 분의 1 이고 평균 값 차는 0.3, Grid 차는 0.4 다.</text><text x="40.0" y="328.0" font-size="12" fill="#4E5964" text-anchor="start">원문이 적은 시간 값은 없다. 0.66 초는 PatchCore 편이 다시 구현해 잰 값이다. STC 는 입력이 256 이라 칸 수가 이 셈과 다르다.</text></svg>
