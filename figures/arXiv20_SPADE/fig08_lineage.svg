<svg xmlns="http://www.w3.org/2000/svg" width="900" height="272" viewBox="0 0 900 272" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="최근접 이웃 줄기"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="450.0" y="28.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">최근접 이웃으로 이상을 재는 줄기 — 뱅크에 무엇을 넣는가</text><rect x="24.0" y="58.0" width="200.0" height="138.0" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="124.0" y="84.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">DN2 (Bergman 외 2020)</text><text x="124.0" y="116.0" font-size="12" fill="#1C232C" text-anchor="middle">이미지 전역 특징만</text><text x="124.0" y="140.0" font-size="12" fill="#1C232C" text-anchor="middle">kNN 거리 = 이미지 점수</text><text x="124.0" y="170.0" font-size="12" fill="#4E5964" text-anchor="middle">위치 찾기 없음</text><line x1="224.0" y1="127.0" x2="240.0" y2="127.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="242.0" y="58.0" width="200.0" height="138.0" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="342.0" y="84.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">SPADE (이 편)</text><text x="342.0" y="116.0" font-size="12" fill="#1C232C" text-anchor="middle">전역 특징으로 K 장 고른 뒤</text><text x="342.0" y="140.0" font-size="12" fill="#1C232C" text-anchor="middle">K 장의 칸 특징과 맞대기</text><text x="342.0" y="170.0" font-size="12" fill="#4E5964" text-anchor="middle">이미지 85.5 · 픽셀 96.0</text><line x1="442.0" y1="127.0" x2="458.0" y2="127.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="460.0" y="58.0" width="200.0" height="138.0" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="560.0" y="84.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">PaDiM</text><text x="560.0" y="116.0" font-size="12" fill="#1C232C" text-anchor="middle">칸마다 가우스 하나</text><text x="560.0" y="140.0" font-size="12" fill="#1C232C" text-anchor="middle">먼저 고르는 단계 없음</text><text x="560.0" y="170.0" font-size="12" fill="#4E5964" text-anchor="middle">자리에 기댄다</text><line x1="660.0" y1="127.0" x2="676.0" y2="127.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="678.0" y="58.0" width="200.0" height="138.0" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.2"/><text x="778.0" y="84.0" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">PatchCore</text><text x="778.0" y="116.0" font-size="12" fill="#1C232C" text-anchor="middle">조각 특징 뱅크 하나</text><text x="778.0" y="140.0" font-size="12" fill="#1C232C" text-anchor="middle">먼저 고르는 단계 없음, 코어셋</text><text x="778.0" y="170.0" font-size="12" fill="#4E5964" text-anchor="middle">99.1 · 98.1</text><text x="450.0" y="226.0" font-size="12" fill="#4E5964" text-anchor="middle">PaDiM · PatchCore 칸의 값과 설명은 PatchCore 노트가 옮긴 값이고 이 편의 말이 아니다. 화살표는 읽는 순서이지 인용 관계 전부가 아니다</text><text x="450.0" y="250.0" font-size="12" fill="#4E5964" text-anchor="middle">SPADE 값은 이 편의 표 1 · 2, PatchCore 값은 코어셋 25% 의 이미지 · 픽셀 AUROC</text></svg>
