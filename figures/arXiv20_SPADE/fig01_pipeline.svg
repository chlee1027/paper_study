<svg xmlns="http://www.w3.org/2000/svg" width="940" height="352" viewBox="0 0 940 352" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="SPADE 의 두 단계 흐름"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="470.0" y="28.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">SPADE 의 두 단계 — 얼린 WRN-50-2 하나를 두 번 읽는다</text><text x="24.0" y="62.0" font-size="13" fill="#2E6B8A" text-anchor="start" font-weight="bold">1 단계: 이미지</text><rect x="24.0" y="74.0" width="150.0" height="62.0" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="99.0" y="98.0" font-size="12" fill="#1C232C" text-anchor="middle">시험 이미지 y</text><text x="99.0" y="118.0" font-size="11" fill="#4E5964" text-anchor="middle">224 x 224</text><line x1="174.0" y1="105.0" x2="212.0" y2="105.0" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><rect x="214.0" y="74.0" width="180.0" height="62.0" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="304.0" y="98.0" font-size="12" fill="#1C232C" text-anchor="middle">마지막 합성곱 전역 평균</text><text x="304.0" y="118.0" font-size="11" fill="#4E5964" text-anchor="middle">2,048 차원 f_y (식 1)</text><line x1="394.0" y1="105.0" x2="432.0" y2="105.0" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><rect x="434.0" y="74.0" width="210.0" height="62.0" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="539.0" y="98.0" font-size="12" fill="#1C232C" text-anchor="middle">학습 이미지 전부와 거리</text><text x="539.0" y="118.0" font-size="11" fill="#4E5964" text-anchor="middle">가까운 K 장의 평균 = d(y) (식 2)</text><line x1="644.0" y1="105.0" x2="682.0" y2="105.0" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><rect x="684.0" y="74.0" width="232.0" height="62.0" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2" stroke-dasharray="5,3"/><text x="800.0" y="98.0" font-size="12" fill="#1C232C" text-anchor="middle">d(y) 가 문턱 τ 보다 크면 이상</text><text x="800.0" y="118.0" font-size="11" fill="#4E5964" text-anchor="middle">τ 값은 원문에 없다, 표는 AUROC 만</text><line x1="539.0" y1="136.0" x2="539.0" y2="186.0" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="549.0" y="166.0" font-size="11" fill="#4E5964" text-anchor="start">가까운 K 장 (MVTec 50 · STC 1)</text><text x="24.0" y="176.0" font-size="13" fill="#B4552B" text-anchor="start" font-weight="bold">2 단계: 픽셀</text><rect x="434.0" y="188.0" width="210.0" height="66.0" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="539.0" y="212.0" font-size="12" fill="#1C232C" text-anchor="middle">K 장의 모든 칸 특징 = 갤러리 G</text><text x="539.0" y="232.0" font-size="11" fill="#4E5964" text-anchor="middle">블록 1 · 2 · 3 (56 · 28 · 14)</text><line x1="434.0" y1="221.0" x2="396.0" y2="221.0" stroke="#B4552B" stroke-width="1.6" marker-end="url(#ar)"/><rect x="214.0" y="188.0" width="180.0" height="66.0" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="304.0" y="212.0" font-size="12" fill="#1C232C" text-anchor="middle">칸마다 G 안 최근접 κ 개 평균</text><text x="304.0" y="232.0" font-size="11" fill="#4E5964" text-anchor="middle">d(y, p), κ = 1 (식 3)</text><line x1="214.0" y1="221.0" x2="176.0" y2="221.0" stroke="#B4552B" stroke-width="1.6" marker-end="url(#ar)"/><rect x="24.0" y="188.0" width="150.0" height="66.0" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="99.0" y="212.0" font-size="12" fill="#1C232C" text-anchor="middle">가우스 σ = 4</text><text x="99.0" y="232.0" font-size="11" fill="#4E5964" text-anchor="middle">문턱 θ 로 분할</text><rect x="24.0" y="276.0" width="892.0" height="58.0" rx="6" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1.2"/><text x="40.0" y="299.0" font-size="12" fill="#1C232C" text-anchor="start">이 그림의 점선 칸(문턱 τ)은 설계의 문이지만, 원문은 표마다 어떤 τ 로 이미지를 걸렀는지 적지 않는다.</text><text x="40.0" y="320.0" font-size="12" fill="#4E5964" text-anchor="start">표 2 · 3 의 픽셀 값이 τ 로 거른 뒤의 값인지, 시험 이미지 전부의 값인지 원문에 적혀 있지 않다.</text></svg>
