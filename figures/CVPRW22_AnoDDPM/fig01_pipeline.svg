<svg xmlns="http://www.w3.org/2000/svg" width="780" height="292" viewBox="0 0 780 292" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="부분 확산 절차와 걸음 수 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="390.0" y="28.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="600">부분 확산: 끝까지 보내지 않고 되돌림 시점 λ 까지만 보낸 뒤 되돌린다</text><rect x="30.0" y="60.0" width="120.0" height="62.0" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="90.0" y="88.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">검사 이미지 x₀</text><text x="90.0" y="105.0" font-size="10.5" fill="#4E5964" text-anchor="middle">결함 있을 수 있음</text><rect x="170.0" y="60.0" width="120.0" height="62.0" rx="6" fill="#D8E7EE" stroke="#1C232C" stroke-width="1.2"/><text x="230.0" y="88.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">잡음 낀 x_λ</text><text x="230.0" y="105.0" font-size="10.5" fill="#4E5964" text-anchor="middle">한 번에 식 (8)</text><rect x="310.0" y="60.0" width="120.0" height="62.0" rx="6" fill="#F2DED2" stroke="#1C232C" stroke-width="1.2"/><text x="370.0" y="88.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">복원 x̂₀</text><text x="370.0" y="105.0" font-size="10.5" fill="#4E5964" text-anchor="middle">역방향 λ 걸음</text><rect x="450.0" y="60.0" width="120.0" height="62.0" rx="6" fill="#FFF3C4" stroke="#1C232C" stroke-width="1.2"/><text x="510.0" y="88.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">오차 지도 E_sq</text><text x="510.0" y="105.0" font-size="10.5" fill="#4E5964" text-anchor="middle">(x₀ - x̂₀)²</text><rect x="590.0" y="60.0" width="120.0" height="62.0" rx="6" fill="#D6EEDD" stroke="#1C232C" stroke-width="1.2"/><text x="650.0" y="88.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">분할 E_seg</text><text x="650.0" y="105.0" font-size="10.5" fill="#4E5964" text-anchor="middle">E_sq &gt; 0.5</text><line x1="150.0" y1="91.0" x2="168.0" y2="91.0" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><line x1="290.0" y1="91.0" x2="308.0" y2="91.0" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><line x1="430.0" y1="91.0" x2="448.0" y2="91.0" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><line x1="570.0" y1="91.0" x2="588.0" y2="91.0" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><text x="390.0" y="158.0" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="600">역방향 걸음 수 비교 (T = 1000 기준, 내가 센 비율)</text><rect x="160.0" y="172.0" width="480.0" height="20.0" fill="#7A8590"/><text x="400.0" y="187.0" font-size="11.5" fill="#FFFFFF" text-anchor="middle">전체 사슬 1000 걸음</text><rect x="160.0" y="202.0" width="120.0" height="20.0" fill="#B4552B"/><text x="288.0" y="217.0" font-size="11.5" fill="#1C232C" text-anchor="start">뇌 영상 λ = 250 은 전체의 0.25</text><rect x="160.0" y="232.0" width="72.0" height="20.0" fill="#2E6B8A"/><text x="240.0" y="247.0" font-size="11.5" fill="#1C232C" text-anchor="start">MVTec 가죽 λ = 150 은 전체의 0.15</text><text x="390.0" y="276.0" font-size="12" fill="#C0392B" text-anchor="middle">원문이 적은 비용은 차수 O(λ) 뿐이고 초 · 분 단위 시간은 7쪽 어디에도 적혀 있지 않다</text></svg>
