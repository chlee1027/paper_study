640.0" y="204.0" width="110.0" height="40.0" rx="0" fill="#F6F7F5" stroke="#CFD6D3" stroke-width="1"/><text x="695.0" y="229.0" font-size="10.8" fill="#1C232C" text-anchor="middle">저자 본문</text><text x="390.0" y="262.0" font-size="12" fill="#4E5964" text-anchor="middle">문턱 0.5 는 넷에 같게 적혀 있으나 입력 크기와 재구성 값의 범위가 다르다. 재구성 값의 범위는 원문에 없다</text></svg>
