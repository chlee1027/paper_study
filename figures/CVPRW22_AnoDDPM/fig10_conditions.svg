<svg xmlns="http://www.w3.org/2000/svg" width="780" height="280" viewBox="0 0 780 280" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 1 네 행의 조건 비교"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker></defs><text x="390.0" y="28.0" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="600">표 1 의 네 행은 같은 조건이 아니다</text><rect x="30.0" y="54.0" width="160.0" height="30.0" rx="0" fill="#D8E7EE" stroke="#CFD6D3" stroke-width="1"/><text x="110.0" y="74.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">행</text><rect x="190.0" y="54.0" width="100.0" height="30.0" rx="0" fill="#D8E7EE" stroke="#CFD6D3" stroke-width="1"/><text x="240.0" y="74.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">입력 크기</text><rect x="290.0" y="54.0" width="190.0" height="30.0" rx="0" fill="#D8E7EE" stroke="#CFD6D3" stroke-width="1"/><text x="385.0" y="74.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">점수를 매긴 픽셀</text><rect x="480.0" y="54.0" width="160.0" height="30.0" rx="0" fill="#D8E7EE" stroke="#CFD6D3" stroke-width="1"/><text x="560.0" y="74.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">λ 또는 설정</text><rect x="640.0" y="54.0" width="110.0" height="30.0" rx="0" fill="#D8E7EE" stroke="#CFD6D3" stroke-width="1"/><text x="695.0" y="74.0" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">출처</text><rect x="30.0"