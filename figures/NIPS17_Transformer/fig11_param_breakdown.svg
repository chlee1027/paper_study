<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="base와 big 모델의 파라미터 내역"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="430.0" y="28" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">그림 11. base · big 파라미터를 층 · 폭 · 어휘(37,000, 공유 1 개)로 다시 센 것 (내가 센 것)</text><line x1="160.0" y1="70" x2="160.0" y2="270" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="160.0" y="285" font-size="10" fill="#7A8590" text-anchor="middle">0M</text><line x1="277.3913043478261" y1="70" x2="277.3913043478261" y2="270" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="277.3913043478261" y="285" font-size="10" fill="#7A8590" text-anchor="middle">50M</text><line x1="394.7826086956522" y1="70" x2="394.7826086956522" y2="270" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="394.7826086956522" y="285" font-size="10" fill="#7A8590" text-anchor="middle">100M</text><line x1="512.1739130434783" y1="70" x2="512.1739130434783" y2="270" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="512.1739130434783" y="285" font-size="10" fill="#7A8590" text-anchor="middle">150M</text><line x1="629.5652173913044" y1="70" x2="629.5652173913044" y2="270" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="629.5652173913044" y="285" font-size="10" fill="#7A8590" text-anchor="middle">200M</text><text x="148" y="114" font-size="13" fill="#1C232C" text-anchor="end" font-weight="bold">base</text><rect x="160" y="90" width="44.47721739130435" height="36" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><rect x="204.47721739130435" y="90" width="44.40749634782608" height="36" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><rect x="248.88471373913043" y="90" width="59.222015999999996" height="36" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="160" y="144" font-size="10.5" fill="#4E5964" text-anchor="start">낱말 표 18.94M · 인코더 18.91M · 디코더 25.22M</text><text x="316.1067297391304" y="105" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">합 63.08M</text><text x="316.1067297391304" y="122" font-size="11.5" fill="#C0392B" text-anchor="start">원문 표 3: 65M</text><line x1="312.6086956521739" y1="84" x2="312.6086956521739" y2="132" stroke="#C0392B" stroke-width="2"/><text x="148" y="204" font-size="13" fill="#1C232C" text-anchor="end" font-weight="bold">big</text><rect x="160" y="180" width="88.9544347826087" height="36" rx="2" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><rect x="248.9544347826087" y="180" width="177.44245982608697" height="36" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><rect x="426.3968946086957" y="180" width="236.61398817391307" height="36" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="160" y="234" font-size="10.5" fill="#4E5964" text-anchor="start">낱말 표 37.89M · 인코더 75.58M · 디코더 100.78M</text><text x="671.0108827826087" y="195" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">합 214.25M</text><text x="671.0108827826087" y="212" font-size="11.5" fill="#C0392B" text-anchor="start">원문 표 3: 213M</text><line x1="660.0869565217391" y1="174" x2="660.0869565217391" y2="222" stroke="#C0392B" stroke-width="2"/><text x="60" y="320" font-size="11" fill="#4E5964" text-anchor="start">층 하나: 주의 = 4·d² + 치우침 4·d, FFN = 2·d·d_ff + d_ff + d, 층 정규화 2·d 씩. 디코더 층은 주의 둘 · 정규화 셋.</text><text x="60" y="340" font-size="11" fill="#4E5964" text-anchor="start">낱말 표는 원문 3.4절대로 원문 쪽 · 번역 쪽 낱말 표와 소프트맥스 앞 선형이 무게 하나를 나눈다고 두었다.</text><text x="60" y="360" font-size="11" fill="#C0392B" text-anchor="start">base 는 1.92M 모자라고(63.08 대 65), big 은 1.25M 넘친다(214.25 대 213). 어휘 하나로 둘 다 맞출 수 없다(그림 12).</text></svg>
