<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="인코더 층과 디코더 층의 부분층 구성"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="430.0" y="28" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">그림 1. 인코더 층 하나와 디코더 층 하나 — 덧셈 뒤 정규화, 층마다 같은 모양을 6 번 쌓는다</text><rect x="60" y="70" width="300" height="330" rx="10" fill="none" stroke="#2E6B8A" stroke-width="1.6" stroke-dasharray="6 4"/><text x="50" y="240" font-size="14" fill="#2E6B8A" text-anchor="end" font-weight="bold">× 6</text><text x="210.0" y="62" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="bold">인코더 층 (원문 3.1절)</text><text x="210.0" y="430" font-size="11" fill="#4E5964" text-anchor="middle">입력: 자리 n 개 × 512 (낱말 표 · √512 + 자리 부호화)</text><line x1="210.0" y1="418" x2="210.0" y2="398" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="80" y="300" width="260" height="46" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="210.0" y="320" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="bold">여러 머리 자기 주의</text><text x="210.0" y="337" font-size="10.5" fill="#4E5964" text-anchor="middle">머리 8 개 × 64, 질의 · 키 · 값 모두 아래층에서</text><rect x="80" y="262" width="260" height="24" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="210.0" y="278" font-size="10.5" fill="#1C232C" text-anchor="middle">LayerNorm(x + 부분층(x))</text><rect x="80" y="170" width="260" height="46" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="210.0" y="190" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="bold">자리별 앞먹임 (FFN)</text><text x="210.0" y="207" font-size="10.5" fill="#4E5964" text-anchor="middle">512 -&gt; 2048 -&gt; 512, ReLU, 자리마다 같은 무게</text><rect x="80" y="132" width="260" height="24" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="210.0" y="148" font-size="10.5" fill="#1C232C" text-anchor="middle">LayerNorm(x + 부분층(x))</text><line x1="210.0" y1="300" x2="210.0" y2="288" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="210.0" y1="262" x2="210.0" y2="218" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="210.0" y1="170" x2="210.0" y2="158" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="210.0" y1="132" x2="210.0" y2="92" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><path d="M210,352 L352,352 L352,274" fill="none" stroke="#1E8449" stroke-width="1.4" marker-end="url(#ao)"/><path d="M210,228 L352,228 L352,144" fill="none" stroke="#1E8449" stroke-width="1.4" marker-end="url(#ao)"/><text x="358" y="318" font-size="10.5" fill="#1E8449" text-anchor="start">지름길</text><text x="210.0" y="84" font-size="11" fill="#2E6B8A" text-anchor="middle">출력: n × 512  -&gt;  디코더의 키 · 값</text><rect x="480" y="70" width="330" height="400" rx="10" fill="none" stroke="#B4552B" stroke-width="1.6" stroke-dasharray="6 4"/><text x="820" y="280" font-size="14" fill="#B4552B" text-anchor="start" font-weight="bold">× 6</text><text x="645.0" y="62" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="bold">디코더 층</text><text x="645.0" y="500" font-size="11" fill="#4E5964" text-anchor="middle">입력: 지금까지 낸 출력을 한 자리 밀어 넣은 것 (shifted right)</text><line x1="645.0" y1="488" x2="645.0" y2="468" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="500" y="420" width="290" height="46" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="645.0" y="440" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="bold">가린 여러 머리 자기 주의</text><text x="645.0" y="457" font-size="10.5" fill="#4E5964" text-anchor="middle">자리 i 는 1 ~ i 만 본다 (뒤쪽 점수 = −∞)</text><rect x="500" y="382" width="290" height="24" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="645.0" y="398" font-size="10.5" fill="#1C232C" text-anchor="middle">LayerNorm(x + 부분층(x))</text><rect x="500" y="296" width="290" height="46" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.4"/><text x="645.0" y="316" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="bold">인코더-디코더 주의</text><text x="645.0" y="333" font-size="10.5" fill="#4E5964" text-anchor="middle">질의 = 디코더, 키 · 값 = 인코더 마지막 층</text><rect x="500" y="258" width="290" height="24" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="645.0" y="274" font-size="10.5" fill="#1C232C" text-anchor="middle">LayerNorm(x + 부분층(x))</text><rect x="500" y="172" width="290" height="46" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="645.0" y="192" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="bold">자리별 앞먹임 (FFN)</text><text x="645.0" y="209" font-size="10.5" fill="#4E5964" text-anchor="middle">512 -&gt; 2048 -&gt; 512</text><rect x="500" y="134" width="290" height="24" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="645.0" y="150" font-size="10.5" fill="#1C232C" text-anchor="middle">LayerNorm(x + 부분층(x))</text><line x1="645.0" y1="420" x2="645.0" y2="408" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="645.0" y1="382" x2="645.0" y2="344" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="645.0" y1="296" x2="645.0" y2="284" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="645.0" y1="258" x2="645.0" y2="220" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="645.0" y1="172" x2="645.0" y2="160" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><line x1="645.0" y1="134" x2="645.0" y2="96" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="645.0" y="88" font-size="11" fill="#B4552B" text-anchor="middle">선형 (낱말 표와 같은 무게) -&gt; 소프트맥스</text><path d="M360,100 C420,100 420,318 500,318" fill="none" stroke="#9A7B00" stroke-width="1.6" marker-end="url(#ac)"/><text x="430" y="210" font-size="11" fill="#9A7B00" text-anchor="start">키 · 값</text><text x="40" y="530" font-size="11" fill="#4E5964" text-anchor="start">부분층마다 출력 = LayerNorm(x + Dropout(부분층(x))). 정규화가 덧셈 「뒤」 에 있다(원문 식 그대로). 모든 부분층과 낱말 표의 출력 폭은 d_model = 512.</text></svg>
