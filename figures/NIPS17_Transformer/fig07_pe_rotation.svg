<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="자리 부호화에서 자리 이동이 회전이 되는 것"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="410.0" y="28" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">그림 7. PE(pos + k) 는 PE(pos) 에 k 만으로 정해지는 회전 행렬을 곱한 것 (내가 유도한 것)</text><circle cx="190" cy="210" r="120" fill="none" stroke="#CFD6D3" stroke-width="1.4"/><line x1="55" y1="210" x2="325" y2="210" stroke="#CFD6D3" stroke-width="1"/><line x1="190" y1="75" x2="190" y2="345" stroke="#CFD6D3" stroke-width="1"/><text x="328" y="214" font-size="10.5" fill="#7A8590" text-anchor="start">sin</text><text x="194" y="72" font-size="10.5" fill="#7A8590" text-anchor="start">cos</text><line x1="190" y1="210" x2="299.1156912190818" y2="259.9376203856571" stroke="#2E6B8A" stroke-width="2" marker-end="url(#af)"/><text x="311.1156912190818" y="263.9376203856571" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="bold">PE(2)</text><line x1="190" y1="210" x2="74.92908704042338" y2="175.96053774441285" stroke="#B4552B" stroke-width="2" marker-end="url(#ar)"/><text x="62.92908704042338" y="179.96053774441285" font-size="12" fill="#B4552B" text-anchor="end" font-weight="bold">PE(5)</text><text x="190" y="370" font-size="11" fill="#4E5964" text-anchor="middle">ω = 1 (i = 0 차원 짝), pos = 2, k = 3</text><text x="380" y="80" font-size="11.5" fill="#1C232C" text-anchor="start">한 차원 짝 (sin ωpos, cos ωpos) 에 대해</text><text x="380" y="100" font-size="11.5" fill="#4E5964" text-anchor="start">sin(ω(pos+k)) = sin ωpos · cos ωk + cos ωpos · sin ωk</text><text x="380" y="120" font-size="11.5" fill="#4E5964" text-anchor="start">cos(ω(pos+k)) = cos ωpos · cos ωk − sin ωpos · sin ωk</text><text x="380" y="140" font-size="11.5" fill="#4E5964" text-anchor="start"></text><text x="380" y="160" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">곧  PE(pos+k) = M_k · PE(pos),</text><text x="380" y="180" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">M_k = [[cos ωk, sin ωk], [−sin ωk, cos ωk]]</text><text x="380" y="200" font-size="11.5" fill="#4E5964" text-anchor="start"></text><text x="380" y="220" font-size="11.5" fill="#2E6B8A" text-anchor="start">예: PE(2) = (0.909, -0.416)</text><text x="380" y="240" font-size="11.5" fill="#B4552B" text-anchor="start">     M_3 · PE(2) = (-0.959, 0.284) = PE(5)</text><text x="380" y="260" font-size="11.5" fill="#4E5964" text-anchor="start"></text><text x="380" y="280" font-size="11.5" fill="#4E5964" text-anchor="start">M_k 는 pos 와 무관하다 — 원문의 「고정된 k 에 대해</text><text x="380" y="300" font-size="11.5" fill="#4E5964" text-anchor="start">PE(pos+k) 를 PE(pos) 의 선형 함수로 나타낼 수 있다」.</text><text x="380" y="320" font-size="11.5" fill="#4E5964" text-anchor="start">이것은 수의 사실이고, 모델이 이 길을 실제로 쓰는지는</text><text x="380" y="340" font-size="11.5" fill="#4E5964" text-anchor="start">원문이 재지 않았다(가설로 적었다).</text></svg>
