<svg xmlns="http://www.w3.org/2000/svg" width="820" height="380" viewBox="0 0 820 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="여러 머리 주의에서 머리 수를 바꿔도 같은 계산량"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="410.0" y="28" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">그림 4. 512 폭을 머리 h 개로 나눠도 투영 무게 수와 QKᵀ 곱셈 수는 그대로다 (내가 센 것)</text><rect x="60" y="70" width="640" height="30" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="380.0" y="90" font-size="12" fill="#2E6B8A" text-anchor="middle">질의 하나 = 512 개의 수 (d_model)</text><rect x="62.0" y="120" width="76.0" height="30" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="100.0" y="140" font-size="11" fill="#9A7B00" text-anchor="middle">머리 1: 64</text><rect x="142.0" y="120" width="76.0" height="30" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="180.0" y="140" font-size="11" fill="#9A7B00" text-anchor="middle">머리 2: 64</text><rect x="222.0" y="120" width="76.0" height="30" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="260.0" y="140" font-size="11" fill="#9A7B00" text-anchor="middle">머리 3: 64</text><rect x="302.0" y="120" width="76.0" height="30" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="340.0" y="140" font-size="11" fill="#9A7B00" text-anchor="middle">머리 4: 64</text><rect x="382.0" y="120" width="76.0" height="30" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="420.0" y="140" font-size="11" fill="#9A7B00" text-anchor="middle">머리 5: 64</text><rect x="462.0" y="120" width="76.0" height="30" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="500.0" y="140" font-size="11" fill="#9A7B00" text-anchor="middle">머리 6: 64</text><rect x="542.0" y="120" width="76.0" height="30" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="580.0" y="140" font-size="11" fill="#9A7B00" text-anchor="middle">머리 7: 64</text><rect x="622.0" y="120" width="76.0" height="30" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="660.0" y="140" font-size="11" fill="#9A7B00" text-anchor="middle">머리 8: 64</text><text x="710" y="140" font-size="11.5" fill="#9A7B00" text-anchor="start">h = 8, d_k = 64</text><line x1="380.0" y1="102" x2="380.0" y2="118" stroke="#4E5964" stroke-width="1.2" marker-end="url(#ai)"/><text x="388.0" y="114" font-size="10.5" fill="#4E5964" text-anchor="start">학습하는 투영 W_i^Q (512 × 64) 로 머리마다 따로</text><text x="70" y="200" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">h</text><text x="150" y="200" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">d_k = d_v</text><text x="250" y="200" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">h · d_k</text><text x="350" y="200" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">투영 무게 (W^Q,K,V,O)</text><text x="540" y="200" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">QKᵀ 곱셈 (자리 n 개)</text><text x="720" y="200" font-size="11.5" fill="#1C232C" text-anchor="start" font-weight="bold">표 3 BLEU</text><text x="70" y="224" font-size="11.5" fill="#4E5964" text-anchor="start">1</text><text x="150" y="224" font-size="11.5" fill="#4E5964" text-anchor="start">512</text><text x="250" y="224" font-size="11.5" fill="#4E5964" text-anchor="start">512</text><text x="350" y="224" font-size="11.5" fill="#4E5964" text-anchor="start">4 × 512 × 512 = 1,048,576</text><text x="540" y="224" font-size="11.5" fill="#4E5964" text-anchor="start">1 × 512 × n² = 512 · n²</text><text x="720" y="224" font-size="11.5" fill="#9A7B00" text-anchor="start">24.9</text><text x="70" y="248" font-size="11.5" fill="#4E5964" text-anchor="start">4</text><text x="150" y="248" font-size="11.5" fill="#4E5964" text-anchor="start">128</text><text x="250" y="248" font-size="11.5" fill="#4E5964" text-anchor="start">512</text><text x="350" y="248" font-size="11.5" fill="#4E5964" text-anchor="start">4 × 512 × 512 = 1,048,576</text><text x="540" y="248" font-size="11.5" fill="#4E5964" text-anchor="start">4 × 128 × n² = 512 · n²</text><text x="720" y="248" font-size="11.5" fill="#9A7B00" text-anchor="start">25.5</text><text x="70" y="272" font-size="11.5" fill="#1C232C" text-anchor="start">8</text><text x="150" y="272" font-size="11.5" fill="#1C232C" text-anchor="start">64</text><text x="250" y="272" font-size="11.5" fill="#1C232C" text-anchor="start">512</text><text x="350" y="272" font-size="11.5" fill="#1C232C" text-anchor="start">4 × 512 × 512 = 1,048,576</text><text x="540" y="272" font-size="11.5" fill="#1C232C" text-anchor="start">8 × 64 × n² = 512 · n²</text><text x="720" y="272" font-size="11.5" fill="#9A7B00" text-anchor="start">25.8  (base)</text><text x="70" y="296" font-size="11.5" fill="#4E5964" text-anchor="start">16</text><text x="150" y="296" font-size="11.5" fill="#4E5964" text-anchor="start">32</text><text x="250" y="296" font-size="11.5" fill="#4E5964" text-anchor="start">512</text><text x="350" y="296" font-size="11.5" fill="#4E5964" text-anchor="start">4 × 512 × 512 = 1,048,576</text><text x="540" y="296" font-size="11.5" fill="#4E5964" text-anchor="start">16 × 32 × n² = 512 · n²</text><text x="720" y="296" font-size="11.5" fill="#9A7B00" text-anchor="start">25.8</text><text x="70" y="320" font-size="11.5" fill="#4E5964" text-anchor="start">32</text><text x="150" y="320" font-size="11.5" fill="#4E5964" text-anchor="start">16</text><text x="250" y="320" font-size="11.5" fill="#4E5964" text-anchor="start">512</text><text x="350" y="320" font-size="11.5" fill="#4E5964" text-anchor="start">4 × 512 × 512 = 1,048,576</text><text x="540" y="320" font-size="11.5" fill="#4E5964" text-anchor="start">32 × 16 × n² = 512 · n²</text><text x="720" y="320" font-size="11.5" fill="#9A7B00" text-anchor="start">25.4</text><text x="60" y="350" font-size="11" fill="#4E5964" text-anchor="start">같은 것: 투영 무게 1,048,576 개(치우침 빼고), QKᵀ 와 (무게)·V 의 곱셈 수. 다른 것: 소프트맥스를 h 번(자리 n × n 개씩) 한다.</text></svg>
