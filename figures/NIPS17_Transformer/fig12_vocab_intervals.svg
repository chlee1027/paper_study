<svg xmlns="http://www.w3.org/2000/svg" width="860" height="470" viewBox="0 0 860 470" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="표 3 파라미터 수에서 역산한 어휘 크기 구간"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="430.0" y="28" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">그림 12. 표 3 의 params(반올림한 정수 M) 가 허락하는 공유 어휘 크기 — 줄마다 구간 (내가 센 것)</text><line x1="250.0" y1="60" x2="250.0" y2="356" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="250.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">34,000</text><line x1="360.0" y1="60" x2="360.0" y2="356" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="360.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">36,000</text><line x1="470.0" y1="60" x2="470.0" y2="356" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="470.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">38,000</text><line x1="580.0" y1="60" x2="580.0" y2="356" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="580.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">40,000</text><line x1="690.0" y1="60" x2="690.0" y2="356" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="690.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">42,000</text><line x1="800.0" y1="60" x2="800.0" y2="356" stroke="#CFD6D3" stroke-width="0.8" stroke-dasharray="2 3"/><text x="800.0" y="372" font-size="10" fill="#7A8590" text-anchor="middle">44,000</text><rect x="631.2084375" y="60" width="12.636250000000018" height="296" rx="0" fill="#D6EEDD" stroke="#1E8449" stroke-width="1"/><line x1="415.0" y1="56" x2="415.0" y2="356" stroke="#9A7B00" stroke-width="1.6" stroke-dasharray="5 3"/><text x="415.0" y="52" font-size="10.5" fill="#9A7B00" text-anchor="middle">본문 「약 37000」</text><text x="240" y="78" font-size="10.5" fill="#2E6B8A" text-anchor="end">base  (65M)</text><line x1="567.2709375" y1="74" x2="674.6928125" y2="74" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="104" font-size="10.5" fill="#2E6B8A" text-anchor="end">(B) d_k=16  (58M)</text><line x1="577.1228125" y1="100" x2="684.5446875" y2="100" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="130" font-size="10.5" fill="#2E6B8A" text-anchor="end">(B) d_k=32  (60M)</text><line x1="538.0315625000001" y1="126" x2="645.4534375000001" y2="126" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="156" font-size="10.5" fill="#2E6B8A" text-anchor="end">(C) N=2  (36M)</text><line x1="612.9965625" y1="152" x2="720.4184375" y2="152" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="182" font-size="10.5" fill="#2E6B8A" text-anchor="end">(C) N=4  (50M)</text><line x1="536.4228125" y1="178" x2="643.8446875" y2="178" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="208" font-size="10.5" fill="#2E6B8A" text-anchor="end">(C) N=8  (80M)</text><line x1="598.1190624999999" y1="204" x2="705.5409374999999" y2="204" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="234" font-size="10.5" fill="#2E6B8A" text-anchor="end">(C) d_model=256, d_k=d_v=32  (28M)</text><line x1="557.8831250000001" y1="230" x2="772.726875" y2="230" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="260" font-size="10.5" fill="#2E6B8A" text-anchor="end">(C) d_model=1024, d_k=d_v=128  (168M)</text><line x1="608.94203125" y1="256" x2="662.65296875" y2="256" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="286" font-size="10.5" fill="#2E6B8A" text-anchor="end">(C) d_ff=1024  (53M)</text><line x1="631.2084375" y1="282" x2="738.6303125" y2="282" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="312" font-size="10.5" fill="#2E6B8A" text-anchor="end">(C) d_ff=4096  (90M)</text><line x1="546.8178125" y1="308" x2="654.2396875" y2="308" stroke="#2E6B8A" stroke-width="5"/><text x="240" y="338" font-size="10.5" fill="#C0392B" text-anchor="end">big (300K 걸음)  (213M)</text><line x1="321.25421875" y1="334" x2="374.96515625" y2="334" stroke="#C0392B" stroke-width="5"/><text x="60" y="400" font-size="11" fill="#1E8449" text-anchor="start">초록 띠: big 을 뺀 열 줄이 함께 허락하는 어휘 40,931 ~ 41,161. 본문의 37,000 은 이 띠 밖이다.</text><text x="60" y="420" font-size="11" fill="#C0392B" text-anchor="start">big 줄만 35,296 ~ 36,272 를 요구해 띠와 겹치지 않는다. 치우침 · 정규화를 빼거나 낱말 표를 2 · 3 개로 세도 열한 줄 모두를 맞추는 어휘는 없었다.</text><text x="60" y="440" font-size="11" fill="#4E5964" text-anchor="start">원문은 정확한 어휘 수와 params 를 셈한 방식을 적지 않았다 — 이 그림은 「어긋난다」 까지만 말한다.</text></svg>
