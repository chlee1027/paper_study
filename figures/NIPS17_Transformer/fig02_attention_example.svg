<svg xmlns="http://www.w3.org/2000/svg" width="820" height="360" viewBox="0 0 820 360" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="비율 맞춘 내적 주의의 작은 계산 예"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="410.0" y="28" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">그림 2. 질의 하나 · 키 셋 · 값 셋으로 식 (1) 을 손으로 한 번 (d_k = 4, 내가 고른 수)</text><text x="60" y="70" font-size="13" fill="#2E6B8A" text-anchor="start" font-weight="bold">질의 q = (1, 0, 1, 0)</text><text x="60" y="105" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">키</text><text x="250" y="105" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">q · k</text><text x="360" y="105" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">÷ √4</text><text x="470" y="105" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">소프트맥스 무게</text><text x="570" y="105" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold"></text><text x="690" y="105" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">값 v</text><text x="60" y="140" font-size="12.5" fill="#4E5964" text-anchor="start">k1 = (1, 0, 1, 0)</text><text x="250" y="140" font-size="12.5" fill="#1C232C" text-anchor="start">2</text><text x="360" y="140" font-size="12.5" fill="#1C232C" text-anchor="start">1.0</text><rect x="470" y="126" width="91.16647039001772" height="18" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="569.1664703900177" y="140" font-size="12" fill="#9A7B00" text-anchor="start">0.506</text><text x="690" y="140" font-size="12.5" fill="#B4552B" text-anchor="start">v1 = (1, 0)</text><text x="60" y="192" font-size="12.5" fill="#4E5964" text-anchor="start">k2 = (0, 1, 0, 1)</text><text x="250" y="192" font-size="12.5" fill="#1C232C" text-anchor="start">0</text><text x="360" y="192" font-size="12.5" fill="#1C232C" text-anchor="start">0.0</text><rect x="470" y="178" width="33.53827018065257" height="18" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="511.53827018065255" y="192" font-size="12" fill="#9A7B00" text-anchor="start">0.186</text><text x="690" y="192" font-size="12.5" fill="#B4552B" text-anchor="start">v2 = (0, 1)</text><text x="60" y="244" font-size="12.5" fill="#4E5964" text-anchor="start">k3 = (1, 1, 0, 0)</text><text x="250" y="244" font-size="12.5" fill="#1C232C" text-anchor="start">1</text><text x="360" y="244" font-size="12.5" fill="#1C232C" text-anchor="start">0.5</text><rect x="470" y="230" width="55.295259429329704" height="18" rx="3" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1"/><text x="533.2952594293297" y="244" font-size="12" fill="#9A7B00" text-anchor="start">0.307</text><text x="690" y="244" font-size="12.5" fill="#B4552B" text-anchor="start">v3 = (1, 1)</text><line x1="60" y1="290" x2="790" y2="290" stroke="#CFD6D3" stroke-width="1"/><text x="60" y="318" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">출력 = Σ 무게 × 값 = 0.506·(1,0) + 0.186·(0,1) + 0.307·(1,1) = (0.814, 0.494)</text><text x="60" y="342" font-size="11" fill="#4E5964" text-anchor="start">질의와 가장 닮은 키(k1)의 값이 가장 많이 섞이지만, 나머지 둘도 0.49 를 나눠 받는다 — 원문이 「가중 평균」 이라 부르는 것.</text></svg>
