<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="순차 데이터 갈래의 계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="450.0" y="28" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="bold">그림 15. 순차 데이터 갈래 — 앞 편의 한계를 다음 편이 받는다</text><rect x="30" y="80" width="190" height="54" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="125" y="102" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="bold">Elman 1990</text><text x="125" y="121" font-size="10.5" fill="#4E5964" text-anchor="middle">은닉을 복사해 되먹임</text><rect x="250" y="80" width="190" height="54" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="345" y="102" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="bold">LSTM 1997</text><text x="345" y="121" font-size="10.5" fill="#4E5964" text-anchor="middle">오차 배율 1.0 셀 · 곱셈 문</text><rect x="470" y="80" width="190" height="54" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="565" y="102" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="bold">Cho 외 2014</text><text x="565" y="121" font-size="10.5" fill="#4E5964" text-anchor="middle">인코더-디코더 · 문 둘 유닛</text><rect x="690" y="80" width="190" height="54" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.4"/><text x="785" y="102" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="bold">seq2seq 2014</text><text x="785" y="121" font-size="10.5" fill="#4E5964" text-anchor="middle">4 층 LSTM · 벡터 하나</text><rect x="690" y="200" width="190" height="54" rx="6" fill="#F6F7F5" stroke="#9A7B00" stroke-width="1.4"/><text x="785" y="222" font-size="12.5" fill="#9A7B00" text-anchor="middle" font-weight="bold">Bahdanau 외 2015</text><text x="785" y="241" font-size="10.5" fill="#4E5964" text-anchor="middle">디코더 걸음마다 원문 자리에 무게</text><rect x="380" y="200" width="190" height="54" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.4"/><text x="475" y="222" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="bold">이 편 2017</text><text x="475" y="241" font-size="10.5" fill="#4E5964" text-anchor="middle">되먹임 없이 주의만</text><rect x="150" y="300" width="190" height="54" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.4"/><text x="245" y="322" font-size="12.5" fill="#1E8449" text-anchor="middle" font-weight="bold">이미지로</text><text x="245" y="341" font-size="10.5" fill="#4E5964" text-anchor="middle">원문 7절 「다른 형식」</text><rect x="450" y="300" width="190" height="54" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.4"/><text x="545" y="322" font-size="12.5" fill="#1E8449" text-anchor="middle" font-weight="bold">긴 입력으로</text><text x="545" y="341" font-size="10.5" fill="#4E5964" text-anchor="middle">원문 4 · 7절 「제한된 주의」</text><rect x="700" y="300" width="190" height="54" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.4"/><text x="795" y="322" font-size="12.5" fill="#1E8449" text-anchor="middle" font-weight="bold">생성을 덜 순차로</text><text x="795" y="341" font-size="10.5" fill="#4E5964" text-anchor="middle">원문 7절</text><line x1="220" y1="107" x2="248" y2="107" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="440" y1="107" x2="468" y2="107" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="660" y1="107" x2="688" y2="107" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="785" y1="134" x2="785" y2="198" stroke="#9A7B00" stroke-width="1.4" marker-end="url(#ac)"/><line x1="690" y1="227" x2="572" y2="227" stroke="#2E6B8A" stroke-width="1.4" marker-end="url(#af)"/><line x1="430" y1="254" x2="250" y2="298" stroke="#1E8449" stroke-width="1.2" marker-end="url(#ao)"/><line x1="475" y1="254" x2="540" y2="298" stroke="#1E8449" stroke-width="1.2" marker-end="url(#ao)"/><line x1="520" y1="254" x2="790" y2="298" stroke="#1E8449" stroke-width="1.2" marker-end="url(#ao)"/><text x="795" y="170" font-size="10.5" fill="#9A7B00" text-anchor="start">고정 길이 벡터 병목</text><text x="631" y="218" font-size="10.5" fill="#2E6B8A" text-anchor="middle">되먹임을 뺀다</text><text x="450.0" y="382" font-size="11" fill="#4E5964" text-anchor="middle">아래 줄 셋은 원문이 스스로 적은 다음 할 일이다. 어느 편이 그 자리를 받았는지는 이 노트 「다음에 읽을 것」 에 적는다.</text></svg>
