" text-anchor="middle">같은 양만큼 따라 옮겨진다.</text><text x="721" y="182" font-size="11.5" fill="#4E5964" text-anchor="middle">부분 표본이 그 이동을 반으로</text><text x="721" y="200" font-size="11.5" fill="#4E5964" text-anchor="middle">깎아, 층을 쌓을수록 자리 정밀도가</text><text x="721" y="218" font-size="11.5" fill="#4E5964" text-anchor="middle">떨어지고 견디는 폭이 는다.</text><rect x="614" y="236" width="214" height="104" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2"/><text x="721" y="258" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">논문이 적는 견디는 범위 셋</text><text x="721" y="280" font-size="11" fill="#4E5964" text-anchor="middle">크기 약 2 배까지</text><text x="721" y="298" font-size="11" fill="#4E5964" text-anchor="middle">세로 이동 글자 높이의 절반쯤</text><text x="721" y="316" font-size="11" fill="#4E5964" text-anchor="middle">회전 위아래 30 도까지</text><text x="721" y="334" font-size="10.5" fill="#C0392B" text-anchor="middle" font-weight="600">셋 다 「추정된다」로만 적혀 있다</text></svg>
