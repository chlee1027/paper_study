<svg xmlns="http://www.w3.org/2000/svg" width="870" height="396" viewBox="0 0 870 396" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="국소 수용장 · 가중치 공유 · 부분 표본 뽑기 셋과 각각의 작은 예시"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="b1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker></defs><text x="430" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">합성곱 망을 이루는 생각 셋 — 논문 II-A</text><rect x="24" y="46" width="266" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="157" y="70" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="600">하나. 국소 수용장</text><line x1="70" y1="86" x2="70" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="80" y1="86" x2="80" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="90" y1="86" x2="90" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="100" y1="86" x2="100" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="110" y1="86" x2="110" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="120" y1="86" x2="120" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="130" y1="86" x2="130" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="140" y1="86" x2="140" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="150" y1="86" x2="150" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="160" y1="86" x2="160" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="170" y1="86" x2="170" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="86" x2="170" y2="86" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="96" x2="170" y2="96" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="106" x2="170" y2="106" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="116" x2="170" y2="116" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="126" x2="170" y2="126" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="136" x2="170" y2="136" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="146" x2="170" y2="146" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="156" x2="170" y2="156" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="166" x2="170" y2="166" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="176" x2="170" y2="176" stroke="#CFD6D3" stroke-width="0.6"/><line x1="70" y1="186" x2="170" y2="186" stroke="#CFD6D3" stroke-width="0.6"/><rect x="90" y="106" width="50" height="50" rx="2" fill="none" stroke="#2E6B8A" stroke-width="2.0"/><line x1="170" y1="111" x2="214" y2="111" stroke="#2E6B8A" stroke-width="1.2" marker-end="url(#b1)"/><circle cx="228" cy="111" r="11" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="157" y="206" font-size="11.5" fill="#4E5964" text-anchor="middle">유닛 하나가 앞 층의 5 x 5 = 25 개만 본다</text><text x="157" y="226" font-size="11.5" fill="#4E5964" text-anchor="middle">모서리 · 끝점 · 모퉁이 같은 기초 특징이</text><text x="157" y="244" font-size="11.5" fill="#4E5964" text-anchor="middle">국소 연결에서 나온다</text><text x="157" y="272" font-size="11" fill="#7A8590" text-anchor="middle">근거: Hubel 과 Wiesel 의 고양이 시각계</text><rect x="300" y="46" width="266" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="433" y="70" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">둘. 가중치 공유</text><rect x="340" y="92" width="40" height="40" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="360" y="117" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600" font-style="italic">w</text><rect x="390" y="92" width="40" height="40" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="410" y="117" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600" font-style="italic">w</text><rect x="440" y="92" width="40" height="40" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="460" y="117" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600" font-style="italic">w</text><text x="433" y="150" font-size="11" fill="#7A8590" text-anchor="middle">자리가 달라도 값이 같은 가중치 한 벌</text><rect x="340" y="164" width="186" height="46" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.2"/><text x="433" y="184" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">유닛 784 개 · 학습되는 값 26 개</text><text x="433" y="202" font-size="10.5" fill="#4E5964" text-anchor="middle">(5 x 5 = 25 에 바이어스 1)</text><text x="433" y="230" font-size="11.5" fill="#4E5964" text-anchor="middle">같은 특징을 모든 자리에서 찾고,</text><text x="433" y="248" font-size="11.5" fill="#4E5964" text-anchor="middle">자유 파라미터가 줄어</text><text x="433" y="266" font-size="11.5" fill="#4E5964" text-anchor="middle">학습 오차와 시험 오차의 간격이 준다</text><rect x="576" y="46" width="266" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="709" y="70" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="600">셋. 부분 표본 뽑기</text><line x1="630" y1="90" x2="630" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><line x1="641" y1="90" x2="641" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><line x1="652" y1="90" x2="652" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><line x1="663" y1="90" x2="663" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><line x1="674" y1="90" x2="674" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><line x1="685" y1="90" x2="685" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><line x1="696" y1="90" x2="696" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><line x1="707" y1="90" x2="707" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><line x1="718" y1="90" x2="718" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><line x1="630" y1="90" x2="718" y2="90" stroke="#CFD6D3" stroke-width="0.6"/><line x1="630" y1="101" x2="718" y2="101" stroke="#CFD6D3" stroke-width="0.6"/><line x1="630" y1="112" x2="718" y2="112" stroke="#CFD6D3" stroke-width="0.6"/><line x1="630" y1="123" x2="718" y2="123" stroke="#CFD6D3" stroke-width="0.6"/><line x1="630" y1="134" x2="718" y2="134" stroke="#CFD6D3" stroke-width="0.6"/><rect x="630" y="90" width="22" height="22" rx="2" fill="none" stroke="#1E8449" stroke-width="1.4"/><rect x="630" y="112" width="22" height="22" rx="2" fill="none" stroke="#1E8449" stroke-width="1.4"/><rect x="652" y="90" width="22" height="22" rx="2" fill="none" stroke="#1E8449" stroke-width="1.4"/><rect x="652" y="112" width="22" height="22" rx="2" fill="none" stroke="#1E8449" stroke-width="1.4"/><rect x="674" y="90" width="22" height="22" rx="2" fill="none" stroke="#1E8449" stroke-width="1.4"/><rect x="674" y="112" width="22" height="22" rx="2" fill="none" stroke="#1E8449" stroke-width="1.4"/><rect x="696" y="90" width="22" height="22" rx="2" fill="none" stroke="#1E8449" stroke-width="1.4"/><rect x="696" y="112" width="22" height="22" rx="2" fill="none" stroke="#1E8449" stroke-width="1.4"/><line x1="718" y1="146" x2="718" y2="166" stroke="#1E8449" stroke-width="1.2" marker-end="url(#b1)"/><line x1="652" y1="170" x2="652" y2="192" stroke="#CFD6D3" stroke-width="0.6"/><line x1="663" y1="170" x2="663" y2="192" stroke="#CFD6D3" stroke-width="0.6"/><line x1="674" y1="170" x2="674" y2="192" stroke="#CFD6D3" stroke-width="0.6"/><line x1="685" y1="170" x2="685" y2="192" stroke="#CFD6D3" stroke-width="0.6"/><line x1="696" y1="170" x2="696" y2="192" stroke="#CFD6D3" stroke-width="0.6"/><line x1="652" y1="170" x2="696" y2="170" stroke="#CFD6D3" stroke-width="0.6"/><line x1="652" y1="181" x2="696" y2="181" stroke="#CFD6D3" stroke-width="0.6"/><line x1="652" y1="192" x2="696" y2="192" stroke="#CFD6D3" stroke-width="0.6"/><text x="709" y="212" font-size="11.5" fill="#4E5964" text-anchor="middle">2 x 2 를 한 칸으로 — 해상도가 반이 된다</text><text x="709" y="234" font-size="11.5" fill="#4E5964" text-anchor="middle">특징이 한 번 잡히면 정확한 자리는</text><text x="709" y="252" font-size="11.5" fill="#4E5964" text-anchor="middle">덜 중요하고, 오히려 해로울 수 있다</text><text x="709" y="278" font-size="10.5" fill="#7A8590" text-anchor="middle">논문의 예시: 왼쪽 위 가로획 끝점 + 오른쪽 위</text><rect x="28" y="308" width="814" height="74" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="435" y="332" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">셋을 번갈아 쌓으면 「두 겹 피라미드」가 된다 — 층마다 해상도는 내려가고 특징 지도 수는 는다.</text><text x="435" y="356" font-size="12" fill="#4E5964" text-anchor="middle">LeNet-5 에서 28x28 여섯 장 → 14x14 여섯 장 → 10x10 열여섯 장 → 5x5 열여섯 장 으로 간다.</text><text x="435" y="374" font-size="11" fill="#7A8590" text-anchor="middle">모퉁이 + 아래 세로획 끝점 이면 그 입력은 7 이다. 셋이 정확히 어디였는지는 필요 없다.</text></svg>
