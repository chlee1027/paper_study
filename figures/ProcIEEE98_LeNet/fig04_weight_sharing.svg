<svg xmlns="http://www.w3.org/2000/svg" width="870" height="352" viewBox="0 0 870 352" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="가중치 공유는 연결이 아니라 학습되는 값을 줄인다. C1 에서 122,304 대 156"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="420" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">가중치 공유는 연결을 줄이지 않는다 — 학습되는 값을 줄인다</text><rect x="24" y="46" width="400" height="210" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="224" y="70" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">C1 한 층을 두 방식으로 세면</text><text x="44" y="96" font-size="11.5" fill="#4E5964" text-anchor="start">유닛 수</text><text x="268" y="96" font-size="11" fill="#7A8590" text-anchor="start">6 장 x 28 x 28</text><text x="404" y="96" font-size="12.5" fill="#4E5964" text-anchor="end" font-weight="600">4,704</text><text x="44" y="132" font-size="11.5" fill="#4E5964" text-anchor="start">연결 수 (유닛마다 25 + 바이어스)</text><text x="268" y="132" font-size="11" fill="#7A8590" text-anchor="start">4,704 x 26</text><text x="404" y="132" font-size="12.5" fill="#4E5964" text-anchor="end" font-weight="600">122,304</text><text x="44" y="168" font-size="11.5" fill="#4E5964" text-anchor="start">공유하지 않으면 학습되는 값</text><text x="268" y="168" font-size="11" fill="#7A8590" text-anchor="start">연결마다 하나</text><text x="404" y="168" font-size="12.5" fill="#4E5964" text-anchor="end" font-weight="600">122,304</text><text x="44" y="204" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">공유하면 학습되는 값</text><text x="268" y="204" font-size="11" fill="#7A8590" text-anchor="start">6 x (25 + 1)</text><text x="404" y="204" font-size="12.5" fill="#B4552B" text-anchor="end" font-weight="600">156</text><text x="224" y="240" font-size="12" fill="#B4552B" text-anchor="middle" font-weight="600">연결은 그대로인데 배워야 할 값이 784 배로 줄어든다</text><rect x="434" y="46" width="406" height="210" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="637" y="70" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">망 전체 — 논문이 적는 두 수</text><text x="552" y="111.84" font-size="11.5" fill="#4E5964" text-anchor="end">연결</text><rect x="560" y="96" width="198.863" height="22" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="765.863" y="111.84" font-size="11.5" fill="#4E5964" text-anchor="start">340908</text><text x="552" y="147.84" font-size="11.5" fill="#4E5964" text-anchor="end">학습되는 값</text><rect x="560" y="132" width="35.0" height="22" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="602.0" y="147.84" font-size="11.5" fill="#4E5964" text-anchor="start">60000</text><text x="637" y="184" font-size="11" fill="#4E5964" text-anchor="middle">차이는 가중치 공유와 고정된 RBF 파라미터에서 온다</text><text x="637" y="206" font-size="11.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">340,068 + 840(RBF 연결) = 340,908</text><text x="637" y="226" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">층별 학습되는 값을 더하면 정확히 60,000</text><text x="637" y="244" font-size="10.5" fill="#7A8590" text-anchor="middle">(두 덧셈은 이 그림을 만들며 맞춰 본 것이다)</text><rect x="28" y="270" width="812" height="68" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="434" y="294" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">그래서 「가중치 공유가 계산을 줄인다」가 아니다 — 계산은 연결 수를 따라간다.</text><text x="434" y="318" font-size="12" fill="#4E5964" text-anchor="middle">줄어드는 것은 용량이고, 논문이 드는 효과도 학습 오차와 시험 오차의 간격이다.</text></svg>
