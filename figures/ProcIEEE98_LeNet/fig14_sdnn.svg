<svg xmlns="http://www.w3.org/2000/svg" width="870" height="416" viewBox="0 0 870 416" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="인식기를 자리마다 대는 대신 입력 폭을 넓히는 SDNN 과 그 한계"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="m1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="m2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="420" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">길 둘 — 자르지 않고 쓸어본다 (SDNN)</text><rect x="24" y="50" width="400" height="216" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="224" y="74" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">인식기를 자리마다 하나씩 대면</text><rect x="60" y="92" width="328" height="52" rx="4" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="1.0"/><text x="224" y="124" font-size="22" fill="#1C232C" text-anchor="middle" font-weight="600">2 3 4 5</text><rect x="70" y="88" width="60" height="60" rx="3" fill="none" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="130" y="88" width="60" height="60" rx="3" fill="none" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="190" y="88" width="60" height="60" rx="3" fill="none" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="4 3"/><rect x="250" y="88" width="60" height="60" rx="3" fill="none" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="4 3"/><text x="224" y="172" font-size="11.5" fill="#4E5964" text-anchor="middle">겹치는 자리를 다시 계산한다</text><text x="224" y="194" font-size="11.5" fill="#4E5964" text-anchor="middle">논문은 이 방식이 일반적으로 비싸다고 적는다</text><text x="224" y="228" font-size="11" fill="#7A8590" text-anchor="middle">그리고 가운데 글자 옆에 이웃 글자가 닿아 있어도</text><text x="224" y="246" font-size="11" fill="#7A8590" text-anchor="middle">가운데 것을 맞게 읽어야 한다</text><rect x="436" y="50" width="404" height="216" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="638" y="74" font-size="12.5" fill="#1E8449" text-anchor="middle" font-weight="600">합성곱이면 한 번에 된다</text><rect x="470" y="120" width="240" height="44" rx="3" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.0" opacity="0.95"/><rect x="480" y="112" width="240" height="44" rx="3" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.0" opacity="0.95"/><rect x="490" y="104" width="240" height="44" rx="3" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.0" opacity="0.95"/><rect x="500" y="96" width="240" height="44" rx="3" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.0" opacity="0.95"/><text x="600" y="128" font-size="11.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">입력 폭을 넓힌 같은 망</text><line x1="600" y1="152" x2="600" y2="172" stroke="#1E8449" stroke-width="1.2" marker-end="url(#m1)"/><rect x="500" y="176" width="30" height="26" rx="3" fill="#E4EFE4" stroke="#1E8449" stroke-width="1.0"/><rect x="534" y="176" width="30" height="26" rx="3" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.0"/><rect x="568" y="176" width="30" height="26" rx="3" fill="#E4EFE4" stroke="#1E8449" stroke-width="1.0"/><rect x="602" y="176" width="30" height="26" rx="3" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.0"/><rect x="636" y="176" width="30" height="26" rx="3" fill="#E4EFE4" stroke="#1E8449" stroke-width="1.0"/><rect x="670" y="176" width="30" height="26" rx="3" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.0"/><text x="638" y="218" font-size="11.5" fill="#4E5964" text-anchor="middle">출력층도 합성곱층이 되어 자리마다 증거가 나온다</text><text x="638" y="240" font-size="11.5" fill="#1E8449" text-anchor="middle" font-weight="600">새로 계산할 것은 얇은 「조각」뿐이다</text><rect x="24" y="280" width="400" height="120" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="224" y="304" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">실험 설정</text><text x="44" y="328" font-size="11.5" fill="#4E5964" text-anchor="start">가운데 글자 양옆에 다른 글자를 붙였다</text><text x="44" y="348" font-size="11.5" fill="#4E5964" text-anchor="start">경계 상자 사이 간격은 -1 에서 4 픽셀 사이 무작위</text><text x="44" y="368" font-size="11.5" fill="#4E5964" text-anchor="start">픽셀마다 10% 소금후추 잡음</text><text x="44" y="390" font-size="11.5" fill="#4E5964" text-anchor="start">가운데가 비면 빈칸 부류를 내게 했다</text><rect x="436" y="280" width="404" height="120" rx="8" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.3"/><text x="638" y="306" font-size="12.5" fill="#C0392B" text-anchor="middle" font-weight="600">그런데 논문이 성적을 낮춰 적는다</text><text x="638" y="332" font-size="11.5" fill="#4E5964" text-anchor="middle">SDNN 은 OCR 에 유망하고 매력적인 방법이지만,</text><text x="638" y="352" font-size="11.5" fill="#4E5964" text-anchor="middle">지금까지 휴리스틱 과분할보다 나은 결과를</text><text x="638" y="372" font-size="11.5" fill="#4E5964" text-anchor="middle">내지는 못했다 (VII-C).</text><text x="638" y="392" font-size="11" fill="#7A8590" text-anchor="middle">곧 둘은 이어지는 단계가 아니라 경쟁하는 두 길이다.</text></svg>
