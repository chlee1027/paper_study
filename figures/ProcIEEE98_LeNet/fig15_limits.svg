<svg xmlns="http://www.w3.org/2000/svg" width="876" height="418" viewBox="0 0 876 418" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="논문이 적은 한계 아홉과 실험으로 잴 다섯 자리"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><text x="440" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">이 논문이 스스로 적은 한계와, 내가 재 보려는 자리</text><rect x="24" y="48" width="426" height="350" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="237" y="72" font-size="13" fill="#C0392B" text-anchor="middle" font-weight="600">논문이 적은 한계</text><text x="46" y="98" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">1.</text><text x="70" y="98" font-size="11.5" fill="#4E5964" text-anchor="start">온전한 불변 인식은 아직 손에 잡히지 않은 목표다</text><text x="46" y="130" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">2.</text><text x="70" y="130" font-size="11.5" fill="#4E5964" text-anchor="start">파라미터 많은 망이 왜 되는지가 수수께끼로 남는다</text><text x="46" y="162" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">3.</text><text x="70" y="162" font-size="11.5" fill="#4E5964" text-anchor="start">극소점이 왜 문제가 안 되는지도 이론적으로 비었다</text><text x="46" y="194" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">4.</text><text x="70" y="194" font-size="11.5" fill="#4E5964" text-anchor="start">SDNN 이 휴리스틱 과분할을 아직 못 이겼다</text><text x="46" y="226" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">5.</text><text x="70" y="226" font-size="11.5" fill="#4E5964" text-anchor="start">비터비 학습은 주저앉고, 판별 비터비는 여유가 없다</text><text x="46" y="258" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">6.</text><text x="70" y="258" font-size="11.5" fill="#4E5964" text-anchor="start">수표 읽기에서 전역 학습의 몫이 작았다</text><text x="46" y="290" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">7.</text><text x="70" y="290" font-size="11.5" fill="#4E5964" text-anchor="start">더 큰 구조가 반드시 더 낫지는 않았다</text><text x="46" y="322" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">8.</text><text x="70" y="322" font-size="11.5" fill="#4E5964" text-anchor="start">특화 하드웨어의 앞날이 불확실하다</text><text x="46" y="354" font-size="11.5" fill="#C0392B" text-anchor="start" font-weight="600">9.</text><text x="70" y="354" font-size="11.5" fill="#4E5964" text-anchor="start">출력 그래프의 구조를 배우는 일은 조합 문제로 보인다</text><text x="237" y="386" font-size="10.8" fill="#7A8590" text-anchor="middle">다섯째는 논문이 스스로 답(앞방향 학습)까지 낸다</text><rect x="462" y="48" width="384" height="350" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="654" y="72" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">내가 짚은 자리에서 잴 것 다섯</text><rect x="482" y="82" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="108" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">A</text><text x="522" y="108" font-size="11.2" fill="#4E5964" text-anchor="start">세운 LeNet-5 의 자유 파라미터가 60,000 인가</text><rect x="482" y="136" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="162" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">B</text><text x="522" y="162" font-size="11.2" fill="#4E5964" text-anchor="start">픽셀을 고정 순열로 섞으면 둘이 각각 얼마나 무너지는가</text><rect x="482" y="190" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="216" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">C</text><text x="522" y="216" font-size="11.2" fill="#4E5964" text-anchor="start">옮기면 오차가 어떤 모양으로 오르는가</text><rect x="482" y="244" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="270" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">D</text><text x="522" y="270" font-size="11.2" fill="#4E5964" text-anchor="start">가중치 공유만 끄면 파라미터와 오차가 얼마가 되는가</text><rect x="482" y="298" width="344" height="44" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.1"/><text x="502" y="324" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">E</text><text x="522" y="324" font-size="11.2" fill="#4E5964" text-anchor="start">표 I 대신 전부 연결하면 무엇이 달라지는가</text><text x="654" y="386" font-size="10.8" fill="#7A8590" text-anchor="middle">B 와 C 는 논문이 문장으로만 적고 재지 않은 자리다</text></svg>
