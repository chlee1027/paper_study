="40" height="32" rx="2" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9" opacity="0.9"/><rect x="422" y="146" width="40" height="32" rx="2" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9" opacity="0.9"/><rect x="430" y="140" width="40" height="32" rx="2" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9" opacity="0.9"/><text x="440" y="198" font-size="10.5" fill="#B4552B" text-anchor="middle" font-weight="600">학습 1,516</text><text x="440" y="212" font-size="10.5" fill="#4E5964" text-anchor="middle">연결 151,600</text><line x1="492" y1="141" x2="506" y2="141" stroke="#4E5964" stroke-width="1.2" marker-end="url(#e1)"/><rect x="506" y="66" width="104" height="162" rx="8" fill="#E4EFE4" stroke="#1E8449" stroke-width="1.4"/><text x="558" y="90" font-size="14" fill="#1E8449" text-anchor="middle" font-weight="600">S4</text><text x="558" y="110" font-size="11.5" fill="#1C232C" text-anchor="middle">16 장 @ 5x5</text><text x="558" y="128" font-size="10.5" fill="#4E5964" text-anchor="middle">부분 표본 2x2</text><rect x="532" y="152" width="40" height="32" rx="2" fill="#FFFFFF" stroke="#1E8449" stroke-width="0.9" opacity="0.9"/><rect x="540" y="146" width="40" height="32" rx="2" fill="#FFFFFF" stroke="#1E8449" stroke-width="0.9" opacity="0.9"/><rect x="548" y="140" width="40" height="32" rx="2" fill="#FFFFFF" stroke="#1E8449" stroke-width="0.9" opacity="0.9"/><text x="558" y="198" font-size="10.5" fill="#B4552B" text-anchor="middle" font-weight="600">학습 32</text><text x="558" y="212" font-size="10.5" fill="#4E5964" text-anchor="middle">연결 2,000</text><line x1="610" y1="141" x2="624" y2="141" stroke="#4E5964" stroke-width="1.2" marker-end="url(#e1)"/><rect x="624" y="66" width="104" height="162" rx="8" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="676" y="90" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">C5</text><text x="676" y="110" font-size="11.5" fill="#1C232C" text-anchor="middle">120 장 @ 1x1</text><text x="676" y="128" font-size="10.5" fill="#4E5964" text-anchor="middle">합성곱 5x5</text><rect x="650" y="152" width="40" height="32" rx="2" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9" opacity="0.9"/><rect x="658" y="146" width="40" height="32" rx="2" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9" opacity="0.9"/><rect x="666" y="140" width="40" height="32" rx="2" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9" opacity="0.9"/><text x="676" y="198" font-size="10.5" fill="#B4552B" text-anchor="middle" font-weight="600">학습 48,120</text><text x="676" y="212" font-size="10.5" fill="#4E5964" text-anchor="middle">연결 48,120</text><line x1="728" y1="141" x2="742" y2="141" stroke="#4E5964" stroke-width="1.2" marker-end="url(#e1)"/><rect x="742" y="66" width="104" height="162" rx="8" fill="#F2DED2" stroke="#B4552B" stroke-width="1.4"/><text x="794" y="90" font-size="14" fill="#B4552B" text-anchor="middle" font-weight="600">F6</text><text x="794" y="110" font-size="11.5" fill="#1C232C" text-anchor="middle">84</text><text x="794" y="128" font-size="10.5" fill="#4E5964" text-anchor="middle">완전연결</text><circle cx="768" cy="158" r="5" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9"/><circle cx="781" cy="158" r="5" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9"/><circle cx="794" cy="158" r="5" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9"/><circle cx="807" cy="158" r="5" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9"/><circle cx="820" cy="158" r="5" fill="#FFFFFF" stroke="#B4552B" stroke-width="0.9"/><text x="794" y="198" font-size="10.5" fill="#B4552B" text-anchor="middle" font-weight="600">학습 10,164</text><text x="794" y="212" font-size="10.5" fill="#4E5964" text-anchor="middle">연결 10,164</text><line x1="846" y1="141" x2="860" y2="141" stroke="#4E5964" stroke-width="1.2" marker-end="url(#e1)"/><rect x="860" y="66" width="104" height="162" rx="8" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.4"/><text x="912" y="90" font-size="14" fill="#2E6B8A" text-anchor="middle" font-weight="600">출력</text><text x="912" y="110" font-size="11.5" fill="#1C232C" text-anchor="middle">10</text><text x="912" y="128" font-size="10.5" fill="#4E5964" text-anchor="middle">유클리드 RBF</text><circle cx="886" cy="158" r="5" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="0.9"/><circle cx="899" cy="158" r="5" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="0.9"/><circle cx="912" cy="158" r="5" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="0.9"/><circle cx="925" cy="158" r="5" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="0.9"/><circle cx="938" cy="158" r="5" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="0.9"/><text x="912" y="198" font-size="10.5" fill="#7A8590" text-anchor="middle">고정</text><text x="912" y="212" font-size="10.5" fill="#4E5964" text-anchor="middle">연결 840</text><rect x="34" y="232" width="512" height="112" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="52" y="256" font-size="12" fill="#4E5964" text-anchor="start">층별 학습되는 값을 더하면</text><text x="52" y="280" font-size="13" fill="#B4552B" text-anchor="start" font-weight="600">156 + 12 + 1,516 + 32 + 48,120 + 10,164 = 60,000</text><text x="52" y="306" font-size="12" fill="#4E5964" text-anchor="start">연결을 더하고 RBF 의 84 x 10 = 840 을 넣으면</text><text x="52" y="330" font-size="13" fill="#2E6B8A" text-anchor="start" font-weight="600">340,908</text><text x="190" y="330" font-size="11.5" fill="#4E5964" text-anchor="start">— 논문이 적는 340,908 과 같다</text><rect x="560" y="232" width="392" height="112" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="578" y="256" font-size="12" fill="#1C232C" text-anchor="start" font-weight="600">C5 를 완전연결층이라 부르지 않는 이유</text><text x="578" y="278" font-size="11.5" fill="#4E5964" text-anchor="start">S4 가 5x5 이고 커널도 5x5 라 지금은 1x1 이 되지만,</text><text x="578" y="298" font-size="11.5" fill="#4E5964" text-anchor="start">입력을 키우면 C5 의 특징 지도가 1x1 보다 커진다.</text><text x="578" y="322" font-size="11.5" fill="#2E6B8A" text-anchor="start" font-weight="600">이 성질이 VII절의 SDNN 으로 이어진다.</text></svg>
