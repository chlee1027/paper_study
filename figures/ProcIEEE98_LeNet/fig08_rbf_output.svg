t="13" rx="0" fill="#1C232C" stroke="#CFD6D3" stroke-width="0.5"/><rect x="170" y="207" width="13" height="13" rx="0" fill="#1C232C" stroke="#CFD6D3" stroke-width="0.5"/><rect x="183" y="207" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="105" y="220" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="118" y="220" width="13" height="13" rx="0" fill="#1C232C" stroke="#CFD6D3" stroke-width="0.5"/><rect x="131" y="220" width="13" height="13" rx="0" fill="#1C232C" stroke="#CFD6D3" stroke-width="0.5"/><rect x="144" y="220" width="13" height="13" rx="0" fill="#1C232C" stroke="#CFD6D3" stroke-width="0.5"/><rect x="157" y="220" width="13" height="13" rx="0" fill="#1C232C" stroke="#CFD6D3" stroke-width="0.5"/><rect x="170" y="220" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="183" y="220" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="105" y="233" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="118" y="233" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="131" y="233" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="144" y="233" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="157" y="233" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="170" y="233" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><rect x="183" y="233" width="13" height="13" rx="0" fill="#FFFFFF" stroke="#CFD6D3" stroke-width="0.5"/><text x="149" y="268" font-size="11" fill="#7A8590" text-anchor="middle">+1 은 검은 칸 · -1 은 흰 칸</text><text x="149" y="286" font-size="11" fill="#B4552B" text-anchor="middle" font-weight="600">사람이 그려 고정해 둔다</text><rect x="286" y="46" width="264" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="418" y="70" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">부류마다 RBF 하나</text><circle cx="330" cy="104" r="12" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.1"/><text x="330" y="108" font-size="11" fill="#2E6B8A" text-anchor="middle">0</text><circle cx="330" cy="138" r="12" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.1"/><text x="330" y="142" font-size="11" fill="#2E6B8A" text-anchor="middle">1</text><circle cx="330" cy="172" r="12" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.1"/><text x="330" y="176" font-size="11" fill="#2E6B8A" text-anchor="middle">2</text><circle cx="330" cy="206" r="12" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.1"/><text x="330" y="210" font-size="11" fill="#2E6B8A" text-anchor="middle">3</text><circle cx="330" cy="240" r="12" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.1"/><text x="330" y="244" font-size="11" fill="#2E6B8A" text-anchor="middle">4</text><text x="330" y="282" font-size="10.5" fill="#7A8590" text-anchor="middle">…10 개</text><rect x="378" y="96" width="150" height="96" rx="6" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="453" y="124" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">y(i) = Σ (x(j) - w(i,j))²</text><text x="453" y="148" font-size="11" fill="#4E5964" text-anchor="middle">입력 84 개와 자기 파라미터</text><text x="453" y="166" font-size="11" fill="#4E5964" text-anchor="middle">벡터의 제곱 거리</text><text x="453" y="186" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="600">작을수록 그 부류다</text><text x="418" y="222" font-size="11" fill="#4E5964" text-anchor="middle">-1 과 +1 은 F6 의 누름 함수가</text><text x="418" y="240" font-size="11" fill="#4E5964" text-anchor="middle">가장 많이 휘는 자리라</text><text x="418" y="258" font-size="11" fill="#4E5964" text-anchor="middle">F6 이 포화되지 않는다</text><rect x="562" y="46" width="278" height="250" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="701" y="70" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">손실 둘</text><rect x="580" y="86" width="242" height="74" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.2"/><text x="701" y="110" font-size="11.5" fill="#4E5964" text-anchor="middle" font-weight="600">식 8 — 정답 RBF 출력의 평균</text><text x="701" y="132" font-size="10.8" fill="#C0392B" text-anchor="middle">부족한 점 셋을 논문이 스스로 적는다</text><text x="701" y="150" font-size="10.8" fill="#C0392B" text-anchor="middle">주저앉기 · 경쟁 없음 · 그래서 식 9</text><rect x="580" y="170" width="242" height="106" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.3"/><text x="701" y="194" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">식 9 — 판별 기준</text><text x="701" y="216" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">y(D) + log( e^-j + Σ e^-y(i) )</text><text x="701" y="238" font-size="10.8" fill="#4E5964" text-anchor="middle">둘째 항이 경쟁을 맡는다 —</text><text x="701" y="256" font-size="10.8" fill="#4E5964" text-anchor="middle">오답 부류의 벌점을 밀어 올린다</text><rect x="28" y="308" width="812" height="68" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="434" y="332" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">가중치 공유가 있을 때의 역전파는 한 줄로 끝난다 — 연결마다 편미분을 구하고, 같은 값을 나눠 쓰는 연결들의 것을 더한다.</text><text x="434" y="356" font-size="11.5" fill="#4E5964" text-anchor="middle">이 비트맵 표현은 숫자 열 개에는 값을 덜 하고, 인쇄 가능한 ASCII 전체처럼 헷갈리는 글자가 많을 때 값을 한다고 적는다.</text></svg>
