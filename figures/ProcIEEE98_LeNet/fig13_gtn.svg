<svg xmlns="http://www.w3.org/2000/svg" width="700" height="600" viewBox="0 0 700 600" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="분할 그래프에서 비터비까지의 흐름과 손실을 셋으로 고쳐 간 과정"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="k1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="k2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="450" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">길 하나 — 자를 자리를 많이 만들고 벌점으로 고른다</text><rect x="40" y="58" width="300" height="52" rx="7" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="190" y="80" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">입력 이미지</text><text x="190" y="98" font-size="10.8" fill="#4E5964" text-anchor="middle">"34" 한 장</text><line x1="190" y1="110" x2="190" y2="120" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><rect x="40" y="120" width="300" height="52" rx="7" fill="#EFEFEF" stroke="#4E5964" stroke-width="1.3"/><text x="190" y="142" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="600">분할 그래프 G(seg)</text><text x="190" y="160" font-size="10.8" fill="#4E5964" text-anchor="middle">자를 자리를 필요한 것보다 많이</text><line x1="190" y1="172" x2="190" y2="182" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><rect x="40" y="182" width="300" height="52" rx="7" fill="#F2DED2" stroke="#B4552B" stroke-width="1.3"/><text x="190" y="204" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">인식 변환기 T(rec)</text><text x="190" y="222" font-size="10.8" fill="#4E5964" text-anchor="middle">간선마다 인식기를 돌려 부류별 벌점</text><line x1="190" y1="234" x2="190" y2="244" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><rect x="40" y="244" width="300" height="52" rx="7" fill="#EFEFEF" stroke="#4E5964" stroke-width="1.3"/><text x="190" y="266" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="600">해석 그래프 G(int)</text><text x="190" y="284" font-size="10.8" fill="#4E5964" text-anchor="middle">간선 하나가 부류 하나 — 라벨과 벌점</text><line x1="190" y1="296" x2="190" y2="306" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><rect x="40" y="306" width="300" height="52" rx="7" fill="#E4EFE4" stroke="#1E8449" stroke-width="1.3"/><text x="190" y="328" font-size="12.5" fill="#1E8449" text-anchor="middle" font-weight="600">경로 선택기</text><text x="190" y="346" font-size="10.8" fill="#4E5964" text-anchor="middle">정답 라벨 열과 맞는 경로만 남긴다</text><line x1="190" y1="358" x2="190" y2="368" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><rect x="40" y="368" width="300" height="52" rx="7" fill="#EFEFEF" stroke="#4E5964" stroke-width="1.3"/><text x="190" y="390" font-size="12.5" fill="#4E5964" text-anchor="middle" font-weight="600">비터비 변환기</text><text x="190" y="408" font-size="10.8" fill="#4E5964" text-anchor="middle">누적 벌점이 가장 작은 경로 하나</text><line x1="190" y1="420" x2="190" y2="430" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><rect x="40" y="430" width="300" height="52" rx="7" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.3"/><text x="190" y="452" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">벌점</text><text x="190" y="470" font-size="10.8" fill="#4E5964" text-anchor="middle">이것이 손실이 된다</text><rect x="370" y="58" width="300" height="176" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="520" y="82" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">분할 그래프의 경로 둘</text><circle cx="400" cy="120" r="7" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><circle cx="460" cy="120" r="7" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><circle cx="520" cy="120" r="7" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><circle cx="580" cy="120" r="7" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><circle cx="640" cy="120" r="7" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><line x1="407" y1="120" x2="453" y2="120" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><text x="430.0" y="112" font-size="11.5" fill="#4E5964" text-anchor="middle">3</text><line x1="467" y1="120" x2="513" y2="120" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><text x="490.0" y="112" font-size="11.5" fill="#4E5964" text-anchor="middle">4</text><line x1="527" y1="120" x2="573" y2="120" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><text x="550.0" y="112" font-size="11.5" fill="#4E5964" text-anchor="middle">1</text><line x1="587" y1="120" x2="633" y2="120" stroke="#4E5964" stroke-width="1.2" marker-end="url(#k1)"/><text x="610.0" y="112" font-size="11.5" fill="#4E5964" text-anchor="middle">2</text><path d="M 400 128 Q 460 168 520 128" fill="none" stroke="#B4552B" stroke-width="1.6" marker-end="url(#k2)"/><text x="460" y="176" font-size="11" fill="#B4552B" text-anchor="middle">34 로 한 덩이</text><path d="M 520 128 Q 580 168 640 128" fill="none" stroke="#B4552B" stroke-width="1.6" marker-end="url(#k2)"/><text x="580" y="176" font-size="11" fill="#B4552B" text-anchor="middle">12 로 한 덩이</text><text x="520" y="208" font-size="10.8" fill="#7A8590" text-anchor="middle">경로 하나가 해석 하나다 — 잉크 조각을 한 번씩만 쓴다</text><rect x="370" y="246" width="300" height="262" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="520" y="270" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">손실을 셋으로 고쳐 간다</text><rect x="388" y="286" width="264" height="62" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2"/><text x="520" y="306" font-size="11.8" fill="#C0392B" text-anchor="middle" font-weight="600">비터비 학습 (식 11)</text><text x="520" y="324" font-size="10.8" fill="#1C232C" text-anchor="middle">정답 경로의 벌점</text><text x="520" y="340" font-size="10.2" fill="#4E5964" text-anchor="middle">주저앉기 — 입력을 무시하면 최소가 된다</text><rect x="388" y="360" width="264" height="62" rx="6" fill="#FFFFFF" stroke="#C0392B" stroke-width="1.2"/><text x="520" y="380" font-size="11.8" fill="#C0392B" text-anchor="middle" font-weight="600">판별 비터비 (식 12)</text><text x="520" y="398" font-size="10.8" fill="#1C232C" text-anchor="middle">정답 경로 − 최선 경로</text><text x="520" y="414" font-size="10.2" fill="#4E5964" text-anchor="middle">여유를 안 만든다 — 같아지면 기울기 0</text><rect x="388" y="434" width="264" height="62" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.2"/><text x="520" y="454" font-size="11.8" fill="#1E8449" text-anchor="middle" font-weight="600">판별 앞방향 (식 17)</text><text x="520" y="472" font-size="10.8" fill="#1C232C" text-anchor="middle">logadd 로 모든 경로를 모은다</text><text x="520" y="488" font-size="10.2" fill="#4E5964" text-anchor="middle">경로 하나가 아니라 해석 전체를 본다</text><rect x="44" y="520" width="626" height="62" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="357" y="546" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">감독자가 주는 것은 바라는 글자 라벨의 열뿐이다 — 어디서 잘렸는지는 주지 않는다.</text><text x="357" y="568" font-size="12" fill="#4E5964" text-anchor="middle">잘못 잘린 글자에 사람이 라벨을 붙이는 일을 없애는 것이 이 얼개의 값이다.</text></svg>
