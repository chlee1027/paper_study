<svg xmlns="http://www.w3.org/2000/svg" width="870" height="368" viewBox="0 0 870 368" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="부분 표본 뽑기의 네 단계와 숫자 예시, 학습되는 값이 지도 수의 두 배인 이유"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="f1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker></defs><text x="420" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">부분 표본 뽑기 한 칸 — 오늘날의 최댓값 풀링이 아니다</text><line x1="60" y1="70" x2="60" y2="138" stroke="#1C232C" stroke-width="1.0"/><line x1="94" y1="70" x2="94" y2="138" stroke="#1C232C" stroke-width="1.0"/><line x1="128" y1="70" x2="128" y2="138" stroke="#1C232C" stroke-width="1.0"/><line x1="60" y1="70" x2="128" y2="70" stroke="#1C232C" stroke-width="1.0"/><line x1="60" y1="104" x2="128" y2="104" stroke="#1C232C" stroke-width="1.0"/><line x1="60" y1="138" x2="128" y2="138" stroke="#1C232C" stroke-width="1.0"/><text x="77" y="92" font-size="12.5" fill="#1C232C" text-anchor="middle">0.2</text><text x="111" y="92" font-size="12.5" fill="#1C232C" text-anchor="middle">0.4</text><text x="77" y="126" font-size="12.5" fill="#1C232C" text-anchor="middle">0.1</text><text x="111" y="126" font-size="12.5" fill="#1C232C" text-anchor="middle">0.3</text><text x="94" y="156" font-size="11" fill="#7A8590" text-anchor="middle">2 x 2 이웃 넷</text><rect x="196" y="56" width="300" height="40" rx="6" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.0"/><text x="210" y="76" font-size="11.5" fill="#4E5964" text-anchor="start" font-weight="600">① 더한다</text><text x="484" y="76" font-size="11" fill="#7A8590" text-anchor="end">0.2+0.4+0.1+0.3</text><rect x="512" y="56" width="74" height="40" rx="6" fill="#FFFFFF" stroke="#4E5964" stroke-width="1.2"/><text x="549" y="76" font-size="13" fill="#4E5964" text-anchor="middle" font-weight="600">1.0</text><line x1="549" y1="96" x2="549" y2="106" stroke="#4E5964" stroke-width="1.0" marker-end="url(#f1)"/><rect x="196" y="106" width="300" height="40" rx="6" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.0"/><text x="210" y="126" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">② 학습되는 계수를 곱한다</text><text x="484" y="126" font-size="11" fill="#7A8590" text-anchor="end">x 0.8</text><rect x="512" y="106" width="74" height="40" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.2"/><text x="549" y="126" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">0.80</text><line x1="549" y1="146" x2="549" y2="156" stroke="#4E5964" stroke-width="1.0" marker-end="url(#f1)"/><rect x="196" y="156" width="300" height="40" rx="6" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.0"/><text x="210" y="176" font-size="11.5" fill="#B4552B" text-anchor="start" font-weight="600">③ 학습되는 바이어스를 더한다</text><text x="484" y="176" font-size="11" fill="#7A8590" text-anchor="end">-0.2</text><rect x="512" y="156" width="74" height="40" rx="6" fill="#FFFFFF" stroke="#B4552B" stroke-width="1.2"/><text x="549" y="176" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="600">0.60</text><line x1="549" y1="196" x2="549" y2="206" stroke="#4E5964" stroke-width="1.0" marker-end="url(#f1)"/><rect x="196" y="206" width="300" height="40" rx="6" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.0"/><text x="210" y="226" font-size="11.5" fill="#2E6B8A" text-anchor="start" font-weight="600">④ 누름 함수를 지난다</text><text x="484" y="226" font-size="11" fill="#7A8590" text-anchor="end">1.7159 tanh(2/3 a)</text><rect x="512" y="206" width="74" height="40" rx="6" fill="#FFFFFF" stroke="#2E6B8A" stroke-width="1.2"/><text x="549" y="226" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="600">0.652</text><rect x="612" y="56" width="228" height="200" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="726" y="80" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">그래서 층마다 학습되는 값이</text><text x="726" y="102" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">지도 수의 두 배다</text><rect x="636" y="118" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.2"/><text x="726" y="143" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="600">S2: 6 x 2 = 12</text><rect x="636" y="166" width="180" height="40" rx="6" fill="#FFFFFF" stroke="#1E8449" stroke-width="1.2"/><text x="726" y="191" font-size="13" fill="#1E8449" text-anchor="middle" font-weight="600">S4: 16 x 2 = 32</text><text x="726" y="226" font-size="10.8" fill="#4E5964" text-anchor="middle">최댓값 풀링에는 학습되는 값이 없다.</text><text x="726" y="244" font-size="10.8" fill="#4E5964" text-anchor="middle">그래서 같은 것으로 부르지 않는다.</text><rect x="28" y="286" width="812" height="68" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="434" y="310" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">논문은 계수가 작으면 준선형으로 흐려지고, 크면 「잡음 섞인 OR」 이나 「잡음 섞인 AND」 처럼 된다고 적는다.</text><text x="434" y="334" font-size="12" fill="#4E5964" text-anchor="middle">곧 이 층은 해상도를 깎는 동시에 무엇을 통과시킬지도 배운다.</text></svg>
