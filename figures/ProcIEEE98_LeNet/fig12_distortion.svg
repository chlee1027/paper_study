<svg xmlns="http://www.w3.org/2000/svg" width="870" height="354" viewBox="0 0 870 354" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="원본 60,000 에 왜곡 540,000 을 더해 0.95% 에서 0.8% 로 내려간 결과"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="j1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker></defs><text x="420" y="28" font-size="14.5" fill="#1C232C" text-anchor="middle" font-weight="600">데이터를 불리면 — 왜곡 540,000 장을 더한 결과</text><rect x="24" y="50" width="400" height="210" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="224" y="76" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">학습 집합</text><rect x="60" y="96" width="150" height="44" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="135" y="124" font-size="12.5" fill="#2E6B8A" text-anchor="middle" font-weight="600">원본 60,000</text><text x="224" y="124" font-size="14" fill="#7A8590" text-anchor="middle">+</text><rect x="238" y="96" width="150" height="44" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="313" y="124" font-size="12.5" fill="#B4552B" text-anchor="middle" font-weight="600">왜곡 540,000</text><text x="224" y="164" font-size="11.5" fill="#4E5964" text-anchor="middle">평면 아핀 변환 — 가로세로 이동 · 크기 ·</text><text x="224" y="182" font-size="11.5" fill="#4E5964" text-anchor="middle">눌림(가로 압축과 세로 신장) · 가로 밀림</text><rect x="60" y="196" width="328" height="48" rx="6" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.2"/><text x="224" y="216" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">학습 길이는 그대로 60,000 장 x 20 바퀴</text><text x="224" y="236" font-size="11.5" fill="#B4552B" text-anchor="middle" font-weight="600">= 갱신 1,200,000 번 / 600,000 장 = 한 장을 2 번씩</text><rect x="436" y="50" width="404" height="210" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="638" y="76" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="600">시험 오차</text><text x="592" y="118.72" font-size="12" fill="#4E5964" text-anchor="end">왜곡 없이</text><rect x="600" y="100" width="164.09090909090907" height="26" rx="3" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.0"/><text x="771.090909090909" y="118.72" font-size="12" fill="#4E5964" text-anchor="start">0.95 %</text><text x="592" y="162.72" font-size="12" fill="#4E5964" text-anchor="end">왜곡 학습</text><rect x="600" y="144" width="138.1818181818182" height="26" rx="3" fill="#F2DED2" stroke="#B4552B" stroke-width="1.0"/><text x="745.1818181818182" y="162.72" font-size="12" fill="#4E5964" text-anchor="start">0.8 %</text><text x="638" y="196" font-size="12" fill="#4E5964" text-anchor="middle">0.15 백분율 점이 내려갔다</text><text x="638" y="218" font-size="11.5" fill="#C0392B" text-anchor="middle" font-weight="600">다만 논문이 적는 불확실성이 0.1 백분율 점이다</text><text x="638" y="240" font-size="11" fill="#7A8590" text-anchor="middle">완전연결 쪽 [왜곡] 이 같은 집합인지는 본문에 없다</text><rect x="28" y="274" width="812" height="66" rx="8" fill="#FFFFFF" stroke="#1C232C" stroke-width="1.3"/><text x="434" y="298" font-size="12" fill="#1C232C" text-anchor="middle" font-weight="600">그림 6 이 학습 집합 15,000 · 30,000 · 60,000 장을 견주고, 더 큰 학습 집합이 LeNet-5 를 더 낫게 할 것이라고 적는다.</text><text x="434" y="322" font-size="12" fill="#4E5964" text-anchor="middle">그리고 그림 5 에서 시험 오차가 10 바퀴 언저리에서 가라앉고 다시 오르지 않는다 — 논문은 그 까닭을 추측으로 적는다.</text></svg>
