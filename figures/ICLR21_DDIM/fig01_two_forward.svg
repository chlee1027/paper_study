<svg xmlns="http://www.w3.org/2000/svg" width="860" height="310" viewBox="0 0 860 310" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="DDPM 의 마르코프 앞방향과 이 편의 비마르코프 앞방향"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="430.0" y="26" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">x_T 쪽으로 가는 앞방향의 두 꼴 (원문 그림 1 을 다시 그림, T = 3)</text><text x="225" y="58" font-size="13" fill="#2E6B8A" text-anchor="middle" font-weight="700">왼쪽: DDPM (식 3, 마르코프)</text><circle cx="360" cy="128" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="360" y="133" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">x0</text><circle cx="270" cy="128" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="270" y="133" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">x1</text><circle cx="180" cy="128" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="180" y="133" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">x2</text><circle cx="90" cy="128" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="90" y="133" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">x3</text><line x1="336" y1="128" x2="295" y2="128" stroke="#2E6B8A" stroke-width="2" marker-end="url(#af)"/><line x1="246" y1="128" x2="205" y2="128" stroke="#2E6B8A" stroke-width="2" marker-end="url(#af)"/><line x1="156" y1="128" x2="115" y2="128" stroke="#2E6B8A" stroke-width="2" marker-end="url(#af)"/><text x="70" y="190" font-size="12" fill="#4E5964" text-anchor="start">다음 자리는 바로 앞 자리에만 기댄다.</text><text x="70" y="211" font-size="12" fill="#2E6B8A" text-anchor="start" font-weight="700">q(x_t | x_{t-1})</text><text x="70" y="232" font-size="12" fill="#4E5964" text-anchor="start">x_t 하나를 만드는 데 드는 표본 잡음은 t 개.</text><text x="655" y="58" font-size="13" fill="#B4552B" text-anchor="middle" font-weight="700">오른쪽: 이 편 (식 6, 7, 비마르코프)</text><circle cx="790" cy="128" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="790" y="133" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">x0</text><circle cx="700" cy="128" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="700" y="133" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">x1</text><circle cx="610" cy="128" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="610" y="133" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">x2</text><circle cx="520" cy="128" r="22" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="520" y="133" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">x3</text><path d="M 790 150 C 700 208, 610 208, 520 150" fill="none" stroke="#B4552B" stroke-width="2" marker-end="url(#ar)"/><text x="655" y="208" font-size="11.5" fill="#B4552B" text-anchor="middle">q(x_3 | x_0)</text><line x1="545" y1="128" x2="585" y2="128" stroke="#B4552B" stroke-width="2" marker-end="url(#ar)"/><line x1="635" y1="128" x2="675" y2="128" stroke="#B4552B" stroke-width="2" marker-end="url(#ar)"/><path d="M 790 106 C 760 72, 640 72, 612 104" fill="none" stroke="#B4552B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/><path d="M 790 106 C 770 80, 725 80, 702 104" fill="none" stroke="#B4552B" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="490" y="238" font-size="12" fill="#4E5964" text-anchor="start">x_{t-1} 은 x_t 와 x_0 둘에 기댄다(점선이 x_0 쪽 의존).</text><text x="490" y="259" font-size="12" fill="#B4552B" text-anchor="start" font-weight="700">q_sigma(x_{t-1} | x_t, x_0). 인수 분해 방향이 위에서 아래다.</text><text x="490" y="280" font-size="12" fill="#4E5964" text-anchor="start">q(x_t | x_0) 는 왼쪽과 같다(보조 정리 1).</text></svg>
