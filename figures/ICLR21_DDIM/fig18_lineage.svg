t-weight="700">DDIM (이 편)</text><text x="355.0" y="135" font-size="11" fill="#4E5964" text-anchor="middle">같은 체크포인트</text><text x="355.0" y="153" font-size="11" fill="#4E5964" text-anchor="middle">뽑기 = sigma, tau 를 고른다</text><rect x="490" y="50" width="170" height="78" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="575.0" y="74" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">Score SDE (2021)</text><text x="575.0" y="95" font-size="11" fill="#4E5964" text-anchor="middle">확률 흐름 ODE</text><text x="575.0" y="113" font-size="11" fill="#4E5964" text-anchor="middle">동시 발표, 명제 1</text><rect x="490" y="150" width="170" height="78" rx="6" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="575.0" y="174" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">고차 풀이법</text><text x="575.0" y="195" font-size="11" fill="#4E5964" text-anchor="middle">원문 7절이 제안</text><text x="575.0" y="213" font-size="11" fill="#4E5964" text-anchor="middle">이 파일에 결과 없음</text><rect x="690" y="90" width="150" height="78" rx="6" fill="#D6EEDD" stroke="#1E8449" stroke-width="1.2"/><text x="765.0" y="114" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">Latent Diffusion</text><text x="765.0" y="135" font-size="11" fill="#4E5964" text-anchor="middle">잠재 공간에서 확산</text><text x="765.0" y="153" font-size="11" fill="#4E5964" text-anchor="middle">다음 칸</text><line x1="222" y1="129" x2="258" y2="129" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><line x1="452" y1="115" x2="488" y2="92" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><line x1="452" y1="143" x2="488" y2="180" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)"/><line x1="662" y1="100" x2="688" y2="118" stroke="#4E5964" stroke-width="1.6" marker-end="url(#ai)" opacity="0.5"/><text x="430.0" y="262" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="700">남긴 빈칸: 공유 망에서 정리 1 의 근거 · 256 x 256 Church 의 역전 · 일관성과 보간을 재는 수.