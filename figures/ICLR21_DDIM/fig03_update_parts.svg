<svg xmlns="http://www.w3.org/2000/svg" width="860" height="340" viewBox="0 0 860 340" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="식 12 의 세 조각과 eta 별 계수"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="430.0" y="26" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">식 12 의 한 걸음: 셋의 합이 x_{t-1} 이다</text><rect x="30" y="70" width="120" height="50" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="90" y="92" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="700">x_t</text><text x="90" y="110" font-size="11" fill="#4E5964" text-anchor="middle">지금 자리</text><rect x="30" y="150" width="120" height="50" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="90" y="172" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">epsilon_theta</text><text x="90" y="190" font-size="11" fill="#4E5964" text-anchor="middle">망의 출력 1 번</text><line x1="90" y1="122" x2="90" y2="148" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><rect x="220" y="78" width="200" height="82" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="320.0" y="100" font-size="11.8" fill="#1C232C" text-anchor="middle" font-weight="700">예측한 x_0</text><text x="320.0" y="120" font-size="11.2" fill="#1C232C" text-anchor="middle" font-weight="700">× sqrt(alpha_{t-1})</text><text x="320.0" y="144" font-size="11" fill="#4E5964" text-anchor="middle">식 9 의 f 를 다음 눈금으로</text><rect x="440" y="78" width="200" height="82" rx="6" fill="#FFF3C4" stroke="#9A7B00" stroke-width="1.2"/><text x="540.0" y="100" font-size="11.8" fill="#1C232C" text-anchor="middle" font-weight="700">x_t 쪽 방향</text><text x="540.0" y="120" font-size="11.2" fill="#1C232C" text-anchor="middle" font-weight="700">× sqrt(1 - alpha_{t-1} - sigma^2)</text><text x="540.0" y="144" font-size="11" fill="#4E5964" text-anchor="middle">같은 epsilon 을 다시 쓴다</text><rect x="660" y="78" width="170" height="82" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="745.0" y="100" font-size="11.8" fill="#1C232C" text-anchor="middle" font-weight="700">새 잡음</text><text x="745.0" y="120" font-size="11.2" fill="#1C232C" text-anchor="middle" font-weight="700">× sigma</text><text x="745.0" y="144" font-size="11" fill="#4E5964" text-anchor="middle">sigma = 0 이면 사라진다</text><line x1="152" y1="95" x2="218" y2="110" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="152" y1="175" x2="218" y2="135" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="430" y="126" font-size="18" fill="#1C232C" text-anchor="middle" font-weight="700">+</text><text x="650" y="126" font-size="18" fill="#1C232C" text-anchor="middle" font-weight="700">+</text><rect x="40" y="200" width="320" height="27" fill="#DDE3E0"/><text x="200.0" y="217.64" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="700">같은 x_t, 같은 망, t = 500 -&gt; 400 (S = 10 선형)</text><rect x="360" y="200" width="110" height="27" fill="#DDE3E0"/><text x="415.0" y="217.64" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="700">x_0 쪽 계수</text><rect x="470" y="200" width="110" height="27" fill="#DDE3E0"/><text x="525.0" y="217.64" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="700">방향 계수</text><rect x="580" y="200" width="120" height="27" fill="#DDE3E0"/><text x="640.0" y="217.64" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="700">잡음 표준편차</text><rect x="700" y="200" width="130" height="27" fill="#DDE3E0"/><text x="765.0" y="217.64" font-size="11.5" fill="#1C232C" text-anchor="middle" font-weight="700">새 잡음의 분산 몫</text><line x1="40" y1="227" x2="830" y2="227" stroke="#CFD6D3" stroke-width="0.8"/><text x="200.0" y="244.64" font-size="11.5" fill="#4E5964" text-anchor="middle">eta = 0 (DDIM)</text><text x="415.0" y="244.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.4418</text><text x="525.0" y="244.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.8971</text><text x="640.0" y="244.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.0000</text><text x="765.0" y="244.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.0%</text><line x1="40" y1="254" x2="830" y2="254" stroke="#CFD6D3" stroke-width="0.8"/><text x="200.0" y="271.64" font-size="11.5" fill="#4E5964" text-anchor="middle">eta = 0.5</text><text x="415.0" y="271.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.4418</text><text x="525.0" y="271.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.8212</text><text x="640.0" y="271.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.3612</text><text x="765.0" y="271.64" font-size="11.5" fill="#4E5964" text-anchor="middle">16.2%</text><line x1="40" y1="281" x2="830" y2="281" stroke="#CFD6D3" stroke-width="0.8"/><text x="200.0" y="298.64" font-size="11.5" fill="#4E5964" text-anchor="middle">eta = 1 (DDPM)</text><text x="415.0" y="298.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.4418</text><text x="525.0" y="298.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.5321</text><text x="640.0" y="298.64" font-size="11.5" fill="#4E5964" text-anchor="middle">0.7223</text><text x="765.0" y="298.64" font-size="11.5" fill="#4E5964" text-anchor="middle">64.8%</text><line x1="40" y1="308" x2="830" y2="308" stroke="#CFD6D3" stroke-width="0.8"/><line x1="40" y1="200" x2="830" y2="200" stroke="#4E5964" stroke-width="1"/><text x="430.0" y="325" font-size="11.5" fill="#7A8590" text-anchor="middle">표의 값은 DDPM 선형 일정(T = 1000)에서 내가 계산한 것이다. 분산 몫의 분모는 1 - alpha_{t-1}.</text></svg>
