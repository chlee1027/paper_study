<svg xmlns="http://www.w3.org/2000/svg" width="860" height="290" viewBox="0 0 860 290" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="정리 1 증명에서 바뀌는 세 자리"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker><marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9A7B00"/></marker></defs><text x="430.0" y="26" font-size="15" fill="#1C232C" text-anchor="middle" font-weight="700">부록 B 정리 1 의 증명에서 바뀌어야 하는 세 자리 (내가 유도한 것)</text><rect x="30" y="50" width="110" height="34" fill="#DDE3E0"/><text x="85.0" y="70.96" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="700">자리</text><rect x="140" y="50" width="210" height="34" fill="#DDE3E0"/><text x="245.0" y="70.96" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="700">원문</text><rect x="350" y="50" width="250" height="34" fill="#DDE3E0"/><text x="475.0" y="70.96" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="700">바로 계산하면</text><rect x="600" y="50" width="230" height="34" fill="#DDE3E0"/><text x="715.0" y="70.96" font-size="11" fill="#1C232C" text-anchor="middle" font-weight="700">까닭</text><line x1="30" y1="84" x2="830" y2="84" stroke="#CFD6D3" stroke-width="0.8"/><text x="85.0" y="104.96" font-size="11" fill="#4E5964" text-anchor="middle">식 30</text><text x="245.0" y="104.96" font-size="11" fill="#4E5964" text-anchor="middle">||x_0 - f||^2 / (2 sigma_t^2)</text><text x="475.0" y="104.96" font-size="11" fill="#4E5964" text-anchor="middle">c_t^2 ||x_0 - f||^2 / (2 sigma_t^2)</text><text x="715.0" y="104.96" font-size="11" fill="#4E5964" text-anchor="middle">두 평균의 차에 x_0 의 계수 c_t 가 곱해진다</text><line x1="30" y1="118" x2="830" y2="118" stroke="#CFD6D3" stroke-width="0.8"/><text x="85.0" y="138.96" font-size="11" fill="#4E5964" text-anchor="middle">식 31 -&gt; 32</text><text x="245.0" y="138.96" font-size="11" fill="#4E5964" text-anchor="middle">(1 - alpha_t) 가 없다</text><text x="475.0" y="138.96" font-size="11" fill="#4E5964" text-anchor="middle">(1 - alpha_t) / alpha_t 가 곱해진다</text><text x="715.0" y="138.96" font-size="11" fill="#4E5964" text-anchor="middle">epsilon 앞의 sqrt(1 - alpha_t) 제곱</text><line x1="30" y1="152" x2="830" y2="152" stroke="#CFD6D3" stroke-width="0.8"/><text x="85.0" y="172.96" font-size="11" fill="#4E5964" text-anchor="middle">식 32 · 34 · 35</text><text x="245.0" y="172.96" font-size="11" fill="#4E5964" text-anchor="middle">분모에 d</text><text x="475.0" y="172.96" font-size="11" fill="#4E5964" text-anchor="middle">d 없음</text><text x="715.0" y="172.96" font-size="11" fill="#4E5964" text-anchor="middle">식 5 의 노름은 차원으로 나누지 않는다</text><line x1="30" y1="186" x2="830" y2="186" stroke="#CFD6D3" stroke-width="0.8"/><text x="85.0" y="206.96" font-size="11" fill="#4E5964" text-anchor="middle" font-weight="700">결과 gamma_t</text><text x="245.0" y="206.96" font-size="11" fill="#C0392B" text-anchor="middle" font-weight="700">1 / (2 d sigma_t^2 alpha_t)</text><text x="475.0" y="206.96" font-size="11" fill="#1E8449" text-anchor="middle" font-weight="700">c_t^2 (1 - alpha_t) / (2 sigma_t^2 alpha_t)</text><text x="715.0" y="206.96" font-size="11" fill="#4E5964" text-anchor="middle">sigma^2 = beta-tilde 이면 식 66 과 같다</text><line x1="30" y1="220" x2="830" y2="220" stroke="#CFD6D3" stroke-width="0.8"/><line x1="30" y1="50" x2="830" y2="50" stroke="#4E5964" stroke-width="1"/><text x="430.0" y="245" font-size="12.5" fill="#1C232C" text-anchor="middle" font-weight="700">c_t = sqrt(alpha_{t-1}) - sqrt(1 - alpha_{t-1} - sigma_t^2) · sqrt(alpha_t / (1 - alpha_t))</text><text x="430.0" y="270" font-size="11.5" fill="#4E5964" text-anchor="middle">sigma = beta-tilde 에서 c_2 = 0.5453 · c_500 = 0.00307 · c_1000 = 0.00013. 「≡」 는 상수 차만 허용하므로 c_t^2 은 뺄 수 없다.</text></svg>
