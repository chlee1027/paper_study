<svg xmlns="http://www.w3.org/2000/svg" width="900" height="450" viewBox="0 0 900 450" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="Elman 1990 의 계보"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="28" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">그림 15. 순차 데이터 갈래의 첫 칸 — 앞에서 받은 것과 뒤로 넘긴 것</text><rect x="40" y="70" width="250" height="56" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="165" y="94" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">퍼셉트론 1958</text><text x="165" y="114" font-size="11" fill="#1E8449" text-anchor="middle">읽음</text><rect x="40" y="150" width="250" height="56" rx="6" fill="#F6F7F5" stroke="#1E8449" stroke-width="1.6"/><text x="165" y="174" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">역전파 1986</text><text x="165" y="194" font-size="11" fill="#1E8449" text-anchor="middle">읽음 — 9 절 되먹임 망 펼치기</text><rect x="40" y="230" width="250" height="56" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.6"/><text x="165" y="254" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">Jordan 1986</text><text x="165" y="274" font-size="11" fill="#7A8590" text-anchor="middle">안 읽음 — 출력을 상태로 되먹임</text><rect x="330" y="150" width="250" height="56" rx="6" fill="#F6F7F5" stroke="#2E6B8A" stroke-width="1.6"/><text x="455" y="174" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">Elman 1990</text><text x="455" y="194" font-size="11" fill="#2E6B8A" text-anchor="middle">이 노트 — 은닉을 문맥으로 복사</text><rect x="620" y="70" width="250" height="56" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.6"/><text x="745" y="94" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">기울기 소실 1991 · 1994</text><text x="745" y="114" font-size="11" fill="#7A8590" text-anchor="middle">안 읽음 — Hochreiter · Bengio 외</text><rect x="620" y="150" width="250" height="56" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="745" y="174" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">LSTM 1997</text><text x="745" y="194" font-size="11" fill="#B4552B" text-anchor="middle">다음 칸 — 원문 받아 둠</text><rect x="620" y="230" width="250" height="56" rx="6" fill="#F6F7F5" stroke="#B4552B" stroke-width="1.6"/><text x="745" y="254" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">GRU · seq2seq 2014</text><text x="745" y="274" font-size="11" fill="#B4552B" text-anchor="middle">그다음 — 원문 받아 둠</text><rect x="620" y="310" width="250" height="56" rx="6" fill="#F6F7F5" stroke="#7A8590" stroke-width="1.6"/><text x="745" y="334" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">Attention 2015 · Transformer 2017</text><text x="745" y="354" font-size="11" fill="#7A8590" text-anchor="middle">로드맵 끝 두 칸</text><line x1="165" y1="126" x2="165" y2="148" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="292" y1="178" x2="328" y2="178" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="292" y1="258" x2="328" y2="190" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="582" y1="178" x2="618" y2="178" stroke="#B4552B" stroke-width="1.6" marker-end="url(#ar)"/><line x1="582" y1="166" x2="618" y2="104" stroke="#7A8590" stroke-width="1.4" marker-end="url(#ai)"/><line x1="745" y1="206" x2="745" y2="228" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><line x1="745" y1="286" x2="745" y2="308" stroke="#4E5964" stroke-width="1.4" marker-end="url(#ai)"/><text x="40" y="396" font-size="11" fill="#B4552B" text-anchor="start">넘긴 자리: 원문 204 쪽 — 「활성 함수가 기억에 거듭 걸려 지수로 줄어든다」 · 「오차를 늦게 넣는 과제에서 성능이 나빴다」.</text><text x="40" y="416" font-size="11" fill="#4E5964" text-anchor="start">그 두 문장을 기울기 쪽에서 정리한 것이 1991 · 1994 의 소실 분석이고, 기억을 곱셈이 아니라 덧셈으로 잇는 칸을 둔 것이 LSTM 이다(다음 노트에서 확인).</text></svg>
