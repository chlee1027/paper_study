<svg xmlns="http://www.w3.org/2000/svg" width="900" height="380" viewBox="0 0 900 380" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="그림 9 의 BOY 출현 위치별 덩어리"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="28" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">그림 13. 원문 그림 9 의 BOY 출현 — 잎 순서로 센 위치별 덩어리</text><text x="186" y="90" font-size="12" fill="#1C232C" text-anchor="end">위 덩어리</text><rect x="200" y="70" width="108" height="30" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><rect x="308" y="70" width="48" height="30" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="366" y="90" font-size="11" fill="#4E5964" text-anchor="start">문장 끝 9 · 첫머리 4</text><text x="186" y="142" font-size="12" fill="#1C232C" text-anchor="end">가운데 덩어리</text><rect x="200" y="122" width="384" height="30" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="594" y="142" font-size="11" fill="#4E5964" text-anchor="start">문장 끝 0 · 첫머리 32</text><text x="186" y="194" font-size="12" fill="#1C232C" text-anchor="end">아래 덩어리</text><rect x="200" y="174" width="72" height="30" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><rect x="272" y="174" width="12" height="30" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="294" y="194" font-size="11" fill="#4E5964" text-anchor="start">문장 끝 6 · 첫머리 1</text><rect x="200" y="238" width="20" height="14" rx="2" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="228" y="250" font-size="11" fill="#4E5964" text-anchor="start">BOY 가 문장 끝 (예: woman smell BOY)</text><rect x="520" y="238" width="20" height="14" rx="2" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="548" y="250" font-size="11" fill="#4E5964" text-anchor="start">BOY 가 문장 첫머리 (예: BOY see rock)</text><text x="30" y="290" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">내가 센 것: 잎 52 개 = 문장 끝 15 + 첫머리 37. 첫머리 37 개 중 5 개는 끝 쪽 덩어리에 섞였다 — 원문의 「(with some exceptions)」.</text><text x="30" y="310" font-size="11" fill="#7A8590" text-anchor="start">글자가 겹쳐 찍힌 잎이 있어 개수에 ±2 를 둔다. 원문은 출현 수 · 섞인 수를 적지 않는다.</text><text x="30" y="330" font-size="11" fill="#4E5964" text-anchor="start">첫머리 출현의 라벨은 BOY 뒤에 올 낱말을 보여 준다(BOY see rock). 그 시점의 은닉 상태는 뒤 낱말을 보지 못했다 — 라벨이 문맥이 아니라 문장 이름이다.</text><text x="30" y="350" font-size="11" fill="#C0392B" text-anchor="start">라벨 가운데 woman eat BOY · man eat BOY · BOY eat woman 은 표 4 의 틀(사람 eat 음식, 공격자 eat 사람 · 동물 · 음식)로 만들 수 없다.</text></svg>
