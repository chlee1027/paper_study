<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="306" viewBox="0 0 1060 306" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="망 넷의 파라미터 수와 학습 걸음"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="28" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">그림 14. 망 넷의 크기와 학습 걸음 수 — 내가 센 것</text><text x="30" y="64" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">과제</text><text x="230" y="64" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">입력-은닉(=문맥)-출력</text><text x="410" y="64" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">연결 무게</text><text x="510" y="64" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">편향 넣으면</text><text x="620" y="64" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">문맥→은닉 몫</text><text x="730" y="64" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">열 길이 × 통과</text><text x="900" y="64" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">학습 걸음</text><text x="30" y="92" font-size="12" fill="#1C232C" text-anchor="start">시간 XOR</text><text x="230" y="92" font-size="12" fill="#4E5964" text-anchor="start">1-2-1</text><text x="410" y="92" font-size="12" fill="#4E5964" text-anchor="start">8</text><text x="510" y="92" font-size="12" fill="#4E5964" text-anchor="start">11</text><text x="620" y="92" font-size="12" fill="#4E5964" text-anchor="start">50.0%</text><text x="730" y="92" font-size="12" fill="#4E5964" text-anchor="start">3,000 × 600</text><text x="900" y="92" font-size="12" fill="#4E5964" text-anchor="start">1,800,000</text><line x1="30" y1="102" x2="1010" y2="102" stroke="#CFD6D3" stroke-width="0.8"/><text x="30" y="122" font-size="12" fill="#1C232C" text-anchor="start">글자 열 (ba · dii · guuu)</text><text x="230" y="122" font-size="12" fill="#4E5964" text-anchor="start">6-20-6</text><text x="410" y="122" font-size="12" fill="#4E5964" text-anchor="start">640</text><text x="510" y="122" font-size="12" fill="#4E5964" text-anchor="start">666</text><text x="620" y="122" font-size="12" fill="#4E5964" text-anchor="start">62.5%</text><text x="730" y="122" font-size="12" fill="#4E5964" text-anchor="start">3,000 × 200</text><text x="900" y="122" font-size="12" fill="#4E5964" text-anchor="start">600,000</text><line x1="30" y1="132" x2="1010" y2="132" stroke="#CFD6D3" stroke-width="0.8"/><text x="30" y="152" font-size="12" fill="#1C232C" text-anchor="start">낱말 찾기</text><text x="230" y="152" font-size="12" fill="#4E5964" text-anchor="start">5-20-5</text><text x="410" y="152" font-size="12" fill="#4E5964" text-anchor="start">600</text><text x="510" y="152" font-size="12" fill="#4E5964" text-anchor="start">625</text><text x="620" y="152" font-size="12" fill="#4E5964" text-anchor="start">66.7%</text><text x="730" y="152" font-size="12" fill="#4E5964" text-anchor="start">4,963 × 10</text><text x="900" y="152" font-size="12" fill="#4E5964" text-anchor="start">49,630</text><line x1="30" y1="162" x2="1010" y2="162" stroke="#CFD6D3" stroke-width="0.8"/><text x="30" y="182" font-size="12" fill="#1C232C" text-anchor="start">문장 → 품사</text><text x="230" y="182" font-size="12" fill="#4E5964" text-anchor="start">31-150-31</text><text x="410" y="182" font-size="12" fill="#4E5964" text-anchor="start">31,800</text><text x="510" y="182" font-size="12" fill="#4E5964" text-anchor="start">31,981</text><text x="620" y="182" font-size="12" fill="#4E5964" text-anchor="start">70.8%</text><text x="730" y="182" font-size="12" fill="#4E5964" text-anchor="start">27,534 × 6</text><text x="900" y="182" font-size="12" fill="#4E5964" text-anchor="start">165,204</text><line x1="30" y1="192" x2="1010" y2="192" stroke="#CFD6D3" stroke-width="0.8"/><text x="30" y="236" font-size="11" fill="#4E5964" text-anchor="start">원문은 편향(bias)을 쓰는지 적지 않는다. 그래서 둘을 다 적었다. 글자 열 과제의 길이는 자음 1,000 개에 모음이 1 · 2 · 3 개씩 붙는 규칙에서 낸 기댓값이다.</text><text x="30" y="256" font-size="11" fill="#4E5964" text-anchor="start">문맥→은닉 무게가 은닉 유닛 수의 제곱이라, 은닉 150 인 문장 망에서는 연결 무게의 70.8% 가 기억을 읽는 자리다.</text><text x="30" y="276" font-size="11" fill="#4E5964" text-anchor="start">학습률 · 모멘텀 · 처음 무게 범위 · 무작위 씨앗 수는 넷 다 적혀 있지 않다.</text></svg>
