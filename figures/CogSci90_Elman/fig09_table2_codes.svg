t" font-family="Consolas, D2Coding, monospace">00001</text><text x="320" y="88" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">1</text><text x="460" y="88" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">00001</text><text x="680" y="88" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="112" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">b</text><text x="160" y="112" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">00010</text><text x="320" y="112" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">2</text><text x="460" y="112" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">00010</text><text x="680" y="112" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="136" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">d</text><text x="160" y="136" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">00100</text><text x="320" y="136" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">4</text><text x="460" y="136" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">00100</text><text x="680" y="136" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="160" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">e</text><text x="160" y="160" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">00101</text><text x="320" y="160" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">5</text><text x="460" y="160" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">00101</text><text x="680" y="160" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="184" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">g</text><text x="160" y="184" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">00111</text><text x="320" y="184" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">7</text><text x="460" y="184" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">00111</text><text x="680" y="184" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="208" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">i</text><text x="160" y="208" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01001</text><text x="320" y="208" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">9</text><text x="460" y="208" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01001</text><text x="680" y="208" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="232" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">l</text><text x="160" y="232" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01100</text><text x="320" y="232" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">12</text><text x="460" y="232" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01100</text><text x="680" y="232" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="256" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">m</text><text x="160" y="256" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01101</text><text x="320" y="256" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">13</text><text x="460" y="256" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01101</text><text x="680" y="256" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="280" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">n</text><text x="160" y="280" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01110</text><text x="320" y="280" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">14</text><text x="460" y="280" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01110</text><text x="680" y="280" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="304" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">o</text><text x="160" y="304" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01111</text><text x="320" y="304" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">15</text><text x="460" y="304" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">01111</text><text x="680" y="304" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="328" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">r</text><text x="160" y="328" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">10010</text><text x="320" y="328" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">18</text><text x="460" y="328" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">10010</text><text x="680" y="328" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="352" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">s</text><text x="160" y="352" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">10011</text><text x="320" y="352" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">19</text><text x="460" y="352" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">10011</text><text x="680" y="352" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="376" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold" font-family="Consolas, D2Coding, monospace">y</text><text x="160" y="376" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">11001</text><text x="320" y="376" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">25</text><text x="460" y="376" font-size="13" fill="#1C232C" text-anchor="start" font-family="Consolas, D2Coding, monospace">11001</text><text x="680" y="376" font-size="12" fill="#1E8449" text-anchor="start">같다</text><text x="60" y="410" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">내가 센 것: 13 글자 중 13 글자가 같다. 원문 본문은 「each letter ... was converted into a 5-bit random vector」 라고 적는다.</text><text x="60" y="430" font-size="11" fill="#4E5964" text-anchor="start">알파벳 순번 부호라면 비슷한 순번끼리 비트를 나눈다 — 예: a(00001) 와 e(00101) 는 한 비트만 다르다. 그림 6 의 오차는 이 겹침 위에서 잰 것이다.</text><text x="60" y="450" font-size="11" fill="#4E5964" text-anchor="start">표 2 의 마지막 입력 줄은 「11001 (i)」 로 찍혀 있다 — 11001 은 y 의 부호이고 i 는 01001 이다. 출력 칸은 그 줄이 없어 한 줄 짧다.</text></svg>
