<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="그림 7 과 그림 8 의 사람 갈래 합류 거리"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="28" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">그림 11. 사람 갈래가 합쳐지는 거리 — 원문 그림 7(학습 말뭉치) 과 그림 8(man 을 zog 로 바꾼 새 말뭉치)</text><text x="120" y="62" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">그림 7 — man 은 사람 셋 사이(0.21)에서 합쳐진다</text><text x="830" y="88" font-size="12" fill="#1C232C" text-anchor="start">woman</text><text x="830" y="110" font-size="12" fill="#1C232C" text-anchor="start">girl</text><text x="830" y="132" font-size="12" fill="#C0392B" text-anchor="start" font-weight="bold">man</text><text x="830" y="154" font-size="12" fill="#1C232C" text-anchor="start">boy</text><text x="830" y="176" font-size="12" fill="#1C232C" text-anchor="start">동물 갈래</text><line x1="820.0" y1="84" x2="820" y2="84" stroke="#4E5964" stroke-width="1.6"/><line x1="766.4705882352941" y1="84" x2="820.0" y2="84" stroke="#4E5964" stroke-width="1.6"/><line x1="766.4705882352941" y1="106" x2="820" y2="106" stroke="#4E5964" stroke-width="1.6"/><line x1="766.4705882352941" y1="84" x2="766.4705882352941" y2="106" stroke="#4E5964" stroke-width="1.6"/><rect x="732.4705882352941" y="89" width="30" height="14" rx="2" fill="#ECEFEC" stroke="none" stroke-width="1.2"/><text x="761.4705882352941" y="100" font-size="10" fill="#9A7B00" text-anchor="end">0.13</text><line x1="733.5294117647059" y1="95.0" x2="766.4705882352941" y2="95.0" stroke="#4E5964" stroke-width="1.6"/><line x1="733.5294117647059" y1="128" x2="820" y2="128" stroke="#C0392B" stroke-width="1.6"/><line x1="733.5294117647059" y1="95.0" x2="733.5294117647059" y2="128" stroke="#4E5964" stroke-width="1.6"/><rect x="699.5294117647059" y="111" width="30" height="14" rx="2" fill="#ECEFEC" stroke="none" stroke-width="1.2"/><text x="728.5294117647059" y="122" font-size="10" fill="#9A7B00" text-anchor="end">0.21</text><line x1="700.5882352941177" y1="111.5" x2="733.5294117647059" y2="111.5" stroke="#4E5964" stroke-width="1.6"/><line x1="700.5882352941177" y1="150" x2="820" y2="150" stroke="#4E5964" stroke-width="1.6"/><line x1="700.5882352941177" y1="111.5" x2="700.5882352941177" y2="150" stroke="#4E5964" stroke-width="1.6"/><rect x="666.5882352941177" y="133" width="30" height="14" rx="2" fill="#ECEFEC" stroke="none" stroke-width="1.2"/><text x="695.5882352941177" y="144" font-size="10" fill="#9A7B00" text-anchor="end">0.29</text><line x1="560.5882352941176" y1="130.75" x2="700.5882352941177" y2="130.75" stroke="#4E5964" stroke-width="1.6"/><line x1="560.5882352941176" y1="172" x2="820" y2="172" stroke="#4E5964" stroke-width="1.6"/><line x1="560.5882352941176" y1="130.75" x2="560.5882352941176" y2="172" stroke="#4E5964" stroke-width="1.6"/><rect x="526.5882352941176" y="155" width="30" height="14" rx="2" fill="#ECEFEC" stroke="none" stroke-width="1.2"/><text x="555.5882352941176" y="166" font-size="10" fill="#9A7B00" text-anchor="end">0.63</text><line x1="120" y1="196" x2="820" y2="196" stroke="#4E5964" stroke-width="1.2"/><line x1="820.0" y1="196" x2="820.0" y2="201" stroke="#4E5964" stroke-width="1"/><text x="820.0" y="215" font-size="10" fill="#7A8590" text-anchor="middle">0.0</text><line x1="614.1176470588235" y1="196" x2="614.1176470588235" y2="201" stroke="#4E5964" stroke-width="1"/><text x="614.1176470588235" y="215" font-size="10" fill="#7A8590" text-anchor="middle">0.5</text><line x1="408.2352941176471" y1="196" x2="408.2352941176471" y2="201" stroke="#4E5964" stroke-width="1"/><text x="408.2352941176471" y="215" font-size="10" fill="#7A8590" text-anchor="middle">1.0</text><line x1="202.3529411764706" y1="196" x2="202.3529411764706" y2="201" stroke="#4E5964" stroke-width="1"/><text x="202.3529411764706" y="215" font-size="10" fill="#7A8590" text-anchor="middle">1.5</text><text x="120" y="252" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">그림 8 — zog 는 사람 셋이 다 모인 뒤(0.70)에 붙는다</text><text x="830" y="278" font-size="12" fill="#1C232C" text-anchor="start">woman</text><text x="830" y="300" font-size="12" fill="#1C232C" text-anchor="start">girl</text><text x="830" y="322" font-size="12" fill="#1C232C" text-anchor="start">boy</text><text x="830" y="344" font-size="12" fill="#C0392B" text-anchor="start" font-weight="bold">zog</text><text x="830" y="366" font-size="12" fill="#1C232C" text-anchor="start">동물 갈래</text><line x1="820.0" y1="274" x2="820" y2="274" stroke="#4E5964" stroke-width="1.6"/><line x1="704.7058823529412" y1="274" x2="820.0" y2="274" stroke="#4E5964" stroke-width="1.6"/><line x1="704.7058823529412" y1="296" x2="820" y2="296" stroke="#4E5964" stroke-width="1.6"/><line x1="704.7058823529412" y1="274" x2="704.7058823529412" y2="296" stroke="#4E5964" stroke-width="1.6"/><rect x="670.7058823529412" y="279" width="30" height="14" rx="2" fill="#ECEFEC" stroke="none" stroke-width="1.2"/><text x="699.7058823529412" y="290" font-size="10" fill="#9A7B00" text-anchor="end">0.28</text><line x1="671.7647058823529" y1="285.0" x2="704.7058823529412" y2="285.0" stroke="#4E5964" stroke-width="1.6"/><line x1="671.7647058823529" y1="318" x2="820" y2="318" stroke="#4E5964" stroke-width="1.6"/><line x1="671.7647058823529" y1="285.0" x2="671.7647058823529" y2="318" stroke="#4E5964" stroke-width="1.6"/><rect x="637.7647058823529" y="301" width="30" height="14" rx="2" fill="#ECEFEC" stroke="none" stroke-width="1.2"/><text x="666.7647058823529" y="312" font-size="10" fill="#9A7B00" text-anchor="end">0.36</text><line x1="531.7647058823529" y1="301.5" x2="671.7647058823529" y2="301.5" stroke="#4E5964" stroke-width="1.6"/><line x1="531.7647058823529" y1="340" x2="820" y2="340" stroke="#C0392B" stroke-width="1.6"/><line x1="531.7647058823529" y1="301.5" x2="531.7647058823529" y2="340" stroke="#4E5964" stroke-width="1.6"/><rect x="497.7647058823529" y="323" width="30" height="14" rx="2" fill="#ECEFEC" stroke="none" stroke-width="1.2"/><text x="526.7647058823529" y="334" font-size="10" fill="#9A7B00" text-anchor="end">0.70</text><line x1="498.8235294117647" y1="320.75" x2="531.7647058823529" y2="320.75" stroke="#4E5964" stroke-width="1.6"/><line x1="498.8235294117647" y1="362" x2="820" y2="362" stroke="#4E5964" stroke-width="1.6"/><line x1="498.8235294117647" y1="320.75" x2="498.8235294117647" y2="362" stroke="#4E5964" stroke-width="1.6"/><rect x="464.8235294117647" y="345" width="30" height="14" rx="2" fill="#ECEFEC" stroke="none" stroke-width="1.2"/><text x="493.8235294117647" y="356" font-size="10" fill="#9A7B00" text-anchor="end">0.78</text><line x1="120" y1="386" x2="820" y2="386" stroke="#4E5964" stroke-width="1.2"/><line x1="820.0" y1="386" x2="820.0" y2="391" stroke="#4E5964" stroke-width="1"/><text x="820.0" y="405" font-size="10" fill="#7A8590" text-anchor="middle">0.0</text><line x1="614.1176470588235" y1="386" x2="614.1176470588235" y2="391" stroke="#4E5964" stroke-width="1"/><text x="614.1176470588235" y="405" font-size="10" fill="#7A8590" text-anchor="middle">0.5</text><line x1="408.2352941176471" y1="386" x2="408.2352941176471" y2="391" stroke="#4E5964" stroke-width="1"/><text x="408.2352941176471" y="405" font-size="10" fill="#7A8590" text-anchor="middle">1.0</text><line x1="202.3529411764706" y1="386" x2="202.3529411764706" y2="391" stroke="#4E5964" stroke-width="1"/><text x="202.3529411764706" y="405" font-size="10" fill="#7A8590" text-anchor="middle">1.5</text><text x="30" y="432" font-size="11" fill="#7A8590" text-anchor="start">거리는 그림 12 의 읽기 B(잎이 0 에 오는 읽기)로 적었다. 읽기 오차 ±0.02.</text><text x="30" y="452" font-size="11" fill="#1C232C" text-anchor="start" font-weight="bold">내가 센 비: man 이 붙는 거리 / 사람 갈래가 동물 갈래와 합쳐지는 거리 = 0.33, 같은 비가 zog 는 0.90 (읽기 A 로는 0.63 대 0.94).</text><text x="30" y="472" font-size="11" fill="#4E5964" text-anchor="start">zog 는 생물 · 사람 쪽 가지에 들어간다(원문의 말과 같다). 다만 사람 셋과의 거리로는 man 이 있던 자리보다 동물 갈래와의 합류점에 가깝게 붙는다.</text><text x="30" y="492" font-size="11" fill="#4E5964" text-anchor="start">두 그림은 말뭉치가 다르고(그림 8 은 새 10,000 문장을 한 번 통과) 거리의 크기도 다르다(woman-girl 0.13 대 0.28) — 그래서 비로 견줬다.</text></svg>
