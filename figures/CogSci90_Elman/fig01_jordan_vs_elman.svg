<svg xmlns="http://www.w3.org/2000/svg" width="880" height="432" viewBox="0 0 880 432" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="Jordan 망과 Elman 단순 순환망의 구조"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="28" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">그림 1. 되먹임을 어디서 받는가 — Jordan(1986) 은 출력에서, Elman(1990) 은 은닉층에서</text><rect x="40" y="50" width="380" height="330" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="230" y="74" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">Jordan (1986) — 원문 그림 1</text><rect x="160" y="100" width="140" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="230" y="122" font-size="12" fill="#1C232C" text-anchor="middle">출력</text><rect x="160" y="190" width="140" height="34" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="230" y="212" font-size="12" fill="#1C232C" text-anchor="middle">은닉</text><rect x="70" y="290" width="130" height="34" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="135" y="312" font-size="12" fill="#1C232C" text-anchor="middle">입력 (계획)</text><rect x="260" y="290" width="130" height="34" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="325" y="312" font-size="12" fill="#1C232C" text-anchor="middle">상태 (state)</text><line x1="135" y1="290" x2="200" y2="226" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><line x1="325" y1="290" x2="260" y2="226" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><line x1="230" y1="190" x2="230" y2="136" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><path d="M302,117 C410,117 410,300 392,300" fill="none" stroke="#B4552B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="336" y="186" width="56" height="18" rx="3" fill="#F4F6F4" stroke="none" stroke-width="1.2"/><text x="364" y="199" font-size="11" fill="#B4552B" text-anchor="middle">복사 1.0</text><path d="M305,326 C305,350 345,350 345,326" fill="none" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ar)"/><text x="325" y="362" font-size="11" fill="#B4552B" text-anchor="middle">상태 유닛의 자기 되먹임</text><rect x="460" y="50" width="380" height="330" rx="10" fill="#F4F6F4" stroke="#CFD6D3" stroke-width="1.2"/><text x="650" y="74" font-size="13" fill="#1C232C" text-anchor="middle" font-weight="bold">Elman (1990) 단순 순환망 — 원문 그림 2</text><rect x="580" y="100" width="140" height="34" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="650" y="122" font-size="12" fill="#1C232C" text-anchor="middle">출력</text><rect x="580" y="190" width="140" height="34" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="650" y="212" font-size="12" fill="#1C232C" text-anchor="middle">은닉 h(t)</text><rect x="490" y="290" width="130" height="34" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="555" y="312" font-size="12" fill="#1C232C" text-anchor="middle">입력 x(t)</text><rect x="680" y="290" width="130" height="34" rx="6" fill="#F2DED2" stroke="#B4552B" stroke-width="1.2"/><text x="745" y="312" font-size="12" fill="#1C232C" text-anchor="middle">문맥 c(t) = h(t-1)</text><line x1="555" y1="290" x2="620" y2="226" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><line x1="745" y1="290" x2="680" y2="226" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><line x1="650" y1="190" x2="650" y2="136" stroke="#2E6B8A" stroke-width="1.6" marker-end="url(#af)"/><path d="M722,207 C820,207 800,290 790,290" fill="none" stroke="#B4552B" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="744" y="238" width="56" height="18" rx="3" fill="#F4F6F4" stroke="none" stroke-width="1.2"/><text x="772" y="251" font-size="11" fill="#B4552B" text-anchor="middle">복사 1.0</text><text x="650" y="352" font-size="11" fill="#4E5964" text-anchor="middle">은닉 유닛 수 = 문맥 유닛 수 (각주 3)</text><text x="650" y="370" font-size="11" fill="#4E5964" text-anchor="middle">문맥의 첫 값 0.5 (182 쪽)</text><line x1="60" y1="410" x2="100" y2="410" stroke="#2E6B8A" stroke-width="1.8"/><text x="108" y="414" font-size="11" fill="#4E5964" text-anchor="start">학습되는 연결 (원문 그림 2 의 점선)</text><line x1="400" y1="410" x2="440" y2="410" stroke="#B4552B" stroke-width="1.8" stroke-dasharray="6 4"/><text x="448" y="414" font-size="11" fill="#4E5964" text-anchor="start">무게 1.0 으로 고정된 한 대 한 복사 — 학습하지 않는다</text></svg>
