<svg xmlns="http://www.w3.org/2000/svg" width="880" height="346" viewBox="0 0 880 346" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="문장 말뭉치 길이 셋과 기댓값"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="28" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">그림 10. 문장 말뭉치의 길이가 원문에 세 가지로 적혀 있다</text><rect x="384.5940724502968" y="70" width="404.14518843273976" height="70" rx="0" fill="#D8E7EE" stroke="none" stroke-width="1.2"/><rect x="485.63036955848173" y="70" width="202.07259421636985" height="70" rx="0" fill="#B9D3E0" stroke="none" stroke-width="1.2"/><line x1="586.6666666666667" y1="64" x2="586.6666666666667" y2="146" stroke="#2E6B8A" stroke-width="1.6" stroke-dasharray="5 3"/><text x="586.6666666666667" y="58" font-size="11" fill="#2E6B8A" text-anchor="middle">기댓값 27,500 (틀 16 개를 고르게 뽑는다고 둘 때)</text><line x1="120" y1="140" x2="820" y2="140" stroke="#4E5964" stroke-width="1.2"/><line x1="120.0" y1="140" x2="120.0" y2="145" stroke="#4E5964" stroke-width="1"/><text x="120.0" y="160" font-size="10" fill="#7A8590" text-anchor="middle">27,300</text><line x1="236.66666666666669" y1="140" x2="236.66666666666669" y2="145" stroke="#4E5964" stroke-width="1"/><text x="236.66666666666669" y="160" font-size="10" fill="#7A8590" text-anchor="middle">27,350</text><line x1="353.33333333333337" y1="140" x2="353.33333333333337" y2="145" stroke="#4E5964" stroke-width="1"/><text x="353.33333333333337" y="160" font-size="10" fill="#7A8590" text-anchor="middle">27,400</text><line x1="470.0" y1="140" x2="470.0" y2="145" stroke="#4E5964" stroke-width="1"/><text x="470.0" y="160" font-size="10" fill="#7A8590" text-anchor="middle">27,450</text><line x1="586.6666666666667" y1="140" x2="586.6666666666667" y2="145" stroke="#4E5964" stroke-width="1"/><text x="586.6666666666667" y="160" font-size="10" fill="#7A8590" text-anchor="middle">27,500</text><line x1="703.3333333333334" y1="140" x2="703.3333333333334" y2="145" stroke="#4E5964" stroke-width="1"/><text x="703.3333333333334" y="160" font-size="10" fill="#7A8590" text-anchor="middle">27,550</text><line x1="820.0" y1="140" x2="820.0" y2="145" stroke="#4E5964" stroke-width="1"/><text x="820.0" y="160" font-size="10" fill="#7A8590" text-anchor="middle">27,600</text><line x1="246.0" y1="80" x2="246.0" y2="140" stroke="#C0392B" stroke-width="2.4"/><text x="246.0" y="186" font-size="12" fill="#C0392B" text-anchor="middle" font-weight="bold">27,354</text><text x="246.0" y="204" font-size="10" fill="#4E5964" text-anchor="middle">2 번 · 196 · 199 쪽</text><text x="246.0" y="220" font-size="10" fill="#4E5964" text-anchor="middle">z = -3.4</text><line x1="479.3333333333333" y1="80" x2="479.3333333333333" y2="140" stroke="#9A7B00" stroke-width="2.4"/><text x="479.3333333333333" y="186" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">27,454</text><text x="479.3333333333333" y="204" font-size="10" fill="#4E5964" text-anchor="middle">3 번 · 204 · 205 쪽</text><text x="479.3333333333333" y="220" font-size="10" fill="#4E5964" text-anchor="middle">z = -1.1</text><line x1="666.0" y1="80" x2="666.0" y2="140" stroke="#9A7B00" stroke-width="2.4"/><text x="666.0" y="186" font-size="12" fill="#9A7B00" text-anchor="middle" font-weight="bold">27,534</text><text x="666.0" y="204" font-size="10" fill="#4E5964" text-anchor="middle">3 번 · 195 · 197 쪽</text><text x="666.0" y="220" font-size="10" fill="#4E5964" text-anchor="middle">z = +0.8</text><text x="691.7029637748516" y="132" font-size="10" fill="#2E6B8A" text-anchor="start">±1 표준편차 43</text><text x="30" y="256" font-size="11" fill="#1C232C" text-anchor="start">같은 말뭉치(10,000 문장)의 낱말 수가 27,534 (세 번) · 27,354 (두 번) · 27,454 (세 번) 으로 적혀 있다. 앞 둘은 두 자리가 뒤바뀐 꼴이다.</text><text x="30" y="276" font-size="11" fill="#4E5964" text-anchor="start">표 4 의 틀은 16 개이고 그중 두 낱말 틀이 4 개다(본문은 「15 개」). 틀을 고르게 뽑는다는 것은 원문에 없는 가정이다 — 그 가정 아래서</text><text x="30" y="296" font-size="11" fill="#4E5964" text-anchor="start">27,534 는 +0.8, 27,454 는 −1.1, 27,354 는 −3.4 표준편차 자리다. 어느 것이 맞는지는 이것으로 정하지 않는다.</text><text x="30" y="316" font-size="11" fill="#4E5964" text-anchor="start">표 3 의 범주는 12 줄인데 본문은 「Thirteen classes」 라고 적는다. 표 3 의 NOUN-FOOD 예시 「cookie, break」 의 break 는 그림 7 의 bread 로 읽힌다.</text></svg>
