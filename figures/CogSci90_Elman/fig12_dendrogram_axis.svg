r="middle" font-weight="bold">1.5</text><text x="205.26458616010854" y="150" font-size="10" fill="#7A8590" text-anchor="middle">185 px</text><line x1="270.52917232021707" y1="86" x2="270.52917232021707" y2="98" stroke="#4E5964" stroke-width="1.4"/><text x="270.52917232021707" y="80" font-size="12" fill="#1C232C" text-anchor="middle">1.5</text><text x="270.52917232021707" y="114" font-size="11" fill="#7A8590" text-anchor="middle">1.5</text><text x="270.52917232021707" y="130" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">1.0</text><text x="336.146540027137" y="150" font-size="10" fill="#7A8590" text-anchor="middle">186 px</text><line x1="401.763907734057" y1="86" x2="401.763907734057" y2="98" stroke="#4E5964" stroke-width="1.4"/><text x="401.763907734057" y="80" font-size="12" fill="#1C232C" text-anchor="middle">1.0</text><text x="401.763907734057" y="114" font-size="11" fill="#7A8590" text-anchor="middle">1.0</text><text x="401.763907734057" y="130" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">0.5</text><text x="466.32293080054274" y="150" font-size="10" fill="#7A8590" text-anchor="middle">183 px</text><line x1="530.8819538670284" y1="86" x2="530.8819538670284" y2="98" stroke="#4E5964" stroke-width="1.4"/><text x="530.8819538670284" y="80" font-size="12" fill="#1C232C" text-anchor="middle">0.0</text><text x="530.8819538670284" y="114" font-size="11" fill="#7A8590" text-anchor="middle">0.5</text><text x="530.8819538670284" y="130" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">0.0</text><text x="595.4409769335142" y="150" font-size="10" fill="#7A8590" text-anchor="middle">183 px</text><line x1="660.0" y1="86" x2="660.0" y2="98" stroke="#4E5964" stroke-width="1.4"/><text x="660.0" y="80" font-size="12" fill="#1C232C" text-anchor="middle">-0.5</text><text x="660.0" y="114" font-size="11" fill="#7A8590" text-anchor="middle">0.0</text><text x="660.0" y="130" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">-0.5</text><text x="680" y="80" font-size="11" fill="#1C232C" text-anchor="start">원문 라벨</text><text x="680" y="114" font-size="11" fill="#7A8590" text-anchor="start">읽기 A: 뒤 둘을 고침</text><text x="680" y="130" font-size="11" fill="#2E6B8A" text-anchor="start">읽기 B: 앞 셋을 고침</text><text x="40" y="226" font-size="13" fill="#1C232C" text-anchor="start" font-weight="bold">그림 8</text><line x1="140" y1="222" x2="660" y2="222" stroke="#4E5964" stroke-width="1.4"/><line x1="140.0" y1="216" x2="140.0" y2="228" stroke="#4E5964" stroke-width="1.4"/><text x="140.0" y="210" font-size="12" fill="#1C232C" text-anchor="middle">2.0</text><text x="140.0" y="244" font-size="11" fill="#7A8590" text-anchor="middle">2.0</text><text x="140.0" y="260" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">1.5</text><text x="204.83790523690772" y="280" font-size="10" fill="#7A8590" text-anchor="middle">200 px</text><line x1="269.67581047381543" y1="216" x2="269.67581047381543" y2="228" stroke="#4E5964" stroke-width="1.4"/><text x="269.67581047381543" y="210" font-size="12" fill="#1C232C" text-anchor="middle">1.5</text><text x="269.67581047381543" y="244" font-size="11" fill="#7A8590" text-anchor="middle">1.5</text><text x="269.67581047381543" y="260" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">1.0</text><text x="335.1620947630922" y="280" font-size="10" fill="#7A8590" text-anchor="middle">202 px</text><line x1="400.6483790523691" y1="216" x2="400.6483790523691" y2="228" stroke="#4E5964" stroke-width="1.4"/><text x="400.6483790523691" y="210" font-size="12" fill="#1C232C" text-anchor="middle">1.0</text><text x="400.6483790523691" y="244" font-size="11" fill="#7A8590" text-anchor="middle">1.0</text><text x="400.6483790523691" y="260" font-size="11" fill="#2E6B8A" text-anchor="middle" font-weight="bold">0.5</text><text x="465.4862842892768" y="280" font-size="10" fill="#7A8590" text-anchor="middle">200 px</text><line x1="530.324