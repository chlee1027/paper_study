ext><text x="308" y="186" font-size="10" fill="#C0392B" text-anchor="middle">다름</text><text x="348" y="186" font-size="10" fill="#C0392B" text-anchor="middle">다름</text><text x="428" y="186" font-size="10" fill="#C0392B" text-anchor="middle">다름</text><text x="468" y="186" font-size="10" fill="#C0392B" text-anchor="middle">다름</text><text x="30" y="222" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">내가 센 것: 다른 자리 4 개 → 유클리드 거리 2.00, 겹치는 1 은 2 개 → 코사인 0.50</text><text x="30" y="244" font-size="12" fill="#4E5964" text-anchor="start">같은 모양 「111」 이 두 칸 옮겨졌을 뿐인데, 자리 하나하나를 독립된 차원으로 두는 표현에서는 반만 겹친다.</text><text x="30" y="266" font-size="12" fill="#4E5964" text-anchor="start">원문 각주 1 의 세 벡터 [1 0 0] · [0 1 0] · [0 0 1] 은 서로 직교한다(거리 1.41, 코사인 0) — 「같은 사건이 한 칸씩 늦게 온 것」 이 서로 가장 먼 점이 된다.</text><text x="30" y="288" font-size="12" fill="#4E5964" text-anchor="start">원문이 드는 단점 셋: (1) 입력을 한꺼번에 내놓을 버퍼가 필요하다 (2) 가장 긴 패턴에 입력층 크기를 맞춰야 한다 (3) 상대 위치와 절대 위치를 가르지 못한다.</text></svg>
