<svg xmlns="http://www.w3.org/2000/svg" width="880" height="320" viewBox="0 0 880 320" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="시간을 자리로 펼친 두 벡터의 거리"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="28" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">그림 3. 시간을 벡터의 자리로 펼치면 — 원문 3 절의 두 벡터</text><text x="30" y="92" font-size="12" fill="#1C232C" text-anchor="start">벡터 A</text><rect x="250" y="70" width="36" height="34" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="268" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">0</text><rect x="290" y="70" width="36" height="34" rx="3" fill="#F6D9D5" stroke="#4E5964" stroke-width="1.2"/><text x="308" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text><rect x="330" y="70" width="36" height="34" rx="3" fill="#F6D9D5" stroke="#4E5964" stroke-width="1.2"/><text x="348" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text><rect x="370" y="70" width="36" height="34" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><text x="388" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text><rect x="410" y="70" width="36" height="34" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="428" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">0</text><rect x="450" y="70" width="36" height="34" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="468" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">0</text><rect x="490" y="70" width="36" height="34" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="508" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">0</text><rect x="530" y="70" width="36" height="34" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="548" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">0</text><rect x="570" y="70" width="36" height="34" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="588" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">0</text><rect x="610" y="70" width="36" height="34" rx="3" fill="#D8E7EE" stroke="#4E5964" stroke-width="1.2"/><text x="628" y="93" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">1</text><text x="30" y="144" font-size="12" fill="#1C232C" text-anchor="start">벡터 B (A 의 111 을 두 칸 민 것)</text><rect x="250" y="122" width="36" height="34" rx="3" fill="#F6F7F5" stroke="#4E5964" stroke-width="1.2"/><text x="268" y="145" font-size="14" fill="#1C232C" text-anchor="middle" font-family="Consolas, D2Coding, monospace">0</text><rect x="290" y="122" width="36" height="34" rx="3" fill=