<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" font-family="IBM Plex Sans KR, Malgun Gothic, Apple SD Gothic Neo, sans-serif" role="img" aria-label="한 걸음 역전파와 시간으로 펼친 역전파"><rect x="0" y="0" width="100%" height="100%" fill="#ECEFEC"/><defs><marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2E6B8A"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#B4552B"/></marker><marker id="ai" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4E5964"/></marker><marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1E8449"/></marker><marker id="an" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C0392B"/></marker></defs><text x="20" y="28" font-size="15" fill="#1C232C" text-anchor="start" font-weight="bold">그림 2. 오차가 어디까지 거슬러 가는가 — 원문의 서술(위)과 1986 년 역전파 논문 9절의 펼치기(아래)</text><text x="30" y="58" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">원문 2 절이 적은 것: 문맥 유닛은 고정 무게 1.0 의 복사, 걸음마다 역전파로 연결을 고친다</text><rect x="150" y="130" width="90" height="30" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="195" y="150" font-size="12" fill="#1C232C" text-anchor="middle">h(t-2)</text><rect x="150" y="190" width="90" height="26" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="195" y="208" font-size="11" fill="#1C232C" text-anchor="middle">x(t-2)</text><rect x="150" y="78" width="90" height="26" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="195" y="96" font-size="11" fill="#1C232C" text-anchor="middle">y(t-2)</text><line x1="195" y1="190" x2="195" y2="162" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="195" y1="130" x2="195" y2="106" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="242" y1="145" x2="388" y2="145" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="390" y="130" width="90" height="30" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="435" y="150" font-size="12" fill="#1C232C" text-anchor="middle">h(t-1)</text><rect x="390" y="190" width="90" height="26" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="435" y="208" font-size="11" fill="#1C232C" text-anchor="middle">x(t-1)</text><rect x="390" y="78" width="90" height="26" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="435" y="96" font-size="11" fill="#1C232C" text-anchor="middle">y(t-1)</text><line x1="435" y1="190" x2="435" y2="162" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="435" y1="130" x2="435" y2="106" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="482" y1="145" x2="628" y2="145" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="630" y="130" width="90" height="30" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="675" y="150" font-size="12" fill="#1C232C" text-anchor="middle">h(t)</text><rect x="630" y="190" width="90" height="26" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="675" y="208" font-size="11" fill="#1C232C" text-anchor="middle">x(t)</text><rect x="630" y="78" width="90" height="26" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="675" y="96" font-size="11" fill="#1C232C" text-anchor="middle">y(t)</text><line x1="675" y1="190" x2="675" y2="162" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="675" y1="130" x2="675" y2="106" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><path d="M690,100 C730,120 730,130 692,140" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#an)"/><line x1="510" y1="166" x2="530" y2="186" stroke="#C0392B" stroke-width="2.2"/><line x1="510" y1="186" x2="530" y2="166" stroke="#C0392B" stroke-width="2.2"/><text x="780" y="144" font-size="11" fill="#C0392B" text-anchor="start">c(t) 를 입력처럼 두면</text><text x="780" y="162" font-size="11" fill="#C0392B" text-anchor="start">오차는 이 걸음 안에서 멈춘다</text><text x="30" y="258" font-size="12" fill="#1C232C" text-anchor="start" font-weight="bold">역전파 논문(1986) 9 절: 되먹임 망을 시간으로 펼쳐 층처럼 다룬다</text><rect x="150" y="330" width="90" height="30" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="195" y="350" font-size="12" fill="#1C232C" text-anchor="middle">h(t-2)</text><rect x="150" y="390" width="90" height="26" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="195" y="408" font-size="11" fill="#1C232C" text-anchor="middle">x(t-2)</text><rect x="150" y="278" width="90" height="26" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="195" y="296" font-size="11" fill="#1C232C" text-anchor="middle">y(t-2)</text><line x1="195" y1="390" x2="195" y2="362" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="195" y1="330" x2="195" y2="306" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="242" y1="345" x2="388" y2="345" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="390" y="330" width="90" height="30" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="435" y="350" font-size="12" fill="#1C232C" text-anchor="middle">h(t-1)</text><rect x="390" y="390" width="90" height="26" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="435" y="408" font-size="11" fill="#1C232C" text-anchor="middle">x(t-1)</text><rect x="390" y="278" width="90" height="26" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="435" y="296" font-size="11" fill="#1C232C" text-anchor="middle">y(t-1)</text><line x1="435" y1="390" x2="435" y2="362" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="435" y1="330" x2="435" y2="306" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="482" y1="345" x2="628" y2="345" stroke="#B4552B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#ar)"/><rect x="630" y="330" width="90" height="30" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="675" y="350" font-size="12" fill="#1C232C" text-anchor="middle">h(t)</text><rect x="630" y="390" width="90" height="26" rx="6" fill="#F6F7F5" stroke="#1C232C" stroke-width="1.2"/><text x="675" y="408" font-size="11" fill="#1C232C" text-anchor="middle">x(t)</text><rect x="630" y="278" width="90" height="26" rx="6" fill="#D8E7EE" stroke="#2E6B8A" stroke-width="1.2"/><text x="675" y="296" font-size="11" fill="#1C232C" text-anchor="middle">y(t)</text><line x1="675" y1="390" x2="675" y2="362" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><line x1="675" y1="330" x2="675" y2="306" stroke="#2E6B8A" stroke-width="1.3" marker-end="url(#af)"/><path d="M690,300 C730,320 730,330 692,340" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#an)"/><path d="M628,352 C570,374 540,374 482,354" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#an)"/><path d="M388,352 C330,374 300,374 242,354" fill="none" stroke="#C0392B" stroke-width="2" marker-end="url(#an)"/><text x="780" y="344" font-size="11" fill="#C0392B" text-anchor="start">h(t-1), h(t-2) 까지 기울기가 간다</text><text x="780" y="362" font-size="11" fill="#4E5964" text-anchor="start">펼친 층마다 저장 · 무게 묶기</text><text x="20" y="468" font-size="11" fill="#4E5964" text-anchor="start">위 그림은 내 해석이다. 원문은 오차를 앞 시간 걸음으로 넘기는지 넘기지 않는지 적지 않는다. 문맥을 입력 쪽에 덧붙인 유닛으로 두고</text><text x="20" y="486" font-size="11" fill="#4E5964" text-anchor="start">역전파(Rumelhart 외 1986)를 인용한 서술은 한 걸음 안의 역전파로 읽힌다. 204 쪽의 「오차를 늦게 넣으면 성능이 나빴다」 와도 맞는다.</text></svg>
